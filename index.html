Among them: parenthesis (iʿtirāḍ), which is a word coming in the middle, between the parts of one sentence, or between two sentences connected in meaning, for a purpose; e.g.: “Indeed the eighty [years] — and may you be made to reach them — have made my hearing need an interpreter.” And e.g. the words of Allah Most High: ﴿And they ascribe daughters to Allah — glory be to Him! — and for themselves what they desire﴾ [al-Naḥl 16:57].<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Parenthesis<\/b> (<i>iʿtirāḍ<\/i>): a word or phrase dropped into the middle of a sentence, or between two linked sentences, for a purpose.<p>In the line, ‎<span class=\"arin\">وَبُلِّغْتَهَا<\/span>‎ (\"and may you reach them too\") is a prayer for the listener inside the sentence \"the eighty years have made my hearing need an interpreter\". In the verse, ‎<span class=\"arin\">سُبْحَانَهُ<\/span>‎ is inserted to declare Allah free of what they ascribe to Him, the moment their claim is mentioned.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 126<\/span><\/div><div class=\"ar\">ومنها: الإيغال: وهو ختم الكلام بما يفيد غرضاً يتمّ المعنى بدونه، كالمبالَغة في قول الخنساء:<span class=\"bayt\"><span class=\"h1\">وَإِنَّ صَخْراً لَتَأْتَمُّ الْهُدَاةُ بِهِ<\/span><span class=\"h2\">كَأَنَّهُ عَلَمٌ فِيْ رَأْسِهِ نَارٌ<\/span><\/span><\/div><div class=\"tr\">Among them: īghāl, which is closing the speech with something that conveys a purpose without which the meaning is complete; such as hyperbole (mubālagha) in the words of al-Khansāʾ: “And indeed Ṣakhr — the guides take him as their leader, as though he were a mountain-peak on whose head is a fire.”<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Īghāl:<\/b> ending with something extra after the meaning is already complete. Al-Khansāʾ says her brother Ṣakhr is like a mountain-peak that guides follow; that alone completes the meaning. Then she adds \"with a fire on its head\": a lit beacon on a mountain is seen from even further. The addition makes the praise greater.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 126–127<\/span><\/div><div class=\"ar\">ومنها: التذييل: وهو تعقيب الجملة بأخرى تشتمل على معناها تأكيداً لَها، وهو إمّا أن يكون جارياً مجرى الْمَثَل؛ لاستقلال معناه واستغنائه عمّا قبله، كقوله تعالى: ﴿جَاء الْحَقُّ وَزَهَقَ الْبَاطِلُ إِنَّ الْبَاطِلَ كَانَ زَهُوقاً﴾ [بني إسرائيل: ٨١].<\/div><div class=\"tr\">Among them: tadhyīl (appending), which is following a sentence with another that contains its meaning, as an emphasis of it. It is either running like a proverb (mathal), because its meaning is independent and does not need what came before it, as in the words of Allah Most High: ﴿Truth has come and falsehood has vanished; indeed falsehood is ever bound to vanish﴾ [Banī Isrāʾīl 17:81].<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Tadhyīl:<\/b> following a sentence with another that contains its meaning, to confirm it. It has two kinds.<b>Like a proverb<\/b>: the second sentence stands on its own. ‎<span class=\"arin\">إِنَّ الْبَاطِلَ كَانَ زَهُوقاً<\/span>‎ makes complete sense by itself and could be quoted on any occasion.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 127<\/span><\/div><div class=\"ar\">وإمّا أن يكون غير جارٍ مجرى المثل؛ لعدَم استغنائه عمّا قبله، كقوله تعالى: ﴿ذَلِكَ جَزَيْنَاهُم بِمَا كَفَرُوا وَهَلْ نُجَازِي إِلاَّ الْكَفُورَ﴾ [سبأ: ١٧].<\/div><div class=\"tr\">Or it is not running like a proverb, because it does not dispense with what came before it, as in the words of Allah Most High: ﴿That is how We requited them for their ingratitude; and do We requite any but the ungrateful?﴾ [Sabaʾ 34:17].<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Not like a proverb<\/b>: the second sentence depends on the first. ‎<span class=\"arin\">وَهَلْ نُجَازِي إِلاَّ الْكَفُورَ<\/span>‎ refers back to the particular punishment just described, so it cannot stand alone.<\/div><div class=\"chartbox\"><div class=\"chh\">TWO KINDS OF TADHYĪL · DRAWN BY THE COMPANION<\/div><table class=\"grid\"><thead><tr><th><\/th><th>Like a proverb<\/th><th>Not like a proverb<\/th><\/tr><\/thead><tbody><tr><td>Does it stand alone?<\/td><td>Yes<\/td><td>No; it needs what came before<\/td><\/tr><tr><td>Book's example<\/td><td>‎<span class=\"arin\">إِنَّ الْبَاطِلَ كَانَ زَهُوقاً<\/span>‎<\/td><td>‎<span class=\"arin\">وَهَلْ نُجَازِي إِلاَّ الْكَفُورَ<\/span>‎<\/td><\/tr><\/tbody><\/table><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 128<\/span><\/div><div class=\"ar\">ومنها: الاحتراس، وهو أن يؤتى في كلام يوهم خلافَ المقصود بِما يدفعه نحو:<span class=\"bayt\"><span class=\"h1\">فَسَقَى دِيَارَكَ غَيْرَ مُفْسِدِهَا<\/span><span class=\"h2\">صَوْبُ الرَبِيْعِ وَدِيْمَةٌ تَهْمِيْ<\/span><\/span><\/div><div class=\"tr\">Among them: iḥtirās (guarding), which is bringing, in speech that gives an impression contrary to what is intended, something that wards it off; e.g.: “May your dwellings be watered — not ruining them — by the downpour of spring and a steady rain that pours.”<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Iḥtirās<\/b> (guarding): adding something to prevent a wrong impression. Praying \"may rain fall on your home\" could suggest flooding and ruin. So the poet adds ‎<span class=\"arin\">غَيْرَ مُفْسِدِهَا<\/span>‎, \"without ruining it\", to guard against that meaning.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 128<\/span><\/div><div class=\"ar\">ومنها: التكميل، وهو أن يؤتى بفَضلة تزيد المعنى حُسناً، نحو: ﴿وَيُطْعِمُونَ الطَّعَامَ عَلَى حُبِّهِ﴾ [الإنسان: ٨]، أي: مع حبّه، وذلك أبلغ في الكرَم.<\/div><div class=\"tr\">Among them: takmīl (completing), which is bringing a complement (faḍla) that increases the meaning in beauty; e.g. ﴿And they give food, despite their love for it﴾ [al-Insān 76:8], i.e. together with loving it; and that is more eloquent in [expressing] generosity.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Takmīl<\/b> (completing): an extra word that makes the meaning finer. \"They give food\" is praise; ‎<span class=\"arin\">عَلَى حُبِّهِ<\/span>‎, \"despite loving it\", makes it far greater: they give away what they themselves want.<\/div><div class=\"chartbox\"><div class=\"chh\">THE FORMS OF IṬNĀB · DRAWN BY THE COMPANION<\/div><table class=\"grid\"><thead><tr><th>Form<\/th><th>Book's example<\/th><\/tr><\/thead><tbody><tr><td>The particular after the general<\/td><td>‎<span class=\"arin\">اجتهدوا في دروسكم واللغة العربيّة<\/span>‎<\/td><\/tr><tr><td>The general after the particular<\/td><td>‎<span class=\"arin\">وَلِلْمُؤْمِنِينَ وَالْمُؤْمِنَاتِ<\/span>‎<\/td><\/tr><tr><td>Clarifying after vagueness ‎<span class=\"arin\">الإيضاح بعد الإبْهام<\/span>‎<\/td><td>‎<span class=\"arin\">أَمَدَّكُم بِأَنْعَامٍ وَبَنِينَ<\/span>‎<\/td><\/tr><tr><td>Tawshīʿ ‎<span class=\"arin\">التوشيع<\/span>‎<\/td><td>‎<span class=\"arin\">الْمُشْفِقَانِ الأَهْلُ وَالوَلَدُ<\/span>‎<\/td><\/tr><tr><td>Repetition ‎<span class=\"arin\">التكرير<\/span>‎<\/td><td>‎<span class=\"arin\">كَلاَّ سَوْفَ تَعْلَمُونَ<\/span>‎<\/td><\/tr><tr><td>Parenthesis ‎<span class=\"arin\">الاعتراض<\/span>‎<\/td><td>‎<span class=\"arin\">وَبُلِّغْتَهَا<\/span>‎، ‎<span class=\"arin\">سُبْحَانَهُ<\/span>‎<\/td><\/tr><tr><td>Īghāl ‎<span class=\"arin\">الإيغال<\/span>‎<\/td><td>‎<span class=\"arin\">فِيْ رَأْسِهِ نَارٌ<\/span>‎<\/td><\/tr><tr><td>Tadhyīl ‎<span class=\"arin\">التذييل<\/span>‎<\/td><td>‎<span class=\"arin\">إِنَّ الْبَاطِلَ كَانَ زَهُوقاً<\/span>‎<\/td><\/tr><tr><td>Iḥtirās ‎<span class=\"arin\">الاحتراس<\/span>‎<\/td><td>‎<span class=\"arin\">غَيْرَ مُفْسِدِهَا<\/span>‎<\/td><\/tr><tr><td>Takmīl ‎<span class=\"arin\">التكميل<\/span>‎<\/td><td>‎<span class=\"arin\">عَلَى حُبِّهِ<\/span>‎<\/td><\/tr><\/tbody><\/table><\/div><div class=\"cnote\"><span class=\"cnh\">COMPANION&#8217;S NOTE · NOT IN THE BOOK<\/span><b>Possible misprints in the matn (reproduced above exactly as printed):<\/b> p. 120: «امراء القيس», where the usual spelling is «امرئ القيس». p. 123: «بإثنين» with a hamza under the alif, where the usual spelling is «باثنين» (hamzat al-waṣl). p. 122: «منها: الإيضاح بعد الإبْهام», although every other item in this list begins «ومنها». p. 122: «مغائر لِما قبله», where the usual spelling is «مغاير».<\/div><div class=\"box\"><div class=\"bh\">KEY TERMS AND THEIR MEANINGS · ADDED BY THE COMPANION<\/div><table class=\"terms\"><tr><td class=\"t\">Musāwāt<\/td><td>Equality: conveying the intended meaning in an expression equal to it, at the limit of the custom of the middling people<\/td><td class=\"a\">المساواة<\/td><\/tr><tr><td class=\"t\">Ījāz<\/td><td>Brevity: conveying the meaning in an expression that falls short of it while fully meeting the purpose<\/td><td class=\"a\">الإيجاز<\/td><\/tr><tr><td class=\"t\">Iṭnāb<\/td><td>Expansion: conveying the meaning in an expression exceeding it, with benefit<\/td><td class=\"a\">الإطناب<\/td><\/tr><tr><td class=\"t\">Ikhlāl<\/td><td>Deficiency: shortened expression that does not meet the purpose<\/td><td class=\"a\">الإخلال<\/td><\/tr><tr><td class=\"t\">Taṭwīl<\/td><td>Prolixity: addition without benefit, where the added part is not specified<\/td><td class=\"a\">التطويل<\/td><\/tr><tr><td class=\"t\">Ḥashw<\/td><td>Padding: addition without benefit, where the added part is specified<\/td><td class=\"a\">الحشو<\/td><\/tr><tr><td class=\"t\">Fahāha<\/td><td>Inarticulacy: inability and incapacity in speech<\/td><td class=\"a\">الفهاهة<\/td><\/tr><tr><td class=\"t\">Ījāz qiṣar<\/td><td>Brevity of shortness: a short expression containing many meanings, with nothing omitted<\/td><td class=\"a\">إيجاز قصر<\/td><\/tr><tr><td class=\"t\">Ījāz ḥadhf<\/td><td>Brevity of omission: omitting a word, a sentence or more, with a qarīna that specifies it<\/td><td class=\"a\">إيجاز حذف<\/td><\/tr><tr><td class=\"t\">Tawshīʿ<\/td><td>Bringing at the end of speech a dual explained by two things<\/td><td class=\"a\">التوشيع<\/td><\/tr><tr><td class=\"t\">Iʿtirāḍ<\/td><td>Parenthesis: a word in the middle of one sentence, or between two sentences connected in meaning, for a purpose<\/td><td class=\"a\">الاعتراض<\/td><\/tr><tr><td class=\"t\">Īghāl<\/td><td>Closing speech with something that conveys a purpose without which the meaning is complete<\/td><td class=\"a\">الإيغال<\/td><\/tr><tr><td class=\"t\">Tadhyīl<\/td><td>Following a sentence with another containing its meaning, as emphasis<\/td><td class=\"a\">التذييل<\/td><\/tr><tr><td class=\"t\">Iḥtirās<\/td><td>Guarding: adding to speech that gives a wrong impression something that wards it off<\/td><td class=\"a\">الاحتراس<\/td><\/tr><tr><td class=\"t\">Takmīl<\/td><td>Adding a complement (faḍla) that increases the meaning in beauty<\/td><td class=\"a\">التكميل<\/td><\/tr><\/table><\/div><h3>QUESTIONS AND ANSWERS<span class=\"ar\">أسئلة وأجوبة<\/span><\/h3><div class=\"qabox\"><div class=\"qh\">QUESTIONS AND ANSWERS · ADDED BY THE COMPANION<\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>Define <i>musāwāt<\/i>, <i>ījāz<\/i> and <i>iṭnāb<\/i>.<\/div><div class=\"a\"><span class=\"k\">A.<\/span><i>Musāwāt<\/i>: conveying the meaning in words equal to it, as ordinary people speak. <i>Ījāz<\/i>: in fewer words that still fully meet the purpose. <i>Iṭnāb<\/i>: in more words, with a benefit.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>What is <i>ikhlāl<\/i>? Explain the book's example.<\/div><div class=\"a\"><span class=\"k\">A.<\/span>Brevity that does not meet the purpose. The poet meant a comfortable life in foolishness is better than a hard life in intelligence, but his words leave out what is needed to reach that meaning.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>What is the difference between <i>taṭwīl<\/i> and <i>ḥashw<\/i>?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>Both are additions without benefit; in <i>taṭwīl<\/i> the extra word cannot be pointed to (‎<span class=\"arin\">كِذْباً وَمَيْناً<\/span>‎), in <i>ḥashw<\/i> it can (‎<span class=\"arin\">قَبْلَهُ<\/span>‎).<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>Give three motives for <i>ījāz<\/i> and three for <i>iṭnāb<\/i>.<\/div><div class=\"a\"><span class=\"k\">A.<\/span><i>Ījāz<\/i>: ease of memorising, ease of understanding, a pressing situation (also hiding, and weariness). <i>Iṭnāb<\/i>: fixing the meaning, clarifying it, emphasis (also preventing a wrong impression).<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>Why is ‎<span class=\"arin\">وَلَكُمْ فِي الْقِصَاصِ حَيَاةٌ<\/span>‎ an example of <i>ījāz qiṣar<\/i>?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>In a few words it contains many meanings: retaliation deters killing and so preserves life; and nothing is omitted.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>What is omitted in ‎<span class=\"arin\">وَإِن يُكَذِّبُوكَ فَقَدْ كُذِّبَتْ رُسُلٌ مِّن قَبْلِكَ<\/span>‎?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>The answer of the condition, a whole sentence: \"then take comfort and be patient\".<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>What is the benefit of mentioning the particular after the general?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>Drawing attention to the excellence of the particular, as if it were a different kind from the rest.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>Give the three purposes of repetition in the book.<\/div><div class=\"a\"><span class=\"k\">A.<\/span>A long gap, increasing the encouragement to forgive, and strengthening a warning.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>What is the <i>iʿtirāḍ<\/i> in ‎<span class=\"arin\">وَيَجْعَلُونَ لِلّهِ الْبَنَاتِ سُبْحَانَهُ وَلَهُم مَّا يَشْتَهُونَ<\/span>‎?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>‎<span class=\"arin\">سُبْحَانَهُ<\/span>‎, inserted to declare Allah free of what they ascribe to Him.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>What do ‎<span class=\"arin\">غَيْرَ مُفْسِدِهَا<\/span>‎ and ‎<span class=\"arin\">عَلَى حُبِّهِ<\/span>‎ illustrate?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>The first is <i>iḥtirās<\/i> (guarding against a wrong impression); the second is <i>takmīl<\/i> (adding beauty to the meaning).<\/div><\/div><\/div>", "terms": [{"t": "Musāwāt", "m": "Equality: conveying the intended meaning in an expression equal to it, at the limit of the custom of the middling people", "a": "المساواة"}, {"t": "Ījāz", "m": "Brevity: conveying the meaning in an expression that falls short of it while fully meeting the purpose", "a": "الإيجاز"}, {"t": "Iṭnāb", "m": "Expansion: conveying the meaning in an expression exceeding it, with benefit", "a": "الإطناب"}, {"t": "Ikhlāl", "m": "Deficiency: shortened expression that does not meet the purpose", "a": "الإخلال"}, {"t": "Taṭwīl", "m": "Prolixity: addition without benefit, where the added part is not specified", "a": "التطويل"}, {"t": "Ḥashw", "m": "Padding: addition without benefit, where the added part is specified", "a": "الحشو"}, {"t": "Fahāha", "m": "Inarticulacy: inability and incapacity in speech", "a": "الفهاهة"}, {"t": "Ījāz qiṣar", "m": "Brevity of shortness: a short expression containing many meanings, with nothing omitted", "a": "إيجاز قصر"}, {"t": "Ījāz ḥadhf", "m": "Brevity of omission: omitting a word, a sentence or more, with a qarīna that specifies it", "a": "إيجاز حذف"}, {"t": "Tawshīʿ", "m": "Bringing at the end of speech a dual explained by two things", "a": "التوشيع"}, {"t": "Iʿtirāḍ", "m": "Parenthesis: a word in the middle of one sentence, or between two sentences connected in meaning, for a purpose", "a": "الاعتراض"}, {"t": "Īghāl", "m": "Closing speech with something that conveys a purpose without which the meaning is complete", "a": "الإيغال"}, {"t": "Tadhyīl", "m": "Following a sentence with another containing its meaning, as emphasis", "a": "التذييل"}, {"t": "Iḥtirās", "m": "Guarding: adding to speech that gives a wrong impression something that wards it off", "a": "الاحتراس"}, {"t": "Takmīl", "m": "Adding a complement (faḍla) that increases the meaning in beauty", "a": "التكميل"}], "part": null}, {"num": 11, "title": "Speech Contrary to What the Apparent Situation Requires", "ar": "الخاتمة في إخراج الكلام على خلاف مقتضى الظاهر", "body": "<h3>THE CONCLUSION<span class=\"ar\">الخاتمة<\/span><\/h3><h3>ON BRINGING SPEECH OUT CONTRARY TO THE APPARENT REQUIREMENT<span class=\"ar\">(في إخراج الكلام على خلاف مقتضى الظاهر)<\/span><\/h3><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 129<\/span><\/div><div class=\"ar\">إيراد الكلام على حسب ما تقدّم من القواعد يسمّى «إخراجَ الكلام على مقتضى الظاهر»، وقد تقتضي الأحوال العدولَ عن مقتضى الظاهر، ويورد الكلام على خلافه في أنواع مخصوصة:<\/div><div class=\"tr\">Presenting speech in accordance with the rules that have gone before is called «bringing speech out according to the apparent requirement» (ikhrāj al-kalām ʿalā muqtaḍā al-ẓāhir). But circumstances sometimes require turning away from the apparent requirement, and speech is then presented contrary to it, in specific kinds:<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>All the rules of the last eight chapters tell you what the <b>apparent<\/b> situation requires: emphasis for a denier, a pronoun for someone already mentioned, a past verb for the past, and so on. Following them is called \"bringing speech out according to the apparent requirement\".<\/p><p>This conclusion shows the opposite: cases where a skilful speaker <b>deliberately breaks<\/b> those rules, because a deeper look at the situation calls for it. This is not a mistake; it is one of the finest parts of <i>balāghah<\/i>.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 129–130<\/span><\/div><div class=\"ar\">منها: تنزيل العالِم بفائدة الخبر أو لازمها منزلةَ الجاهل بها؛ لعدَم جرْيِه على موجَب علمه، فيلقى إليه الخبر كما يلقى إلى الجاهل، كقولك لِمَن يؤذي أباه: «هذا أبوك».<\/div><div class=\"tr\">Among them: treating one who knows the benefit of the report (fāʾidat al-khabar), or its concomitant (lāzim al-fāʾida), as one who is ignorant of it, because he does not act according to what his knowledge requires. The report is then delivered to him as it is delivered to one who does not know, as when you say to someone who harms his father: «This is your father.»<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Treating someone who knows as if he did not know.<\/b> A son who harms his father knows perfectly well that he is his father; telling him so gives him no new information. But because he <b>acts<\/b> as if he did not know, he is spoken to as if he were ignorant: \"This is your father!\" The statement is really a rebuke.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 130<\/span><\/div><div class=\"ar\">ومنها: تنزيل غير المنكِر منزلةَ المنكِر، إذا لاح عليه شيء من علامات الإنكار، فيؤكّد له، نحو:<span class=\"bayt\"><span class=\"h1\">جَاءَ شَقِيْقٌ عَارِضاً رُمْحَهُ<\/span><span class=\"h2\">إنَّ بَنِيْ عَمِّكَ فِيْهِمْ رِمَاحُ<\/span><\/span><\/div><div class=\"tr\">Among them: treating one who does not deny as one who denies, when some sign of denial appears on him; so the statement is made emphatic for him, as in:<br><i>Shaqīq came laying his spear crosswise; / truly, among your cousins there are spears.<\/i><\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Treating someone who does not deny as a denier.<\/b> Shaqīq comes carrying his spear crosswise, a show of arrogance, as if no one in the other tribe could fight him. He has not said anything denying it, but his behaviour looks like denial. So the poet speaks to him as to a denier, with ‎<span class=\"arin\">إنَّ<\/span>‎: \"<i>Indeed<\/i>, your cousins have spears too.\"<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 131<\/span><\/div><div class=\"ar\">وكقولك للسائل المستبعد حصولَ الفرج: «إنّ الفرج لقريب».<\/div><div class=\"tr\">And like your saying to the questioner who thinks relief unlikely to come: «Truly, relief is near.»<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>Likewise, someone who thinks relief is too far away is behaving like a denier, so he is answered with emphasis: ‎<span class=\"arin\">إنّ الفرج لقريب<\/span>‎, with ‎<span class=\"arin\">إنّ<\/span>‎ and the <i>lām<\/i>.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 131<\/span><\/div><div class=\"ar\">وتنزيلُ المنكِر أو الشاكّ منزلةَ الخالي، إذا كان معه من الشواهد ما إذا تأمّله زال إنكارُه أوشكُّه، كقولك لِمَن ينكر منفعة الطبّ أو يشكّ فيها: «الطبّ نافع».<\/div><div class=\"tr\">And treating the denier or the doubter as one whose mind is empty (khālī al-dhihn), when he has with him evidence such that, if he reflected on it, his denial or his doubt would disappear; as when you say to one who denies that medicine is beneficial, or doubts it: «Medicine is beneficial.»<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Treating a denier or doubter as if his mind were empty.<\/b> Someone who denies medicine is useful would normally need emphasis. But if the evidence is all around him, so that a moment's thought would remove his denial, you speak plainly with no emphasis: ‎<span class=\"arin\">الطبّ نافع<\/span>‎. In effect you say: this is too obvious to need emphasis.<\/div><div class=\"chartbox\"><div class=\"chh\">TREATING ONE LISTENER AS ANOTHER · DRAWN BY THE COMPANION<\/div><table class=\"grid\"><thead><tr><th>The listener really is…<\/th><th>Treated as…<\/th><th>Because…<\/th><th>Book's example<\/th><\/tr><\/thead><tbody><tr><td>one who knows<\/td><td>one who does not know<\/td><td>he does not act on his knowledge<\/td><td>‎<span class=\"arin\">هذا أبوك<\/span>‎<\/td><\/tr><tr><td>not a denier<\/td><td>a denier<\/td><td>signs of denial appear on him<\/td><td>‎<span class=\"arin\">إنَّ بَنِيْ عَمِّكَ فِيْهِمْ رِمَاحُ<\/span>‎<\/td><\/tr><tr><td>a denier or doubter<\/td><td>an empty mind<\/td><td>the evidence is plain if he reflects<\/td><td>‎<span class=\"arin\">الطبّ نافع<\/span>‎<\/td><\/tr><\/tbody><\/table><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 131–132<\/span><\/div><div class=\"ar\">ومنها: وضع الماضي موضِع المضارع لغرض، كالتنبيه على تحقّق الحصول، نحو: ﴿أَتَى أَمْرُ الله فَلاَ تَسْتَعْجِلُوهُ﴾ [النحل: ١]، أو التفاؤل، نحو: «إن شفاك الله اليوم تذهب معي غداً».<\/div><div class=\"tr\">Among them: putting the past tense in the place of the present-future (muḍāriʿ) for a purpose, such as drawing attention to the certainty of its occurrence, as in: <i>“The command of Allāh has come, so do not seek to hasten it”<\/i> [al-Naḥl 16:1]; or optimism (tafāʾul), as in: «If Allāh has healed you today, you will go with me tomorrow.»<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>A past verb for the future.<\/b> ‎<span class=\"arin\">أَتَى أَمْرُ الله<\/span>‎, \"the command of Allah <i>has come<\/i>\", speaks of something still to come in the past tense, to show it is so certain it is as good as done. The context makes it clear it is future: \"so do not seek to hasten it\".<p>Or for <b>hope<\/b>: \"If Allah <i>has healed<\/i> you today…\" speaks of the healing as already done, as a good omen.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 132<\/span><\/div><div class=\"ar\">وعكسه، أي: وضع المضارع موضع الماضي لغرض، كاستحضار الصورة الغريبة في الخيال، كقوله تعالى: ﴿وَاللَّهُ الَّذِي أَرْسَلَ الرِّيَاحَ فَتُثِيرُ سَحَاباً﴾ [فاطر: ٩]، أي: فأثارت، وإفادةِ الاستمرار في الأوقات الماضية، نحو ﴿لَوْ يُطِيعُكُمْ فِي كَثِيرٍ مِّنَ الأَمْرِ لَعَنِتُّمْ﴾ [الحجرات: ٧]، أي: لو استمرّ على إطاعتكم.<\/div><div class=\"tr\">And its reverse, that is, putting the muḍāriʿ in the place of the past for a purpose: such as calling up a strange picture in the imagination, as in His saying (Exalted is He): <i>“And Allāh is the One who sent the winds, and they stir up clouds”<\/i> [Fāṭir 35:9], that is, “and they stirred up”; and conveying continuance in past times, as in <i>“If he were to obey you in much of the matter, you would surely suffer hardship”<\/i> [al-Ḥujurāt 49:7], that is, if he continued to obey you.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>A muḍāriʿ for the past.<\/b> In ‎<span class=\"arin\">أَرْسَلَ الرِّيَاحَ فَتُثِيرُ سَحَاباً<\/span>‎ the sending is past (‎<span class=\"arin\">أَرْسَلَ<\/span>‎), but ‎<span class=\"arin\">فَتُثِيرُ<\/span>‎ is <i>muḍāriʿ<\/i>. The present tense brings the wonderful scene before your eyes, as if you were watching the winds stir up the clouds now.<p>Or to show something <b>kept happening<\/b> in the past: ‎<span class=\"arin\">لَوْ يُطِيعُكُمْ<\/span>‎ means \"if he had <i>kept on<\/i> obeying you\".<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 133<\/span><\/div><div class=\"ar\">ومنها: وضع الخبر موضع الإنشاء لغرض، كـ«التفاؤل»، نحو: «هداك الله لصالِح الأعمال»، وإظهارِ الرغبة، نحو: «رزقني الله لقاءك»، والاحترازِ عن صورة الأمر تأدّباً، كقولك: «ينظر مولاي في أمري».<\/div><div class=\"tr\">Among them: putting the informative (khabar) in the place of the performative (inshāʾ) for a purpose: such as «optimism», as in «Allāh has guided you to righteous deeds»; showing eagerness, as in «Allāh has granted me meeting you»; and avoiding the form of a command out of courtesy, as when you say: «My master looks into my affair.»<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>A statement in place of a request.<\/b> ‎<span class=\"arin\">هداك الله لصالِح الأعمال<\/span>‎ looks like a statement (\"Allah <i>has guided<\/i> you\") but is really a prayer (\"may Allah guide you\"). Putting it in the past is a good omen, as if the prayer were already answered.<p>\"Allah <i>has granted<\/i> me meeting you\" shows how much the speaker <b>longs<\/b> for it. And a servant who says \"My master <i>looks<\/i> into my affair\" avoids the form of a command out of <b>courtesy<\/b>: he would not say \"Look into my affair!\" to his master.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 133–134<\/span><\/div><div class=\"ar\">وعكسه، أي: وضع الإنشاء موضع الخبر لغرض، كإظهار العناية بالشيء، نحو: ﴿قُلْ أَمَرَ رَبِّي بِالْقِسْطِ وَأَقِيمُواْ وُجُوهَكُمْ عِندَ كُلِّ مَسْجِدٍ﴾ [الأعراف: ٢٩]. لَم يقل: «وإقامةِ وجوهِكم»؛ عنايةً بأمر الصلاة، والتحاشيْ عن مُوازاة اللاحق بالسابق، نحو: ﴿قَالَ إِنِّي أُشْهِدُ اللّهَ وَاشْهَدُواْ أَنِّي بَرِيءٌ مِّمَّا تُشْرِكُونَ﴾ [هود: ٥٤]. لَم يقل: «وأُشهِدكم»، تحاشياً عن مُوازاة شهادتِهم بشهادة الله، والتسويةِ، نحو: ﴿أَنفِقُواْ طَوْعاً أَوْ كَرْهاً لَّن يُتَقَبَّلَ مِنكُمْ﴾ [التوبة: ٥٣].<\/div><div class=\"tr\">And its reverse, that is, putting the performative in the place of the informative for a purpose: such as showing special concern for a thing, as in: <i>“Say: My Lord has commanded justice; and set your faces [to Him] at every place of prostration”<\/i> [al-Aʿrāf 7:29]. He did not say «and the setting of your faces», out of concern for the matter of the prayer. And keeping clear of placing what comes later on a level with what came before, as in: <i>“He said: I call Allāh to witness, and you bear witness, that I am free of what you associate”<\/i> [Hūd 11:54]. He did not say «and I call you to witness», keeping clear of placing their witness on a level with the witness of Allāh. And equating (taswiya), as in: <i>“Spend willingly or unwillingly; it will never be accepted from you”<\/i> [al-Tawba 9:53].<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>A request in place of a statement<\/b>, the reverse. Three purposes:<b>Showing special concern<\/b>: in ‎<span class=\"arin\">أَمَرَ رَبِّي بِالْقِسْطِ وَأَقِيمُواْ وُجُوهَكُمْ<\/span>‎ we would expect \"and [has commanded] the setting of your faces\", parallel to ‎<span class=\"arin\">بِالْقِسْطِ<\/span>‎. Instead, a direct command ‎<span class=\"arin\">أَقِيمُواْ<\/span>‎ is used, giving prayer extra weight.<b>Avoiding putting two things on the same level<\/b>: Hūd (peace be upon him) says ‎<span class=\"arin\">أُشْهِدُ اللّهَ<\/span>‎ (a statement), then ‎<span class=\"arin\">وَاشْهَدُواْ<\/span>‎ (a command), not \"and I call you to witness\". Using the same form for both would place their witness level with the witness of Allah.<b>Making equal<\/b>: ‎<span class=\"arin\">أَنفِقُواْ طَوْعاً أَوْ كَرْهاً<\/span>‎ is a command in form but means a statement: whether you spend willingly or unwillingly, it will not be accepted.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 134–135<\/span><\/div><div class=\"ar\">ومنها: الإضمار في مقام الإظهار لغرض، كادّعاء أنّ مرجع الضمير دائم الحضور في الذهن، كقول الشاعر:<span class=\"bayt\"><span class=\"h1\">أَبَتِ الوِصَالَ مَخَافَةَ الرُقَبَاءِ<\/span><span class=\"h2\">وَأَتَتْكَ تَحْتَ مَدارِعِ الظَلْمَا<\/span><\/span>الفاعل ضمير لَم يتقدّم له مرجع، فمقتضى الظاهر الإظهارُ، وتمكينِ ما بعد الضمير في نفس السامع لتشوّقه إليه أوّلاً، نحو:<br>«هي النفس ما حملتها تحتمل»&#8195;﴿هُوَ اللَّهُ أَحَدٌ﴾ «نِعْم تلميذ المؤدّب».<\/div><div class=\"tr\">Among them: using a pronoun in a place that calls for an explicit noun, for a purpose: such as claiming that what the pronoun refers to is always present in the mind, as in the poet’s saying:<br><i>She refused union for fear of the watchers, / and came to you beneath the cloaks of darkness.<\/i><br>The subject is a pronoun with no antecedent before it, so the apparent requirement was an explicit noun. And such as fixing what comes after the pronoun firmly in the hearer’s soul, because he has first been made eager for it, as in:<br>«It is the soul: whatever you load on it, it bears»; <i>“He is Allāh, One”<\/i> [al-Ikhlāṣ 112:1]; «Excellent is the pupil of the teacher.»<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>A pronoun where a noun is expected.<\/b> Normally a pronoun needs something mentioned before it. Breaking this rule can serve two purposes:<b>Suggesting she is always in mind.<\/b> The poet begins ‎<span class=\"arin\">أَبَتِ<\/span>‎, \"<i>she<\/i> refused\", without ever naming her, as if she were so constantly in his and the listener's thoughts that a name is unnecessary.<b>Making the listener eager, so that what follows sinks in.<\/b> A pronoun with nothing before it makes the listener wonder \"who? what?\", so that when the answer comes it is fixed firmly in his mind. ‎<span class=\"arin\">هي النفس<\/span>‎، ‎<span class=\"arin\">هُوَ اللَّهُ أَحَدٌ<\/span>‎, and the hidden pronoun in ‎<span class=\"arin\">نِعْم<\/span>‎, explained only by the words after it, all work this way.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 135<\/span><\/div><div class=\"ar\">وعكسه، أي: الإظهار في مقام الإضمار لغرض، كتقوية داعي الامتثال، كقولك لعبدك: «سيّدك يأمرك بكذا».<\/div><div class=\"tr\">And its reverse, that is, using an explicit noun in a place that calls for a pronoun, for a purpose: such as strengthening the motive to comply, as when you say to your slave: «Your master commands you to do such-and-such.»<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>A noun where a pronoun is expected<\/b>, the reverse. A master would naturally say \"I command you\". Saying instead \"<i>Your master<\/i> commands you\" reminds the servant of who is speaking, and so strengthens his motive to obey.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 136<\/span><\/div><div class=\"ar\">ومنها: الالتفات: وهو نقل الكلام من حالة التكلّم أو الخطاب أو الغيبة إلى حالة أخرى من ذلك، فالنقل من التكلّم إلى الخطاب، نحو: ﴿وَمَا لِي لاَ أَعْبُدُ الَّذِي فَطَرَنِي وَإِلَيْهِ تُرْجَعُونَ﴾ [يس: ٢٢]. أي: أرجع، ومن التكلّم إلى الغيبة، نحو: ﴿إِنَّا أَعْطَيْنَاكَ الْكَوْثَرَ o فَصَلِّ لِرَبِّكَ﴾ [الكوثر: ١-٢]، ومن الخطاب إلى التكلّم، كقول الشاعر:<span class=\"bayt\"><span class=\"h1\">أَتَطْلُبُ وَصْلَ رَبَّاتِ الْجَمَالِ<\/span><span class=\"h2\">وَقَدْ سَقَطَ الْمَشِيْبُ عَلَى قَذَالِيْ<\/span><\/span><\/div><div class=\"tr\">Among them: <b>iltifāt<\/b> (turning). It is moving speech from the state of the first person (takallum), or of address (khiṭāb), or of absence (ghayba, the third person), to another of these states. So moving from the first person to address is as in: <i>“And why should I not worship the One who created me, and to whom you will be returned?”<\/i> [Yā Sīn 36:22], that is, “I will be returned”. From the first person to the third person, as in: <i>“Indeed We have given you al-Kawthar; so pray to your Lord”<\/i> [al-Kawthar 108:1–2]. And from address to the first person, as in the poet’s saying:<br><i>Do you seek union with the ladies of beauty, / when grey hair has already fallen on the back of my head?<\/i><\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Iltifāt<\/b> (turning): switching suddenly between first person, second person and third person. The surprise of the switch wakes the listener up and adds meaning.<b>First person → address:<\/b> ‎<span class=\"arin\">وَمَا لِي لاَ أَعْبُدُ الَّذِي فَطَرَنِي<\/span>‎ is in the first person; the natural ending would be \"and to Him <i>I<\/i> will return\", but it turns to ‎<span class=\"arin\">تُرْجَعُونَ<\/span>‎, \"<i>you<\/i> will be returned\", to warn his people directly.<b>First person → third person:<\/b> ‎<span class=\"arin\">إِنَّا أَعْطَيْنَاكَ<\/span>‎ (We) turns to ‎<span class=\"arin\">فَصَلِّ لِرَبِّكَ<\/span>‎ (your Lord), instead of \"pray to Us\".<b>Address → first person:<\/b> the poet scolds himself as \"you\" (\"do <i>you<\/i> seek…?\"), then switches to ‎<span class=\"arin\">قَذَالِيْ<\/span>‎, \"<i>my<\/i> head\".<\/div><div class=\"chartbox\"><div class=\"chh\">ILTIFĀT IN THE BOOK · DRAWN BY THE COMPANION<\/div><table class=\"grid\"><thead><tr><th>From<\/th><th>To<\/th><th>Book's example<\/th><\/tr><\/thead><tbody><tr><td>First person<\/td><td>Address<\/td><td>‎<span class=\"arin\">فَطَرَنِي<\/span>‎ → ‎<span class=\"arin\">تُرْجَعُونَ<\/span>‎<\/td><\/tr><tr><td>First person<\/td><td>Third person<\/td><td>‎<span class=\"arin\">أَعْطَيْنَاكَ<\/span>‎ → ‎<span class=\"arin\">لِرَبِّكَ<\/span>‎<\/td><\/tr><tr><td>Address<\/td><td>First person<\/td><td>‎<span class=\"arin\">أَتَطْلُبُ<\/span>‎ → ‎<span class=\"arin\">قَذَالِيْ<\/span>‎<\/td><\/tr><\/tbody><\/table><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 137<\/span><\/div><div class=\"ar\">ومنها: تجاهُل العارف: وهو سوق المعلوم مَساق غيرِه لغرض، كالتوبيخ نحو:<span class=\"bayt\"><span class=\"h1\">أَيَا شَجَرَ الْخَابُوْرِ مَالَكَ مُوْرِقاً<\/span><span class=\"h2\">كَأَنَّكَ لَمْ تَجْزَعْ عَلَى ابْنِ طَرِيْفٍ<\/span><\/span><\/div><div class=\"tr\">Among them: <b>tajāhul al-ʿārif<\/b> (the knower’s feigned ignorance). It is leading what is known along the course of what is not, for a purpose, such as rebuke, as in:<br><i>O trees of the Khābūr, why are you in leaf, / as though you did not grieve for Ibn Ṭarīf?<\/i><\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Tajāhul al-ʿārif<\/b> (the knower pretending not to know): asking about something you know as if you did not. The poet knows the trees of the Khābūr cannot grieve, but asks why they are still in leaf, as though they had not mourned Ibn Ṭarīf. The question rebukes them, and through them expresses the depth of the poet's grief.<\/div><div class=\"cnote\"><span class=\"cnh\">COMPANION&#8217;S NOTE · NOT IN THE BOOK<\/span><p>In the matn the verse is printed «مَالَكَ» as one word; the usual spelling is «مَا لَكَ». It is reproduced as printed.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 137–138<\/span><\/div><div class=\"ar\">ومنها: أسلوب الحكيم: وهو تلقّي المخاطَب بغير ما يترقّبه، أو السائل بغير ما يطلبه؛ تنبيهاً على أنّه الأولى بالقصد، فالأوّل يكون بِحمْل الكلام على خلاف مراد قائله، كقول القبعثري للحجّاج، (وقد توعّده بقوله لأحملنّك على الأدهم): «مثل الأمير يحمل على الأدهم والأشهب»، فقال له الحجّاج: «أردت الحديد»، فقال القبعثري: «لَأن يكون حديداً خيرٌ من أن يكون بليداً»، أراد الحجّاج بالأدهم القيد، وبالحديد المعدن المخصوص، وحمَلهما القبعثري على الفرس الأدهم الذي ليس بليداً.<\/div><div class=\"tr\">Among them: <b>uslūb al-ḥakīm<\/b> (the style of the wise). It is meeting the one addressed with something other than what he expects, or the questioner with something other than what he asks for, to draw attention to its being the more fitting thing to aim at. The first is by taking speech in a sense contrary to what its speaker intended, like the saying of al-Qabaʿtharī to al-Ḥajjāj (when he had threatened him by saying, “I shall surely put you on the adham”): «The like of the Amīr mounts [people] on the adham and the ashhab.» Al-Ḥajjāj said to him: «I meant iron (ḥadīd).» Al-Qabaʿtharī said: «That it be ḥadīd (sharp, spirited) is better than that it be dull.» By al-adham al-Ḥajjāj meant the fetter, and by al-ḥadīd the particular metal; al-Qabaʿtharī took them both to mean the black horse which is not dull.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Uslūb al-ḥakīm<\/b> (the style of the wise): giving the listener something other than what he expects, to show that this is what he <i>should<\/i> be thinking about. Its first form is taking the speaker's words in a <b>different sense<\/b> from the one he meant.<p>Al-Ḥajjāj threatened al-Qabaʿtharī: \"I will put you on the <i>adham<\/i>\", meaning the black iron fetter. Al-Qabaʿtharī took <i>adham<\/i> as a black <b>horse<\/b>: \"Someone like the Amīr gives black and grey horses!\" Al-Ḥajjāj said, \"I meant <i>ḥadīd<\/i>\" (iron). Al-Qabaʿtharī took <i>ḥadīd<\/i> as <b>spirited<\/b>: \"A spirited horse is better than a dull one!\" By turning the threat into a gift, he politely suggested that a gift is what a ruler should give.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 139<\/span><\/div><div class=\"ar\">والثاني: يكون بتنزيل السوال منزلة سؤال آخر، مناسب لِحالة السائل، كما في قوله تعالى: ﴿يَسْأَلُونَكَ عَنِ الأَهِلَّةِ قُلْ هِيَ مَوَاقِيتُ لِلنَّاسِ وَالْحَجِّ﴾[البقرة: ١٨٩]. سئل بعضُ صحابةِ النبِيِّ صلى الله تعالى عليه وسلم: «ما بال الْهلال يبدؤ دقيقاً، ثُمّ يتزايَد حتّى يصير بدراً، ثم يتناقَص حتّى يعود كما بدء»، فجاء الجواب عن الحكمة المترتّبة على ذلك؛ لأنّها أهمّ للسائل، فنزّل سؤالُهم عن سبب الاختلاف منزلة السؤال عن حكمته.<\/div><div class=\"tr\">The second is by treating the question as another question, one suited to the state of the questioner, as in His saying (Exalted is He): <i>“They ask you about the new moons. Say: They are times appointed for the people and for the Ḥajj”<\/i> [al-Baqara 2:189]. Some of the Companions of the Prophet (Allāh bless him and grant him peace) were asked: «Why does the new moon begin thin, then grow until it becomes a full moon, then lessen until it returns as it began?» So the answer came about the wisdom that follows from that, because it was more important for the questioner; their question about the cause of the variation was treated as a question about its wisdom.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>Its second form is answering a <b>different question<\/b> from the one asked, one that suits the questioner better. People asked why the moon starts thin, grows full, then shrinks again: a question about its <b>cause<\/b>. The answer told them its <b>purpose<\/b>: they are times for people and for Ḥajj. The purpose was more useful to them than the astronomy.<\/p><\/div><div class=\"chartbox\"><div class=\"chh\">THE TWO FORMS OF USLŪB AL-ḤAKĪM · DRAWN BY THE COMPANION<\/div><table class=\"grid\"><thead><tr><th>Form<\/th><th>Book's example<\/th><\/tr><\/thead><tbody><tr><td>Taking the words in another sense<\/td><td>al-Qabaʿtharī: ‎<span class=\"arin\">الأدهم<\/span>‎، ‎<span class=\"arin\">الحديد<\/span>‎<\/td><\/tr><tr><td>Treating the question as another question<\/td><td>‎<span class=\"arin\">يَسْأَلُونَكَ عَنِ الأَهِلَّةِ<\/span>‎<\/td><\/tr><\/tbody><\/table><\/div><div class=\"cnote\"><span class=\"cnh\">COMPANION&#8217;S NOTE · NOT IN THE BOOK<\/span><p>On p. 139 the matn prints «بتنزيل السوال», «يبدؤ» and «كما بدء». These are reproduced as printed; the likely readings are «السؤال», «يبدأ» and «بدأ».<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 140–141<\/span><\/div><div class=\"ar\">ومنها: التغليب، وهو ترجيح أحد الشيئن على الآخر في إطلاق لفظه عليه، كتغليب المذكّر على المؤنّث في قوله تعالى: ﴿وَكَانَتْ مِنَ الْقَانِتِينَ﴾ [التحريم: ١٢]، ومنه: الأبوان للأب والأمّ، وكتغليب المذكّر والأخفّ على غيرهما، نحو: «القمرين»، أي: الشمس والقمر، و«العمرين»، أي: أبي بكر وعمر. والمخاطبِ على غيرِه، نحو: ﴿لَنُخْرِجَنَّكَ يَا شُعَيْبُ وَالَّذِينَ آمَنُواْ مَعَكَ مِن قَرْيَتِنَا أَوْ لَتَعُودُنَّ فِي مِلَّتِنَا﴾ [الأعراف: ٨٨]، أُدخِل «شعيب» بحكم التغليب في «لَتَعُوْدُنَّ فِيْ ملّتنا» مع أنّه لَم يكن فيها قطّ حتّى يعود إليها.<\/div><div class=\"tr\">Among them: <b>taghlīb<\/b> (letting one prevail). It is giving one of two things preference over the other in applying its word to it: such as letting the masculine prevail over the feminine in His saying (Exalted is He): <i>“And she was of the devout (al-qānitīn)”<\/i> [al-Taḥrīm 66:12]; and of this kind is «al-abawān» for the father and the mother. And such as letting the masculine and the lighter prevail over what is other than them, as in «al-qamarān», that is, the sun and the moon, and «al-ʿumarān», that is, Abū Bakr and ʿUmar. And the one addressed over others, as in: <i>“We will surely drive you out, O Shuʿayb, and those who believe with you, from our town, or you will surely return to our religion”<\/i> [al-Aʿrāf 7:88]. «Shuʿayb» was included, by the rule of taghlīb, in «you will surely return to our religion», although he had never been in it at all, so as to return to it.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Taghlīb<\/b> (letting one prevail): using the word for one of two things to cover both.<b>Masculine over feminine:<\/b> Maryam is described as ‎<span class=\"arin\">مِنَ الْقَانِتِينَ<\/span>‎, with the masculine plural, since the devout include men and women. In the same way ‎<span class=\"arin\">الأبوان<\/span>‎ covers father and mother.<b>Masculine and lighter over the other:<\/b> ‎<span class=\"arin\">القمرين<\/span>‎ for sun and moon (the moon's name being masculine), and ‎<span class=\"arin\">العمرين<\/span>‎ for Abū Bakr and ʿUmar (ʿUmar's name being the lighter).<b>The one addressed over others:<\/b> Shuʿayb (peace be upon him) and the believers are threatened together with ‎<span class=\"arin\">لَتَعُودُنَّ<\/span>‎, \"you will return\". The believers had once been in that religion, but Shuʿayb never had; still, the one word covers him with them.<\/div><div class=\"cnote\"><span class=\"cnh\">COMPANION&#8217;S NOTE · NOT IN THE BOOK<\/span><p>In the matn on p. 140, «الشيئن» is printed as it stands; the likely reading is «الشيئين».<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 141<\/span><\/div><div class=\"ar\">وكتغليب العاقل على غيره، كقوله تعالى: ﴿الْحَمْدُ لِلّهِ رَبِّ الْعَالَمِينَ﴾ [الفاتحة: ٢].<\/div><div class=\"tr\">And such as letting the rational prevail over what is not, as in His saying (Exalted is He): <i>“All praise belongs to Allāh, Lord of the worlds (al-ʿālamīn)”<\/i> [al-Fātiḥa 1:2].<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Rational over non-rational:<\/b> ‎<span class=\"arin\">الْعَالَمِينَ<\/span>‎ has the plural ending used for rational beings, though \"the worlds\" include everything Allah created.<\/div><div class=\"chartbox\"><div class=\"chh\">THE KINDS OF DEPARTURE IN THIS CONCLUSION · DRAWN BY THE COMPANION<\/div><table class=\"grid\"><thead><tr><th>Kind<\/th><th>Book's example<\/th><\/tr><\/thead><tbody><tr><td>Treating one listener as another<\/td><td>‎<span class=\"arin\">هذا أبوك<\/span>‎<\/td><\/tr><tr><td>Past for future; muḍāriʿ for past<\/td><td>‎<span class=\"arin\">أَتَى أَمْرُ الله<\/span>‎؛ ‎<span class=\"arin\">فَتُثِيرُ<\/span>‎<\/td><\/tr><tr><td>Statement for request; request for statement<\/td><td>‎<span class=\"arin\">هداك الله<\/span>‎؛ ‎<span class=\"arin\">وَاشْهَدُواْ<\/span>‎<\/td><\/tr><tr><td>Pronoun for noun; noun for pronoun<\/td><td>‎<span class=\"arin\">هُوَ اللَّهُ أَحَدٌ<\/span>‎؛ ‎<span class=\"arin\">سيّدك يأمرك<\/span>‎<\/td><\/tr><tr><td>Iltifāt ‎<span class=\"arin\">الالتفات<\/span>‎<\/td><td>‎<span class=\"arin\">فَصَلِّ لِرَبِّكَ<\/span>‎<\/td><\/tr><tr><td>Tajāhul al-ʿārif ‎<span class=\"arin\">تجاهُل العارف<\/span>‎<\/td><td>‎<span class=\"arin\">أَيَا شَجَرَ الْخَابُوْرِ<\/span>‎<\/td><\/tr><tr><td>Uslūb al-ḥakīm ‎<span class=\"arin\">أسلوب الحكيم<\/span>‎<\/td><td>‎<span class=\"arin\">قُلْ هِيَ مَوَاقِيتُ<\/span>‎<\/td><\/tr><tr><td>Taghlīb ‎<span class=\"arin\">التغليب<\/span>‎<\/td><td>‎<span class=\"arin\">الْعَالَمِينَ<\/span>‎<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box\"><div class=\"bh\">KEY TERMS AND THEIR MEANINGS · ADDED BY THE COMPANION<\/div><table class=\"terms\"><tr><td class=\"t\">Muqtaḍā al-ẓāhir<\/td><td>The apparent requirement: what the apparent state of affairs requires<\/td><td class=\"a\">مقتضى الظاهر<\/td><\/tr><tr><td class=\"t\">Ikhrāj al-kalām ʿalā khilāf muqtaḍā al-ẓāhir<\/td><td>Bringing speech out contrary to the apparent requirement<\/td><td class=\"a\">إخراج الكلام على خلاف مقتضى الظاهر<\/td><\/tr><tr><td class=\"t\">Tanzīl<\/td><td>Treating one thing as having the standing of another<\/td><td class=\"a\">تنزيل<\/td><\/tr><tr><td class=\"t\">Khālī al-dhihn<\/td><td>One whose mind is empty (of the judgement)<\/td><td class=\"a\">الخالي<\/td><\/tr><tr><td class=\"t\">Tafāʾul<\/td><td>Optimism, hopeful anticipation<\/td><td class=\"a\">التفاؤل<\/td><\/tr><tr><td class=\"t\">Istiḥḍār al-ṣūra<\/td><td>Calling up a picture in the imagination<\/td><td class=\"a\">استحضار الصورة الغريبة في الخيال<\/td><\/tr><tr><td class=\"t\">Taswiya<\/td><td>Equating two things (e.g. by the imperative)<\/td><td class=\"a\">التسوية<\/td><\/tr><tr><td class=\"t\">Iḍmār fī maqām al-iẓhār<\/td><td>Using a pronoun where an explicit noun is called for<\/td><td class=\"a\">الإضمار في مقام الإظهار<\/td><\/tr><tr><td class=\"t\">Iẓhār fī maqām al-iḍmār<\/td><td>Using an explicit noun where a pronoun is called for<\/td><td class=\"a\">الإظهار في مقام الإضمار<\/td><\/tr><tr><td class=\"t\">Iltifāt<\/td><td>Turning speech from first person, address or third person to another of these<\/td><td class=\"a\">الالتفات<\/td><\/tr><tr><td class=\"t\">Tajāhul al-ʿārif<\/td><td>Leading the known along the course of the unknown, for a purpose<\/td><td class=\"a\">تجاهُل العارف<\/td><\/tr><tr><td class=\"t\">Uslūb al-ḥakīm<\/td><td>Meeting the addressee or questioner with other than what he expects or asks<\/td><td class=\"a\">أسلوب الحكيم<\/td><\/tr><tr><td class=\"t\">Taghlīb<\/td><td>Letting one of two things prevail, applying its word to both<\/td><td class=\"a\">التغليب<\/td><\/tr><\/table><\/div><h3>QUESTIONS AND ANSWERS<span class=\"ar\">أسئلة وأجوبة<\/span><\/h3><div class=\"qabox\"><div class=\"qh\">QUESTIONS AND ANSWERS · ADDED BY THE COMPANION<\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>What is meant by \"bringing speech out contrary to the apparent requirement\"?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>Deliberately departing from the rules that the apparent situation calls for, because a deeper consideration of the situation requires it.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>Why does one say ‎<span class=\"arin\">هذا أبوك<\/span>‎ to someone who harms his father?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>He knows it is his father, but does not act on that knowledge; so he is treated as one who does not know.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>Why is ‎<span class=\"arin\">إنَّ<\/span>‎ used in ‎<span class=\"arin\">إنَّ بَنِيْ عَمِّكَ فِيْهِمْ رِمَاحُ<\/span>‎?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>Shaqīq does not deny it in words, but his arrogant behaviour is a sign of denial, so he is treated as a denier.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>When is a denier spoken to without emphasis?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>When there is plain evidence with him that would remove his denial if he reflected, as in ‎<span class=\"arin\">الطبّ نافع<\/span>‎.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>Give two purposes of using a past verb for the future.<\/div><div class=\"a\"><span class=\"k\">A.<\/span>Showing that it will certainly happen (‎<span class=\"arin\">أَتَى أَمْرُ الله<\/span>‎) and optimism (\"If Allah has healed you today…\").<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>Why does the verse say ‎<span class=\"arin\">وَاشْهَدُواْ<\/span>‎ and not \"and I call you to witness\"?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>To avoid putting their witness on the same level as the witness of Allah.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>Define <i>iltifāt<\/i> and give one example.<\/div><div class=\"a\"><span class=\"k\">A.<\/span>Turning speech from first person, address or third person to another of them, e.g. ‎<span class=\"arin\">إِنَّا أَعْطَيْنَاكَ الْكَوْثَرَ ... فَصَلِّ لِرَبِّكَ<\/span>‎.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>What is <i>tajāhul al-ʿārif<\/i>? Explain the book's example.<\/div><div class=\"a\"><span class=\"k\">A.<\/span>Presenting what one knows as if one did not, for a purpose. The poet asks the trees why they are in leaf as if they had not grieved for Ibn Ṭarīf, as a rebuke.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>Explain how al-Qabaʿtharī used <i>uslūb al-ḥakīm<\/i>.<\/div><div class=\"a\"><span class=\"k\">A.<\/span>He took al-Ḥajjāj's \"adham\" (fetter) and \"ḥadīd\" (iron) to mean a black horse and a spirited one, turning the threat into a gift, to show what was more fitting.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>How is the question about the new moons answered, and why?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>They asked about the cause of its changes; the answer gave its purpose (times for people and Ḥajj), because that was more important for them.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>Give three examples of <i>taghlīb<\/i> from the book.<\/div><div class=\"a\"><span class=\"k\">A.<\/span>‎<span class=\"arin\">مِنَ الْقَانِتِينَ<\/span>‎ (masculine over feminine), ‎<span class=\"arin\">القمرين<\/span>‎ (sun and moon), ‎<span class=\"arin\">الْعَالَمِينَ<\/span>‎ (rational over non-rational).<\/div><\/div><\/div>", "terms": [{"t": "Muqtaḍā al-ẓāhir", "m": "The apparent requirement: what the apparent state of affairs requires", "a": "مقتضى الظاهر"}, {"t": "Ikhrāj al-kalām ʿalā khilāf muqtaḍā al-ẓāhir", "m": "Bringing speech out contrary to the apparent requirement", "a": "إخراج الكلام على خلاف مقتضى الظاهر"}, {"t": "Tanzīl", "m": "Treating one thing as having the standing of another", "a": "تنزيل"}, {"t": "Khālī al-dhihn", "m": "One whose mind is empty (of the judgement)", "a": "الخالي"}, {"t": "Tafāʾul", "m": "Optimism, hopeful anticipation", "a": "التفاؤل"}, {"t": "Istiḥḍār al-ṣūra", "m": "Calling up a picture in the imagination", "a": "استحضار الصورة الغريبة في الخيال"}, {"t": "Taswiya", "m": "Equating two things (e.g. by the imperative)", "a": "التسوية"}, {"t": "Iḍmār fī maqām al-iẓhār", "m": "Using a pronoun where an explicit noun is called for", "a": "الإضمار في مقام الإظهار"}, {"t": "Iẓhār fī maqām al-iḍmār", "m": "Using an explicit noun where a pronoun is called for", "a": "الإظهار في مقام الإضمار"}, {"t": "Iltifāt", "m": "Turning speech from first person, address or third person to another of these", "a": "الالتفات"}, {"t": "Tajāhul al-ʿārif", "m": "Leading the known along the course of the unknown, for a purpose", "a": "تجاهُل العارف"}, {"t": "Uslūb al-ḥakīm", "m": "Meeting the addressee or questioner with other than what he expects or asks", "a": "أسلوب الحكيم"}, {"t": "Taghlīb", "m": "Letting one of two things prevail, applying its word to both", "a": "التغليب"}], "part": null}, {"num": 12, "title": "Simile", "ar": "التشبيه", "body": "<h3>THE SCIENCE OF CLEAR EXPRESSION<span class=\"ar\">علم البيان<\/span><\/h3><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 142<\/span><\/div><div class=\"ar\">البيان: علم يبحث فيه عن التشبيه، والمجاز، والكناية.<\/div><div class=\"tr\">Al-Bayān (the science of clear expression): a science in which simile (tashbīh), figurative usage (majāz) and allusion (kināya) are discussed.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>This begins Part Two of the book: <b>ʿilm al-bayān<\/b>, the second science of <i>balāghah<\/i>. Where <i>ʿilm al-maʿānī<\/i> taught how to fit speech to the situation, <i>ʿilm al-bayān<\/i> studies the ways of expressing one meaning with <b>different degrees of clarity<\/b>: through a simile, a figure of speech, or an allusion.<\/p><p>The book defines it simply by its three topics, and its footnote below gives the fuller definition with an example: generosity can be expressed by a simile (\"he is like the sea\"), by a figure (\"I saw a sea giving gifts\"), or by an allusion (\"his ash-heap is large\", i.e. he feeds many guests).<\/p><\/div><div class=\"chartbox\"><div class=\"chh\">THE PLAN OF ʿILM AL-BAYĀN · DRAWN BY THE COMPANION<\/div><div class=\"tree\"><div class=\"node\">ʿIlm al-bayān<span class=\"ar\">علم البيان<\/span><\/div><div class=\"stem\"><\/div><div class=\"bar\" style=\"margin:0 16.67%\"><\/div><div class=\"row\"><div class=\"col\"><div class=\"node\">Simile<span class=\"ar\">التشبيه<\/span><\/div><div class=\"sub\">Chapter XII<\/div><\/div><div class=\"col\"><div class=\"node\">Figurative language<span class=\"ar\">المجاز<\/span><\/div><div class=\"sub\">Chapter XIII<\/div><\/div><div class=\"col\"><div class=\"node\">Allusion<span class=\"ar\">الكناية<\/span><\/div><div class=\"sub\">Chapter XIV<\/div><\/div><\/div><\/div><\/div><div class=\"bnote\"><span class=\"nh\">FOOTNOTE IN THE BOOK<\/span>‎<span class=\"arin\">وقد عرفوا البيان أيضا بأنه قواعد يعرف بها إيراد المعنى الواحد بطريق مختلفة في وضوح الدلالة عليه كالتعبير عن الكرم بعبارات التشبيه والمجاز والكناية والأقرب أن يقال: علم البيان علم يبحث فيه عن التشبيه والمجاز والكناية ثُمّ يشتغل بتفصيل هذه المباحث وقد أتبعنا ذلك تسهيلا على التلامذة. ١٢ منه.<\/span>‎ — English: They have also defined al-bayān as rules by which one knows how to present a single meaning in ways that differ in the clarity with which they indicate it, such as expressing generosity with the expressions of simile, majāz and kināya. But the nearer course is to say: the science of bayān is a science in which simile, majāz and kināya are discussed, and then to busy oneself with detailing these discussions. We have followed that to make things easy for the students. (From the author.)<\/div><h3>SIMILE<span class=\"ar\">التشبيه<\/span><\/h3><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 144<\/span><\/div><div class=\"ar\">التشبيه: إلْحاق أمْر بأمْر في وصفٍ بأداةٍ لغرضٍ، والأمر الأوّل يسمّى «المشبّهَ»، والثاني «المشبّهَ به»، والوصفُ «وجهَ الشبه»، والأداةُ «الكافُ» أو نحوُها، نحو: «العلم كالنور في الهداية»، فالعلم مشبّه، والنور مشبّه به، والهداية وجه الشبه، والكاف أداة التشبيه.<\/div><div class=\"tr\">Simile (tashbīh) is attaching one thing to another thing in a quality, by means of a particle, for a purpose. The first thing is called “the thing likened” (al-mushabbah), the second “the thing likened to” (al-mushabbah bihi), the quality “the aspect of likeness” (wajh al-shabah), and the particle is “the kāf” or the like of it. For example: «Knowledge is like light in guidance». Knowledge is the thing likened, light is the thing likened to, guidance is the aspect of likeness, and the kāf is the particle of simile.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>A <b>simile<\/b> (<i>tashbīh<\/i>) joins one thing to another because they share a quality, using a word such as \"like\", and with a purpose behind it.<\/p><p>The book's example has all the parts in view: ‎<span class=\"arin\">العلم كالنور في الهداية<\/span>‎, \"Knowledge is like light in guidance\". Knowledge is the <b>mushabbah<\/b> (the thing compared), light is the <b>mushabbah bihi<\/b> (what it is compared to), guidance is the <b>wajh al-shabah<\/b> (the shared quality), and the ‎<span class=\"arin\">ك<\/span>‎ is the <b>adāh<\/b> (the particle).<\/p><p>A useful tip: the thing compared <i>to<\/i> is normally the one in which the quality is stronger and better known. Light is the clearest example of something that guides.<\/p><\/div><div class=\"chartbox\"><div class=\"chh\">THE PARTS OF A SIMILE · DRAWN BY THE COMPANION<\/div><table class=\"grid\"><thead><tr><th>Part<\/th><th>Arabic<\/th><th>In ‎<span class=\"arin\">العلم كالنور في الهداية<\/span>‎<\/th><\/tr><\/thead><tbody><tr><td>The thing likened<\/td><td>‎<span class=\"arin\">المشبّه<\/span>‎<\/td><td>‎<span class=\"arin\">العلم<\/span>‎<\/td><\/tr><tr><td>The particle<\/td><td>‎<span class=\"arin\">الأداة<\/span>‎<\/td><td>‎<span class=\"arin\">الكاف<\/span>‎<\/td><\/tr><tr><td>The thing likened to<\/td><td>‎<span class=\"arin\">المشبّه به<\/span>‎<\/td><td>‎<span class=\"arin\">النور<\/span>‎<\/td><\/tr><tr><td>The aspect of likeness<\/td><td>‎<span class=\"arin\">وجه الشبه<\/span>‎<\/td><td>‎<span class=\"arin\">الهداية<\/span>‎<\/td><\/tr><\/tbody><\/table><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 144<\/span><\/div><div class=\"ar\">ويتعلّق بالتشبيه ثلاثة مباحث: الأوّل في أركانه، والثاني في أقسامه، والثالث في الغرض منه.<\/div><div class=\"tr\">Three discussions relate to simile: the first on its pillars, the second on its divisions, and the third on its purpose.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>The book now studies simile under three headings: its <b>pillars<\/b>, its <b>divisions<\/b>, and its <b>purposes<\/b>.<\/p><\/div><h3>THE FIRST DISCUSSION: ON THE PILLARS OF SIMILE<span class=\"ar\">المبحث الأوّل في أركان التشبيه<\/span><\/h3><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 145<\/span><\/div><div class=\"ar\">أركان التشبيه أربعة: المشبّه، والمشبّه به، ويسمّيان «طرفَي التشبيه»، ووجه الشبه، والأداة.<\/div><div class=\"tr\">The pillars of simile are four: the thing likened and the thing likened to — these two are called “the two terms of the simile” (ṭarafā al-tashbīh) — the aspect of likeness, and the particle.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>The four pillars are the four parts just seen. The thing likened and the thing likened to are together called the <b>two terms<\/b> (<i>ṭarafān<\/i>) of the simile, because they stand at either end of it.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 145–146<\/span><\/div><div class=\"ar\">والطرفان: إمّا حسّيان، نحو «الورق كالحرير في النُعومة»، وإمّا عقليّان، نحو: «الجهل كالموت»، وإمّا مختلفان، نحو: «خُلقه كالعطر».<\/div><div class=\"tr\">The two terms are either both sensory (ḥissī), as in «The leaves are like silk in softness»; or both intellectual (ʿaqlī), as in «Ignorance is like death»; or different, as in «His character is like perfume».<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>The two terms can be grasped in different ways:<\/p><b>Both sensory<\/b> (<i>ḥissī<\/i>): perceived by the five senses. Leaves and silk are both felt by touch.<b>Both intellectual<\/b> (<i>ʿaqlī<\/i>): grasped by the mind, not the senses. Ignorance and death are not things you can see or touch (death here meaning the state itself, not a body).<b>Mixed<\/b>: one sensory, one intellectual. Good character (intellectual) is likened to perfume (sensory, smelt).<p>The book's footnote below defines \"intellectual\" carefully: it includes things that do not exist at all but would be sensed if they did, such as \"the fangs of ghouls\", which the imagination has invented. Such a simile is called <i>wahmī<\/i>.<\/p><\/div><div class=\"chartbox\"><div class=\"chh\">THE TWO TERMS · DRAWN BY THE COMPANION<\/div><table class=\"grid\"><thead><tr><th>Kind<\/th><th>Book's example<\/th><\/tr><\/thead><tbody><tr><td>Both sensory ‎<span class=\"arin\">حسّيان<\/span>‎<\/td><td>‎<span class=\"arin\">الورق كالحرير في النُعومة<\/span>‎<\/td><\/tr><tr><td>Both intellectual ‎<span class=\"arin\">عقليّان<\/span>‎<\/td><td>‎<span class=\"arin\">الجهل كالموت<\/span>‎<\/td><\/tr><tr><td>Different ‎<span class=\"arin\">مختلفان<\/span>‎<\/td><td>‎<span class=\"arin\">خُلقه كالعطر<\/span>‎<\/td><\/tr><\/tbody><\/table><\/div><div class=\"bnote\"><span class=\"nh\">FOOTNOTE IN THE BOOK<\/span>‎<span class=\"arin\">والمراد بالعقلي: ما لا يكون هو ولا مادّته مدركاً بتلك الحواس ومنه ما ليس مدركاً بالحسّ لكن لو وجد في الخارج لكان مدركاً بها، نحو قوله:<\/span>‎<span class=\"bayt\"><span class=\"h1\">أيقتلني والمشرفي مضاجعي<\/span><span class=\"h2\">ومسنونة زرق كأنياب أغوال<\/span><\/span>‎<span class=\"arin\">فإنّ أنياب الأغوال لم توجد هي ولا مادّتها وإنّما الوهم اخترعها ولو وجدت لادركت بالحسّ ومثل هذا التشبيه يسمّى بـ«الوهميّ» ١٢ منه.<\/span>‎ — English: What is meant by the intellectual is that which neither itself nor its material is perceived by those senses. Of it is what is not perceived by sense, but would be perceived by them if it existed in the outside world, as in the poet’s words: “Will he kill me, when the Mashrafī sword lies beside me, and sharpened blue arrows like the fangs of ghouls?” For the fangs of ghouls do not exist, neither they nor their material; the imagination (wahm) invented them, and if they existed they would be perceived by sense. A simile like this is called “the imaginary” (al-wahmī). (From the author.)<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 147<\/span><\/div><div class=\"ar\">ووجه الشبه هو الوصف الخاصّ الذي قُصد اشتراك الطرفين فيه كـ«الهداية» في العلم والنور.<\/div><div class=\"tr\">The aspect of likeness is the particular quality in which the two terms are intended to share, like «guidance» in knowledge and light.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>The <b>aspect of likeness<\/b> is the particular quality the speaker means the two to share. Knowledge and light differ in countless ways; the simile picks out just one quality, guidance, and joins them in that.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 147–148<\/span><\/div><div class=\"ar\">وأداة التشبيه: هي اللفظ الذي يدلّ على معنى المشابَهة كـ«الكاف» و«كأنّ» وما في معناهما، والكاف يليها المشبّه به، بخلاف «كأنّ»، فيليها المشبّهُ، نحو:<span class=\"bayt\"><span class=\"h1\">كَأَنّ الثُرَيَّا رَاحَةٌ تَشْبِرُ الدُجَى<\/span><span class=\"h2\">لِتَنْظُرَ طَالَ اللَيْلُ أَمْ قَدْ تَعَرَّضَا<\/span><\/span><\/div><div class=\"tr\">The particle of simile is the word that indicates the meaning of resemblance, like «the kāf» and «ka-anna» and what has their meaning. The kāf is followed by the thing likened to, unlike «ka-anna», which is followed by the thing likened, as in: “It is as if the Pleiades were a palm measuring out the darkness by hand-spans, to see whether the night has grown long or has become wide.”<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>The <b>particle<\/b> is any word that means resemblance: ‎<span class=\"arin\">الكاف<\/span>‎, ‎<span class=\"arin\">كأنّ<\/span>‎, and words like ‎<span class=\"arin\">مثل<\/span>‎ and ‎<span class=\"arin\">شبه<\/span>‎.<\/p><p>Notice the word order: ‎<span class=\"arin\">الكاف<\/span>‎ is followed by the thing likened <i>to<\/i> (\"like <i>light<\/i>\"), while ‎<span class=\"arin\">كأنّ<\/span>‎ is followed by the thing <i>likened<\/i>. In the line, ‎<span class=\"arin\">كَأَنّ الثُرَيَّا رَاحَةٌ<\/span>‎: the Pleiades (the thing likened) come straight after ‎<span class=\"arin\">كأنّ<\/span>‎, and the open palm (the thing likened to) comes after. The poet pictures the star cluster as a hand measuring the night in hand-spans.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 148<\/span><\/div><div class=\"ar\">و«كأنّ» تفيد التشبيه إذا كان خبرها جامداً، و الشكَّ إذا كان خبرها مشتقًّا، نحو: «كأنّك فاهم».<\/div><div class=\"tr\">«Ka-anna» conveys simile when its predicate is a non-derived noun (jāmid), and doubt when its predicate is a derived noun (mushtaqq), as in «It seems you understand».<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>‎<span class=\"arin\">كأنّ<\/span>‎ does not always mean simile. If its predicate is a <b>non-derived noun<\/b> (<i>jāmid<\/i>), like ‎<span class=\"arin\">رَاحَةٌ<\/span>‎, it is a simile. If its predicate is a <b>derived word<\/b> (<i>mushtaqq<\/i>), like ‎<span class=\"arin\">فاهم<\/span>‎, it expresses <b>doubt<\/b>: ‎<span class=\"arin\">كأنّك فاهم<\/span>‎ means \"you seem to understand\" (I am not sure you do).<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 148<\/span><\/div><div class=\"ar\">وقد يُذكر فعل يُنبِئ عن التشبيه، نحو قوله تعالى: ﴿إذَا رَأَيْتَهُمْ حَسِبْتَهُمْ لُؤْلُؤاً مَّنثُوراً﴾ [الإنسان: ١٩].<\/div><div class=\"tr\">A verb may be mentioned that informs of the simile, as in His words, exalted is He: “When you see them, you would think them scattered pearls” [al-Insān 76:19].<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>A simile can also be shown by a <b>verb<\/b> instead of a particle. ‎<span class=\"arin\">حَسِبْتَهُمْ لُؤْلُؤاً مَّنثُوراً<\/span>‎: \"you would think them scattered pearls\" likens the youths of Paradise to pearls without using \"like\".<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 149<\/span><\/div><div class=\"ar\">وإذا حذفت أداة التشبيه ووجهه يسمّى «تشبيهاً بليغاً»، نحو: ﴿وَجَعَلْنَا اللَّيْلَ لِبَاساً﴾ [النبأ: ١٠]. أي: كاللباس في الستر.<\/div><div class=\"tr\">When the particle of simile and its aspect are dropped, it is called «the eloquent simile» (tashbīh balīgh), as in: “And We made the night a garment” [al-Nabaʾ 78:10]; that is, like a garment in covering.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>When <b>both<\/b> the particle and the aspect of likeness are left out, the simile is called <b>eloquent<\/b> (<i>tashbīh balīgh<\/i>). ‎<span class=\"arin\">وَجَعَلْنَا اللَّيْلَ لِبَاساً<\/span>‎: the night is not said to be <i>like<\/i> a garment; it is called a garment. Dropping \"like\" makes the two seem one, which is why it is the strongest form of simile.<\/p><\/div><h3>THE SECOND DISCUSSION: ON THE DIVISIONS OF SIMILE<span class=\"ar\">المبحث الثاني في أقسام التشبيه<\/span><\/h3><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 150<\/span><\/div><div class=\"ar\">ينقسم التشبيه باعتبار طرفيه إلى أربعة أقسام: تشبيه مفرد بمفرد، نحو: «هذا الشيء كالمسك في الرائحة»،<\/div><div class=\"tr\">Simile is divided, in respect of its two terms, into four divisions: the likening of a single thing to a single thing, as in «This thing is like musk in scent»;<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>Now the <b>divisions<\/b>. The first is by whether each term is <b>single<\/b> (<i>mufrad<\/i>) or a <b>compound picture<\/b> (<i>murakkab<\/i>) made of several things together. Four combinations result.<\/p><b>Single to single<\/b>: \"This thing is like musk in scent.\" One thing compared to one thing.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 151<\/span><\/div><div class=\"ar\">وتشبيه مركب بِمركب، بأن يكون كلّ من المشبّه والمشبّه به، هيئةً حاصلة من عِدَّة أمور، كقول بشار:<span class=\"bayt\"><span class=\"h1\">كَأَنَّ مُثَارَ النَقْعِ فَوْقَ رُؤُسِنَا<\/span><span class=\"h2\">وَأَسْيَافَنَا لَيْلٌ تَهَاوَى كَوَاكِبُهْ<\/span><\/span>فإنّه شبّه هيئةَ الغبار؛ وفيه السيوف مضطرِبةٌ، بِهيئة الليل؛ وفيه الكواكب تتساقَط في جِهات مختلفة،<\/div><div class=\"tr\">the likening of a compound to a compound, in that each of the thing likened and the thing likened to is a form arising from a number of things, as in the words of Bashshār: “It is as if the dust stirred up above our heads, with our swords, were a night whose stars are falling one after another.” For he likened the form of the dust, with the swords flashing in it, to the form of the night, with the stars falling in it in different directions;<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Compound to compound<\/b>: each side is a whole <b>scene<\/b>, and it is the scene as a whole that is compared. Bashshār does not compare dust to night and swords to stars separately; he compares the <b>whole picture<\/b> of dark dust with swords flashing through it to the <b>whole picture<\/b> of a dark night with stars falling in all directions.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 151–152<\/span><\/div><div class=\"ar\">وتشبيهُ مفرد بِمركّب، كتشبيه الشقيق بِهيئة أعلام ياقوتيّة منشورة على رماح زبرجديّة،<\/div><div class=\"tr\">the likening of a single thing to a compound, like the likening of the shaqīq (anemone) to the form of ruby flags spread out on emerald spears;<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Single to compound<\/b>: one thing likened to a whole picture. The red anemone flower on its green stem is likened to the scene of ruby flags spread on emerald spears.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 152<\/span><\/div><div class=\"ar\">وتشبيهُ مركّب بِمفرد، نحو قوله:<span class=\"bayt\"><span class=\"h1\">يَا صَاحِبَيَّ تَقَصَّيَا نَظَرَيْكُمَا<\/span><span class=\"h2\">تَرَيَا وُجُوْهَ الْأَرْضِ كَيْفَ تَصَوَّرُ<\/span><\/span><span class=\"bayt\"><span class=\"h1\">تَرَيَا نَهَاراً مُشْمِساً قدْ شَابَهُ<\/span><span class=\"h2\">زَهْرُ الرُبَا فَكَأَنَّمَا هُوَ مُقْمِرُ<\/span><\/span>فإنّه شبّه هيئة النهار الْمُشمِس الذي اختلطت به أزهارُ الرَبْوات بالليل الْمُقمِر.<\/div><div class=\"tr\">and the likening of a compound to a single thing, as in the poet’s words: “O my two companions, send your gaze as far as it will go: you will see the faces of the earth, how they appear. You will see a sunny day with which the flowers of the hills have mingled, so that it is as if it were moonlit.” For he likened the form of the sunny day with which the flowers of the hills have mingled to the moonlit night.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Compound to single<\/b>: a whole picture likened to one thing. The scene of a sunny day with bright flowers covering the hills (the flowers softening the sun's glare) is likened to a moonlit night.<\/div><div class=\"chartbox\"><div class=\"chh\">SINGLE AND COMPOUND · DRAWN BY THE COMPANION<\/div><table class=\"grid\"><thead><tr><th>Kind<\/th><th>Book's example<\/th><\/tr><\/thead><tbody><tr><td>Single → single<\/td><td>‎<span class=\"arin\">هذا الشيء كالمسك في الرائحة<\/span>‎<\/td><\/tr><tr><td>Compound → compound<\/td><td>Bashshār: dust and swords → night and falling stars<\/td><\/tr><tr><td>Single → compound<\/td><td>the anemone → ruby flags on emerald spears<\/td><\/tr><tr><td>Compound → single<\/td><td>a sunny day with flowers → a moonlit night<\/td><\/tr><\/tbody><\/table><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 152–153<\/span><\/div><div class=\"ar\">وينقسم باعتبار الطرفين أيضاً إلى ملفوف ومفروق، فالملفوف: أن يؤتى بِمشبّهتين أو أكثرَ ثُمّ بالمشبّه بِها نحو:<span class=\"bayt\"><span class=\"h1\">كَأَنَّ قُلُوْبَ الطَيْرِ رَطْباً وَيَابِساً<\/span><span class=\"h2\">لَدَى وَكْرِهَا الْعُنَّابُ وَالحَشَفُ البَالِيْ<\/span><\/span>فإنّه شبّه الرطْب الطرِيّ من قلوب الطير بالعُنّاب، واليابسَ العتيقَ منها بالتمر الرديّ.<\/div><div class=\"tr\">It is also divided, in respect of the two terms, into the “wrapped” (malfūf) and the “separated” (mafrūq). The wrapped is that two or more things likened are brought first, and then the things they are likened to, as in: “As if the hearts of the birds, fresh and dry, beside her nest, were jujube berries and old, withered bad dates.” For he likened the fresh, moist hearts of the birds to jujube berries, and the old, dry ones to bad dates.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>When a speaker makes <b>several<\/b> similes together, he can arrange them in two ways. The first is <b>wrapped<\/b> (<i>malfūf<\/i>): all the things likened first, then all the things they are likened to, in the same order.<\/p><p>In the line: \"the hearts of birds, fresh and dry\" (two things likened) … \"jujube berries and old dates\" (two things likened to). Fresh hearts match the red jujubes; dry old hearts match the withered dates.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 153<\/span><\/div><div class=\"ar\">والمفروق: أن يؤتى بِمشبّه ومشبّه به ثُمّ آخرَ وآخرَ، نحو:<span class=\"bayt\"><span class=\"h1\">اَلنَشْرُ مِسْكٌ وَالْوُجُوْهُ دَنَا<\/span><span class=\"h2\">نِيْرُ وَأَطْرَافُ الْأَكُفِّ عَنَمُ<\/span><\/span><\/div><div class=\"tr\">The separated is that a thing likened and a thing likened to are brought, then another and another, as in: “Their breath is musk, their faces are dinars, and their fingertips are ʿanam.”<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>The second is <b>separated<\/b> (<i>mafrūq<\/i>): each thing likened is followed straight away by its partner, pair after pair. Breath → musk; faces → dinars; fingertips → <i>ʿanam<\/i> (a red plant). Note these are eloquent similes, with no particle.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 154<\/span><\/div><div class=\"ar\">وإن تعدّد المشبّه دون المشبّه به، سُمّي «تشبيهَ التسوية»، نحو:<span class=\"bayt\"><span class=\"h1\">صُدْغُ الْحَبِيْبِ وَحَالِيْ<\/span><span class=\"h2\">كِلَاهُمَا كَاللَيَالِيْ<\/span><\/span><\/div><div class=\"tr\">If the thing likened is multiple but not the thing likened to, it is called «the simile of equalisation» (tashbīh al-taswiya), as in: “The beloved’s temple-lock and my state — both of them are like the nights.”<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>Two more names: if there are <b>several things likened<\/b> and only <b>one thing likened to<\/b>, it is the <b>simile of equalisation<\/b> (<i>taswiyah<\/i>). The beloved's dark lock of hair and the poet's dark state of mind are both \"like the nights\".<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 154<\/span><\/div><div class=\"ar\">وإن تعدّد المشبّه به دون المشبّه، سُمّي «تشبيهَ الجمع»، نحو:<span class=\"bayt\"><span class=\"h1\">كَأَنَّمَا يَبْسِمُ عَنْ لُؤْلُؤ<\/span><span class=\"h2\">مُنَضَّدٍ أَوْ بَرَدٍ أَوْ أَقَاحٍ<\/span><\/span><\/div><div class=\"tr\">If the thing likened to is multiple but not the thing likened, it is called «the simile of gathering» (tashbīh al-jamʿ), as in: “It is as if he smiles revealing pearls set in a row, or hail, or camomile flowers.”<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>And the reverse: <b>one thing likened<\/b> and <b>several things likened to<\/b> is the <b>simile of gathering<\/b> (<i>jamʿ<\/i>). The teeth revealed by his smile are likened to three things at once: pearls in a row, hailstones, and camomile petals.<\/p><\/div><div class=\"chartbox\"><div class=\"chh\">SEVERAL SIMILES TOGETHER · DRAWN BY THE COMPANION<\/div><table class=\"grid\"><thead><tr><th>Name<\/th><th>Arrangement<\/th><th>Book's example<\/th><\/tr><\/thead><tbody><tr><td>Malfūf ‎<span class=\"arin\">ملفوف<\/span>‎<\/td><td>all likened first, then all likened-to<\/td><td>‎<span class=\"arin\">قُلُوْبَ الطَيْرِ رَطْباً وَيَابِساً<\/span>‎<\/td><\/tr><tr><td>Mafrūq ‎<span class=\"arin\">مفروق<\/span>‎<\/td><td>pair after pair<\/td><td>‎<span class=\"arin\">اَلنَشْرُ مِسْكٌ وَالْوُجُوْهُ دَنَانِيْرُ<\/span>‎<\/td><\/tr><tr><td>Taswiyah ‎<span class=\"arin\">تشبيهَ التسوية<\/span>‎<\/td><td>several likened, one likened-to<\/td><td>‎<span class=\"arin\">صُدْغُ الْحَبِيْبِ وَحَالِيْ<\/span>‎<\/td><\/tr><tr><td>Jamʿ ‎<span class=\"arin\">تشبيهَ الجمع<\/span>‎<\/td><td>one likened, several likened-to<\/td><td>‎<span class=\"arin\">لُؤْلُؤ مُنَضَّدٍ أَوْ بَرَدٍ أَوْ أَقَاحٍ<\/span>‎<\/td><\/tr><\/tbody><\/table><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 155<\/span><\/div><div class=\"ar\">وينقسم باعتبار وجه الشبّه إلى تمثيل وغير تمثيل، فالتمثيل: ما كان وجهه منتزعاً من متعدّد، كتشبيه الثريّا بعنقود العنب المنوّر، وغير التمثيل: ما ليس كذلك، كتشبيه النجم بالدرهم.<\/div><div class=\"tr\">It is divided, in respect of the aspect of likeness, into representation (tamthīl) and non-representation. Representation is that whose aspect is extracted from several things, like likening the Pleiades to a blossoming bunch of grapes; and non-representation is what is not like that, like likening a star to a dirham.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>The next division is by the <b>aspect of likeness<\/b>. If the shared quality is drawn from <b>several things together<\/b>, the simile is a <b>tamthīl<\/b>. The Pleiades are likened to a bunch of white grape-blossoms: what they share is a whole pattern (small bright points, clustered together, in a certain shape).<\/p><p>If the shared quality is a single thing, it is not <i>tamthīl<\/i>: a star is like a dirham in one quality, its round, bright look.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 155–156<\/span><\/div><div class=\"ar\">وينقسم بهذا الاعتبار أيضاً إلى مفصّل ومجمل، فالأوّل: ما ذكر فيه وجه الشبّه، نحو:<span class=\"bayt\"><span class=\"h1\">وَثَغْرُهُ فِيْ صَفَاءٍ<\/span><span class=\"h2\">وَأَدْمُعِيْ كَاللَآلِيْ<\/span><\/span>والثاني: ما ليس كذلك، نحو: «النحو في الكلام كالملح في الطعام».<\/div><div class=\"tr\">It is also divided, in this respect, into the detailed (mufaṣṣal) and the summary (mujmal). The first is that in which t
