مير<\/span>‎: <b>magnifying<\/b> what is said about him (this garment).<\/p><p>‎<span class=\"arin\">أخذَ ما أعطيته<\/span>‎: <b>hiding<\/b> what it was from others.<\/p><p>‎<span class=\"arin\">الرجل خير من المرأة<\/span>‎: <i>al<\/i> of the <b>genus<\/b>.<\/p><p>‎<span class=\"arin\">عَالِمُ الْغَيْبِ وَالشَهَادَةِ<\/span>‎: <i>al<\/i> of <b>comprehensiveness<\/b>.<\/p><p>‎<span class=\"arin\">اليوم<\/span>‎: <i>al ʿahdiyyah<\/i> by <b>presence<\/b>.<\/p><p>‎<span class=\"arin\">ساعة ... الساعة<\/span>‎: <i>al ʿahdiyyah<\/i> by <b>prior mention<\/b>.<\/p><p>‎<span class=\"arin\">الرَسُوْلَ<\/span>‎: <i>al ʿahdiyyah<\/i> by the listener's <b>knowledge<\/b>.<\/p><p>‎<span class=\"arin\">السوق ... اللحم<\/span>‎: the kind in <b>some individual or other<\/b>.<\/p><p>‎<span class=\"arin\">زيد الشجاع<\/span>‎ (as a sentence): a predicate with <i>al<\/i> gives <b>restriction<\/b>.<\/p><p>‎<span class=\"arin\">علماء الدين<\/span>‎: annexation because <b>listing<\/b> them is impossible.<\/p><p>‎<span class=\"arin\">وزراء السلطان<\/span>‎: annexation to avoid <b>putting some before others<\/b> (and to honour them).<\/p><p>‎<span class=\"arin\">قريب اللص<\/span>‎: to <b>belittle<\/b> the annexed.<\/p><p>‎<span class=\"arin\">أخو الوزير<\/span>‎: to <b>exalt<\/b> someone else, the speaker.<\/p><p>‎<span class=\"arin\">يا بوّاب ... وياحارس<\/span>‎: the call points to the <b>reason<\/b> for the request (it is their job).<\/p><p>‎<span class=\"arin\">عبرة<\/span>‎: indefinite, most naturally for <b>exaltation<\/b> (a great outpouring of tears).<\/p><p>‎<span class=\"arin\">رَجُلٌ<\/span>‎: nothing identifies him.<\/p><p>‎<span class=\"arin\">غِشَاوَةٌ<\/span>‎: a particular, unusual <b>kind<\/b> of covering.<\/p><p>‎<span class=\"arin\">لإبلاً ... لَغنماً<\/span>‎: indefinite for <b>muchness<\/b>.<\/p><p>‎<span class=\"arin\">ما قدم من أحد<\/span>‎: indefinite after negation, <b>general<\/b>.<\/p><p>‎<span class=\"arin\">جانب ... جانب<\/span>‎: the first for <b>exaltation<\/b> (a great side for Allah), the second for <b>belittling<\/b> (a small side for play).<\/p><p>‎<span class=\"arin\">بِخَيل ... بجُود<\/span>‎: indefinite for <b>exaltation<\/b>.<\/p><p>‎<span class=\"arin\">رُسُلٌ<\/span>‎: indefinite for <b>exaltation and muchness<\/b>.<\/p><p>‎<span class=\"arin\">لَأَجْراً<\/span>‎: indefinite for <b>exaltation<\/b> (a great reward).<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 239<\/span><\/div><div class=\"ar\">(و) وكان يسألَهم بعد التشبيه عن التشبيهات الآتية:<span class=\"bayt\"><span class=\"h1\">وقد لاح في الصبح الثريّا لمن رأى<\/span><span class=\"h2\">كعنقود ملاّحيّة حين نوّرا<\/span><\/span><span class=\"bayt\"><span class=\"h1\">كأنّما النار في تلهّبها<\/span><span class=\"h2\">والفحم من فوقها يغطّيها<\/span><\/span><span class=\"bayt\"><span class=\"h1\">زنجيّة شبكت أناملها<\/span><span class=\"h2\">من فوق نارنجة لتخفيها<\/span><\/span><span class=\"bayt\"><span class=\"h1\">وكأنّ أجرام النجوم لوامعاً<\/span><span class=\"h2\">درد نثرن على بساط أزرق<\/span><\/span><span class=\"bayt\"><span class=\"h1\">عزماته مثل النجوم ثواقباً<\/span><span class=\"h2\">لو لَم يكن للثاقبات أفول<\/span><\/span><span class=\"bayt\"><span class=\"h1\">ابذل فإنّ المال شعر كلّما<\/span><span class=\"h2\">أوسعته حلقاً يزيد نباتاً<\/span><\/span><span class=\"bayt\"><span class=\"h1\">ولَمّا بدا لي منك ميل مع العدا<\/span><span class=\"h2\">علي ولَم يحدث سواك بديل<\/span><\/span><span class=\"bayt\"><span class=\"h1\">صددت كما صدّ الرمي<\/span><span class=\"h2\">تطاولت به مدّة الأيّام وهو قتيل<\/span><\/span><span class=\"bayt\"><span class=\"h1\">ربّ حيّ كميّت ليس فيه<\/span><span class=\"h2\">أمل يرتجى لنفع وضرّ<\/span><\/span>«وعظام تحت التراب وفوق الأرض منها آثار حمد وشكر»،<span class=\"bayt\"><span class=\"h1\">كأنّ انتضاء البدر من تحت غيمه<\/span><span class=\"h2\">نجاة من البأساء بعد وقوع<\/span><\/span><\/div><div class=\"tr\">(f) And he would ask them, after the simile (<i>tashbīh<\/i>), about the following similes:<br>The Pleiades appeared in the morning to whoever looked, like a cluster of white grapes when it has blossomed.<br>As if the fire in its blazing, with the coal covering it from above,<br>were a Zanj woman who has interlaced her fingers over an orange to hide it.<br>And as if the bodies of the stars, shining, were pearls (?) scattered on a blue carpet.<br>His resolves are like the piercing stars — were it not that the piercing ones set.<br>Spend, for wealth is like hair: whenever you shave it, it grows the more.<br>When there appeared to me from you an inclining with the enemies against me, though no substitute for you had arisen,<br>I turned away, as the one shot turns away, whom the length of days has drawn out while he is slain.<br>Many a living man is like a dead one, in whom there is no hope to be expected for benefit or harm.<br>«And bones beneath the dust, while above the earth are traces of them in praise and thanks»;<br>As if the full moon’s coming out from beneath its cloud were rescue from misfortune after it had befallen.<\/div><\/div><div class=\"ce ans\"><div class=\"ceh\">SUGGESTED ANSWERS · BY THE COMPANION<\/div><p>(1) The Pleiades and a bunch of white grape-blossoms: a <b>tamthīl<\/b>, the shared look drawn from several things together (the book's own example in Chapter XII); <i>mursal<\/i>, <i>mujmal<\/i>.<\/p><p>(2) The fire covered by coal is likened to a dark-skinned woman's fingers laced over an orange: <b>compound to compound<\/b>, a <i>tamthīl<\/i>.<\/p><p>(3) Shining stars on the sky are likened to pearls scattered on a blue carpet: <b>compound to compound<\/b>, a <i>tamthīl<\/i>. (‎<span class=\"arin\">درد<\/span>‎ is printed for ‎<span class=\"arin\">درر<\/span>‎, pearls.)<\/p><p>(4) His resolves are like stars in being piercing (‎<span class=\"arin\">ثواقباً<\/span>‎): the aspect is mentioned, so it is <b>mufaṣṣal<\/b>; then the second half shows his resolves are greater, since stars set and they do not.<\/p><p>(5) Wealth is likened to hair (no particle: <b>muʾakkad<\/b>): cutting it makes it grow more. The purpose is to <b>show that the claim is possible<\/b>: spending does not end wealth.<\/p><p>(6) The poet's turning away is likened to the turning away of the wounded game that lives on for a time though it is already dead: a <b>compound<\/b> picture, <i>mursal<\/i>.<\/p><p>(7) A living man with no hope of benefit or harm is likened to a dead one; the aspect is mentioned (<b>mufaṣṣal<\/b>), and the purpose is to <b>show his state<\/b>.<\/p><p>(8) The continuation reverses it: bones under the earth whose good name lives on are like the living, a simile <b>understood<\/b> rather than stated.<\/p><p>(9) The moon emerging from a cloud (sensory) is likened to escaping hardship (intellectual): <b>mixed terms<\/b>, with ‎<span class=\"arin\">كأنّ<\/span>‎.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 239–241<\/span><\/div><div class=\"ar\">(ز) وكأن يسألَهم عن المحسّنات البديعيّة فيما يأتي:<span class=\"bayt\"><span class=\"h1\">كان ما كان وزالا<\/span><span class=\"h2\">فاطرح قيلاً وقالاً<\/span><\/span><span class=\"bayt\"><span class=\"h1\">أيّها المعرض عنّا<\/span><span class=\"h2\">حسبك الله تعالى<\/span><\/span><span class=\"bayt\"><span class=\"h1\">ليت المنيّة حالت دون نصحك لي<\/span><span class=\"h2\">فيستريح كلانا من أذى التهم<\/span><\/span>«يُحْيِيْ وَيُمِيْتُ»، «أَوَ مَنْ كَانَ مَيْتاً فَأَحْيَيْنَاهُ»،<span class=\"bayt\"><span class=\"h1\">على رأس حرّ تاج عزّ يَزينه<\/span><span class=\"h2\">وفي رجل عبد قيد ذلّ يَشينه<\/span><\/span><span class=\"bayt\"><span class=\"h1\">نَهبت من الأعمار ما لو حويته<\/span><span class=\"h2\">لَهنّئت الدنيا بأنّك خالد<\/span><\/span><span class=\"bayt\"><span class=\"h1\">واستوطَنوا السرّ منّي وهو منزِلُهم<\/span><span class=\"h2\">ولا أفوه به يوماً لغيرهم<\/span><\/span><span class=\"bayt\"><span class=\"h1\">من قاس جدواك يوماً<\/span><span class=\"h2\">بالسحب أخطأ مدحك<\/span><\/span><span class=\"bayt\"><span class=\"h1\">السحب تعطي وتبكي<\/span><span class=\"h2\">وأنت تعطي وتضحك<\/span><\/span><span class=\"bayt\"><span class=\"h1\">آراؤكم ووجوهكم وسيوفكم<\/span><span class=\"h2\">في الحادثات إذا دجون نجوم<\/span><\/span><span class=\"bayt\"><span class=\"h1\">منها معالِم للهدى ومصابح<\/span><span class=\"h2\">تجلوا الدجى والأخريات رجوم<\/span><\/span><span class=\"bayt\"><span class=\"h1\">إنّما هذه الحياة متاع<\/span><span class=\"h2\">والسفيه الغبيّ مَن يصطفيها<\/span><\/span><span class=\"bayt\"><span class=\"h1\">ما مضى فات والمؤمّل غيْب<\/span><span class=\"h2\">ولك الساعة الّتي أنت فيها<\/span><\/span><span class=\"bayt\"><span class=\"h1\">وسابق أيّان وجهته<\/span><span class=\"h2\">رأيته يا صاح طوع اليد<\/span><\/span><span class=\"bayt\"><span class=\"h1\">في السبق لَمّا لَم يجد مشبهاً<\/span><span class=\"h2\">سابق أفكاري إلى المقصد<\/span><\/span><span class=\"bayt\"><span class=\"h1\">لاعيب فيهم سوى أنّ النَزيل بِهم<\/span><span class=\"h2\">يسلو عن الأهل والأوطان والحشم<\/span><\/span><span class=\"bayt\"><span class=\"h1\">عاشر الناس بالجميـ<\/span><span class=\"h2\">ـل المزاحمه<\/span><\/span><span class=\"bayt\"><span class=\"h1\">ويتّقظ وقل لمن<\/span><span class=\"h2\">يتعاطى المزاح مه<\/span><\/span><span class=\"bayt\"><span class=\"h1\">فلم تضع الأعادي قدر شأني<\/span><span class=\"h2\">ولا قالوا فلان قدر شاني<\/span><\/span>«أيّ شيء أطيب من ابتسام الثغور ودوام السرور وبكاء الغمام ونوح الحمام»، «كمالك تحت كلامك»، «يُوْلِجُ الَّيْلَ فِي النَّهَارِ وَيُوْلِجُ النَّهَارَ فِي الَّيْلِ»،<span class=\"bayt\"><span class=\"h1\">يا خاطب الدنيا الدنيّة إنّها<\/span><span class=\"h2\">شرك الردي وقرارة الأكدار<\/span><\/span><span class=\"bayt\"><span class=\"h1\">دارٌ متَى ما أضحكت في يومها<\/span><span class=\"h2\">أبكت غداً تبًّا لَها من دار<\/span><\/span><span class=\"bayt\"><span class=\"h1\">مدحت مجدك والإخلاص ملتزمي<\/span><span class=\"h2\">فيه وحسن رجائي فيك مختتمي<\/span><\/span><\/div><div class=\"tr\">(g) And, for example, he may ask them about the embellishments (<i>muḥassināt badīʿiyyah<\/i>) in what follows:<br>What was, was, and has passed away; so throw aside “it was said” and “he said”.<br>O you who turn away from us: Allah, Exalted, is enough for you.<br>Would that death had come between me and your counsel to me, so that both of us might rest from the hurt of suspicions.<br>«He gives life and causes death»; «Is one who was dead and We gave him life…»;<br>On the head of a free man a crown of honour adorns him; and on the foot of a slave a fetter of humiliation disgraces him.<br>You have plundered of lifetimes what, had you gathered it, the world would have been congratulated that you are everlasting.<br>They have made their home in my secret, and it is their dwelling; and I will never utter it one day to anyone but them.<br>Whoever one day compares your bounty with the clouds has erred in his praise of you:<br>the clouds give and weep, while you give and laugh.<br>Your opinions, your faces and your swords, in calamities when they grow dark, are stars:<br>of them are signposts for guidance, and lamps that clear away the darkness, and the others are missiles.<br>This life is only an enjoyment, and the foolish dullard is the one who chooses it.<br>What has passed is gone, and what is hoped for is unseen; yours is the hour you are in.<br>And a steed — wherever I turned it, I found it, my friend, obedient to the hand;<br>in the race, since it found nothing like it, it raced my thoughts to the goal.<br>There is no fault in them, except that the guest among them forgets family, homeland and household.<br>Associate with people with kindly jesting;<br>and be wary, and say to whoever indulges in joking: Stop!<br>The enemies did not lower the measure of my standing, nor did they say: so-and-so is of [great] standing.<br>«What is sweeter than the smiling of mouths, the lasting of joy, the weeping of clouds and the cooing of doves?»; «Your perfection is beneath your speech»; «He makes the night enter the day and makes the day enter the night»;<br>O you who court this base world: it is the snare of ruin and the abode of troubles;<br>a house that, whenever it makes one laugh in its day, makes him weep tomorrow — perish such a house!<br>I praised your glory, with sincerity binding me in it, and with good hope in you as my close.<\/div><\/div><div class=\"ce ans\"><div class=\"ceh\">SUGGESTED ANSWERS · BY THE COMPANION<\/div><p>‎<span class=\"arin\">قيلاً وقالاً<\/span>‎: <b>jinās<\/b>.<\/p><p>‎<span class=\"arin\">حسبك الله تعالى<\/span>‎: <b>tawriyah<\/b>: the near meaning is \"Exalted\" (of Allah), the far, intended meaning is \"Come (back to us)!\".<\/p><p>‎<span class=\"arin\">ليت المنيّة حالت<\/span>‎: <b>ibhām<\/b>: whose death is meant, the speaker's or the adviser's, is left open.<\/p><p>‎<span class=\"arin\">يُحْيِيْ وَيُمِيْتُ<\/span>‎ and ‎<span class=\"arin\">مَيْتاً فَأَحْيَيْنَاهُ<\/span>‎: <b>ṭibāq<\/b>.<\/p><p>‎<span class=\"arin\">على رأس حرّ تاج عزّ<\/span>‎: <b>muqābalah<\/b> (head/foot, free/slave, crown/fetter, honour/humiliation, adorns/disgraces).<\/p><p>‎<span class=\"arin\">نَهبت من الأعمار<\/span>‎: <b>istitbāʿ<\/b>: praise for his courage brings with it praise that his life is a blessing to the world.<\/p><p>‎<span class=\"arin\">واستوطَنوا السرّ<\/span>‎: <b>istikhdām<\/b>: ‎<span class=\"arin\">السرّ<\/span>‎ is first the inner heart where they live, then its pronoun means the secret he never tells.<\/p><p>‎<span class=\"arin\">السحب تعطي وتبكي وأنت تعطي وتضحك<\/span>‎: <b>tafrīq<\/b>.<\/p><p>‎<span class=\"arin\">آراؤكم ووجوهكم وسيوفكم<\/span>‎: <b>al-ṭayy wa-l-nashr<\/b> (opinions → signposts, faces → lamps, swords → missiles).<\/p><p>‎<span class=\"arin\">ما مضى فات والمؤمّل غيْب ولك الساعة<\/span>‎: <b>taqsīm<\/b> of time into past, future and present.<\/p><p>‎<span class=\"arin\">سابق أفكاري<\/span>‎: <b>ḥusn al-taʿlīl<\/b> with <b>mubālaghah<\/b>: it raced his thoughts because no horse could match it.<\/p><p>‎<span class=\"arin\">لاعيب فيهم سوى<\/span>‎: <b>confirming praise with what looks like blame<\/b> (the first form).<\/p><p>‎<span class=\"arin\">المزاحمه<\/span>‎ / ‎<span class=\"arin\">المزاح مه<\/span>‎: <b>complete jinās<\/b> between one word and two words (<i>mutashābih<\/i>).<\/p><p>‎<span class=\"arin\">قدر شأني<\/span>‎ / ‎<span class=\"arin\">قدر شاني<\/span>‎: <b>jinās<\/b>.<\/p><p>‎<span class=\"arin\">ابتسام الثغور ودوام السرور وبكاء الغمام ونوح الحمام<\/span>‎: <b>sajʿ<\/b> (and <i>ṭibāq<\/i> between smiling and weeping).<\/p><p>‎<span class=\"arin\">كمالك تحت كلامك<\/span>‎: <b>qalb<\/b>, it reads the same backwards.<\/p><p>‎<span class=\"arin\">يُوْلِجُ الَّيْلَ فِي النَّهَارِ وَيُوْلِجُ النَّهَارَ فِي الَّيْلِ<\/span>‎: <b>ʿaks<\/b>.<\/p><p>‎<span class=\"arin\">الدنيا الدنيّة<\/span>‎: <b>jinās<\/b>; ‎<span class=\"arin\">أضحكت ... أبكت<\/span>‎: <b>ṭibāq<\/b>; ‎<span class=\"arin\">دارٌ ... من دار<\/span>‎: <b>taṣdīr<\/b>.<\/p><p>‎<span class=\"arin\">مختتمي<\/span>‎: <b>barāʿat al-maqṭaʿ<\/b>, the last word signals the end.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 241<\/span><\/div><div class=\"ar\">ولا يصعب على المعلّم اقتفاء هذا المنهج والله الهادي إلى طريق النجاح.<br>تمّت<\/div><div class=\"tr\">It will not be hard for the teacher to follow this method; and Allah is the One who guides to the path of success.<br>It is complete.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>The book ends: the teacher will find it easy to follow this method. And so, with these exercises, the study of all three sciences of <i>balāghah<\/i> is complete.<\/p><\/div><div class=\"cnote\"><span class=\"cnh\">COMPANION&#8217;S NOTE · NOT IN THE BOOK<\/span><b>Possible misprints in the «Note», reproduced above as printed.<\/b> (1) p. 237: ‎<span class=\"arin\">«يتمنّي»<\/span>‎ is printed with a dotted final <i>yāʾ<\/i>; the likely reading is ‎<span class=\"arin\">«يتمنّى»<\/span>‎. (2) p. 238: in ‎<span class=\"arin\">«وَأَنْ يَقُوْلُوْا تَسْمَعُ لِقَوْلِهِمْ»<\/span>‎ the Qurʾān (al-Munāfiqūn 63:4) reads ‎<span class=\"arin\">وَإِنْ<\/span>‎; and the example ‎<span class=\"arin\">قرأنا شعر أبي الطيّب…<\/span>‎ is printed without its opening «. (3) p. 239: ‎<span class=\"arin\">«درد نثرن»<\/span>‎ — the likely reading is ‎<span class=\"arin\">«دُرَرٌ نُثِرْنَ»<\/span>‎ (scattered pearls). (4) p. 240: ‎<span class=\"arin\">«ويتّقظ»<\/span>‎ is printed so; the likely reading is ‎<span class=\"arin\">«ويتّقِ»<\/span>‎ or ‎<span class=\"arin\">«وتيقّظ»<\/span>‎.<\/div><div class=\"box\"><div class=\"bh\">KEY TERMS AND THEIR MEANINGS · ADDED BY THE COMPANION<\/div><table class=\"terms\"><tr><td class=\"t\">Sariqat al-kalām<\/td><td>Theft of speech: taking another’s meaning or wording<\/td><td class=\"a\">سرقة الكلام<\/td><\/tr><tr><td class=\"t\">Naskh / intiḥāl<\/td><td>Copying and false claiming: taking another’s meaning without changing its arrangement<\/td><td class=\"a\">نسخاً وانتحالاً<\/td><\/tr><tr><td class=\"t\">Ighārah / maskh<\/td><td>Raiding and disfiguring: taking the meaning and changing the wording<\/td><td class=\"a\">إغارة ومسخاً<\/td><\/tr><tr><td class=\"t\">Ilmām / salkh<\/td><td>Touching upon and flaying: taking the meaning alone<\/td><td class=\"a\">إلماماً وسلخاً<\/td><\/tr><tr><td class=\"t\">Iqtibās<\/td><td>Including something of the Qurʾān or Ḥadīth, not as being from it<\/td><td class=\"a\">الاقتباس<\/td><\/tr><tr><td class=\"t\">Taḍmīn / īdāʿ<\/td><td>Including part of another poem in a poem, with notice if it is not well known<\/td><td class=\"a\">التضمين / الإيداع<\/td><\/tr><tr><td class=\"t\">ʿAqd<\/td><td>Binding: putting prose into verse<\/td><td class=\"a\">العقد<\/td><\/tr><tr><td class=\"t\">Ḥall<\/td><td>Loosening: putting verse into prose<\/td><td class=\"a\">الحلّ<\/td><\/tr><tr><td class=\"t\">Talmīḥ<\/td><td>Allusion to a verse, Ḥadīth, poem, proverb or story<\/td><td class=\"a\">التلميح<\/td><\/tr><tr><td class=\"t\">Ḥusn al-ibtidāʾ<\/td><td>A fine opening<\/td><td class=\"a\">حسن الابتداء<\/td><\/tr><tr><td class=\"t\">Barāʿat al-istihlāl<\/td><td>An opening that points subtly to what is intended<\/td><td class=\"a\">براعة الاستهلال<\/td><\/tr><tr><td class=\"t\">Ḥusn al-takhalluṣ<\/td><td>A fine transition from the opening to the intended matter<\/td><td class=\"a\">حسن التخلص<\/td><\/tr><tr><td class=\"t\">Barāʿat al-ṭalab<\/td><td>Pointing to one’s request without stating it<\/td><td class=\"a\">براعة الطلب<\/td><\/tr><tr><td class=\"t\">Ḥusn al-intihāʾ<\/td><td>A fine ending<\/td><td class=\"a\">حسن الانتهاء<\/td><\/tr><tr><td class=\"t\">Barāʿat al-maqṭaʿ<\/td><td>An ending that signals the close<\/td><td class=\"a\">براعة المقطع<\/td><\/tr><\/table><\/div><h3>QUESTIONS AND ANSWERS<span class=\"ar\">أسئلة وأجوبة<\/span><\/h3><div class=\"qabox\"><div class=\"qh\">QUESTIONS AND ANSWERS · ADDED BY THE COMPANION<\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>What is the worst kind of <i>sariqah<\/i>, and what is it called?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>Taking another's words as they are and claiming them (or merely swapping in synonyms or opposites); it is called <i>naskh<\/i> and <i>intiḥāl<\/i>.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>What is the difference between <i>ighārah<\/i> and <i>ilmām<\/i>?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>In <i>ighārah<\/i> (<i>maskh<\/i>) the meaning is taken with changed wording; in <i>ilmām<\/i> (<i>salkh<\/i>) the meaning alone is taken.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>Distinguish <i>iqtibās<\/i> from <i>taḍmīn<\/i>.<\/div><div class=\"a\"><span class=\"k\">A.<\/span><i>Iqtibās<\/i> weaves in words of the Qurʾān or Ḥadīth; <i>taḍmīn<\/i> includes part of another poem, mentioning it if it is not well known.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>What are <i>ʿaqd<\/i> and <i>ḥall<\/i>?<\/div><div class=\"a\"><span class=\"k\">A.<\/span><i>ʿAqd<\/i> is putting prose into verse; <i>ḥall<\/i> is putting verse into prose.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>Explain the <i>talmīḥ<\/i> in ‎<span class=\"arin\">لَعَمْرٌو مَعَ الرَمْضَاءِ وَالنَارُ تَلْتَظَى<\/span>‎.<\/div><div class=\"a\"><span class=\"k\">A.<\/span>It points to the famous line likening one who seeks ʿAmr's help to one who escapes burning sand into fire.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>What is <i>barāʿat al-istihlāl<\/i>?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>An opening that, besides being fine, hints at the subject of the piece.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>Define <i>ḥusn al-takhalluṣ<\/i> and <i>barāʿat al-ṭalab<\/i>.<\/div><div class=\"a\"><span class=\"k\">A.<\/span><i>Ḥusn al-takhalluṣ<\/i> is moving smoothly from the opening to the real subject; <i>barāʿat al-ṭalab<\/i> is making a request by hinting, without stating it.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>What makes an ending <i>barāʿat al-maqṭaʿ<\/i>?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>Being fine in wording and meaning and also signalling that the piece has ended.<\/div><\/div><\/div>", "terms": [{"t": "Sariqat al-kalām", "m": "Theft of speech: taking another’s meaning or wording", "a": "سرقة الكلام"}, {"t": "Naskh / intiḥāl", "m": "Copying and false claiming: taking another’s meaning without changing its arrangement", "a": "نسخاً وانتحالاً"}, {"t": "Ighārah / maskh", "m": "Raiding and disfiguring: taking the meaning and changing the wording", "a": "إغارة ومسخاً"}, {"t": "Ilmām / salkh", "m": "Touching upon and flaying: taking the meaning alone", "a": "إلماماً وسلخاً"}, {"t": "Iqtibās", "m": "Including something of the Qurʾān or Ḥadīth, not as being from it", "a": "الاقتباس"}, {"t": "Taḍmīn / īdāʿ", "m": "Including part of another poem in a poem, with notice if it is not well known", "a": "التضمين / الإيداع"}, {"t": "ʿAqd", "m": "Binding: putting prose into verse", "a": "العقد"}, {"t": "Ḥall", "m": "Loosening: putting verse into prose", "a": "الحلّ"}, {"t": "Talmīḥ", "m": "Allusion to a verse, Ḥadīth, poem, proverb or story", "a": "التلميح"}, {"t": "Ḥusn al-ibtidāʾ", "m": "A fine opening", "a": "حسن الابتداء"}, {"t": "Barāʿat al-istihlāl", "m": "An opening that points subtly to what is intended", "a": "براعة الاستهلال"}, {"t": "Ḥusn al-takhalluṣ", "m": "A fine transition from the opening to the intended matter", "a": "حسن التخلص"}, {"t": "Barāʿat al-ṭalab", "m": "Pointing to one’s request without stating it", "a": "براعة الطلب"}, {"t": "Ḥusn al-intihāʾ", "m": "A fine ending", "a": "حسن الانتهاء"}, {"t": "Barāʿat al-maqṭaʿ", "m": "An ending that signals the close", "a": "براعة المقطع"}], "part": null}], "exams": "<section class=\"chapter\" id=\"exams\"><div class=\"section-title\">PRACTICE EXAMINATIONS · ADDED BY THE COMPANION<\/div><div class=\"chtitle-ar\">امتحانات تدريبيّة<\/div><p>These three papers are written by the companion; they are <em>not<\/em> part of <em>Durūs al-Balāghah<\/em>. Together they cover the whole book: Paper One the first half of <em>ʿilm al-maʿānī<\/em>, Paper Two the second half, and Paper Three <em>ʿilm al-bayān<\/em>, <em>ʿilm al-badīʿ<\/em> and the conclusion. Every example is taken from the book and the Arabic is quoted exactly as printed. Attempt each paper in exam conditions, without looking at the book, then mark your answers using the model answers that follow.<\/p><h3>PRACTICE PAPER ONE<span class=\"ar\">الامتحان الأوّل<\/span><\/h3><div class=\"instructions\"><b>Covers:<\/b> Chapters I–VI: <em>faṣāḥah<\/em> and <em>balāghah<\/em>; the start of <em>ʿilm al-maʿānī<\/em>; statement and non-statement; mention and omission; putting before and after; definite and indefinite<br><b>Time:<\/b> 2 hours &nbsp;·&nbsp; <b>Total:<\/b> 60 marks<br>Answer <em>all<\/em> questions. Where a definition is asked for, give the term as it is written in the book and explain it fully, with the book's example.<\/div><h4>SECTION A · CHOOSE THE CORRECT ANSWER (10 MARKS)<\/h4><ol class=\"exam\" start=\"1\"><li><span class=\"marks\">[1]<\/span>‎<span class=\"arin\">الهعخع<\/span>‎ is the book's example of:<span class=\"opts\">(a) <em>gharābah<\/em> &nbsp;&nbsp; (b) <em>tanāfur al-ḥurūf<\/em> &nbsp;&nbsp; (c) <em>mukhālafat al-qiyās<\/em> &nbsp;&nbsp; (d) <em>ḍaʿf al-taʾlīf<\/em><\/span><\/li><li><span class=\"marks\">[1]<\/span>‎<span class=\"arin\">مَوْدَدَةٍ<\/span>‎ is a fault because it goes against the rule of:<span class=\"opts\">(a) <i>idghām<\/i> &nbsp;&nbsp; (b) the plural of paucity &nbsp;&nbsp; (c) word order &nbsp;&nbsp; (d) the pronoun<\/span><\/li><li><span class=\"marks\">[1]<\/span>Which of these is described by <em>faṣāḥah<\/em> but never by <em>balāghah<\/em>?<span class=\"opts\">(a) speech &nbsp;&nbsp; (b) the speaker &nbsp;&nbsp; (c) the single word &nbsp;&nbsp; (d) the situation<\/span><\/li><li><span class=\"marks\">[1]<\/span>According to the book, mutual repulsion (<em>tanāfur<\/em>) is known by:<span class=\"opts\">(a) taste (<em>dhawq<\/em>) &nbsp;&nbsp; (b) <em>ṣarf<\/em> &nbsp;&nbsp; (c) <em>naḥw<\/em> &nbsp;&nbsp; (d) <em>al-bayān<\/em><\/span><\/li><li><span class=\"marks\">[1]<\/span>A statement given to a listener who denies it, with several emphasisers, is called:<span class=\"opts\">(a) <em>ibtidāʾī<\/em> &nbsp;&nbsp; (b) <em>ṭalabī<\/em> &nbsp;&nbsp; (c) <em>inkārī<\/em> &nbsp;&nbsp; (d) <em>inshāʾī<\/em><\/span><\/li><li><span class=\"marks\">[1]<\/span>The command in ‎<span class=\"arin\">﴿كُونُوا حِجَارَةً أَوْ حَدِيداً﴾<\/span>‎ has left its original meaning for:<span class=\"opts\">(a) permission &nbsp;&nbsp; (b) humiliation (<em>ihānah<\/em>) &nbsp;&nbsp; (c) giving a choice &nbsp;&nbsp; (d) honouring<\/span><\/li><li><span class=\"marks\">[1]<\/span>The question in ‎<span class=\"arin\">﴿هَلْ جَزَاءُ الإِحْسَانِ إِلاَّ الإِحْسَانُ﴾<\/span>‎ is used for:<span class=\"opts\">(a) negation (<em>nafy<\/em>) &nbsp;&nbsp; (b) command &nbsp;&nbsp; (c) wonder &nbsp;&nbsp; (d) threat<\/span><\/li><li><span class=\"marks\">[1]<\/span>In ‎<span class=\"arin\">﴿خَالِقُ كُلِّ شَيْءٍ﴾<\/span>‎ the subject is omitted to draw attention to:<span class=\"opts\">(a) the listener's dullness &nbsp;&nbsp; (b) the omitted one being specified &nbsp;&nbsp; (c) the metre &nbsp;&nbsp; (d) hiding the matter<\/span><\/li><li><span class=\"marks\">[1]<\/span>‎<span class=\"arin\">لَم يكن كلّ ذلك<\/span>‎ is an example of:<span class=\"opts\">(a) <em>ʿumūm al-salb<\/em> &nbsp;&nbsp; (b) <em>salb al-ʿumūm<\/em> &nbsp;&nbsp; (c) <em>takhṣīṣ<\/em> &nbsp;&nbsp; (d) <em>tashwīq<\/em><\/span><\/li><li><span class=\"marks\">[1]<\/span>In ‎<span class=\"arin\">﴿إِنَّ الإنسَانَ لَفِي خُسْرٍ﴾<\/span>‎ the <i>al<\/i> is:<span class=\"opts\">(a) <em>jinsiyyah<\/em> &nbsp;&nbsp; (b) <em>ʿahdiyyah<\/em> &nbsp;&nbsp; (c) <em>istighrāqiyyah<\/em> &nbsp;&nbsp; (d) for the kind in some individual<\/span><\/li><\/ol><h4>SECTION B · DEFINITIONS (20 MARKS)<\/h4><ol class=\"exam\" start=\"11\"><li><span class=\"marks\">[5]<\/span>Define the <em>faṣāḥah<\/em> of speech. Name and define its three faults, with one example of each from the book.<\/li><li><span class=\"marks\">[5]<\/span>Define the <em>balāghah<\/em> of speech. Explain <em>ḥāl<\/em> and <em>muqtaḍā<\/em> with the book's example. Why is every <em>balīgh<\/em> sentence <em>faṣīḥ<\/em>, but not the reverse?<\/li><li><span class=\"marks\">[5]<\/span>Define <em>khabar<\/em> and <em>inshāʾ<\/em>. Explain <em>fāʾidat al-khabar<\/em> and <em>lāzim al-fāʾidah<\/em> with the book's examples.<\/li><li><span class=\"marks\">[5]<\/span>Define <em>taṣawwur<\/em> and <em>taṣdīq<\/em>. Which question words serve each? Why can one not say ‎<span class=\"arin\">هل جاء صديقك أم عدوّك<\/span>‎?<\/li><\/ol><h4>SECTION C · IDENTIFY (20 MARKS · 2 EACH)<\/h4><ol class=\"exam\" start=\"15\"><li><span class=\"marks\">[2]<\/span>What is the purpose of the statement in ‎<span class=\"arin\">﴿رَبِّ إِنِّي وَهَنَ الْعَظْمُ مِنِّي﴾<\/span>‎?<\/li><li><span class=\"marks\">[2]<\/span>What does the command form mean in ‎<span class=\"arin\">﴿فَاصْبِرُوا أَوْ لاَ تَصْبِرُوا﴾<\/span>‎?<\/li><li><span class=\"marks\">[2]<\/span>What does the prohibition form mean in ‎<span class=\"arin\">يَا صُبْحُ قِفْ لاَ تَطْلُعْ<\/span>‎?<\/li><li><span class=\"marks\">[2]<\/span>Give the meaning of ‎<span class=\"arin\">أنّى<\/span>‎ in ‎<span class=\"arin\">﴿يَا مَرْيَمُ أَنَّى لَكِ هَـٰذَا﴾<\/span>‎.<\/li><li><span class=\"marks\">[2]<\/span>Why is the doer mentioned in ‎<span class=\"arin\">نعم زيد هذا أقرّ بأنّ عليه كذا<\/span>‎?<\/li><li><span class=\"marks\">[2]<\/span>What is omitted in ‎<span class=\"arin\">نجوم سماء<\/span>‎, and why?<\/li><li><span class=\"marks\">[2]<\/span>Why is ‎<span class=\"arin\">سِنَةٌ<\/span>‎ put before ‎<span class=\"arin\">نَوْمٌ<\/span>‎ in ‎<span class=\"arin\">﴿لاَ تَأخُذُهُ سِنَةٌ وَلاَ نَوْمٌ﴾<\/span>‎?<\/li><li><span class=\"marks\">[2]<\/span>What does putting first convey in ‎<span class=\"arin\">ما أنا قلت<\/span>‎?<\/li><li><span class=\"marks\">[2]<\/span>What purpose does the demonstrative serve in ‎<span class=\"arin\">﴿فَذَلِكَ الَّذِي يَدُعُّ الْيَتِيمَ﴾<\/span>‎?<\/li><li><span class=\"marks\">[2]<\/span>What does the indefinite noun convey in ‎<span class=\"arin\">لفلان مال<\/span>‎?<\/li><\/ol><h4>SECTION D · EXPLAIN (10 MARKS)<\/h4><ol class=\"exam\" start=\"25\"><li><span class=\"marks\">[5]<\/span>Explain fully how the verse ‎<span class=\"arin\">﴿وَأَنَّا لاَ نَدْرِي أَشَرٌّ أُرِيدَ بِمَن فِي الأَرْضِ أَمْ أَرَادَ بِهِمْ رَبُّهُمْ رَشَداً﴾<\/span>‎ illustrates the definition of <em>ʿilm al-maʿānī<\/em>.<\/li><li><span class=\"marks\">[5]<\/span>Explain the kinds of <i>al<\/i> given by the book, with an example of each, and what a noun with <i>al<\/i> conveys when it is a predicate.<\/li><\/ol><div style=\"break-before:page\"><\/div><h3>PRACTICE PAPER TWO<span class=\"ar\">الامتحان الثاني<\/span><\/h3><div class=\"instructions\"><b>Covers:<\/b> Chapters VII–XI: unrestricted and restricted statement; restriction; joining and separating; brevity, expansion and equality; speech contrary to the apparent situation<br><b>Time:<\/b> 2 hours &nbsp;·&nbsp; <b>Total:<\/b> 60 marks<br>Answer <em>all<\/em> questions. Where a definition is asked for, give the term as it is written in the book and explain it fully, with the book's example.<\/div><h4>SECTION A · CHOOSE THE CORRECT ANSWER (10 MARKS)<\/h4><ol class=\"exam\" start=\"1\"><li><span class=\"marks\">[1]<\/span>With which particle is there certainty that the condition will occur?<span class=\"opts\">(a) ‎<span class=\"arin\">إن<\/span>‎ &nbsp;&nbsp; (b) ‎<span class=\"arin\">إذا<\/span>‎ &nbsp;&nbsp; (c) ‎<span class=\"arin\">لو<\/span>‎ &nbsp;&nbsp; (d) ‎<span class=\"arin\">متى<\/span>‎<\/span><\/li><li><span class=\"marks\">[1]<\/span>‎<span class=\"arin\">لمّا<\/span>‎ in negation corresponds, in affirmation, to:<span class=\"opts\">(a) ‎<span class=\"arin\">لن<\/span>‎ &nbsp;&nbsp; (b) ‎<span class=\"arin\">قد<\/span>‎ &nbsp;&nbsp; (c) ‎<span class=\"arin\">لم<\/span>‎ &nbsp;&nbsp; (d) ‎<span class=\"arin\">إنّ<\/span>‎<\/span><\/li><li><span class=\"marks\">[1]<\/span>‎<span class=\"arin\">ما عليّ إلاّ قائم<\/span>‎ is restriction that is:<span class=\"opts\">(a) real (<em>ḥaqīqī<\/em>) &nbsp;&nbsp; (b) relative (<em>iḍāfī<\/em>) &nbsp;&nbsp; (c) of an attribute to the described &nbsp;&nbsp; (d) <em>qaṣr taʿyīn<\/em><\/span><\/li><li><span class=\"marks\">[1]<\/span>Restriction said to a listener who believes the reverse is:<span class=\"opts\">(a) <em>qaṣr ifrād<\/em> &nbsp;&nbsp; (b) <em>qaṣr qalb<\/em> &nbsp;&nbsp; (c) <em>qaṣr taʿyīn<\/em> &nbsp;&nbsp; (d) <em>qaṣr ḥaqīqī<\/em><\/span><\/li><li><span class=\"marks\">[1]<\/span>The book discusses <em>waṣl<\/em> only with:<span class=\"opts\">(a) ‎<span class=\"arin\">الفاء<\/span>‎ &nbsp;&nbsp; (b) ‎<span class=\"arin\">ثُمّ<\/span>‎ &nbsp;&nbsp; (c) ‎<span class=\"arin\">الواو<\/span>‎ &nbsp;&nbsp; (d) ‎<span class=\"arin\">أو<\/span>‎<\/span><\/li><li><span class=\"marks\">[1]<\/span>Between ‎<span class=\"arin\">فَمَهِّلِ الْكَافِرِينَ<\/span>‎ and ‎<span class=\"arin\">أَمْهِلْهُمْ رُوَيْداً<\/span>‎ there is:<span class=\"opts\">(a) <em>kamāl al-ittiṣāl<\/em> &nbsp;&nbsp; (b) <em>kamāl al-inqiṭāʿ<\/em> &nbsp;&nbsp; (c) <em>shibh kamāl al-ittiṣāl<\/em> &nbsp;&nbsp; (d) <em>tawassuṭ bayn al-kamālayn<\/em><\/span><\/li><li><span class=\"marks\">[1]<\/span>‎<span class=\"arin\">﴿وَلَكُمْ فِي الْقِصَاصِ حَيَاةٌ﴾<\/span>‎ is the book's example of:<span class=\"opts\">(a) <em>ījāz ḥadhf<\/em> &nbsp;&nbsp; (b) <em>ījāz qiṣar<\/em> &nbsp;&nbsp; (c) <em>musāwāt<\/em> &nbsp;&nbsp; (d) <em>iṭnāb<\/em><\/span><\/li><li><span class=\"marks\">[1]<\/span>‎<span class=\"arin\">قَبْلَهُ<\/span>‎ in ‎<span class=\"arin\">وَأَعْلَمُ عِلْمَ اليَوْمِ وَالأَمْسِ قَبْلَهُ<\/span>‎ is:<span class=\"opts\">(a) <em>taṭwīl<\/em> &nbsp;&nbsp; (b) <em>ḥashw<\/em> &nbsp;&nbsp; (c) <em>tadhyīl<\/em> &nbsp;&nbsp; (d) <em>iḥtirās<\/em><\/span><\/li><li><span class=\"marks\">[1]<\/span>‎<span class=\"arin\">غَيْرَ مُفْسِدِهَا<\/span>‎ is the book's example of:<span class=\"opts\">(a) <em>takmīl<\/em> &nbsp;&nbsp; (b) <em>īghāl<\/em> &nbsp;&nbsp; (c) <em>iḥtirās<\/em> &nbsp;&nbsp; (d) <em>iʿtirāḍ<\/em><\/span><\/li><li><span class=\"marks\">[1]<\/span>Turning from ‎<span class=\"arin\">أَعْطَيْنَاكَ<\/span>‎ to ‎<span class=\"arin\">فَصَلِّ لِرَبِّكَ<\/span>‎ is:<span class=\"opts\">(a) <em>iltifāt<\/em> &nbsp;&nbsp; (b) <em>taghlīb<\/em> &nbsp;&nbsp; (c) <em>uslūb al-ḥakīm<\/em> &nbsp;&nbsp; (d) <em>tajāhul al-ʿārif<\/em><\/span><\/li><\/ol><h4>SECTION B · DEFINITIONS (20 MARKS)<\/h4><ol class=\"exam\" start=\"11\"><li><span class=\"marks\">[5]<\/span>Define <em>qaṣr<\/em>. Explain the difference between real and relative restriction, and give the three kinds of relative restriction by the listener's belief.<\/li><li><span class=\"marks\">[5]<\/span>Define <em>waṣl<\/em> and <em>faṣl<\/em>. Give the two places where <em>waṣl<\/em> is required, with the book's examples.<\/li><li><span class=\"marks\">[5]<\/span>Define <em>musāwāt<\/em>, <em>ījāz<\/em> and <em>iṭnāb<\/em>, and the faults <em>ikhlāl<\/em>, <em>taṭwīl<\/em> and <em>ḥashw<\/em>.<\/li><li><span class=\"marks\">[5]<\/span>Define <em>iltifāt<\/em> and <em>uslūb al-ḥakīm<\/em>, with the book's examples.<\/li><\/ol><h4>SECTION C · IDENTIFY (20 MARKS · 2 EACH)<\/h4><ol class=\"exam\" start=\"15\"><li><span class=\"marks\">[2]<\/span>What is the focal point of the benefit in ‎<span class=\"arin\">﴿وَمَا خَلَقْنَا السَّمَاوَاتِ وَالأَرْضَ وَمَا بَيْنَهُمَا لاَعِبِيْنَ﴾<\/span>‎?<\/li><li><span class=\"marks\">[2]<\/span>Why can one not say ‎<span class=\"arin\">لَمَّا يقم زيد ثُمّ قام<\/span>‎?<\/li><li><span class=\"marks\">[2]<\/span>What purpose does the adjective serve in ‎<span class=\"arin\">﴿وَامْرَأَتُهُ حَمَّالَةَ الْحَطَبِ﴾<\/span>‎?<\/li><li><span class=\"marks\">[2]<\/span>Name the method of restriction in ‎<span class=\"arin\">﴿إِنْ هَذَا إِلاَّ مَلَكٌ كَرِيمٌ﴾<\/span>‎, and what the restriction falls on.<\/li><li><span class=\"marks\">[2]<\/span>Why is there no ‎<span class=\"arin\">و<\/span>‎ before ‎<span class=\"arin\">صَدَقُوْا<\/span>‎ in ‎<span class=\"arin\">زَعَمَ العَوَاذِلُ أَنَّنِيْ فِيْ غَمْرَةٍ<\/span>‎?<\/li><li><span class=\"marks\">[2]<\/span>What is omitted in ‎<span class=\"arin\">﴿فَأَرْسِلُونِ ۝ يُوسُفُ أَيُّهَا الصِّدِّيقُ﴾<\/span>‎?<\/li><li><span class=\"marks\">[2]<\/span>What kind of <em>iṭnāb<\/em> is ‎<span class=\"arin\">وَبُلِّغْتَهَا<\/span>‎ in ‎<span class=\"arin\">إنَّ الثَمَانِيْنَ وَبُلِّغْتَهَا<\/span>‎?<\/li><li><span class=\"marks\">[2]<\/span>Why is a past verb used in ‎<span class=\"arin\">﴿أَتَى أَمْرُ الله فَلاَ تَسْتَعْجِلُوهُ﴾<\/span>‎?<\/li><li><span class=\"marks\">[2]<\/span>Why is someone who does not deny addressed with ‎<span class=\"arin\">إنَّ<\/span>‎ in ‎<span class=\"arin\">إنَّ بَنِيْ عَمِّكَ فِيْهِمْ رِمَاحُ<\/span>‎?<\/li><li><span class=\"marks\">[2]<\/span>What kind of <em>taghlīb<\/em> is ‎<span class=\"arin\">الْعَالَمِينَ<\/span>‎?<\/li><\/ol><h4>SECTION D · EXPLAIN (10 MARKS)<\/h4><ol class=\"exam\" start=\"25\"><li><span class=\"marks\">[5]<\/span>Explain the use of ‎<span class=\"arin\">إذا<\/span>‎ and ‎<span class=\"arin\">إن<\/span>‎ in ‎<span class=\"arin\">﴿فَإِذَا جَاءتْهُمُ الْحَسَنَةُ قَالُوْا لَنَا هَـذِهِ وَإِن تُصِبْهُمْ سَيِّئَةٌ يَطَّيَّرُوْا بِمُوسَى وَمَن مَّعَهُ﴾<\/span>‎.<\/li><li><span class=\"marks\">[5]<\/span>Explain why ‎<span class=\"arin\">﴿اللهُ يَسْتَهْزِئُ بِهِم﴾<\/span>‎ is not joined with ‎<span class=\"arin\">و<\/span>‎, and name the relation between the sentences.<\/li><\/ol><div style=\"break-before:page\"><\/div><h3>PRACTICE PAPER THREE<span class=\"ar\">الامتحان الثالث<\/span><\/h3><div class=\"instructions\"><b>Covers:<\/b> Chapters XII–XVII: simile; figurative language; allusion; the embellishments of meaning and of wording; the conclusion<br><b>Time:<\/b> 2 hours &nbsp;·&nbsp; <b>Total:<\/b> 60 marks<br>Answer <em>all<\/em> questions. Where a definition is asked for, give the term as it is written in the book and explain it fully, with the book's example.<\/div><h4>SECTION A · CHOOSE THE CORRECT ANSWER (10 MARKS)<\/h4><ol class=\"exam\" start=\"1\"><li><span class=\"marks\">[1]<\/span>A simile whose particle and aspect of likeness are both dropped is called:<span class=\"opts\">(a) <em>mursal<\/em> &nbsp;&nbsp; (b) <em>tashbīh balīgh<\/em> &nbsp;&nbsp; (c) <em>mujmal<\/em> &nbsp;&nbsp; (d) <em>tamthīl<\/em><\/span><\/li><li><span class=\"marks\">[1]<\/span>‎<span class=\"arin\">كأنّ<\/span>‎ conveys doubt when its predicate is:<span class=\"opts\">(a) <em>jāmid<\/em> &nbsp;&nbsp; (b) <em>mushtaqq<\/em> &nbsp;&nbsp; (c) a sentence &nbsp;&nbsp; (d) a proper name<\/span><\/li><li><span class=\"marks\">[1]<\/span>A simile whose aspect is drawn from several things is:<span class=\"opts\">(a) <em>tamthīl<\/em> &nbsp;&nbsp; (b) <em>mufaṣṣal<\/em> &nbsp;&nbsp; (c) <em>muʾakkad<\/em> &nbsp;&nbsp; (d) <em>maqlūb<\/em><\/span><\/li><li><span class=\"marks\">[1]<\/span>‎<span class=\"arin\">﴿وَاخْفِضْ لَهُمَا جَنَاحَ الذُّلِّ﴾<\/span>‎ contains an <em>istiʿārah<\/em> that is:<span class=\"opts\">(a) <em>muṣarraḥah<\/em> &nbsp;&nbsp; (b) <em>makniyyah<\/em> &nbsp;&nbsp; (c) <em>tamthīliyyah<\/em> &nbsp;&nbsp; (d) <em>aṣliyyah<\/em><\/span><\/li><li><span class=\"marks\">[1]<\/span>The connection in ‎<span class=\"arin\">أمطرت السماء نَبَاتاً<\/span>‎ is:<span class=\"opts\">(a) cause &nbsp;&nbsp; (b) effect (<em>musabbabiyyah<\/em>) &nbsp;&nbsp; (c) part &nbsp;&nbsp; (d) the place<\/span><\/li><li><span class=\"marks\">[1]<\/span>‎<span class=\"arin\">نَهاره صائم<\/span>‎ attributes the verb to:<span class=\"opts\">(a) the cause &nbsp;&nbsp; (b) the place &nbsp;&nbsp; (c) the time &nbsp;&nbsp; (d) the <em>maṣdar<\/em><\/span><\/li><li><span class=\"marks\">[1]<\/span>A <em>kināyah<\/em> with many steps, like ‎<span class=\"arin\">هو كثير الرماد<\/span>‎, is called:<span class=\"opts\">(a) <em>ramz<\/em> &nbsp;&nbsp; (b) <em>talwīḥ<\/em> &nbsp;&nbsp; (c) <em>īmāʾ<\/em> &nbsp;&nbsp; (d) <em>taʿrīḍ<\/em><\/span><\/li><li><span class=\"marks\">[1]<\/span>‎<span class=\"arin\">جَرَحْتُم<\/span>‎ in ‎<span class=\"arin\">﴿وَيَعْلَمُ مَا جَرَحْتُم بِالنَّهَارِ﴾<\/span>‎ is an example of:<span class=\"opts\">(a) <em>ibhām<\/em> &nbsp;&nbsp; (b) <em>tawriyah<\/em> &nbsp;&nbsp; (c) <em>istikhdām<\/em> &nbsp;&nbsp; (d) <em>tawjīh<\/em><\/span><\/li><li><span class=\"marks\">[1]<\/span>Hyperbole possible in reason but not in practice is:<span class=\"opts\">(a) <em>tablīgh<\/em> &nbsp;&nbsp; (b) <em>ighrāq<\/em> &nbsp;&nbsp; (c) <em>ghuluww<\/em> &nbsp;&nbsp; (d) <em>mughāyarah<\/em><\/span><\/li><li><span class=\"marks\">[1]<\/span>‎<span class=\"arin\">ذَا هِبَةٍ<\/span>‎ / ‎<span class=\"arin\">ذَاهِبَةٌ<\/span>‎ is <em>jinās<\/em> that is:<span class=\"opts\">(a) <em>mutamāthil<\/em> &nbsp;&nbsp; (b) <em>mustawfā<\/em> &nbsp;&nbsp; (c) <em>mutashābih<\/em> &nbsp;&nbsp; (d) <em>mafrūq<\/em><\/span><\/li><\/ol><h4>SECTION B · DEFINITIONS (20 MARKS)<\/h4><ol class=\"exam\" start=\"11\"><li><span class=\"marks\">[5]<\/span>Define <em>tashbīh<\/em> and name its four pillars in ‎<span class=\"arin\">العلم كالنور في الهداية<\/span>‎. Give the six purposes of simile listed in the book.<\/li><li><span class=\"marks\">[5]<\/span>Define <em>majāz<\/em>. What are the <em>ʿalāqah<\/em> and the <em>qarīnah<\/em>? Distinguish <em>istiʿārah<\/em> from <em>majāz mursal<\/em>, and both from <em>majāz ʿaqlī<\/em>.<\/li><li><span class=\"marks\">[5]<\/span>Define <em>kināyah<\/em>, explain how it differs from <em>majāz<\/em>, and give its three divisions by what is pointed to.<\/li><li><span class=\"marks\">[5]<\/span>Define <em>ʿilm al-badīʿ<\/em> and <em>jinās<\/em>. When is <em>jinās<\/em> complete, and what are its four complete kinds?<\/li><\/ol><h4>SECTION C · IDENTIFY (20 MARKS · 2 EACH)<\/h4><ol class=\"exam\" start=\"15\"><li><span class=\"marks\">[2]<\/span>Is ‎<span class=\"arin\">كَأَنَّ مُثَارَ النَقْعِ فَوْقَ رُؤُسِنَا وَأَسْيَافَنَا لَيْلٌ تَهَاوَى كَوَاكِبُهْ<\/span>‎ single or compound? Explain.<\/li><li><span class=\"marks\">[2]<\/span>What is the purpose of the simile in ‎<span class=\"arin\">فَإِنَّ الْمِسْكَ بَعْضُ دَمِ الْغَزَالِ<\/span>‎?<\/li><li><span class=\"marks\">[2]<\/span>Why is ‎<span class=\"arin\">﴿فَمَا رَبِحَت تِّجَارَتُهُمْ﴾<\/span>‎ called <em>tarshīḥ<\/em>?<\/li><li><span class=\"marks\">[2]<\/span>What is the connection in ‎<span class=\"arin\">﴿وَآتُواْ الْيَتَامَى أَمْوَالَهُمْ﴾<\/span>‎?<\/li><li><span class=\"marks\">[2]<\/span>What does ‎<span class=\"arin\">مَجَامِعَ الأَضْغَانِ<\/span>‎ allude to, and which kind of <em>kināyah<\/em> is it?<\/li><li><span class=\"marks\">[2]<\/span>Name the device in ‎<span class=\"arin\">﴿فَمَن شَهِدَ مِنكُمُ الشَّهْرَ فَلْيَصُمْهُ﴾<\/span>‎.<\/li><li><span class=\"marks\">[2]<\/span>Name the device in ‎<span class=\"arin\">﴿جَعَلَ لَكُمُ اللَّيْلَ وَالنَّهَارَ لِتَسْكُنُوا فِيهِ وَلِتَبْتَغُوا مِن فَضْلِهِ﴾<\/span>‎.<\/li><li><span class=\"marks\">[2]<\/span>How does ‎<span class=\"arin\">وَلاَ عَيْبَ فِيْهِمْ غَيْرَ أَنَّ سُيُوْفَهُمْ بِهِنَّ فُلُوْلٌ مِنْ قِرَاعِ الْكَتَائِبِ<\/span>‎ confirm praise?<\/li><li><span class=\"marks\">[2]<\/span>Name the kind of <em>sajʿ<\/em> in ‎<span class=\"arin\">المرء بعلمه وأدبه لا بحسبه ونسبه<\/span>‎.<\/li><li><span class=\"marks\">[2]<\/span>What is <em>barāʿat al-istihlāl<\/em>? Give the book's first example.<\/li><\/ol><h4>SECTION D · EXPLAIN (10 MARKS)<\/h4><ol class=\"exam\" start=\"25\"><li><span class=\"marks\">[5]<\/span>Explain how an <em>istiʿārah<\/em> is a simile with parts removed, using ‎<span class=\"arin\">﴿لِتُخْرِجَ النَّاسَ مِنَ الظُّلُمَاتِ إِلَى النُّورِ﴾<\/span>‎, and name the <em>mustaʿār lahu<\/em>, <em>mustaʿār minhu<\/em> and <em>mustaʿār<\/em>.<\/li><li><span class=\"marks\">[5]<\/span>Name and explain the three kinds of <em>sariqah<\/em> in the book's conclusion, with their names.<\/li><\/ol><\/section><section class=\"chapter\" id=\"answers\"><div class=\"section-title\">MODEL ANSWERS · ADDED BY THE COMPANION<\/div><div class=\"chtitle-ar\">نماذج الأجوبة<\/div><p>Model answers are given briefly, with the chapter where each point is taught. In the exam, write the book's term and explain it fully in your own words with its example.<\/p><h3>MODEL ANSWERS · PAPER ONE<span class=\"ar\">أجوبة الامتحان الأوّل<\/span><\/h3><div class=\"answers\"><p><b>1–10.<\/b> 1 (b) · 2 (a) · 3 (c) · 4 (a) · 5 (c) · 6 (b) · 7 (a) · 8 (b) · 9 (b) · 10 (c).<\/p><p><b>11.<\/b> Its freedom from mutual repulsion of the words together, weakness of composition and complexity, together with the <em>faṣāḥah<\/em> of its words. <em>Tanāfur al-kalimāt<\/em>: heavy on the tongue when said together, e.g. ‎<span class=\"arin\">وَلَيْسَ قُرْبَ قَبْرِ حَرْبٍ قَبْرُ<\/span>‎. <em>Ḍaʿf al-taʾlīf<\/em>: against a well-known rule of grammar, e.g. ‎<span class=\"arin\">جَزَى بَنُوْهُ أَبَا الْغِيْلاَنِ<\/span>‎ (a pronoun before its referent in wording and rank). <em>Taʿqīd<\/em>: obscure in showing its meaning, either verbal (word order, e.g. al-Mutanabbī's ‎<span class=\"arin\">جَفَخَتْ<\/span>‎ line) or semantic (figures used unusually, e.g. ‎<span class=\"arin\">نشر الملك ألسنته<\/span>‎). (Ch. I)<\/p><p><b>12.<\/b> Its conformity to what the situation requires, together with its <em>faṣāḥah<\/em>. The <em>ḥāl<\/em> (also <em>maqām<\/em>) is what leads the speaker to a particular form; the <em>muqtaḍā<\/em> (also <em>al-iʿtibār al-munāsib<\/em>) is that form. Praise is a <em>ḥāl<\/em> calling for <em>iṭnāb<\/em>; the listener's intelligence is a <em>ḥāl<\/em> calling for <em>ījāz<\/em>. Since <em>faṣāḥah<\/em> is part of the definition, every <em>balīgh<\/em> sentence is <em>faṣīḥ<\/em>; but a <em>faṣīḥ<\/em> sentence may not fit its situation. (Ch. I)<\/p><p><b>13.<\/b> <em>Khabar<\/em>: speech of which it is valid to say its speaker is truthful or lying, e.g. ‎<span class=\"arin\">سافر محمّد<\/span>‎. <em>Inshāʾ<\/em>: speech of which that is not valid, e.g. ‎<span class=\"arin\">سافر يامحمّد<\/span>‎. <em>Fāʾidat al-khabar<\/em>: informing the listener of the judgement, e.g. ‎<span class=\"arin\">حضر الأمــير<\/span>‎; <em>lāzim al-fāʾidah<\/em>: showing that the speaker knows it, e.g. ‎<span class=\"arin\">أنت حضرت أمس<\/span>‎. (Ch. III)<\/p><p><b>14.<\/b> <em>Taṣawwur<\/em> is perceiving a single thing (answered by naming it, e.g. ‎<span class=\"arin\">أعليّ مسافر أم خالد؟<\/span>‎); <em>taṣdīq<\/em> is perceiving the relation (answered yes or no, e.g. ‎<span class=\"arin\">أسافر عليّ؟<\/span>‎). The hamzah serves both; ‎<span class=\"arin\">هل<\/span>‎ is for <em>taṣdīq<\/em> only; the other question words are for <em>taṣawwur<\/em>. ‎<span class=\"arin\">هل<\/span>‎ cannot take an alternative after ‎<span class=\"arin\">أم<\/span>‎, since <em>taṣdīq<\/em> has no counterpart. (Ch. III)<\/p><p><b>15–24.<\/b> 15 Showing weakness. · 16 Making equal (<em>taswiyah<\/em>). · 17 Wishing (<em>tamannī<\/em>). · 18 \"From where\". · 19 Putting it on record against the listener (<em>tasjīl<\/em>), so denial is impossible. · 20 The subject (\"they are\"), to exalt them, keeping them from the tongue. · 21 Following the order of existence. · 22 Specification: it was not <i>I<\/i> who said it. · 23 Belittling (the word for far shows his low rank). · 24 Muchness: much wealth.<\/p><p><b>25.<\/b> <em>ʿIlm al-maʿānī<\/em> studies the states of the Arabic utterance by which it fits the situation, so forms differ as situations differ. Here the two halves differ: ‎<span class=\"arin\">أُرِيدَ<\/span>‎ is passive, ‎<span class=\"arin\">أَرَادَ بِهِمْ رَبُّهُمْ<\/span>‎ active. The situation is reverence: good is attributed to Allah openly, evil is not. (Ch. II)<\/p><p><b>26.<\/b> <em>Jinsiyyah<\/em>: the kind itself, ‎<span class=\"arin\">الإنسان حيوان ناطق<\/span>‎. <em>ʿAhdiyyah<\/em>: a known individual, known by prior mention (‎<span class=\"arin\">الرَّسُولَ<\/span>‎ after ‎<span class=\"arin\">رَسُولاً<\/span>‎), by presence (‎<span class=\"arin\">الْيَوْمَ<\/span>‎), or by the listener's knowledge (‎<span class=\"arin\">الشَّجَرَةِ<\/span>‎). <em>Istighrāqiyyah<\/em>: every individual, ‎<span class=\"arin\">إِنَّ الإنسَانَ لَفِي خُسْرٍ<\/span>‎. And the kind in some individual or other, ‎<span class=\"arin\">وَلَقَدْ أَمُرُّ عَلَى اللَئِيْمِ<\/span>‎. As a predicate it gives restriction: ‎<span class=\"arin\">وَهُوَ الْغَفُورُ الْوَدُودُ<\/span>‎. (Ch. VI)<\/p><\/div><h3>MODEL ANSWERS · PAPER TWO<span class=\"ar\">أجوبة الامتحان الثاني<\/span><\/h3><div class=\"answers\"><p><b>1–10.<\/b> 1 (b) · 2 (b) · 3 (b) · 4 (b) · 5 (c) · 6 (a) · 7 (b) · 8 (b) · 9 (c) · 10 (a).<\/p><p><b>11.<\/b> Specifying one thing to another by a particular method. Real restriction holds in reality against everything (‎<span class=\"arin\">لا كاتب في المدينة إلاَّ عليّ<\/span>‎ when there is no other scribe); relative restriction holds only in relation to one thing (‎<span class=\"arin\">ما عليّ إلاّ قائم<\/span>‎: standing, not sitting). By the listener's belief: <em>ifrād<\/em> when he thinks two share it, <em>qalb<\/em> when he thinks the reverse, <em>taʿyīn<\/em> when he thinks it is one of two without knowing which. (Ch. VIII)<\/p><p><b>12.<\/b> <em>Waṣl<\/em> is joining one sentence to another (here with ‎<span class=\"arin\">و<\/span>‎); <em>faṣl<\/em> is leaving it out. <em>Waṣl<\/em> is required (1) when both are <em>khabar<\/em> or both <em>inshāʾ<\/em>, with a uniting aspect and nothing preventing, e.g. ‎<span class=\"arin\">﴿إِنَّ الأَبْرَارَ لَفِي نَعِيْمٍ ○ وَإِنَّ الْفُجَّارَ لَفِي جَحِيمٍ﴾<\/span>‎; (2) when leaving it out would give the wrong meaning, e.g. ‎<span class=\"arin\">لا وشفاه الله<\/span>‎. (Ch. IX)<\/p><p><b>13.<\/b> <em>Musāwāt<\/em>: words equal to the meaning, as ordinary people speak. <em>Ījāz<\/em>: fewer words that still fully meet the purpose. <em>Iṭnāb<\/em>: more words, with a benefit. <em>Ikhlāl<\/em>: brevity that fails the purpose. <em>Taṭwīl<\/em>: extra words without benefit where the extra word cannot be pointed to (‎<span class=\"arin\">كِذْباً وَمَيْناً<\/span>‎); <em>ḥashw<\/em>: where it can (‎<span class=\"arin\">قَبْلَهُ<\/span>‎). (Ch. X)<\/p><p><b>14.<\/b> <em>Iltifāt<\/em>: moving speech from first person, address or third person to another of them, e.g. ‎<span class=\"arin\">فَطَرَنِي<\/span>‎ … ‎<span class=\"arin\">تُرْجَعُونَ<\/span>‎. <em>Uslūb al-ḥakīm<\/em>: meeting the listener with other than what he expects, or the questioner with other than what he asks, to show it is more fitting: al-Qabaʿtharī's reply to al-Ḥajjāj, and the answer about the new moons. (Ch. XI)<\/p><p><b>15–24.<\/b> 15 The restriction ‎<span class=\"arin\">لاَعِبِيْنَ<\/span>‎; without it the sentence would be false. · 16 The negation of ‎<span class=\"arin\">لمّا<\/span>‎ lasts up to the time of speaking. · 17 Blame. · 18 Negation and exception; restricted to \"a noble angel\". · 19 It answers the question raised by the first sentence (<em>shibh kamāl al-ittiṣāl<\/em>). · 20 Several sentences: send me to Yūsuf to ask him; they sent him; he came and said. · 21 <em>Iʿtirāḍ<\/em> (a prayer for the listener). · 22 To show it will certainly happen. · 23 Signs of denial appear on him (his arrogant bearing). · 24 The rational prevailing over the non-rational.<\/p><p><b>25.<\/b> Good came to them often and certainly: so ‎<span class=\"arin\">إذا<\/span>‎, a past verb, and ‎<span class=\"arin\">الْحَسَنَةُ<\/span>‎ with <i>al<\/i> of the genus (good of every kind). Harm came rarely: so ‎<span class=\"arin\">إن<\/span>‎, a <i>muḍāriʿ<\/i>, and the indefinite ‎<span class=\"arin\">سَيِّئَةٌ<\/span>‎ (one kind: drought). It also shows their ingratitude. (Ch. VII)<\/p><p><b>26.<\/b> Joined to ‎<span class=\"arin\">إِنَّا مَعَكُمْ<\/span>‎ it would become part of what the hypocrites said; joined to ‎<span class=\"arin\">قَالُوا<\/span>‎ it would be tied to the time when they are alone with their devils. Neither is intended, so it is separated. The relation is <em>tawassuṭ bayn al-kamālayn<\/em>. (Ch. IX)<\/p><\/div><h3>MODEL ANSWERS · PAPER THREE<span class=\"ar\">أجوبة الامتحان الثالث<\/span><\/h3><div class=\"answers\"><p><b>1–10.<\/b> 1 (b) · 2 (b) · 3 (a) · 4 (b) · 5 (b) · 6 (c) · 7 (b) · 8 (b) · 9 (b) · 10 (c).<\/p><p><b>11.<\/b> Attaching one thing to another in a quality, by a particle, for a purpose. Mushabbah ‎<span class=\"arin\">العلم<\/span>‎, mushabbah bihi ‎<span class=\"arin\">النور<\/span>‎, wajh al-shabah ‎<span class=\"arin\">الهداية<\/span>‎, adāh ‎<span class=\"arin\">الكاف<\/span>‎. Purposes: showing the possibility of the thing likened, its state, the degree of its state, establishing its state, adorning it, making it ugly (and, in the inverted simile, a purpose concerning the thing likened to). (Ch. XII)<\/p><p><b>12.<\/b> An expression used for other than what it was made for, because of a connection (<em>ʿalāqah<\/em>), with a clue (<em>qarīnah<\/em>) preventing the original meaning. <em>Istiʿārah<\/em>: the connection is resemblance; <em>majāz mursal<\/em>: any other connection. Both are in the word; <em>majāz ʿaqlī<\/em> is in the attribution, a verb attributed to other than its real doer. (Ch. XIII)<\/p><p><b>13.<\/b> An expression by which something attached to its meaning is intended, while the meaning itself may also be intended (‎<span class=\"arin\">طويل النِجاد<\/span>‎ = tall). In <em>majāz<\/em> the clue prevents the real meaning; in <em>kināyah<\/em> it remains possible. Divisions: pointing to a quality, to an attribution, or to something that is neither. (Ch. XIV)<\/p><p><b>14.<\/b> <em>Badīʿ<\/em>: the science by which one knows the ways of beautifying speech that fits its situation. <em>Jinās<\/em>: two words alike in pronunciation but not in meaning. Complete when the letters agree in vowels, kind, number and order. Kinds: <em>mutamāthil<\/em>, <em>mustawfā<\/em>, <em>mutashābih<\/em>, <em>mafrūq<\/em>. (Chs. XV–XVI)<\/p><p><b>15–24.<\/b> 15 Compound to compound: the whole scene of dust and flashing swords is likened to the whole scene of night with falling stars. · 16 Showing that the thing likened is possible. · 17 Profit and trade suit buying, the thing likened-to. · 18 What they were (they are now grown up). · 19 The hearts; a <em>kināyah<\/em> pointing to something that is neither a quality nor an attribution. · 20 <em>Istikhdām<\/em>. · 21 <em>Al-ṭayy wa-l-nashr<\/em>. · 22 All faults are denied, then \"except\" brings a praise, so they have no faults at all. · 23 <em>Mutawāzin<\/em>. · 24 An opening that hints at the subject: ‎<span class=\"arin\">اَلْمَجْدُ عُوْفِيَ إذْ عُوْفِيْتَ<\/span>‎.<\/p><p><b>25.<\/b> From \"misguidance is like darkness, guidance like light\", the thing likened, the particle and the aspect are dropped, leaving only the word for the thing likened to. <em>Mustaʿār lahu<\/em>: misguidance and guidance; <em>mustaʿār minhu<\/em>: the meaning of darkness and light; <em>mustaʿār<\/em>: the words ‎<span class=\"arin\">الظُّلُمَاتِ<\/span>‎ and ‎<span class=\"arin\">النُّورِ<\/span>‎. (Ch. XIII)<\/p><p><b>26.<\/b> (1) Taking the words as they are (or with synonyms or opposites): <em>naskh<\/em> and <em>intiḥāl<\/em>. (2) Taking the meaning and changing the wording, the second no better than the first: <em>ighārah<\/em> and <em>maskh<\/em>. (3) Taking the meaning alone: <em>ilmām<\/em> and <em>salkh<\/em>. (Ch. XVII)<\/p><\/div><\/section>", "mcq": [{"q": "‎<span class=\"arin\">الهعخع<\/span>‎ is the book's example of:", "opts": ["<em>gharābah<\/em>", "<em>tanāfur al-ḥurūf<\/em>", "<em>mukhālafat al-qiyās<\/em>", "<em>ḍaʿf al-taʾlīf<\/em>"], "ans": 1, "paper": 1}, {"q": "‎<span class=\"arin\">مَوْدَدَةٍ<\/span>‎ is a fault because it goes against the rule of:", "opts": ["<i>idghām<\/i>", "the plural of paucity", "word order", "the pronoun"], "ans": 0, "paper": 1}, {"q": "Which of these is described by <em>faṣāḥah<\/em> but never by <em>balāghah<\/em>?", "opts": ["speech", "the speaker", "the single word", "the situation"], "ans": 2, "paper": 1}, {"q": "According to the book, mutual repulsion (<em>tanāfur<\/em>) is known by:", "opts": ["taste (<em>dhawq<\/em>)", "<em>ṣarf<\/em>", "<em>naḥw<\/em>", "<em>al-bayān<\/em>"], "ans": 0, "paper": 1}, {"q": "A statement given to a listener who denies it, with several emphasisers, is called:", "opts": ["<em>ibtidāʾī<\/em>", "<em>ṭalabī<\/em>", "<em>inkārī<\/em>", "<em>inshāʾī<\/em>"], "ans": 2, "paper": 1}, {"q": "The command in ‎<span class=\"arin\">﴿كُونُوا حِجَارَةً أَوْ حَدِيداً﴾<\/span>‎ has left its original meaning for:", "opts": ["permission", "humiliation (<em>ihānah<\/em>)", "giving a choice", "honouring"], "ans": 1, "paper": 1}, {"q": "The question in ‎<span class=\"arin\">﴿هَلْ جَزَاءُ الإِحْسَانِ إِلاَّ الإِحْسَانُ﴾<\/span>‎ is used for:", "opts": ["negation (<em>nafy<\/em>)", "command", "wonder", "threat"], "ans": 0, "paper": 1}, {"q": "In ‎<span class=\"arin\">﴿خَالِقُ كُلِّ شَيْءٍ﴾<\/span>‎ the subject is omitted to draw attention to:", "opts": ["the listener's dullness", "the omitted one being specified", "the metre", "hiding the matter"], "ans": 1, "paper": 1}, {"q": "‎<span class=\"arin\">لَم يكن كلّ ذلك<\/span>‎ is an example of:", "opts": ["<em>ʿumūm al-salb<\/em>", "<em>salb al-ʿumūm<\/em>", "<em>takhṣīṣ<\/em>", "<em>tashwīq<\/em>"], "ans": 1, "paper": 1}, {"q": "In ‎<span class=\"arin\">﴿إِنَّ الإنسَانَ لَفِي خُسْرٍ﴾<\/span>‎ the <i>al<\/i> is:", "opts": ["<em>jinsiyyah<\/em>", "<em>ʿahdiyyah<\/em>", "<em>istighrāqiyyah<\/em>", "for the kind in some individual"], "ans": 2, "paper": 1}, {"q": "With which particle is there certainty that the condition will occur?", "opts": ["‎<span class=\"arin\">إن<\/span>‎", "‎<span class=\"arin\">إذا<\/span>‎", "‎<span class=\"arin\">لو<\/span>‎", "‎<span class=\"arin\">متى<\/span>‎"], "ans": 1, "paper": 2}, {"q": "‎<span class=\"arin\">لمّا<\/span>‎ in negation corresponds, in affirmation, to:", "opts": ["‎<span class=\"arin\">لن<\/span>‎", "‎<span class=\"arin\">قد<\/span>‎", "‎<span class=\"arin\">لم<\/span>‎", "‎<span class=\"arin\">إنّ<\/span>‎"], "ans": 1, "paper": 2}, {"q": "‎<span class=\"arin\">ما عليّ إلاّ قائم<\/span>‎ is restriction that is:", "opts": ["real (<em>ḥaqīqī<\/em>)", "relative (<em>iḍāfī<\/em>)", "of an attribute to the described", "<em>qaṣr taʿyīn<\/em>"], "ans": 1, "paper": 2}, {"q": "Restriction said to a listener who believes the reverse is:", "opts": ["<em>qaṣr ifrād<\/em>", "<em>qaṣr qalb<\/em>", "<em>qaṣr taʿyīn<\/em>", "<em>qaṣr ḥaqīqī<\/em>"], "ans": 1, "paper": 2}, {"q": "The book discusses <em>waṣl<\/em> only with:", "opts": ["‎<span class=\"arin\">الفاء<\/span>‎", "‎<span class=\"arin\">ثُمّ<\/span>‎", "‎<span class=\"arin\">الواو<\/span>‎", "‎<span class=\"arin\">أو<\/span>‎"], "ans": 2, "paper": 2}, {"q": "Between ‎<span class=\"arin\">فَمَهِّلِ الْكَافِرِينَ<\/span>‎ and ‎<span class=\"arin\">أَمْهِلْهُمْ رُوَيْداً<\/span>‎ there is:", "opts": ["<em>kamāl al-ittiṣāl<\/em>", "<em>kamāl al-inqiṭāʿ<\/em>", "<em>shibh kamāl al-ittiṣāl<\/em>", "<em>tawassuṭ bayn al-kamālayn<\/em>"], "ans": 0, "paper": 2}, {"q": "‎<span class=\"arin\">﴿وَلَكُمْ فِي الْقِصَاصِ حَيَاةٌ﴾<\/span>‎ is the book's example of:", "opts": ["<em>ījāz ḥadhf<\/em>", "<em>ījāz qiṣar<\/em>", "<em>musāwāt<\/em>", "<em>iṭnāb<\/em>"], "ans": 1, "paper": 2}, {"q": "‎<span class=\"arin\">قَبْلَهُ<\/span>‎ in ‎<span class=\"arin\">وَأَعْلَمُ عِلْمَ اليَوْمِ وَالأَمْسِ قَبْلَهُ<\/span>‎ is:", "opts": ["<em>taṭwīl<\/em>", "<em>ḥashw<\/em>", "<em>tadhyīl<\/em>", "<em>iḥtirās<\/em>"], "ans": 1, "paper": 2}, {"q": "‎<span class=\"arin\">غَيْرَ مُفْسِدِهَا<\/span>‎ is the book's example of:", "opts": ["<em>takmīl<\/em>", "<em>īghāl<\/em>", "<em>iḥtirās<\/em>", "<em>iʿtirāḍ<\/em>"], "ans": 2, "paper": 2}, {"q": "Turning from ‎<span class=\"arin\">أَعْطَيْنَاكَ<\/span>‎ to ‎<span class=\"arin\">فَصَلِّ لِرَبِّكَ<\/span>‎ is:", "opts": ["<em>iltifāt<\/em>", "<em>taghlīb<\/em>", "<em>uslūb al-ḥakīm<\/em>", "<em>tajāhul al-ʿārif<\/em>"], "ans": 0, "paper": 2}, {"q": "A simile whose particle and aspect of likeness are both dropped is called:", "opts": ["<em>mursal<\/em>", "<em>tashbīh balīgh<\/em>", "<em>mujmal<\/em>", "<em>tamthīl<\/em>"], "ans": 1, "paper": 3}, {"q": "‎<span class=\"arin\">كأنّ<\/span>‎ conveys doubt when its predicate is:", "opts": ["<em>jāmid<\/em>", "<em>mushtaqq<\/em>", "a sentence", "a proper name"], "ans": 1, "paper": 3}, {"q": "A simile whose aspect is drawn from several things is:", "opts": ["<em>tamthīl<\/em>", "<em>mufaṣṣal<\/em>", "<em>muʾakkad<\/em>", "<em>maqlūb<\/em>"], "ans": 0, "paper": 3}, {"q": "‎<span class=\"arin\">﴿وَاخْفِضْ لَهُمَا جَنَاحَ الذُّلِّ﴾<\/span>‎ contains an <em>istiʿārah<\/em> that is:", "opts": ["<em>muṣarraḥah<\/em>", "<em>makniyyah<\/em>", "<em>tamthīliyyah<\/em>", "<em>aṣliyyah<\/em>"], "ans": 1, "paper": 3}, {"q": "The connection in ‎<span class=\"arin\">أمطرت السماء نَبَاتاً<\/span>‎ is:", "opts": ["cause", "effect (<em>musabbabiyyah<\/em>)", "part", "the place"], "ans": 1, "paper": 3}, {"q": "‎<span class=\"arin\">نَهاره صائم<\/span>‎ attributes the verb to:", "opts": ["the cause", "the place", "the time", "the <em>maṣdar<\/em>"], "ans": 2, "paper": 3}, {"q": "A <em>kināyah<\/em> with many steps, like ‎<span class=\"arin\">هو كثير الرماد<\/span>‎, is called:", "opts": ["<em>ramz<\/em>", "<em>talwīḥ<\/em>", "<em>īmāʾ<\/em>", "<em>taʿrīḍ<\/em>"], "ans": 1, "paper": 3}, {"q": "‎<span class=\"arin\">جَرَحْتُم<\/span>‎ in ‎<span class=\"arin\">﴿وَيَعْلَمُ مَا جَرَحْتُم بِالنَّهَارِ﴾<\/span>‎ is an example of:", "opts": ["<em>ibhām<\/em>", "<em>tawriyah<\/em>", "<em>istikhdām<\/em>", "<em>tawjīh<\/em>"], "ans": 1, "paper": 3}, {"q": "Hyperbole possible in reason but not in practice is:", "opts": ["<em>tablīgh<\/em>", "<em>ighrāq<\/em>", "<em>ghuluww<\/em>", "<em>mughāyarah<\/em>"], "ans": 1, "paper": 3}, {"q": "‎<span class=\"arin\">ذَا هِبَةٍ<\/span>‎ / ‎<span class=\"arin\">ذَاهِبَةٌ<\/span>‎ is <em>jinās<\/em> that is:", "opts": ["<em>mutamāthil<\/em>", "<em>mustawfā<\/em>", "<em>mutashābih<\/em>", "<em>mafrūq<\/em>"], "ans": 2, "paper": 3}], "front": "<section class=\"front\"><div class=\"fronthead\">THE AUTHORS' INTRODUCTION · خطبة الكتاب<\/div><div class=\"bism\"><span class=\"ar\">بسم الله الرحمن الرحيم<\/span><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 8<\/span><\/div><div class=\"ar\">الحمد لله الذي قصرت عبارة البلغاء، عن الإحاطة بمعاني آياته وعجزت ألسن الفصحاء، عن بيان بدائع مصنوعاته والصلاة والسلام على من ملك طرفي البلاغة إطناباً وإيجازاً وعلى آله وأصحابه الفاتحين بهديهم إلى الحقيقة مجازاً.<\/div><div class=\"tr\">Praise be to Allāh, before Whom the expression of the eloquent falls short of encompassing the meanings of His signs, and the tongues of the articulate are unable to set out the wonders of His handiwork. And blessings and peace be upon the one who mastered both ends of eloquence, expansiveness (<i>iṭnāb<\/i>) and concision (<i>ījāz<\/i>), and upon his family and his Companions, who by their guidance opened a passage (<i>majāz<\/i>) to the Truth (<i>ḥaqīqah<\/i>).<\/div><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 8<\/span><\/div><div class=\"ar\">وبعد! فهذا كتاب في فنون البلاغة الثلاثة سهل المنال، قريب المآخذ، برئ من وصمة التطويل الممل، وعيب الاختصار المخل، سلكنا في تأليفه أسهل التراتيب وأوضح الأساليب. وجمعنا فيه خلاصة قواعد البلاغة وأمّهات مسائلها وتركنا ما لا تمسّ إليه حاجة التلامذة من الفوائد الزوائد وقوفاً عند حدّ اللازم وحرصاً على أوقاتهم أن تضيع في حلّ معقد أو تلخيص مطوّل أو تكميل مختصر فتمّ به مع كتب الدروس النحويّة سلم الدراسة العربيّة في المدارس الابتدائيّة والتجهيزيّة.<\/div><div class=\"tr\">To proceed: this is a book on the three arts of eloquence, easy to attain and near at hand, free from the blemish of wearisome length and from the fault of damaging brevity. In composing it we followed the easiest arrangements and the clearest methods. We gathered in it the essence of the rules of <i>balāghah<\/i> and its principal questions, and we left out those additional points which the pupils have no pressing need for, stopping at the limit of what is necessary, and out of care that their time should not be lost in unravelling something knotted, abridging something lengthy, or completing something cut short. With it, together with the books of <i>al-Durūs al-Naḥwiyyah<\/i>, the ladder of Arabic study in the primary and preparatory schools has been completed.<\/div><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 8–9<\/span><\/div><div class=\"ar\">(والفضل) في ذلك كلّه للأميرين الكبيرين نُبْلاً، والإنسانين الكاملين فضلاً ناظر المعارف المتجافى عن مهاد الراحة في خدمة البلاد الواقف في منفعتها على قدم الاستعداد (صاحب العطوفة محمّد زكي باشا) ووكيلها ذي الأيادي البيضاء في تقدّم المعارف نحو الصراط المستقيم وأدارة شؤنها على المحور القويم (صاحب السعادة يعقوب أرتين باشا)<\/div><div class=\"tr\">(The credit) for all of this belongs to the two princes, great in nobility, and the two men perfect in merit: the Minister of Education, who keeps his side away from the bed of rest in the service of the country and stands ready on his feet for its benefit (His Excellency Muḥammad Zakī Pasha), and its Under-Secretary, the man of generous favours in the advance of education towards the straight path and in turning its affairs upon the right axis (His Excellency Yaʿqūb Artīn Pasha).<\/div><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 9<\/span><\/div><div class=\"ar\">فهما اللّذان أشارا علينا بوضع هذا النظام المفيد وسلوك سبيل هذا الوضع الجديد تحقيقاً لرغائب أمير البلاد ووليّ أمرها الناشي في مهد المعارف العارف بقدرها مجدّد شهرة الديار المصريّة، ومعيد شبيبة الدولة المحمّدية العلويّة (مولانا الأفخم عباس حلمي باشا الثاني) أدام الله سعود أمّته وأقرّ به عيون آله ورجاله وسائر رعيّته آمين.<\/div><div class=\"tr\">It is they who advised us to set down this useful system and to follow the path of this new arrangement, fulfilling the wishes of the prince of the country and the guardian of its affairs, who grew up in the cradle of learning and knows its worth, the renewer of the fame of the Egyptian lands and the restorer of the youth of the Muḥammadan ʿAlawī dynasty (our most exalted master ʿAbbās Ḥilmī Pasha the Second). May Allāh make the fortunes of his nation endure, and gladden through him the eyes of his family, his men and all his subjects. Āmīn.<\/div><\/div><p style=\"text-align:left;margin-top:4mm\">‎<span class=\"arin\">المؤلّفون<\/span>‎ &#8212; <em>The Authors<\/em><\/p><div class=\"cnote\"><span class=\"cnh\">COMPANION&#8217;S NOTE · NOT IN THE BOOK<\/span><p>On p. 8 the book prints ‎<span class=\"arin\">المتجافى<\/span>‎ (with <i>alif maqṣūrah<\/i>) and ‎<span class=\"arin\">وأدارة<\/span>‎ (with hamzah over the alif); the likely readings are ‎<span class=\"arin\">المتجافي<\/span>‎ and ‎<span class=\"arin\">وإدارة<\/span>‎. On p. 9 it prints ‎<span class=\"arin\">الناشي<\/span>‎ without hamzah, i.e. ‎<span class=\"arin\">الناشئ<\/span>‎.<\/p><\/div><\/section>\n"}</script>

async function pushDb(){if(!dbOK||!docRef||!dirty)return;dirty=false;
  try{await docRef.set({json:JSON.stringify(S),updated:S.updated})}catch(e){dbOK=false;setSync()}}
(async()=>{try{
  if(!window.claude||!window.claude.use)return;
  const user=await window.claude.use("user");if(!user)return;
  const uid=await user.id();if(!uid)return;
  db=await window.claude.use("db");if(!db)return;
  docRef=db.doc("data/users/"+uid+"/state");
  const snap=await docRef.get();
  if(snap.exists){const d=snap.data();if(d&&d.json&&d.updated>(S.updated||0)){S=Object.assign(blank(),JSON.parse(d.json));try{localStorage.setItem(KEY,d.json)}catch(e){};applySettings();route(cur.view,cur.arg,true)}}
  dbOK=true;setSync();
  if((S.updated||0)>((snap.exists&&snap.data().updated)||0)){dirty=true;pushDb()}
}catch(e){dbOK=false;setSync()}})();

function touchDay(sec=0){const k=today();S.days[k]=(S.days[k]||0)+sec}
let activeAt=Date.now();
["pointerdown","keydown","scroll","wheel","touchstart"].forEach(ev=>addEventListener(ev,()=>activeAt=Date.now(),{passive:true}));
setInterval(()=>{if(document.visibilityState==="visible"&&Date.now()-activeAt<60000){touchDay(30);save()}},30000);
function streak(){let n=0,k=today();if(!S.days[k])k=dayAdd(k,-1);while(S.days[k]){n++;k=dayAdd(k,-1)}return n}

/* ---------------- settings ---------------- */
function applySettings(){const r=document.documentElement;
  if(S.settings.theme==="system")r.removeAttribute("data-theme");else r.setAttribute("data-theme",S.settings.theme);
  r.style.setProperty("--read-size",S.settings.size+"px");
  const tb=$("#themebtn");if(tb){const dark=isDark();tb.innerHTML=ic(dark?"sun":"moon",'style="width:16px;height:16px"')+(dark?" Light appearance":" Dark appearance")}}
const isDark=()=>S.settings.theme==="dark"||(S.settings.theme==="system"&&matchMedia("(prefers-color-scheme: dark)").matches);
function toggleTheme(){S.settings.theme=isDark()?"light":"dark";applySettings();save()}

/* ---------------- progress helpers ---------------- */
const chRead=n=>Math.max(S.done[n]?100:0,Math.round(S.read[n]||0));
const overall=()=>Math.round(CH.reduce((s,c)=>s+chRead(c.num),0)/CH.length);
const cardState=id=>S.cards[id]||null;
const mastered=()=>Object.values(S.cards).filter(c=>c.box>=4).length;
const dueCards=(pool)=>{const t=today();return pool.filter(c=>{const s=cardState(c.id);return s&&s.due<=t})};
const quizAvg=()=>{if(!S.quiz.length)return null;return Math.round(S.quiz.reduce((s,q)=>s+q.score/q.total,0)/S.quiz.length*100)};
const chQuizBest=n=>{const qs=S.quiz.filter(q=>q.scope===String(n));return qs.length?Math.max(...qs.map(q=>Math.round(q.score/q.total*100))):null};

      const ta=$("#notearea");let t;ta.addEventListener("input",()=>{S.notes[n]=ta.value;$("#savedmsg").textContent="Saving…";clearTimeout(t);t=setTimeout(()=>{save();$("#savedmsg").textContent="Saved"},500)});
      $("#closenotes").onclick=()=>{S._notesOpen=false;$("#rw").classList.remove("notes-open");$("#notesbtn").setAttribute("aria-pressed","false");drawAside()};
    }else{a.className="toc glass";a.innerHTML=`<div class="eyebrow">In this chapter</div>`+heads.map((h,i)=>{const t=h.cloneNode(true);const ar=$(".ar",t);ar&&ar.remove();return `<a href="#s${i}" data-s="${i}">${esc(t.textContent.trim().toLowerCase().replace(/(^|\s)\S/g,x=>x.toUpperCase()))}</a>`}).join("");
      $$("a",a).forEach(l=>l.onclick=e=>{e.preventDefault();$("#s"+l.dataset.s).scrollIntoView({behavior:"smooth",block:"start"})});}

  $("#notesbtn").onclick=()=>{S._notesOpen=!S._notesOpen;$("#rw").classList.toggle("notes-open",S._notesOpen);$("#notesbtn").setAttribute("aria-pressed",S._notesOpen);drawAside();if(S._notesOpen)$("#notearea").focus()};

  $("#donebtn").onclick=()=>{S.done[n]=!S.done[n];if(S.done[n])S.read[n]=100;save();touchDay();route("read",n,true);toast(S.done[n]?`Chapter ${ROMAN[n]} finished`:"Marked as not finished")};

    else{try{await navigator.clipboard.writeText(txt);toast("Copied")}catch(err){toast("Copy is blocked here; use your device’s copy")}}
    pop.hidden=true;getSelection().removeAllRanges()});
};
let pendingHit=null;
function findInBook(book,q){const w=document.createTreeWalker(book,NodeFilter.SHOW_TEXT);const ql=q.toLowerCase();let node;
  while(node=w.nextNode()){const i=node.nodeValue.toLowerCase().indexOf(ql);if(i>=0){const el=node.parentElement.closest("p,li,.matn,.qa,td,.example,h3,h4,.tree")||node.parentElement;el.classList.add("flash");el.scrollIntoView({behavior:"smooth",block:"center"});setTimeout(()=>el.classList.remove("flash"),2400);return}}}

/* ---------------- FLASHCARDS (Leitner spaced repetition) ---------------- */
const INTERVAL=[0,1,3,7,14,30,60];
let deck={scope:"all",type:"term",queue:[],i:0,flipped:false,done:0};
function buildQueue(){
  let pool=CARDS.filter(c=>c.type===deck.type&&(deck.scope==="all"||(deck.scope==="star"?S.stars[c.id]:String(c.ch)===deck.scope)));
  const due=dueCards(pool),fresh=pool.filter(c=>!cardState(c.id)).slice(0,deck.scope==="all"?15:40);
  let q=[...due,...fresh];
  if(!q.length&&deck.cram)q=[...pool];
  for(let i=q.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[q[i],q[j]]=[q[j],q[i]]}
  deck.queue=q;deck.i=0;deck.flipped=false;deck.done=0;
}
VIEWS.cards=(m,arg)=>{
  if(arg){deck.scope=String(arg)}
  buildQueue();
  const opts=`<option value="all">All chapters</option><option value="star">Starred terms</option>`+CH.map(c=>`<option value="${c.num}">${ROMAN[c.num]} · ${esc(c.title)}</option>`).join("");
  m.innerHTML=topbar("Flashcards")+`<div class="view">
  <div class="deck-head"><div><div class="eyebrow">Spaced repetition</div><h2 class="title">Flashcards</h2>
    <p class="lede">Cards you find hard come back sooner; cards you know move further away. A card is mastered once it reaches box 4.</p></div>
    <div class="row"><div class="seg" role="group" aria-label="Deck"><button data-t="term" aria-pressed="${deck.type==="term"}">Key terms</button><button data-t="qa" aria-pressed="${deck.type==="qa"}">Chapter Q&amp;A</button></div>
    <select class="sel" id="scope" aria-label="Chapter">${opts}</select></div></div>
  <div id="stage"></div>
  <section class="card glass"><div class="row" style="justify-content:space-between"><div class="eyebrow">Your boxes · ${deck.type==="term"?"key terms":"chapter Q&A"}</div><span class="muted" style="font-size:13px">box 0 = new or forgotten</span></div><div class="boxes" id="boxes" style="margin-top:22px"></div></section></div>`;
  $("#scope").value=deck.scope;
  $("#scope").onchange=e=>{deck.scope=e.target.value;deck.cram=false;buildQueue();drawCard()};
  $$("[data-t]").forEach(b=>b.onclick=()=>{deck.type=b.dataset.t;deck.cram=false;route("cards")});
  drawCard();
};
function drawBoxes(){const el=$("#boxes");if(!el)return;const pool=CARDS.filter(c=>c.type===deck.type);const counts=[0,0,0,0,0,0,0];pool.forEach(c=>{const s=cardState(c.id);counts[s?s.box:0]++});const mx=Math.max(...counts,1);
  el.innerHTML=counts.map((n,i)=>`<div style="height:${Math.max(6,n/mx*100)}%;${i>=4?"background:color-mix(in srgb,var(--ink) 45%,transparent)":""}" title="Box ${i}: ${n}"><b class="num">${n}</b></div>`).join("")}
function drawCard(){
  const st=$("#stage");drawBoxes();
  if(deck.i>=deck.queue.length){st.innerHTML=`<section class="card glass" style="text-align:center;padding:40px 24px"><div class="eyebrow">${deck.done?"Session complete":"Nothing due"}</div><h2 class="title" style="margin-bottom:8px">${deck.done?`You reviewed ${deck.done} card${deck.done===1?"":"s"}`:"You are up to date"}</h2>
    <p class="lede" style="margin:0 auto 18px">${deck.done?"Come back tomorrow for the cards that are due then.":"No cards are due in this deck right now. You can still practise all of them."}</p>
    <div class="row" style="justify-content:center"><button class="btn primary" id="cram">${ic("shuffle")} Practise all cards in this deck</button></div></section>`;
    $("#cram").onclick=()=>{deck.cram=true;buildQueue();drawCard()};return}
  const c=deck.queue[deck.i],s=cardState(c.id),chap=`Chapter ${ROMAN[c.ch]}`;
  const front=c.type==="term"?`<span class="corner">${chap} · term</span><div class="big-ar">${c.a}</div><div class="hint">Tap or press space to turn over</div>`
    :`<span class="corner">${chap} · question</span><div class="qtext">${c.q}</div><div class="hint">Tap or press space to see the answer</div>`;
  const back=c.type==="term"?`<span class="corner">${chap}</span><div class="tl">${c.t}</div><div class="mean">${c.m}</div><div class="big-ar" style="font-size:28px">${c.a}</div>`
    :`<span class="corner">${chap} · answer</span><div class="atext">${c.a}</div>`;
  st.innerHTML=`<div class="row" style="justify-content:space-between;margin-bottom:12px"><span class="muted num">${deck.i+1} of ${deck.queue.length}${s?` · box ${s.box}`:" · new"}</span>
    ${c.type==="term"?`<button class="star" aria-label="Star this term" aria-pressed="${!!S.stars[c.id]}" id="starbtn">${ic("star")}</button>`:"<span></span>"}</div>
    <div class="flash-stage"><button class="fcard enter ${deck.flipped?"flipped":""}" id="fc" aria-label="Flashcard, press to turn over"><div class="fface front glass">${front}</div><div class="fface back glass">${back}</div></button></div>
    <div class="grade" id="grade" ${deck.flipped?"":"hidden"} style="margin-top:16px">
      <button class="again" data-g="0">Again<small>today</small></button><button class="hard" data-g="1">Hard<small>${INTERVAL[Math.max(1,(s?s.box:0))]}d</small></button>
      <button class="good" data-g="2">Good<small>${INTERVAL[Math.min(6,(s?s.box:0)+1)]}d</small></button><button class="easy" data-g="3">Easy<small>${INTERVAL[Math.min(6,(s?s.box:0)+2)]}d</small></button></div>`;
  $("#fc").onclick=flip;$("#fc").addEventListener("animationend",e=>e.currentTarget.classList.remove("enter"),{once:true});
  const sb=$("#starbtn");if(sb)sb.onclick=()=>{S.stars[c.id]=!S.stars[c.id];if(!S.stars[c.id])delete S.stars[c.id];save();sb.setAttribute("aria-pressed",!!S.stars[c.id])};
  $$("#grade button").forEach(b=>b.onclick=()=>grade(+b.dataset.g));
}
function flip(){deck.flipped=!deck.flipped;$("#fc").classList.toggle("flipped",deck.flipped);$("#grade").hidden=!deck.flipped}
function grade(g){if(typeof placeAllLenses==="function")setTimeout(placeAllLenses,0);const c=deck.queue[deck.i],s=cardState(c.id)||{box:0,due:today(),n:0};
  let box=g===0?0:g===1?Math.max(1,s.box):g===2?Math.min(6,s.box+1):Math.min(6,s.box+2);
  S.cards[c.id]={box,due:dayAdd(today(),INTERVAL[box]),n:(s.n||0)+1,last:today()};
  if(g===0)deck.queue.push(c);
  deck.i++;deck.done++;deck.flipped=false;touchDay();save();drawCard();drawNavL()}

let quiz=null;
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function makeQuestions(scope,count){
  let pool=scope==="all"?TERMS:scope==="mistakes"?TERMS.filter(t=>S._wrong&&S._wrong[t.id]):TERMS.filter(t=>String(t.ch)===scope);
  const qs=[];
  if(scope==="exam"){return shuffle(DATA.mcq).slice(0,count).map(x=>({kind:"exam",prompt:x.q,opts:x.opts,ans:x.ans,explain:`From practice paper ${["","one","two","three"][x.paper]}.`}))}
  if(scope==="all")qs.push(...shuffle(DATA.mcq).slice(0,Math.round(count*.3)).map(x=>({kind:"exam",prompt:x.q,opts:x.opts,ans:x.ans,explain:`From practice paper ${["","one","two","three"][x.paper]}.`})));
  const others=t=>{let same=TERMS.filter(o=>o.ch===t.ch&&o.id!==t.id&&strip(o.m)!==strip(t.m));if(same.length<3)same=same.concat(shuffle(TERMS.filter(o=>o.ch!==t.ch)).slice(0,3-same.length));return shuffle(same).slice(0,3)};
  for(const t of shuffle(pool)){if(qs.length>=count)break;const o=others(t),type=Math.floor(Math.random()*3);let prompt,opts,ans;
    if(type===0){prompt=`What does <b>${t.t}</b> mean?<span class="bigar">${t.a}</span>`;opts=shuffle([t,...o]);ans=opts.indexOf(t);opts=opts.map(x=>x.m)}
    else if(type===1){prompt=`Which term is this?<br><span style="font-style:italic">“${strip(t.m)}”</span>`;opts=shuffle([t,...o]);ans=opts.indexOf(t);opts=opts.map(x=>`<span class="arin" style="font-size:1.25em">${x.a}</span> &nbsp;${x.t}`)}
    else{prompt=`Which is the transliteration and meaning of<span class="bigar">${t.a}</span>`;opts=shuffle([t,...o]);ans=opts.indexOf(t);opts=opts.map(x=>`<b>${x.t}</b>: ${strip(x.m)}`)}
    qs.push({kind:"term",id:t.id,prompt,opts,ans,explain:`<b>${t.t}</b> <span class="arin">${t.a}</span>: ${t.m} <span class="muted">(Chapter ${ROMAN[t.ch]})</span>`})}
  return shuffle(qs);
}

  if(quiz&&!quiz.done){m.innerHTML=topbar("Quiz")+`<div class="view" id="qv"></div>`;drawQ();return}

  </div>
  <section class="card glass"><div class="eyebrow" style="margin-bottom:6px">Recent results</div><div class="history">${S.quiz.length?S.quiz.slice(-8).reverse().map(q=>`<div class="h"><span>${scopeName(q.scope)}</span><span class="muted">${q.date}</span><b class="num">${q.score}/${q.total}</b></div>`).join(""):`<div class="empty">Your quiz results will appear here.</div>`}</div></section></div>`;
  let n=10;$$("#qn button").forEach(b=>b.onclick=()=>{n=+b.dataset.n;$$("#qn button").forEach(x=>x.setAttribute("aria-pressed",x===b))});
  if(S.last)$("#qch").value=S.last;
  $("#qgo").onclick=()=>{startQuiz($("#qch").value,n);route("quiz")};
