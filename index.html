he aspect of likeness is mentioned, as in: “His teeth and my tears are, in clearness, like pearls”; and the second is what is not like that, as in «Grammar in speech is like salt in food».<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>Also by the aspect of likeness: if the shared quality is <b>mentioned<\/b>, the simile is <b>detailed<\/b> (<i>mufaṣṣal<\/i>): his teeth and my tears are like pearls <i>in clearness<\/i>. If it is <b>not mentioned<\/b>, it is <b>summary<\/b> (<i>mujmal<\/i>): \"Grammar in speech is like salt in food\", leaving the listener to see the point (a little is essential; without it everything is spoilt).<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 157<\/span><\/div><div class=\"ar\">وينقسم باعتبار أداته إلى مؤكّد: وهو ما حذفت أداته، نحو: «هو بحر في الجود»، ومرسَل: وهو ما ليس كذلك، نحو: «هو كالبحر كرماً»، ومن المؤكّد ما أضيف فيه المشبّه به إلى المشبّه، نحو:<span class=\"bayt\"><span class=\"h1\">وَالرِيْحُ تَعْبَثُ بِالْغُصُوْنِ وَقَدْ جَرَى<\/span><span class=\"h2\">ذَهَبُ الْأَصِيْلِ عَلَى لُجَيْنِ الْمَاءِ<\/span><\/span><\/div><div class=\"tr\">It is divided, in respect of its particle, into the emphatic (muʾakkad), which is that whose particle has been dropped, as in «He is a sea in generosity»; and the unrestricted (mursal), which is what is not like that, as in «He is like the sea in generosity». Of the emphatic is that in which the thing likened to is annexed to the thing likened, as in: “The wind was playing with the branches, and the gold of late afternoon had run over the silver of the water.”<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>The last division is by the <b>particle<\/b>. If it is <b>dropped<\/b>, the simile is <b>emphatic<\/b> (<i>muʾakkad<\/i>): ‎<span class=\"arin\">هو بحر في الجود<\/span>‎. If it is <b>mentioned<\/b>, it is <b>unrestricted<\/b> (<i>mursal<\/i>): ‎<span class=\"arin\">هو كالبحر كرماً<\/span>‎.<\/p><p>A special kind of emphatic simile puts the thing likened to in an <i>iḍāfah<\/i> with the thing likened: ‎<span class=\"arin\">ذَهَبُ الْأَصِيْلِ<\/span>‎, \"the <i>gold<\/i> of late afternoon\" (the golden sunlight), and ‎<span class=\"arin\">لُجَيْنِ الْمَاءِ<\/span>‎, \"the <i>silver<\/i> of the water\" (the silvery water).<\/p><\/div><div class=\"chartbox\"><div class=\"chh\">DIVISIONS OF SIMILE AT A GLANCE · DRAWN BY THE COMPANION<\/div><table class=\"grid\"><thead><tr><th>By…<\/th><th>Divisions<\/th><\/tr><\/thead><tbody><tr><td>Its two terms<\/td><td>single/compound (4 kinds); malfūf, mafrūq; taswiyah, jamʿ<\/td><\/tr><tr><td>Its aspect of likeness<\/td><td>tamthīl / not tamthīl; mufaṣṣal / mujmal<\/td><\/tr><tr><td>Its particle<\/td><td>muʾakkad / mursal<\/td><\/tr><tr><td>Particle and aspect both dropped<\/td><td>tashbīh balīgh<\/td><\/tr><\/tbody><\/table><\/div><h3>THE THIRD DISCUSSION: ON THE PURPOSES OF SIMILE<span class=\"ar\">المبحث الثالث في أغراض التشبيه<\/span><\/h3><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 158<\/span><\/div><div class=\"ar\">الغرض من التشبيه: إمّا بيان إمكان المشبّه، نحو:<span class=\"bayt\"><span class=\"h1\">فَإِنْ تَفُقِ الأَنَامَ وَأَنْتَ مِنْهُمْ<\/span><span class=\"h2\">فَإِنَّ الْمِسْكَ بَعْضُ دَمِ الْغَزَالِ<\/span><\/span>فإنّه لَمّا ادّعى أنّ الممدوح مبائن لأصله بخصائص جعلته حقيقة منفردة، احتجّ على إمكان دعواه بتشبيهه بالمسك الذي أصله دم الغزال.<\/div><div class=\"tr\">The purpose of simile is either to show the possibility of the thing likened, as in: “If you surpass mankind while you are one of them — then musk is part of the gazelle’s blood.” For when he claimed that the one he praises is distinct from his origin through special qualities that have made him a unique reality, he argued for the possibility of his claim by likening him to musk, whose origin is the blood of the gazelle.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>Finally, the <b>purposes<\/b> of simile: why compare at all? Usually the purpose concerns the <b>thing likened<\/b>.<\/p><p>(1) <b>Showing that it is possible.<\/b> Al-Mutanabbī claims his patron is so superior that he is no longer like other people, a claim that sounds impossible. He proves it can be so: musk is part of a gazelle's blood, yet it has become something quite different and far finer.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 158–159<\/span><\/div><div class=\"ar\">وإمّا بيانُ حاله، كما في قوله:<span class=\"bayt\"><span class=\"h1\">كَأَنَّكَ شَمْسٌ وَالْمُلُوْكَ كَوَاكِبُ<\/span><span class=\"h2\">إِذَا طَلَعْتَ لَمْ يَبْدُ مِنْهُنَّ كَوْكَبُ<\/span><\/span><\/div><div class=\"tr\">Or to show its state, as in the poet’s words: “It is as if you were a sun and the kings were stars: when you rise, not one star of them appears.”<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>(2) <b>Showing its state<\/b>, when the listener does not know what it is like. The patron is like the sun and other kings like stars: when he appears, they cannot be seen at all.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 159<\/span><\/div><div class=\"ar\">وإمّا بيانُ مقدار حاله، كقوله:<span class=\"bayt\"><span class=\"h1\">فِيْهَا اثْنَتَانِ وَأَرْبَعُوْنَ حَلُوْبَةً<\/span><span class=\"h2\">سُوْداً كَخَافِيَةِ الْغُرَابِ الأَسْحَمِ<\/span><\/span>شبّه النُوقَ السُودَ بِخافية الغراب؛ بياناً لِمقدار سوادها.<\/div><div class=\"tr\">Or to show the degree of its state, as in the poet’s words: “In it are forty-two milch camels, black like the hidden wing-feathers of the jet-black raven.” He likened the black she-camels to the raven’s hidden wing-feathers, to show the degree of their blackness.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>(3) <b>Showing the degree<\/b> of its state, when the listener knows the quality but not how much of it. The camels are known to be black; the simile shows <b>how<\/b> black: as black as the inner wing-feathers of a raven.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 159–160<\/span><\/div><div class=\"ar\">وإمّا تقريرُ حاله، نحو:<span class=\"bayt\"><span class=\"h1\">إِنَّ الْقُلُوْبَ إِذَا تَنَافَرَ وُدُّهَا<\/span><span class=\"h2\">مِثْلُ الزُجَاجَةِ كَسْرُهَا لاَ يُجْبَرُ<\/span><\/span>شبّه تنافُرَ القلوب بكسر الزجاجة؛ تثبيتاً لتعذّر عودتِها إلى ما كانت عليه من المؤدّة.<\/div><div class=\"tr\">Or to establish its state firmly, as in: “Hearts, when their love has turned to aversion, are like glass: its breaking is not mended.” He likened the estrangement of hearts to the breaking of glass, to confirm that it is impossible for them to return to the affection they were in before.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>(4) <b>Establishing its state firmly.<\/b> The listener may already accept that estranged hearts do not reunite, but the image of broken glass, which can never be mended, fixes the idea firmly in his mind.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 160<\/span><\/div><div class=\"ar\">وإمّا تزيينُه، نحو:<span class=\"bayt\"><span class=\"h1\">سَوْدَاءُ وَاضِحَةُ الْجَبِيْنِ<\/span><span class=\"h2\">كَمُقْلَةِ الظَبْيِ الْغَرِيْرِ<\/span><\/span>شبّه سوادها بسواد مقلة الظبْيِ؛ تحسيناً لَها.<\/div><div class=\"tr\">Or to adorn it, as in: “A dark one with a bright brow, like the eye of the young, inexperienced gazelle.” He likened her blackness to the blackness of the gazelle’s eye, to make it appear beautiful.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>(5) <b>Making it beautiful.<\/b> A dark complexion is likened to the dark eye of a young gazelle, something everyone finds beautiful, so as to present it beautifully.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 160<\/span><\/div><div class=\"ar\">وإمّا تقبيحُه، نحو:<span class=\"bayt\"><span class=\"h1\">وَإِذَا أَشَارَ مُحَدِّثاً فَكَأَنَّهُ<\/span><span class=\"h2\">قِرْدٌ يُقَهْقِهُ أَوْ عَجُوْزٌ تَلْطِمُ<\/span><\/span><\/div><div class=\"tr\">Or to make it ugly, as in: “And when he gestures while speaking, it is as if he were an ape cackling, or an old woman slapping her face.”<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>(6) <b>Making it ugly.<\/b> The way a man gestures while talking is likened to a laughing monkey or an old woman slapping her face, to make it look ridiculous.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 161<\/span><\/div><div class=\"ar\">وقد يعود الغرض إلى المشبّه به، إذا عُكس طرفا التشبيه، نحو:<span class=\"bayt\"><span class=\"h1\">وَبَدَا الصَبَاحُ كَأَنَّ غُرَّتَهُ<\/span><span class=\"h2\">وَجْهُ الْخَلِيْفَةِ حِيْنَ يُمْتَدَحُ<\/span><\/span>ومثل هذا يسمّى بـ«التشبيه المقلوب».<\/div><div class=\"tr\">The purpose may go back to the thing likened to, when the two terms of the simile are reversed, as in: “And morning appeared, as if its blaze were the face of the caliph when he is praised.” A simile like this is called «the inverted simile» (al-tashbīh al-maqlūb).<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>Sometimes the purpose concerns the <b>thing likened to<\/b>. This happens in the <b>inverted simile<\/b> (<i>maqlūb<\/i>), where the two terms are swapped. Normally the caliph's face would be likened to the morning; here the morning is likened to the caliph's face. The point is that his face is so radiant that it, and not the dawn, is the standard of brightness.<\/p><\/div><div class=\"chartbox\"><div class=\"chh\">THE PURPOSES OF SIMILE · DRAWN BY THE COMPANION<\/div><table class=\"grid\"><thead><tr><th>Purpose<\/th><th>Book's example<\/th><\/tr><\/thead><tbody><tr><td>Showing it is possible ‎<span class=\"arin\">بيان إمكان المشبّه<\/span>‎<\/td><td>‎<span class=\"arin\">فَإِنَّ الْمِسْكَ بَعْضُ دَمِ الْغَزَالِ<\/span>‎<\/td><\/tr><tr><td>Showing its state ‎<span class=\"arin\">بيانِ حاله<\/span>‎<\/td><td>‎<span class=\"arin\">كَأَنَّكَ شَمْسٌ وَالْمُلُوْكَ كَوَاكِبُ<\/span>‎<\/td><\/tr><tr><td>Showing its degree ‎<span class=\"arin\">بيانُ مقدار حاله<\/span>‎<\/td><td>‎<span class=\"arin\">كَخَافِيَةِ الْغُرَابِ<\/span>‎<\/td><\/tr><tr><td>Establishing it ‎<span class=\"arin\">تقريرُ حاله<\/span>‎<\/td><td>‎<span class=\"arin\">مِثْلُ الزُجَاجَةِ كَسْرُهَا لاَ يُجْبَرُ<\/span>‎<\/td><\/tr><tr><td>Adorning it ‎<span class=\"arin\">تزيينُه<\/span>‎<\/td><td>‎<span class=\"arin\">كَمُقْلَةِ الظَبْيِ<\/span>‎<\/td><\/tr><tr><td>Making it ugly ‎<span class=\"arin\">تقبيحُه<\/span>‎<\/td><td>‎<span class=\"arin\">قِرْدٌ يُقَهْقِهُ<\/span>‎<\/td><\/tr><tr><td>(Inverted) for the thing likened to<\/td><td>‎<span class=\"arin\">وَجْهُ الْخَلِيْفَةِ<\/span>‎<\/td><\/tr><\/tbody><\/table><\/div><div class=\"cnote\"><span class=\"cnh\">COMPANION&#8217;S NOTE · NOT IN THE BOOK<\/span><b>Possible misprints, reproduced above as printed.<\/b> (1) p. 155 and p. 156: ‎<span class=\"arin\">«وجهَ الشبه»<\/span>‎ is printed with a shadda on the bāʾ in both places; the likely reading is ‎<span class=\"arin\">«وجهَ الشبه»<\/span>‎, as everywhere else in the chapter. (2) p. 160: ‎<span class=\"arin\">«من المؤدّة»<\/span>‎: the likely reading is ‎<span class=\"arin\">«من المودّة»<\/span>‎ (affection). (3) p. 151: ‎<span class=\"arin\">«رُؤُسِنَا»<\/span>‎ is printed without the second wāw; the usual spelling is ‎<span class=\"arin\">«رؤوسنا»<\/span>‎.<\/div><div class=\"box\"><div class=\"bh\">KEY TERMS AND THEIR MEANINGS · ADDED BY THE COMPANION<\/div><table class=\"terms\"><tr><td class=\"t\">ʿIlm al-bayān<\/td><td>The science of clear expression: a science in which simile, majāz and kināya are discussed<\/td><td class=\"a\">علم البيان<\/td><\/tr><tr><td class=\"t\">Tashbīh<\/td><td>Simile: attaching one thing to another in a quality, by a particle, for a purpose<\/td><td class=\"a\">التشبيه<\/td><\/tr><tr><td class=\"t\">Mushabbah<\/td><td>The thing likened<\/td><td class=\"a\">المشبّه<\/td><\/tr><tr><td class=\"t\">Mushabbah bihi<\/td><td>The thing likened to<\/td><td class=\"a\">المشبّه به<\/td><\/tr><tr><td class=\"t\">Ṭarafā al-tashbīh<\/td><td>The two terms of the simile (the thing likened and the thing likened to)<\/td><td class=\"a\">طرفَي التشبيه<\/td><\/tr><tr><td class=\"t\">Wajh al-shabah<\/td><td>The aspect of likeness: the particular quality in which the two terms are meant to share<\/td><td class=\"a\">وجه الشبه<\/td><\/tr><tr><td class=\"t\">Adāt al-tashbīh<\/td><td>The particle of simile: the word indicating resemblance, such as the kāf and «ka-anna»<\/td><td class=\"a\">أداة التشبيه<\/td><\/tr><tr><td class=\"t\">Ḥissī<\/td><td>Sensory: perceived, in itself or its material, by one of the five external senses<\/td><td class=\"a\">حسّيّ<\/td><\/tr><tr><td class=\"t\">ʿAqlī<\/td><td>Intellectual: neither it nor its material is perceived by the senses<\/td><td class=\"a\">عقليّ<\/td><\/tr><tr><td class=\"t\">Wahmī<\/td><td>Imaginary: a form the imagination invented, which would be sensed if it existed<\/td><td class=\"a\">الوهميّ<\/td><\/tr><tr><td class=\"t\">Tashbīh balīgh<\/td><td>The eloquent simile: the particle and the aspect are both dropped<\/td><td class=\"a\">تشبيه بليغ<\/td><\/tr><tr><td class=\"t\">Malfūf<\/td><td>Wrapped: the things likened are brought first, then the things they are likened to<\/td><td class=\"a\">ملفوف<\/td><\/tr><tr><td class=\"t\">Mafrūq<\/td><td>Separated: each thing likened is brought with what it is likened to, then another and another<\/td><td class=\"a\">مفروق<\/td><\/tr><tr><td class=\"t\">Tashbīh al-taswiya<\/td><td>Simile of equalisation: several things likened, one thing likened to<\/td><td class=\"a\">تشبيه التسوية<\/td><\/tr><tr><td class=\"t\">Tashbīh al-jamʿ<\/td><td>Simile of gathering: several things likened to, one thing likened<\/td><td class=\"a\">تشبيه الجمع<\/td><\/tr><tr><td class=\"t\">Tamthīl<\/td><td>Representation: a simile whose aspect is extracted from several things<\/td><td class=\"a\">تمثيل<\/td><\/tr><tr><td class=\"t\">Mufaṣṣal<\/td><td>Detailed: the aspect of likeness is mentioned<\/td><td class=\"a\">مفصّل<\/td><\/tr><tr><td class=\"t\">Mujmal<\/td><td>Summary: the aspect of likeness is not mentioned<\/td><td class=\"a\">مجمل<\/td><\/tr><tr><td class=\"t\">Muʾakkad<\/td><td>Emphatic: the particle has been dropped<\/td><td class=\"a\">مؤكّد<\/td><\/tr><tr><td class=\"t\">Mursal<\/td><td>Unrestricted: the particle is not dropped<\/td><td class=\"a\">مرسَل<\/td><\/tr><tr><td class=\"t\">Al-tashbīh al-maqlūb<\/td><td>The inverted simile: the two terms are reversed so the purpose goes back to the thing likened to<\/td><td class=\"a\">التشبيه المقلوب<\/td><\/tr><\/table><\/div><h3>QUESTIONS AND ANSWERS<span class=\"ar\">أسئلة وأجوبة<\/span><\/h3><div class=\"qabox\"><div class=\"qh\">QUESTIONS AND ANSWERS · ADDED BY THE COMPANION<\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>What three topics does <i>ʿilm al-bayān<\/i> study?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>Simile (<i>tashbīh<\/i>), figurative usage (<i>majāz<\/i>) and allusion (<i>kināyah<\/i>).<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>Define <i>tashbīh<\/i> and name its four pillars in ‎<span class=\"arin\">العلم كالنور في الهداية<\/span>‎.<\/div><div class=\"a\"><span class=\"k\">A.<\/span>Attaching one thing to another in a quality, by a particle, for a purpose. Mushabbah: ‎<span class=\"arin\">العلم<\/span>‎; mushabbah bihi: ‎<span class=\"arin\">النور<\/span>‎; wajh al-shabah: ‎<span class=\"arin\">الهداية<\/span>‎; adāh: ‎<span class=\"arin\">الكاف<\/span>‎.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>Give an example of two sensory terms, two intellectual terms, and mixed terms.<\/div><div class=\"a\"><span class=\"k\">A.<\/span>‎<span class=\"arin\">الورق كالحرير في النُعومة<\/span>‎؛ ‎<span class=\"arin\">الجهل كالموت<\/span>‎؛ ‎<span class=\"arin\">خُلقه كالعطر<\/span>‎.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>What follows ‎<span class=\"arin\">الكاف<\/span>‎ and what follows ‎<span class=\"arin\">كأنّ<\/span>‎?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>‎<span class=\"arin\">الكاف<\/span>‎ is followed by the thing likened to; ‎<span class=\"arin\">كأنّ<\/span>‎ by the thing likened.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>When does ‎<span class=\"arin\">كأنّ<\/span>‎ express doubt rather than simile?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>When its predicate is a derived word, as in ‎<span class=\"arin\">كأنّك فاهم<\/span>‎.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>What is a <i>tashbīh balīgh<\/i>? Give the book's example.<\/div><div class=\"a\"><span class=\"k\">A.<\/span>A simile with both the particle and the aspect dropped: ‎<span class=\"arin\">وَجَعَلْنَا اللَّيْلَ لِبَاساً<\/span>‎.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>Explain why Bashshār's line is compound to compound.<\/div><div class=\"a\"><span class=\"k\">A.<\/span>He likens the whole scene of dust with flashing swords to the whole scene of night with falling stars, not each part separately.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>Distinguish <i>malfūf<\/i> from <i>mafrūq<\/i>.<\/div><div class=\"a\"><span class=\"k\">A.<\/span>In <i>malfūf<\/i> the things likened come first, then the things likened to; in <i>mafrūq<\/i> each comes with its partner, pair after pair.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>What is <i>tamthīl<\/i>?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>A simile whose aspect of likeness is drawn from several things, like the Pleiades and a bunch of grape-blossoms.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>What is the difference between <i>muʾakkad<\/i> and <i>mursal<\/i>, and <i>mufaṣṣal<\/i> and <i>mujmal<\/i>?<\/div><div class=\"a\"><span class=\"k\">A.<\/span><i>Muʾakkad<\/i> drops the particle, <i>mursal<\/i> keeps it; <i>mufaṣṣal<\/i> mentions the aspect of likeness, <i>mujmal<\/i> does not.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>What purpose does the simile serve in ‎<span class=\"arin\">فَإِنْ تَفُقِ الأَنَامَ وَأَنْتَ مِنْهُمْ فَإِنَّ الْمِسْكَ بَعْضُ دَمِ الْغَزَالِ<\/span>‎?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>Showing the possibility of the thing likened: one can surpass one's origin, as musk surpasses the blood it comes from.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>What is an inverted simile? Give the book's example.<\/div><div class=\"a\"><span class=\"k\">A.<\/span>One where the terms are reversed so the purpose returns to the thing likened to: the morning is likened to the caliph's face.<\/div><\/div><\/div>", "terms": [{"t": "ʿIlm al-bayān", "m": "The science of clear expression: a science in which simile, majāz and kināya are discussed", "a": "علم البيان"}, {"t": "Tashbīh", "m": "Simile: attaching one thing to another in a quality, by a particle, for a purpose", "a": "التشبيه"}, {"t": "Mushabbah", "m": "The thing likened", "a": "المشبّه"}, {"t": "Mushabbah bihi", "m": "The thing likened to", "a": "المشبّه به"}, {"t": "Ṭarafā al-tashbīh", "m": "The two terms of the simile (the thing likened and the thing likened to)", "a": "طرفَي التشبيه"}, {"t": "Wajh al-shabah", "m": "The aspect of likeness: the particular quality in which the two terms are meant to share", "a": "وجه الشبه"}, {"t": "Adāt al-tashbīh", "m": "The particle of simile: the word indicating resemblance, such as the kāf and «ka-anna»", "a": "أداة التشبيه"}, {"t": "Ḥissī", "m": "Sensory: perceived, in itself or its material, by one of the five external senses", "a": "حسّيّ"}, {"t": "ʿAqlī", "m": "Intellectual: neither it nor its material is perceived by the senses", "a": "عقليّ"}, {"t": "Wahmī", "m": "Imaginary: a form the imagination invented, which would be sensed if it existed", "a": "الوهميّ"}, {"t": "Tashbīh balīgh", "m": "The eloquent simile: the particle and the aspect are both dropped", "a": "تشبيه بليغ"}, {"t": "Malfūf", "m": "Wrapped: the things likened are brought first, then the things they are likened to", "a": "ملفوف"}, {"t": "Mafrūq", "m": "Separated: each thing likened is brought with what it is likened to, then another and another", "a": "مفروق"}, {"t": "Tashbīh al-taswiya", "m": "Simile of equalisation: several things likened, one thing likened to", "a": "تشبيه التسوية"}, {"t": "Tashbīh al-jamʿ", "m": "Simile of gathering: several things likened to, one thing likened", "a": "تشبيه الجمع"}, {"t": "Tamthīl", "m": "Representation: a simile whose aspect is extracted from several things", "a": "تمثيل"}, {"t": "Mufaṣṣal", "m": "Detailed: the aspect of likeness is mentioned", "a": "مفصّل"}, {"t": "Mujmal", "m": "Summary: the aspect of likeness is not mentioned", "a": "مجمل"}, {"t": "Muʾakkad", "m": "Emphatic: the particle has been dropped", "a": "مؤكّد"}, {"t": "Mursal", "m": "Unrestricted: the particle is not dropped", "a": "مرسَل"}, {"t": "Al-tashbīh al-maqlūb", "m": "The inverted simile: the two terms are reversed so the purpose goes back to the thing likened to", "a": "التشبيه المقلوب"}], "part": [2, "ʿIlm al-Bayān", "علم البيان"]}, {"num": 13, "title": "Figurative Language", "ar": "المجاز", "body": "<h3>FIGURATIVE USAGE<span class=\"ar\">المجاز<\/span><\/h3><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 162–163<\/span><\/div><div class=\"ar\">هو اللفظ المستعمَل في غير ما وضع له لعلاقة مع قرينة مانعة من إرادة المعنى السابق، كالدُرَر المستعمَلة في الكلِمات الفصيحة في قولك: «فلان يتكلّم بالدرر»؛ فإنّها مستعملة في غير ما وضعت له؛ إذ قد وضعت في الأصل للآلِي الحقيقيّة، ثُمّ نقلت إلى الكلمات الفصيحة لعلاقة المشابهة بينهما في الحسن، والذي يمنع من إرادة المعنى الحقيقيّ قرينة «يتكلّم».<\/div><div class=\"tr\">It is the expression used in other than what it was coined for, because of a connection (<i>ʿalāqah<\/i>), together with an indication (<i>qarīnah<\/i>) that prevents the earlier meaning from being intended; like «pearls» used for eloquent words when you say: «So-and-so speaks pearls». It is used in other than what it was coined for, since it was originally coined for real pearls; then it was transferred to eloquent words because of the connection of resemblance between the two in beauty. What prevents the real meaning from being intended is the indication «speaks».<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>Every word has a meaning it was first made for: its <b>real<\/b> meaning (<i>ḥaqīqah<\/i>). <b>Majāz<\/b> is using a word for a <b>different<\/b> meaning. For this to be acceptable, two things are needed:<\/p><p>(1) A <b>connection<\/b> (<i>ʿalāqah<\/i>) between the real meaning and the new one, so the transfer makes sense. (2) A <b>clue<\/b> (<i>qarīnah<\/i>) that stops the listener from taking the real meaning.<\/p><p>In ‎<span class=\"arin\">فلان يتكلّم بالدرر<\/span>‎, \"So-and-so speaks pearls\": ‎<span class=\"arin\">الدرر<\/span>‎ really means pearls. Here it means beautiful words. The <b>connection<\/b> is resemblance: both are beautiful and precious. The <b>clue<\/b> is the word ‎<span class=\"arin\">يتكلّم<\/span>‎: no one can literally speak pearls.<\/p><\/div><div class=\"chartbox\"><div class=\"chh\">THE PARTS OF A MAJĀZ · DRAWN BY THE COMPANION<\/div><table class=\"grid\"><thead><tr><th><\/th><th>In ‎<span class=\"arin\">فلان يتكلّم بالدرر<\/span>‎<\/th><\/tr><\/thead><tbody><tr><td>The word<\/td><td>‎<span class=\"arin\">الدرر<\/span>‎<\/td><\/tr><tr><td>Its real meaning<\/td><td>real pearls<\/td><\/tr><tr><td>The meaning intended<\/td><td>eloquent words<\/td><\/tr><tr><td>The connection ‎<span class=\"arin\">العلاقة<\/span>‎<\/td><td>resemblance in beauty<\/td><\/tr><tr><td>The clue ‎<span class=\"arin\">القرينة<\/span>‎<\/td><td>‎<span class=\"arin\">يتكلّم<\/span>‎<\/td><\/tr><\/tbody><\/table><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 163<\/span><\/div><div class=\"ar\">وكالأصابع المستعملة في الأنامل في قوله تعالى: ﴿يَجْعَلُونَ أَصْابِعَهُمْ فِي آذَانِهِم﴾ [البقرة: ١٩]، فإنّها مستعملة في غير ما وضعت له لعلاقة أنّ الأنملة جزء من الأصبع، فاستعمل الكلّ في الجزء، وقرينة ذلك، أنّه لا يمكن جعل الأصابع بتمامها في الآذان.<\/div><div class=\"tr\">And like «fingers» used for fingertips in the words of Allah Most High: ﴿They put their fingers in their ears﴾ [al-Baqarah 2:19]. They are used in other than what they were coined for, because of the connection that the fingertip is a part of the finger; so the whole was used for the part. The indication of this is that it is not possible to put the fingers in their entirety into the ears.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>A second example with a different kind of connection. In ‎<span class=\"arin\">يَجْعَلُونَ أَصْابِعَهُمْ فِي آذَانِهِم<\/span>‎, \"fingers\" means <b>fingertips<\/b>, since only the tips go into the ears. The connection here is not resemblance: the fingertip is a <b>part<\/b> of the finger, so the word for the whole is used for the part. The clue is that a whole finger cannot fit in the ear.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 163–164<\/span><\/div><div class=\"ar\">والمجاز إن كانت علاقته المشابهة بين المعنى المجازيّ والمعنى الحقيقيّ، كما في المثال الأوّل، يسمّى «استعارة»، وإلاّ فــ«مجاز مرسل»، كما في المثال الثاني.<\/div><div class=\"tr\">If the connection of a <i>majāz<\/i> is resemblance between the figurative meaning and the real meaning, as in the first example, it is called «borrowing» (<i>istiʿārah<\/i>); otherwise it is «loose figurative usage» (<i>majāz mursal<\/i>), as in the second example.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>These two examples show the two great kinds of <i>majāz<\/i>. If the connection is <b>resemblance<\/b>, as with pearls and words, it is called <b>istiʿārah<\/b> (borrowing). If the connection is <b>anything else<\/b>, as with fingers and fingertips, it is called <b>majāz mursal<\/b> (loose figurative usage).<\/p><\/div><div class=\"chartbox\"><div class=\"chh\">THE DIVISIONS OF MAJĀZ IN THIS CHAPTER · DRAWN BY THE COMPANION<\/div><div class=\"tree\"><div class=\"node\">Majāz<span class=\"ar\">المجاز<\/span><\/div><div class=\"stem\"><\/div><div class=\"bar\" style=\"margin:0 16.67%\"><\/div><div class=\"row\"><div class=\"col\"><div class=\"node\">In a word (lughawī)<\/div><div class=\"stem\"><\/div><div class=\"bar\" style=\"margin:0 25.00%\"><\/div><div class=\"row\"><div class=\"col\"><div class=\"node\">Istiʿārah<span class=\"ar\">الاستعارة<\/span><\/div><div class=\"sub\">connection: resemblance<\/div><\/div><div class=\"col\"><div class=\"node\">Majāz mursal<span class=\"ar\">المجاز المرسل<\/span><\/div><div class=\"sub\">other connections<\/div><\/div><\/div><\/div><div class=\"col\"><div class=\"node\">In a compound<span class=\"ar\">المركّب<\/span><\/div><div class=\"stem\"><\/div><div class=\"bar\" style=\"margin:0 25.00%\"><\/div><div class=\"row\"><div class=\"col\"><div class=\"node\">Majāz murakkab<\/div><div class=\"sub\">not resemblance<\/div><\/div><div class=\"col\"><div class=\"node\">Istiʿārah tamthīliyyah<\/div><div class=\"sub\">resemblance<\/div><\/div><\/div><\/div><div class=\"col\"><div class=\"node\">Majāz ʿaqlī<span class=\"ar\">المجاز العقلي<\/span><\/div><div class=\"sub\">in the attribution<\/div><\/div><\/div><\/div><\/div><h3>BORROWING<span class=\"ar\">الاستعارة<\/span><\/h3><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 165<\/span><\/div><div class=\"ar\">الاستعارة: هي مَجاز علاقته المشابهة، كقوله تعالى: ﴿كِتَابٌ أَنزَلْنَاهُ إِلَيْكَ لِتُخْرِجَ النَّاسَ مِنَ الظُّلُمَاتِ إِلَى النُّورِ﴾ [إبراهيم: ١]، أي: من الضلال إلى الهدى؛ فقد استعملت الظلمات والنور في غير معناهما الحقيقيّ، والعلاقة المشابهة بين الضلال والظلام والهدى والنور، والقرينة ما قبل ذلك.<\/div><div class=\"tr\"><i>Istiʿārah<\/i> is a <i>majāz<\/i> whose connection is resemblance, as in the words of Allah Most High: ﴿A Book which We have sent down to you, so that you may bring people out of the darknesses into the light﴾ [Ibrāhīm 14:1], that is, from misguidance to guidance. «Darknesses» and «light» have been used in other than their real meaning; the connection is the resemblance between misguidance and darkness, and between guidance and light; and the indication is what comes before that.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Istiʿārah<\/b> in the Qurʾān: the Book brings people \"from the darknesses into the light\". The real meaning of ‎<span class=\"arin\">الظُّلُمَاتِ<\/span>‎ and ‎<span class=\"arin\">النُّورِ<\/span>‎ is physical darkness and light, but here they mean misguidance and guidance. The connection is resemblance: a misguided person cannot see his way, like someone in the dark; a guided person sees clearly, like someone in the light. The clue is the context: a Book does not bring people out of physical darkness.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 165–166<\/span><\/div><div class=\"ar\">وأصل الاستعارة: تشبيهٌ حُذف أحد طرفَيه، ووجه شبهه، وأداتُه. والمشبّه يسمّى «مستعارا له»، والمشبّه به «مستعاراً منه»، ففي هذا المثال، المستعار له: هو الضلال والهدى، والمستعار منه هو معنى الظلام والنور، ولفظ الظلمات والنور يسمّى «مستعاراً».<\/div><div class=\"tr\">The basis of <i>istiʿārah<\/i> is a simile from which one of its two terms has been omitted, as well as its point of resemblance and its particle. The thing likened is called «that for which [the word] is borrowed» (<i>mustaʿār lahu<\/i>), and the thing it is likened to «that from which [it] is borrowed» (<i>mustaʿār minhu<\/i>). So in this example, the <i>mustaʿār lahu<\/i> is misguidance and guidance, the <i>mustaʿār minhu<\/i> is the meaning of darkness and light, and the words «darknesses» and «light» are called «the borrowed» (<i>mustaʿār<\/i>).<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>This is the key to understanding <i>istiʿārah<\/i>: it is a <b>simile<\/b> with almost everything removed. Start with \"misguidance is like darkness in not seeing the way\". Remove the thing likened (misguidance), the particle and the aspect of likeness, and you are left with just \"darkness\", used to mean misguidance.<\/p><p>The terms change: the thing likened becomes the <b>mustaʿār lahu<\/b> (what the word is borrowed <i>for<\/i>); the thing likened to becomes the <b>mustaʿār minhu<\/b> (what it is borrowed <i>from<\/i>); and the word itself is the <b>mustaʿār<\/b> (the borrowed word).<\/p><\/div><div class=\"chartbox\"><div class=\"chh\">FROM SIMILE TO ISTIʿĀRAH · DRAWN BY THE COMPANION<\/div><table class=\"grid\"><thead><tr><th>Simile<\/th><th>Istiʿārah<\/th><th>In the verse<\/th><\/tr><\/thead><tbody><tr><td>Mushabbah ‎<span class=\"arin\">المشبّه<\/span>‎<\/td><td>Mustaʿār lahu ‎<span class=\"arin\">مستعار له<\/span>‎<\/td><td>misguidance, guidance<\/td><\/tr><tr><td>Mushabbah bihi ‎<span class=\"arin\">المشبّه به<\/span>‎<\/td><td>Mustaʿār minhu ‎<span class=\"arin\">مستعار منه<\/span>‎<\/td><td>the meaning of darkness, light<\/td><\/tr><tr><td>(the word for the mushabbah bihi)<\/td><td>Mustaʿār ‎<span class=\"arin\">مستعار<\/span>‎<\/td><td>the words ‎<span class=\"arin\">الظُّلُمَاتِ<\/span>‎، ‎<span class=\"arin\">النُّورِ<\/span>‎<\/td><\/tr><tr><td>Particle, aspect of likeness<\/td><td>dropped<\/td><td>—<\/td><\/tr><\/tbody><\/table><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 166–167<\/span><\/div><div class=\"ar\">وتنقسم الاستعارة إلى مصرّحة، وهي ما صرّح بلفظ المشبه به كما في قوله:<span class=\"bayt\"><span class=\"h1\">فَأَمْطَرَتْ لُؤْلُؤاً مِنْ نَرْجِسٍ وَسَقَتْ<\/span><span class=\"h2\">وَرْداً وَعَضَّتْ عَلَى الْعُنَّابِ بِالْبَرَدِ<\/span><\/span>فقد استعار اللؤلؤ والنرجس والورد والعنّاب والبرَد للدُموع والعُيون والْخُدود والأنامل والأسنان.<\/div><div class=\"tr\"><i>Istiʿārah<\/i> is divided into the explicit (<i>muṣarraḥah<\/i>), which is that in which the word for the thing likened-to is stated explicitly, as in the poet’s words:<br><i>So she rained pearls from narcissi, and watered / roses, and bit upon jujubes with hail.<\/i><br>He borrowed «pearls», «narcissi», «roses», «jujubes» and «hail» for tears, eyes, cheeks, fingertips and teeth.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>Istiʿārah is divided by <b>which term is kept<\/b>. In the <b>explicit<\/b> kind (<i>muṣarraḥah<\/i>), the word for the thing likened-to is stated openly, and the thing likened is left out.<\/p><p>The famous line describes a weeping girl without naming any part of her: she <b>rained pearls<\/b> (tears) <b>from narcissi<\/b> (her eyes), <b>watered roses<\/b> (her cheeks), and <b>bit jujubes<\/b> (her hennaed fingertips) <b>with hail<\/b> (her white teeth). Five borrowings in one line.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 167<\/span><\/div><div class=\"ar\">وإلى مكنيّة: وهي ما حُذف فيها المشبّه به، ورُمز إليه بشيء من لوازمِه، كقوله تعالى: ﴿وَاخْفِضْ لَهُمَا جَنَاحَ الذُّلِّ مِنَ الرَّحْمَةِ﴾ [بني إسرائيل: ٢٤]. فقد استعار الطائر للذلّ ثُمّ حذَفه ودلّ عليه بشيء من لوازمه وهو الجناح، وإثبات الجناح للذلّ يسمّونه «استعارة تخييليّة».<\/div><div class=\"tr\">And into the implicit (<i>makniyyah<\/i>), which is that in which the thing likened-to is omitted and alluded to by one of its concomitants, as in the words of Allah Most High: ﴿And lower to them the wing of humility out of mercy﴾ [Banī Isrāʾīl 17:24]. He borrowed the bird for humility, then omitted it and indicated it by one of its concomitants, namely the wing. Affirming the wing for humility they call «imaginative borrowing» (<i>istiʿārah takhyīliyyah<\/i>).<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>In the <b>implicit<\/b> kind (<i>makniyyah<\/i>), it is the other way round: the thing likened-to is <b>left out<\/b>, and only one of its features is mentioned as a hint.<\/p><p>In ‎<span class=\"arin\">وَاخْفِضْ لَهُمَا جَنَاحَ الذُّلِّ<\/span>‎, humility is likened to a <b>bird<\/b> that lowers its wing over its young. The bird is not mentioned; only its <b>wing<\/b> is, attached to humility. Giving humility a \"wing\" is what the scholars call <b>takhyīliyyah<\/b> (imaginative), because it makes you picture humility as a bird.<\/p><\/div><div class=\"chartbox\"><div class=\"chh\">MUṢARRAḤAH AND MAKNIYYAH · DRAWN BY THE COMPANION<\/div><table class=\"grid\"><thead><tr><th><\/th><th>Muṣarraḥah ‎<span class=\"arin\">مصرّحة<\/span>‎<\/th><th>Makniyyah ‎<span class=\"arin\">مكنيّة<\/span>‎<\/th><\/tr><\/thead><tbody><tr><td>Which term is stated?<\/td><td>the thing likened-to<\/td><td>the thing likened<\/td><\/tr><tr><td>Which is left out?<\/td><td>the thing likened<\/td><td>the thing likened-to (only a feature of it is mentioned)<\/td><\/tr><tr><td>Book's example<\/td><td>‎<span class=\"arin\">فَأَمْطَرَتْ لُؤْلُؤاً<\/span>‎<\/td><td>‎<span class=\"arin\">جَنَاحَ الذُّلِّ<\/span>‎<\/td><\/tr><\/tbody><\/table><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 168<\/span><\/div><div class=\"ar\">وينقسم الاستعارة إلى أصليّة، وهي ما كان فيها المستعار اسماً غير مشتقّ، كاستعارة الظلام للضلال والنورِ للهدى، وإلى تبعيّة، وهي ما كان فيها المستعار فعلاً أو حرفاً أو اسماً مشتقًّا، نحو: «فلان ركب كتِفَي غريْمِه»، أي: لازَمَه مُلازَمة شديدة، وقوله تعالى: ﴿أُوْلَـئِكَ عَلَى هُدًى مِّن رَّبِّهِمْ﴾ [البقرة : ٥]. أي: تَمكّنوا من الحصول على الهداية التامّة،<\/div><div class=\"tr\"><i>Istiʿārah<\/i> is divided into the primary (<i>aṣliyyah<\/i>), which is that in which the borrowed word is a non-derived noun, like borrowing «darkness» for misguidance and «light» for guidance; and into the dependent (<i>tabaʿiyyah<\/i>), which is that in which the borrowed word is a verb, a particle or a derived noun, as in: «So-and-so rode on the two shoulders of his debtor», that is, he stuck to him closely; and the words of Allah Most High: ﴿Those are upon guidance from their Lord﴾ [al-Baqarah 2:5], that is, they have been firmly enabled to attain complete guidance;<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>Istiʿārah is also divided by the <b>kind of word<\/b> borrowed.<\/p><b>Primary<\/b> (<i>aṣliyyah<\/i>): the borrowed word is a non-derived noun, like ‎<span class=\"arin\">الظلام<\/span>‎ and ‎<span class=\"arin\">النور<\/span>‎. The borrowing happens directly in that word.<b>Dependent<\/b> (<i>tabaʿiyyah<\/i>): the borrowed word is a verb, a particle or a derived noun. The borrowing happens first in the idea behind the word (its <i>maṣdar<\/i>, or the meaning of the particle), and the word follows it. \"He <b>rode<\/b> on his debtor's shoulders\": the verb ‎<span class=\"arin\">ركب<\/span>‎ is borrowed to mean clinging to him closely. In ‎<span class=\"arin\">عَلَى هُدًى<\/span>‎, the particle ‎<span class=\"arin\">عَلَى<\/span>‎ (on top of) is borrowed to show how firmly they hold to guidance, like someone mounted on a riding animal.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 169<\/span><\/div><div class=\"ar\">ونحو قوله:<span class=\"bayt\"><span class=\"h1\">وَلَئِنْ نَطَقْتُ بِشُكْرِ بِرِّكَ مُفْصِحاً<\/span><span class=\"h2\">فَلِسَانُ حَالِيْ بِالشِكَايَةِ أَنْطَقُ<\/span><\/span>ونحو: «أذقته لباس الموت»، أي: ألبسته إياه.<\/div><div class=\"tr\">and like the poet’s words:<br><i>And if I speak out plainly in thanks for your kindness, / then the tongue of my state speaks more eloquently with complaint.<\/i><br>And like: «I made him taste the garment of death», that is, I clothed him in it.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>Two more examples of the dependent kind. In the line, ‎<span class=\"arin\">فَلِسَانُ حَالِيْ ... أَنْطَقُ<\/span>‎: a person's state cannot literally speak; ‎<span class=\"arin\">أَنْطَقُ<\/span>‎ (a derived word) is borrowed for <i>showing clearly<\/i>. His condition shows his complaint more clearly than any words of thanks.<\/p><p>\"I made him <b>taste<\/b> the garment of death\" means I clothed him in it: ‎<span class=\"arin\">أذقته<\/span>‎ is borrowed for making someone experience something fully.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 170–171<\/span><\/div><div class=\"ar\">وتنقسم الاستعارة إلى مرشّحة: وهي ما ذكر فيها ملائم المشبّه به، نحوّ ﴿أُوْلَـئِكَ الَّذِينَ اشْتَرَوُاْ الضَّلاَلَةَ بِالْهُدَى فَمَا رَبِحَت تِّجَارَتُهُمْ﴾ [البقرة: ١٦]. فالاشتراء مستعار للاستبدال، وذكر الربح والتجارة ترشيح، وإلى مجرّدة، وهي التي ذُكر فيها ملائم المشبّه، نحو: ﴿فَأَذَاقَهَا اللّهُ لِبَاسَ الْجُوعِ وَالْخَوْفِ﴾ [النحل: ١١٢]. والإذاقة تجريد لذلك،<\/div><div class=\"tr\"><i>Istiʿārah<\/i> is also divided into the reinforced (<i>murashshaḥah<\/i>), which is that in which something suited to the thing likened-to is mentioned, as in ﴿Those are the ones who have bought misguidance for guidance; so their trade has not profited﴾ [al-Baqarah 2:16]. «Buying» is borrowed for exchanging, and the mention of profit and trade is reinforcement (<i>tarshīḥ<\/i>); and into the stripped (<i>mujarradah<\/i>), which is that in which something suited to the thing likened is mentioned, as in ﴿So Allah made it taste the garment of hunger and fear﴾ [al-Naḥl 16:112]. «Making taste» is a stripping (<i>tajrīd<\/i>) of that;<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>Istiʿārah is also divided by <b>what is added to it<\/b>.<\/p><b>Reinforced<\/b> (<i>murashshaḥah<\/i>): something that suits the <b>thing likened-to<\/b> is added, strengthening the image. \"They <b>bought<\/b> misguidance with guidance\" borrows <i>buying<\/i> for exchanging; then \"their <b>trade<\/b> did not <b>profit<\/b>\" adds more words from buying and selling.<b>Stripped<\/b> (<i>mujarradah<\/i>): something that suits the <b>thing likened<\/b> is added. In ‎<span class=\"arin\">فَأَذَاقَهَا اللّهُ لِبَاسَ الْجُوعِ وَالْخَوْفِ<\/span>‎, <i>garment<\/i> is borrowed for what covers them completely; then <b>taste<\/b>, which suits hunger and fear rather than a garment, is added.<\/div><div class=\"cnote\"><span class=\"cnh\">COMPANION&#8217;S NOTE · NOT IN THE BOOK<\/span><p>On p. 170 the word ‎<span class=\"arin\">الضَّلاَلَةَ<\/span>‎ in the matn is partly covered by black marks in the scan; only ‎<span class=\"arin\">ال<\/span>‎ and the shaddah with fatḥah over the ḍād are visible. It is supplied from the text of the verse (al-Baqarah 2:16), ‎<span class=\"arin\">الضَّلاَلَةَ<\/span>‎. The word before the verse is printed ‎<span class=\"arin\">«نحوّ»<\/span>‎ with a shaddah and without a colon; it is reproduced as printed, and the intended reading is ‎<span class=\"arin\">«نحو:»<\/span>‎.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 171<\/span><\/div><div class=\"ar\">وإلى مُطلَقة، وهي التي لَم يُذكر معها ملائِم، نحو: ﴿يَنقُضُونَ عَهْدَ اللَّهِ ﴾ [البقرة: ٢٧]. ولا يعتبر الترشيح والتجريد إلاّ بعد تمام الاستعارة بالقرينة.<\/div><div class=\"tr\">And into the unqualified (<i>muṭlaqah<\/i>), which is that with which nothing suited [to either term] is mentioned, as in ﴿They break the covenant of Allah﴾ [al-Baqarah 2:27]. Reinforcement and stripping are only taken into account after the <i>istiʿārah<\/i> has been completed by its indication (<i>qarīnah<\/i>).<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Unqualified<\/b> (<i>muṭlaqah<\/i>): nothing is added for either side. \"They <b>break<\/b> the covenant of Allah\": breaking (as of a rope) is borrowed for violating a covenant, and nothing further is added.<p>The book adds a precise rule: the clue that makes it a borrowing is not counted as reinforcement or stripping. Only what comes <b>after<\/b> the borrowing is complete with its clue is counted.<\/p><\/div><div class=\"chartbox\"><div class=\"chh\">ISTIʿĀRAH BY WHAT IS ADDED · DRAWN BY THE COMPANION<\/div><table class=\"grid\"><thead><tr><th>Kind<\/th><th>Adds something suiting…<\/th><th>Book's example<\/th><\/tr><\/thead><tbody><tr><td>Murashshaḥah ‎<span class=\"arin\">مرشّحة<\/span>‎<\/td><td>the thing likened-to<\/td><td>‎<span class=\"arin\">فَمَا رَبِحَت تِّجَارَتُهُمْ<\/span>‎<\/td><\/tr><tr><td>Mujarradah ‎<span class=\"arin\">مجرّدة<\/span>‎<\/td><td>the thing likened<\/td><td>‎<span class=\"arin\">فَأَذَاقَهَا اللّهُ لِبَاسَ<\/span>‎<\/td><\/tr><tr><td>Muṭlaqah ‎<span class=\"arin\">مُطلَقة<\/span>‎<\/td><td>nothing<\/td><td>‎<span class=\"arin\">يَنقُضُونَ عَهْدَ اللَّهِ<\/span>‎<\/td><\/tr><\/tbody><\/table><\/div><h3>LOOSE FIGURATIVE USAGE<span class=\"ar\">المجاز المرسل<\/span><\/h3><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 172<\/span><\/div><div class=\"ar\">هو مَجاز علاقته غيرُ المشابَهة:<\/div><div class=\"tr\">It is a <i>majāz<\/i> whose connection is something other than resemblance:<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>Now the second kind of <i>majāz<\/i>: <b>majāz mursal<\/b>, whose connection is anything other than resemblance. The book lists eight connections. In each, ask: how is the real meaning linked to the intended one?<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 172<\/span><\/div><div class=\"ar\">(١) كالسببيّة في قولك: «عظمت يد فلان»، أي: نِعمتُه التي سببها اليد.<\/div><div class=\"tr\">(1) Like causation (<i>sababiyyah<\/i>), when you say: «So-and-so’s hand has become great», that is, his favour, whose cause is the hand.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Cause<\/b>: \"His <b>hand<\/b> has become great\" means his <b>favours<\/b> have become great. The hand is the cause of giving, so the cause is named for what it produces.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 172<\/span><\/div><div class=\"ar\">(٢) والمسببيّةِ في قولك: «أمطرت السماء نَبَاتاً»، أي: مطراً يتسبّب عنه النبات.<\/div><div class=\"tr\">(2) And being-caused (<i>musabbabiyyah<\/i>), when you say: «The sky rained vegetation», that is, rain from which vegetation is caused.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Effect<\/b>: \"The sky rained <b>vegetation<\/b>\" means it rained <b>rain<\/b>, which causes plants to grow. The result is named for its cause.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 172<\/span><\/div><div class=\"ar\">(٣) والجزئيّةِ في قولك: «أرسلت العيون لتطّلع على أحوال العدوّ»، أي: الجواسيسَ.<\/div><div class=\"tr\">(3) And being a part (<i>juzʾiyyah<\/i>), when you say: «I sent the eyes to look into the enemy’s situation», that is, the spies.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Part<\/b>: \"I sent the <b>eyes<\/b>\" means the spies. The eye is the part of the spy that matters most for his job, so the part is named for the whole person.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 173<\/span><\/div><div class=\"ar\">(٤) والكليّةِ في قوله تعالى: ﴿يَجْعَلُونَ أَصْابِعَهُمْ فِي آذَانِهِم﴾ [البقرة: ١٩]. أي: أناملَهم.<\/div><div class=\"tr\">(4) And being the whole (<i>kulliyyah<\/i>), in the words of Allah Most High: ﴿They put their fingers in their ears﴾ [al-Baqarah 2:19], that is, their fingertips.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Whole<\/b>: \"fingers\" for fingertips, as you saw at the start of the chapter. The whole is named for the part.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 173<\/span><\/div><div class=\"ar\">(٥) واعتبارِ ما كان في قوله تعالى: ﴿وَآتُواْ الْيَتَامَى أَمْوَالَهُمْ﴾ [النساء: ٢]. أي: البالغين.<\/div><div class=\"tr\">(5) And regard for what was, in the words of Allah Most High: ﴿And give the orphans their property﴾ [al-Nisāʾ 4:2], that is, those who have come of age.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>What it was<\/b>: \"Give the <b>orphans<\/b> their property.\" Property is handed over when they have grown up, when they are no longer orphans. They are called orphans because of what they <b>were<\/b>.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 173<\/span><\/div><div class=\"ar\">(٦) واعتبارِ ما يكون في قوله تعالى: ﴿إِنِّي أَرَانِي أَعْصِرُ خَمْراً﴾ [يوسف: ٣٦]. أي: عِنَباً.<\/div><div class=\"tr\">(6) And regard for what will be, in the words of Allah Most High: ﴿I saw myself pressing wine﴾ [Yūsuf 12:36], that is, grapes.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>What it will be<\/b>: \"I saw myself pressing <b>wine<\/b>.\" One presses grapes, not wine; the grapes are called wine because of what they <b>will become<\/b>.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 173<\/span><\/div><div class=\"ar\">(٧) والمحلّيّةِ، نحو: «قرّر المجلس ذلك»، أي: أهلُه.<\/div><div class=\"tr\">(7) And being the place (<i>maḥalliyyah<\/i>), as in: «The assembly decided that», that is, its members.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>The place<\/b>: \"The <b>assembly<\/b> decided\" means the people in it. The place is named for those who occupy it.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 173<\/span><\/div><div class=\"ar\">(٨) والحالّيّة في قوله تعالى: ﴿فَفِي رَحْمَةِ اللّهِ هُمْ فِيهَا خَالِدُونَ﴾ [آل عمران: ١٠٧]. أي: جنّتِه.<\/div><div class=\"tr\">(8) And being what occupies a place (<i>ḥālliyyah<\/i>), in the words of Allah Most High: ﴿Then in the mercy of Allah — they will abide in it forever﴾ [Āl ʿImrān 3:107], that is, His Garden.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>What occupies the place<\/b>: \"in the <b>mercy<\/b> of Allah they will abide forever\" means in Paradise, the place where His mercy is found. What is in the place is named for the place itself.<\/div><div class=\"chartbox\"><div class=\"chh\">THE CONNECTIONS OF MAJĀZ MURSAL · DRAWN BY THE COMPANION<\/div><table class=\"grid\"><thead><tr><th>Connection<\/th><th>Book's example<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Cause ‎<span class=\"arin\">السببيّة<\/span>‎<\/td><td>‎<span class=\"arin\">عظمت يد فلان<\/span>‎<\/td><td>his favours<\/td><\/tr><tr><td>Effect ‎<span class=\"arin\">المسببيّة<\/span>‎<\/td><td>‎<span class=\"arin\">أمطرت السماء نَبَاتاً<\/span>‎<\/td><td>rain<\/td><\/tr><tr><td>Part ‎<span class=\"arin\">الجزئيّة<\/span>‎<\/td><td>‎<span class=\"arin\">أرسلت العيون<\/span>‎<\/td><td>spies<\/td><\/tr><tr><td>Whole ‎<span class=\"arin\">الكليّة<\/span>‎<\/td><td>‎<span class=\"arin\">أَصْابِعَهُمْ<\/span>‎<\/td><td>fingertips<\/td><\/tr><tr><td>What it was ‎<span class=\"arin\">اعتبارِ ما كان<\/span>‎<\/td><td>‎<span class=\"arin\">الْيَتَامَى<\/span>‎<\/td><td>those now grown up<\/td><\/tr><tr><td>What it will be ‎<span class=\"arin\">اعتبارِ ما يكون<\/span>‎<\/td><td>‎<span class=\"arin\">أَعْصِرُ خَمْراً<\/span>‎<\/td><td>grapes<\/td><\/tr><tr><td>The place ‎<span class=\"arin\">المحلّيّة<\/span>‎<\/td><td>‎<span class=\"arin\">قرّر المجلس<\/span>‎<\/td><td>its members<\/td><\/tr><tr><td>What occupies it ‎<span class=\"arin\">الحالّيّة<\/span>‎<\/td><td>‎<span class=\"arin\">فَفِي رَحْمَةِ اللّهِ<\/span>‎<\/td><td>Paradise<\/td><\/tr><\/tbody><\/table><\/div><h3>COMPOUND FIGURATIVE USAGE<span class=\"ar\">المجاز المركّب<\/span><\/h3><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 174–175<\/span><\/div><div class=\"ar\">المركّب إن استُعمل في غير ما وضع له؛ فإن كان لعلاقة غير المشابهة سُمّي «مجازاً مركّباً»، كالجمَل الخبريّة إذا استُعملت في الإنشاء، نحو قوله:<span class=\"bayt\"><span class=\"h1\">هَوَايَ مَعَ الرَكْبِ الْيَمَانِيْنَ مُصْعِدُ<\/span><span class=\"h2\">جَنِيْبٌ وَجُثْمَانِيْ بِمَكَّةَ مُوْثَقُ<\/span><\/span>فليس الغرض من هذا البيت الإخبار بل إظهار التحزّن والتحسّر،<\/div><div class=\"tr\">A compound expression, if it is used in other than what it was coined for: if that is because of a connection other than resemblance, it is called «compound <i>majāz<\/i>» (<i>majāz murakkab<\/i>), like declarative sentences when they are used for non-declarative speech (<i>inshāʾ<\/i>), as in the poet’s words:<br><i>My love goes up with the Yemeni riders, / led alongside, while my body is held fast in Makkah.<\/i><br>The purpose of this verse is not to give information, but to show grief and sorrow;<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>So far <i>majāz<\/i> has been in a single word. It can also be in a <b>whole sentence<\/b> used for a meaning other than its own. If the connection is <b>not resemblance<\/b>, it is called <b>majāz murakkab<\/b>.<\/p><p>The commonest case is a <b>statement used for another purpose<\/b> (Chapter III). The lover's line \"my love has gone with the Yemeni riders, while my body is tied up in Makkah\" is not meant to inform anyone; it expresses his grief.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 175<\/span><\/div><div class=\"ar\">وإن كانت علاقته المشابهةَ سُمّي «استعارة تمثيليّة»، كما يقال للمتردّد في أمر: «أراك تُقدِّم رِجلاً وتُؤخِّر أخرى».<\/div><div class=\"tr\">and if its connection is resemblance, it is called «representational borrowing» (<i>istiʿārah tamthīliyyah<\/i>), as is said to someone hesitating over a matter: «I see you putting one foot forward and drawing the other back».<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>If the connection is <b>resemblance<\/b>, it is an <b>istiʿārah tamthīliyyah<\/b>: a whole scene is borrowed for another scene. \"I see you putting one foot forward and drawing the other back\" is said to someone who cannot make up his mind. The picture of a man stepping forward and back is borrowed for the state of hesitation. It is often used like a proverb.<\/p><\/div><h3>RATIONAL FIGURATIVE USAGE<span class=\"ar\">المجاز العقليّ<\/span><\/h3><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 176<\/span><\/div><div class=\"ar\">هو إسناد الفعل أو ما في معناه إلى غير ما هو له عند المتكلّم في الظاهر لعلاقة، نحو قوله:<span class=\"bayt\"><span class=\"h1\">أَشَابَ الصَغِيْرَ وَأَفْنَى الْكَبِيْـ<\/span><span class=\"h2\">ـرَ كَرُّ الْغَدَاةِ وَمَرُّ الْعَشِيِّ<\/span><\/span>فإنّ إسناد الإشابة والإفناء إلى كرّ الغداة ومرور العشيّ إسناد إلى غير ما هو له؛ إذ الْمُشيب والْمُفنِي في الحقيقة هو الله تعالى.<\/div><div class=\"tr\">It is the attribution (<i>isnād<\/i>) of a verb, or of what has the sense of a verb, to other than what it belongs to in the speaker’s view as it outwardly appears, because of a connection; as in the poet’s words:<br><i>The young were made grey and the old were made to perish / by the returning of the morning and the passing of the evening.<\/i><br>Attributing making-grey and making-perish to the returning of the morning and the passing of the evening is an attribution to other than what it belongs to, since the one who makes grey and makes perish in reality is Allah Most High.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>The last kind is quite different: <b>majāz ʿaqlī<\/b> (rational <i>majāz<\/i>). Here every word keeps its real meaning; the figure lies in the <b>attribution<\/b>: a verb is attributed to something that is not its real doer, because of a connection.<\/p><p>In the line, greying the young and destroying the old are attributed to \"the coming of morning and the passing of evening\", that is, to time. But the real doer is Allah. Time is the setting in which it happens, so the action is attributed to it. The book says \"in the speaker's view as it outwardly appears\": a believing poet who says this knows Allah is the doer; his words only attribute it to time.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 177<\/span><\/div><div class=\"ar\">ومن الْمجاز العقليّ:<br>(١) إسناد ما بُنِي للفاعل إلى المفعول، نحو:﴿عِيشَةٍ رَّاضِيَةٍ﴾[الحاقة: ٢١].<\/div><div class=\"tr\">And of the rational <i>majāz<\/i> is:<br>(1) Attributing what is built for the active to the object, as in: ﴿a pleased (<i>rāḍiyah<\/i>) life﴾ [al-Ḥāqqah 69:21].<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>The book lists six forms of <i>majāz ʿaqlī<\/i>. (1) Giving an <b>active<\/b> form to what is really the object: ‎<span class=\"arin\">عِيشَةٍ رَّاضِيَةٍ<\/span>‎, \"a <i>pleased<\/i> life\". The life does not feel pleased; the person living it is pleased <i>with<\/i> it.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 177<\/span><\/div><div class=\"ar\">(٢) وعكسُه، نحو: «سَيل مُفعَم».<\/div><div class=\"tr\">(2) And its reverse, as in: «a filled (<i>mufʿam<\/i>) torrent».<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>(2) The reverse, a <b>passive<\/b> form for what is really the doer: ‎<span class=\"arin\">سَيل مُفعَم<\/span>‎, \"a <i>filled<\/i> torrent\". The torrent is what fills (the valley); it is not filled.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 177<\/span><\/div><div class=\"ar\">(٣) والإسنادُ إلى المصدر، نحو: «جدّ جِدّه».<\/div><div class=\"tr\">(3) And attribution to the verbal noun, as in: «His earnestness was earnest».<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>(3) Attributing to the <b>maṣdar<\/b>: ‎<span class=\"arin\">جدّ جِدّه<\/span>‎, \"his earnestness was earnest\". It is the person who is earnest, not his earnestness.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 177<\/span><\/div><div class=\"ar\">(٤) وإلى الزمان، نحو: «نَهاره صائم».<\/div><div class=\"tr\">(4) And to the time, as in: «His day is fasting».<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>(4) Attributing to the <b>time<\/b>: ‎<span class=\"arin\">نَهاره صائم<\/span>‎, \"his day is fasting\". The man fasts during the day; the day does not fast.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 177<\/span><\/div><div class=\"ar\">(٥) وإلى المكان، نحو: «نَهر جارٍ».<\/div><div class=\"tr\">(5) And to the place, as in: «a flowing river».<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>(5) Attributing to the <b>place<\/b>: ‎<span class=\"arin\">نَهر جارٍ<\/span>‎, \"a flowing river\". It is the water that flows; the river is the channel it flows in.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 178<\/span><\/div><div class=\"ar\">(٦) وإلى السبب، نحو: «بَنَى أمير المدينةَ».<\/div><div class=\"tr\">(6) And to the cause, as in: «The governor built the city».<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>(6) Attributing to the <b>cause<\/b>: \"The governor built the city.\" The workers built it; the governor caused it by ordering it.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 178<\/span><\/div><div class=\"ar\">ويعلم مِمّا سبق أنّ المجاز اللغويّ يكون في اللفظ، والمجازَ العقليّ يكون في الإسناد.<\/div><div class=\"tr\">It is known from what has preceded that the linguistic <i>majāz<\/i> is in the expression, and the rational <i>majāz<\/i> is in the attribution.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>The book sums up the difference: <b>linguistic majāz<\/b> (istiʿārah and majāz mursal) is in the <b>word<\/b>, which is used for a meaning not its own; <b>rational majāz<\/b> is in the <b>attribution<\/b>, where the words keep their meanings but the action is linked to the wrong doer.<\/p><\/div><div class=\"chartbox\"><div class=\"chh\">MAJĀZ ʿAQLĪ: ATTRIBUTED TO… · DRAWN BY THE COMPANION<\/div><table class=\"grid\"><thead><tr><th>Attributed to<\/th><th>Book's example<\/th><th>Real doer<\/th><\/tr><\/thead><tbody><tr><td>The object (active form)<\/td><td>‎<span class=\"arin\">عِيشَةٍ رَّاضِيَةٍ<\/span>‎<\/td><td>the one living it<\/td><\/tr><tr><td>The doer (passive form)<\/td><td>‎<span class=\"arin\">سَيل مُفعَم<\/span>‎<\/td><td>the torrent fills<\/td><\/tr><tr><td>The maṣdar<\/td><td>‎<span class=\"arin\">جدّ جِدّه<\/span>‎<\/td><td>the person<\/td><\/tr><tr><td>The time<\/td><td>‎<span class=\"arin\">نَهاره صائم<\/span>‎<\/td><td>the person<\/td><\/tr><tr><td>The place<\/td><td>‎<span class=\"arin\">نَهر جارٍ<\/span>‎<\/td><td>the water<\/td><\/tr><tr><td>The cause<\/td><td>‎<span class=\"arin\">بَنَى أمير المدينةَ<\/span>‎<\/td><td>the builders<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box\"><div class=\"bh\">KEY TERMS AND THEIR MEANINGS · ADDED BY THE COMPANION<\/div><table class=\"terms\"><tr><td class=\"t\">Majāz<\/td><td>An expression used in other than what it was coined for, because of a connection, with an indication preventing the original meaning<\/td><td class=\"a\">المجاز<\/td><\/tr><tr><td class=\"t\">ʿAlāqah<\/td><td>The connection between the original and the figurative meaning that makes the transfer suitable<\/td><td class=\"a\">العلاقة<\/td><\/tr><tr><td class=\"t\">Qarīnah<\/td><td>The indication that prevents the original meaning from being intended<\/td><td class=\"a\">القرينة<\/td><\/tr><tr><td class=\"t\">Istiʿārah<\/td><td>A <i>majāz<\/i> whose connection is resemblance<\/td><td class=\"a\">الاستعارة<\/td><\/tr><tr><td class=\"t\">Majāz mursal<\/td><td>A <i>majāz<\/i> whose connection is other than resemblance<\/td><td class=\"a\">المجاز المرسل<\/td><\/tr><tr><td class=\"t\">Mustaʿār lahu<\/td><td>The thing likened, for which the word is borrowed<\/td><td class=\"a\">مستعار له<\/td><\/tr><tr><td class=\"t\">Mustaʿār minhu<\/td><td>The thing likened-to, from which the word is borrowed<\/td><td class=\"a\">مستعار منه<\/td><\/tr><tr><td class=\"t\">Mustaʿār<\/td><td>The borrowed word itself<\/td><td class=\"a\">مستعار<\/td><\/tr><tr><td class=\"t\">Istiʿārah muṣarraḥah<\/td><td>Explicit borrowing: the word for the thing likened-to is stated<\/td><td class=\"a\">مصرّحة<\/td><\/tr><tr><td class=\"t\">Istiʿārah makniyyah<\/td><td>Implicit borrowing: the thing likened-to is omitted and alluded to by a concomitant<\/td><td class=\"a\">مكنيّة<\/td><\/tr><tr><td class=\"t\">Istiʿārah takhyīliyyah<\/td><td>Imaginative borrowing: affirming the concomitant (e.g. the wing) for the thing likened<\/td><td class=\"a\">استعارة تخييليّة<\/td><\/tr><tr><td class=\"t\">Aṣliyyah<\/td><td>Primary: the borrowed word is a non-derived noun<\/td><td class=\"a\">أصليّة<\/td><\/tr><tr><td class=\"t\">Tabaʿiyyah<\/td><td>Dependent: the borrowed word is a verb, a particle or a derived noun<\/td><td class=\"a\">تبعيّة<\/td><\/tr><tr><td class=\"t\">Murashshaḥah<\/td><td>Reinforced: something suited to the thing likened-to is mentioned<\/td><td class=\"a\">مرشّحة<\/td><\/tr><tr><td class=\"t\">Mujarradah<\/td><td>Stripped: something suited to the thing likened is mentioned<\/td><td class=\"a\">مجرّدة<\/td><\/tr><tr><td class=\"t\">Muṭlaqah<\/td><td>Unqualified: nothing suited to either term is mentioned<\/td><td class=\"a\">مُطلَقة<\/td><\/tr><tr><td class=\"t\">Majāz murakkab<\/td><td>A compound expression used in other than what it was coined for, with a connection other than resemblance<\/td><td class=\"a\">مجاز مركّب<\/td><\/tr><tr><td class=\"t\">Istiʿārah tamthīliyyah<\/td><td>A compound expression used in other than its meaning, with resemblance as its connection<\/td><td class=\"a\">استعارة تمثيليّة<\/td><\/tr><tr><td class=\"t\">Al-majāz al-ʿaqlī<\/td><td>Attributing a verb or what has its sense to other than what it belongs to, in the speaker’s outward view, because of a connection<\/td><td class=\"a\">المجاز العقليّ<\/td><\/tr><\/table><\/div><h3>QUESTIONS AND ANSWERS<span class=\"ar\">أسئلة وأجوبة<\/span><\/h3><div class=\"qabox\"><div class=\"qh\">QUESTIONS AND ANSWERS · ADDED BY THE COMPANION<\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>Define <i>majāz<\/i>. What are the <i>ʿalāqah<\/i> and the <i>qarīnah<\/i> in ‎<span class=\"arin\">فلان يتكلّم بالدرر<\/span>‎?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>An expression used for other than what it was made for, because of a connection, with a clue preventing the real meaning. The connection is resemblance in beauty; the clue is ‎<span class=\"arin\">يتكلّم<\/span>‎.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>What is the difference between <i>istiʿārah<\/i> and <i>majāz mursal<\/i>?<\/div><div class=\"a\"><span class=\"k\">A.<\/span><i>Istiʿārah<\/i>'s connection is resemblance; <i>majāz mursal<\/i>'s connection is something else.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>Explain how an <i>istiʿārah<\/i> is a simile with parts removed, using ‎<span class=\"arin\">مِنَ الظُّلُمَاتِ إِلَى النُّورِ<\/span>‎.<\/div><div class=\"a\"><span class=\"k\">A.<\/span>\"Misguidance is like darkness\": the thing likened, the particle and the aspect are dropped, leaving \"darkness\" for misguidance. Misguidance is the <i>mustaʿār lahu<\/i>, darkness the <i>mustaʿār minhu<\/i>, the word the <i>mustaʿār<\/i>.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>Distinguish <i>muṣarraḥah<\/i> from <i>makniyyah<\/i> with examples.<\/div><div class=\"a\"><span class=\"k\">A.<\/span>In <i>muṣarraḥah<\/i> the thing likened-to is stated (‎<span class=\"arin\">فَأَمْطَرَتْ لُؤْلُؤاً<\/span>‎); in <i>makniyyah<\/i> it is left out and hinted at by a feature (‎<span class=\"arin\">جَنَاحَ الذُّلِّ<\/span>‎).<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>When is an <i>istiʿārah<\/i> <i>aṣliyyah<\/i> and when <i>tabaʿiyyah<\/i>?<\/div><div class=\"a\"><span class=\"k\">A.<\/span><i>Aṣliyyah<\/i> when the borrowed word is a non-derived noun; <i>tabaʿiyyah<\/i> when it is a verb, particle or derived noun.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>Why is ‎<span class=\"arin\">أُوْلَـئِكَ الَّذِينَ اشْتَرَوُاْ الضَّلاَلَةَ بِالْهُدَى فَمَا رَبِحَت تِّجَارَتُهُمْ<\/span>‎ <i>murashshaḥah<\/i>?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>\"Buying\" is borrowed for exchanging, and \"profit\" and \"trade\", which suit buying (the thing likened-to), are added.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>Name the connection in each: ‎<span class=\"arin\">أمطرت السماء نَبَاتاً<\/span>‎؛ ‎<span class=\"arin\">وَآتُواْ الْيَتَامَى أَمْوَالَهُمْ<\/span>‎؛ ‎<span class=\"arin\">قرّر المجلس ذلك<\/span>‎.<\/div><div class=\"a\"><span class=\"k\">A.<\/span>Effect; what it was; the place.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>What is the difference between <i>majāz murakkab<\/i> and <i>istiʿārah tamthīliyyah<\/i>?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>Both are whole sentences used for another meaning; the first's connection is not resemblance, the second's is resemblance.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>Define <i>majāz ʿaqlī<\/i> and explain ‎<span class=\"arin\">أَشَابَ الصَغِيْرَ وَأَفْنَى الْكَبِيْرَ كَرُّ الْغَدَاةِ وَمَرُّ الْعَشِيِّ<\/span>‎.<\/div><div class=\"a\"><span class=\"k\">A.<\/span>Attributing a verb to other than its real doer, because of a connection. Greying and destroying are attributed to the passing of time, though the real doer is Allah.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>Where does linguistic <i>majāz<\/i> lie, and where does rational <i>majāz<\/i> lie?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>Linguistic <i>majāz<\/i> is in the word; rational <i>majāz<\/i> is in the attribution.<\/div><\/div><\/div>", "terms": [{"t": "Majāz", "m": "An expression used in other than what it was coined for, because of a connection, with an indication preventing the original meaning", "a": "المجاز"}, {"t": "ʿAlāqah", "m": "The connection between the original and the figurative meaning that makes the transfer suitable", "a": "العلاقة"}, {"t": "Qarīnah", "m": "The indication that prevents the original meaning from being intended", "a": "القرينة"}, {"t": "Istiʿārah", "m": "A <i>majāz<\/i> whose connection is resemblance", "a": "الاستعارة"}, {"t": "Majāz mursal", "m": "A <i>majāz<\/i> whose connection is other than resemblance", "a": "المجاز المرسل"}, {"t": "Mustaʿār lahu", "m": "The thing likened, for which the word is borrowed", "a": "مستعار له"}, {"t": "Mustaʿār minhu", "m": "The thing likened-to, from which the word is borrowed", "a": "مستعار منه"}, {"t": "Mustaʿār", "m": "The borrowed word itself", "a": "مستعار"}, {"t": "Istiʿārah muṣarraḥah", "m": "Explicit borrowing: the word for the thing likened-to is stated", "a": "مصرّحة"}, {"t": "Istiʿārah makniyyah", "m": "Implicit borrowing: the thing likened-to is omitted and alluded to by a concomitant", "a": "مكنيّة"}, {"t": "Istiʿārah takhyīliyyah", "m": "Imaginative borrowing: affirming the concomitant (e.g. the wing) for the thing likened", "a": "استعارة تخييليّة"}, {"t": "Aṣliyyah", "m": "Primary: the borrowed word is a non-derived noun", "a": "أصليّة"}, {"t": "Tabaʿiyyah", "m": "Dependent: the borrowed word is a verb, a particle or a derived noun", "a": "تبعيّة"}, {"t": "Murashshaḥah", "m": "Reinforced: something suited to the thing likened-to is mentioned", "a": "مرشّحة"}, {"t": "Mujarradah", "m": "Stripped: something suited to the thing likened is mentioned", "a": "مجرّدة"}, {"t": "Muṭlaqah", "m": "Unqualified: nothing suited to either term is mentioned", "a": "مُطلَقة"}, {"t": "Majāz murakkab", "m": "A compound expression used in other than what it was coined for, with a connection other than resemblance", "a": "مجاز مركّب"}, {"t": "Istiʿārah tamthīliyyah", "m": "A compound expression used in other than its meaning, with resemblance as its connection", "a": "استعارة تمثيليّة"}, {"t": "Al-majāz al-ʿaqlī", "m": "Attributing a verb or what has its sense to other than what it belongs to, in the speaker’s outward view, because of a connection", "a": "المجاز العقليّ"}], "part": null}, {"num": 14, "title": "Metonymy", "ar": "الكناية", "body": "<h3>METONYMY<span class=\"ar\">الكناية<\/span><\/h3><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 179<\/span><\/div><div class=\"ar\">هي لفظ أريد به لازم معناه مع جواز إرادة ذلك المعنى، نحو: «طويل النِجاد»، أي: طويل القامة.<\/div><div class=\"tr\">It is an expression by which what is necessarily attached to its meaning (<i>lāzim maʿnāh<\/i>) is intended, while it remains permissible to intend that meaning [itself]; as in: “long of sword-belt”, i.e. tall of stature.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Kināyah<\/b> (allusion, metonymy) is saying one thing in order to point to <b>something that goes with it<\/b>. \"Long of sword-belt\" points to being <b>tall<\/b>: a tall man needs a long belt to carry his sword.<p>The key difference from <i>majāz<\/i> is in the last part of the definition: <b>the real meaning may also be intended<\/b>. The man may really have a long sword-belt; nothing in the sentence rules it out. In <i>majāz<\/i>, by contrast, the clue <b>prevents<\/b> the real meaning (no one literally speaks pearls).<\/p><\/div><div class=\"chartbox\"><div class=\"chh\">MAJĀZ AND KINĀYAH · DRAWN BY THE COMPANION<\/div><table class=\"grid\"><thead><tr><th><\/th><th>Majāz ‎<span class=\"arin\">المجاز<\/span>‎<\/th><th>Kināyah ‎<span class=\"arin\">الكناية<\/span>‎<\/th><\/tr><\/thead><tbody><tr><td>What is meant<\/td><td>a meaning other than the word's own<\/td><td>something that goes with the word's meaning<\/td><\/tr><tr><td>Can the real meaning also be meant?<\/td><td>No: the clue prevents it<\/td><td>Yes: it remains possible<\/td><\/tr><tr><td>Book's example<\/td><td>‎<span class=\"arin\">يتكلّم بالدرر<\/span>‎<\/td><td>‎<span class=\"arin\">طويل النِجاد<\/span>‎<\/td><\/tr><\/tbody><\/table><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 179<\/span><\/div><div class=\"ar\">وتنقسم باعتبار الْمَكنِيّ عنه إلى ثلاثة أقسام:<\/div><div class=\"tr\">It is divided, with respect to the thing alluded to (<i>al-maknī ʿanhu<\/i>), into three divisions:<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>Kināyah is divided according to <b>what is being pointed to<\/b> (<i>al-maknī ʿanhu<\/i>): a quality, an attribution, or a thing.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 179–180<\/span><\/div><div class=\"ar\">الأوّل: كناية يكون المكنِيّ عنه فيها صفةً، كقول الخنساء:<span class=\"bayt\"><span class=\"h1\">طَوِيْلُ النِجَادِ رَفِيْعُ العِمَادِ<\/span><span class=\"h2\">كَثِيْرُ الرَمَادِ إِذَا مَا شَتَا<\/span><\/span>تريد أنّه طويل القامة سيّد كريم.<\/div><div class=\"tr\">The first: a <i>kināyah<\/i> in which the thing alluded to is a quality, as in the words of al-Khansāʾ:<br>“Long of sword-belt, lofty of tent-pole, abundant of ashes when winter comes.”<br>She means that he is tall of stature, a chief, generous.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Pointing to a quality.<\/b> Al-Khansāʾ praises her brother with three allusions, each pointing to a quality:<p>‎<span class=\"arin\">طَوِيْلُ النِجَادِ<\/span>‎ (long sword-belt) → he is <b>tall<\/b>. ‎<span class=\"arin\">رَفِيْعُ العِمَادِ<\/span>‎ (high tent-pole) → he is a <b>chief<\/b>, since the leader's tent stands tallest. ‎<span class=\"arin\">كَثِيْرُ الرَمَادِ إِذَا مَا شَتَا<\/span>‎ (much ash in winter) → he is <b>generous<\/b>, cooking for many guests in the hard season.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 180<\/span><\/div><div class=\"ar\">والثاني: كناية يكون المكنيّ عنه فيها نسبةً، نحو: «الْمجد بين ثوبَيه والكرم تحت رِدائه»، تريد نسبة المجد والكرم إليه.<\/div><div class=\"tr\">The second: a <i>kināyah<\/i> in which the thing alluded to is an attribution, as in: “Glory is between his two garments, and nobility beneath his cloak” — you mean the attribution of glory and nobility to him.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Pointing to an attribution.<\/b> Here the quality itself is named openly (glory, nobility); what is hidden is the <b>link<\/b> to the person. Instead of \"he is glorious and noble\", the speaker says glory is <b>between his garments<\/b> and nobility <b>under his cloak<\/b>. Since what is inside his clothes is him, the qualities are linked to him without saying so directly.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 181<\/span><\/div><div class=\"ar\">والثالث: كناية يكون المكنيّ عنه فيها غيرَ صفة ولا نسبة، كقوله:<span class=\"bayt\"><span class=\"h1\">اَلضَارِبِيْنَ بِكُلِّ أَبْيَضَ مُخْذِمٍ<\/span><span class=\"h2\">وَالطَاعِنِيْنَ مَجَامِعَ الأَضْغَانِ<\/span><\/span>فإنّه كَنَى بمجامع الأضغان عن القلوب.<\/div><div class=\"tr\">The third: a <i>kināyah<\/i> in which the thing alluded to is neither a quality nor an attribution, as in his words:<br>“Those who strike with every white, sharp-cutting [blade], and who thrust at the gathering-places of rancour.”<br>For he alluded to the hearts by “the gathering-places of rancour”.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Pointing to something that is neither<\/b>: a thing itself. \"The gathering-places of rancour\" points to the <b>hearts<\/b>, since that is where hatred is held. The warriors thrust their spears at their enemies' hearts.<\/div><div class=\"chartbox\"><div class=\"chh\">KINĀYAH BY WHAT IS POINTED TO · DRAWN BY THE COMPANION<\/div><table class=\"grid\"><thead><tr><th>Pointed to<\/th><th>Book's example<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>A quality ‎<span class=\"arin\">صفة<\/span>‎<\/td><td>‎<span class=\"arin\">طَوِيْلُ النِجَادِ<\/span>‎، ‎<span class=\"arin\">كَثِيْرُ الرَمَادِ<\/span>‎<\/td><td>tall; generous<\/td><\/tr><tr><td>An attribution ‎<span class=\"arin\">نسبة<\/span>‎<\/td><td>‎<span class=\"arin\">الْمجد بين ثوبَيه<\/span>‎<\/td><td>glory belongs to him<\/td><\/tr><tr><td>Neither (a thing) ‎<span class=\"arin\">غيرَ صفة ولا نسبة<\/span>‎<\/td><td>‎<span class=\"arin\">مَجَامِعَ الأَضْغَانِ<\/span>‎<\/td><td>the hearts<\/td><\/tr><\/tbody><\/table><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 181–182<\/span><\/div><div class=\"ar\">والكناية إن كثرت فيها الوسائط، سُمّيت «تلويحاً»، نحو: «هو كثير الرماد»، أي: كريم؛ فإنّ كثرة الرماد تستلزم كثرة الإحراق، وكثرة الإحراق تستلزم كثرة الطبخ والخبز، وكثرتهما تستلزم كثرة الآكلين، وهي تستلزم كثرة الضِيفان، وكثرة الضيفان تستلزم الكرم.<\/div><div class=\"tr\">If the intermediaries in a <i>kināyah<\/i> are many, it is called <i>talwīḥ<\/i> (pointing from afar), as in: “He has abundant ashes”, i.e. he is generous. For abundance of ashes entails abundant burning; abundant burning entails much cooking and baking; the abundance of these two entails many eaters; that entails many guests; and many guests entail generosity.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>Kināyah is also named by <b>how many steps<\/b> (<i>wasāʾiṭ<\/i>) the mind takes from the words to the meaning.<\/p><b>Talwīḥ<\/b> (pointing from afar): many steps. \"He has much ash\" → much burning → much cooking and baking → many people eating → many guests → he is generous. The book sets out every link of the chain.<\/div><div class=\"chartbox\"><div class=\"chh\">THE STEPS IN ‎<span class=\"arin\">كثير الرماد<\/span>‎ · DRAWN BY THE COMPANION<\/div><table class=\"grid\"><thead><tr><th>Step<\/th><th>…entails<\/th><\/tr><\/thead><tbody><tr><td>1. Much ash ‎<span class=\"arin\">كثرة الرماد<\/span>‎<\/td><td>much burning ‎<span class=\"arin\">كثرة الإحراق<\/span>‎<\/td><\/tr><tr><td>2. Much burning<\/td><td>much cooking and baking ‎<span class=\"arin\">كثرة الطبخ والخبز<\/span>‎<\/td><\/tr><tr><td>3. Much cooking and baking<\/td><td>many eaters ‎<span class=\"arin\">كثرة الآكلين<\/span>‎<\/td><\/tr><tr><td>4. Many eaters<\/td><td>many guests ‎<span class=\"arin\">كثرة الضِيفان<\/span>‎<\/td><\/tr><tr><td>5. Many guests<\/td><td><b>generosity<\/b> ‎<span class=\"arin\">الكرم<\/span>‎<\/td><\/tr><\/tbody><\/table><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 182<\/span><\/div><div class=\"ar\">وإن قلّت وخفيت سُمّيت «رَمْزاً»، نحو: «هو سمين رِخْو»، أي: غبِيّ بليد،<\/div><div class=\"tr\">If they are few and hidden, it is called <i>ramz<\/i> (hint), as in: “He is fat and flabby”, i.e. dull and stupid.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Ramz<\/b> (a hint): few steps, but <b>hidden<\/b>. \"He is fat and flabby\" points to his being dull and slow-witted. The link is short but not obvious.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 182<\/span><\/div><div class=\"ar\">وإن قلّت فيها الوسائط أو لَم تكن ووضحت سُمّيت «إيماءً وإشارةً»، نحو:<span class=\"bayt\"><span class=\"h1\">أَوَمَا رَأَيْتَ الْمَجْدَ أَلْقَى رَحْلَهُ<\/span><span class=\"h2\">فِيْ آلِ طَلْحَةَ ثُمَّ لَمْ يَتَحَوَّلِ<\/span><\/span>كناية عن كونهم أمجاداً.<\/div><div class=\"tr\">If the intermediaries in it are few, or there are none, and it is clear, it is called <i>īmāʾ<\/i> (gesture) and <i>ishārah<\/i> (pointing), as in:<br>“Have you not seen that glory has set down its baggage among the family of Ṭalḥah, and then has not moved away?”<br>— a <i>kināyah<\/i> for their being glorious.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Īmāʾ<\/b> or <b>ishārah<\/b> (a gesture): few steps or none, and <b>clear<\/b>. Glory \"set down its baggage among the family of Ṭalḥah and never moved on\": like a traveller who has found his home, glory has settled permanently with them. The meaning is easy to see: they are glorious.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 183<\/span><\/div><div class=\"ar\">وهناك نوع من الكناية يُعتمَد في فهمه على السياق، يُسمّى «تعريضاً»، وهو إمالة الكلام إلى عُرض، أي: ناحية، كقولك لشخص يضرّ الناسَ: «خير الناس من ينفعُهم».<\/div><div class=\"tr\">There is also a kind of <i>kināyah<\/i> whose understanding relies on the context (<i>siyāq<\/i>); it is called <i>taʿrīḍ<\/i> (hinting aside). It is inclining the speech towards a side (<i>ʿurḍ<\/i>), i.e. a direction; as when you say to someone who harms people: “The best of people is the one who benefits them.”<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>Last, <b>taʿrīḍ<\/b> (hinting aside): a
