  $("#qexam").onclick=()=>{startQuiz("exam",20);route("quiz")};
  $("#qwrong").onclick=()=>{startQuiz("mistakes",Math.min(20,wrongN));route("quiz")};
};
const scopeName=s=>s==="all"?"Whole book":s==="exam"?"Exam questions":s==="mistakes"?"My mistakes":`Chapter ${ROMAN[+s]} · ${CH.find(c=>String(c.num)===s).title}`;
function startQuiz(scope,count){quiz={scope,qs:makeQuestions(scope,count),i:0,score:0,picked:null,done:false}}
function drawQ(){const v=$("#qv"),q=quiz.qs[quiz.i];
  if(!q){v.innerHTML=`<div class="empty glass card">There are no questions in this set yet.</div>`;quiz.done=true;return}
  v.innerHTML=`<div class="row" style="justify-content:space-between"><div><div class="eyebrow">${scopeName(quiz.scope)}</div><div class="muted num" style="margin-top:2px">Question ${quiz.i+1} of ${quiz.qs.length} · ${quiz.score} correct</div></div><button class="btn ghost" id="quit">End quiz</button></div>
  <div class="bar-track"><div class="bar-fill" style="width:${quiz.i/quiz.qs.length*100}%"></div></div>
  <section class="qcard glass"><div class="qprompt">${q.prompt}</div><div class="opts">${q.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${"ABCD"[i]}</span><span>${o}</span></button>`).join("")}</div>
  <div id="qafter"></div></section>`;
  $$(".opt").forEach(b=>b.onclick=()=>pick(+b.dataset.i));
  $("#quit").onclick=()=>{finishQuiz()};
}
function pick(i){const q=quiz.qs[quiz.i];if(quiz.picked!==null)return;quiz.picked=i;const ok=i===q.ans;if(ok)quiz.score++;
  S._wrong=S._wrong||{};if(q.id){if(ok)delete S._wrong[q.id];else S._wrong[q.id]=1}
  $$(".opt").forEach((b,j)=>{b.disabled=true;if(j===q.ans)b.classList.add("right");else if(j===i)b.classList.add("wrong")});
  $("#qafter").innerHTML=`<div class="explain">${ok?"<b>Correct.</b> ":"<b>Not quite.</b> "}${q.explain}</div><div class="qfoot" style="margin-top:12px"><span></span><button class="btn primary" id="qnext">${quiz.i+1<quiz.qs.length?"Next question":"See result"} ${ic("right")}</button></div>`;
  $("#qnext").onclick=()=>{quiz.i++;quiz.picked=null;if(quiz.i>=quiz.qs.length)finishQuiz();else drawQ()};$("#qnext").focus()}
addEventListener("keydown",e=>{if(cur.view!=="quiz"||!quiz||quiz.done)return;if("abcd1234".includes(e.key.toLowerCase())&&e.key.length===1&&quiz.picked===null){const i="abcd".indexOf(e.key.toLowerCase());pick(i>=0?i:+e.key-1)}else if(e.key==="Enter"&&$("#qnext"))$("#qnext").click()});
function finishQuiz(){const answered=quiz.i+(quiz.picked!==null?1:0);quiz.done=true;
  if(answered){S.quiz.push({scope:quiz.scope,score:quiz.score,total:answered,date:today()});touchDay();save()}
  const pct=answered?Math.round(quiz.score/answered*100):0;
  $("#main").innerHTML=topbar("Quiz")+`<div class="view"><section class="card glass" style="text-align:center;padding:40px 24px">
    <div class="eyebrow">${scopeName(quiz.scope)}</div><div class="score-big" style="margin:14px 0 6px">${quiz.score}<span class="muted">/${answered}</span></div>
    <p class="lede" style="margin:0 auto 20px">${pct>=90?"Excellent. You know this well.":pct>=70?"Good work. Review the ones you missed.":pct>=40?"A fair start. Read the chapter again, then try once more.":"Go back through the chapter, then try again."}</p>
    <div class="row" style="justify-content:center"><button class="btn primary" id="again">${ic("shuffle")} Try another</button>${/^\d+$/.test(quiz.scope)?`<button class="btn" data-go="read" data-arg="${quiz.scope}">${ic("book")} Read Chapter ${ROMAN[+quiz.scope]}</button>`:""}<button class="btn" data-go="quiz">All quizzes</button></div></section></div>`;
  $("#again").onclick=()=>{startQuiz(quiz.scope==="mistakes"?"all":quiz.scope,quiz.qs.length);route("quiz")};drawNav()}

/* ---------------- SEARCH ---------------- */
function openSearch(q0){
  const ov=document.createElement("div");ov.className="overlay";ov.innerHTML=`<div class="spanel glass" role="dialog" aria-label="Search"><div class="sin">${ic("search",'style="width:20px;height:20px;color:var(--fg-3)"')}<input id="sq" placeholder="Search chapters, terms and questions" value="${esc(q0)}"><kbd>Esc</kbd></div><div class="res" id="sr"></div></div>`;
  document.body.appendChild(ov);const inp=$("#sq",ov);inp.focus();let sel=0,hits=[];
  const close=()=>ov.remove();
  ov.addEventListener("click",e=>{if(e.target===ov)close()});
  const run=()=>{const q=inp.value.trim().toLowerCase();hits=[];if(q.length<2){$("#sr",ov).innerHTML=`<div class="empty">Type at least two letters. Arabic works too.</div>`;return}
    TERMS.forEach(t=>{if((t.t+" "+strip(t.m)+" "+t.a).toLowerCase().includes(q))hits.push({w:`Term · Chapter ${ROMAN[t.ch]}`,s:`<span class="arin">${t.a}</span> <b>${t.t}</b>: ${strip(t.m)}`,go:()=>{route("glossary");}, ch:t.ch,q:t.t})});
    CH.forEach(c=>{let i=c.text.toLowerCase().indexOf(q),k=0;while(i>=0&&k<4){const s=Math.max(0,i-60);const snip=esc(c.text.slice(s,i))+"<mark>"+esc(c.text.slice(i,i+q.length))+"</mark>"+esc(c.text.slice(i+q.length,i+q.length+80));
      const raw=c.text.slice(i,i+q.length);hits.push({w:`Chapter ${ROMAN[c.num]} · ${c.title}`,s:(s?"…":"")+snip+"…",go:()=>{pendingHit=raw;route("read",c.num)}});i=c.text.toLowerCase().indexOf(q,i+q.length);k++}});
    hits=hits.slice(0,60);sel=0;
    $("#sr",ov).innerHTML=hits.length?hits.map((h,i)=>`<button class="r ${i===0?"sel":""}" data-i="${i}"><div class="w">${h.w}</div><div class="s">${h.s}</div></button>`).join(""):`<div class="empty">Nothing found for “${esc(inp.value)}”.</div>`;
    $$(".r",ov).forEach(b=>b.onclick=()=>{close();hits[+b.dataset.i].go()})};
  inp.oninput=run;run();
  inp.onkeydown=e=>{if(e.key==="Escape")close();else if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();sel=Math.max(0,Math.min(hits.length-1,sel+(e.key==="ArrowDown"?1:-1)));$$(".r",ov).forEach((b,i)=>b.classList.toggle("sel",i===sel));const s=$$(".r",ov)[sel];s&&s.scrollIntoView({block:"nearest"})}
    else if(e.key==="Enter"&&hits[sel]){close();hits[sel].go()}};
}


/* ================= liquid motion ================= */
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
function addRims(root=document){$$(".glass",root).forEach(g=>{if(!g.querySelector(":scope > .rim")){const r=document.createElement("span");r.className="rim";g.prepend(r)}})}
let litEl=null;
if(!reduce){
  addEventListener("pointermove",e=>{
    const g=e.target.closest&&e.target.closest(".glass");
    if(litEl&&litEl!==g){litEl.classList.remove("lit");litEl=null}
    if(g){const r=g.getBoundingClientRect();g.style.setProperty("--mx",(e.clientX-r.left)+"px");g.style.setProperty("--my",(e.clientY-r.top)+"px");if(!g.classList.contains("lit")){g.classList.add("lit");if(!g.querySelector(":scope > .rim")){const rim=document.createElement("span");rim.className="rim";g.prepend(rim)}}litEl=g}
    const f=$(".field");if(f)f.style.transform=`translate(${(e.clientX/innerWidth-.5)*-18}px,${(e.clientY/innerHeight-.5)*-18}px)`;
    const st=e.target.closest&&e.target.closest(".flash-stage");
    if(st){const r=st.getBoundingClientRect();st.style.setProperty("--ty",((e.clientX-r.left)/r.width-.5)*10+"deg");st.style.setProperty("--tx",((e.clientY-r.top)/r.height-.5)*-8+"deg")}
  },{passive:true});
  document.addEventListener("pointerleave",()=>{if(litEl){litEl.classList.remove("lit");litEl=null}});
  addEventListener("pointerdown",e=>{const t=e.target.closest&&e.target.closest(".btn,.action,.chcard,.opt,.grade button,.iconbtn,.fcard .fface");if(!t)return;
    const host=t.classList.contains("fface")?t:t;const r=host.getBoundingClientRect();if(getComputedStyle(host).position==="static")host.style.position="relative";host.style.overflow="hidden";
    const d=document.createElement("span");d.className="drop";const size=Math.max(r.width,r.height)*2.2;d.style.width=d.style.height=size+"px";d.style.left=(e.clientX-r.left)+"px";d.style.top=(e.clientY-r.top)+"px";host.appendChild(d);setTimeout(()=>d.remove(),720)},{passive:true});
}
/* sliding lens behind the current item */
function placeLens(container,sel){if(!container)return;const on=container.querySelector(sel);let lens=container.querySelector(":scope > .lens");
  if(!on){lens&&(lens.style.opacity=0);return}
  if(!lens){lens=document.createElement("span");lens.className="lens";container.prepend(lens);lens.style.transition="none"}
  const b=on.getBoundingClientRect(),c=container.getBoundingClientRect();
  const moved=lens.dataset.y&&Math.abs(+lens.dataset.y-(b.top-c.top))+Math.abs(+lens.dataset.x-(b.left-c.left))>4;
  lens.style.opacity=1;lens.style.top=(b.top-c.top+container.scrollTop)+"px";lens.style.left=(b.left-c.left)+"px";lens.style.width=b.width+"px";lens.style.height=b.height+"px";
  lens.dataset.y=b.top-c.top;lens.dataset.x=b.left-c.left;
  if(moved&&!reduce){lens.classList.add("squish");setTimeout(()=>lens.classList.remove("squish"),260)}
  requestAnimationFrame(()=>lens.style.transition="")}
function placeAllLenses(){placeLens($("#nav"),'button[aria-current="page"]');placeLens($("#tabbar"),'button[aria-current="page"]');$$(".seg").forEach(s=>placeLens(s,'button[aria-pressed="true"]'))}
const segObs=new MutationObserver(ms=>{if(ms.some(m=>m.attributeName==="aria-pressed"))$$(".seg").forEach(s=>placeLens(s,'button[aria-pressed="true"]'))});
segObs.observe(document.body,{subtree:true,attributes:true,attributeFilter:["aria-pressed"]});
addEventListener("resize",placeAllLenses);
/* stagger index for grid children */
function stagger(root){[".grid3",".grid2",".chlist",".gloss",".plist"].forEach(sel=>$$(sel,root).forEach(g=>[...g.children].forEach((c,i)=>c.style.setProperty("--i",Math.min(i,14)))))}
/* topbar condenses on scroll */
addEventListener("scroll",()=>{const t=$(".topbar");t&&t.classList.toggle("condensed",scrollY>30)},{passive:true});
const listObs=new MutationObserver(()=>stagger(document));listObs.observe($("#main"),{childList:true,subtree:true});
function afterRoute(){placeAllLenses();stagger(document);const r=$(".ring");if(r&&!reduce){const v=r.style.getPropertyValue("--p");r.style.transition="none";r.style.setProperty("--p","0");requestAnimationFrame(()=>requestAnimationFrame(()=>{r.style.transition="";r.style.setProperty("--p",v)}))}
  $$(".bar-fill").forEach(b=>{const w=b.style.width;if(reduce||!w)return;b.style.transition="none";b.style.width="0";requestAnimationFrame(()=>requestAnimationFrame(()=>{b.style.transition="";b.style.width=w}))})}

/* ---------------- toast ---------------- */
let toastT;function toast(t){let el=$(".toast");if(!el){el=document.createElement("div");el.className="toast glass";document.body.appendChild(el)}el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,2200)}

route(["chapters","cards","quiz","practice","exams","glossary","notes","progress"].includes(h)?h:"home");
