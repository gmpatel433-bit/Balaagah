<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#27397a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Balāghah">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>
<body>
<title>Durūs al-Balāghah Study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Amiri:wght@400;700&display=swap">
<style>
/* Layout: floating glass sidebar (desktop) / floating glass tab bar (phone) over a slow, soft colour field.
   Palette for Durūs al-Balāghah: navy ink, gold rubric, lilac and sand. */
:root{
  --field-1:#cdd6ee; --field-2:#ecdcb8; --field-3:#d9cbe6; --field-4:#c4dde0;
  --bg:#e9ebf2;
  --fg:#161b2e; --fg-2:#454b61; --fg-3:#6d7389;
  --glass:rgba(255,255,255,.52); --glass-strong:rgba(255,255,255,.72); --glass-soft:rgba(255,255,255,.32);
  --stroke:rgba(255,255,255,.75); --stroke-2:rgba(22,27,46,.08);
  --hi:rgba(255,255,255,.9);
  --shadow:0 10px 40px -12px rgba(28,36,72,.28), 0 2px 6px -2px rgba(28,36,72,.12);
  --ink:#27397a; --ink-soft:rgba(39,57,122,.11); --rubric:#9a6a14; --rubric-soft:rgba(176,124,26,.13);
  --good:#2e7d5b; --warn:#b07a12; --bad:#b33a3a;
  --font-ui:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-read:"Literata",Georgia,"Times New Roman",serif;
  --font-ar:"Amiri","Noto Naskh Arabic","Geeza Pro","Traditional Arabic",serif;
  --r-lg:26px; --r-md:18px; --r-sm:12px;
  --read-size:17px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --field-1:#17234d; --field-2:#3a2e14; --field-3:#2c1d3d; --field-4:#0f2f35;
  --bg:#0a0d18;
  --fg:#e8eaf3; --fg-2:#b5b9cc; --fg-3:#858aa0;
  --glass:rgba(30,36,60,.48); --glass-strong:rgba(34,41,68,.72); --glass-soft:rgba(30,36,60,.28);
  --stroke:rgba(255,255,255,.12); --stroke-2:rgba(255,255,255,.07);
  --hi:rgba(255,255,255,.14);
  --shadow:0 14px 44px -14px rgba(0,0,0,.65), 0 2px 6px -2px rgba(0,0,0,.4);
  --ink:#a3b8f2; --ink-soft:rgba(163,184,242,.14); --rubric:#e7bf6a; --rubric-soft:rgba(231,191,106,.14);
  --good:#6fd39a; --warn:#e8bd5c; --bad:#f08a80; color-scheme:dark}}
:root[data-theme="dark"]{
  --field-1:#17234d; --field-2:#3a2e14; --field-3:#2c1d3d; --field-4:#0f2f35;
  --bg:#0a0d18;
  --fg:#e8eaf3; --fg-2:#b5b9cc; --fg-3:#858aa0;
  --glass:rgba(30,36,60,.48); --glass-strong:rgba(34,41,68,.72); --glass-soft:rgba(30,36,60,.28);
  --stroke:rgba(255,255,255,.12); --stroke-2:rgba(255,255,255,.07);
  --hi:rgba(255,255,255,.14);
  --shadow:0 14px 44px -14px rgba(0,0,0,.65), 0 2px 6px -2px rgba(0,0,0,.4);
  --ink:#a3b8f2; --ink-soft:rgba(163,184,242,.14); --rubric:#e7bf6a; --rubric-soft:rgba(231,191,106,.14);
  --good:#6fd39a; --warn:#e8bd5c; --bad:#f08a80; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:8px}
.logo-dark{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo-light{display:none}:root:not([data-theme="light"]) .logo-dark{display:block}}
:root[data-theme="dark"] .logo-light{display:none} :root[data-theme="dark"] .logo-dark{display:block}

/* ---------- colour field ---------- */
.field{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.field i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.9}
.field i:nth-child(1){width:55vmax;height:55vmax;left:-12vmax;top:-18vmax;background:var(--field-1);animation:drift1 38s ease-in-out infinite alternate}
.field i:nth-child(2){width:45vmax;height:45vmax;right:-14vmax;top:8vmax;background:var(--field-2);animation:drift2 44s ease-in-out infinite alternate}
.field i:nth-child(3){width:40vmax;height:40vmax;left:20vmax;bottom:-20vmax;background:var(--field-3);opacity:.7;animation:drift1 52s ease-in-out infinite alternate-reverse}
.field i:nth-child(4){width:30vmax;height:30vmax;right:10vmax;bottom:-8vmax;background:var(--field-4);animation:drift2 36s ease-in-out infinite alternate-reverse}
.field::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(0,0,0,.035) 1px,transparent 1px);background-size:3px 3px;mix-blend-mode:multiply;opacity:.5}
@keyframes drift1{to{transform:translate(6vmax,4vmax) scale(1.08)}}
@keyframes drift2{to{transform:translate(-5vmax,6vmax) scale(.94)}}
@media (prefers-reduced-motion: reduce){.field i{animation:none}*{transition:none!important;animation:none!important}}

/* ---------- glass ---------- */
.glass{position:relative;background:var(--glass);border:1px solid var(--stroke);border-radius:var(--r-lg);
  backdrop-filter:blur(26px) saturate(170%);-webkit-backdrop-filter:blur(26px) saturate(170%);box-shadow:var(--shadow), inset 0 1px 0 var(--hi)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(160deg,var(--hi) 0%,transparent 28%,transparent 70%,rgba(255,255,255,.06) 100%);opacity:.55}
.glass > *{position:relative}

/* ---------- shell ---------- */
.shell{position:relative;z-index:1;display:grid;grid-template-columns:248px minmax(0,1fr);gap:22px;max-width:1360px;margin:0 auto;padding-inline:20px;padding-block:20px;min-height:100%}
.side{position:sticky;top:calc(20px + env(safe-area-inset-top,0px));align-self:start;padding:18px 12px;display:flex;flex-direction:column;gap:4px;max-height:calc(100vh - 40px)}
.brand{display:flex;flex-direction:column;gap:8px;padding:4px 10px 16px;border-bottom:1px solid var(--stroke-2);margin-bottom:8px}
.brand img{width:132px;height:auto}
.brand .t{font-weight:600;letter-spacing:-.01em;font-size:17px;line-height:1.15}
.brand .t .ar{font-family:var(--font-ar);font-size:22px;font-weight:700;display:block;color:var(--ink);line-height:1.4}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;padding:9px 12px;border:0;background:transparent;border-radius:14px;font-weight:500;color:var(--fg-2);text-align:left;transition:background .2s,color .2s}
.nav button svg{width:19px;height:19px;flex:none}
.nav button:hover{background:var(--glass-soft);color:var(--fg)}
.nav button[aria-current="page"]{background:var(--glass-strong);color:var(--fg);box-shadow:inset 0 1px 0 var(--hi),0 4px 14px -6px rgba(0,0,0,.18)}
.nav button[aria-current="page"] svg{color:var(--ink)}
.nav .count{margin-left:auto;font-size:11px;font-variant-numeric:tabular-nums;background:var(--rubric-soft);color:var(--rubric);padding:1px 7px;border-radius:99px;font-weight:600}
.side-foot{margin-top:auto;padding:12px 10px 2px;border-top:1px solid var(--stroke-2);display:flex;flex-direction:column;gap:8px;font-size:12px;color:var(--fg-3)}
.contact{font-size:12px;line-height:1.45;color:var(--fg-2);padding:10px 12px;border-radius:14px;background:var(--glass-soft);border:1px solid var(--stroke)}
.contact b{color:var(--ink)}
.sync{display:flex;align-items:center;gap:7px}
.sync .dot{width:7px;height:7px;border-radius:50%;background:var(--fg-3)}
.sync.on .dot{background:var(--good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 25%,transparent)}
.main{min-width:0;display:flex;flex-direction:column;gap:20px;padding-bottom:110px}
.tabbar{display:none}

/* top bar */
.topbar.glass{background:var(--glass-strong);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%)}
.topbar{display:flex;align-items:center;gap:12px;padding:10px 12px 10px 18px;border-radius:22px;position:sticky;top:calc(14px + env(safe-area-inset-top,0px));z-index:5}
.topbar h1{font-size:15px;margin:0;font-weight:600;letter-spacing:-.01em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar .sp{flex:1}
.iconbtn{width:38px;height:38px;border-radius:13px;border:1px solid var(--stroke);background:var(--glass-soft);display:grid;place-items:center;flex:none;transition:background .2s,transform .15s}
.iconbtn:hover{background:var(--glass-strong)}
.iconbtn:active{transform:scale(.95)}
.iconbtn svg{width:18px;height:18px}
.searchbox{display:flex;align-items:center;gap:8px;padding:0 12px;height:38px;border-radius:13px;border:1px solid var(--stroke);background:var(--glass-soft);min-width:0;width:min(320px,100%)}
.searchbox input{border:0;background:transparent;outline:none;width:100%;min-width:0}
.searchbox svg{width:16px;height:16px;color:var(--fg-3);flex:none}
kbd{font-family:var(--font-ui);font-size:11px;border:1px solid var(--stroke-2);border-radius:6px;padding:0 5px;color:var(--fg-3)}

/* generic */
.view{display:flex;flex-direction:column;gap:20px;animation:rise .35s ease both}
@keyframes rise{from{opacity:.4;transform:translateY(6px)}}
.card{padding:22px}
.eyebrow{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg-3);font-weight:600}
h2.title{font-size:clamp(24px,3.2vw,34px);letter-spacing:-.025em;line-height:1.08;margin:4px 0 0;font-weight:600;text-wrap:balance}
.lede{color:var(--fg-2);max-width:62ch;margin:8px 0 0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:14px;border:1px solid var(--stroke);background:var(--glass-strong);font-weight:600;box-shadow:inset 0 1px 0 var(--hi);transition:transform .15s,background .2s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--ink);color:#fff;border-color:transparent;box-shadow:0 8px 22px -10px var(--ink),inset 0 1px 0 rgba(255,255,255,.25)}
:root[data-theme="dark"] .btn.primary{color:#0b1310}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0b1310}}
.btn.ghost{background:transparent;box-shadow:none}
.btn svg{width:17px;height:17px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--ink-soft);color:var(--ink)}
.pill.red{background:var(--rubric-soft);color:var(--rubric)}
.pill.grey{background:var(--stroke-2);color:var(--fg-2)}
.seg{display:inline-flex;padding:4px;border-radius:14px;background:var(--glass-soft);border:1px solid var(--stroke);gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 13px;border-radius:10px;font-weight:500;color:var(--fg-2);font-size:13.5px}
.seg button[aria-pressed="true"]{background:var(--glass-strong);color:var(--fg);box-shadow:0 2px 8px -3px rgba(0,0,0,.2),inset 0 1px 0 var(--hi)}
select.sel{min-width:0;max-width:min(100%,360px);height:38px;border-radius:12px;border:1px solid var(--stroke);background:var(--glass-soft);padding:0 10px;max-width:100%}
.muted{color:var(--fg-3)}
.ar{font-family:var(--font-ar)}
.arin{font-family:var(--font-ar);font-size:1.12em;direction:rtl;unicode-bidi:isolate;line-height:1.4}
.bar-track{height:7px;border-radius:99px;background:var(--stroke-2);overflow:hidden}
.bar-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--ink),color-mix(in srgb,var(--ink) 60%,var(--rubric)));transition:width .5s}
.num{font-variant-numeric:tabular-nums}
.empty{padding:28px;text-align:center;color:var(--fg-3)}

/* ---------- home ---------- */
.hero{padding:28px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center}
.hero .ar-title{text-align:left;font-family:var(--font-ar);font-weight:700;font-size:clamp(38px,6vw,58px);line-height:1.3;color:var(--ink);direction:rtl;margin:0}
.ring{--p:0;width:132px;height:132px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--ink) calc(var(--p)*1%),var(--stroke-2) 0);position:relative}
.ring::after{content:"";position:absolute;inset:11px;border-radius:50%;background:var(--glass-strong);box-shadow:inset 0 1px 0 var(--hi)}
.ring span{position:relative;z-index:1;text-align:center;font-weight:600;font-size:26px;line-height:1}
.ring small{display:block;font-size:11px;color:var(--fg-3);font-weight:500;margin-top:4px}
.stat{padding:18px 20px;display:flex;flex-direction:column;gap:4px}
.stat b{font-size:28px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;font-weight:600}
.stat span{font-size:13px;color:var(--fg-3)}
.continue{padding:22px;display:flex;gap:18px;align-items:center}
.continue .numeral{font-family:var(--font-read);font-size:44px;color:var(--rubric);line-height:1;min-width:64px;text-align:center}
.heat{display:grid;grid-template-columns:repeat(14,1fr);gap:5px;margin-top:12px}
.heat i{aspect-ratio:1;border-radius:5px;background:var(--stroke-2)}
.heat i[data-l="1"]{background:color-mix(in srgb,var(--ink) 30%,transparent)}
.heat i[data-l="2"]{background:color-mix(in srgb,var(--ink) 55%,transparent)}
.heat i[data-l="3"]{background:var(--ink)}
.action{padding:18px;display:flex;flex-direction:column;gap:6px;text-align:left;border:1px solid var(--stroke);transition:transform .2s}
.action:hover{transform:translateY(-2px)}
.action svg{width:22px;height:22px;color:var(--ink)}
.action b{font-size:15.5px}
.action span{font-size:13px;color:var(--fg-3)}

/* ---------- chapters ---------- */
.chlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.chcard{padding:18px 18px 16px;display:grid;grid-template-columns:52px minmax(0,1fr);gap:4px 14px;text-align:left;border:1px solid var(--stroke);transition:transform .2s}
.chcard:hover{transform:translateY(-2px)}
.chcard .n{grid-row:span 3;font-family:var(--font-read);font-size:30px;color:var(--rubric);line-height:1.1}
.chcard .t{font-weight:600;line-height:1.3}
.chcard .a{font-family:var(--font-ar);font-size:18px;color:var(--fg-2);direction:rtl;text-align:left;line-height:1.5}
.chcard .meta{display:flex;align-items:center;gap:10px;margin-top:6px}
.chcard .meta .bar-track{flex:1}
.chcard .st{font-size:11.5px;font-weight:600;color:var(--fg-3);white-space:nowrap}
.chcard .st.done{color:var(--good)}

/* ---------- reader ---------- */
.reader-wrap{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:20px;align-items:start}
.reader-wrap.notes-open{grid-template-columns:minmax(0,1fr) 340px}
.paper{padding:clamp(22px,4vw,52px);border-radius:var(--r-lg);background:var(--glass-strong)}
.chap-head{text-align:center;padding-bottom:22px;margin-bottom:26px;border-bottom:1px solid var(--stroke-2)}
.chap-head .numeral{font-family:var(--font-read);font-size:54px;color:var(--rubric);line-height:1}
.chap-head h2{font-family:var(--font-read);font-weight:600;font-size:clamp(22px,3vw,30px);letter-spacing:-.01em;margin:10px 0 2px;text-wrap:balance}
.chap-head .ar{font-size:28px;color:var(--ink);direction:rtl}
.book{font-family:var(--font-read);font-size:var(--read-size);line-height:1.72;max-width:70ch;margin:0 auto;color:var(--fg)}
.book p{margin:0 0 1em;hyphens:auto}
.book em{font-style:italic}
.book .dc{float:left;font-size:3.3em;line-height:.85;padding:.08em .1em 0 0;color:var(--rubric);font-weight:600}
.book h3{font-family:var(--font-ui);font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--fg-2);text-align:center;margin:2.4em 0 1.1em;scroll-margin-top:90px}
.book h3 .ar{display:block;font-size:24px;letter-spacing:0;text-transform:none;color:var(--ink);font-weight:700;margin-top:4px;direction:rtl}
.book h4{font-family:var(--font-ui);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg-3);margin:1.8em 0 .7em}
.book .matn{text-align:center;margin:1.4em 0;padding:18px 18px 16px;border-radius:var(--r-md);background:var(--ink-soft);border:1px solid color-mix(in srgb,var(--ink) 18%,transparent)}
.book .matn .label{display:block;font-family:var(--font-ui);font-size:10.5px;letter-spacing:.16em;color:var(--ink);font-weight:700;margin-bottom:8px}
.book .matn .ar{display:block;font-family:var(--font-ar);font-size:1.6em;line-height:1.7;font-weight:700;direction:rtl}
.book .matn .tr{display:block;font-style:italic;color:var(--fg-2);margin-top:8px;font-size:.96em;line-height:1.6}
.book .example{background:var(--glass);border:1px solid var(--stroke);border-radius:var(--r-md);padding:14px 18px 4px;margin:1.3em 0;font-size:.95em}
.book .example .eh,.book .box .bh,.book .qabox .qh,.book .bnote .nh,.book .cnote .cnh{display:block;font-family:var(--font-ui);font-size:10.5px;letter-spacing:.16em;font-weight:700;color:var(--fg-3);margin-bottom:8px;text-transform:uppercase}
.book .box{border-top:1px solid var(--stroke-2);border-bottom:1px solid var(--stroke-2);padding:14px 0 6px;margin:1.6em 0}
.book .box .bh{text-align:center}
.book table{border-collapse:collapse;width:100%;font-size:.88em;line-height:1.45;font-family:var(--font-ui)}
.book .tablewrap{overflow-x:auto;margin:1em 0}
.book table.terms td{padding:7px 8px;border-bottom:1px solid var(--stroke-2);vertical-align:top}
.book table.terms td.t{font-style:italic;width:30%}
.book table.terms td.a{font-family:var(--font-ar);font-size:1.25em;text-align:right;direction:rtl;white-space:nowrap}
.book table.grid th,.book table.grid td{border:1px solid var(--stroke-2);padding:7px 9px;vertical-align:top;text-align:left}
.book table.grid th{background:var(--ink-soft);font-weight:600;font-size:.92em}
.book table.rtl{direction:rtl}.book table.rtl td,.book table.rtl th{text-align:center}
.book .qabox{border-left:3px solid var(--rubric);background:var(--rubric-soft);border-radius:0 var(--r-md) var(--r-md) 0;padding:14px 18px 6px;margin:1.4em 0}
.book .qabox .qh{color:var(--rubric)}
.book .qa{margin-bottom:12px;font-size:.95em;line-height:1.6}
.book .qa .k{font-family:var(--font-ui);font-weight:700;margin-right:6px;font-size:.8em;color:var(--rubric)}
.book .qa .q{font-style:italic}
.book .qa .a{margin-top:3px}
.book .bnote{font-size:.86em;border-top:1px solid var(--stroke-2);padding-top:10px;margin:1.4em 0;color:var(--fg-2)}
.book .cnote{font-size:.9em;background:var(--glass);border:1px dashed var(--stroke-2);border-radius:var(--r-md);padding:12px 16px 4px;margin:1.3em 0;color:var(--fg-2)}
.book ol.review{padding-left:1.4em;font-size:.95em}
.book ol.review li{margin-bottom:.5em}
.book .closing{text-align:center;margin-top:2em}
.book .closing .ar{font-size:1.4em;direction:rtl;line-height:1.9}
.book .closing .tr{font-style:italic;color:var(--fg-2);font-size:.9em}
.book .figure,.book .tree{margin:1.6em 0;text-align:center;overflow-x:auto}
.book .figure svg{max-width:100%;height:auto}
.book .figure svg circle,.book .figure svg path{stroke:var(--fg)}
.book .figure svg text{fill:var(--fg)}
.book .figure svg [fill="#f2f0ea"]{fill:var(--ink-soft)}
.book .figcap{font-family:var(--font-ui);font-size:11px;letter-spacing:.12em;color:var(--fg-3);margin-top:10px;text-transform:uppercase}
.book .tree{font-family:var(--font-ui);font-size:13px;line-height:1.3;min-width:0}
.book .tree .node{display:inline-block;border:1px solid color-mix(in srgb,var(--ink) 35%,transparent);background:var(--glass-strong);border-radius:11px;padding:7px 11px;white-space:nowrap;box-shadow:inset 0 1px 0 var(--hi)}
.book .tree .node .ar{display:block;font-family:var(--font-ar);font-size:17px;color:var(--ink)}

<script type="application/json" id="bookdata">{"chapters": [{"num": 1, "title": "Introduction on Faṣāḥah and Balāghah", "ar": "مقدمة في الفصاحة والبلاغة", "body": "<h3>The Authors' Introduction<span class=\"ar\">خطبة الكتاب<\/span><\/h3><div class=\"bism\"><span class=\"ar\">بسم الله الرحمن الرحيم<\/span><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 8<\/span><\/div><div class=\"ar\">الحمد لله الذي قصرت عبارة البلغاء، عن الإحاطة بمعاني آياته وعجزت ألسن الفصحاء، عن بيان بدائع مصنوعاته والصلاة والسلام على من ملك طرفي البلاغة إطناباً وإيجازاً وعلى آله وأصحابه الفاتحين بهديهم إلى الحقيقة مجازاً.<\/div><div class=\"tr\">Praise be to Allāh, before Whom the expression of the eloquent falls short of encompassing the meanings of His signs, and the tongues of the articulate are unable to set out the wonders of His handiwork. And blessings and peace be upon the one who mastered both ends of eloquence, expansiveness (<i>iṭnāb<\/i>) and concision (<i>ījāz<\/i>), and upon his family and his Companions, who by their guidance opened a passage (<i>majāz<\/i>) to the Truth (<i>ḥaqīqah<\/i>).<\/div><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 8<\/span><\/div><div class=\"ar\">وبعد! فهذا كتاب في فنون البلاغة الثلاثة سهل المنال، قريب المآخذ، برئ من وصمة التطويل الممل، وعيب الاختصار المخل، سلكنا في تأليفه أسهل التراتيب وأوضح الأساليب. وجمعنا فيه خلاصة قواعد البلاغة وأمّهات مسائلها وتركنا ما لا تمسّ إليه حاجة التلامذة من الفوائد الزوائد وقوفاً عند حدّ اللازم وحرصاً على أوقاتهم أن تضيع في حلّ معقد أو تلخيص مطوّل أو تكميل مختصر فتمّ به مع كتب الدروس النحويّة سلم الدراسة العربيّة في المدارس الابتدائيّة والتجهيزيّة.<\/div><div class=\"tr\">To proceed: this is a book on the three arts of eloquence, easy to attain and near at hand, free from the blemish of wearisome length and from the fault of damaging brevity. In composing it we followed the easiest arrangements and the clearest methods. We gathered in it the essence of the rules of <i>balāghah<\/i> and its principal questions, and we left out those additional points which the pupils have no pressing need for, stopping at the limit of what is necessary, and out of care that their time should not be lost in unravelling something knotted, abridging something lengthy, or completing something cut short. With it, together with the books of <i>al-Durūs al-Naḥwiyyah<\/i>, the ladder of Arabic study in the primary and preparatory schools has been completed.<\/div><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 8–9<\/span><\/div><div class=\"ar\">(والفضل) في ذلك كلّه للأميرين الكبيرين نُبْلاً، والإنسانين الكاملين فضلاً ناظر المعارف المتجافى عن مهاد الراحة في خدمة البلاد الواقف في منفعتها على قدم الاستعداد (صاحب العطوفة محمّد زكي باشا) ووكيلها ذي الأيادي البيضاء في تقدّم المعارف نحو الصراط المستقيم وأدارة شؤنها على المحور القويم (صاحب السعادة يعقوب أرتين باشا)<\/div><div class=\"tr\">(The credit) for all of this belongs to the two princes, great in nobility, and the two men perfect in merit: the Minister of Education, who keeps his side away from the bed of rest in the service of the country and stands ready on his feet for its benefit (His Excellency Muḥammad Zakī Pasha), and its Under-Secretary, the man of generous favours in the advance of education towards the straight path and in turning its affairs upon the right axis (His Excellency Yaʿqūb Artīn Pasha).<\/div><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 9<\/span><\/div><div class=\"ar\">فهما اللّذان أشارا علينا بوضع هذا النظام المفيد وسلوك سبيل هذا الوضع الجديد تحقيقاً لرغائب أمير البلاد ووليّ أمرها الناشي في مهد المعارف العارف بقدرها مجدّد شهرة الديار المصريّة، ومعيد شبيبة الدولة المحمّدية العلويّة (مولانا الأفخم عباس حلمي باشا الثاني) أدام الله سعود أمّته وأقرّ به عيون آله ورجاله وسائر رعيّته آمين.<\/div><div class=\"tr\">It is they who advised us to set down this useful system and to follow the path of this new arrangement, fulfilling the wishes of the prince of the country and the guardian of its affairs, who grew up in the cradle of learning and knows its worth, the renewer of the fame of the Egyptian lands and the restorer of the youth of the Muḥammadan ʿAlawī dynasty (our most exalted master ʿAbbās Ḥilmī Pasha the Second). May Allāh make the fortunes of his nation endure, and gladden through him the eyes of his family, his men and all his subjects. Āmīn.<\/div><\/div><p style=\"text-align:left;margin-top:4mm\">‎<span class=\"arin\">المؤلّفون<\/span>‎ &#8212; <em>The Authors<\/em><\/p><div class=\"cnote\"><span class=\"cnh\">COMPANION&#8217;S NOTE · NOT IN THE BOOK<\/span><p>On p. 8 the book prints ‎<span class=\"arin\">المتجافى<\/span>‎ (with <i>alif maqṣūrah<\/i>) and ‎<span class=\"arin\">وأدارة<\/span>‎ (with hamzah over the alif); the likely readings are ‎<span class=\"arin\">المتجافي<\/span>‎ and ‎<span class=\"arin\">وإدارة<\/span>‎. On p. 9 it prints ‎<span class=\"arin\">الناشي<\/span>‎ without hamzah, i.e. ‎<span class=\"arin\">الناشئ<\/span>‎.<\/p><\/div><h3>THE SCIENCES OF BALĀGHAH<span class=\"ar\">علوم البلاغة<\/span><\/h3><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 14<\/span><\/div><div class=\"ar\">الفصاحة في اللغة تنبئ عن البيان والظهور، يقال: «أفصح الصبيّ في منطقه»، إذا بان وظهر كلامه، وتقع في الاصطلاح وصفاً للكلمة والكلام والمتكلّم.<\/div><div class=\"tr\"><i>Faṣāḥah<\/i>, in the language, conveys the sense of clarity and manifestness. It is said: «The child became <i>afṣaḥa<\/i> in his speech», when his speech became clear and manifest. In technical usage it occurs as a description of the word, of speech, and of the speaker.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>The book begins with two key words, <i>faṣāḥah<\/i> and <i>balāghah<\/i>, and for each it gives first the meaning in the language and then the technical meaning.<\/p><p>In the language, <i>faṣāḥah<\/i> means being clear and manifest. The example shows this: when a child's speech becomes clear, so that you can understand what he says, the Arabs say ‎<span class=\"arin\">أفصح الصبيّ في منطقه<\/span>‎.<\/p><p>In the technical usage of the scholars of <i>balāghah<\/i>, the word <i>faṣīḥ<\/i> is used to describe three things: (1) a single word (<i>kalimah<\/i>), (2) a piece of speech made of several words (<i>kalām<\/i>), and (3) a person who speaks (<i>mutakallim<\/i>). The book now takes these three one by one.<\/p><\/div><div class=\"chartbox\"><div class=\"chh\">THE PLAN OF THIS CHAPTER · DRAWN BY THE COMPANION<\/div><div class=\"tree\"><div class=\"node\">Faṣāḥah<span class=\"ar\">الفصاحة<\/span><\/div><div class=\"stem\"><\/div><div class=\"bar\" style=\"margin:0 16.67%\"><\/div><div class=\"row\"><div class=\"col\"><div class=\"node\">Of the word<span class=\"ar\">فصاحة الكلمة<\/span><\/div><div class=\"sub\">free of 3 faults<\/div><\/div><div class=\"col\"><div class=\"node\">Of speech<span class=\"ar\">فصاحة الكلام<\/span><\/div><div class=\"sub\">free of 3 faults + its words faṣīḥ<\/div><\/div><div class=\"col\"><div class=\"node\">Of the speaker<span class=\"ar\">فصاحة المتكلّم<\/span><\/div><div class=\"sub\">a settled faculty<\/div><\/div><\/div><\/div><\/div><h3>THE FAṢĀḤAH OF THE WORD<span class=\"ar\">(١) فصاحة الكلمة<\/span><\/h3><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 15<\/span><\/div><div class=\"ar\">(١) ففصاحة الكلمة سلامتها من تنافر الحروف، ومخالفة القياس، والغرابة؛ فتنافر الحروف: وصف في الكلمة يوجب ثقلها على اللسان وعسر النطق بها، نحو: «الظشّ» للموضع الخشن، و«الهعخع» لنبات ترعاه الإبل، و«النقاح» للماء العذب الصافي، و«المستشزر» للمفتول،<\/div><div class=\"tr\">(1) So the <i>faṣāḥah<\/i> of the word is its freedom from mutual repulsion of the letters (<i>tanāfur al-ḥurūf<\/i>), from contravention of the rule (<i>mukhālafat al-qiyās<\/i>), and from strangeness (<i>gharābah<\/i>). Mutual repulsion of the letters is a quality in the word that makes it heavy on the tongue and difficult to pronounce, for example: «<i>al-ẓashsh<\/i>» for rough ground, «<i>al-hukhkhuʿ<\/i>» for a plant that camels graze on, «<i>al-nuqāḥ<\/i>» (so printed) for sweet, pure water, and «<i>al-mustashzir<\/i>» for something twisted.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>A word is <i>faṣīḥ<\/i> when it is free of three faults. The book names all three first, then defines each with examples. The first fault is <b>mutual repulsion of the letters<\/b> (<i>tanāfur al-ḥurūf<\/i>).<\/p><p>Some letters do not sit easily next to each other. When they come together in one word, the tongue has to work hard to move between them, and the word becomes heavy to say. That heaviness is the fault, and the book's examples show it:<\/p><b>‎<span class=\"arin\">الظشّ<\/span>‎<\/b> (rough ground): the <i>ẓāʾ<\/i> and the doubled <i>shīn<\/i> are hard to join. <b>‎<span class=\"arin\">الهعخع<\/span>‎<\/b> (a plant camels graze on): <i>hāʾ<\/i>, <i>ʿayn<\/i> and <i>khāʾ<\/i> all come from the throat, one after another, so it is very hard to pronounce. <b>‎<span class=\"arin\">النقاح<\/span>‎<\/b> (sweet, pure water) and <b>‎<span class=\"arin\">المستشزر<\/span>‎<\/b> (twisted): the second has <i>sīn<\/i>, <i>tāʾ<\/i>, <i>shīn<\/i> and <i>zāy<\/i> packed together.<p>Notice that the heaviness comes in degrees. A word like ‎<span class=\"arin\">الهعخع<\/span>‎ is extremely heavy, while ‎<span class=\"arin\">المستشزر<\/span>‎ is less so; but both are faults, because an eloquent speaker chooses words that run easily on the tongue.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 15–16<\/span><\/div><div class=\"ar\">ومخالفة القياس: كون الكلمة غير جارية على القانون الصرفيّ كجمع «بوق» على «بوقات» في قول المتنبّي:<span class=\"bayt\"><span class=\"h1\">فَإِنْ يَّكُ بَعْضُ النَّاسِ سَيْفاً لِدَوْلَةٍ<\/span><span class=\"h2\">فَفِي النَّاسِ بُوْقَاتٌ لَهَا وَطَبُوْلُ<\/span><\/span>إذ القياس في جمعه للقلّة «أبواق»، وكـ«موددة» في قوله:<span class=\"bayt\"><span class=\"h1\">إنَّ بَنِيَّ لَلِئَامٌ زَهَدَةٌ<\/span><span class=\"h2\">مَا لِي في صُدُوْرِهِمْ مِن مَوْدَدَةٍ<\/span><\/span>والقياس «مودّة» بالإدغام،<\/div><div class=\"tr\">Contravention of the rule is the word’s not following the morphological norm, like the plural of «<i>būq<\/i>» (trumpet) as «<i>būqāt<\/i>» in the words of al-Mutanabbī:<br>“If some man is a sword for a dynasty, then among people there are trumpets (<i>būqāt<\/i>) and drums for it,”<br>since the rule for its plural of paucity is «<i>abwāq<\/i>»; and like «<i>mawdadah<\/i>» in the poet’s words:<br>“My sons are base and indifferent; I have in their breasts no affection (<i>mawdadah<\/i>),”<br>whereas the rule is «<i>mawaddah<\/i>», with assimilation (<i>idghām<\/i>).<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>The second fault is <b>contravention of the rule<\/b> (<i>mukhālafat al-qiyās<\/i>): the word is built against the rules of morphology (<i>ṣarf<\/i>) that the Arabs follow.<\/p><b>First example.<\/b> ‎<span class=\"arin\">بوق<\/span>‎ (trumpet) is a word whose plural of paucity, by the rule, is ‎<span class=\"arin\">أبواق<\/span>‎. Al-Mutanabbī instead said ‎<span class=\"arin\">بُوْقَاتٌ<\/span>‎, which breaks the rule. The meaning of his line is: if some man is a sword defending a dynasty, there are also people who are merely its trumpets and drums, making noise and doing nothing.<b>Second example.<\/b> When two identical letters meet in a word like this, the rule of <i>ṣarf<\/i> is to merge them with <i>idghām<\/i>: ‎<span class=\"arin\">مودّة<\/span>‎. The poet split them and said ‎<span class=\"arin\">مَوْدَدَةٍ<\/span>‎, so the word goes against the rule.<p>So a word can be easy to pronounce and clear in meaning, and still not be <i>faṣīḥ<\/i>, simply because its form is wrong.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 16–17<\/span><\/div><div class=\"ar\">والغرابة كون الكلمة غير ظاهرة المعنى، نحو: «تكأكأ» بمعنى «اجتمع»، و«افرنقع» بمعنى «انصرف»، و«اطلخمّ» بمعنى «اشتدّ».<\/div><div class=\"tr\">And strangeness (<i>gharābah<\/i>) is the word’s not being clear in meaning, for example: «<i>takaʾkaʾa<\/i>» in the sense of «<i>ijtamaʿa<\/i>» (gathered together), «<i>ifranqaʿa<\/i>» in the sense of «<i>inṣarafa<\/i>» (went away), and «<i>iṭlakhamma<\/i>» in the sense of «<i>ishtadda<\/i>» (became intense).<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>The third fault is <b>strangeness<\/b> (<i>gharābah<\/i>): the meaning of the word is not clear, because it is rarely used, so that even people who know Arabic well would need to look it up.<\/p><p>The book gives three rare verbs, each beside the common verb with the same meaning: ‎<span class=\"arin\">تكأكأ<\/span>‎ for ‎<span class=\"arin\">اجتمع<\/span>‎ (gathered together), ‎<span class=\"arin\">افرنقع<\/span>‎ for ‎<span class=\"arin\">انصرف<\/span>‎ (went away), and ‎<span class=\"arin\">اطلخمّ<\/span>‎ for ‎<span class=\"arin\">اشتدّ<\/span>‎ (became intense).<\/p><p>The fault is not in the meaning; it is that a speaker who uses the rare word instead of the familiar one makes the listener struggle to understand him, which defeats the purpose of clear speech.<\/p><\/div><div class=\"chartbox\"><div class=\"chh\">THE FAṢĀḤAH OF THE WORD AT A GLANCE · DRAWN BY THE COMPANION<\/div><table class=\"grid\"><thead><tr><th>The fault<\/th><th>What it means<\/th><th>Book's example<\/th><\/tr><\/thead><tbody><tr><td>Tanāfur al-ḥurūf ‎<span class=\"arin\">تنافر الحروف<\/span>‎<\/td><td>Letters heavy together on the tongue<\/td><td>‎<span class=\"arin\">الظشّ<\/span>‎، ‎<span class=\"arin\">الهعخع<\/span>‎<\/td><\/tr><tr><td>Mukhālafat al-qiyās ‎<span class=\"arin\">مخالفة القياس<\/span>‎<\/td><td>Form against the rules of ṣarf<\/td><td>‎<span class=\"arin\">بوقات<\/span>‎، ‎<span class=\"arin\">موددة<\/span>‎<\/td><\/tr><tr><td>Gharābah ‎<span class=\"arin\">الغرابة<\/span>‎<\/td><td>Meaning unclear because rare<\/td><td>‎<span class=\"arin\">تكأكأ<\/span>‎، ‎<span class=\"arin\">افرنقع<\/span>‎<\/td><\/tr><\/tbody><\/table><\/div><h3>THE FAṢĀḤAH OF SPEECH<span class=\"ar\">(٢) فصاحة الكلام<\/span><\/h3><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 17<\/span><\/div><div class=\"ar\">(٢) وفصاحة الكلام سلامته من تنافر الكلمات مجتمعة، ومن ضعف التأليف، ومن التعقيد مع فصاحة كلماته.<\/div><div class=\"tr\">(2) And the <i>faṣāḥah<\/i> of speech is its freedom from mutual repulsion of the words taken together (<i>tanāfur al-kalimāt mujtamiʿatan<\/i>), from weakness of composition (<i>ḍaʿf al-taʾlīf<\/i>), and from complexity (<i>taʿqīd<\/i>), together with the <i>faṣāḥah<\/i> of its words.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>Now the book moves from the single word to <b>speech<\/b> (<i>kalām<\/i>). A piece of speech is <i>faṣīḥ<\/i> when it is free of three faults of its own: (1) mutual repulsion of the words taken together, (2) weakness of composition, and (3) complexity.<\/p><p>There is also a fourth condition at the end: <b>together with the <i>faṣāḥah<\/i> of its words<\/b>. This means each word in it must already be <i>faṣīḥ<\/i> by the three conditions just learnt. So a well-built sentence that contains one strange word, or one word against the rules of <i>ṣarf<\/i>, is still not <i>faṣīḥ<\/i>.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 18<\/span><\/div><div class=\"ar\">فالتنافر: وصف في الكلام يوجب ثقله على اللسان، وعسر النطق به، نحو:<span class=\"bayt\"><span class=\"h1\">في رَفْعِ عَرْشِ الشَّرْعِ مِثْلُكَ يَشْرَعُ =<\/span><span class=\"h2\">وَلَيْسَ قُرْبَ قَبْرِ حَرْبٍ قَبْرُ<\/span><\/span><span class=\"bayt\"><span class=\"h1\">كَرِيْمٌ مَتى أَمْدَحُهُ أَمْدَحُهُ وَالْوَرَى<\/span><span class=\"h2\">مَعِي وَإِذَا مَا لُمْتُه لُمْتُه وَحْدِي<\/span><\/span><\/div><div class=\"tr\">So mutual repulsion is a quality in speech that makes it heavy on the tongue and difficult to pronounce, for example:<br>“In raising the throne of the Sacred Law, one like you sets to work” <b>=<\/b> “And near the grave of Ḥarb there is no grave”;<br>“A noble man: when I praise him, mankind praises him with me; and when I blame him, I blame him alone.”<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>The first fault of speech is like the first fault of the word, but now the heaviness comes from the words <b>together<\/b>, not from the letters of one word. Each word on its own may be easy, but placed side by side they become hard to say.<\/p><p>In the first example, the opening half-line repeats the sounds of ‎<span class=\"arin\">رَفْعِ عَرْشِ الشَّرْعِ<\/span>‎ and ‎<span class=\"arin\">يَشْرَعُ<\/span>‎ close together. The second half-line printed beside it, ‎<span class=\"arin\">وَلَيْسَ قُرْبَ قَبْرِ حَرْبٍ قَبْرُ<\/span>‎, is a famous example of extreme heaviness: try saying it quickly and the <i>qāf<\/i>, <i>rāʾ<\/i> and <i>bāʾ<\/i> trip the tongue.<\/p><p>In the second example the heaviness is lighter: in ‎<span class=\"arin\">أَمْدَحُهُ أَمْدَحُهُ<\/span>‎ and ‎<span class=\"arin\">لُمْتُه لُمْتُه<\/span>‎ the throat letters <i>ḥāʾ<\/i> and <i>hāʾ<\/i>, and the repeated words, sit close together. Even so, the eloquent avoid it.<\/p><p>So, as with the word, the heaviness may be extreme or slight, and both count as a fault.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 18–19<\/span><\/div><div class=\"ar\">وضعف التأليف: كون الكلام غير جار على القانون النحويّ المشهور كـ«الإضمار قبل الذكر» لفظاً ورتبة في قوله:<span class=\"bayt\"><span class=\"h1\">جَزَى بَنُوْهُ أَبَا الْغِيْلاَنِ عَنْ كِبَرٍ<\/span><span class=\"h2\">وَحُسْنِ فِعْلٍ كَمَا يُجْزَى سِنِمَّارُ<\/span><\/span><\/div><div class=\"tr\">And weakness of composition is speech’s not following the well-known grammatical rule, like «using a pronoun before the mention [of what it refers to]», in wording and in rank, in the poet’s words:<br>“His sons repaid Abū al-Ghaylān, after old age and good deeds, as Sinimmār was repaid.”<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>The second fault of speech is <b>weakness of composition<\/b> (<i>ḍaʿf al-taʾlīf<\/i>): the sentence is built against a well-known rule of grammar (<i>naḥw<\/i>).<\/p><p>The book's example is using a pronoun before the word it refers to has been mentioned, in wording and in rank. Look at the verse: ‎<span class=\"arin\">جَزَى بَنُوْهُ أَبَا الْغِيْلاَنِ<\/span>‎. The <i>hāʾ<\/i> in ‎<span class=\"arin\">بَنُوْهُ<\/span>‎ refers to ‎<span class=\"arin\">أَبَا الْغِيْلاَنِ<\/span>‎. But ‎<span class=\"arin\">أَبَا الْغِيْلاَنِ<\/span>‎ comes <b>later in wording<\/b> (it is said after the pronoun), and also <b>later in rank<\/b>, because it is the object (<i>mafʿūl<\/i>), whose place is after the subject ‎<span class=\"arin\">بَنُوْهُ<\/span>‎. So the pronoun points forward to something that comes after it in both ways, which the well-known rule does not allow.<\/p><p>The meaning: his sons repaid Abū al-Ghaylān for his old age and good deeds just as Sinimmār was repaid. Sinimmār is the builder in a famous Arab story who was rewarded for building a great palace by being thrown from it, so the line means they repaid his goodness with harm.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 20–21<\/span><\/div><div class=\"ar\">والتعقيد: أن يكون الكلام خفيّ الدلالة على المعنى المراد، والخفاء إمّا من جهة اللفظ بسبب تقديم، أو تأخير، أو فصل، ويسمّى: «تعقيداً لفظيًّا»، كقول المتنبّي:<span class=\"bayt\"><span class=\"h1\">جَفَخَتْ وَهُمْ لاَ يَجْفَخُوْنَ بِهَا بِهِمْ<\/span><span class=\"h2\">شِيَمٌ عَلَى الْحَسَبِ الأَغَرِّ دَلاَئِلُ<\/span><\/span>فإنّ تقديره: «جفخت بهم شيم دلائل على الحسب الأغرّ وهم لا يجفخون بها».<\/div><div class=\"tr\">And complexity is that speech be obscure in its indication of the intended meaning. The obscurity is either on the side of the wording, because of putting something first, or putting something later, or separating, and it is called «verbal complexity» (<i>taʿqīd lafẓī<\/i>), like the words of al-Mutanabbī:<br>“Boasted — while they do not boast of them — through them, qualities that are proofs of the radiant lineage,”<br>for its underlying order is: «Qualities that are proofs of the radiant lineage boasted through them, while they do not boast of them.»<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>The third fault of speech is <b>complexity<\/b> (<i>taʿqīd<\/i>): the sentence does not show its meaning clearly. The book divides it into two kinds, by where the obscurity comes from. The first is <b>verbal complexity<\/b> (<i>taʿqīd lafẓī<\/i>), where the words are in a confusing order because something is put first, put later, or separated from what it belongs to.<\/p><p>Al-Mutanabbī's line is an example. ‎<span class=\"arin\">جَفَخَتْ<\/span>‎ means <i>boasted<\/i>. In the line, the verb's subject ‎<span class=\"arin\">شِيَمٌ<\/span>‎ is pushed far away from it, ‎<span class=\"arin\">بِهَا<\/span>‎ and ‎<span class=\"arin\">بِهِمْ<\/span>‎ are moved out of their natural places, and the description ‎<span class=\"arin\">دَلاَئِلُ<\/span>‎ is separated from ‎<span class=\"arin\">شِيَمٌ<\/span>‎ by other words. The listener has to rebuild the sentence before he can understand it. The book gives the natural order, which the chart below sets beside the printed line.<\/p><\/div><div class=\"chartbox\"><div class=\"chh\">VERBAL COMPLEXITY: THE LINE AND ITS NATURAL ORDER · DRAWN BY THE COMPANION<\/div><table class=\"grid\"><thead><tr><th><\/th><th>Arabic<\/th><\/tr><\/thead><tbody><tr><td>As the poet said it<\/td><td>‎<span class=\"arin\">جَفَخَتْ وَهُمْ لاَ يَجْفَخُوْنَ بِهَا بِهِمْ شِيَمٌ عَلَى الْحَسَبِ الأَغَرِّ دَلاَئِلُ<\/span>‎<\/td><\/tr><tr><td>Its natural order (from the book)<\/td><td>‎<span class=\"arin\">جفخت بهم شيم دلائل على الحسب الأغرّ وهم لا يجفخون بها<\/span>‎<\/td><\/tr><\/tbody><\/table><div class=\"figcap\">The words are the same; only the order differs. The fault lies entirely in the order.<\/div><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 21–22<\/span><\/div><div class=\"ar\">وإمّا من جهة المعنى بسبب استعمال مجازات وكنايات، لا يفهم المراد بها، ويسمّى «تعقيداً معنويًّا»، نحو قولك: «نشر الملك ألسنته في المدينة»، مريداً جواسيسه، والصواب نشر عيونه، وقولِه:<span class=\"bayt\"><span class=\"h1\">سَأَطْلُبُ بُعْدَ الدَّارِ عَنْكُمْ لِتَقْرُبُوْا<\/span><span class=\"h2\">وَتَسْكُبُ عَيْنَايَ الدُّمُوْعَ لِتَجْمُدَا<\/span><\/span>حيث كَنَى بالجمود عن السرور مع أنّ الجمود يكنى به عن البخل وقت البكاء.<\/div><div class=\"tr\">Or [the obscurity is] on the side of the meaning, because of using figures of speech (<i>majāzāt<\/i>) and metonymies (<i>kināyāt<\/i>) whose intended sense is not understood; and it is called «semantic complexity» (<i>taʿqīd maʿnawī<\/i>). For example, your saying «The king spread his tongues in the city», meaning his spies, whereas the correct expression is «spread his eyes»; and the poet’s words:<br>“I will seek to be far in abode from you so that you come near, and my eyes will pour tears so that they may become dry,”<br>where he used dryness [of the eyes] as a metonymy for joy, although dryness is used as a metonymy for miserliness [with tears] at the time of weeping.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>The second kind is <b>semantic complexity<\/b> (<i>taʿqīd maʿnawī<\/i>). Here the word order may be perfectly natural, but the speaker uses a figure of speech (<i>majāz<\/i>) or a metonymy (<i>kināyah<\/i>) in a way the Arabs do not use it, so the listener cannot work out what is meant.<\/p><b>First example.<\/b> The Arabs call spies the king's <i>eyes<\/i> (‎<span class=\"arin\">عيون<\/span>‎), because a spy watches. If you say ‎<span class=\"arin\">نشر الملك ألسنته في المدينة<\/span>‎, \"the king spread his <i>tongues<\/i> in the city\", meaning his spies, the listener will not understand you, because <i>tongues<\/i> is not the usual figure for spies. That is why the book says the correct expression is ‎<span class=\"arin\">نشر عيونه<\/span>‎.<b>Second example.<\/b> The poet wanted to say: I will accept being far from you now so that we can be near later, and I will weep now so that my eyes can be <i>dry<\/i> later, meaning happy. But among the Arabs, <i>dry eyes<\/i> (‎<span class=\"arin\">جمود العين<\/span>‎) is a metonymy for the eye that is <i>miserly with tears<\/i> when weeping is called for. So using dryness for joy goes against its known use, and the meaning becomes hard to reach.<\/div><div class=\"chartbox\"><div class=\"chh\">THE FAṢĀḤAH OF SPEECH AT A GLANCE · DRAWN BY THE COMPANION<\/div><table class=\"grid\"><thead><tr><th>The fault<\/th><th>Where it comes from<\/th><th>Book's example<\/th><\/tr><\/thead><tbody><tr><td>Tanāfur al-kalimāt ‎<span class=\"arin\">تنافر الكلمات<\/span>‎<\/td><td>Words heavy together<\/td><td>‎<span class=\"arin\">وَلَيْسَ قُرْبَ قَبْرِ حَرْبٍ قَبْرُ<\/span>‎<\/td><\/tr><tr><td>Ḍaʿf al-taʾlīf ‎<span class=\"arin\">ضعف التأليف<\/span>‎<\/td><td>Against a well-known rule of naḥw<\/td><td>‎<span class=\"arin\">جَزَى بَنُوْهُ أَبَا الْغِيْلاَنِ<\/span>‎<\/td><\/tr><tr><td>Taʿqīd lafẓī ‎<span class=\"arin\">تعقيد لفظي<\/span>‎<\/td><td>Confusing word order<\/td><td>‎<span class=\"arin\">جَفَخَتْ وَهُمْ لاَ يَجْفَخُوْنَ بِهَا بِهِمْ<\/span>‎<\/td><\/tr><tr><td>Taʿqīd maʿnawī ‎<span class=\"arin\">تعقيد معنوي<\/span>‎<\/td><td>Majāz or kināyah used unusually<\/td><td>‎<span class=\"arin\">نشر الملك ألسنته<\/span>‎<\/td><\/tr><\/tbody><\/table><div class=\"figcap\">And, in every case, each word must also be faṣīḥ.<\/div><\/div><h3>THE FAṢĀḤAH OF THE SPEAKER<span class=\"ar\">(٣) فصاحة المتكلّم<\/span><\/h3><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 22<\/span><\/div><div class=\"ar\">(٣) وفصاحة المتكلم ملكة يقتدر بها على التعبير عن المقصود بكلام فصيح في أيّ غرض كان.<\/div><div class=\"tr\">(3) And the <i>faṣāḥah<\/i> of the speaker is a settled faculty (<i>malakah<\/i>) by which one is able to express what is intended in <i>faṣīḥ<\/i> speech, on any purpose whatever.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>The third thing described as <i>faṣīḥ<\/i> is the <b>speaker<\/b>. His <i>faṣāḥah<\/i> is a <i>malakah<\/i>: a settled ability, rooted in him through long practice, that lets him express whatever he means in <i>faṣīḥ<\/i> speech.<\/p><p>Two points in the definition are important. First, it is an <b>ability<\/b>, not an act: a person is <i>faṣīḥ<\/i> because he is able to speak this way whenever he wishes, not because he once happened to say a correct sentence. Second, it is <b>on any purpose whatever<\/b>: praise, blame, describing, advising, and so on. Someone who can speak well on one subject only is not yet a <i>faṣīḥ<\/i> speaker.<\/p><\/div><h3>BALĀGHAH<\/h3><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 23<\/span><\/div><div class=\"ar\">والبلاغة في اللغة: الوصول والانتهاء، يقال: «بلغ فلان مراده» إذا وصل إليه، و«بلغ الركْب المدينة»، إذا انتهى إليها، وتقع في الاصطلاح وصفاً للكلام والمتكلّم.<\/div><div class=\"tr\">And <i>balāghah<\/i> in the language is arriving and reaching the end. It is said: «So-and-so attained (<i>balagha<\/i>) his aim», when he arrived at it, and «The riders reached (<i>balagha<\/i>) the city», when they came to it. In technical usage it occurs as a description of speech and of the speaker.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>Next comes <i>balāghah<\/i>. In the language it means <b>arriving<\/b> and <b>reaching the end<\/b>: ‎<span class=\"arin\">بلغ فلان مراده<\/span>‎ means he reached his goal, and ‎<span class=\"arin\">بلغ الركْب المدينة<\/span>‎ means the riders reached the city.<\/p><p>Notice the difference from <i>faṣāḥah<\/i>: technically, <i>balāghah<\/i> describes only <b>speech<\/b> and the <b>speaker<\/b>. It is not used for a single word, because, as the next passage shows, <i>balāghah<\/i> means fitting the situation, and a single word on its own does not fit or fail to fit a situation.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 23–25<\/span><\/div><div class=\"ar\">فبلاغة الكلام: مطابقته لمقتضى الحال مع فصاحته، والحال ويسمّى بـ«المقام» هو الأمر الحامل للمتكلّم على أن يورد عبارته على صورة مخصوصة، والمقتضى ويسمّى «الاعتبار المناسب»: هو الصورة المخصوصة التي تورد عليها العبارة، مثلاً: «المدح» حال يدعو لإيراد العبارة على صورة الإطناب، و«ذكاء المخاطب» حال يدعو لإيرادها على صورة الإيجاز؛ فكلّ من المدح والذكاء حال، وكلّ من الإطناب والإيجاز مقتضى، وإيراد الكلام على صورة الإطناب والإيجاز مطابقة للمقتضى،<\/div><div class=\"tr\">So the <i>balāghah<\/i> of speech is its conformity to what the situation requires (<i>muqtaḍā al-ḥāl<\/i>), together with its <i>faṣāḥah<\/i>. The situation (<i>ḥāl<\/i>), which is also called «the occasion» (<i>al-maqām<\/i>), is the matter that leads the speaker to bring his expression in a particular form. And the requirement (<i>muqtaḍā<\/i>), which is also called «the appropriate consideration» (<i>al-iʿtibār al-munāsib<\/i>), is the particular form in which the expression is brought. For example: «praise» is a situation that calls for bringing the expression in the form of expansiveness (<i>iṭnāb<\/i>), and «the intelligence of the addressee» is a situation that calls for bringing it in the form of concision (<i>ījāz<\/i>). So each of praise and intelligence is a situation, each of expansiveness and concision is a requirement, and bringing speech in the form of expansiveness or concision is conformity to the requirement.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>This is the most important definition in the chapter, because the whole of <i>ʿilm al-maʿānī<\/i> is built on it. Speech is <i>balīgh<\/i> when two things are true: it <b>conforms to what the situation requires<\/b>, and it is <b>faṣīḥ<\/b>.<\/p><p>Two terms need to be clear. The <b>situation<\/b> (<i>ḥāl<\/i> or <i>maqām<\/i>) is the circumstance that leads the speaker to choose a particular way of speaking. The <b>requirement<\/b> (<i>muqtaḍā<\/i>, or <i>al-iʿtibār al-munāsib<\/i>) is that particular way of speaking.<\/p><p>The book's examples make it simple. If you are <b>praising<\/b> someone, the situation calls for saying more, so you speak at length (<i>iṭnāb<\/i>). If the person you are talking to is <b>intelligent<\/b>, the situation calls for saying less, so you speak briefly (<i>ījāz<\/i>). Praise and intelligence are situations; length and brevity are requirements; and speaking at length when praising, or briefly to an intelligent listener, is conformity to the requirement.<\/p><p>Because <i>faṣāḥah<\/i> is part of the definition, all <i>balīgh<\/i> speech is <i>faṣīḥ<\/i>, but not all <i>faṣīḥ<\/i> speech is <i>balīgh<\/i>: a sentence can be perfectly clear and correct and still be the wrong thing to say on that occasion.<\/p><\/div><div class=\"chartbox\"><div class=\"chh\">SITUATION AND REQUIREMENT · DRAWN BY THE COMPANION<\/div><table class=\"grid\"><thead><tr><th>The situation (ḥāl)<\/th><th>What it requires (muqtaḍā)<\/th><th>Speaking that way is…<\/th><\/tr><\/thead><tbody><tr><td>Praise ‎<span class=\"arin\">المدح<\/span>‎<\/td><td>Expansiveness ‎<span class=\"arin\">الإطناب<\/span>‎<\/td><td>conformity to the requirement<\/td><\/tr><tr><td>Intelligence of the addressee ‎<span class=\"arin\">ذكاء المخاطب<\/span>‎<\/td><td>Concision ‎<span class=\"arin\">الإيجاز<\/span>‎<\/td><td>conformity to the requirement<\/td><\/tr><\/tbody><\/table><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 25<\/span><\/div><div class=\"ar\">وبلاغة المتكلم ملكة يقتدربها على التعبير عن المقصود بكلام بليغ في أيّ غرض كان،<\/div><div class=\"tr\">And the <i>balāghah<\/i> of the speaker is a settled faculty by which one is able to express what is intended in <i>balīgh<\/i> speech, on any purpose whatever.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>The <i>balāghah<\/i> of the speaker matches the <i>faṣāḥah<\/i> of the speaker: it is a settled ability by which he can express what he means in <i>balīgh<\/i> speech, on any purpose. So a <i>balīgh<\/i> speaker is one who can always say the right thing, in the right way, for the occasion in front of him.<\/p><\/div><div class=\"chartbox\"><div class=\"chh\">FAṢĀḤAH AND BALĀGHAH COMPARED · DRAWN BY THE COMPANION<\/div><table class=\"grid\"><thead><tr><th><\/th><th>Faṣāḥah<\/th><th>Balāghah<\/th><\/tr><\/thead><tbody><tr><td>Lexical meaning<\/td><td>Clarity, being manifest<\/td><td>Arriving, reaching the end<\/td><\/tr><tr><td>Describes the word?<\/td><td>Yes<\/td><td>No<\/td><\/tr><tr><td>Describes speech?<\/td><td>Yes: free of 3 faults, words faṣīḥ<\/td><td>Yes: fits the situation, and is faṣīḥ<\/td><\/tr><tr><td>Describes the speaker?<\/td><td>Yes: a malakah<\/td><td>Yes: a malakah<\/td><\/tr><\/tbody><\/table><div class=\"figcap\">Every balīgh piece of speech is faṣīḥ; not every faṣīḥ piece of speech is balīgh.<\/div><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 25–27<\/span><\/div><div class=\"ar\">ويعرف التنافر بالذوق، ومخالفة القياس بالصرف، وضعف التأليف والتعقيد اللفظيّ بالنحو، والغرابة بكثرة الاطّلاع على كلام العرب، والتعقيد المعنويّ بالبيان، والأحوال ومقتضياتها بالمعاني؛ فوجب على طالب البلاغة معرفة اللغة، والصرف، والنحو، والمعاني، والبيان مع كونه سليم الذوق، كثير الاطّلاع على كلام العرب.<\/div><div class=\"tr\">Mutual repulsion is known by taste (<i>dhawq<\/i>); contravention of the rule by morphology (<i>ṣarf<\/i>); weakness of composition and verbal complexity by grammar (<i>naḥw<\/i>); strangeness by wide acquaintance with the speech of the Arabs; semantic complexity by <i>al-bayān<\/i>; and the situations and their requirements by <i>al-maʿānī<\/i>. So it is obligatory for the student of <i>balāghah<\/i> to know the language (lexicon), morphology, grammar, <i>al-maʿānī<\/i> and <i>al-bayān<\/i>, together with his being of sound taste and widely acquainted with the speech of the Arabs.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>The chapter ends by showing which science protects the student from each fault, and so which sciences a student of <i>balāghah<\/i> needs.<\/p><p>Mutual repulsion has no rulebook: it is recognised by a sound <b>taste<\/b>. Forms against the rule are recognised through <b>ṣarf<\/b>. Weakness of composition and verbal complexity are recognised through <b>naḥw<\/b>. Strange words are recognised by <b>reading widely<\/b> in the speech of the Arabs. Semantic complexity is avoided through <b>ʿilm al-bayān<\/b>, the second part of this book, which teaches how figures and metonymies are properly used. And knowing each situation and what it requires is the work of <b>ʿilm al-maʿānī<\/b>, the first part of this book.<\/p><p>That is why the book concludes that the student must know the language, <i>ṣarf<\/i>, <i>naḥw<\/i>, <i>al-maʿānī<\/i> and <i>al-bayān<\/i>, and must also have sound taste and wide reading.<\/p><\/div><div class=\"chartbox\"><div class=\"chh\">EACH FAULT AND THE SCIENCE THAT REVEALS IT · DRAWN BY THE COMPANION<\/div><table class=\"grid\"><thead><tr><th>The fault<\/th><th>Known through<\/th><\/tr><\/thead><tbody><tr><td>Tanāfur (letters or words)<\/td><td>Taste ‎<span class=\"arin\">الذوق<\/span>‎<\/td><\/tr><tr><td>Mukhālafat al-qiyās<\/td><td>Morphology ‎<span class=\"arin\">الصرف<\/span>‎<\/td><\/tr><tr><td>Ḍaʿf al-taʾlīf and taʿqīd lafẓī<\/td><td>Grammar ‎<span class=\"arin\">النحو<\/span>‎<\/td><\/tr><tr><td>Gharābah<\/td><td>Wide reading in the speech of the Arabs<\/td><\/tr><tr><td>Taʿqīd maʿnawī<\/td><td>‎<span class=\"arin\">البيان<\/span>‎<\/td><\/tr><tr><td>The situations and their requirements<\/td><td>‎<span class=\"arin\">المعاني<\/span>‎<\/td><\/tr><\/tbody><\/table><\/div><div class=\"cnote\"><span class=\"cnh\">COMPANION&#8217;S NOTE · NOT IN THE BOOK<\/span><p>Readings reproduced as printed: p. 15 ‎<span class=\"arin\">النقاح<\/span>‎ (with <i>ḥāʾ<\/i>), where the word for sweet water is usually ‎<span class=\"arin\">النقاخ<\/span>‎ (with <i>khāʾ<\/i>); p. 25 ‎<span class=\"arin\">يقتدربها<\/span>‎, printed without a space, where the usual spelling is ‎<span class=\"arin\">يقتدر بها<\/span>‎.<\/p><\/div><div class=\"box\"><div class=\"bh\">KEY TERMS AND THEIR MEANINGS · ADDED BY THE COMPANION<\/div><table class=\"terms\"><tr><td class=\"t\">Faṣāḥah<\/td><td>lexically, clarity and manifestness; technically a description of the word, speech and the speaker<\/td><td class=\"a\">الفصاحة<\/td><\/tr><tr><td class=\"t\">Tanāfur al-ḥurūf<\/td><td>mutual repulsion of the letters: a quality in the word that makes it heavy on the tongue and hard to pronounce<\/td><td class=\"a\">تنافر الحروف<\/td><\/tr><tr><td class=\"t\">Mukhālafat al-qiyās<\/td><td>contravention of the rule: the word’s not following the morphological norm<\/td><td class=\"a\">مخالفة القياس<\/td><\/tr><tr><td class=\"t\">Gharābah<\/td><td>strangeness: the word’s not being clear in meaning<\/td><td class=\"a\">الغرابة<\/td><\/tr><tr><td class=\"t\">Tanāfur al-kalimāt<\/td><td>mutual repulsion of the words: a quality in speech that makes it heavy on the tongue and hard to pronounce<\/td><td class=\"a\">تنافر الكلمات<\/td><\/tr><tr><td class=\"t\">Ḍaʿf al-taʾlīf<\/td><td>weakness of composition: speech’s not following the well-known grammatical rule<\/td><td class=\"a\">ضعف التأليف<\/td><\/tr><tr><td class=\"t\">Taʿqīd<\/td><td>complexity: speech’s being obscure in indicating the intended meaning<\/td><td class=\"a\">التعقيد<\/td><\/tr><tr><td class=\"t\">Taʿqīd lafẓī<\/td><td>verbal complexity, from putting first, putting later or separating<\/td><td class=\"a\">تعقيداً لفظيًّا<\/td><\/tr><tr><td class=\"t\">Taʿqīd maʿnawī<\/td><td>semantic complexity, from figures of speech and metonymies whose intended sense is not understood<\/td><td class=\"a\">تعقيداً معنويًّا<\/td><\/tr><tr><td class=\"t\">Malakah<\/td><td>a settled faculty: a quality of the soul rooted through repetition<\/td><td class=\"a\">ملكة<\/td><\/tr><tr><td class=\"t\">Balāghah<\/td><td>lexically, arriving and reaching the end; technically a description of speech and the speaker<\/td><td class=\"a\">البلاغة<\/td><\/tr><tr><td class=\"t\">Ḥāl / Maqām<\/td><td>the situation or occasion: the matter that leads the speaker to bring his expression in a particular form<\/td><td class=\"a\">الحال / المقام<\/td><\/tr><tr><td class=\"t\">Muqtaḍā / al-Iʿtibār al-munāsib<\/td><td>the requirement or appropriate consideration: the particular form in which the expression is brought<\/td><td class=\"a\">المقتضى / الاعتبار المناسب<\/td><\/tr><tr><td class=\"t\">Iṭnāb<\/td><td>expansiveness, called for e.g. by praise<\/td><td class=\"a\">الإطناب<\/td><\/tr><tr><td class=\"t\">Ījāz<\/td><td>concision, called for e.g. by the addressee’s intelligence<\/td><td class=\"a\">الإيجاز<\/td><\/tr><tr><td class=\"t\">Dhawq<\/td><td>taste: a faculty of the soul by which the subtleties of speech are perceived<\/td><td class=\"a\">الذوق<\/td><\/tr><\/table><\/div><h3>QUESTIONS AND ANSWERS<span class=\"ar\">أسئلة وأجوبة<\/span><\/h3><div class=\"qabox\"><div class=\"qh\">QUESTIONS AND ANSWERS · ADDED BY THE COMPANION<\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>What does <i>faṣāḥah<\/i> mean in the language, and what three things does it describe in technical usage?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>In the language it means clarity and manifestness, as in ‎<span class=\"arin\">أفصح الصبيّ في منطقه<\/span>‎. Technically it describes the word, speech, and the speaker.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>Name the three faults a word must be free of to be <i>faṣīḥ<\/i>, with one example of each from the book.<\/div><div class=\"a\"><span class=\"k\">A.<\/span>Mutual repulsion of the letters, e.g. ‎<span class=\"arin\">الهعخع<\/span>‎; contravention of the rule, e.g. ‎<span class=\"arin\">بوقات<\/span>‎ for ‎<span class=\"arin\">أبواق<\/span>‎; and strangeness, e.g. ‎<span class=\"arin\">تكأكأ<\/span>‎ for ‎<span class=\"arin\">اجتمع<\/span>‎.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>Why is ‎<span class=\"arin\">مَوْدَدَةٍ<\/span>‎ a fault, and what should it have been?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>The rule of <i>ṣarf<\/i> requires the two identical letters to be merged by <i>idghām<\/i>, giving ‎<span class=\"arin\">مودّة<\/span>‎. Splitting them goes against the rule.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>What extra condition does the <i>faṣāḥah<\/i> of speech have that the <i>faṣāḥah<\/i> of the word does not?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>Besides being free of its own three faults, speech must be made of words that are each <i>faṣīḥ<\/i>.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>What is the difference between <i>tanāfur al-ḥurūf<\/i> and <i>tanāfur al-kalimāt<\/i>?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>In the first, the heaviness comes from the letters inside one word; in the second, the words may each be easy, but they are heavy when said together.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>Explain the weakness of composition in ‎<span class=\"arin\">جَزَى بَنُوْهُ أَبَا الْغِيْلاَنِ<\/span>‎.<\/div><div class=\"a\"><span class=\"k\">A.<\/span>The pronoun in ‎<span class=\"arin\">بَنُوْهُ<\/span>‎ refers to ‎<span class=\"arin\">أَبَا الْغِيْلاَنِ<\/span>‎, which comes after it in wording and is also later in rank, being the object. Using a pronoun before what it refers to in both ways goes against the well-known rule of grammar.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>What are the two kinds of <i>taʿqīd<\/i>, and what causes each?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>Verbal complexity, caused by putting words first, later, or separating them; and semantic complexity, caused by using figures of speech and metonymies whose intended meaning is not understood.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>Why is ‎<span class=\"arin\">نشر الملك ألسنته في المدينة<\/span>‎ an example of semantic complexity?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>Spies are called the king's eyes, not his tongues. Using <i>tongues<\/i> for spies is not a known figure, so the meaning is not understood. The correct expression is ‎<span class=\"arin\">نشر عيونه<\/span>‎.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>Define the <i>faṣāḥah<\/i> of the speaker. Why does it say \"a settled faculty\" and \"on any purpose\"?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>It is a <i>malakah<\/i> by which one can express what is intended in <i>faṣīḥ<\/i> speech on any purpose. \"Settled faculty\" shows it is a lasting ability, not a single correct sentence; \"any purpose\" shows it is not limited to one kind of subject.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>Define the <i>balāghah<\/i> of speech, and explain <i>ḥāl<\/i> and <i>muqtaḍā<\/i> with the book's examples.<\/div><div class=\"a\"><span class=\"k\">A.<\/span>It is speech's conformity to what the situation requires, together with its <i>faṣāḥah<\/i>. The <i>ḥāl<\/i> is what leads the speaker to choose a particular form (e.g. praise, or the listener's intelligence); the <i>muqtaḍā<\/i> is that form (e.g. expansiveness for praise, concision for an intelligent listener).<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>Is every <i>faṣīḥ<\/i> sentence <i>balīgh<\/i>? Explain.<\/div><div class=\"a\"><span class=\"k\">A.<\/span>No. <i>Balāghah<\/i> includes <i>faṣāḥah<\/i> plus fitting the situation. A sentence may be clear and correct but not suit the occasion, so it is <i>faṣīḥ<\/i> but not <i>balīgh<\/i>.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>Which science reveals each of these faults: mutual repulsion, strangeness, semantic complexity?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>Mutual repulsion is known by taste; strangeness by wide reading in the speech of the Arabs; semantic complexity by <i>ʿilm al-bayān<\/i>.<\/div><\/div><\/div>", "terms": [{"t": "Faṣāḥah", "m": "lexically, clarity and manifestness; technically a description of the word, speech and the speaker", "a": "الفصاحة"}, {"t": "Tanāfur al-ḥurūf", "m": "mutual repulsion of the letters: a quality in the word that makes it heavy on the tongue and hard to pronounce", "a": "تنافر الحروف"}, {"t": "Mukhālafat al-qiyās", "m": "contravention of the rule: the word’s not following the morphological norm", "a": "مخالفة القياس"}, {"t": "Gharābah", "m": "strangeness: the word’s not being clear in meaning", "a": "الغرابة"}, {"t": "Tanāfur al-kalimāt", "m": "mutual repulsion of the words: a quality in speech that makes it heavy on the tongue and hard to pronounce", "a": "تنافر الكلمات"}, {"t": "Ḍaʿf al-taʾlīf", "m": "weakness of composition: speech’s not following the well-known grammatical rule", "a": "ضعف التأليف"}, {"t": "Taʿqīd", "m": "complexity: speech’s being obscure in indicating the intended meaning", "a": "التعقيد"}, {"t": "Taʿqīd lafẓī", "m": "verbal complexity, from putting first, putting later or separating", "a": "تعقيداً لفظيًّا"}, {"t": "Taʿqīd maʿnawī", "m": "semantic complexity, from figures of speech and metonymies whose intended sense is not understood", "a": "تعقيداً معنويًّا"}, {"t": "Malakah", "m": "a settled faculty: a quality of the soul rooted through repetition", "a": "ملكة"}, {"t": "Balāghah", "m": "lexically, arriving and reaching the end; technically a description of speech and the speaker", "a": "البلاغة"}, {"t": "Ḥāl / Maqām", "m": "the situation or occasion: the matter that leads the speaker to bring his expression in a particular form", "a": "الحال / المقام"}, {"t": "Muqtaḍā / al-Iʿtibār al-munāsib", "m": "the requirement or appropriate consideration: the particular form in which the expression is brought", "a": "المقتضى / الاعتبار المناسب"}, {"t": "Iṭnāb", "m": "expansiveness, called for e.g. by praise", "a": "الإطناب"}, {"t": "Ījāz", "m": "concision, called for e.g. by the addressee’s intelligence", "a": "الإيجاز"}, {"t": "Dhawq", "m": "taste: a faculty of the soul by which the subtleties of speech are perceived", "a": "الذوق"}], "part": null}, {"num": 2, "title": "The Science of Meanings", "ar": "علم المعاني", "body": "<div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 28<\/span><\/div><div class=\"ar\">هو علم يعرف به أحوال اللفظ العربيّ التي بها يطابق مقتضى الحال، فتختلف صور الكلام لاختلاف الأحوال،<\/div><div class=\"tr\">It is a science by which are known the states of the Arabic utterance through which it conforms to what the situation requires; so the forms of speech differ because the situations differ.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>This is the first of the three sciences of <i>balāghah<\/i>. In Chapter I you learnt that speech is <i>balīgh<\/i> when it fits what the situation requires. <i>ʿIlm al-maʿānī<\/i> is the science that teaches you <b>how<\/b> to make it fit.<\/p><p>It studies the <b>states of the Arabic utterance<\/b>: whether a sentence is a statement or not, whether a word is mentioned or left out, put first or later, made definite or indefinite, joined or separated, said briefly or at length, and so on. Each of these states suits some situations and not others.<\/p><p>The last words of the definition are the key idea of the whole science: <b>the forms of speech differ because the situations differ<\/b>. The same meaning is said one way to one listener and another way to another, because their situations are different.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 28–29<\/span><\/div><div class=\"ar\">مثال ذلك قوله تعالى: ﴿وَأَنَّا لاَ نَدْرِي أَشَرٌّ أُرِيدَ بِمَن فِي الأَرْضِ أَمْ أَرَادَ بِهِمْ رَبُّهُمْ رَشَداً﴾ [الجن : ١٠]؛ فإنّ ما قبل «أم» صورة من الكلام تخالف صورة مابعدها؛ لأنّ الأولى فيها فعل الإرادة مبنيّ للمجهول، والثانية فيها فعل الإرادة مبنيّ للمعلوم، والحال الداعي لذلك نسبة الخير إليه سبحانه في الثانية، ومنع نسبة الشرّ إليه في الأولى.<\/div><div class=\"tr\">An example of this is His saying (Exalted is He): “And we do not know whether evil is intended for those on earth, or whether their Lord intends for them right guidance” [al-Jinn 72:10]. What comes before “or” (‎<span class=\"arin\">أم<\/span>‎) is a form of speech that differs from the form of what comes after it. In the first, the verb of intending is in the passive voice; in the second, the verb of intending is in the active voice. The situation calling for this is the attribution of good to Him (Glorified is He) in the second, and the avoidance of attributing evil to Him in the first.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>The verse is a perfect example of one meaning being shaped by the situation. It contains two parallel questions, joined by ‎<span class=\"arin\">أم<\/span>‎: is evil intended for those on earth, or does their Lord intend good for them?<\/p><p>Look at the verb of intending in each half. In the first half it is passive: ‎<span class=\"arin\">أُرِيدَ<\/span>‎, <i>is intended<\/i>, without saying who intends. In the second it is active, with the doer named: ‎<span class=\"arin\">أَرَادَ بِهِمْ رَبُّهُمْ<\/span>‎, <i>their Lord intends<\/i>.<\/p><p>Why the difference? The situation is speaking about Allah. Good is openly attributed to Him, so His name is mentioned with <i>right guidance<\/i>; but out of reverence, evil is not openly attributed to Him, so the verb with <i>evil<\/i> is made passive. The situation (reverence for Allah) called for a particular form (passive in one half, active in the other), and that is exactly what <i>ʿilm al-maʿānī<\/i> studies.<\/p><\/div><div class=\"cnote\"><span class=\"cnh\">COMPANION&#8217;S NOTE · NOT IN THE BOOK<\/span><p>The book prints ‎<span class=\"arin\">مابعدها<\/span>‎ as one word on p. 28; the usual spelling is ‎<span class=\"arin\">ما بعدها<\/span>‎ (“what comes after it”).<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 29<\/span><\/div><div class=\"ar\">وينحصر الكلام على هذا العلم في ثمانية أبواب وخاتمة.<\/div><div class=\"tr\">The discussion of this science is confined to eight chapters and a conclusion.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>The book now gives the plan of Part One. The topics of <i>ʿilm al-maʿānī<\/i> are set out in eight chapters (<i>abwāb<\/i>) and a conclusion (<i>khātimah<\/i>). In this companion they are Chapters III to XI.<\/p><\/div><div class=\"chartbox\"><div class=\"chh\">THE EIGHT CHAPTERS OF ʿILM AL-MAʿĀNĪ · DRAWN BY THE COMPANION<\/div><table class=\"grid\"><thead><tr><th><\/th><th>The book's chapter<\/th><th>In this companion<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>‎<span class=\"arin\">الخبر والإنشاء<\/span>‎ · Statement and non-statement<\/td><td>Chapter III<\/td><\/tr><tr><td>2<\/td><td>‎<span class=\"arin\">الذكر والحذف<\/span>‎ · Mention and omission<\/td><td>Chapter IV<\/td><\/tr><tr><td>3<\/td><td>‎<span class=\"arin\">التقديم والتأخير<\/span>‎ · Putting before and after<\/td><td>Chapter V<\/td><\/tr><tr><td>4<\/td><td>‎<span class=\"arin\">التعريف والتنكير<\/span>‎ · Definite and indefinite<\/td><td>Chapter VI<\/td><\/tr><tr><td>5<\/td><td>‎<span class=\"arin\">الإطلاق والتقييد<\/span>‎ · Unrestricted and restricted<\/td><td>Chapter VII<\/td><\/tr><tr><td>6<\/td><td>‎<span class=\"arin\">القصر<\/span>‎ · Restriction<\/td><td>Chapter VIII<\/td><\/tr><tr><td>7<\/td><td>‎<span class=\"arin\">الوصل والفصل<\/span>‎ · Joining and separating<\/td><td>Chapter IX<\/td><\/tr><tr><td>8<\/td><td>‎<span class=\"arin\">الإيجاز والإطناب والمساواة<\/span>‎ · Brevity, expansion, equality<\/td><td>Chapter X<\/td><\/tr><tr><td><\/td><td>Conclusion · speech contrary to the apparent situation<\/td><td>Chapter XI<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box\"><div class=\"bh\">KEY TERMS AND THEIR MEANINGS · ADDED BY THE COMPANION<\/div><table class=\"terms\"><tr><td class=\"t\">ʿIlm al-Maʿānī<\/td><td>the Science of Meanings: the science by which the states of the Arabic utterance are known, through which it conforms to what the situation requires<\/td><td class=\"a\">علم المعاني<\/td><\/tr><tr><td class=\"t\">Muqtaḍā al-ḥāl<\/td><td>what the situation requires<\/td><td class=\"a\">مقتضى الحال<\/td><\/tr><tr><td class=\"t\">Muqtaḍayāt al-aḥwāl<\/td><td>the requirements of the situations: the particular forms in which speech is cast<\/td><td class=\"a\">مقتضيات الأحوال<\/td><\/tr><tr><td class=\"t\">Mabnī lil-majhūl / lil-maʿlūm<\/td><td>a verb built for the passive / for the active voice<\/td><td class=\"a\">مبنيّ للمجهول / مبنيّ للمعلوم<\/td><\/tr><\/table><\/div><h3>QUESTIONS AND ANSWERS<span class=\"ar\">أسئلة وأجوبة<\/span><\/h3><div class=\"qabox\"><div class=\"qh\">QUESTIONS AND ANSWERS · ADDED BY THE COMPANION<\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>Define <i>ʿilm al-maʿānī<\/i>.<\/div><div class=\"a\"><span class=\"k\">A.<\/span>It is a science by which the states of the Arabic utterance are known, through which it conforms to what the situation requires.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>What does the book mean by \"the forms of speech differ because the situations differ\"?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>The same idea is expressed in different forms (passive or active, brief or long, and so on) because each situation calls for its own form.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>In ‎<span class=\"arin\">﴿أَشَرٌّ أُرِيدَ بِمَن فِي الأَرْضِ أَمْ أَرَادَ بِهِمْ رَبُّهُمْ رَشَداً﴾<\/span>‎, how do the two halves differ, and what situation calls for this?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>The first verb is passive and the second active. Good is attributed to Allah openly, while evil is not attributed to Him; so the verb with evil is made passive.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>How many chapters does the book give to <i>ʿilm al-maʿānī<\/i>?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>Eight chapters and a conclusion.<\/div><\/div><\/div>", "terms": [{"t": "ʿIlm al-Maʿānī", "m": "the Science of Meanings: the science by which the states of the Arabic utterance are known, through which it conforms to what the situation requires", "a": "علم المعاني"}, {"t": "Muqtaḍā al-ḥāl", "m": "what the situation requires", "a": "مقتضى الحال"}, {"t": "Muqtaḍayāt al-aḥwāl", "m": "the requirements of the situations: the particular forms in which speech is cast", "a": "مقتضيات الأحوال"}, {"t": "Mabnī lil-majhūl / lil-maʿlūm", "m": "a verb built for the passive / for the active voice", "a": "مبنيّ للمجهول / مبنيّ للمعلوم"}], "part": [1, "ʿIlm al-Maʿānī", "علم المعاني"]}, {"num": 3, "title": "Statement and Non-Statement", "ar": "الباب الأوّل في الخبر والإنشاء", "body": "<div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 30<\/span><\/div><div class=\"ar\">كلّ كلام فهو إمّا خبر أو إنشاء، والخبر ما يصحّ أن يقال لقائله: إنّه صادق فيه أو كاذب، كـ«سافر محمّد»، و«عليّ مقيم».<\/div><div class=\"tr\">All speech is either a statement (<i>khabar<\/i>) or a non-statement (<i>inshāʾ<\/i>). A statement is that of which it is valid to say to its speaker: “He is truthful in it” or “lying”, such as “Muḥammad travelled” and “ʿAlī is staying”.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>This chapter begins by dividing all speech into two kinds. The test is simple: can you reply to the speaker, \"You are telling the truth\" or \"You are lying\"?<\/p><p>If you can, the speech is a <b>statement<\/b> (<i>khabar<\/i>). ‎<span class=\"arin\">سافر محمّد<\/span>‎ (Muḥammad travelled) tells us something about the world; it may be true or false, so it is a <i>khabar<\/i>. The same goes for ‎<span class=\"arin\">عليّ مقيم<\/span>‎ (ʿAlī is staying).<\/p><p>Notice that the test is whether it is <b>valid<\/b> to say it, not whether the statement is actually true. A false statement is still a statement.<\/p><\/div><div class=\"chartbox\"><div class=\"chh\">ALL SPEECH · DRAWN BY THE COMPANION<\/div><div class=\"tree\"><div class=\"node\">Kalām<span class=\"ar\">الكلام<\/span><\/div><div class=\"stem\"><\/div><div class=\"bar\" style=\"margin:0 25.00%\"><\/div><div class=\"row\"><div class=\"col\"><div class=\"node\">Khabar<span class=\"ar\">خبر<\/span><\/div><div class=\"sub\">can be called true or false<\/div><\/div><div class=\"col\"><div class=\"node\">Inshāʾ<span class=\"ar\">إنشاء<\/span><\/div><div class=\"sub\">cannot be called true or false<\/div><\/div><\/div><\/div><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 30<\/span><\/div><div class=\"ar\">والإنشاء ما لا يصحّ أن يقال لقائله ذلك، كـ«سافر يامحمّد»، و«أقم يا عليّ».<\/div><div class=\"tr\">A non-statement is that of which it is not valid to say that to its speaker, such as “Travel, O Muḥammad” and “Stay, O ʿAlī”.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>A <b>non-statement<\/b> (<i>inshāʾ<\/i>) is speech about which it makes no sense to say \"true\" or \"false\". ‎<span class=\"arin\">سافر يامحمّد<\/span>‎ (Travel, O Muḥammad!) does not report anything about the world: it asks for something to be done. You can obey it or refuse it, but you cannot call it a lie.<\/p><p>Compare the book's pairs: ‎<span class=\"arin\">سافر محمّد<\/span>‎ and ‎<span class=\"arin\">سافر يامحمّد<\/span>‎ use the same verb, but the first is a <i>khabar<\/i> and the second an <i>inshāʾ<\/i>.<\/p><\/div><div class=\"cnote\"><span class=\"cnh\">COMPANION&#8217;S NOTE · NOT IN THE BOOK<\/span><p>The book prints ‎<span class=\"arin\">يامحمّد<\/span>‎ as one word on p. 30; the usual spelling is ‎<span class=\"arin\">يا محمّد<\/span>‎.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 31<\/span><\/div><div class=\"ar\">والمراد بصدق الخبر مطابقته للواقع، وبكذبه عدم مطابقته له؛ فجملة «عليّ مقيم»، إن كانت النسبة المفهومة منها مطابقة لِما في الخارج فصدق، وإلاّ فكذب.<\/div><div class=\"tr\">What is meant by the truth of a statement is its matching reality, and by its falsehood its not matching it. So the sentence “ʿAlī is staying”: if the relation understood from it matches what is in the external world, it is true; otherwise it is false.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>Here the book makes the words <i>true<\/i> and <i>false<\/i> precise. A statement is <b>true<\/b> (<i>ṣidq<\/i>) when what it says matches <b>reality<\/b> (<i>al-wāqiʿ<\/i>), and <b>false<\/b> (<i>kadhib<\/i>) when it does not.<\/p><p>Every statement links two things; the book calls this link the <b>relation<\/b> (<i>nisbah<\/i>). In ‎<span class=\"arin\">عليّ مقيم<\/span>‎ the relation is <i>staying<\/i> being linked to <i>ʿAlī<\/i>. If ʿAlī really is staying, the relation matches what is in the outside world and the statemen
