llen cloak) and ‎<span class=\"arin\">البَرْدِ<\/span>‎ (cold). The cloak protects from the cold. (Notice also ‎<span class=\"arin\">جُبَّةُ<\/span>‎ and ‎<span class=\"arin\">جُنَّةُ<\/span>‎.)<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 212<\/span><\/div><div class=\"ar\">ومطرَّف: إن اختلفا في عدد الحروف فقط وكانت الزيادة أوّلاً، ومذيَّل: إن كانت الزيادة آخراً، نحو:<span class=\"bayt\"><span class=\"h1\">يَمُدُّوْنَ مِنْ أَيْدٍ عَوَاصٍ عَوَاصِمَ<\/span><span class=\"h2\">تَصُوْلُ بِأَسْيَافٍ قَوَاضٍ قَوَاضِبَ<\/span><\/span><\/div><div class=\"tr\">And it is <i>muṭarraf<\/i> (edged) if they differ in the number of letters only and the addition is at the beginning; and <i>mudhayyal<\/i> (tailed) if the addition is at the end, as in:<br>They stretch out [forearms] from hands that strike (<i>ʿawāṣin<\/i>), that protect (<i>ʿawāṣim<\/i>), assailing with swords that decide (<i>qawāḍin<\/i>), that cut (<i>qawāḍib<\/i>).<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>They differ in the <b>number<\/b> of letters. If the extra letter is at the <b>start<\/b>, it is <b>muṭarraf<\/b>; if at the <b>end<\/b>, <b>mudhayyal<\/b>. In the line, ‎<span class=\"arin\">عَوَاصٍ<\/span>‎ / ‎<span class=\"arin\">عَوَاصِمَ<\/span>‎ and ‎<span class=\"arin\">قَوَاضٍ<\/span>‎ / ‎<span class=\"arin\">قَوَاضِبَ<\/span>‎ each add a letter at the end, so they are <i>mudhayyal<\/i>.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 213<\/span><\/div><div class=\"ar\">ومضارع إن اختلفا في حرفَين غير متباعدي المخرج، نحو: «ينهون» و«ينئون»، ولاحق إن تباعدا، نحو: ﴿وَإِنَّهُ عَلَى ذَلِكَ لَشَهِيدٌ ○ وَإِنَّهُ لِحُبِّ الْخَيْرِ لَشَدِيدٌ﴾ [العاديات: ٧-٨]، وجناس قلب إن اختلفا في ترتيب الحروف فقط، كـ:«نيل» و«لين» و«ساق» و«قاس».<\/div><div class=\"tr\">And it is <i>muḍāriʿ<\/i> (approximating) if they differ in two letters whose points of articulation are not far apart, as in «they forbid» (<i>yanhawna<\/i>) and «they keep away» (<i>yanʾawna<\/i>); and <i>lāḥiq<\/i> (adjoined) if they are far apart, as in: ﴿And indeed he is a witness (<i>la-shahīd<\/i>) to that, ○ and indeed he is intense (<i>la-shadīd<\/i>) in love of wealth﴾ [al-ʿĀdiyāt 100:7–8]; and <i>jinās qalb<\/i> (inversion) if they differ in the order of the letters only, like «<i>nayl<\/i>» (attainment) and «<i>līn<\/i>» (softness), and «<i>sāq<\/i>» (shank) and «<i>qās<\/i>» (he measured).<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>They differ in <b>one letter<\/b>. If the two letters are <b>close<\/b> in where they are pronounced, it is <b>muḍāriʿ<\/b>: ‎<span class=\"arin\">ينهون<\/span>‎ / ‎<span class=\"arin\">ينئون<\/span>‎ (<i>hāʾ<\/i> and hamzah, both from the throat). If they are <b>far apart<\/b>, it is <b>lāḥiq<\/b>: ‎<span class=\"arin\">لَشَهِيدٌ<\/span>‎ / ‎<span class=\"arin\">لَشَدِيدٌ<\/span>‎ (<i>hāʾ<\/i> from the throat, <i>dāl<\/i> from the tongue).<\/p><p>They differ <b>only in order<\/b>: <b>jinās qalb<\/b>. ‎<span class=\"arin\">نيل<\/span>‎ / ‎<span class=\"arin\">لين<\/span>‎ and ‎<span class=\"arin\">ساق<\/span>‎ / ‎<span class=\"arin\">قاس<\/span>‎ have the same letters rearranged.<\/p><\/div><div class=\"chartbox\"><div class=\"chh\">THE KINDS OF JINĀS · DRAWN BY THE COMPANION<\/div><table class=\"grid\"><thead><tr><th>Kind<\/th><th>How the two words relate<\/th><th>Book's example<\/th><\/tr><\/thead><tbody><tr><td><b>Complete<\/b><\/td><td>same vowels, letters, number, order<\/td><td><\/td><\/tr><tr><td>Mutamāthil ‎<span class=\"arin\">متماثل<\/span>‎<\/td><td>same kind of word<\/td><td>‎<span class=\"arin\">إِنْسَاناً<\/span>‎ / ‎<span class=\"arin\">إِنْسَاناً<\/span>‎<\/td><\/tr><tr><td>Mustawfā ‎<span class=\"arin\">مستوفًى<\/span>‎<\/td><td>different kinds of word<\/td><td>‎<span class=\"arin\">فَدَارِهِمْ<\/span>‎ / ‎<span class=\"arin\">دَارِهِمْ<\/span>‎<\/td><\/tr><tr><td>Mutashābih ‎<span class=\"arin\">متشابه<\/span>‎<\/td><td>two-word / one-word, written alike<\/td><td>‎<span class=\"arin\">ذَا هِبَةٍ<\/span>‎ / ‎<span class=\"arin\">ذَاهِبَةٌ<\/span>‎<\/td><\/tr><tr><td>Mafrūq ‎<span class=\"arin\">مفروق<\/span>‎<\/td><td>two-word / one-word, written differently<\/td><td>‎<span class=\"arin\">جَامَ لَنَا<\/span>‎ / ‎<span class=\"arin\">جَامَلَنَا<\/span>‎<\/td><\/tr><tr><td><b>Incomplete<\/b><\/td><td>differ in one of the four<\/td><td><\/td><\/tr><tr><td>Muḥarraf ‎<span class=\"arin\">مُحرّف<\/span>‎<\/td><td>vowels only<\/td><td>‎<span class=\"arin\">البُرْدِ<\/span>‎ / ‎<span class=\"arin\">البَرْدِ<\/span>‎<\/td><\/tr><tr><td>Muṭarraf / Mudhayyal<\/td><td>an extra letter at the start / end<\/td><td>‎<span class=\"arin\">عَوَاصٍ<\/span>‎ / ‎<span class=\"arin\">عَوَاصِمَ<\/span>‎<\/td><\/tr><tr><td>Muḍāriʿ / Lāḥiq<\/td><td>one letter, close / far in articulation<\/td><td>‎<span class=\"arin\">ينهون<\/span>‎ / ‎<span class=\"arin\">ينئون<\/span>‎؛ ‎<span class=\"arin\">لَشَهِيدٌ<\/span>‎ / ‎<span class=\"arin\">لَشَدِيدٌ<\/span>‎<\/td><\/tr><tr><td>Jinās qalb ‎<span class=\"arin\">جناس قلب<\/span>‎<\/td><td>order only<\/td><td>‎<span class=\"arin\">نيل<\/span>‎ / ‎<span class=\"arin\">لين<\/span>‎<\/td><\/tr><\/tbody><\/table><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 214–215<\/span><\/div><div class=\"ar\">(٣) التصدير ويسمّى «ردَّ العَجُز على الصدْر»، هو في النثر أن يُجعل أحد اللفظَين المكرّرَين أو المتجانِسَين أو الملحَقَين بِهما بأن جمَعَهما اشتقاقٌ أو شبهُه في أوّل الفقرة والثاني في آخرها، نحو قوله تعالى: ﴿وَتَخْشَى النَّاسَ وَاللَّهُ أَحَقُّ أَن تَخْشَاهُ﴾ [الأحزاب: ٣٧]. وقولك: «سائل اللئيم يرجع ودمعه سائل»؛ الأوّل من السؤال والثاني من السَيلان، ونحو: ﴿اسْتَغْفِرُوا رَبَّكُمْ إِنَّهُ كَانَ غَفَّاراً﴾ [نوح: ١٠]. أو نحو: ﴿قَالَ إِنِّي لِعَمَلِكُم مِّنَ الْقَالِينَ﴾ [الشعراء: ١٦٨].<\/div><div class=\"tr\">(3) <i>Al-taṣdīr<\/i> (fronting), which is also called «returning the end upon the beginning» (<i>radd al-ʿajuz ʿalā al-ṣadr<\/i>). In prose it is that one of two repeated words, or two homonymous words, or two words joined to these [i.e. to homonymous words] because derivation or something resembling it brings them together, is placed at the beginning of the clause and the other at its end; as in His words, Exalted is He: ﴿And you fear the people, while Allah has more right that you should fear Him﴾ [al-Aḥzāb 33:37]; and as you say: «The one who asks (<i>sāʾil<\/i>) of the base man comes back with his tears flowing (<i>sāʾil<\/i>)» — the first is from asking (<i>suʾāl<\/i>) and the second from flowing (<i>sayalān<\/i>); and as in: ﴿Seek forgiveness of your Lord; indeed He is ever Most Forgiving﴾ [Nūḥ 71:10]; or as in: ﴿He said: Indeed I am, of your deed, among those who detest it﴾ [al-Shuʿarāʾ 26:168].<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Taṣdīr<\/b>, also called \"returning the end to the beginning\": two related words, one at the <b>start<\/b> of a clause and one at its <b>end<\/b>, so the end echoes the beginning. The two words may be the same word, a <i>jinās<\/i> pair, or words linked by derivation.<p>Same word: ‎<span class=\"arin\">وَتَخْشَى<\/span>‎ … ‎<span class=\"arin\">تَخْشَاهُ<\/span>‎. A <i>jinās<\/i> pair: ‎<span class=\"arin\">سائل<\/span>‎ (one who asks) … ‎<span class=\"arin\">سائل<\/span>‎ (flowing). Derived from one root: ‎<span class=\"arin\">اسْتَغْفِرُوا<\/span>‎ … ‎<span class=\"arin\">غَفَّاراً<\/span>‎. Something like derivation: ‎<span class=\"arin\">قَالَ<\/span>‎ … ‎<span class=\"arin\">الْقَالِينَ<\/span>‎ (they look related but come from different roots).<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 216–217<\/span><\/div><div class=\"ar\">وفي النظم أن يكون أحدهما في آخر البيت والآخر في صدر المصراع الأوّل أو بعده، نحو قوله:<span class=\"bayt\"><span class=\"h1\">سَرِيْعٌ إِلَى ابْنِ الْعَمِّ يَلْطِمُ وَجْهَهُ<\/span><span class=\"h2\">وَلَيْسَ إِلَى دَاعِي النَدَى بِسَرِيْعِ<\/span><\/span>وقوله:<span class=\"bayt\"><span class=\"h1\">تَمَتَّعْ مِنْ شَمِيْمِ عَرَارِ نَجْدٍ<\/span><span class=\"h2\">فَمَا بَعْدَ العَشِيَّةِ مِنْ عَرَارِ<\/span><\/span><\/div><div class=\"tr\">And in verse it is that one of them is at the end of the line and the other at the beginning of the first hemistich or after it, as in his words:<br>Quick (<i>sarīʿ<\/i>) against his cousin, slapping his face — but towards the one who calls to generosity he is not quick (<i>bi-sarīʿ<\/i>).<br>And his words:<br>Enjoy the scent of the oxeye (<i>ʿarār<\/i>) of Najd, for after this evening there is no oxeye (<i>ʿarār<\/i>).<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>In poetry, one word is at the <b>very end<\/b> of the line and the other at the <b>start<\/b> of the first half, or somewhere after it. ‎<span class=\"arin\">سَرِيْعٌ<\/span>‎ opens the line and ‎<span class=\"arin\">بِسَرِيْعِ<\/span>‎ closes it. In the second line, ‎<span class=\"arin\">عَرَارِ<\/span>‎ comes within the first half and again at the end.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 217–218<\/span><\/div><div class=\"ar\">(٤) السجع: هو توافُق الفاصِلتَين نثراً في الحرف الأخير، وهو ثلاثة أنواع: مطرّف إن اختلف الفاصلتان في الوزن، نحو: «الإنسان بآدابه لا بزيّة وثيابه»، ومتوازٍ: إن اتفقتا فيه، نحو: «المرء بعلمه وأدبه لا بحسبه ونسبه»، ومرصّع: إن اتفقت ألفاظ الفِقرتَين أو أكثرُها في الوزن والتقفية، نحو:<span class=\"bayt\"><span class=\"h1\">يَطْبَعُ الأَسْجَاعَ بِجَوَاهِرِ لَفْظِهِ<\/span><span class=\"h2\">وَيَقْرَعُ الأَسْمَاعَ بِزَوَاجِرِ وَعْظِهِ<\/span><\/span><\/div><div class=\"tr\">(4) <i>Al-sajʿ<\/i> (rhymed prose): it is the agreement of the two clause-endings (<i>fāṣilatān<\/i>) in prose in the last letter. It is of three kinds: <i>muṭarraf<\/i> (edge-rhymed) if the two clause-endings differ in measure, as in: «A man is [valued] by his good manners (<i>ādābihi<\/i>), not by his dress and his clothes (<i>thiyābihi<\/i>)»; <i>mutawāzin<\/i> (balanced) if they agree in it [i.e. in measure], as in: «A man is [valued] by his knowledge and his manners (<i>adabihi<\/i>), not by his rank and his lineage (<i>nasabihi<\/i>)»; and <i>muraṣṣaʿ<\/i> (inlaid) if the words of the two clauses, or most of them, agree in measure and rhyme, as in:<br>He fashions rhymed phrases (<i>al-asjāʿ<\/i>) with the jewels (<i>bi-jawāhiri<\/i>) of his wording (<i>lafẓihi<\/i>), and knocks upon the ears (<i>al-asmāʿ<\/i>) with the restraints (<i>bi-zawājiri<\/i>) of his admonition (<i>waʿẓihi<\/i>).<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Sajʿ<\/b> (rhymed prose): two clauses of prose ending on the <b>same letter<\/b>, like rhyme in poetry. Three kinds:<b>Muṭarraf<\/b>: the endings rhyme but have <b>different patterns<\/b>: ‎<span class=\"arin\">آدابه<\/span>‎ / ‎<span class=\"arin\">ثيابه<\/span>‎.<b>Mutawāzin<\/b>: the endings rhyme <b>and<\/b> have the <b>same pattern<\/b>: ‎<span class=\"arin\">أدبه<\/span>‎ / ‎<span class=\"arin\">نسبه<\/span>‎.<b>Muraṣṣaʿ<\/b> (inlaid): <b>every word<\/b>, or most, in one clause matches its partner in the other: ‎<span class=\"arin\">يَطْبَعُ<\/span>‎ / ‎<span class=\"arin\">يَقْرَعُ<\/span>‎, ‎<span class=\"arin\">الأَسْجَاعَ<\/span>‎ / ‎<span class=\"arin\">الأَسْمَاعَ<\/span>‎, ‎<span class=\"arin\">بِجَوَاهِرِ<\/span>‎ / ‎<span class=\"arin\">بِزَوَاجِرِ<\/span>‎, ‎<span class=\"arin\">لَفْظِهِ<\/span>‎ / ‎<span class=\"arin\">وَعْظِهِ<\/span>‎.<\/div><div class=\"chartbox\"><div class=\"chh\">THE THREE KINDS OF SAJʿ · DRAWN BY THE COMPANION<\/div><table class=\"grid\"><thead><tr><th>Kind<\/th><th>Endings rhyme?<\/th><th>Same pattern?<\/th><th>All words match?<\/th><\/tr><\/thead><tbody><tr><td>Muṭarraf ‎<span class=\"arin\">مطرّف<\/span>‎<\/td><td>Yes<\/td><td>No<\/td><td>No<\/td><\/tr><tr><td>Mutawāzin ‎<span class=\"arin\">متواز<\/span>‎<\/td><td>Yes<\/td><td>Yes<\/td><td>No<\/td><\/tr><tr><td>Muraṣṣaʿ ‎<span class=\"arin\">مرصّع<\/span>‎<\/td><td>Yes<\/td><td>Yes<\/td><td>Yes, all or most<\/td><\/tr><\/tbody><\/table><\/div><div class=\"cnote\"><span class=\"cnh\">COMPANION&#8217;S NOTE · NOT IN THE BOOK<\/span><p>Printing note: the matn prints ‎<span class=\"arin\">«الإنسان بآدابه لا بزيّة وثيابه»<\/span>‎ with a final <i>tāʾ marbūṭah<\/i>; the sense (and the rhyme with ‎<span class=\"arin\">ثيابه<\/span>‎) points to ‎<span class=\"arin\">بزيّه<\/span>‎ (“by his dress”). It is reproduced as printed.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 219<\/span><\/div><div class=\"ar\">(٥) مالا يستحيل بالانعكاس ويسمّى «القلبَ»: هو كون اللفظ يقرء طرداً وعكساً، نحو: «كن كما أمكنك»، ﴿وَرَبَّكَ فَكَبِّرْ﴾ [المدّثر: ٣].<\/div><div class=\"tr\">(5) <i>Mā lā yastaḥīlu bi-l-inʿikās<\/i> (that which does not change when reversed), which is also called «inversion» (<i>al-qalb<\/i>): it is the wording’s being such that it is read forwards and backwards [alike], as in: «Be as it has been possible for you», and ﴿And your Lord — magnify﴾ [al-Muddaththir 74:3].<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Qalb<\/b> (palindrome): words that read the <b>same backwards<\/b>, letter by letter. ‎<span class=\"arin\">كن كما أمكنك<\/span>‎ and ‎<span class=\"arin\">وَرَبَّكَ فَكَبِّرْ<\/span>‎: read the letters from the end and you get the same thing.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 219<\/span><\/div><div class=\"ar\">(٦) العكس: هو أن يقدّم جزء في الكلام على آخرَ ثُمّ يعكس، نحو قولك: «قول الإمام إمام القول»، «حرّ الكلام كلام الحرّ».<\/div><div class=\"tr\">(6) <i>Al-ʿaks<\/i> (reversal): it is that one part in the speech is put before another and then it is reversed, as when you say: «The saying of the imam is the imam of sayings», and «The noblest of speech is the speech of the noble».<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>ʿAks<\/b> (reversal): two parts of a phrase are said, then said again <b>swapped<\/b>. \"The <b>saying<\/b> of the <b>imam<\/b> is the <b>imam<\/b> of <b>sayings<\/b>\"; \"the <b>noblest<\/b> of <b>speech<\/b> is the <b>speech<\/b> of the <b>noble<\/b>\".<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 219–220<\/span><\/div><div class=\"ar\">(٧) التشريع: هو بناء البيت على قافيتَين بحيث إذا سقط بعضه كان الباقي شعراً مفيداً، كقوله:<span class=\"bayt\"><span class=\"h1\">يَا أَيُّهَا الْمَلِكُ الَّذِيْ عَمَّ الْوَرَى<\/span><span class=\"h2\">مَا فِي الْكِرَامِ لَهُ نَظِيْرٌ يُنْظَرُ<\/span><\/span><span class=\"bayt\"><span class=\"h1\">لَوْ كَانَ مِثْلُكَ آخَرُ فِيْ عَصْرِنَا<\/span><span class=\"h2\">مَا كَانَ فِي الدُنْيَا فَقِيْرٌ مُعْسِرٌ<\/span><\/span>فإنّه يصحّ أن تحذف أواخر الشطور الأربعة ويبقى:<span class=\"bayt\"><span class=\"h1\">يَا أَيُّهَا الْمَلِكُ الَّذِيْ<\/span><span class=\"h2\">مَا فِي الْكِرَامِ لَهُ نَظِيْرٌ<\/span><\/span><span class=\"bayt\"><span class=\"h1\">لَوْ كَانَ مِثْلُكَ آخَرُ<\/span><span class=\"h2\">مَا كَانَ فِي الدُنْيَا فَقِيْرٌ<\/span><\/span><\/div><div class=\"tr\">(7) <i>Al-tashrīʿ<\/i>: it is building a line of verse on two rhymes, such that if part of it is dropped, what remains is meaningful verse, as in his words:<br>O king whose [bounty] has covered all creation — among the noble there is no equal to him to be seen;<br>were there another like you in our age, there would be no poor man in want in the world.<br>For it is valid to delete the ends of the four hemistichs, and there remains:<br>O king who — among the noble there is no equal to him;<br>were there another like you — there would be no poor man in the world.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Tashrīʿ<\/b>: a line built on <b>two rhymes<\/b>, so that if you cut off the last word of each half, what is left is still a good line of poetry with a different rhyme. Remove ‎<span class=\"arin\">عَمَّ الْوَرَى<\/span>‎، ‎<span class=\"arin\">يُنْظَرُ<\/span>‎، ‎<span class=\"arin\">فِيْ عَصْرِنَا<\/span>‎، ‎<span class=\"arin\">مُعْسِرٌ<\/span>‎ and the shorter lines that the book prints still work.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 220–221<\/span><\/div><div class=\"ar\">(٨) الموارِبة: هي أن يَجعل المتكلّم كلامه بحيث يُمكِنه أن يُغيّر معناه بتحريف أو تصحيف أو غيرهما ليسلم من المؤاخذة. كقول أبي نوّاس:<span class=\"bayt\"><span class=\"h1\">لَقَدْ ضَاعَ شِعْرِيْ عَلَى بَابِكُمْ<\/span><span class=\"h2\">كَمَا ضَاعَ عِقْدٌ عَلَى خَالِصَةَ<\/span><\/span>فلمّا أنكر عليه الرشيد ذلك قال: «لَمْ أقل إلاّ»:<span class=\"bayt\"><span class=\"h1\">لَقَدْ ضَاءَ شِعْرِيْ عَلَى بَابِكُمْ<\/span><span class=\"h2\">كَمَا ضَاءَ عِقْدٌ عَلَى خَالِصَه<\/span><\/span><\/div><div class=\"tr\">(8) <i>Al-muwārabah<\/i> (equivocation): it is that the speaker frames his speech so that he is able to change its meaning by altering [a vowel] or altering [a letter’s dots], or by something else, so as to be safe from being taken to task; as in the words of Abū Nuwās:<br>My poetry has been wasted (<i>ḍāʿa<\/i>) at your door, as a necklace was wasted on Khāliṣah.<br>When al-Rashīd objected to this, he said: «I said only»:<br>My poetry has shone (<i>ḍāʾa<\/i>) at your door, as a necklace shone on Khāliṣah.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Muwārabah<\/b>: wording things so that, by changing a small mark, you can turn the meaning and escape blame. Abū Nuwās wrote that his poetry was <b>wasted<\/b> (‎<span class=\"arin\">ضَاعَ<\/span>‎) at the caliph's door. When al-Rashīd objected, he claimed he had said it <b>shone<\/b> (‎<span class=\"arin\">ضَاءَ<\/span>‎), changing only the last letter.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 221<\/span><\/div><div class=\"ar\">(٩) ايتلاف اللفظ مع اللفظ هوكون ألفاظ العبارة من وادٍ واحد في الغرابة والتأهُّل، كقوله تعالى: ﴿تَاللّٰه تَفْتَأُ تَذْكُرُ يُوسُفَ﴾ [يوسف: ٨٥]، لَمّا أتى بالتاء الّتي هي أغرب حروف القسم، أتى بـ«تفتأ» الّتي هي أغرب أفعال الاستمرار.<\/div><div class=\"tr\">(9) <i>Iʾtilāf al-lafẓ maʿa al-lafẓ<\/i> (harmony of word with word): it is that the words of the expression are of one valley in strangeness and familiarity, as in His words, Exalted is He: ﴿By Allah, you will not cease remembering Yūsuf﴾ [Yūsuf 12:85]. When He used the <i>tāʾ<\/i>, which is the strangest of the particles of oath, He used «<i>tafta’u<\/i>», which is the strangest of the verbs of continuance.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Iʾtilāf al-lafẓ maʿa al-lafẓ<\/b>: the words of a phrase <b>match each other<\/b> in being rare or common. In ‎<span class=\"arin\">تَاللّٰه تَفْتَأُ تَذْكُرُ يُوسُفَ<\/span>‎, the oath uses ‎<span class=\"arin\">تَ<\/span>‎, the rarest oath particle; and so the verb of continuing is ‎<span class=\"arin\">تَفْتَأُ<\/span>‎, the rarest such verb, rather than a common one like ‎<span class=\"arin\">تزال<\/span>‎. Rare goes with rare.<p>Compare the last device of the previous chapter, where the words fitted the <i>meaning<\/i>; here the words fit <i>each other<\/i>.<\/p><\/div><div class=\"chartbox\"><div class=\"chh\">THE EMBELLISHMENTS OF WORDING · DRAWN BY THE COMPANION<\/div><table class=\"grid\"><thead><tr><th><\/th><th>Name<\/th><th>In short<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>Tashābuh al-aṭrāf ‎<span class=\"arin\">تشابه الأطراف<\/span>‎<\/td><td>end of one = start of the next<\/td><\/tr><tr><td>2<\/td><td>Jinās ‎<span class=\"arin\">الجناس<\/span>‎<\/td><td>words alike in sound, different in meaning<\/td><\/tr><tr><td>3<\/td><td>Taṣdīr ‎<span class=\"arin\">التصدير<\/span>‎<\/td><td>the end echoes the beginning<\/td><\/tr><tr><td>4<\/td><td>Sajʿ ‎<span class=\"arin\">السجع<\/span>‎<\/td><td>rhymed prose<\/td><\/tr><tr><td>5<\/td><td>Qalb ‎<span class=\"arin\">القلب<\/span>‎<\/td><td>reads the same backwards<\/td><\/tr><tr><td>6<\/td><td>ʿAks ‎<span class=\"arin\">العكس<\/span>‎<\/td><td>two parts said, then swapped<\/td><\/tr><tr><td>7<\/td><td>Tashrīʿ ‎<span class=\"arin\">التشريع<\/span>‎<\/td><td>a line on two rhymes<\/td><\/tr><tr><td>8<\/td><td>Muwārabah ‎<span class=\"arin\">الموارِبة<\/span>‎<\/td><td>words that can be turned to escape blame<\/td><\/tr><tr><td>9<\/td><td>Iʾtilāf al-lafẓ maʿa al-lafẓ<\/td><td>rare with rare, common with common<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box\"><div class=\"bh\">KEY TERMS AND THEIR MEANINGS · ADDED BY THE COMPANION<\/div><table class=\"terms\"><tr><td class=\"t\">Muḥassināt lafẓiyyah<\/td><td>Embellishments of wording<\/td><td class=\"a\">محسّنات لفظيّة<\/td><\/tr><tr><td class=\"t\">Tashābuh al-aṭrāf<\/td><td>Making the end of a sentence or line the beginning of the next<\/td><td class=\"a\">تشابه الأطراف<\/td><\/tr><tr><td class=\"t\">Jinās<\/td><td>Likeness of two words in pronunciation, not in meaning<\/td><td class=\"a\">الجناس<\/td><\/tr><tr><td class=\"t\">Jinās tāmm<\/td><td>Complete jinās: agreement in form, kind, number and order of letters<\/td><td class=\"a\">التامّ<\/td><\/tr><tr><td class=\"t\">Mutamāthil<\/td><td>Complete jinās between two words of one kind (noun–noun, etc.)<\/td><td class=\"a\">متماثل<\/td><\/tr><tr><td class=\"t\">Mustawfā<\/td><td>Complete jinās between words of two kinds<\/td><td class=\"a\">مستوفًى<\/td><\/tr><tr><td class=\"t\">Mutashābih<\/td><td>Complete jinās between a compound and a single word that agree in writing<\/td><td class=\"a\">متشابه<\/td><\/tr><tr><td class=\"t\">Mafrūq<\/td><td>The same, when they do not agree in writing<\/td><td class=\"a\">مفروق<\/td><\/tr><tr><td class=\"t\">Muḥarraf<\/td><td>Incomplete jinās differing only in the form (vowels) of the letters<\/td><td class=\"a\">مُحرّف<\/td><\/tr><tr><td class=\"t\">Muṭarraf / Mudhayyal<\/td><td>Incomplete jinās with an extra letter at the beginning / at the end<\/td><td class=\"a\">مطرَّف / مذيَّل<\/td><\/tr><tr><td class=\"t\">Muḍāriʿ / Lāḥiq<\/td><td>Incomplete jinās differing in two letters close / far apart in articulation<\/td><td class=\"a\">مضارع / لاحق<\/td><\/tr><tr><td class=\"t\">Jinās qalb<\/td><td>Jinās differing only in the order of letters<\/td><td class=\"a\">جناس قلب<\/td><\/tr><tr><td class=\"t\">Taṣdīr / Radd al-ʿajuz ʿalā al-ṣadr<\/td><td>Placing one of two related words at the beginning and the other at the end<\/td><td class=\"a\">التصدير / ردّ العَجُز على الصدْر<\/td><\/tr><tr><td class=\"t\">Sajʿ<\/td><td>Agreement of two prose clause-endings in the last letter<\/td><td class=\"a\">السجع<\/td><\/tr><tr><td class=\"t\">Mutawāzin / Muraṣṣaʿ<\/td><td>Sajʿ agreeing also in measure / with all or most words matching<\/td><td class=\"a\">متوازٍ / مرصّع<\/td><\/tr><tr><td class=\"t\">Qalb (mā lā yastaḥīlu bi-l-inʿikās)<\/td><td>Wording read the same forwards and backwards<\/td><td class=\"a\">القلب<\/td><\/tr><tr><td class=\"t\">ʿAks<\/td><td>Putting one part before another and then reversing them<\/td><td class=\"a\">العكس<\/td><\/tr><tr><td class=\"t\">Tashrīʿ<\/td><td>Building a line on two rhymes so that a shortened line is still verse<\/td><td class=\"a\">التشريع<\/td><\/tr><tr><td class=\"t\">Muwārabah<\/td><td>Framing speech so its meaning can be changed to escape blame<\/td><td class=\"a\">الموارِبة<\/td><\/tr><tr><td class=\"t\">Iʾtilāf al-lafẓ maʿa al-lafẓ<\/td><td>Words of an expression being of one valley in strangeness and familiarity<\/td><td class=\"a\">ايتلاف اللفظ مع اللفظ<\/td><\/tr><\/table><\/div><h3>QUESTIONS AND ANSWERS<span class=\"ar\">أسئلة وأجوبة<\/span><\/h3><div class=\"qabox\"><div class=\"qh\">QUESTIONS AND ANSWERS · ADDED BY THE COMPANION<\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>What is <i>tashābuh al-aṭrāf<\/i>? Give the Qurʾānic example.<\/div><div class=\"a\"><span class=\"k\">A.<\/span>Making the end of a sentence the beginning of the next: ‎<span class=\"arin\">فِيهَا مِصْبَاحٌ الْمِصْبَاحُ فِي زُجَاجَةٍ الزُّجَاجَةُ<\/span>‎.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>Define <i>jinās<\/i>. When is it complete?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>Two words alike in pronunciation but not in meaning. It is complete when their letters agree in vowels, kind, number and order.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>Distinguish <i>mutamāthil<\/i> and <i>mustawfā<\/i>.<\/div><div class=\"a\"><span class=\"k\">A.<\/span>Both are complete; in <i>mutamāthil<\/i> the two words are of one kind (e.g. both nouns), in <i>mustawfā<\/i> of two kinds (e.g. a verb and a noun).<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>What is the difference between <i>mutashābih<\/i> and <i>mafrūq<\/i>?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>In both, one word is compound and one single; in <i>mutashābih<\/i> they are written alike (‎<span class=\"arin\">ذَا هِبَةٍ<\/span>‎ / ‎<span class=\"arin\">ذَاهِبَةٌ<\/span>‎), in <i>mafrūq<\/i> not (‎<span class=\"arin\">جَامَ لَنَا<\/span>‎ / ‎<span class=\"arin\">جَامَلَنَا<\/span>‎).<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>Name the kind of <i>jinās<\/i> in ‎<span class=\"arin\">لَشَهِيدٌ<\/span>‎ / ‎<span class=\"arin\">لَشَدِيدٌ<\/span>‎, and in ‎<span class=\"arin\">نيل<\/span>‎ / ‎<span class=\"arin\">لين<\/span>‎.<\/div><div class=\"a\"><span class=\"k\">A.<\/span>The first is <i>lāḥiq<\/i> (one letter different, far apart in articulation); the second is <i>jinās qalb<\/i> (order only).<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>What is <i>taṣdīr<\/i>? Give an example from prose and one from verse.<\/div><div class=\"a\"><span class=\"k\">A.<\/span>Placing one of two related words at the start and the other at the end: ‎<span class=\"arin\">وَتَخْشَى النَّاسَ وَاللَّهُ أَحَقُّ أَن تَخْشَاهُ<\/span>‎; ‎<span class=\"arin\">سَرِيْعٌ ... بِسَرِيْعِ<\/span>‎.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>Name the three kinds of <i>sajʿ<\/i> and how they differ.<\/div><div class=\"a\"><span class=\"k\">A.<\/span><i>Muṭarraf<\/i>: endings rhyme, different patterns; <i>mutawāzin<\/i>: endings rhyme with the same pattern; <i>muraṣṣaʿ<\/i>: all or most words of the two clauses match in pattern and rhyme.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>What is the difference between <i>qalb<\/i> and <i>ʿaks<\/i>?<\/div><div class=\"a\"><span class=\"k\">A.<\/span><i>Qalb<\/i> reads the same letter by letter backwards (‎<span class=\"arin\">كن كما أمكنك<\/span>‎); <i>ʿaks<\/i> swaps two parts of a phrase (‎<span class=\"arin\">قول الإمام إمام القول<\/span>‎).<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>How did Abū Nuwās use <i>muwārabah<\/i>?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>He changed ‎<span class=\"arin\">ضَاعَ<\/span>‎ (was wasted) to ‎<span class=\"arin\">ضَاءَ<\/span>‎ (shone) to escape al-Rashīd's anger.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>Explain the harmony of words in ‎<span class=\"arin\">تَاللّٰه تَفْتَأُ تَذْكُرُ يُوسُفَ<\/span>‎.<\/div><div class=\"a\"><span class=\"k\">A.<\/span>The rarest oath particle ‎<span class=\"arin\">تَ<\/span>‎ is matched with the rarest verb of continuance ‎<span class=\"arin\">تَفْتَأُ<\/span>‎.<\/div><\/div><\/div>", "terms": [{"t": "Muḥassināt lafẓiyyah", "m": "Embellishments of wording", "a": "محسّنات لفظيّة"}, {"t": "Tashābuh al-aṭrāf", "m": "Making the end of a sentence or line the beginning of the next", "a": "تشابه الأطراف"}, {"t": "Jinās", "m": "Likeness of two words in pronunciation, not in meaning", "a": "الجناس"}, {"t": "Jinās tāmm", "m": "Complete jinās: agreement in form, kind, number and order of letters", "a": "التامّ"}, {"t": "Mutamāthil", "m": "Complete jinās between two words of one kind (noun–noun, etc.)", "a": "متماثل"}, {"t": "Mustawfā", "m": "Complete jinās between words of two kinds", "a": "مستوفًى"}, {"t": "Mutashābih", "m": "Complete jinās between a compound and a single word that agree in writing", "a": "متشابه"}, {"t": "Mafrūq", "m": "The same, when they do not agree in writing", "a": "مفروق"}, {"t": "Muḥarraf", "m": "Incomplete jinās differing only in the form (vowels) of the letters", "a": "مُحرّف"}, {"t": "Muṭarraf / Mudhayyal", "m": "Incomplete jinās with an extra letter at the beginning / at the end", "a": "مطرَّف / مذيَّل"}, {"t": "Muḍāriʿ / Lāḥiq", "m": "Incomplete jinās differing in two letters close / far apart in articulation", "a": "مضارع / لاحق"}, {"t": "Jinās qalb", "m": "Jinās differing only in the order of letters", "a": "جناس قلب"}, {"t": "Taṣdīr / Radd al-ʿajuz ʿalā al-ṣadr", "m": "Placing one of two related words at the beginning and the other at the end", "a": "التصدير / ردّ العَجُز على الصدْر"}, {"t": "Sajʿ", "m": "Agreement of two prose clause-endings in the last letter", "a": "السجع"}, {"t": "Mutawāzin / Muraṣṣaʿ", "m": "Sajʿ agreeing also in measure / with all or most words matching", "a": "متوازٍ / مرصّع"}, {"t": "Qalb (mā lā yastaḥīlu bi-l-inʿikās)", "m": "Wording read the same forwards and backwards", "a": "القلب"}, {"t": "ʿAks", "m": "Putting one part before another and then reversing them", "a": "العكس"}, {"t": "Tashrīʿ", "m": "Building a line on two rhymes so that a shortened line is still verse", "a": "التشريع"}, {"t": "Muwārabah", "m": "Framing speech so its meaning can be changed to escape blame", "a": "الموارِبة"}, {"t": "Iʾtilāf al-lafẓ maʿa al-lafẓ", "m": "Words of an expression being of one valley in strangeness and familiarity", "a": "ايتلاف اللفظ مع اللفظ"}], "part": null}, {"num": 17, "title": "Conclusion", "ar": "خاتمة", "body": "<h3>CONCLUSION<span class=\"ar\">خاتمة<\/span><\/h3><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 222<\/span><\/div><div class=\"ar\">(١) سرِقة الكلام أنواع: منها:<br>أن يأخذ الناثر أو الشاعر معنى لغيره بدون تغيير لنظمه، كما أخذ عبد اللهِ بنُ الزَبِيْر بَيْتَيْ مُعَن، وادّعاهما لنفسه، وهما:<span class=\"bayt\"><span class=\"h1\">إذَا أَنْتَ لَمْ تَنْصِفْ أَخَاكَ وَجَدْتَهُ<\/span><span class=\"h2\">عَلَى طَرَفِ الْهِجْرَان إنْ كَانَ يَعْقِلُ<\/span><\/span><span class=\"bayt\"><span class=\"h1\">وَيَرْكَبُ حَدَّ السَيْفِ مِنْ أَنْ تُضِيْمَهُ<\/span><span class=\"h2\">إذَا لَمْ يَكُنْ عَنْ شَفْرَةِ السَيْفِ مَزْحَلُ<\/span><\/span><\/div><div class=\"tr\">(1) The theft of speech is of several kinds. Among them:<br>that the prose-writer or the poet takes another’s meaning without any change to its arrangement; as ʿAbd Allāh ibn al-Zabīr took the two lines of Muʿan and claimed them for himself. They are:<br>If you do not deal fairly with your brother, you will find him on the side of desertion, if he has any sense;<br>and he will ride the edge of the sword rather than let you wrong him, when there is no escape from the sword’s blade.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>The book closes with a <i>khātimah<\/i> (conclusion) on topics that belong to all three sciences: taking from other writers, quoting, and how to begin, move on and end. It starts with <b>theft of speech<\/b> (<i>sariqah<\/i>): taking another person's words or ideas and passing them off as one's own.<\/p><p>The worst kind is taking someone's words <b>exactly as they are<\/b>. ʿAbd Allāh ibn al-Zabīr took two lines by Muʿan ibn Aws, word for word, and claimed them as his own.<\/p><\/div><div class=\"cnote\"><span class=\"cnh\">COMPANION&#8217;S NOTE · NOT IN THE BOOK<\/span><p>In the first line of verse the verb is printed ‎<span class=\"arin\">تَنْصِفْ<\/span>‎ (with <i>fatḥah<\/i> on the <i>tāʾ<\/i> and <i>kasrah<\/i> on the <i>ṣād<\/i>); the likely reading is ‎<span class=\"arin\">تَنْصِفْ<\/span>‎ (form IV, <i>to deal fairly<\/i>).<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 223<\/span><\/div><div class=\"ar\">ومثل هذا يسمّى «نسخاً وانتحالاً»، ومن قبيله أن تبدّل الألفاظ بِما يُرادفها، كأنْ يقال في قول الْحُطَيْئَة:<span class=\"bayt\"><span class=\"h1\">دَعِ الْمَكَارِمَ لاَ تَرْحَلْ لِبُغْيَتِهَا<\/span><span class=\"h2\">وَاقْعُدْ فَإِنَّكَ أَنْتَ الطَاعِمُ الْكَاسِيْ<\/span><\/span><span class=\"bayt\"><span class=\"h1\">ذَرِ الْمَآثِرَ لاَ تَذْهَبْ لِمَطْلَبِهَا<\/span><span class=\"h2\">وَاجْلِسْ فَإِنَّكَ أَنْتَ الآكِلُ اللاَبِسُ<\/span><\/span><\/div><div class=\"tr\">Something like this is called «copying and false claiming» (<i>naskh<\/i> and <i>intiḥāl<\/i>). Of the same sort is that the words are replaced by words synonymous with them, as if it were said, of the verse of al-Ḥuṭayʾah:<br>Leave noble deeds — do not set out in search of them; sit down, for you are the one who is fed and clothed —<br>[the line]: Abandon glorious deeds — do not go in pursuit of them; stay seated, for you are the one who eats and dresses.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>This open copying is called <b>naskh<\/b> (copying) and <b>intiḥāl<\/b> (false claiming). Changing the words for <b>synonyms<\/b> is no better: rewriting al-Ḥuṭayʾah's line with ‎<span class=\"arin\">ذَرِ<\/span>‎ for ‎<span class=\"arin\">دَعِ<\/span>‎, ‎<span class=\"arin\">الْمَآثِرَ<\/span>‎ for ‎<span class=\"arin\">الْمَكَارِمَ<\/span>‎, ‎<span class=\"arin\">اجْلِسْ<\/span>‎ for ‎<span class=\"arin\">اقْعُدْ<\/span>‎ and so on is still the same line, stolen.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 224<\/span><\/div><div class=\"ar\">وقريب منه أن تبدّل الألفاظ بِما يضادّها في المعنى مع رعاية النظم والترتيب، كما لو قيل في قول حسّان:<span class=\"bayt\"><span class=\"h1\">بِيْضُ الوُجُوْهِ كَرِيْمَةٌ أَحْسَابُهُمْ<\/span><span class=\"h2\">شُمُّ الأُنُوْفِ مِنَ الطِرَازِ الأَوَّلِ<\/span><\/span><span class=\"bayt\"><span class=\"h1\">سُوْدُ الوُجُوْهِ لَئِيْمَةٌ أَحْسَابُهُمْ<\/span><span class=\"h2\">فُطْسُ الأُنُوْفِ مِنَ الطِرَازِ الآخِرِ<\/span><\/span><\/div><div class=\"tr\">Close to it is that the words are replaced by words opposite to them in meaning, while keeping the arrangement and order; as if it were said, of the verse of Ḥassān:<br>White of face, noble of lineage, high of nose, of the first pattern —<br>[the line]: Black of face, base of lineage, flat of nose, of the other pattern.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>Close to this is replacing the words with their <b>opposites<\/b> while keeping the same pattern. Turning Ḥassān's praise (\"white of face… noble… high-nosed… of the first pattern\") into blame (\"black of face… base… flat-nosed… of the other pattern\") still takes his line's whole structure.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 224–226<\/span><\/div><div class=\"ar\">ومنها: أن يأخذ المعنى ويغيّر اللفظ، ويكون الكلام الثاني دون الأوّل، أو مساوياً له، كما قال أبو الطيّب في قول أبي تمام:<span class=\"bayt\"><span class=\"h1\">هَيْهَاتَ لاَ يَأتِي الزَمَانُ بِمثْلِهِ<\/span><span class=\"h2\">إِنَّ الزَمَانَ بِمثْلِهِ لَبَخيْلٌ<\/span><\/span><span class=\"bayt\"><span class=\"h1\">أَعْدَى الزَمَانُ سَخَاؤَهُ فَسَخَا بِهِ<\/span><span class=\"h2\">وَلَقَدْ يَكُوْنُ بِهِ الزَمَانُ بَخِيْلاً<\/span><\/span>فالمصراع الثاني مأخوذ من المصراع الثاني لأبي تمام، والأوّل أجود سبكاً، ومثل هذا يسمّى «إغارة ومسخاً».<\/div><div class=\"tr\">Among them: that he takes the meaning and changes the wording, and the second speech is below the first or equal to it; as Abū al-Ṭayyib said, on the verse of Abū Tammām:<br>[Abū Tammām:] Far from it! Time will not bring his like; time is indeed miserly with his like.<br>[Abū al-Ṭayyib:] His generosity infected Time, so Time was generous with him — and Time used to be miserly with him.<br>The second hemistich is taken from the second hemistich of Abū Tammām, and the first is better in its casting. Something like this is called «raiding and disfiguring» (<i>ighārah<\/i> and <i>maskh<\/i>).<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>A second kind: taking the <b>meaning<\/b> but changing the <b>words<\/b>, so that the new version is no better, or worse. Al-Mutanabbī's second half-line \"Time used to be miserly with him\" takes Abū Tammām's \"Time is miserly with his like\". The book notes that al-Mutanabbī's first half-line is finer in its casting. This kind is called <b>ighārah<\/b> (raiding) and <b>maskh<\/b> (disfiguring).<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 226<\/span><\/div><div class=\"ar\">ومنها: أن يأخذ المعنى وحده، ويكون الثاني دون الأوّل، أو مساوياً له، كما قال أبو تمام في قول من رثَى ابنه:<span class=\"bayt\"><span class=\"h1\">وَالصَبْرُ يُحْمَدُ فِيْ الْمَوَاطِنِ كُلِّهَا<\/span><span class=\"h2\">إلاَّ عَلَيْكَ فَإِنَّهُ لاَ يُحْمَدُ<\/span><\/span><span class=\"bayt\"><span class=\"h1\">وَقَدْ كَانَ يُدْعَى لاَبِسُ الصَبْرِ حَازِماً<\/span><span class=\"h2\">فَأَصْبَحَ يُدْعَى حَازِماً حِيْنَ يَجْزَعُ<\/span><\/span>وهذا يسمّى «إلْماماً وسلخاً».<\/div><div class=\"tr\">Among them: that he takes the meaning alone, and the second is below the first or equal to it; as Abū Tammām said, on the verse of one who mourned his son:<br>[The mourner:] Patience is praised in every situation — except over you, for then it is not praised.<br>[Abū Tammām:] The one who wore patience used to be called resolute; now he is called resolute when he grieves.<br>This is called «touching upon and flaying» (<i>ilmām<\/i> and <i>salkh<\/i>).<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>A third kind: taking the <b>meaning alone<\/b>. The mourner said patience is praised everywhere except in grief for his son. Abū Tammām took the idea (that in this loss, grief is better than patience) and expressed it in completely new words. This is called <b>ilmām<\/b> (touching upon) and <b>salkh<\/b> (flaying).<\/p><\/div><div class=\"chartbox\"><div class=\"chh\">THE KINDS OF SARIQAH · DRAWN BY THE COMPANION<\/div><table class=\"grid\"><thead><tr><th>Kind<\/th><th>What is taken<\/th><th>Its names<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>the words as they are (or with synonyms or opposites)<\/td><td>‎<span class=\"arin\">نسخ<\/span>‎، ‎<span class=\"arin\">انتحال<\/span>‎<\/td><\/tr><tr><td>2<\/td><td>the meaning, with changed wording<\/td><td>‎<span class=\"arin\">إغارة<\/span>‎، ‎<span class=\"arin\">مسخ<\/span>‎<\/td><\/tr><tr><td>3<\/td><td>the meaning alone<\/td><td>‎<span class=\"arin\">إلْمام<\/span>‎، ‎<span class=\"arin\">سلخ<\/span>‎<\/td><\/tr><\/tbody><\/table><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 227<\/span><\/div><div class=\"ar\">(٢) الاقتباس: هو أن يضمن الكلام شيئاً من القرآن أو الحديث لا على أنّه منه، كقوله:<span class=\"bayt\"><span class=\"h1\">لاَ تَكُنْ ظَالماً وَلاَ تَرْضَ بِالظُلْمِ<\/span><span class=\"h2\">وَأَنْكِرْ بِكُلِّ مَا يُسْتَطَاعُ<\/span><\/span><span class=\"bayt\"><span class=\"h1\">يَوْمَ يَأْتِي الْحِسَابُ بِالظُلُوْمِ<\/span><span class=\"h2\">مَا مِنْ حَمِيْمٍ وَلاَ شَفِيْعٍ يُطَاعُ<\/span><\/span>وقوله:<span class=\"bayt\"><span class=\"h1\">لاَ تُعَادِ النَاسَ فِيْ أَوْطَانِهِمْ<\/span><span class=\"h2\">قَلَّمَا يُرْعَى غَرِيْبُ الوَطَنِ<\/span><\/span><span class=\"bayt\"><span class=\"h1\">وَإِذَا مَا شِئْتَ عَيْشاً بَيْنَهُمْ<\/span><span class=\"h2\">خَالِقِ النَاسَ بِخُلُقٍ حَسَنٍ<\/span><\/span><\/div><div class=\"tr\">(2) <i>Al-iqtibās<\/i> (quotation): it is that the speech includes something of the Qurʾān or the Ḥadīth, not as being from it; as in his words:<br>Do not be a wrongdoer, nor be pleased with wrong, and oppose it with all that is possible.<br>On the day the reckoning comes to the wrongdoer, there is no intimate friend nor intercessor who is obeyed.<br>And his words:<br>Do not make enemies of people in their own lands; seldom is the stranger in a land shown regard.<br>And if you wish to live among them, deal with people with good character.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Iqtibās<\/b> (quoting): weaving words of the <b>Qurʾān or Ḥadīth<\/b> into your own speech, without presenting them as a quotation.<p>The first lines end with ‎<span class=\"arin\">مَا مِنْ حَمِيْمٍ وَلاَ شَفِيْعٍ يُطَاعُ<\/span>‎, taken from the Qurʾān (Ghāfir 40:18). The second end with ‎<span class=\"arin\">خَالِقِ النَاسَ بِخُلُقٍ حَسَنٍ<\/span>‎, the words of a well-known ḥadīth.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 228<\/span><\/div><div class=\"ar\">ولا بأس بتغيير يسير في اللفظ المقتبَس للوزن أو غيره، نحو:<span class=\"bayt\"><span class=\"h1\">قَدْ كَانَ مَا خِفْتُ أنْ يَكُوْنَا<\/span><span class=\"h2\">إِنَّا إِلَى اللهِ رَاجِعُوْنَا<\/span><\/span>وفي القرآن: ﴿إِنَّا لِلّٰهِ وَإِنَّا إِلَيْهِ رَاجِعون﴾ [البقرة: ١٥٦].<\/div><div class=\"tr\">There is no harm in a slight change in the quoted wording, for the metre or something else; as in:<br>What I feared would happen has happened; to Allah we are returning.<br>And in the Qurʾān: ﴿Indeed we belong to Allah, and indeed to Him we are returning﴾ [al-Baqarah 2:156].<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>A small change to the quoted words is allowed, for the metre or a similar reason. The poet's ‎<span class=\"arin\">إِنَّا إِلَى اللهِ رَاجِعُوْنَا<\/span>‎ changes the Qurʾānic wording to fit his line.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 228<\/span><\/div><div class=\"ar\">(٣) التضمين ويسمّى «الإيداعَ» هو أن يضمن الشعر شيئاً من شعر آخر مع التنبيه عليه إن لَم يشتهر، كقوله:<span class=\"bayt\"><span class=\"h1\">إذَا ضَاقَ صَدْرِيْ وَخفْتُ العدَا<\/span><span class=\"h2\">تَمَثَّلْتُ بَيْتاً بِحَالِيْ يَلِيْقُ<\/span><\/span><span class=\"bayt\"><span class=\"h1\">فَبِاللهِ أَبْلُغُ مَا أَرْتَجِيْ<\/span><span class=\"h2\">وَبِاللهِ أَدْفَعُ مَا لاَ أَطيْقُ<\/span><\/span><\/div><div class=\"tr\">(3) <i>Al-taḍmīn<\/i> (inclusion), which is also called «<i>al-īdāʿ<\/i>» (depositing): it is that poetry includes something of another poem, with notice being given of it if it is not well known; as in his words:<br>When my breast is straitened and I fear the enemies, I quote as a proverb a line that suits my state:<br>“By Allah I reach what I hope for, and by Allah I ward off what I cannot bear.”<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Taḍmīn<\/b> (inclusion), also called <b>īdāʿ<\/b>: putting a line or part of a line <b>from another poem<\/b> into your own, and saying so if the line is not well known. Here the poet says \"I quote a line that suits my state\", then gives it in the second verse.<p>Compare: <i>iqtibās<\/i> takes from the Qurʾān and Ḥadīth; <i>taḍmīn<\/i> takes from poetry.<\/p><\/div><div class=\"cnote\"><span class=\"cnh\">COMPANION&#8217;S NOTE · NOT IN THE BOOK<\/span><p>In the second line the last word is printed ‎<span class=\"arin\">أَطيْقُ<\/span>‎ (with <i>fatḥah<\/i> on the <i>hamzah<\/i>); the likely reading is ‎<span class=\"arin\">أَطيْقُ<\/span>‎ (form IV, “I can bear”).<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 228–229<\/span><\/div><div class=\"ar\">ولا بأس بالتغيير اليسير، كقوله:<span class=\"bayt\"><span class=\"h1\">أَقُوْلُ لِمَعْشَرٍ غَلِطُوْا وَغَضُّوا<\/span><span class=\"h2\">مِنَ الشَيْخِ الرَشِيْدِ وَأَنْكَرُوْهُ<\/span><\/span><span class=\"bayt\"><span class=\"h1\">هُوَ ابْنُ جَلاَ وَطَلاَّعُ الثَنَايَا<\/span><span class=\"h2\">مَتَى يَضَعُ العِمَامَةَ تَعْرِفُوْهُ<\/span><\/span><\/div><div class=\"tr\">There is no harm in a slight change; as in his words:<br>I say to a company who erred, and looked down on the rightly-guided shaykh and disowned him:<br>“He is the son of the bare one, and climber of the mountain paths; whenever he puts off the turban you will know him.”<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>Again, a small change is allowed. The second line is a famous verse (\"I am the son of the bare one, the climber of mountain paths…\"), here changed from the first person to the third, ‎<span class=\"arin\">هُوَ ابْنُ جَلاَ<\/span>‎, to fit the new poem.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 229–230<\/span><\/div><div class=\"ar\">(٤) العقد والْحَلّ الأوّل: نظم المنثور، والثاني: نثر المنظوم، فالأوّل: نحو:<span class=\"bayt\"><span class=\"h1\">وَالظُلْمُ مِنْ شِيَمِ النُفُوْسِ فَإِنْ تَجِدْ<\/span><span class=\"h2\">ذَا عِفَّةٍ فَلِعِلَّةٍ لاَ يَظْلِمُ<\/span><\/span>عَقَد فيه قول حكيم: «الظلم من طباع النفس، وإنّما يصدّها عنه إحدى علّتَين: دينيّة، وهي خوف المعاد، ودنيويّة، وهي خوف العقاب الدينويّ».<\/div><div class=\"tr\">(4) <i>Al-ʿaqd<\/i> (binding) and <i>al-ḥall<\/i> (loosening): the first is putting prose into verse, and the second is putting verse into prose. The first is as in:<br>Wrongdoing is among the natures of souls; so if you find one who abstains, then it is for some cause that he does no wrong.<br>In it he bound the saying of a sage: «Wrongdoing is of the nature of the soul; only one of two causes keeps it from it: a religious one, which is fear of the Return, and a worldly one, which is fear of worldly punishment.»<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>ʿAqd<\/b> (binding): putting <b>prose into verse<\/b>. The sage said that wrongdoing is in human nature, and only religion or fear of punishment holds people back. The poet bound this into one line: if you find someone who does no wrong, there is a reason.<\/div><div class=\"cnote\"><span class=\"cnh\">COMPANION&#8217;S NOTE · NOT IN THE BOOK<\/span><p>In the sage’s saying the last word is printed ‎<span class=\"arin\">«الدينويّ»<\/span>‎; the likely reading is ‎<span class=\"arin\">«الدنيويّ»<\/span>‎ (“worldly”), as in ‎<span class=\"arin\">ودنيويّة<\/span>‎ just before it.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 230<\/span><\/div><div class=\"ar\">والثاني، نحو قوله: «العيادة سنّة مأجورة مَكْرُمَة مأثورة، ومع هذا فنحن الْمرْضَى، ونحن العوَّاد، وكلّ وداد لا يدوم فليس بوداد». وحلّ فيه قول القائل:<span class=\"bayt\"><span class=\"h1\">إِذَا مَرِضْنَا أَتَيْنَاكُمْ نَعُوْدُكُمْ<\/span><span class=\"h2\">وَتَذْنِبُوْنَ فَنَأْتِيْكُمْ وَنَعْتَذِرُ<\/span><\/span><\/div><div class=\"tr\">The second is as in his words: «Visiting the sick is a rewarded <i>sunnah<\/i> and a handed-down noble act; yet despite this we are the sick and we are the visitors; and every affection that does not last is no affection.» In it he loosened the saying of the poet:<br>When we fall ill we come to you to visit you; and you do wrong, and we come to you and apologise.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Ḥall<\/b> (loosening): putting <b>verse into prose<\/b>. The writer turned the poet's line (\"when we fall ill we come to visit you; and when you wrong us we come and apologise\") into a rhymed prose sentence.<\/div><div class=\"chartbox\"><div class=\"chh\">TAKING FROM WHAT OTHERS SAID · DRAWN BY THE COMPANION<\/div><table class=\"grid\"><thead><tr><th>Name<\/th><th>Taken from<\/th><th>Into<\/th><\/tr><\/thead><tbody><tr><td>Iqtibās ‎<span class=\"arin\">الاقتباس<\/span>‎<\/td><td>the Qurʾān or Ḥadīth<\/td><td>your own speech<\/td><\/tr><tr><td>Taḍmīn ‎<span class=\"arin\">التضمين<\/span>‎<\/td><td>another poem<\/td><td>your poem<\/td><\/tr><tr><td>ʿAqd ‎<span class=\"arin\">العقد<\/span>‎<\/td><td>prose<\/td><td>verse<\/td><\/tr><tr><td>Ḥall ‎<span class=\"arin\">الْحِلُّ<\/span>‎<\/td><td>verse<\/td><td>prose<\/td><\/tr><tr><td>Talmīḥ ‎<span class=\"arin\">التلميح<\/span>‎<\/td><td>a famous verse, ḥadīth, line, proverb or story<\/td><td>only pointed to<\/td><\/tr><\/tbody><\/table><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 230–231<\/span><\/div><div class=\"ar\">(٥) التلميح: هو أن يشير المتكلّم في كلامه لآية، أو حديث، أو شعر مشهور، أو مَثَل سائر، أو قصّة، كقوله:<span class=\"bayt\"><span class=\"h1\">لَعَمْرٌو مَعَ الرَمْضَاءِ وَالنَارُ تَلْتَظَى<\/span><span class=\"h2\">أَرَقُّ وَأَحْفَى مِنْكَ فِي سَاعَةِ الكَرَبِ<\/span><\/span>أشار إلى البيت المشهور، وهو:<span class=\"bayt\"><span class=\"h1\">اَلْمُسْتَجِيْرُ بِعَمْرٍو عِنْدَ كُرْبَتِهِ<\/span><span class=\"h2\">كَالْمُسْتَجِيْرِ مِنَ الرَمْضَاءِ بِالنَارِ<\/span><\/span><\/div><div class=\"tr\">(5) <i>Al-talmīḥ<\/i> (allusion): it is that the speaker, in his speech, points to a verse of the Qurʾān, or a Ḥadīth, or a well-known poem, or a current proverb, or a story; as in his words:<br>ʿAmr — with the burning sand, and the fire blazing — is gentler and kinder than you in the hour of distress.<br>He pointed to the well-known line, which is:<br>He who seeks ʿAmr’s protection in his distress is like one who seeks protection from the burning sand in the fire.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Talmīḥ<\/b> (allusion): <b>pointing<\/b> to a well-known verse, ḥadīth, line of poetry, proverb or story, without quoting it. The poet says ʿAmr, \"with the burning sand and blazing fire\", is gentler than you. This only makes sense if you know the famous line: seeking ʿAmr's help in trouble is like escaping burning sand by jumping into fire. So he says: even ʿAmr, that \"fire\", is kinder than you.<\/div><div class=\"cnote\"><span class=\"cnh\">COMPANION&#8217;S NOTE · NOT IN THE BOOK<\/span><p>In the first line, ‎<span class=\"arin\">الكَرَبِ<\/span>‎ (with <i>fatḥah<\/i> on the <i>rāʾ<\/i>) is printed with a <i>fatḥah<\/i> on the <i>rāʾ<\/i>; the usual form is ‎<span class=\"arin\">الكَرَبِ<\/span>‎.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 231–232<\/span><\/div><div class=\"ar\">(٦) حسن الابتداء: هو أن يجعل المتكلّم مبدء كلامه عذْب اللفظ، حُسْن السبك، صحيحَ المعنى، فإذا اشتمل على إشارة لطيفة إلى المقصود، سُمّي «براعةَ الاستهلال»، كقوله في تهنية بزوال مرَض:<span class=\"bayt\"><span class=\"h1\">اَلْمَجْدُ عُوْفِيَ إذْ عُوْفِيْتَ وَالْكَرَمُ<\/span><span class=\"h2\">وَزَالَ عَنْكَ إِلَى أَعْدَائِك السُقَمُ<\/span><\/span>وكقول الآخر في التهنية ببناء قصر:<span class=\"bayt\"><span class=\"h1\">قَصْرٌ عَلَيْهِ تَحِيَّةٌ وَسَلاَمٌ<\/span><span class=\"h2\">خَلَعَتْ عَلَيْهِ جَمَالَهَا الأَيَّامُ<\/span><\/span><\/div><div class=\"tr\">(6) <i>Ḥusn al-ibtidāʾ<\/i> (a fine opening): it is that the speaker makes the opening of his speech sweet in wording, fine in casting and sound in meaning. If, in addition, it contains a subtle pointer to what is intended, it is called «<i>barāʿat al-istihlāl<\/i>» (excellence of the opening); as in his words, congratulating on recovery from an illness:<br>Glory was made well when you were made well, and nobility; and the sickness passed from you to your enemies.<br>And as in another’s words, congratulating on the building of a palace:<br>A palace — upon it be greeting and peace; the days have cast their beauty upon it.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>The last four topics concern the <b>shape of a whole piece<\/b>: its opening, its turn to the main subject, its request, and its ending.<\/p><b>Ḥusn al-ibtidāʾ<\/b>: the opening should be sweet in sound, well built and correct in meaning, because it is the first thing heard. If it also <b>hints at the subject<\/b>, it is called <b>barāʿat al-istihlāl<\/b>. The poem congratulating a man on his recovery opens \"Glory was healed when you were healed\": from the first words you know what the poem is about. So does the palace poem, which opens with \"a palace\".<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 232<\/span><\/div><div class=\"ar\">(٧) حسن التخلص: هو الانتقال مِمَّا افتتح به الكلام إلى المقصود مع رعاية المناسَبة بينهما، كقوله:<span class=\"bayt\"><span class=\"h1\">دَعَتِ النَوَى بِفِرَاقِهِمْ فَتَشَتَّتُوا<\/span><span class=\"h2\">وَقَضَى الزَمَانُ بَيْنَهُمْ فَتَبَدَّدُوْا<\/span><\/span><span class=\"bayt\"><span class=\"h1\">دَهْرٌ ذَمِيْمُ الْحَالَتَيْنِ فَمَا بِهِ<\/span><span class=\"h2\">شَيْءٌ سِوَى جُوْدِ بنِ أَرْتَقَ يُحْمَدُ<\/span><\/span><\/div><div class=\"tr\">(7) <i>Ḥusn al-takhalluṣ<\/i> (a fine transition): it is passing from that with which the speech was opened to what is intended, while observing the fittingness between the two; as in his words:<br>Distance called for their parting, so they were scattered; and Time judged between them, so they were dispersed —<br>a Time blameworthy in both its states, in which nothing is praised except the generosity of Ibn Artaq.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Ḥusn al-takhalluṣ<\/b>: passing <b>smoothly<\/b> from the opening theme to the real subject, with a natural link. The poet complains of parting and of blameworthy Time, and then turns: \"in which nothing is praised except the generosity of Ibn Artaq\". The complaint about Time has carried him straight to the praise of his patron.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 233<\/span><\/div><div class=\"ar\">(٨) براعة الطلب: هو أن يشير الطالب إلى ما في نفسه دون أن يصرّح في الطلب، كما في قوله :<span class=\"bayt\"><span class=\"h1\">وَفِي النَفْسِ حَاجَاتٌ وَفِيْكَ فَطَانَةٌ<\/span><span class=\"h2\">سُكُوْتِيْ كَلاَمٌ عِنْدَهَا وَخِطَابٌ<\/span><\/span><\/div><div class=\"tr\">(8) <i>Barāʿat al-ṭalab<\/i> (excellence in asking): it is that the one asking points to what is in his heart without being explicit in the request; as in his words:<br>In the soul there are needs, and in you there is discernment; with it, my silence is speech and address.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Barāʿat al-ṭalab<\/b>: making a request <b>without saying it openly<\/b>. \"There are needs in my soul, and you are perceptive; my silence speaks to you\": the poet asks without asking, trusting the patron to understand.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 233–234<\/span><\/div><div class=\"ar\">(٩) حسن الانتهاء: هو أن يجعل آخر الكلام عذْب اللفظ، حُسْن السبك، صحيحَ المعنى، فإن اشتمل على ما يُشعِر بالانتهاء سُمّي «براعةَ المقطع»، كقوله:<span class=\"bayt\"><span class=\"h1\">بَقِيْتَ بَقَاءَ الدَهْرِ يَا كَهْفَ أَهْلِهِ<\/span><span class=\"h2\">وَهَذَا دُعَاءٌ لِلْبَرِيَّةِ شَامِلُ<\/span><\/span><\/div><div class=\"tr\">(9) <i>Ḥusn al-intihāʾ<\/i> (a fine ending): it is that the end of the speech is made sweet in wording, fine in casting and sound in meaning. If it contains something that signals the ending, it is called «<i>barāʿat al-maqṭaʿ<\/i>» (excellence of the close); as in his words:<br>May you remain as long as Time remains, O refuge of its people — and this is a prayer that embraces all creation.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Ḥusn al-intihāʾ<\/b>: the ending should be sweet, well built and correct, since it is what stays in the listener's memory. If it also <b>signals that the piece is over<\/b>, it is <b>barāʿat al-maqṭaʿ<\/b>. A closing prayer, \"may you last as long as Time\", tells the listener the poem has ended.<\/div><div class=\"chartbox\"><div class=\"chh\">THE SHAPE OF A PIECE · DRAWN BY THE COMPANION<\/div><table class=\"grid\"><thead><tr><th>Place<\/th><th>Name<\/th><th>If it does more…<\/th><\/tr><\/thead><tbody><tr><td>The opening<\/td><td>Ḥusn al-ibtidāʾ ‎<span class=\"arin\">حسن الابتداء<\/span>‎<\/td><td>hints at the subject: barāʿat al-istihlāl ‎<span class=\"arin\">براعةَ الاستهلال<\/span>‎<\/td><\/tr><tr><td>The turn<\/td><td>Ḥusn al-takhalluṣ ‎<span class=\"arin\">حسن التخلص<\/span>‎<\/td><td><\/td><\/tr><tr><td>The request<\/td><td>Barāʿat al-ṭalab ‎<span class=\"arin\">براعة الطلب<\/span>‎<\/td><td><\/td><\/tr><tr><td>The ending<\/td><td>Ḥusn al-intihāʾ ‎<span class=\"arin\">حسن الانتهاء<\/span>‎<\/td><td>signals the end: barāʿat al-maqṭaʿ ‎<span class=\"arin\">براعةَ المقطع<\/span>‎<\/td><\/tr><\/tbody><\/table><\/div><h3>A NOTE<span class=\"ar\">تنبيه<\/span><\/h3><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 235<\/span><\/div><div class=\"ar\">ينبغي للمعلّم أن يناقش تلامذته في مسائل كلّ مبحث شرحه لهم من هذا الكتاب؛ ليتمكّنوا من فهمه جيّداً، فإذا رأى منهم ذلك، سألهم مسائل أخرى يمكنهم إدراكها مِمَّا فهموه.<\/div><div class=\"tr\">The teacher should discuss with his students the questions of every topic he has explained to them from this book, so that they are able to understand it well. When he sees that in them, he should ask them other questions that they can work out from what they have understood.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>The book ends with a <b>note to the teacher<\/b>: after each topic, discuss it with the students until they understand it, then test them with new examples. The exercises that follow are the book's own. Under each set, the companion gives suggested answers, so that students working alone can check themselves. Try each question yourself before reading the answer.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 235<\/span><\/div><div class=\"ar\">(الف) كأن يسألهم بعد شرح الفصاحة والبلاغة وفهمهما عن أسباب خروج العبارات الآتية عنها، أو عن إحداهما.<br>(١) رُبَّ جَفْنَة مُثْعَنْجِرة، وطعنة مسحنفرة، تبقى غداً بـ«أنقرة»، أي: جفنة ملاي وطعنة متّسعة تبقى ببلدة أنقرة.<br>(٢) الحمد لله العليّ الأجلّ.<br>(٣) أكلت العرين، وشربت الصمادح، تريد اللحم، والماء الخالص.<br>(٤)<span class=\"bayt\"><span class=\"h1\">وأزور من كان له زائرا<\/span><span class=\"h2\">وعاف في العرف عرفانه<\/span><\/span>(٥)<span class=\"bayt\"><span class=\"h1\">ألا ليت شعري هل يلومنّ قومه<\/span><span class=\"h2\">زهيراً على من جرّ من كلّ جانب<\/span><\/span>(٦)<span class=\"bayt\"><span class=\"h1\">من يهتدي في الفعل مالا يهتدي<\/span><span class=\"h2\">في القول حتّى يفعل الشعراء<\/span><\/span>أي: يهتدي في الفعل ما لا يهتديه الشعراء في القول حتّى يفعل.<br>(٧) قرب منّا فرأيناه أسدا (تريد البخر)<sup>(١)<\/sup>.<br>(٨) يجب عليك: أن تفعل كذا (تقوله بشدّة مخاطباً لِمَن إذا فعل عُدّ فعله كرماً وفضلاً).<\/div><div class=\"tr\">(a) For example, after explaining eloquence (<i>faṣāḥah<\/i>) and rhetorical effectiveness (<i>balāghah<\/i>) and their being understood, he may ask them for the reasons why the following expressions fall outside them, or outside one of them:<br>(1) «Many a brimming bowl, and a gaping spear-thrust, will remain tomorrow at Anqirah» — i.e. a full bowl and a wide spear-thrust will remain in the town of Ankara.<br>(2) «Praise be to Allah, the High, the Most Majestic (<i>al-ajall<\/i>).»<br>(3) «I ate the <i>ʿarīn<\/i> and drank the <i>ṣamādiḥ<\/i>» — meaning meat and pure water.<br>(4) And I visit whoever was a visitor to him, and he disdained, in custom, to know him.<br>(5) Would that I knew: will his people blame Zuhayr for what he dragged on from every side?<br>(6) Who is guided in deed to what [the poets] are not guided in word, until the poets do it — i.e. he is guided in deed to what the poets are not guided to in word, until he does it.<br>(7) «He came near us and we saw him to be a lion» — meaning bad breath.<br>(8) «You must do such-and-such» — said harshly, addressing one whose doing it would be counted generosity and favour.<\/div><\/div><div class=\"ce ans\"><div class=\"ceh\">SUGGESTED ANSWERS · BY THE COMPANION<\/div><p>(1) ‎<span class=\"arin\">مُثْعَنْجِرة<\/span>‎ and ‎<span class=\"arin\">مسحنفرة<\/span>‎ are <b>strange<\/b> (<i>gharābah<\/i>) and heavy words; so the speech is not <i>faṣīḥ<\/i>.<\/p><p>(2) The well-known form of this example is ‎<span class=\"arin\">الأجلل<\/span>‎, with the two <i>lām<\/i>s split, which goes <b>against the rule<\/b> of <i>ṣarf<\/i> (<i>mukhālafat al-qiyās<\/i>; the rule is ‎<span class=\"arin\">الأجلّ<\/span>‎). As printed in this edition, ‎<span class=\"arin\">الأجلّ<\/span>‎ already has the correct form.<\/p><p>(3) ‎<span class=\"arin\">العرين<\/span>‎ for meat and ‎<span class=\"arin\">الصمادح<\/span>‎ for pure water are <b>strange<\/b> words (<i>gharābah<\/i>).<\/p><p>(4) The repeated sounds (‎<span class=\"arin\">عاف<\/span>‎، ‎<span class=\"arin\">العرف<\/span>‎، ‎<span class=\"arin\">عرفانه<\/span>‎) make the words <b>heavy together<\/b> on the tongue: <i>tanāfur al-kalimāt<\/i>.<\/p><p>(5) The pronoun in ‎<span class=\"arin\">قومه<\/span>‎ refers to ‎<span class=\"arin\">زهيراً<\/span>‎, which comes later in wording and in rank: <b>weakness of composition<\/b> (<i>ḍaʿf al-taʾlīf<\/i>), like ‎<span class=\"arin\">جَزَى بَنُوْهُ أَبَا الْغِيْلاَنِ<\/span>‎.<\/p><p>(6) The words are out of their natural order (the book itself gives the order): <b>verbal complexity<\/b> (<i>taʿqīd lafẓī<\/i>).<\/p><p>(7) Calling someone a lion to mean bad breath: the lion is known for courage, as the book's footnote says, so the figure does not lead to the meaning: <b>semantic complexity<\/b> (<i>taʿqīd maʿnawī<\/i>).<\/p><p>(8) The words are <i>faṣīḥ<\/i>, but speaking harshly to someone whose action is a favour does <b>not fit the situation<\/b>, so it is not <i>balīgh<\/i>.<\/p><\/div><div class=\"bnote\"><span class=\"nh\">FOOTNOTE IN THE BOOK<\/span>‎<span class=\"arin\">(١) فإن الوصف الخاص الذي اشتهر به الأسد هو الشجاعة لا البخر وإن كان من أوصافه ١٢.<\/span>‎ — English: (1) For the particular quality for which the lion is famous is courage, not bad breath, even though that is one of its qualities.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 236<\/span><\/div><div class=\"ar\">(ب) وكأن يسألهم بعد باب الخبر والإنشاء: أن يجيبوا عمّا يأتي:<br>(١) أمن الخبر أم الإنشاء قولك: «الكلّ أعظم من الجزء» وقوله تعالى: ﴿إن قارون من قوم موسى﴾؟<br>(٢) ما وجه الإتيان بالخبر جملة في قولك: «الحقّ ظهر» و«الغضب آخره ندم»؟<br>(٣) ماالذي يستفيده السامع من قولك: «أنا معترف بفضلك»، «أنت تقوم في السحر»، «ربّ إنّي لا استطيع اصطباراً»؟<br>(٤) من أيّ الأضرب قوله تعالى حكاية عن رسل عيسى: ﴿إنا إليكم مرسلون﴾ ﴿ربنا يعلم إنا إليكم لمرسلون﴾؟<br>(٥) هل للمهتدي أن يقول: ﴿إهدنا الصراط المستقيم﴾؟<br>(٦) من أيّ أنواع الإنشاء هذه الأمثلةُ وما معانيها المستفادةُ من القرائن:؟<span class=\"bayt\"><span class=\"h1\">أولئك آبائي فجئني بمثلهم<\/span><span class=\"h2\">إذا جمعتنا ياجرير المجامع<\/span><\/span>«اعمل ما بدا لك»، «لا ترجع عن غيّك»، «لا أبالي أقعد أم قام»، «أليس الله بكاف عبده»، «هل يجازي إلاّ الكفور»، «ألَم نربّك فينا وليداً»،<span class=\"bayt\"><span class=\"h1\">ليت هنداً أنجزتنا ما تعد<\/span><span class=\"h2\">وشفت أنفسنا مِمّا تجد<\/span><\/span>«لو يأتينا فيحدّثنا»، «أسُكّان العقيق كفى فراقاً».<\/div><div class=\"tr\">(b) And, for example, after the chapter on statement and non-statement (<i>khabar<\/i> and <i>inshāʾ<\/i>), he may ask them to answer the following:<br>(1) Is it a statement or a non-statement when you say «The whole is greater than the part», and when He Exalted says ﴿Indeed Qārūn was of the people of Mūsā﴾?<br>(2) What is the reason for bringing the predicate as a sentence when you say «The truth has appeared» and «Anger — its end is regret»?<br>(3) What does the listener gain from your saying «I acknowledge your favour», «You rise before dawn», «My Lord, I cannot bear patiently»?<br>(4) Of which of the kinds is His saying, Exalted is He, relating the words of ʿĪsā’s messengers: ﴿Indeed we are sent to you﴾, ﴿Our Lord knows that we are indeed sent to you﴾?<br>(5) May one who is already guided say ﴿Guide us to the straight path﴾?<br>(6) Of which kinds of non-statement are these examples, and what are the meanings gained from the contextual indicators?<br>Those are my fathers — so bring me their like, O Jarīr, when the gatherings bring us together.<br>«Do what you please», «Do not turn back from your error», «I do not care whether he sat or stood», «Is not Allah sufficient for His servant?», «Does He requite any but the ungrateful?», «Did we not bring you up among us as a child?»,<br>Would that Hind had fulfilled to us what she promises, and healed our souls of what they feel.<br>«If only he would come to us and talk with us», «O dwellers of al-ʿAqīq, enough of parting!»<\/div><\/div><div class=\"ce ans\"><div class=\"ceh\">SUGGESTED ANSWERS · BY THE COMPANION<\/div><p>(1) Both are <b>khabar<\/b>: each can be called true or false.<\/p><p>(2) The subject is put first and the predicate is a sentence containing a pronoun that refers back to it, so the attribution is <b>repeated<\/b> and the ruling is <b>strengthened<\/b> (as in ‎<span class=\"arin\">الهلال ظهر<\/span>‎).<\/p><p>(3) ‎<span class=\"arin\">أنا معترف بفضلك<\/span>‎: the listener learns the information itself, that you acknowledge his favour (<i>fāʾidat al-khabar<\/i>).<\/p><p>‎<span class=\"arin\">أنت تقوم في السحر<\/span>‎: he already knows he rises before dawn; he learns that <b>you<\/b> know it (<i>lāzim al-fāʾidah<\/i>).<\/p><p>‎<span class=\"arin\">ربّ إنّي لا استطيع اصطباراً<\/span>‎: addressed to Allah, who knows all, so it informs no one; it shows weakness and seeks mercy.<\/p><p>(4) Both are <b>inkārī<\/b>, because the people denied the messengers. The first has emphasis with ‎<span class=\"arin\">إنّ<\/span>‎; when the denial grew stronger, the second added more emphasis: ‎<span class=\"arin\">ربنا يعلم<\/span>‎ (like an oath), ‎<span class=\"arin\">إنّ<\/span>‎ and the <i>lām<\/i>.<\/p><p>(5) Yes: the request is to be <b>kept firm<\/b> on guidance and given more of it, since one does not yet have what is asked for (continuation and increase).<\/p><p>(6) ‎<span class=\"arin\">فجئني بمثلهم<\/span>‎: command for <b>showing inability<\/b>.<\/p><p>‎<span class=\"arin\">اعمل ما بدا لك<\/span>‎: command for <b>threat<\/b>.<\/p><p>‎<span class=\"arin\">لا ترجع عن غيّك<\/span>‎: prohibition for <b>threat<\/b>.<\/p><p>‎<span class=\"arin\">أقعد أم قام<\/span>‎: question for <b>making equal<\/b>.<\/p><p>‎<span class=\"arin\">أليس الله بكاف عبده<\/span>‎: question for <b>denial<\/b>, which affirms that He is sufficient.<\/p><p>‎<span class=\"arin\">هل يجازي إلاّ الكفور<\/span>‎: question for <b>negation<\/b>.<\/p><p>‎<span class=\"arin\">ألَم نربّك فينا وليداً<\/span>‎: question to <b>reproach<\/b> and remind of a favour.<\/p><p>‎<span class=\"arin\">ليت هنداً<\/span>‎: <b>wishing<\/b> with ‎<span class=\"arin\">ليت<\/span>‎.<\/p><p>‎<span class=\"arin\">لو يأتينا فيحدّثنا<\/span>‎: <b>wishing<\/b> with ‎<span class=\"arin\">لو<\/span>‎.<\/p><p>‎<span class=\"arin\">أسُكّان العقيق<\/span>‎: <b>calling<\/b> the far with the hamzah, as if they were near, because they are always in the poet's heart.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 237<\/span><\/div><div class=\"ar\">(ج) وكأن يسألهم بعد الذكر والحذف عن دواعي الذكر في هذه الأمثلة: «أم أراد بهم ربّهم رشداً»، «الرئيس كلّمني في أمرك والرئيس أمرني بمقابَلتك»؛ (تُخاطِبُ غبيًّا) «الأمير نشر المعارف وأمّن المخاوف»؛ (جواباً لِمن سأل: ما فعل الأمير)، «حضر السارق»؛ (جواباً لقائل: هل حضر السارق؟)، «الجدار مُشرِف على السقوط»؛ (تقوله بعد سبْق ذكره تنبيهاً لصاحبه)،<span class=\"bayt\"><span class=\"h1\">فعبّاس يصدّ الخطب عنا<\/span><span class=\"h2\">وعبّاس يُجير من استجاراً<\/span><\/span>(تقوله في مقام المدح).<br>وعن دواعي الحذف في هذه الأمثلة: «وَإِنَّا لاَ نَدْرِيْ أَشَرٌّ أُرِيْدَ بِمَنْ فِي الأَرْضِ»، «فَأَمَّا مَنْ أَعْطَى وَاتَّقَى وَصَدَّقَ بِالْحُسْنَى فَسَنُيَسِّرُهُ لِلْيُسْرَى»، «خَلَقَ فَسَوَّى»، «أَلَمْ يَجِدْكَ يَتِيْماً فَآوَى»، «سَوَّلَتْ لَكُمْ أَنْفُسُكُمْ أَمْراً فَصَبْرٌ جَمِيْلٌ»، «منضجة الزروع ومصلحة الهواء محتال مراوغ»؛ (بعد ذكر إنسان)،<span class=\"bayt\"><span class=\"h1\">أم كيف ينطق بالقبيح مُجاهراً<\/span><span class=\"h2\">والهرّ يحدّث ما يشاء فيدفن<\/span><\/span><\/div><div class=\"tr\">(c) And, for example, after mention and omission, he may ask them about the motives for mention in these examples: «Or has their Lord intended right guidance for them?»; «The chief spoke to me about your affair, and the chief ordered me to meet you» (said to a dull person); «The emir spread learning and made the fearful places safe» (in answer to one who asked: What did the emir do?); «The thief came» (in answer to one who said: Did the thief come?); «The wall is about to fall» (said after it has already been mentioned, to warn its owner);<br>ʿAbbās wards off misfortune from us, and ʿAbbās protects whoever seeks protection<br>(said in a context of praise).<br>And about the motives for omission in these examples: «And we do not know whether evil is intended for those on earth»; «As for him who gives and is mindful, and affirms the best, We shall ease him to ease»; «He created, and proportioned»; «Did He not find you an orphan and shelter [you]?»; «Your souls have enticed you to something; so [my part is] beautiful patience»; «Ripener of the crops and improver of the air, a trickster, a dodger» (after a person has been mentioned);<br>Or how should he speak openly of foul things, when the cat does as it pleases and then buries it?<\/div><\/div><div class=\"ce ans\"><div class=\"ceh\">SUGGESTED ANSWERS · BY THE COMPANION<\/div><b>Mention:<\/b> ‎<span class=\"arin\">أراد بهم ربّهم<\/span>‎: the Lord is named to attribute good to Him openly (Chapter II).<p>‎<span class=\"arin\">الرئيس ... والرئيس<\/span>‎ to a dull person: <b>hinting at his dullness<\/b>.<\/p><p>‎<span class=\"arin\">الأمير نشر المعارف<\/span>‎: mentioning the title to <b>exalt<\/b> him and add clarity.<\/p><p>‎<span class=\"arin\">حضر السارق<\/span>‎: mentioning \"the thief\" to <b>disparage<\/b> him.<\/p><p>‎<span class=\"arin\">الجدار مُشرِف على السقوط<\/span>‎: mentioned again to <b>put it on record<\/b> and make the warning clear, so the owner cannot later say he was not told.<\/p><p>‎<span class=\"arin\">فعبّاس ... وعبّاس<\/span>‎: the name is repeated in praise to <b>exalt<\/b> him.<\/p><b>Omission:<\/b> ‎<span class=\"arin\">أَشَرٌّ أُرِيْدَ<\/span>‎: the doer is left out so that evil is not attributed to Allah.<p>‎<span class=\"arin\">أَعْطَى وَاتَّقَى<\/span>‎ and ‎<span class=\"arin\">خَلَقَ فَسَوَّى<\/span>‎: the objects are left out for <b>generality with brevity<\/b>, and to keep the rhyme.<\/p><p>‎<span class=\"arin\">فَآوَى<\/span>‎: the object pronoun is left out to <b>keep the rhyme<\/b> (like ‎<span class=\"arin\">وَمَا قَلَى<\/span>‎).<\/p><p>‎<span class=\"arin\">فَصَبْرٌ جَمِيْلٌ<\/span>‎: part of the sentence is left out because grief makes the situation <b>too narrow<\/b> for length.<\/p><p>‎<span class=\"arin\">منضجة الزروع ومصلحة الهواء<\/span>‎: the sun is not named, to <b>test the listener<\/b>; ‎<span class=\"arin\">محتال مراوغ<\/span>‎ after a person was mentioned: he is not named, to keep the <b>chance to deny<\/b>. In the last line, what the cat buries is left unnamed, to <b>keep the tongue<\/b> from something foul.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 237–238<\/span><\/div><div class=\"ar\">(د) وكأن يسألَهم عن دواعي التقديم والتأخير في هذه الأمثلة: «وَلَمْ يَكُنْ لَهُ كُفُواً أَحَدٌ»، «ما كلُّ ما يتمنّي المريد يُدرِكه»، «السفّاح في دارك»، «إذا أقبل عليك الزمان نقترح عليك ما نشاء»، «الإنسان جسم نام حَسّاس ناطق»، «الله أسأل أن يصلح الأمر»، «الدهر فودي شيبا»، «لَكُمْ دِيْنُكُمْ وَلِيَ دِيْنِ»،<span class=\"bayt\"><span class=\"h1\">ثلاثة تشرق الدنيا ببهجتها<\/span><span class=\"h2\">شمس الضحى وأبو إسحاق والقمر<\/span><\/span><span class=\"bayt\"><span class=\"h1\">وما أنا أسقمت جسمي به<\/span><span class=\"h2\">وما أنا أضرمت في القلب ناراً<\/span><\/span><\/div><div class=\"tr\">(d) And, for example, he may ask them about the motives for putting first and putting later in these examples: «And there is none comparable to Him»; «Not everything the seeker wishes for does he attain»; «The blood-shedder is in your house»; «When Time turns to you, we will propose to you what we wish»; «Man is a growing, sensing, rational body»; «Allah I ask to set the matter right»; «Time [has whitened] my temples with grey»; «To you your religion, and to me my religion»;<br>Three things make the world shine with their splendour: the morning sun, Abū Isḥāq, and the moon.<br>It was not I who made my body sick with it, nor I who kindled a fire in the heart.<\/div><\/div><div class=\"ce ans\"><div class=\"ceh\">SUGGESTED ANSWERS · BY THE COMPANION<\/div><p>‎<span class=\"arin\">وَلَمْ يَكُنْ لَهُ كُفُواً أَحَدٌ<\/span>‎: ‎<span class=\"arin\">لَهُ<\/span>‎ and ‎<span class=\"arin\">كُفُواً<\/span>‎ come before ‎<span class=\"arin\">أَحَدٌ<\/span>‎ to <b>keep the rhyme<\/b> of the sūrah, whose verses end in <i>-ad<\/i>.<\/p><p>‎<span class=\"arin\">ما كلُّ ما يتمنّي المريد يُدرِكه<\/span>‎: the negation comes before ‎<span class=\"arin\">كلّ<\/span>‎: <b>negation of generality<\/b> (not everything, though some may be).<\/p><p>‎<span class=\"arin\">السفّاح في دارك<\/span>‎: the bad news comes first, <b>bringing distress quickly<\/b>.<\/p><p>‎<span class=\"arin\">إذا أقبل عليك الزمان<\/span>‎: ‎<span class=\"arin\">عليك<\/span>‎ comes before the doer, bringing the good news to the listener quickly.<\/p><p>‎<span class=\"arin\">جسم نام حَسّاس ناطق<\/span>‎: <b>rising<\/b> from the general to the particular.<\/p><p>‎<span class=\"arin\">الله أسأل<\/span>‎: the object first for <b>specification<\/b> (Allah alone I ask).<\/p><p>‎<span class=\"arin\">الدهر فودي شيبا<\/span>‎: the subject is put first (the sentence seems to have lost its verb in print); a subject put before its verb <b>strengthens the ruling<\/b>.<\/p><p>‎<span class=\"arin\">لَكُمْ دِيْنُكُمْ وَلِيَ دِيْنِ<\/span>‎: the predicate first for <b>specification<\/b>.<\/p><p>‎<span class=\"arin\">ثلاثة تشرق الدنيا<\/span>‎: the number first <b>creates eagerness<\/b> to hear what the three are.<\/p><p>‎<span class=\"arin\">وما أنا أسقمت<\/span>‎: ‎<span class=\"arin\">أنا<\/span>‎ after the negation for <b>specification<\/b>: it was not I who did it.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 238–239<\/span><\/div><div class=\"ar\">(ه) وكأن يسألَهم عن أغراض التعريف والتنكير في هذه الأمثلة:<span class=\"bayt\"><span class=\"h1\">إذا أنت أكرمت الكريم ملكته<\/span><span class=\"h2\">وإن أنت أكرمت اللئيم تمرّدا<\/span><\/span>«وَإِذَا رَأَيْتَهُمْ تُعْجِبُكَ أَجْسَامُهُمْ وَأَنْ يَقُوْلُوْا تَسْمَعُ لِقَوْلِهِمْ كَأَنَّهُمْ خُشُبٌ مُسْنَدَةٌ»، «تَبَّتْ يَدَا أَبِيْ لَهَبٍ»، «مَا كَانَ مُحَمَّدٌ أَبَا أَحَدٍ مِّنْ رِّجَالِكُمْ»،<span class=\"bayt\"><span class=\"h1\">عبّاس عبّاس إذا احتدم الوغى<\/span><span class=\"h2\">والفضل فضل والربيع ربيع<\/span><\/span>قرأنا شعر أبي الطيّب وحبيب ولَم نقرأ شعر الوليد»، «وَمَا هَذِهِ الْحَيَاةُ الدُنْيَا إلاَّ لَعِبٌ وَلَهْوٌ»، «هَذَا الَّذِيْ بَعَثَ اللهُ رَسُوْلاً»،<span class=\"bayt\"><span class=\"h1\">هذا أبو الصقر فرداً في محاسنه<\/span><span class=\"h2\">من نسل شيبان بين الضال والسمر<\/span><\/span>«فَأَوْحَى إِلَى عَبْدِهِ مَا أَوْحَى»، «اَلَّذِيْنَ كَذَّبُوْا شُعَيْباً كَانُوْا هُمُ الْخَاسِرِيْنَ»، «الّذي خاط ملابس الأمير خاط هذا الثوب»، «أخذَ ما أعطيته وسار»، «الرجل خير من المرأة»، «عَالِمُ الْغَيْبِ وَالشَهَادَةِ»، «اليوم يستقبل إلاّ مال راجيها»، «لبث القوم ساعة وقضوا الساعة في الجدال»، «أَطِيْعُوا اللهَ وَأَطِيْعُوا الرَسُوْلَ»، «اُدخل السوق واشتر اللحم»، «زيد الشجاع»، «علماء الدين أجمعوا على كذا»، «ركب وزراء السلطان»، «هذا قريب اللص»، «أخو الوزير أرسل لي»، «وإنّ شفائي عبرة مهراقة»، «يا بوّاب افتتح الباب، وياحارس لا تبرح»، «وَجَاءَ رَجُلٌ مِنْ أَقْصَى الْمَدِيْنَةِ»، «وَعَلَى أَبْصَارِهِمْ غِشَاوَةٌ»، «إنّ له لإبلاً وإنّ له لَغنماً»، «ما قدم من أحد»،<span class=\"bayt\"><span class=\"h1\">ولله عندي جانب لا أضيعه<\/span><span class=\"h2\">واللهو عندي والخلاعة جانب<\/span><\/span><span class=\"bayt\"><span class=\"h1\">فيوماً بِخَيل تطرد الروم عنهمو<\/span><span class=\"h2\">ويوماً بجُود يطرد الفقر والجدبا<\/span><\/span>«وَإِنْ يُكَذِّبُوْكَ فَقَدْ كُذِّبَتْ رُسُلٌ مِنْ قَبْلِكَ»، «أَإِنَّ لَنَا لَأَجْراً».<\/div><div class=\"tr\">(e) And, for example, he may ask them about the purposes of definiteness and indefiniteness in these examples:<br>If you honour the noble man, you possess him; and if you honour the base man, he rebels.<br>«And when you see them, their bodies please you, and if they speak you listen to their speech; as if they were propped-up timbers»; «Perish the hands of Abū Lahab»; «Muḥammad is not the father of any of your men»;<br>ʿAbbās is ʿAbbās when the battle rages; and Faḍl is Faḍl, and Rabīʿ is Rabīʿ.<br>«We read the poetry of Abū al-Ṭayyib and Ḥabīb, and did not read the poetry of al-Walīd»; «And this worldly life is nothing but play and amusement»; «Is this the one whom Allah has sent as a messenger?»;<br>This is Abū al-Ṣaqr, unique in his virtues, of the line of Shaybān, between the lote-trees and the acacias.<br>«So He revealed to His servant what He revealed»; «Those who denied Shuʿayb — they were the losers»; «The one who sewed the emir’s clothes sewed this garment»; «He took what I gave him and went»; «Man is better than woman»; «Knower of the unseen and the seen»; «Today … [none] is received except the wealth of its hoper»; «The people stayed an hour, and spent the hour in argument»; «Obey Allah and obey the Messenger»; «Go into the market and buy the meat»; «Zayd the brave»; «The scholars of religion agreed on such-and-such»; «The sultan’s ministers rode out»; «This is the thief’s relative»; «The minister’s brother sent for me»; «And my healing is a tear poured out»; «O doorkeeper, open the door; and O guard, do not leave»; «And a man came from the farthest end of the city»; «And over their eyes is a covering»; «He has camels indeed, and he has sheep indeed»; «Not one person came»;<br>Allah has a side in me that I do not neglect; and play and frivolity have a side in me.<br>One day with horses that drive the Byzantines away from them, and one day with generosity that drives away poverty and drought.<br>«And if they deny you, messengers before you were denied»; «Shall we indeed have a reward?»<\/div><\/div><div class=\"ce ans\"><div class=\"ceh\">SUGGESTED ANSWERS · BY THE COMPANION<\/div><p>‎<span class=\"arin\">أنت<\/span>‎ in the first line addresses <b>anyone at all<\/b> (generality); ‎<span class=\"arin\">الكريم<\/span>‎ and ‎<span class=\"arin\">اللئيم<\/span>‎ have <i>al<\/i> of the genus.<\/p><p>‎<span class=\"arin\">خُشُبٌ مُسْنَدَةٌ<\/span>‎: indefinite to <b>belittle<\/b>.<\/p><p>‎<span class=\"arin\">أَبِيْ لَهَبٍ<\/span>‎: a name used as an <b>allusion<\/b> to the Fire.<\/p><p>‎<span class=\"arin\">مُحَمَّدٌ<\/span>‎: the proper name brings him to mind by his own name; ‎<span class=\"arin\">أَحَدٍ<\/span>‎ is indefinite after a negation, so it is <b>general<\/b>.<\/p><p>‎<span class=\"arin\">عبّاس عبّاس ... والفضل فضل والربيع ربيع<\/span>‎: names chosen for their meanings, to <b>exalt<\/b>.<\/p><p>‎<span class=\"arin\">أبي الطيّب وحبيب ... الوليد<\/span>‎: proper names to bring the poets to mind by name.<\/p><p>‎<span class=\"arin\">هَذِهِ الْحَيَاةُ الدُنْيَا<\/span>‎: the demonstrative to <b>belittle<\/b>.<\/p><p>‎<span class=\"arin\">هَذَا الَّذِيْ بَعَثَ اللهُ رَسُوْلاً<\/span>‎: the demonstrative to <b>belittle<\/b> and the relative clause to <b>mock<\/b>.<\/p><p>‎<span class=\"arin\">هذا أبو الصقر<\/span>‎: the demonstrative for <b>full attention<\/b> to the one praised.<\/p><p>‎<span class=\"arin\">مَا أَوْحَى<\/span>‎: the relative to make it <b>tremendous<\/b>; ‎<span class=\"arin\">عَبْدِهِ<\/span>‎: annexation to <b>honour<\/b>.<\/p><p>‎<span class=\"arin\">اَلَّذِيْنَ كَذَّبُوْا شُعَيْباً<\/span>‎: the relative clause gives the <b>reason<\/b> for their loss.<\/p><p>‎<span class=\"arin\">الّذي خاط ملابس الأ
