class=\"arin\">العسجد الذهب<\/span>‎, the common word ‎<span class=\"arin\">الذهب<\/span>‎ explains the rare word ‎<span class=\"arin\">العسجد<\/span>‎.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 101<\/span><\/div><div class=\"ar\">وعطف النسق يكون للأغراض الّتي تؤدّيها أحرف العطف، كالترتيب مع التعقيب في «الفاء»، ومع التراخي في «ثُمّ».<\/div><div class=\"tr\">Conjunction by a particle (ʿaṭf al-nasaq) is for the purposes that the conjunctive particles convey, such as order with immediate succession (taʿqīb) in «al-fāʾ», and [order] with delay (tarākhī) in «thumma».<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>ʿAṭf al-nasaq<\/b> (conjunction with a particle) adds whatever the particle means. ‎<span class=\"arin\">الفاء<\/span>‎ gives <b>order with no gap<\/b>: \"Zayd came, then straight after, ʿAmr.\" ‎<span class=\"arin\">ثُمّ<\/span>‎ gives <b>order with a gap<\/b> of time.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 101<\/span><\/div><div class=\"ar\">والبدل يكون لزيادة التقرير والإيضاح، نحو: «قدم ابني عليّ» في بدل الكلّ، و«سافر الجند أغلبه» في بدل البعض، و«نفعني الأستاذ علمه» في بدل الاشتمال.<\/div><div class=\"tr\">The substitute (badal) is for adding confirmation and clarity, e.g. «Qadima ibnī ʿAliyyun» (my son, ʿAlī, arrived) for the substitute of the whole; «Sāfara al-jundu aghlabuhu» (the army, most of it, travelled) for the substitute of the part; and «Nafaʿanī al-ustādhu ʿilmuhu» (the teacher, his knowledge, benefited me) for the substitute of inclusion (ishtimāl).<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>The <b>substitute<\/b> (<i>badal<\/i>) adds strength and clarity, because the judgement is in effect said twice: once about the first word, once about the substitute.<\/p><b>Whole for whole<\/b>: ‎<span class=\"arin\">ابني عليّ<\/span>‎, ʿAlī is the son. <b>Part for whole<\/b>: ‎<span class=\"arin\">الجند أغلبه<\/span>‎, most of the army. <b>Inclusion<\/b> (<i>ishtimāl<\/i>): ‎<span class=\"arin\">الأستاذ علمه<\/span>‎, the teacher's knowledge, something belonging to him.<\/div><div class=\"chartbox\"><div class=\"chh\">THE TAWĀBIʿ AND THEIR PURPOSES · DRAWN BY THE COMPANION<\/div><table class=\"grid\"><thead><tr><th>Tābiʿ<\/th><th>Purposes<\/th><th>Book's example<\/th><\/tr><\/thead><tbody><tr><td>Naʿt ‎<span class=\"arin\">النعت<\/span>‎<\/td><td>distinguishing, unveiling, emphasis, praise, blame, pity<\/td><td>‎<span class=\"arin\">حضر عليّ الكاتب<\/span>‎<\/td><\/tr><tr><td>ʿAṭf al-bayān ‎<span class=\"arin\">عطف البيان<\/span>‎<\/td><td>clarifying; clarifying with praise<\/td><td>‎<span class=\"arin\">أبو حفص عمر<\/span>‎<\/td><\/tr><tr><td>ʿAṭf al-nasaq ‎<span class=\"arin\">عطف النسق<\/span>‎<\/td><td>the meaning of its particle<\/td><td>‎<span class=\"arin\">الفاء<\/span>‎، ‎<span class=\"arin\">ثُمّ<\/span>‎<\/td><\/tr><tr><td>Badal ‎<span class=\"arin\">البدل<\/span>‎<\/td><td>added confirmation and clarity<\/td><td>‎<span class=\"arin\">قدم ابني عليّ<\/span>‎<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box\"><div class=\"bh\">KEY TERMS AND THEIR MEANINGS · ADDED BY THE COMPANION<\/div><table class=\"terms\"><tr><td class=\"t\">Muṭlaq (unrestricted)<\/td><td>A judgement where only the musnad and musnad ilayh are mentioned<\/td><td class=\"a\">مطلق<\/td><\/tr><tr><td class=\"t\">Muqayyad (restricted)<\/td><td>A judgement where something connected with the musnad or musnad ilayh is added<\/td><td class=\"a\">مقيّد<\/td><\/tr><tr><td class=\"t\">Iṭlāq<\/td><td>Unrestricted statement: used where the purpose is not concerned with restricting the judgement<\/td><td class=\"a\">الإطلاق<\/td><\/tr><tr><td class=\"t\">Taqyīd<\/td><td>Restriction: used where the purpose requires restricting the judgement in a specific way<\/td><td class=\"a\">التقييد<\/td><\/tr><tr><td class=\"t\">Qayd (pl. quyūd)<\/td><td>A restriction; it is the focal point of the benefit<\/td><td class=\"a\">القيود<\/td><\/tr><tr><td class=\"t\">Maḥaṭṭ al-fāʾida<\/td><td>The focal point of the benefit<\/td><td class=\"a\">محطّ الفائدة<\/td><\/tr><tr><td class=\"t\">Nawāsikh<\/td><td>Abrogators: verbs (and particles) that change the ruling of mubtadaʾ and khabar<\/td><td class=\"a\">النواسخ<\/td><\/tr><tr><td class=\"t\">Afʿāl al-qulūb<\/td><td>Verbs of the heart, e.g. «wajada», «alfā», «darā», «taʿallam»<\/td><td class=\"a\">أفعال القلوب<\/td><\/tr><tr><td class=\"t\">Afʿāl al-muqāraba<\/td><td>Verbs of approximation: «kāda», «karaba», «awshaka»<\/td><td class=\"a\">أفعال المقاربة<\/td><\/tr><tr><td class=\"t\">Adawāt al-sharṭ<\/td><td>Conditional particles<\/td><td class=\"a\">أدوات الشرط<\/td><\/tr><tr><td class=\"t\">Jazm<\/td><td>Certainty (here: of the condition occurring)<\/td><td class=\"a\">الجزم<\/td><\/tr><tr><td class=\"t\">Al al-jinsiyya<\/td><td>The definite article of the genus<\/td><td class=\"a\">أل الجنسيّة<\/td><\/tr><tr><td class=\"t\">Jawāb / jazāʾ<\/td><td>The answer (apodosis) of a conditional sentence: what is intended in itself<\/td><td class=\"a\">الجواب<\/td><\/tr><tr><td class=\"t\">Salb al-nisba<\/td><td>Removing the attribution (by negation)<\/td><td class=\"a\">سلب النسبة<\/td><\/tr><tr><td class=\"t\">Nafy al-ḥāl<\/td><td>Negating the present: «mā» and «in» when they enter the imperfect<\/td><td class=\"a\">لنفْي الحال<\/td><\/tr><tr><td class=\"t\">Nafy al-istiqbāl<\/td><td>Negating the future: «lan»<\/td><td class=\"a\">لنفْي الاستقبال<\/td><\/tr><tr><td class=\"t\">Nafy al-muḍiyy<\/td><td>Negating the past: «lam» and «lammā»<\/td><td class=\"a\">لنفْي الْمُضِيِّ<\/td><\/tr><tr><td class=\"t\">Al-mutawaqqaʿ<\/td><td>What is expected to happen; negation with «lammā» is particular to it<\/td><td class=\"a\">المتوقّع<\/td><\/tr><tr><td class=\"t\">Al-tawābiʿ<\/td><td>The appositives: naʿt, ʿaṭf al-bayān, ʿaṭf al-nasaq and badal<\/td><td class=\"a\">التوابع<\/td><\/tr><tr><td class=\"t\">Naʿt<\/td><td>The adjective; for distinguishing, unveiling, emphasis, praise, blame or pity<\/td><td class=\"a\">النعت<\/td><\/tr><tr><td class=\"t\">Tamyīz<\/td><td>Distinguishing the described from others who share its name<\/td><td class=\"a\">التمييز<\/td><\/tr><tr><td class=\"t\">Kashf<\/td><td>Unveiling the meaning of the described<\/td><td class=\"a\">الكشف<\/td><\/tr><tr><td class=\"t\">Taraḥḥum<\/td><td>Evoking pity<\/td><td class=\"a\">الترحّم<\/td><\/tr><tr><td class=\"t\">ʿAṭf al-bayān<\/td><td>Explicative apposition: clarifies the one it follows<\/td><td class=\"a\">عطف البيان<\/td><\/tr><tr><td class=\"t\">ʿAṭf al-nasaq<\/td><td>Conjunction by a particle<\/td><td class=\"a\">عطف النسق<\/td><\/tr><tr><td class=\"t\">Taʿqīb<\/td><td>Immediate succession without delay (with «al-fāʾ»)<\/td><td class=\"a\">التعقيب<\/td><\/tr><tr><td class=\"t\">Tarākhī<\/td><td>Delay, a time gap (with «thumma»)<\/td><td class=\"a\">التراخي<\/td><\/tr><tr><td class=\"t\">Badal<\/td><td>The substitute; for added confirmation and clarity<\/td><td class=\"a\">البدل<\/td><\/tr><tr><td class=\"t\">Badal al-kull / al-baʿḍ / al-ishtimāl<\/td><td>Substitute of the whole / of the part / of inclusion<\/td><td class=\"a\">بدل الكلّ، بدل البعض، بدل الاشتمال<\/td><\/tr><\/table><\/div><h3>QUESTIONS AND ANSWERS<span class=\"ar\">أسئلة وأجوبة<\/span><\/h3><div class=\"qabox\"><div class=\"qh\">QUESTIONS AND ANSWERS · ADDED BY THE COMPANION<\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>When is a judgement <i>muṭlaq<\/i> and when <i>muqayyad<\/i>?<\/div><div class=\"a\"><span class=\"k\">A.<\/span><i>Muṭlaq<\/i> when only the <i>musnad<\/i> and <i>musnad ilayhi<\/i> are mentioned; <i>muqayyad<\/i> when something connected to them is added.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>Why might a speaker leave a judgement unrestricted?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>So that the listener's mind may take it in every possible direction, when the purpose is not tied to any particular limit.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>Explain how the restriction is <i>maḥaṭṭ al-fāʾidah<\/i> in ‎<span class=\"arin\">وَمَا خَلَقْنَا السَّمَاوَاتِ وَالأَرْضَ وَمَا بَيْنَهُمَا لاَعِبِيْنَ<\/span>‎.<\/div><div class=\"a\"><span class=\"k\">A.<\/span>Without ‎<span class=\"arin\">لاَعِبِيْنَ<\/span>‎ the sentence would deny the creation, which is false; the negation falls on the restriction \"in play\".<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>What does ‎<span class=\"arin\">ظننتُ<\/span>‎ add to ‎<span class=\"arin\">زيداً قائماً<\/span>‎?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>It presents \"Zayd is standing\" as what the speaker thinks, not as certain fact.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>Give two differences between ‎<span class=\"arin\">إن<\/span>‎ and ‎<span class=\"arin\">إذا<\/span>‎.<\/div><div class=\"a\"><span class=\"k\">A.<\/span>With ‎<span class=\"arin\">إن<\/span>‎ the condition is doubtful, with ‎<span class=\"arin\">إذا<\/span>‎ it is certain; so ‎<span class=\"arin\">إن<\/span>‎ is used for rare things and ‎<span class=\"arin\">إذا<\/span>‎ for frequent ones (and ‎<span class=\"arin\">إذا<\/span>‎ is often followed by a past verb).<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>Explain the use of ‎<span class=\"arin\">إذا<\/span>‎ and ‎<span class=\"arin\">إن<\/span>‎ in ‎<span class=\"arin\">فَإِذَا جَاءتْهُمُ الْحَسَنَةُ<\/span>‎… ‎<span class=\"arin\">وَإِن تُصِبْهُمْ سَيِّئَةٌ<\/span>‎.<\/div><div class=\"a\"><span class=\"k\">A.<\/span>Good came to them certainly and often, so ‎<span class=\"arin\">إذا<\/span>‎, a past verb and the definite ‎<span class=\"arin\">الْحَسَنَةُ<\/span>‎ are used; harm came rarely, so ‎<span class=\"arin\">إن<\/span>‎, a <i>muḍāriʿ<\/i> and the indefinite ‎<span class=\"arin\">سَيِّئَةٌ<\/span>‎ are used.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>What is the real statement in a conditional sentence, and what follows from this?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>The answer (<i>jawāb<\/i>); so the sentence is <i>khabar<\/i> or <i>inshāʾ<\/i> according to its answer.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>Why can one not say ‎<span class=\"arin\">لَمَّا يقم زيد ثُمّ قام<\/span>‎?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>Because the negation of ‎<span class=\"arin\">لمّا<\/span>‎ extends up to the time of speaking, so it cannot be followed by saying he then stood.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>What does the adjective do in ‎<span class=\"arin\">حضر عليّ الكاتب<\/span>‎ and in ‎<span class=\"arin\">تِلْكَ عَشَرَةٌ كَامِلَةٌ<\/span>‎?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>In the first it distinguishes; in the second it emphasises.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>Name the three kinds of <i>badal<\/i> with the book's examples.<\/div><div class=\"a\"><span class=\"k\">A.<\/span>Whole: ‎<span class=\"arin\">قدم ابني عليّ<\/span>‎; part: ‎<span class=\"arin\">سافر الجند أغلبه<\/span>‎; inclusion: ‎<span class=\"arin\">نفعني الأستاذ علمه<\/span>‎.<\/div><\/div><\/div>", "terms": [{"t": "Muṭlaq (unrestricted)", "m": "A judgement where only the musnad and musnad ilayh are mentioned", "a": "مطلق"}, {"t": "Muqayyad (restricted)", "m": "A judgement where something connected with the musnad or musnad ilayh is added", "a": "مقيّد"}, {"t": "Iṭlāq", "m": "Unrestricted statement: used where the purpose is not concerned with restricting the judgement", "a": "الإطلاق"}, {"t": "Taqyīd", "m": "Restriction: used where the purpose requires restricting the judgement in a specific way", "a": "التقييد"}, {"t": "Qayd (pl. quyūd)", "m": "A restriction; it is the focal point of the benefit", "a": "القيود"}, {"t": "Maḥaṭṭ al-fāʾida", "m": "The focal point of the benefit", "a": "محطّ الفائدة"}, {"t": "Nawāsikh", "m": "Abrogators: verbs (and particles) that change the ruling of mubtadaʾ and khabar", "a": "النواسخ"}, {"t": "Afʿāl al-qulūb", "m": "Verbs of the heart, e.g. «wajada», «alfā», «darā», «taʿallam»", "a": "أفعال القلوب"}, {"t": "Afʿāl al-muqāraba", "m": "Verbs of approximation: «kāda», «karaba», «awshaka»", "a": "أفعال المقاربة"}, {"t": "Adawāt al-sharṭ", "m": "Conditional particles", "a": "أدوات الشرط"}, {"t": "Jazm", "m": "Certainty (here: of the condition occurring)", "a": "الجزم"}, {"t": "Al al-jinsiyya", "m": "The definite article of the genus", "a": "أل الجنسيّة"}, {"t": "Jawāb / jazāʾ", "m": "The answer (apodosis) of a conditional sentence: what is intended in itself", "a": "الجواب"}, {"t": "Salb al-nisba", "m": "Removing the attribution (by negation)", "a": "سلب النسبة"}, {"t": "Nafy al-ḥāl", "m": "Negating the present: «mā» and «in» when they enter the imperfect", "a": "لنفْي الحال"}, {"t": "Nafy al-istiqbāl", "m": "Negating the future: «lan»", "a": "لنفْي الاستقبال"}, {"t": "Nafy al-muḍiyy", "m": "Negating the past: «lam» and «lammā»", "a": "لنفْي الْمُضِيِّ"}, {"t": "Al-mutawaqqaʿ", "m": "What is expected to happen; negation with «lammā» is particular to it", "a": "المتوقّع"}, {"t": "Al-tawābiʿ", "m": "The appositives: naʿt, ʿaṭf al-bayān, ʿaṭf al-nasaq and badal", "a": "التوابع"}, {"t": "Naʿt", "m": "The adjective; for distinguishing, unveiling, emphasis, praise, blame or pity", "a": "النعت"}, {"t": "Tamyīz", "m": "Distinguishing the described from others who share its name", "a": "التمييز"}, {"t": "Kashf", "m": "Unveiling the meaning of the described", "a": "الكشف"}, {"t": "Taraḥḥum", "m": "Evoking pity", "a": "الترحّم"}, {"t": "ʿAṭf al-bayān", "m": "Explicative apposition: clarifies the one it follows", "a": "عطف البيان"}, {"t": "ʿAṭf al-nasaq", "m": "Conjunction by a particle", "a": "عطف النسق"}, {"t": "Taʿqīb", "m": "Immediate succession without delay (with «al-fāʾ»)", "a": "التعقيب"}, {"t": "Tarākhī", "m": "Delay, a time gap (with «thumma»)", "a": "التراخي"}, {"t": "Badal", "m": "The substitute; for added confirmation and clarity", "a": "البدل"}, {"t": "Badal al-kull / al-baʿḍ / al-ishtimāl", "m": "Substitute of the whole / of the part / of inclusion", "a": "بدل الكلّ، بدل البعض، بدل الاشتمال"}], "part": null}, {"num": 8, "title": "Restriction", "ar": "الباب السادس في القصر", "body": "<h3>CHAPTER SIX: ON RESTRICTION<span class=\"ar\">الباب السادس في القصر<\/span><\/h3><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 102<\/span><\/div><div class=\"ar\">القصر تخصيص شيء بشيء بطريق مخصوص،<\/div><div class=\"tr\">Restriction (qaṣr) is the specifying of one thing to another thing by a particular method.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Restriction<\/b> (<i>qaṣr<\/i>) means tying one thing to another <b>so that it belongs to it alone<\/b>, using one of a few particular methods. In ‎<span class=\"arin\">ما شاعر إلاّ عليّ<\/span>‎ (\"No one is a poet but ʿAlī\"), being a poet is tied to ʿAlī alone.<p>Two names help in this chapter (they are the usual terms, not printed in the book): the thing restricted is the <b>maqṣūr<\/b>, and the thing it is restricted to is the <b>maqṣūr ʿalayhi<\/b>.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 102<\/span><\/div><div class=\"ar\">وينقسم إلى حقيقيّ وإضافيّ؛ فالحقيقيّ ماكان الاختصاص فيه بحسب الواقع والحقيقة لا بحسب الإضافة إلى شيء آخر، نحو: «لا كاتب في المدينة إلاَّ عليّ» إذا لَم يكن غيره فيها من الكُتّاب،<\/div><div class=\"tr\">It is divided into real (ḥaqīqī) and relative (iḍāfī). The real is that in which the specifying is according to the actual state of affairs and reality, not according to the relation to some other thing; e.g. «There is no scribe in the city except ʿAlī», when there is no other scribe in it besides him.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>Restriction is first divided by whether it is true <b>absolutely<\/b> or only <b>in relation to something else<\/b>.<\/p><b>Real restriction<\/b> (<i>ḥaqīqī<\/i>) is true of the world as it is: \"There is no scribe in the city except ʿAlī\" is real restriction if, in fact, there is no other scribe in the city at all.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 102<\/span><\/div><div class=\"ar\">والإضافيّ ماكان الاختصاص فيه بحسب الإضافة إلى شيء معيّن، نحو: «ما عليّ إلاّ قائم»، أي: إنّ له صفةَ القيام لا صفةَ القعود، وليس الغرض نفْي جميع الصفات عنه ما عدا صفة القيام،<\/div><div class=\"tr\">The relative is that in which the specifying is according to the relation to a particular thing; e.g. «ʿAlī is nothing but standing», i.e. he has the attribute of standing, not the attribute of sitting; the purpose is not to negate from him all attributes other than the attribute of standing.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Relative restriction<\/b> (<i>iḍāfī<\/i>) is true only <b>compared with one particular thing<\/b>. \"ʿAlī is nothing but standing\" does not mean he has no other qualities at all (he may be tall, learned, and so on). It means: standing, <i>not sitting<\/i>. The restriction is relative to sitting only.<\/div><div class=\"chartbox\"><div class=\"chh\">REAL AND RELATIVE RESTRICTION · DRAWN BY THE COMPANION<\/div><table class=\"grid\"><thead><tr><th><\/th><th>Ḥaqīqī ‎<span class=\"arin\">حقيقيّ<\/span>‎<\/th><th>Iḍāfī ‎<span class=\"arin\">إضافيّ<\/span>‎<\/th><\/tr><\/thead><tbody><tr><td>True…<\/td><td>in reality, against everything<\/td><td>in relation to one particular thing<\/td><\/tr><tr><td>Book's example<\/td><td>‎<span class=\"arin\">لا كاتب في المدينة إلاَّ عليّ<\/span>‎<\/td><td>‎<span class=\"arin\">ما عليّ إلاّ قائم<\/span>‎<\/td><\/tr><tr><td>Meaning<\/td><td>no other scribe exists in the city<\/td><td>standing, as opposed to sitting<\/td><\/tr><\/tbody><\/table><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 102–103<\/span><\/div><div class=\"ar\">وكلّ منهما ينقسم إلى قصر صفة على موصوف، نحو: «لا فارس إلاّ عليّ»،<\/div><div class=\"tr\">Each of them is divided into the restriction of an attribute to a thing described, e.g. «There is no horseman except ʿAlī»,<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>Each of these is then divided by <b>which way round<\/b> the restriction goes. The first: restricting an <b>attribute<\/b> to a <b>person or thing<\/b>. In ‎<span class=\"arin\">لا فارس إلاّ عليّ<\/span>‎ the attribute \"horseman\" belongs to ʿAlī alone; no one else has it. (ʿAlī may well have other attributes too.)<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 103<\/span><\/div><div class=\"ar\">وقصر موصوف على صفة، نحو: ﴿وَمَا مُحَمَّدٌ إِلاَّ رَسُولٌ﴾ [آل عمران: ١٤٤]؛ فيجوز عليه الموت.<\/div><div class=\"tr\">and the restriction of a thing described to an attribute, e.g. ﴾And Muḥammad is not but a Messenger﴿ [Āl ʿImrān 3:144]; so death is possible for him.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>The second: restricting a <b>person<\/b> to an <b>attribute<\/b>. In ‎<span class=\"arin\">وَمَا مُحَمَّدٌ إِلاَّ رَسُولٌ<\/span>‎, Muḥammad ﷺ is described as a messenger and nothing beyond that; he is not immortal. That is why the book adds: \"so death is possible for him\". (Other messengers had died before him, as the verse goes on to say.)<\/p><p>Note this is relative restriction: it is \"messenger\" as opposed to \"one who cannot die\", not a denial of all his other qualities.<\/p><\/div><div class=\"chartbox\"><div class=\"chh\">TWO DIRECTIONS OF RESTRICTION · DRAWN BY THE COMPANION<\/div><table class=\"grid\"><thead><tr><th><\/th><th>Attribute → described<\/th><th>Described → attribute<\/th><\/tr><\/thead><tbody><tr><td>Arabic name<\/td><td>‎<span class=\"arin\">قصر صفة على موصوف<\/span>‎<\/td><td>‎<span class=\"arin\">قصر موصوف على صفة<\/span>‎<\/td><\/tr><tr><td>Book's example<\/td><td>‎<span class=\"arin\">لا فارس إلاّ عليّ<\/span>‎<\/td><td>‎<span class=\"arin\">وَمَا مُحَمَّدٌ إِلاَّ رَسُولٌ<\/span>‎<\/td><\/tr><tr><td>Meaning<\/td><td>no one but ʿAlī has this quality<\/td><td>he is this, and not something else<\/td><\/tr><\/tbody><\/table><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 103<\/span><\/div><div class=\"ar\">والقصر الإضافيّ ينقسم باعتبارحال المخاطب إلى ثلاثة أقسام: قصر إفراد إذا اعتقد المخاطب الشركة، ......<\/div><div class=\"tr\">Relative restriction is divided, according to the state of the addressee, into three kinds: restriction of singling out (qaṣr ifrād), when the addressee believes there is sharing; ……<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>Relative restriction is divided again, according to what the <b>listener believes<\/b>. Restriction corrects a mistaken belief, and there are three possible mistakes.<\/p><p>(1) <b>Qaṣr ifrād<\/b> (singling out): the listener thinks <b>two share<\/b> the quality. If he thinks ʿAlī and Khālid are both poets, you say \"Only ʿAlī is a poet\", singling ʿAlī out.<\/p><\/div><div class=\"cnote\"><span class=\"cnh\">COMPANION&#8217;S NOTE · NOT IN THE BOOK<\/span><p>Misprint? The text prints «باعتبارحال» with no space; the reading is «باعتبار حال». (Likewise «ماكان» on p. 102 is printed joined, for «ما كان».)<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 104<\/span><\/div><div class=\"ar\">وقصر قلب إذا اعتقد العكس،<\/div><div class=\"tr\">restriction of reversal (qaṣr qalb), when he believes the reverse;<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>(2) <b>Qaṣr qalb<\/b> (reversal): the listener believes the <b>opposite<\/b>. If he thinks Khālid is the poet and ʿAlī is not, you say \"Only ʿAlī is a poet\", reversing his belief.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 104<\/span><\/div><div class=\"ar\">وقصر تعيين إذا اعتقد واحداً غير معيّن.<\/div><div class=\"tr\">and restriction of specification (qaṣr taʿyīn), when he believes one [of the two] without specifying it.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>(3) <b>Qaṣr taʿyīn<\/b> (specification): the listener knows it is <b>one of the two<\/b> but not which. You settle it: \"Only ʿAlī is the poet.\"<\/p><p>Notice the same sentence can be any of the three; what changes is the listener's mind. This links back to Chapter I: speech is <i>balīgh<\/i> when it fits the situation.<\/p><\/div><div class=\"chartbox\"><div class=\"chh\">THE THREE KINDS BY THE LISTENER'S BELIEF · DRAWN BY THE COMPANION<\/div><table class=\"grid\"><thead><tr><th>The listener believes…<\/th><th>Kind<\/th><th>Effect<\/th><\/tr><\/thead><tbody><tr><td>both share it<\/td><td>Qaṣr ifrād ‎<span class=\"arin\">قصر إفراد<\/span>‎<\/td><td>singles one out<\/td><\/tr><tr><td>the reverse<\/td><td>Qaṣr qalb ‎<span class=\"arin\">قصر قلب<\/span>‎<\/td><td>turns his belief round<\/td><\/tr><tr><td>one of them, not sure which<\/td><td>Qaṣr taʿyīn ‎<span class=\"arin\">قصر تعيين<\/span>‎<\/td><td>settles which one<\/td><\/tr><\/tbody><\/table><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 105<\/span><\/div><div class=\"ar\">وللقصر طرق، منها: النفي والاستثناء، نحو: ﴿إِنْ هَذَا إِلاَّ مَلَكٌ كَرِيمٌ﴾ [يوسف: ٣١]،<\/div><div class=\"tr\">Restriction has [several] methods. Among them are negation and exception, e.g. ﴾This is none but a noble angel﴿ [Yūsuf 12:31].<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>Now the <b>methods<\/b> of restriction. The first, and strongest, is <b>negation and exception<\/b>: a negative particle, then ‎<span class=\"arin\">إلاّ<\/span>‎. The thing restricted to comes after ‎<span class=\"arin\">إلاّ<\/span>‎. In ‎<span class=\"arin\">إِنْ هَذَا إِلاَّ مَلَكٌ كَرِيمٌ<\/span>‎ (the women's words about Yūsuf, peace be upon him), ‎<span class=\"arin\">إِنْ<\/span>‎ is the negative particle: \"This is nothing but a noble angel.\"<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 105<\/span><\/div><div class=\"ar\">ومنها: «إنَّما»، نحو: «إنَّما الفاهم عليّ»،<\/div><div class=\"tr\">Among them is «innamā», e.g. «innamā al-fāhimu ʿAliyyun» (the one who understands is only ʿAlī).<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>The second method is ‎<span class=\"arin\">إنّما<\/span>‎. The thing restricted to comes <b>last<\/b>. ‎<span class=\"arin\">إنَّما الفاهم عليّ<\/span>‎: the one who understands is ʿAlī, and only ʿAlī.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 105<\/span><\/div><div class=\"ar\">ومنها: العطف بـ«لا» أو«بل» أو«لكنْ»، نحو: «أنا ناثر لا ناظم»، و«ما أنا حاسب بل كاتب»،<\/div><div class=\"tr\">Among them is conjunction by «lā», «bal» or «lākin», e.g. «I am a prose-writer, not a poet» and «I am not an accountant, but a scribe».<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>The third method is <b>conjunction<\/b> with ‎<span class=\"arin\">لا<\/span>‎، ‎<span class=\"arin\">بل<\/span>‎ or ‎<span class=\"arin\">لكنْ<\/span>‎. \"I am a prose-writer, <i>not<\/i> a poet\": the restriction is to prose. \"I am not an accountant, <i>but<\/i> a scribe\": the restriction is to being a scribe, the word after ‎<span class=\"arin\">بل<\/span>‎.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 105<\/span><\/div><div class=\"ar\">ومنها: تقديم ما حقّه التأخير، نحو: ﴿إِيَّاكَ نَعْبُدُ﴾ [الفاتحة: ٥].<\/div><div class=\"tr\">Among them is putting first what properly comes later, e.g. ﴾You alone we worship﴿ [al-Fātiḥa 1:5].<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>The fourth method is <b>putting first what should come later<\/b>, which you met in Chapter V. The object ‎<span class=\"arin\">إِيَّاكَ<\/span>‎ normally comes after the verb; putting it first gives \"<i>You alone<\/i> we worship.\" The thing restricted to is the word put first.<\/p><\/div><div class=\"chartbox\"><div class=\"chh\">THE METHODS OF RESTRICTION · DRAWN BY THE COMPANION<\/div><table class=\"grid\"><thead><tr><th>Method<\/th><th>Book's example<\/th><th>Restricted to<\/th><\/tr><\/thead><tbody><tr><td>Negation and exception ‎<span class=\"arin\">النفي والاستثناء<\/span>‎<\/td><td>‎<span class=\"arin\">إِنْ هَذَا إِلاَّ مَلَكٌ كَرِيمٌ<\/span>‎<\/td><td>what follows ‎<span class=\"arin\">إلاّ<\/span>‎<\/td><\/tr><tr><td>‎<span class=\"arin\">إنّما<\/span>‎<\/td><td>‎<span class=\"arin\">إنَّما الفاهم عليّ<\/span>‎<\/td><td>the last word<\/td><\/tr><tr><td>Conjunction ‎<span class=\"arin\">لا<\/span>‎، ‎<span class=\"arin\">بل<\/span>‎، ‎<span class=\"arin\">لكن<\/span>‎<\/td><td>‎<span class=\"arin\">ما أنا حاسب بل كاتب<\/span>‎<\/td><td>what is affirmed<\/td><\/tr><tr><td>Putting first ‎<span class=\"arin\">التقديم<\/span>‎<\/td><td>‎<span class=\"arin\">إِيَّاكَ نَعْبُدُ<\/span>‎<\/td><td>the word put first<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box\"><div class=\"bh\">KEY TERMS AND THEIR MEANINGS · ADDED BY THE COMPANION<\/div><table class=\"terms\"><tr><td class=\"t\">Qaṣr<\/td><td>Restriction: specifying one thing to another by a particular method<\/td><td class=\"a\">القصر<\/td><\/tr><tr><td class=\"t\">Qaṣr ḥaqīqī<\/td><td>Real restriction: according to the actual state of affairs, not in relation to another thing<\/td><td class=\"a\">حقيقيّ<\/td><\/tr><tr><td class=\"t\">Qaṣr iḍāfī<\/td><td>Relative restriction: in relation to a particular thing<\/td><td class=\"a\">الإضافيّ<\/td><\/tr><tr><td class=\"t\">Qaṣr ṣifa ʿalā mawṣūf<\/td><td>Restricting an attribute to a thing described<\/td><td class=\"a\">قصر صفة على موصوف<\/td><\/tr><tr><td class=\"t\">Qaṣr mawṣūf ʿalā ṣifa<\/td><td>Restricting a thing described to an attribute<\/td><td class=\"a\">قصر موصوف على صفة<\/td><\/tr><tr><td class=\"t\">Qaṣr ifrād<\/td><td>Restriction of singling out: when the addressee believes in sharing<\/td><td class=\"a\">قصر إفراد<\/td><\/tr><tr><td class=\"t\">Qaṣr qalb<\/td><td>Restriction of reversal: when the addressee believes the reverse<\/td><td class=\"a\">قصر قلب<\/td><\/tr><tr><td class=\"t\">Qaṣr taʿyīn<\/td><td>Restriction of specification: when the addressee believes one of two, unspecified<\/td><td class=\"a\">قصر تعيين<\/td><\/tr><tr><td class=\"t\">Al-nafy wa-l-istithnāʾ<\/td><td>Negation and exception: a method of restriction<\/td><td class=\"a\">النفي والاستثناء<\/td><\/tr><tr><td class=\"t\">Innamā<\/td><td>A method of restriction<\/td><td class=\"a\">إنّما<\/td><\/tr><tr><td class=\"t\">Al-ʿaṭf bi-lā / bal / lākin<\/td><td>Conjunction by «lā», «bal» or «lākin»: a method of restriction<\/td><td class=\"a\">العطف بـ«لا» أو«بل» أو«لكنْ»<\/td><\/tr><tr><td class=\"t\">Taqdīm mā ḥaqquhu al-taʾkhīr<\/td><td>Putting first what properly comes later: a method of restriction<\/td><td class=\"a\">تقديم ما حقّه التأخير<\/td><\/tr><\/table><\/div><h3>QUESTIONS AND ANSWERS<span class=\"ar\">أسئلة وأجوبة<\/span><\/h3><div class=\"qabox\"><div class=\"qh\">QUESTIONS AND ANSWERS · ADDED BY THE COMPANION<\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>Define <i>qaṣr<\/i>.<\/div><div class=\"a\"><span class=\"k\">A.<\/span>Specifying one thing to another by a particular method.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>What is the difference between real and relative restriction?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>Real restriction is true in reality, against everything; relative restriction is true only in relation to one particular thing, e.g. standing as opposed to sitting.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>Is ‎<span class=\"arin\">ما عليّ إلاّ قائم<\/span>‎ real or relative? Why?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>Relative: it denies sitting, not all his other qualities.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>Which kind is ‎<span class=\"arin\">وَمَا مُحَمَّدٌ إِلاَّ رَسُولٌ<\/span>‎, and what does the book conclude from it?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>Restricting the described to an attribute; so death is possible for him.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>Name the three kinds of relative restriction according to the listener, and say what the listener believes in each.<\/div><div class=\"a\"><span class=\"k\">A.<\/span><i>Ifrād<\/i>: he believes two share it; <i>qalb<\/i>: he believes the reverse; <i>taʿyīn<\/i>: he believes it is one of two without knowing which.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>List the four methods of restriction given in the book.<\/div><div class=\"a\"><span class=\"k\">A.<\/span>Negation and exception; ‎<span class=\"arin\">إنّما<\/span>‎; conjunction with ‎<span class=\"arin\">لا<\/span>‎ or ‎<span class=\"arin\">بل<\/span>‎ or ‎<span class=\"arin\">لكن<\/span>‎; and putting first what properly comes later.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>How does ‎<span class=\"arin\">إِيَّاكَ نَعْبُدُ<\/span>‎ give restriction?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>By putting the object, which normally comes after the verb, first: \"You alone we worship\".<\/div><\/div><\/div>", "terms": [{"t": "Qaṣr", "m": "Restriction: specifying one thing to another by a particular method", "a": "القصر"}, {"t": "Qaṣr ḥaqīqī", "m": "Real restriction: according to the actual state of affairs, not in relation to another thing", "a": "حقيقيّ"}, {"t": "Qaṣr iḍāfī", "m": "Relative restriction: in relation to a particular thing", "a": "الإضافيّ"}, {"t": "Qaṣr ṣifa ʿalā mawṣūf", "m": "Restricting an attribute to a thing described", "a": "قصر صفة على موصوف"}, {"t": "Qaṣr mawṣūf ʿalā ṣifa", "m": "Restricting a thing described to an attribute", "a": "قصر موصوف على صفة"}, {"t": "Qaṣr ifrād", "m": "Restriction of singling out: when the addressee believes in sharing", "a": "قصر إفراد"}, {"t": "Qaṣr qalb", "m": "Restriction of reversal: when the addressee believes the reverse", "a": "قصر قلب"}, {"t": "Qaṣr taʿyīn", "m": "Restriction of specification: when the addressee believes one of two, unspecified", "a": "قصر تعيين"}, {"t": "Al-nafy wa-l-istithnāʾ", "m": "Negation and exception: a method of restriction", "a": "النفي والاستثناء"}, {"t": "Innamā", "m": "A method of restriction", "a": "إنّما"}, {"t": "Al-ʿaṭf bi-lā / bal / lākin", "m": "Conjunction by «lā», «bal» or «lākin»: a method of restriction", "a": "العطف بـ«لا» أو«بل» أو«لكنْ»"}, {"t": "Taqdīm mā ḥaqquhu al-taʾkhīr", "m": "Putting first what properly comes later: a method of restriction", "a": "تقديم ما حقّه التأخير"}], "part": null}, {"num": 9, "title": "Joining and Separating", "ar": "الباب السابع في الوصل والفصل", "body": "<h3>CHAPTER SEVEN: ON JOINING AND SEPARATING<span class=\"ar\">الباب السابع في الوصل والفصل<\/span><\/h3><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 106<\/span><\/div><div class=\"ar\">الوصل عطف جملة على أخرى، والفصل تركه، والكلام هاهنا قاصر على العطف بـ«الواو»؛ لأنّ العطف بغيرها لا يقع فيه اشتباه، ولكلّ من الوصل بها والفصل مواضع.<\/div><div class=\"tr\">Joining (al-waṣl) is the conjoining of one sentence to another, and separating (al-faṣl) is leaving that [conjoining]. The discussion here is limited to conjoining with “wa” (and), because conjoining with other [particles] involves no ambiguity. Each of joining with it and separating has [its own] places.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>This chapter answers a question every writer of Arabic faces: when two sentences come one after the other, do I join them with ‎<span class=\"arin\">و<\/span>‎, or not?<\/p><b>Joining<\/b> (<i>waṣl<\/i>) is linking the second sentence to the first with a conjunction. <b>Separating<\/b> (<i>faṣl<\/i>) is leaving the conjunction out.<p>The book deals only with ‎<span class=\"arin\">و<\/span>‎. Other conjunctions such as ‎<span class=\"arin\">ف<\/span>‎ and ‎<span class=\"arin\">ثم<\/span>‎ carry a clear meaning of their own (order, delay), so there is no doubt about when to use them. But ‎<span class=\"arin\">و<\/span>‎ only means \"and\", so deciding when to use it needs a finer sense, which is why it is a famous topic of <i>balāghah<\/i>.<\/p><\/div><h3>PLACES OF JOINING WITH “WA”<span class=\"ar\">مواضع الوصل بالواو:<\/span><\/h3><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 106<\/span><\/div><div class=\"ar\">يجب الوصل في موضعين:<\/div><div class=\"tr\">Joining is necessary in two places:<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>Joining with ‎<span class=\"arin\">و<\/span>‎ is required in two places.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 106–107<\/span><\/div><div class=\"ar\">الأوّل: إذا اتفقت الجملتان خبراً أو إنشاء، وكان بينهما جهة جامعة، أي: مناسبة تامّة، ولَم يكن مانع من العطف، نحو: ﴿إِنَّ الأَبْرَارَ لَفِي نَعِيْمٍ ○ وَإِنَّ الْفُجَّارَ لَفِي جَحِيمٍ﴾ [الإنفطار: ١٤-١٣]، ونحو: ﴿فَلْيَضْحَكُوْا قَلِيلاً وَّلْيَبْكُوْا كَثِيراً﴾ [التوبة: ٨٢]،<\/div><div class=\"tr\">The first: when the two sentences agree in being statements (khabar) or non-statements (inshāʾ), and there is between them a uniting aspect (jihah jāmiʿah), that is, a complete affinity, and there is no obstacle to conjoining, as in: ﴿Truly the righteous will be in bliss ○ and truly the wicked will be in Hellfire﴾ [al-Infiṭār 82:13–14], and as in: ﴿So let them laugh a little and weep much﴾ [al-Tawbah 9:82].<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Place 1:<\/b> three conditions together: (a) both sentences are of the same type, both <i>khabar<\/i> or both <i>inshāʾ<\/i>; (b) there is a real link of meaning between them (a <i>jihah jāmiʿah<\/i>); and (c) nothing prevents joining them.<p>In the first verse, both sentences are statements, and they are linked by contrast: the righteous and the wicked, bliss and Fire. In the second, both are commands (‎<span class=\"arin\">فَلْيَضْحَكُوْا<\/span>‎ and ‎<span class=\"arin\">وَّلْيَبْكُوْا<\/span>‎), linked by contrast: laughing little, weeping much.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 107–108<\/span><\/div><div class=\"ar\">الثاني: إذا أوهم تركُ العطف خلافَ المقصود، كما إذا قلت: «لا وشفاه الله»، جواباً لِمَن يسألك: «هل برئَ عليّ من الْمَرَض»، فتركُ «الواو» يُوهِم الدعاء عليه، وغرضُك الدعاء له.<\/div><div class=\"tr\">The second: when leaving out the conjunction would give an impression contrary to what is intended, as when you say: “No — and may Allah heal him,” in answer to someone who asks you: “Has ʿAlī recovered from the illness?” For leaving out the “wa” would give the impression of a prayer against him, whereas your aim is a prayer for him.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Place 2:<\/b> when leaving out the ‎<span class=\"arin\">و<\/span>‎ would give the <b>wrong meaning<\/b>. This is a famous example. Someone asks, \"Has ʿAlī recovered?\" and you want to say \"No\" and then pray for him.<p>If you say ‎<span class=\"arin\">لا شفاه الله<\/span>‎ without ‎<span class=\"arin\">و<\/span>‎, it sounds like \"May Allah <i>not<\/i> heal him\", a prayer against him. Adding ‎<span class=\"arin\">و<\/span>‎ separates the \"No\" from the prayer: ‎<span class=\"arin\">لا وشفاه الله<\/span>‎, \"No, and may Allah heal him.\"<\/p><p>Note the two parts here are of different types (\"No\" stands for a statement; the prayer is an <i>inshāʾ<\/i>), which would normally call for separation; but the risk of the wrong meaning makes joining necessary.<\/p><\/div><div class=\"chartbox\"><div class=\"chh\">WHEN JOINING IS REQUIRED · DRAWN BY THE COMPANION<\/div><table class=\"grid\"><thead><tr><th>Place<\/th><th>Condition<\/th><th>Book's example<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>same type (khabar/inshāʾ), a real link, nothing preventing<\/td><td>‎<span class=\"arin\">إِنَّ الأَبْرَارَ لَفِي نَعِيْمٍ ○ وَإِنَّ الْفُجَّارَ لَفِي جَحِيمٍ<\/span>‎<\/td><\/tr><tr><td>2<\/td><td>leaving it out would give the wrong meaning<\/td><td>‎<span class=\"arin\">لا وشفاه الله<\/span>‎<\/td><\/tr><\/tbody><\/table><\/div><h3>PLACES OF SEPARATING<span class=\"ar\">مواضع الفصل:<\/span><\/h3><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 108<\/span><\/div><div class=\"ar\">يجب الفصل في خمسة مواضع:<\/div><div class=\"tr\">Separating is necessary in five places:<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>Separation, leaving out ‎<span class=\"arin\">و<\/span>‎, is required in five places. Each has a special name, worth learning, that describes how the two sentences relate.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 108<\/span><\/div><div class=\"ar\">الأوّل: أن يكون بين الجملتين اتّحاد تامّ؛ بأن تكون الثانية بدلاً من الأولى، نحو: ﴿أَمَدَّكُم بِمَا تَعْلَمُونَ ○ أَمَدَّكُم بِأَنْعَامٍ وَبَنِينَ﴾ [الشعراء: ١٣٣-١٣٢]،<\/div><div class=\"tr\">The first: that there be complete unity between the two sentences, in that the second is a substitute (badal) for the first, as in: ﴿He has provided you with what you know ○ He has provided you with cattle and sons﴾ [al-Shuʿarāʾ 26:132–133];<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Place 1: complete unity.<\/b> The two sentences are so closely one that joining them with \"and\" would wrongly suggest two different things. You do not join a thing to itself.<p>The first way: the second sentence is a <b>substitute<\/b> (<i>badal<\/i>) for the first. \"He provided you with what you know\" is general; \"He provided you with cattle and sons\" says the same thing in detail.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 109<\/span><\/div><div class=\"ar\">أو بأن تكون بياناً لَها، نحو: ﴿فَوَسْوَسَ إِلَيْهِ الشَّيْطَانُ قَالَ يَا آدَمُ هَلْ أَدُلُّكَ عَلَى شَجَرَةِ الْخُلْدِ﴾ [طه: ١٢٠]،<\/div><div class=\"tr\">or in that it is an explanation (bayān) of it, as in: ﴿Then Satan whispered to him; he said: “O Ādam, shall I direct you to the tree of eternity?”﴾ [Ṭā Hā 20:120];<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>The second way: the second sentence <b>explains<\/b> the first (<i>bayān<\/i>). \"Satan whispered to him\": what did he whisper? \"He said: O Ādam, shall I direct you…\" The second sentence tells you what the whispering was.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 109<\/span><\/div><div class=\"ar\">أو بأن تكون مؤكِّدة لَها، نحو: ﴿فَمَهِّلِ الْكَافِرِينَ أَمْهِلْهُمْ رُوَيْداً﴾ [الطارق: ١٧]، ويقال في هذا الموضِع إنّ بين الجملتين كمالَ الاتصال.<\/div><div class=\"tr\">or in that it is a corroboration (muʾakkidah) of it, as in: ﴿So give respite to the disbelievers; give them respite for a little while﴾ [al-Ṭāriq 86:17]. In this place it is said that between the two sentences there is perfect connection (kamāl al-ittiṣāl).<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>The third way: the second sentence <b>confirms<\/b> the first (<i>taʾkīd<\/i>). ‎<span class=\"arin\">أَمْهِلْهُمْ رُوَيْداً<\/span>‎ repeats the meaning of ‎<span class=\"arin\">فَمَهِّلِ الْكَافِرِينَ<\/span>‎ to reinforce it.<\/p><p>The name for this place is <b>perfect connection<\/b> (<i>kamāl al-ittiṣāl<\/i>).<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 109–110<\/span><\/div><div class=\"ar\">الثاني: أن يكون بين الجملتين تبائن تامّ بأن يختلفا خبراً وإنشاء كقوله:<span class=\"bayt\"><span class=\"h1\">وَقَالَ رَائِدُهُمْ أَرْسُوْا نُزَاوِلُهَا<\/span><span class=\"h2\">فَحَتْفُ كُلِّ امْرِئٍ يَجْرِيْ بِمِقْدَارِ<\/span><\/span><\/div><div class=\"tr\">The second: that there be complete divergence (tabāyun tāmm) between the two sentences, in that they differ as statement and non-statement, as in the poet’s saying:<br>Their forerunner said: “Stand firm — we shall take it on; / for every man’s death runs according to a measure.”<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Place 2: complete difference<\/b>, the opposite case: the sentences are too far apart to be joined. The first way: one is a <i>khabar<\/i> and the other an <i>inshāʾ<\/i>.<p>In the line, ‎<span class=\"arin\">أَرْسُوْا<\/span>‎ (\"stand firm\") is a command, an <i>inshāʾ<\/i>; ‎<span class=\"arin\">نُزَاوِلُهَا<\/span>‎ (\"we will take it on\") is a statement. So no ‎<span class=\"arin\">و<\/span>‎ joins them.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 110<\/span><\/div><div class=\"ar\">أو بأن لا يكون بينهما مناسبةٌ في المعنى، كقولك: «عليّ كاتب، الحمام طائر»؛ فإنّه لا مناسبة في المعنى بين كتابة عليّ وطيران الحمام، ويقال في هذا الموضع إنّ بين الجملتين كمالَ الانقطاع.<\/div><div class=\"tr\">or in that there is no affinity in meaning between them, as in your saying: “ʿAlī is a writer; the pigeon is a flier”; for there is no affinity in meaning between ʿAlī’s writing and the pigeon’s flying. In this place it is said that between the two sentences there is perfect separation (kamāl al-inqiṭāʿ).<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>The second way: there is <b>no link of meaning<\/b> at all. \"ʿAlī is a writer\" and \"the pigeon is a flier\" have nothing to do with each other, so joining them with \"and\" would be meaningless.<\/p><p>The name for this place is <b>perfect separation<\/b> (<i>kamāl al-inqiṭāʿ<\/i>).<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 111<\/span><\/div><div class=\"ar\">الثالث: كون الجملة الثانية جواباً عن سؤال نشأ من الجملة الأولى، كقوله:<span class=\"bayt\"><span class=\"h1\">زَعَمَ العَوَاذِلُ أَنَّنِيْ فِيْ غَمْرَةٍ<\/span><span class=\"h2\">صَدَقُوْا وَلَكِنَّ غَمْرَتِيْ لاَ تَنْجَلِيْ<\/span><\/span>كأنّه قيل: «أصدقوا في زعمهم أم كذبوا؟» فقال: «صدقوا»، ويقال بين الجملتين شبه كمال الاتّصال.<\/div><div class=\"tr\">The third: the second sentence being an answer to a question that arises from the first sentence, as in the poet’s saying:<br>The blamers claimed that I am in a flood [of distress]. / They spoke the truth — but my flood does not clear away.<br>It is as though it were asked: “Did they speak the truth in their claim, or did they lie?” and he said: “They spoke the truth.” Between the two sentences it is said there is a semblance of perfect connection (shibh kamāl al-ittiṣāl).<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Place 3:<\/b> the second sentence <b>answers a question<\/b> that the first one raises in the listener's mind. The poet says the blamers claim he is drowning in distress. The listener naturally asks: were they right? The poet answers straight away: ‎<span class=\"arin\">صَدَقُوْا<\/span>‎, \"they were right\". An answer is not joined to its question with \"and\", so there is no ‎<span class=\"arin\">و<\/span>‎.<p>Because this is like the close link in Place 1, it is called a <b>semblance of perfect connection<\/b> (<i>shibh kamāl al-ittiṣāl<\/i>).<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 111–112<\/span><\/div><div class=\"ar\">الرابع: أن تسبق جملة بجملتين يصحّ عطفها على إحديهما؛ لوجود المناسبة، وفي عطفها على الأخرى فساد، فيترك العطف دفعاً للوهم، كقوله:<span class=\"bayt\"><span class=\"h1\">وَتَظُنُّ سَلْمَى أَنَّنِيْ أَبْغِيْ بِهَا<\/span><span class=\"h2\">بَدَلاً أُرَاهَا فِيْ الضَلاَلِ تَهِيْمُ<\/span><\/span><\/div><div class=\"tr\">The fourth: that a sentence be preceded by two sentences, such that conjoining it to one of them is valid because affinity is present, while conjoining it to the other would cause corruption [of meaning]; so the conjunction is left out to ward off the misconception, as in the poet’s saying:<br>Salmā thinks that I seek in her place / a substitute — I think her wandering in error.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Place 4:<\/b> a third sentence could properly be joined to the first of two earlier sentences, but joining it would make the listener think it belongs with the second, which would change the meaning. So the ‎<span class=\"arin\">و<\/span>‎ is left out to avoid the confusion.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 112–113<\/span><\/div><div class=\"ar\">فجملة «أراها» يصحّ عطفها على «تظنّ»، لكن يمنع من هذا توهّم العطف على جملة «أبغي بها»، فتكون الجملة الثالثة من مظنونات سلمى مع أنّه ليس مراداً، ويقال بين الجملتين في هذا الموضع شبه كمال الانقطاع.<\/div><div class=\"tr\">The sentence “I think her” (arāhā) may validly be conjoined to “thinks” (taẓunnu); but what prevents this is the misconception that it is conjoined to the sentence “I seek in her place”, so that the third sentence would be among the things Salmā thinks — although that is not intended. In this place it is said that between the two sentences there is a semblance of perfect separation (shibh kamāl al-inqiṭāʿ).<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>Look at the three sentences in the line: (1) ‎<span class=\"arin\">تَظُنُّ سَلْمَى<\/span>‎ (Salmā thinks), (2) ‎<span class=\"arin\">أَنَّنِيْ أَبْغِيْ بِهَا بَدَلاً<\/span>‎ (that I seek a substitute for her), (3) ‎<span class=\"arin\">أُرَاهَا فِيْ الضَلاَلِ تَهِيْمُ<\/span>‎ (I think she is wandering in error).<\/p><p>Sentence 3 is the poet's own opinion, a reply to sentence 1. But if he said \"<i>and<\/i> I think her…\", the listener could take it as joined to sentence 2, as if it were also something <i>Salmā<\/i> thinks. To prevent that, there is no ‎<span class=\"arin\">و<\/span>‎.<\/p><p>This is called a <b>semblance of perfect separation<\/b> (<i>shibh kamāl al-inqiṭāʿ<\/i>): joining is possible in itself, but it is blocked as if the sentences were completely apart.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 113<\/span><\/div><div class=\"ar\">الخامس: أن لا يقصد تشريك الجملتين في الحكم لقيام مانع، كقوله تعالى: ﴿وَإِذَا خَلَوا إِلَى شَيَاطِينِهِمْ قَالُوا إِنَّا مَعَكُمْ إِنَّمَا نَحْنُ مُسْتَهْزِئُونَ ○ اللهُ يَسْتَهْزِئُ بِهِم﴾ [البقرة: ١٥-١٤]؛<\/div><div class=\"tr\">The fifth: that it is not intended to make the two sentences share in the ruling, because an obstacle is present, as in His words, Exalted is He: ﴿And when they are alone with their devils, they say: “We are with you; we were only mocking.” ○ Allah mocks them﴾ [al-Baqarah 2:14–15].<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Place 5:<\/b> the sentences are not meant to share the same ruling, because something prevents it. The verse quotes the hypocrites' words to their devils, then says ‎<span class=\"arin\">اللهُ يَسْتَهْزِئُ بِهِم<\/span>‎, \"Allah mocks them\", with no ‎<span class=\"arin\">و<\/span>‎.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 113–114<\/span><\/div><div class=\"ar\">فجملة «الله يستهزئ بهم» لا يصحّ عطفها على «إنّا معكم»؛ لاقتضائه أنّه من مقولهم، ولا على جملة «قالوا»؛ لاقتضائه أنّ استهزاء الله تعالى بهم مقيّد بحال خلوّهم إلى شياطينهم، ويقال بين الجملتين في هذا الموضع توسّط بين الكمالين.<\/div><div class=\"tr\">For the sentence “Allah mocks them” cannot validly be conjoined to “We are with you”, because that would require it to be part of what they said; nor to the sentence “they say”, because that would require Allah’s mocking them, Exalted is He, to be restricted to the state of their being alone with their devils. In this place it is said that between the two sentences there is a middle state between the two perfections (tawassuṭ bayn al-kamālayn).<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>Why no ‎<span class=\"arin\">و<\/span>‎? There are two sentences it could be joined to, and both give a wrong meaning:<\/p><p>Joined to ‎<span class=\"arin\">إِنَّا مَعَكُمْ<\/span>‎, it would become part of what the hypocrites <i>said<\/i>, which is impossible.<\/p><p>Joined to ‎<span class=\"arin\">قَالُوا<\/span>‎, it would share that verb's condition ‎<span class=\"arin\">إِذَا خَلَوا<\/span>‎, so Allah would mock them only <i>when they are alone with their devils<\/i>. But His mocking them is not limited to that time.<\/p><p>The sentences have some link, but it is neither perfect connection nor perfect separation; so it is called a <b>middle state between the two perfections<\/b> (<i>tawassuṭ bayn al-kamālayn<\/i>).<\/p><\/div><div class=\"chartbox\"><div class=\"chh\">THE FIVE PLACES OF SEPARATION · DRAWN BY THE COMPANION<\/div><table class=\"grid\"><thead><tr><th>Place<\/th><th>Name<\/th><th>Book's example<\/th><\/tr><\/thead><tbody><tr><td>1. Complete unity: badal, bayān, taʾkīd<\/td><td>Kamāl al-ittiṣāl ‎<span class=\"arin\">كمال الاتّصال<\/span>‎<\/td><td>‎<span class=\"arin\">فَمَهِّلِ الْكَافِرِينَ أَمْهِلْهُمْ رُوَيْداً<\/span>‎<\/td><\/tr><tr><td>2. Complete difference: khabar/inshāʾ, or no link<\/td><td>Kamāl al-inqiṭāʿ ‎<span class=\"arin\">كمال الانقطاع<\/span>‎<\/td><td>‎<span class=\"arin\">عليّ كاتب، الحمام طائر<\/span>‎<\/td><\/tr><tr><td>3. Answer to an implied question<\/td><td>Shibh kamāl al-ittiṣāl ‎<span class=\"arin\">شبه كمال الاتّصال<\/span>‎<\/td><td>‎<span class=\"arin\">صَدَقُوْا وَلَكِنَّ غَمْرَتِيْ<\/span>‎<\/td><\/tr><tr><td>4. Joining would mislead<\/td><td>Shibh kamāl al-inqiṭāʿ ‎<span class=\"arin\">شبه كمال الانقطاع<\/span>‎<\/td><td>‎<span class=\"arin\">أُرَاهَا فِيْ الضَلاَلِ تَهِيْمُ<\/span>‎<\/td><\/tr><tr><td>5. Not meant to share the ruling<\/td><td>Tawassuṭ bayn al-kamālayn ‎<span class=\"arin\">توسّط بين الكمالين<\/span>‎<\/td><td>‎<span class=\"arin\">اللهُ يَسْتَهْزِئُ بِهِم<\/span>‎<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box\"><div class=\"bh\">KEY TERMS AND THEIR MEANINGS · ADDED BY THE COMPANION<\/div><table class=\"terms\"><tr><td class=\"t\">Waṣl<\/td><td>Joining: conjoining one sentence to another (here with “wa”)<\/td><td class=\"a\">الوصل<\/td><\/tr><tr><td class=\"t\">Faṣl<\/td><td>Separating: leaving out that conjoining<\/td><td class=\"a\">الفصل<\/td><\/tr><tr><td class=\"t\">Jihah jāmiʿah<\/td><td>Uniting aspect: a complete affinity between the two sentences<\/td><td class=\"a\">جهة جامعة<\/td><\/tr><tr><td class=\"t\">Badal<\/td><td>Substitute: a second sentence that fully conveys what the first gave in summary<\/td><td class=\"a\">بدل<\/td><\/tr><tr><td class=\"t\">Bayān<\/td><td>Explanation: a second sentence that removes obscurity in the first<\/td><td class=\"a\">بيان<\/td><\/tr><tr><td class=\"t\">Taʾkīd<\/td><td>Corroboration: a second sentence that confirms the first<\/td><td class=\"a\">تأكيد<\/td><\/tr><tr><td class=\"t\">Kamāl al-ittiṣāl<\/td><td>Perfect connection between two sentences<\/td><td class=\"a\">كمال الاتصال<\/td><\/tr><tr><td class=\"t\">Kamāl al-inqiṭāʿ<\/td><td>Perfect separation between two sentences<\/td><td class=\"a\">كمال الانقطاع<\/td><\/tr><tr><td class=\"t\">Shibh kamāl al-ittiṣāl<\/td><td>Semblance of perfect connection (answer to an implied question)<\/td><td class=\"a\">شبه كمال الاتّصال<\/td><\/tr><tr><td class=\"t\">Shibh kamāl al-inqiṭāʿ<\/td><td>Semblance of perfect separation (conjoining would mislead)<\/td><td class=\"a\">شبه كمال الانقطاع<\/td><\/tr><tr><td class=\"t\">Tawassuṭ bayn al-kamālayn<\/td><td>Middle state between the two perfections<\/td><td class=\"a\">توسّط بين الكمالين<\/td><\/tr><\/table><\/div><h3>QUESTIONS AND ANSWERS<span class=\"ar\">أسئلة وأجوبة<\/span><\/h3><div class=\"qabox\"><div class=\"qh\">QUESTIONS AND ANSWERS · ADDED BY THE COMPANION<\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>Define <i>waṣl<\/i> and <i>faṣl<\/i>. Why does the book discuss only ‎<span class=\"arin\">و<\/span>‎?<\/div><div class=\"a\"><span class=\"k\">A.<\/span><i>Waṣl<\/i> is joining one sentence to another; <i>faṣl<\/i> is leaving that out. Only ‎<span class=\"arin\">و<\/span>‎ is discussed because joining with other particles involves no ambiguity.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>What three conditions make joining with ‎<span class=\"arin\">و<\/span>‎ necessary in the first place of joining?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>The two sentences agree in being <i>khabar<\/i> or <i>inshāʾ<\/i>, there is a uniting aspect between them, and nothing prevents joining.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>Why must you say ‎<span class=\"arin\">لا وشفاه الله<\/span>‎ with ‎<span class=\"arin\">و<\/span>‎?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>Without it, the words would sound like a prayer against the sick man, whereas the aim is a prayer for him.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>Name the three ways the second sentence can be completely one with the first, with an example of one.<\/div><div class=\"a\"><span class=\"k\">A.<\/span>As a <i>badal<\/i>, a <i>bayān<\/i>, or a <i>taʾkīd<\/i>; e.g. ‎<span class=\"arin\">أَمْهِلْهُمْ رُوَيْداً<\/span>‎ confirms ‎<span class=\"arin\">فَمَهِّلِ الْكَافِرِينَ<\/span>‎.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>What is <i>kamāl al-inqiṭāʿ<\/i>, and what are its two forms?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>Perfect separation: the sentences differ as <i>khabar<\/i> and <i>inshāʾ<\/i>, or there is no link of meaning between them.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>Explain the <i>faṣl<\/i> in ‎<span class=\"arin\">زَعَمَ العَوَاذِلُ أَنَّنِيْ فِيْ غَمْرَةٍ ... صَدَقُوْا<\/span>‎.<\/div><div class=\"a\"><span class=\"k\">A.<\/span>The second sentence answers the question raised by the first (\"were they right?\"); this is <i>shibh kamāl al-ittiṣāl<\/i>.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>In the line about Salmā, why is ‎<span class=\"arin\">أُرَاهَا<\/span>‎ not joined with ‎<span class=\"arin\">و<\/span>‎?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>Joining it might make it seem joined to ‎<span class=\"arin\">أَبْغِيْ بِهَا<\/span>‎, making it part of what Salmā thinks; this is <i>shibh kamāl al-inqiṭāʿ<\/i>.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>Why can ‎<span class=\"arin\">اللهُ يَسْتَهْزِئُ بِهِم<\/span>‎ not be joined to ‎<span class=\"arin\">قَالُوا<\/span>‎?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>Because it would then be limited to the time when they are alone with their devils, which is not intended.<\/div><\/div><\/div>", "terms": [{"t": "Waṣl", "m": "Joining: conjoining one sentence to another (here with “wa”)", "a": "الوصل"}, {"t": "Faṣl", "m": "Separating: leaving out that conjoining", "a": "الفصل"}, {"t": "Jihah jāmiʿah", "m": "Uniting aspect: a complete affinity between the two sentences", "a": "جهة جامعة"}, {"t": "Badal", "m": "Substitute: a second sentence that fully conveys what the first gave in summary", "a": "بدل"}, {"t": "Bayān", "m": "Explanation: a second sentence that removes obscurity in the first", "a": "بيان"}, {"t": "Taʾkīd", "m": "Corroboration: a second sentence that confirms the first", "a": "تأكيد"}, {"t": "Kamāl al-ittiṣāl", "m": "Perfect connection between two sentences", "a": "كمال الاتصال"}, {"t": "Kamāl al-inqiṭāʿ", "m": "Perfect separation between two sentences", "a": "كمال الانقطاع"}, {"t": "Shibh kamāl al-ittiṣāl", "m": "Semblance of perfect connection (answer to an implied question)", "a": "شبه كمال الاتّصال"}, {"t": "Shibh kamāl al-inqiṭāʿ", "m": "Semblance of perfect separation (conjoining would mislead)", "a": "شبه كمال الانقطاع"}, {"t": "Tawassuṭ bayn al-kamālayn", "m": "Middle state between the two perfections", "a": "توسّط بين الكمالين"}], "part": null}, {"num": 10, "title": "Brevity, Expansion and Equality", "ar": "الباب الثامن في الإيجاز والإطناب والمساواة", "body": "<h3>CHAPTER EIGHT: ON BREVITY, EXPANSION AND EQUALITY<span class=\"ar\">الباب الثامن في الإيجاز والإطناب والمساواة<\/span><\/h3><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 115<\/span><\/div><div class=\"ar\">كلّ ما يجول في الصدر من المعاني يمكن أن يعبّر عنه بثلاث طرق:<\/div><div class=\"tr\">Every meaning that moves about in the breast can be expressed in three ways:<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>Any idea in your mind can be put into words in three ways: in exactly as many words as it needs, in fewer, or in more. This chapter names the three and shows when each one is right.<\/p><\/div><div class=\"chartbox\"><div class=\"chh\">THREE WAYS TO EXPRESS A MEANING · DRAWN BY THE COMPANION<\/div><table class=\"grid\"><thead><tr><th>Way<\/th><th>The words are…<\/th><th>If done badly it becomes…<\/th><\/tr><\/thead><tbody><tr><td>Musāwāt ‎<span class=\"arin\">المساواة<\/span>‎<\/td><td>equal to the meaning<\/td><td>—<\/td><\/tr><tr><td>Ījāz ‎<span class=\"arin\">الإيجاز<\/span>‎<\/td><td>fewer than the meaning, yet enough<\/td><td>Ikhlāl ‎<span class=\"arin\">الإخلال<\/span>‎: not enough<\/td><\/tr><tr><td>Iṭnāb ‎<span class=\"arin\">الإطناب<\/span>‎<\/td><td>more than the meaning, with a benefit<\/td><td>Taṭwīl ‎<span class=\"arin\">التطويل<\/span>‎ or Ḥashw ‎<span class=\"arin\">الحشو<\/span>‎: no benefit<\/td><\/tr><\/tbody><\/table><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 115<\/span><\/div><div class=\"ar\">(١) المساواة: وهي تأدية المعنى المراد بعبارة مساوية بأن تكون على الحدّ الذي جرى به عرف أوساط الناس، وهم الذين لَم يرتقوا إلى درجة البلاغة، ولَم ينحطّوا إلى درجة الفهاهة، نحو: ﴿وَإِذَا رَأَيْتَ الَّذِينَ يَخُوضُونَ فِي آيَاتِنَا فَأَعْرِضْ عَنْهُمْ﴾ [الأنعام: ٦٨].<\/div><div class=\"tr\">(1) Equality (musāwāt): it is conveying the intended meaning in an equal expression, in that it is at the limit which the custom of the middling people has followed; they are those who have neither risen to the rank of eloquence (balāgha) nor sunk to the rank of inarticulacy (fahāha). E.g. ﴿And when you see those who plunge into Our signs, turn away from them﴾ [al-Anʿām 6:68].<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Equality<\/b> (<i>musāwāt<\/i>): the words exactly match the meaning, in the way ordinary people speak. The book defines \"ordinary people\" carefully: those who have not reached the level of <i>balāghah<\/i>, but have not sunk to being unable to express themselves either.<p>In the verse, every word is needed and nothing extra is added: when you see them mocking Our signs, turn away from them.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 116<\/span><\/div><div class=\"ar\">(٢) والإيجاز: وهو تأدية المعنى بعبارة ناقصة عنه مع وفائها بالغرض نحو:<span class=\"bayt\"><span class=\"h1\">قِفَانَبْكِ مِنْ ذِكْرَى حَبِيْبٍ وَمَنْزِلِ<\/span><span class=\"h2\"><\/span><\/span><\/div><div class=\"tr\">(2) Brevity (ījāz): it is conveying the meaning in an expression that falls short of it, while fully meeting the purpose; e.g.: “Stop, let us weep at the remembrance of a beloved and a dwelling”.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Brevity<\/b> (<i>ījāz<\/i>): fewer words than the meaning would normally need, yet still enough to convey it fully.<p>The famous opening of Imruʾ al-Qays: in a few words, ‎<span class=\"arin\">قِفَانَبْكِ<\/span>‎, \"stop, let us weep\", he asks his companions to halt and weep with him, at the memory of the one he loved and the place where she lived. A whole scene in half a line.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 116–117<\/span><\/div><div class=\"ar\">فإذا لَم تَفِ بالغرض سُمّي «إخلالاً»، كقوله:<span class=\"bayt\"><span class=\"h1\">وَالعَيْشُ خَيْرٌ فِيْ ظِلاَ<\/span><span class=\"h2\">لِ النُوْكِ مِمَّنْ عَاشَ كِدًّا<\/span><\/span>مراده أنّ العيش الرغد في ظلال الحمق، خير من العيش الشاقّ في ظلال العقل.<\/div><div class=\"tr\">If it does not meet the purpose, it is called “deficiency” (ikhlāl), as in the poet’s words: “Living in the shades of foolishness is better than [the living of] one who lives in toil.” What he means is that comfortable living in the shades of foolishness is better than hard living in the shades of intelligence.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>If the words are too few to make the meaning clear, it is not brevity but a <b>fault<\/b>: <b>deficiency<\/b> (<i>ikhlāl<\/i>).<\/p><p>The poet meant: a <i>comfortable<\/i> life in foolishness is better than a <i>hard<\/i> life in intelligence. But his words leave out \"comfortable\" and \"in intelligence\", and nothing in the line points to them, so the listener cannot reach his meaning.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 117<\/span><\/div><div class=\"ar\">(٣) والإطناب وهو تأدية المعنى بعبارة زائدة عنه مع الفائدة، نحو: ﴿قَالَ رَبِّ إِنِّي وَهَنَ الْعَظْمُ مِنِّي وَاشْتَعَلَ الرَّأْسُ شَيْباً﴾ [مريم: ٤]، أي: كبرت،<\/div><div class=\"tr\">(3) Expansion (iṭnāb): it is conveying the meaning in an expression exceeding it, with benefit; e.g. ﴿He said: My Lord, indeed the bone has grown feeble within me, and the head has blazed with grey hair﴾ [Maryam 19:4], i.e. “I have grown old”.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Expansion<\/b> (<i>iṭnāb<\/i>): more words than the meaning needs, but with a <b>benefit<\/b>.<p>Zakariyyā (peace be upon him) could have said \"I have grown old\". Instead he describes it: my bones have grown weak, my head has blazed with grey hair. The extra words paint his weakness vividly, which suits his humble request to his Lord.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 117<\/span><\/div><div class=\"ar\">فإذا لَم تكن في الزيادة فائدة سُمّي «تطويلاً» إن كانت الزيادة غير متعيّنة و«حشواً» إن تعيّنت.<\/div><div class=\"tr\">If there is no benefit in the addition, it is called “prolixity” (taṭwīl) if the addition is not specified, and “padding” (ḥashw) if it is specified.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>If the extra words bring <b>no benefit<\/b>, it is a fault, and it has two names depending on whether you can point to the extra word:<\/p><b>Taṭwīl<\/b> (prolixity): something is extra, but you cannot say which word is the extra one. <b>Ḥashw<\/b> (padding): you can point to exactly which word is extra.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 117<\/span><\/div><div class=\"ar\">فالتطويل، نحو:<span class=\"bayt\"><span class=\"h1\"><\/span><span class=\"h2\">وَأَلْفَى قَوْلَهَا كِذْباً وَمَيْناً<\/span><\/span><\/div><div class=\"tr\">Prolixity, e.g.: “…and he found her words to be a lie and a falsehood (mayn)”.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>‎<span class=\"arin\">كِذْباً<\/span>‎ and ‎<span class=\"arin\">مَيْناً<\/span>‎ both mean \"lie\". One of them is extra, but which one? Either could be removed. So this is <b>taṭwīl<\/b>.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 118<\/span><\/div><div class=\"ar\">والحشو، نحو:<span class=\"bayt\"><span class=\"h1\"><\/span><span class=\"h2\">وَأَعْلَمُ عِلْمَ اليَوْمِ وَالأَمْسِ قَبْلَهُ<\/span><\/span><\/div><div class=\"tr\">Padding, e.g.: “And I know the knowledge of today, and of yesterday before it”.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>\"The knowledge of today and of yesterday <i>before it<\/i>\": everyone knows yesterday comes before today, so ‎<span class=\"arin\">قَبْلَهُ<\/span>‎ is clearly the extra word. Because it can be pointed to, this is <b>ḥashw<\/b>.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 118<\/span><\/div><div class=\"ar\">ومن دواعي الإيجاز: تسهيل الحفظ، وتقريب الفهم، وضيق المقام، والإخفاء، وسأمة المحادثة،<\/div><div class=\"tr\">Among the motives of brevity are: making memorisation easy, bringing understanding near, narrowness of the occasion, concealment, and weariness of conversation.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>Why would a speaker choose brevity? The book lists some motives: to make the words <b>easy to memorise<\/b> (like proverbs); to make them <b>easy to understand<\/b>; because the <b>situation is too pressing<\/b> for length; to <b>hide<\/b> something from others; or because the conversation has become <b>tiresome<\/b>.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 118–119<\/span><\/div><div class=\"ar\">ومن دواعي الإطناب: تثبيت المعنى، وتوضيح المراد، والتوكيد، ودفع الإيهام.<\/div><div class=\"tr\">Among the motives of expansion are: establishing the meaning, clarifying what is meant, emphasis, and warding off a false impression.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>And why choose expansion? To <b>fix the meaning firmly<\/b> in the mind; to <b>make the intended meaning clear<\/b>; for <b>emphasis<\/b>; and to <b>prevent a wrong impression<\/b>.<\/p><\/div><h3>DIVISIONS OF BREVITY<span class=\"ar\">أقسام الإيجاز<\/span><\/h3><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 120<\/span><\/div><div class=\"ar\">الإيجاز: إمّا أن يكون بتضمّن العبارة القصيرة معانِيَ كثيرةً، وهو مركز عناية البلغاء، وبه تتفاوت أقدارهم، ويسمّى «إيجازَ قصر»، نحو قوله تعالى: ﴿وَلَكُمْ فِي الْقِصَاصِ حَيَاةٌ﴾ [البقرة: ١٧٩].<\/div><div class=\"tr\">Brevity is either by a short expression containing many meanings, and this is the focal point of the eloquent’s attention, and by it their ranks differ; it is called “brevity of shortness” (ījāz qiṣar); e.g. the words of Allah Most High: ﴿And for you in retaliation (qiṣāṣ) there is life﴾ [al-Baqara 2:179].<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>Brevity has two kinds. The first is <b>ījāz qiṣar<\/b>: short words that hold <b>many meanings<\/b>, with nothing left out. The book calls it the main concern of the eloquent, the skill by which they are ranked.<\/p><p>‎<span class=\"arin\">وَلَكُمْ فِي الْقِصَاصِ حَيَاةٌ<\/span>‎: just four words, yet they contain a whole argument. When people know that a killer will be killed in return, they hold back from killing; so the law of retaliation, which seems to be about death, actually preserves life.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 120–121<\/span><\/div><div class=\"ar\">وإمّا أن يكون بحذف كلمة أو جملة أو أكثرَ مع قرينة تُعيِّن المحذوف، ويسمّى «إيجازَ حذف»؛ فحذف الكلمة كحذف «لا» في قول امراء القيس:<span class=\"bayt\"><span class=\"h1\">فَقُلْتُ يَمِيْنُ اللهِ أَبْرَحُ قَاعِداً<\/span><span class=\"h2\">وَلَوْ قَطَعُوْا رَأسِيْ لَدَيْكَ وَأَوْصَالِيْ<\/span><\/span><\/div><div class=\"tr\">Or it is by omitting a word, or a sentence, or more, with a contextual indication (qarīna) that specifies what is omitted; it is called “brevity of omission” (ījāz ḥadhf). Omitting a word is like the omission of «lā» in the words of Imruʾ al-Qays: “So I said: By the oath of Allah, I shall [not] cease to stay sitting, even if they cut off my head and my limbs beside you.”<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>The second kind is <b>ījāz ḥadhf<\/b>: brevity by <b>leaving something out<\/b>, a word, a sentence or more, with a clue that shows what is missing.<\/p><b>A word left out:<\/b> Imruʾ al-Qays says ‎<span class=\"arin\">يَمِيْنُ اللهِ أَبْرَحُ قَاعِداً<\/span>‎, meaning ‎<span class=\"arin\">لا أبرح<\/span>‎, \"I will <i>not<\/i> stop sitting\". The ‎<span class=\"arin\">لا<\/span>‎ is dropped; in an oath of this kind the meaning makes it clear.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 121<\/span><\/div><div class=\"ar\">وحذف الجملة، كقوله تعالى: ﴿وَإِن يُكَذِّبُوكَ فَقَدْ كُذِّبَتْ رُسُلٌ مِّن قَبْلِكَ﴾ [فاطر: ٤]، أي: فَتَأَسَّ واصبر،<\/div><div class=\"tr\">Omitting a sentence, as in the words of Allah Most High: ﴿And if they deny you, then messengers before you were denied﴾ [Fāṭir 35:4], i.e. “then take comfort, and be patient”.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>A sentence left out:<\/b> \"If they deny you, then messengers before you were denied.\" The real answer to \"if they deny you\" is left out: <i>then take comfort and be patient<\/i>. What is said instead gives the reason for that patience.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 121<\/span><\/div><div class=\"ar\">وحذف الأكثر، نحو قوله تعالى: ﴿فَأَرْسِلُونِ ۝ يُوسُفُ أَيُّهَا الصِّدِّيقُ﴾ [يوسف: ٤٥-٤٦]، أي: أرسلوني إلى يوسف؛ لاستعبره الرؤيا، ففعلوا، فأتاه، وقال له: «يا يوسف».<\/div><div class=\"tr\">Omitting more [than a sentence], e.g. the words of Allah Most High: ﴿So send me. ۝ Yūsuf, O man of truth﴾ [Yūsuf 12:45–46], i.e. “Send me to Yūsuf so that I may ask him to interpret the dream”; so they did, and he came to him and said to him, “O Yūsuf”.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>More than a sentence left out:<\/b> between \"So send me\" and \"Yūsuf, O man of truth\" a whole series of events is skipped: send me to Yūsuf so I can ask him about the dream; they sent him; he came to Yūsuf; he said to him… The listener supplies all of it.<\/div><div class=\"chartbox\"><div class=\"chh\">THE KINDS OF ĪJĀZ · DRAWN BY THE COMPANION<\/div><div class=\"tree\"><div class=\"node\">Ījāz<span class=\"ar\">الإيجاز<\/span><\/div><div class=\"stem\"><\/div><div class=\"bar\" style=\"margin:0 25.00%\"><\/div><div class=\"row\"><div class=\"col\"><div class=\"node\">Ījāz qiṣar<span class=\"ar\">إيجاز قصر<\/span><\/div><div class=\"sub\">many meanings, nothing left out<\/div><\/div><div class=\"col\"><div class=\"node\">Ījāz ḥadhf<span class=\"ar\">إيجاز حذف<\/span><\/div><div class=\"stem\"><\/div><div class=\"bar\" style=\"margin:0 16.67%\"><\/div><div class=\"row\"><div class=\"col\"><div class=\"node\">A word<\/div><div class=\"sub\">‎<span class=\"arin\">أَبْرَحُ<\/span>‎<\/div><\/div><div class=\"col\"><div class=\"node\">A sentence<\/div><div class=\"sub\">Fāṭir 35:4<\/div><\/div><div class=\"col\"><div class=\"node\">More<\/div><div class=\"sub\">Yūsuf 12:45–46<\/div><\/div><\/div><\/div><\/div><\/div><\/div><h3>DIVISIONS OF EXPANSION<span class=\"ar\">أقسام الإطناب<\/span><\/h3><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 122<\/span><\/div><div class=\"ar\">الإطناب يكون بأمور كثيرة:<\/div><div class=\"tr\">Expansion comes about through many things:<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>Expansion comes in many forms. The book lists eleven of them. For each one, notice what the extra words add.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 122<\/span><\/div><div class=\"ar\">منها: ذكر الخاصّ بعد العامّ، نحو: «اجتهدوا في دروسكم واللغة العربيّة»، وفائدته التنبيهُ على فضْل الخاصّ، كأنّه لرفعته جنس آخر مغائر لِما قبله.<\/div><div class=\"tr\">Among them: mentioning the particular after the general, e.g. “Strive in your lessons and in the Arabic language”. Its benefit is drawing attention to the excellence of the particular, as though, because of its loftiness, it were another genus differing from what came before it.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>The particular after the general.<\/b> \"Arabic\" is one of \"your lessons\", so it is already included. Mentioning it again, separately, shows it is so important that it is treated almost as a different thing.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 122<\/span><\/div><div class=\"ar\">ومنها: ذكر العامّ بعد الخاصّ، كقوله تعالى: ﴿رَبِّ اغْفِرْ لِي وَلِوَالِدَيَّ وَلِمَن دَخَلَ بَيْتِيَ مُؤْمِناً وَلِلْمُؤْمِنِينَ وَالْمُؤْمِنَاتِ﴾ [نوح: ٢٨].<\/div><div class=\"tr\">Among them: mentioning the general after the particular, as in the words of Allah Most High: ﴿My Lord, forgive me and my parents and whoever enters my house a believer, and the believing men and the believing women﴾ [Nūḥ 71:28].<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>The general after the particular.<\/b> Nūḥ (peace be upon him) prays for himself, his parents and those who enter his house as believers, all of whom are believers, and then for all believing men and women. The particular ones receive special mention, and then the prayer is widened to include everyone.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 122–123<\/span><\/div><div class=\"ar\">منها: الإيضاح بعد الإبْهام، نحو: ﴿أَمَدَّكُم بِمَا تَعْلَمُونَ ۝ أَمَدَّكُم بِأَنْعَامٍ وَبَنِينَ﴾ [الشعراء: ١٣٢-١٣٣]<\/div><div class=\"tr\">Among them: clarification after vagueness, e.g. ﴿He has provided you with what you know. ۝ He has provided you with cattle and sons﴾ [al-Shuʿarāʾ 26:132–133].<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Clarifying after vagueness.<\/b> First ‎<span class=\"arin\">بِمَا تَعْلَمُونَ<\/span>‎, \"with what you know\", which is vague; then the details: cattle and sons. Hearing the meaning twice, first in general and then in detail, fixes it in the mind.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 123<\/span><\/div><div class=\"ar\">ومنها: التوشيع، وهو أن يؤتى في آخر الكلام بمثنّى مفسَّر بإثنين، كقوله:<span class=\"bayt\"><span class=\"h1\">أُمْسِيْ وَأُصْبِحُ مِنْ تَذْكَارِكُمْ وَصِباً<\/span><span class=\"h2\">يَرْثِيْ لِي الْمُشْفِقَانِ الأَهْلُ وَالوَلَدُ<\/span><\/span><\/div><div class=\"tr\">Among them: tawshīʿ, which is bringing at the end of the speech a dual that is explained by two [things], as in the poet’s words: “Evening and morning I am ill from remembering you; the two who pity me grieve for me: my family and my child.”<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Tawshīʿ:<\/b> ending with a <b>dual<\/b> and then naming the two things it refers to. The poet says \"the two who pity me\", and then explains: \"my family and my child\".<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 123–124<\/span><\/div><div class=\"ar\">ومنها: التكرير لغرض، كطول الفصل، في قوله:<span class=\"bayt\"><span class=\"h1\">وَإِنِ امْرَأً دَامَتْ مَوَاثِيْقُ عَهْدِهِ<\/span><span class=\"h2\">عَلَى مِثْلِ هَذَا إِنَّهُ لَكَرِيْمٌ<\/span><\/span>وكـ«زيادة الترغيب في العفو» في قوله تعالى: ﴿إِنَّ مِنْ أَزْوَاجِكُمْ وَأَوْلَادِكُمْ عَدُوّاً لَّكُمْ فَاحْذَرُوهُمْ وَإِن تَعْفُوا وَتَصْفَحُوا وَتَغْفِرُوا فَإِنَّ اللَّهَ غَفُورٌ رَّحِيمٌ﴾ [التغابن: ١٤]. وكتأكيد الإنذار في قوله تعالى: ﴿ كَلاَّ سَوْفَ تَعْلَمُونَ ۝ ثُمَّ كَلاَّ سَوْفَ تَعْلَمُونَ﴾ [التكاثر: ٣-٤].<\/div><div class=\"tr\">Among them: repetition for a purpose, such as the length of the separation, in the poet’s words: “Indeed a man whose bonds of covenant have continued on the like of this — indeed he is noble.” And such as “increasing the encouragement to pardon” in the words of Allah Most High: ﴿Indeed among your wives and your children are enemies to you, so beware of them; and if you pardon and overlook and forgive, then indeed Allah is Forgiving, Merciful﴾ [al-Taghābun 64:14]. And such as emphasising the warning in the words of Allah Most High: ﴿No! You are going to know. ۝ Then no! You are going to know﴾ [al-Takāthur 102:3–4].<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Repetition with a purpose.<\/b> The book gives three purposes:<p>(1) A <b>long gap<\/b>: in the line, ‎<span class=\"arin\">إنّ<\/span>‎ comes at the start and so many words follow that ‎<span class=\"arin\">إِنَّهُ<\/span>‎ is repeated to pick up the thread.<\/p><p>(2) <b>Encouraging forgiveness<\/b>: three verbs of pardon (‎<span class=\"arin\">تَعْفُوا<\/span>‎، ‎<span class=\"arin\">تَصْفَحُوا<\/span>‎، ‎<span class=\"arin\">تَغْفِرُوا<\/span>‎) urge the believers strongly to forgive.<\/p><p>(3) <b>Strengthening a warning<\/b>: ‎<span class=\"arin\">كَلاَّ سَوْفَ تَعْلَمُونَ<\/span>‎ said twice.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 124–125<\/span><\/div><div class=\"ar\">ومنها: الاعتراض: وهو توسّط لفظ بين أجزاء جملة أو بين جملتين مرتبِطَتَين معنًى لغرض، نحو:<span class=\"bayt\"><span class=\"h1\">إنَّ الثَمَانِيْنَ وَبُلِّغْتَهَا<\/span><span class=\"h2\">قَدْ أَحْوَجَتْ سَمْعِيْ إِلَى تَرْجُمَانِ<\/span><\/span>ونحو قوله تعالى: ﴿وَيَجْعَلُونَ لِلّهِ الْبَنَاتِ سُبْحَانَهُ وَلَهُم مَّا يَشْتَهُونَ﴾ [النحل: ٥٧].<\/div><div class=\"tr\">
