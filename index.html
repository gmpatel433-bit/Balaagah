\/div><h3>THE DEMONSTRATIVE NOUN (ISM AL-ISHĀRAH)<\/h3><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 77<\/span><\/div><div class=\"ar\">وأمّا اسم الإشارة؛ فيؤتى به إذا تعيّن طريقاً لإحضار معناه كقولك: «بعني هذا» مشيراً إلى شيء لا تعرف له اسماً ولا وصفاً، أمّا إذا لم يتعيّن طريقاً لذلك، فيكون لأغراض أخرى:<\/div><div class=\"tr\">As for the demonstrative noun, it is used when it is fixed as the (only) way to bring its referent to mind, as when you say «Sell me this», pointing to a thing for which you know neither a name nor a description. When, however, it is not fixed as the way to that, it is (used) for other purposes:<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>A <b>demonstrative<\/b> (‎<span class=\"arin\">هذا<\/span>‎، ‎<span class=\"arin\">ذلك<\/span>‎) is sometimes the <b>only way<\/b> to identify something: \"Sell me <i>this<\/i>\", pointing at an item whose name you do not know. When it is not the only way, a speaker chooses it for other purposes, which follow.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 77<\/span><\/div><div class=\"ar\">(١) كإظهار الاستغراب، نحو:<span class=\"bayt\"><span class=\"h1\">كَمْ عَاقِلٍ عَاقِلٍ أعْيَتْ مَذَاهِبُهُ<\/span><span class=\"h2\">وَجَاهِلٍ جَاهِلٍ تَلْقَاهُ مَرْزُوْقاً<\/span><\/span><span class=\"bayt\"><span class=\"h1\">هَذَا الَّذِي تَرَكَ الْأَوْهَامَ حَائِرَةً<\/span><span class=\"h2\">وَصَيَّرَ العَالِمَ النِحْرِيْرَ زِنْدِيْقاً<\/span><\/span><\/div><div class=\"tr\">(1) Such as showing astonishment, for example:<br>“How many a truly intelligent man whose ways of living have defeated him, / and a truly ignorant man you find provided for!<br>This is what has left minds bewildered, / and turned the masterly scholar into a heretic (zindīq).”<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Showing astonishment.<\/b> The poet sees intelligent people struggling and ignorant people well provided for, and says \"<i>This<\/i> is what has left minds bewildered\". By pointing to the situation with ‎<span class=\"arin\">هَذَا<\/span>‎, he holds it up for everyone to look at and wonder at.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 78<\/span><\/div><div class=\"ar\">(٢) وكمالِ العناية به، نحو:<span class=\"bayt\"><span class=\"h1\">هَذَا الَذِيْ تَعْرِفُ البَطْحَاءُ وَطْأَتَهُ<\/span><span class=\"h2\">وَالبَيْتُ يَعْرِفُهُ وَالْحِلُّ وَالْحَرَمُ<\/span><\/span><\/div><div class=\"tr\">(2) And complete attention to it, for example:<br>“This is the one whose tread al-Baṭḥāʾ knows, / and the House knows him, and the land outside the sanctuary and the sanctuary.”<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Full attention to it.<\/b> In this famous line, the poet points to the man he is praising with ‎<span class=\"arin\">هَذَا<\/span>‎, making him stand out clearly before the listeners, as if to say: look at him, this is the one whom Makkah, the Kaʿbah and the land around it all know.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 78<\/span><\/div><div class=\"ar\">(٣) وبيانِ حاله في القرب والبعد، نحو: «هذا يوسف»، و«ذاك أخوه»، و«ذلك غلامه».<\/div><div class=\"tr\">(3) And making clear its state in nearness and distance, for example: «This is Yūsuf», «That (middle distance) is his brother», and «That (far) is his servant».<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Showing nearness or distance.<\/b> The different demonstratives tell the listener how far away the thing is: ‎<span class=\"arin\">هذا<\/span>‎ for near, ‎<span class=\"arin\">ذاك<\/span>‎ for middle distance, ‎<span class=\"arin\">ذلك<\/span>‎ for far.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 79<\/span><\/div><div class=\"ar\">(٤) والتعظيمِ، نحو: ﴿إِنَّ هَذَا الْقُرْآنَ يهْدِي لِلَّتِي هِيَ أَقْوَمُ﴾ [بني إسرائيل: ٩]، و﴿ذَلِكَ الْكِتَابُ لاَ رَيْبَ فِيْهِ﴾ [البقرة: ٢].<\/div><div class=\"tr\">(4) And exaltation, for example: ﴿Indeed this Qurʾān guides to that which is most upright﴾ [Banī Isrāʾīl: 9], and ﴿That is the Book, no doubt in it﴾ [al-Baqarah: 2].<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Exaltation.<\/b> ‎<span class=\"arin\">هَذَا الْقُرْآنَ<\/span>‎ uses the word for <b>near<\/b>, showing the Qurʾān's honour by bringing it close. ‎<span class=\"arin\">ذَلِكَ الْكِتَابُ<\/span>‎ uses the word for <b>far<\/b>, though the Book is present, to show how <b>high<\/b> its rank is, as if it were out of reach.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 79<\/span><\/div><div class=\"ar\">(٥) والتحقيرِ، نحو: ﴿أَهَذَا الَّذِي يَذْكُرُ آلِهَتَكُمْ﴾ [الأنبياء: ٣٦]، ﴿فَذَلِكَ الَّذِي يَدُعُّ الْيَتِيمَ﴾ [الماعون: ٢].<\/div><div class=\"tr\">(5) And belittling, for example: ﴿Is this the one who mentions your gods?﴾ [al-Anbiyāʾ: 36], ﴿That is the one who repulses the orphan﴾ [al-Māʿūn: 2].<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Belittling.<\/b> The disbelievers say ‎<span class=\"arin\">أَهَذَا الَّذِي يَذْكُرُ آلِهَتَكُمْ<\/span>‎, using the word for near to belittle the Prophet ﷺ. In ‎<span class=\"arin\">فَذَلِكَ الَّذِي يَدُعُّ الْيَتِيمَ<\/span>‎, the word for far shows that the one who pushes away the orphan is far from goodness and low in rank.<p>Notice that both ‎<span class=\"arin\">هذا<\/span>‎ and ‎<span class=\"arin\">ذلك<\/span>‎ can be used for both exaltation and belittling. The context decides.<\/p><\/div><div class=\"chartbox\"><div class=\"chh\">THE DEMONSTRATIVE: ITS PURPOSES · DRAWN BY THE COMPANION<\/div><table class=\"grid\"><thead><tr><th>Purpose<\/th><th>Book's example<\/th><\/tr><\/thead><tbody><tr><td>The only way to identify<\/td><td>‎<span class=\"arin\">بعني هذا<\/span>‎<\/td><\/tr><tr><td>Astonishment ‎<span class=\"arin\">الاستغراب<\/span>‎<\/td><td>‎<span class=\"arin\">هَذَا الَّذِي تَرَكَ الْأَوْهَامَ حَائِرَةً<\/span>‎<\/td><\/tr><tr><td>Full attention ‎<span class=\"arin\">كمالِ العناية<\/span>‎<\/td><td>‎<span class=\"arin\">هَذَا الَذِيْ تَعْرِفُ البَطْحَاءُ وَطْأَتَهُ<\/span>‎<\/td><\/tr><tr><td>Near or far ‎<span class=\"arin\">القرب والبعد<\/span>‎<\/td><td>‎<span class=\"arin\">هذا يوسف<\/span>‎، ‎<span class=\"arin\">ذاك أخوه<\/span>‎<\/td><\/tr><tr><td>Exaltation ‎<span class=\"arin\">التعظيم<\/span>‎<\/td><td>‎<span class=\"arin\">ذَلِكَ الْكِتَابُ<\/span>‎<\/td><\/tr><tr><td>Belittling ‎<span class=\"arin\">التحقير<\/span>‎<\/td><td>‎<span class=\"arin\">أَهَذَا الَّذِي يَذْكُرُ آلِهَتَكُمْ<\/span>‎<\/td><\/tr><\/tbody><\/table><\/div><h3>THE RELATIVE NOUN (AL-ISM AL-MAWṢŪL)<\/h3><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 80<\/span><\/div><div class=\"ar\">وأمّا الموصول؛ فيؤتى به إذا تعيّن طريقاً لإحضار معناه كقولك: «الذي كان معنا أمس مسافر»، إذا لَم تكن تعرف اسمه، أمّا إذا لم يتعيّن طريقاً لذلك فيكون لأغراض أخرى:<\/div><div class=\"tr\">As for the relative noun, it is used when it is fixed as the (only) way to bring its referent to mind, as when you say «The one who was with us yesterday is travelling», if you do not know his name. When it is not fixed as the way to that, it is (used) for other purposes:<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>A <b>relative noun<\/b> (‎<span class=\"arin\">الذي<\/span>‎ and its relatives) identifies someone by a description in its clause (<i>ṣilah<\/i>). It may be the <b>only way<\/b>: if you do not know a man's name, you say \"<i>the one who<\/i> was with us yesterday\". When it is not the only way, it serves other purposes.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 80<\/span><\/div><div class=\"ar\">(١) كالتعليل، نحو: ﴿إِنَّ الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ كَانَتْ لَهُمْ جَنَّاتُ الْفِرْدَوْسِ نُزُلاً﴾ [الكهف: ١٠٧].<\/div><div class=\"tr\">(1) Such as giving the reason, for example: ﴿Indeed those who believe and do righteous deeds, for them will be the Gardens of Paradise as a lodging﴾ [al-Kahf: 107].<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Giving the reason.<\/b> \"Those who believe and do righteous deeds\" does not just identify them; the description itself explains <b>why<\/b> they will have Paradise: because of their faith and good deeds.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 80<\/span><\/div><div class=\"ar\">(٢) وإخفاءِ الأمر عن غير المخاطب، نحو:<span class=\"bayt\"><span class=\"h1\">وَأَخَذْتُ مَا جَادَ الأَمِيْرُ بِهِ<\/span><span class=\"h2\">وَقَضَيْتُ حَاجَاتِيْ كَمَا أَهْوَى<\/span><\/span><\/div><div class=\"tr\">(2) And concealing the matter from anyone other than the addressee, for example:<br>“I took what the Amīr generously gave, / and fulfilled my needs as I wished.”<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Hiding the matter from others.<\/b> \"I took <i>what<\/i> the Amīr gave\" does not say what it was. The person addressed may know; others listening do not.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 80–81<\/span><\/div><div class=\"ar\">(٣) والتنبيهِ على الخطأ، نحو:<span class=\"bayt\"><span class=\"h1\">إِنّ الَذِيْنَ تُرَوْنَهُمْ إِخْوَانَكُمْ<\/span><span class=\"h2\">يَشْفِيْ غَلِيْلَ صُدُوْرِهِمْ أَنْ تُصْرَعُوْا<\/span><\/span><\/div><div class=\"tr\">(3) And drawing attention to an error, for example:<br>“Those whom you suppose to be your brothers — / it would quench the burning thirst of their breasts that you be struck down.”<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Drawing attention to a mistake.<\/b> \"Those whom you <i>suppose<\/i> to be your brothers\" tells the listeners that they are wrong about these people: they think them brothers, but these people would be glad to see them destroyed.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 81<\/span><\/div><div class=\"ar\">(٤) وتفخيمِ شأن المحكوم به، نحو:<span class=\"bayt\"><span class=\"h1\">إِنَّ الَذِيْ سَمَكَ السَمَاءَ بَنَى لَنَا<\/span><span class=\"h2\">بَيْتاً دَعَائِمُهُ أَعَزُّ وَأَطْوَلُ<\/span><\/span><\/div><div class=\"tr\">(4) And magnifying the standing of the thing predicated, for example:<br>“He who raised the heaven built for us / a house whose pillars are mightier and taller.”<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Magnifying what is said about him.<\/b> \"He who raised the heaven\" (meaning Allah) built for us a house (of honour and glory) whose pillars are mightier and taller. Opening with the One who raised the sky makes the house He built for them seem all the greater.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 81<\/span><\/div><div class=\"ar\">(٥) والتهويلِ تعظيماً وتحقيراً، نحو: ﴿فَغَشِيَهُم مِّنَ الْيَمِّ مَا غَشِيَهُمْ﴾ [طه: ٧٨]، ونحو: «من لم يدر حقيقة الحال قال ما قال».<\/div><div class=\"tr\">(5) And making (a thing) seem tremendous, in exaltation and in belittling, for example: ﴿Then there covered them of the sea that which covered them﴾ [Ṭā Hā: 78]; and for example: «Whoever did not know the reality of the situation said what he said».<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Making it seem tremendous<\/b> (<i>tahwīl<\/i>), for good or bad. \"There covered them of the sea <i>that which<\/i> covered them\" does not describe the water; leaving it as \"that which\" makes it feel beyond description.<p>In \"Whoever did not know the reality said <i>what<\/i> he said\", the vague \"what\" makes his words seem so bad that they are not worth repeating.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 81<\/span><\/div><div class=\"ar\">(٦) والتهكّمِ، نحو: ﴿يَا أَيُّهَا الَّذِي نُزِّلَ عَلَيْهِ الذِّكْرُ إِنَّكَ لَمَجْنُونٌ﴾[الحجر: ٦]<\/div><div class=\"tr\">(6) And mockery, for example: ﴿O you upon whom the Reminder has been sent down, indeed you are mad﴾ [al-Ḥijr: 6].<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Mockery.<\/b> The disbelievers call the Prophet ﷺ \"O you upon whom the Reminder has been sent down\". They did not believe that the Reminder was sent down to him; they use the description to mock him, as their next words show: \"indeed you are mad\".<\/div><div class=\"chartbox\"><div class=\"chh\">THE RELATIVE NOUN: ITS PURPOSES · DRAWN BY THE COMPANION<\/div><table class=\"grid\"><thead><tr><th>Purpose<\/th><th>Book's example<\/th><\/tr><\/thead><tbody><tr><td>The only way to identify<\/td><td>‎<span class=\"arin\">الذي كان معنا أمس<\/span>‎<\/td><\/tr><tr><td>Giving the reason ‎<span class=\"arin\">التعليل<\/span>‎<\/td><td>‎<span class=\"arin\">إِنَّ الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ<\/span>‎<\/td><\/tr><tr><td>Hiding from others ‎<span class=\"arin\">إخفاءُ الأمر<\/span>‎<\/td><td>‎<span class=\"arin\">وَأَخَذْتُ مَا جَادَ الأَمِيْرُ بِهِ<\/span>‎<\/td><\/tr><tr><td>Pointing out a mistake ‎<span class=\"arin\">التنبيهِ على الخطأ<\/span>‎<\/td><td>‎<span class=\"arin\">إِنّ الَذِيْنَ تُرَوْنَهُمْ إِخْوَانَكُمْ<\/span>‎<\/td><\/tr><tr><td>Magnifying the predicate ‎<span class=\"arin\">تفخيمِ شأن المحكوم به<\/span>‎<\/td><td>‎<span class=\"arin\">إِنَّ الَذِيْ سَمَكَ السَمَاءَ<\/span>‎<\/td><\/tr><tr><td>Making tremendous ‎<span class=\"arin\">التهويل<\/span>‎<\/td><td>‎<span class=\"arin\">فَغَشِيَهُم مِّنَ الْيَمِّ مَا غَشِيَهُمْ<\/span>‎<\/td><\/tr><tr><td>Mockery ‎<span class=\"arin\">التهكّم<\/span>‎<\/td><td>‎<span class=\"arin\">يَا أَيُّهَا الَّذِي نُزِّلَ عَلَيْهِ الذِّكْرُ<\/span>‎<\/td><\/tr><\/tbody><\/table><\/div><h3>THE NOUN MADE DEFINITE WITH “AL”<\/h3><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 82<\/span><\/div><div class=\"ar\">وأمّا الْمُحَلَّى بـ«أل»؛ فيؤتى به إذا كان الغرض الحكايةَ عن الجنس نفسِه، نحو: «الإنسان حيوان ناطق» وتسمّى «أل جنسيّة»،<\/div><div class=\"tr\">As for the noun adorned with «al», it is used when the purpose is to speak of the genus itself, for example: «Man is a rational animal»; and (this «al») is called «al of the genus (al jinsiyyah)».<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>The noun with ‎<span class=\"arin\">أل<\/span>‎ has several kinds, according to what the <i>al<\/i> refers to. The first is <b>al of the genus<\/b> (<i>al jinsiyyah<\/i>): you speak of the <b>kind itself<\/b>, its nature, not of any particular individuals. ‎<span class=\"arin\">الإنسان حيوان ناطق<\/span>‎ defines what a human being is.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 82–83<\/span><\/div><div class=\"ar\">أو الحكايةَ عن معهود من أفراد الجنس، وعهده إمّا بتقديم ذكره، نحو: ﴿كَمَا أَرْسَلْنَا إِلَى فِرْعَوْنَ رَسُولاً ○ فَعَصَى فِرْعَوْنُ الرَّسُولَ﴾ [المزّمّل: ١٦-١٥]، وإمّا بحضوره بذاته، نحو: ﴿الْيَوْمَ أَكْمَلْتُ لَكُمْ دِينَكُمْ﴾ [المائدة: ٣]، وإمّا بمعرفة السامع له، نحو: ﴿إِذْ يُبَايِعُونَكَ تَحْتَ الشَّجَرَةِ﴾ [الفتح: ١٨]، وتسمّى «أل عهديّة»،<\/div><div class=\"tr\">Or (when the purpose is) to speak of a known individual of the genus. Its being known is either through its having been mentioned before, for example: ﴿Just as We sent to Pharaoh a messenger; but Pharaoh disobeyed the messenger﴾ [al-Muzzammil: 15–16]; or through its being present in itself, for example: ﴿This day I have perfected for you your religion﴾ [al-Māʾidah: 3]; or through the listener’s knowing it, for example: ﴿When they were pledging allegiance to you under the tree﴾ [al-Fatḥ: 18]; and (this «al») is called «al of the known (al ʿahdiyyah)».<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>The second is <b>al of the known individual<\/b> (<i>al ʿahdiyyah<\/i>): the <i>al<\/i> points to a <b>particular<\/b> one that the listener already knows. The book gives three ways he can know it:<\/p><p>(1) It was <b>mentioned before<\/b>: ‎<span class=\"arin\">رَسُولاً<\/span>‎ first comes indefinite, then ‎<span class=\"arin\">الرَّسُولَ<\/span>‎ refers back to that same messenger.<\/p><p>(2) It is <b>present<\/b>: ‎<span class=\"arin\">الْيَوْمَ<\/span>‎ means <i>this<\/i> very day.<\/p><p>(3) The listener <b>already knows it<\/b>: ‎<span class=\"arin\">الشَّجَرَةِ<\/span>‎ is the well-known tree under which the pledge was made.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 83<\/span><\/div><div class=\"ar\">أو الحكايةَ عن جميع أفراد الجنس، نحو: ﴿إِنَّ الإنسَانَ لَفِي خُسْرٍ﴾ [العصر: ٢]، وتسمّى «أل استغراقيّة»،<\/div><div class=\"tr\">Or (when the purpose is) to speak of all the individuals of the genus, for example: ﴿Indeed man is in loss﴾ [al-ʿAṣr: 2]; and (this «al») is called «al of comprehensiveness (al istighrāqiyyah)».<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>The third is <b>al of comprehensiveness<\/b> (<i>al istighrāqiyyah<\/i>): it covers <b>every<\/b> individual of the kind. In ‎<span class=\"arin\">إِنَّ الإنسَانَ لَفِي خُسْرٍ<\/span>‎ every human being is meant, which is why the next verse can make an exception: \"except those who believe\". A good test: you could put ‎<span class=\"arin\">كلّ<\/span>‎ in its place.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 83–84<\/span><\/div><div class=\"ar\">وقد يراد بـ«أل» الإشارةُ إلى الجنس في فرد مّا، نحو:<span class=\"bayt\"><span class=\"h1\">وَلَقَدْ أَمُرُّ عَلَى اللَئِيْمِ يَسُبُّنِيْ<\/span><span class=\"h2\">فَمَضَيْتُ ثَمَّهْ قُلْتُ لاَ يَعْنِيْنِيْ<\/span><\/span><\/div><div class=\"tr\">And sometimes by «al» is meant pointing to the genus in some individual or other, for example:<br>“I pass by the base man as he reviles me; / so I went on from there and said: ‘He does not mean me.’”<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>A fourth use: the <i>al<\/i> refers to the kind as found in <b>some individual or other<\/b>, not a known one. In the line \"I pass by <i>the<\/i> base man who reviles me\", the poet does not mean a particular known man; he means any base man he happens to pass. So the noun is definite in form but indefinite in meaning, which is why it can be described by the sentence ‎<span class=\"arin\">يَسُبُّنِيْ<\/span>‎.<\/p><\/div><div class=\"chartbox\"><div class=\"chh\">THE KINDS OF AL · DRAWN BY THE COMPANION<\/div><table class=\"grid\"><thead><tr><th>Kind<\/th><th>What it refers to<\/th><th>Book's example<\/th><\/tr><\/thead><tbody><tr><td>Jinsiyyah ‎<span class=\"arin\">جنسيّة<\/span>‎<\/td><td>the kind itself<\/td><td>‎<span class=\"arin\">الإنسان حيوان ناطق<\/span>‎<\/td><\/tr><tr><td>ʿAhdiyyah ‎<span class=\"arin\">عهديّة<\/span>‎<\/td><td>a known individual (mentioned before, present, or known)<\/td><td>‎<span class=\"arin\">فَعَصَى فِرْعَوْنُ الرَّسُولَ<\/span>‎<\/td><\/tr><tr><td>Istighrāqiyyah ‎<span class=\"arin\">استغراقيّة<\/span>‎<\/td><td>every individual of the kind<\/td><td>‎<span class=\"arin\">إِنَّ الإنسَانَ لَفِي خُسْرٍ<\/span>‎<\/td><\/tr><tr><td>The kind in some individual or other<\/td><td>an unspecified one<\/td><td>‎<span class=\"arin\">وَلَقَدْ أَمُرُّ عَلَى اللَئِيْمِ<\/span>‎<\/td><\/tr><\/tbody><\/table><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 84<\/span><\/div><div class=\"ar\">وإذا وقع الْمُحَلَّى بـ«أل» خبرا أفاد القصر، نحو: ﴿وَهُوَ الْغَفُورُ الْوَدُودُ﴾ [البروج: ١٤].<\/div><div class=\"tr\">And when the noun adorned with «al» occurs as a predicate, it conveys restriction (qaṣr), for example: ﴿And He is the Forgiving, the Loving﴾ [al-Burūj: 14].<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>When a noun with ‎<span class=\"arin\">أل<\/span>‎ is the <b>predicate<\/b>, it gives <b>restriction<\/b> (<i>qaṣr<\/i>): the quality belongs to the subject alone. ‎<span class=\"arin\">وَهُوَ الْغَفُورُ الْوَدُودُ<\/span>‎ means He, and He alone, is the Forgiving, the Loving. Restriction is the topic of Chapter VIII.<\/p><\/div><h3>THE NOUN ANNEXED TO A DEFINITE NOUN<\/h3><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 84<\/span><\/div><div class=\"ar\">وأمّا المضاف لمعرفة؛ فيؤتى به إذا تعيّن طريقاً لإحضار معناه أيضاً كـ«كتاب سيبويه»، و«سفينة نوح» عليه السلام، أمّا إذا لَم يتعيّن لذلك فيكون لأغراض أخرى:<\/div><div class=\"tr\">As for the noun annexed to a definite noun, it too is used when it is fixed as the (only) way to bring its referent to mind, like «the Book of Sībawayh» and «the Ark of Nūḥ», peace be upon him. When it is not fixed for that, it is (used) for other purposes:<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>A noun <b>annexed<\/b> to a definite noun (<i>iḍāfah<\/i>) may be the <b>only way<\/b> to refer to something: there is no shorter way to say \"the Book of Sībawayh\" or \"the Ark of Nūḥ\". Otherwise, it is chosen for the purposes that follow.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 85<\/span><\/div><div class=\"ar\">(١) كتعذّر التعداد أو تعسّره، نحو: «أجمع أهل الحقّ على كذا»، و«أهل البلد كِرَامٌ».<\/div><div class=\"tr\">(1) Such as when enumerating is impossible or difficult, for example: «The people of truth agreed upon such-and-such», and «The people of the town are generous».<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Listing would be impossible or hard.<\/b> \"The people of truth agreed\" covers countless scholars; naming them all is impossible. \"The people of the town are generous\" saves you from naming every resident.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 85<\/span><\/div><div class=\"ar\">(٢) والخروجِ من تبعة تقديم البعض على البعض، نحو: «حضر أمراء الجند».<\/div><div class=\"tr\">(2) And escaping the consequences of putting some before others, for example: «The commanders of the army came».<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Avoiding the problem of who to name first.<\/b> If you listed the commanders by name, whoever you named first might seem more important, and the others could take offence. \"The commanders of the army came\" names them all at once, with no one before anyone else.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 85<\/span><\/div><div class=\"ar\">(٣) والتعظيمِ للمضاف، نحو: «كتاب السلطان حضر»، أو المضاف إليه، نحو: «هذا خادمي»، أو غيرهما، نحو: «أخو الوزير عندي».<\/div><div class=\"tr\">(3) And exaltation — of the annexed noun, for example: «The Sultan’s letter has arrived»; or of the noun annexed to, for example: «This is my servant»; or of something other than both, for example: «The vizier’s brother is with me».<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Exaltation<\/b>, which may fall on either word or on someone else:<p>\"<i>The Sultan's<\/i> letter\": the letter is honoured by belonging to the Sultan. \"This is <i>my<\/i> servant\": the speaker is honoured by having a servant. \"<i>The vizier's<\/i> brother is with me\": the speaker is honoured, as someone in whose company the vizier's brother is found.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 85–86<\/span><\/div><div class=\"ar\">(٤) والتحقيرِ للمضاف، نحو: «هذا ابن اللصّ»، أو المضاف إليه، نحو: «اللصّ رفيق هذا»، وغيرهما، نحو: «أخو اللصّ عند عمرو».<\/div><div class=\"tr\">(4) And belittling — of the annexed noun, for example: «This is the thief’s son»; or of the noun annexed to, for example: «The thief is this man’s companion»; and of something other than both, for example: «The thief’s brother is with ʿAmr».<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Belittling<\/b>, in the same three ways:<p>\"The <i>thief's<\/i> son\": the son is lowered by his father. \"The thief is <i>this man's<\/i> companion\": the man is lowered by his friend. \"The thief's brother is with <i>ʿAmr<\/i>\": ʿAmr is lowered by the company he keeps.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 86<\/span><\/div><div class=\"ar\">(٣) والاختصارِ لضيق المقام، نحو:<span class=\"bayt\"><span class=\"h1\">هَوَايَ مَعَ الرَكْبِ اليَمَانِيْنَ مُصْعِدُ<\/span><span class=\"h2\">جَنِيْبٌ وَجُثْمَانِيْ بِمَكَّةَ مُوْثَقُ<\/span><\/span>بدلَ أن يقال: «الذي أهواه».<\/div><div class=\"tr\">(3) And brevity because of the narrowness of the occasion, for example:<br>“My beloved is with the Yemeni riders, travelling off, / led alongside, while my body is at Makkah, bound.”<br>— instead of saying «the one whom I love».<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Brevity, when there is no room for more.<\/b> The poet, far from his beloved and in distress, says ‎<span class=\"arin\">هَوَايَ<\/span>‎, \"my love\", meaning \"the one I love\". The annexation ‎<span class=\"arin\">هْوَى<\/span>‎ + ‎<span class=\"arin\">ي<\/span>‎ is far shorter than ‎<span class=\"arin\">الذي أهواه<\/span>‎, and his situation leaves no room for length.<\/div><div class=\"chartbox\"><div class=\"chh\">THE ANNEXED NOUN: ITS PURPOSES · DRAWN BY THE COMPANION<\/div><table class=\"grid\"><thead><tr><th>Purpose<\/th><th>Book's example<\/th><\/tr><\/thead><tbody><tr><td>The only way to identify<\/td><td>‎<span class=\"arin\">كتاب سيبويه<\/span>‎<\/td><\/tr><tr><td>Listing impossible or hard<\/td><td>‎<span class=\"arin\">أهل البلد كِرَامٌ<\/span>‎<\/td><\/tr><tr><td>Avoiding who comes first<\/td><td>‎<span class=\"arin\">حضر أمراء الجند<\/span>‎<\/td><\/tr><tr><td>Exaltation<\/td><td>‎<span class=\"arin\">كتاب السلطان حضر<\/span>‎<\/td><\/tr><tr><td>Belittling<\/td><td>‎<span class=\"arin\">هذا ابن اللصّ<\/span>‎<\/td><\/tr><tr><td>Brevity in a narrow situation<\/td><td>‎<span class=\"arin\">هَوَايَ مَعَ الرَكْبِ<\/span>‎<\/td><\/tr><\/tbody><\/table><\/div><h3>THE ONE CALLED OUT TO (AL-MUNĀDĀ)<\/h3><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 86–87<\/span><\/div><div class=\"ar\">وأمّا المنادى: فيؤتى به إذا لَم يعرف للمخاطب عنوان خاصّ، نحو: «يا رجل»، و«يا فتى»، وقد يؤتى به للإشارة إلى علَّةِ ما يطلب منه، نحو: «يا غلام أحضر الطعام»، و«يا خادم أسرج الفرس»، أو لغرض يمكن اعتباره هاهنا مِمّا ذكر في النداء.<\/div><div class=\"tr\">As for the one called out to, it is used when no particular title of the addressee is known, for example: «O man!» and «O young man!». It may be used to point to the reason for what is requested of him, for example: «O boy, bring the food!» and «O servant, saddle the horse!»; or for a purpose, among those mentioned under vocation (nidāʾ), which can be considered here.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>The <b>noun called out to<\/b> (<i>munādā<\/i>) is used when you do not know a particular name for the person: ‎<span class=\"arin\">يا رجل<\/span>‎, ‎<span class=\"arin\">يا فتى<\/span>‎.<\/p><p>It can also hint at the <b>reason<\/b> for the request: ‎<span class=\"arin\">يا غلام أحضر الطعام<\/span>‎ calls him \"boy\" (servant) because bringing food is his job. And it can serve any of the purposes of calling studied in Chapter III.<\/p><\/div><h3>THE INDEFINITE NOUN (AL-NAKIRAH)<\/h3><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 87<\/span><\/div><div class=\"ar\">وأمّا النكرة؛ فيؤتى بها إذا لَم يُعلم للمَحْكِيِّ عنه جهةُ تعريف كقولك: «جاء هاهنا رجل»، إذا لَم يعرف ما يعيّنه من علم، أو صلة، أو نحوهما،<\/div><div class=\"tr\">As for the indefinite noun, it is used when no aspect of definiteness is known for the thing spoken about, as when you say «A man came here», if you do not know anything that would make him specific — a proper name, or a ṣilah, or the like of these two.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>Now the <b>indefinite noun<\/b>. Its basic use: when you know nothing that would identify the person (no name, no description), you say ‎<span class=\"arin\">جاء هاهنا رجل<\/span>‎, \"<i>a<\/i> man came here\".<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 87<\/span><\/div><div class=\"ar\">وقد يؤتى بها لأغراض أخرى:<br>(١) كالتكثير والتقليل، نحو: «لفلان مال»، و﴿رِضْوَانٌ مِّنَ اللهِ أَكْبَرُ﴾ [التوبة: ٧٢]، أي: مال كثير، ورضوان قليل.<\/div><div class=\"tr\">It may be used for other purposes:<br>(1) Such as indicating muchness and littleness, for example: «So-and-so has wealth», and ﴿And good pleasure from Allah is greater﴾ [al-Tawbah: 72] — that is, much wealth, and a little good pleasure.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>Like the definite nouns, the indefinite noun can serve other purposes. The first is showing <b>muchness<\/b> or <b>littleness<\/b>, which only the context tells apart.<\/p><p>‎<span class=\"arin\">لفلان مال<\/span>‎, \"he has <i>wealth<\/i>\", means a lot of wealth. In ‎<span class=\"arin\">رِضْوَانٌ مِّنَ اللهِ أَكْبَرُ<\/span>‎ the indefinite ‎<span class=\"arin\">رِضْوَانٌ<\/span>‎ means even a <i>little<\/i> of Allah's pleasure is greater than all the gardens just mentioned.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 87–88<\/span><\/div><div class=\"ar\">(٢) والتعظيمِ والتحقير، نحو:<span class=\"bayt\"><span class=\"h1\">لَهُ حَاجِبٌ عَنْ كُلِّ أَمْرٍ يَشِيْنُهُ<\/span><span class=\"h2\">وَلَيْسَ لَهُ عَنْ طَالِبِ العُرْفِ حَاجِبٌ<\/span><\/span><\/div><div class=\"tr\">(2) And exaltation and belittling, for example:<br>“He has a (mighty) barrier from every matter that would disgrace him, / and he has no (paltry) barrier against one who seeks kindness.”<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Exaltation and belittling<\/b>, both in one line. \"He has <i>a barrier<\/i> from everything that would disgrace him\": a great, strong barrier (exaltation). \"He has no <i>barrier<\/i> against one who seeks kindness\": not even a small one (belittling). The same indefinite word ‎<span class=\"arin\">حَاجِبٌ<\/span>‎ means \"great\" in the first half and \"the slightest\" in the second.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 88<\/span><\/div><div class=\"ar\">(٣) والعمومِ بعد النفْي، نحو: ﴿مَا جَاءَنَا مِن بَشِيرٍ﴾ [المائدة: ١٩]؛ فإنّ النكِرة في سياق النفْي تعمّ.<\/div><div class=\"tr\">(3) And generality after a negation, for example: ﴿There has not come to us any bringer of good tidings﴾ [al-Māʾidah: 19]; for the indefinite noun in the context of negation is general.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Generality after a negation.<\/b> An indefinite noun in a negative sentence covers <b>all<\/b> of its kind. ‎<span class=\"arin\">مَا جَاءَنَا مِن بَشِيرٍ<\/span>‎ means no bringer of good news at all came to us.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 88–89<\/span><\/div><div class=\"ar\">(٤) وقصدِ فرد معيّن أو نوع كذلك، نحو: ﴿وَاللهُ خَلَقَ كُلَّ دَابَّةٍ مِن مَّاءٍ﴾ [النور: ٤٥].<\/div><div class=\"tr\">(4) And intending one specific individual, or one species in the same way, for example: ﴿And Allah created every living creature from water﴾ [al-Nūr: 45].<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Meaning one particular individual or kind<\/b> without naming it. In ‎<span class=\"arin\">وَاللهُ خَلَقَ كُلَّ دَابَّةٍ مِن مَّاءٍ<\/span>‎ the indefinite ‎<span class=\"arin\">مَّاءٍ<\/span>‎ means a particular kind of water (the water from which each creature is made), not water in general.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 89<\/span><\/div><div class=\"ar\">(٥) وإخفاءِ الأمر، نحو: «قال رجل إنّك انحرفت عن الصواب»، تُخفي اسمه حتّى لا يلحقه أذًى.<\/div><div class=\"tr\">(5) And concealing the matter, for example: «A man said that you have deviated from what is right» — you conceal his name so that no harm reaches him.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Hiding who it was.<\/b> \"<i>A man<\/i> said you have gone wrong\": you know who said it, but you do not name him, so that no harm comes to him.<\/div><div class=\"chartbox\"><div class=\"chh\">THE INDEFINITE NOUN: ITS PURPOSES · DRAWN BY THE COMPANION<\/div><table class=\"grid\"><thead><tr><th>Purpose<\/th><th>Book's example<\/th><\/tr><\/thead><tbody><tr><td>Nothing identifies it<\/td><td>‎<span class=\"arin\">جاء هاهنا رجل<\/span>‎<\/td><\/tr><tr><td>Muchness or littleness ‎<span class=\"arin\">التكثير والتقليل<\/span>‎<\/td><td>‎<span class=\"arin\">لفلان مال<\/span>‎ / ‎<span class=\"arin\">رِضْوَانٌ مِّنَ اللهِ<\/span>‎<\/td><\/tr><tr><td>Exaltation and belittling<\/td><td>‎<span class=\"arin\">لَهُ حَاجِبٌ<\/span>‎<\/td><\/tr><tr><td>Generality after negation ‎<span class=\"arin\">العمومِ بعد النفْي<\/span>‎<\/td><td>‎<span class=\"arin\">مَا جَاءَنَا مِن بَشِيرٍ<\/span>‎<\/td><\/tr><tr><td>One particular individual or kind<\/td><td>‎<span class=\"arin\">مِن مَّاءٍ<\/span>‎<\/td><\/tr><tr><td>Hiding the matter ‎<span class=\"arin\">إخفاءُ الأمر<\/span>‎<\/td><td>‎<span class=\"arin\">قال رجل إنّك انحرفت<\/span>‎<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box\"><div class=\"bh\">KEY TERMS AND THEIR MEANINGS · ADDED BY THE COMPANION<\/div><table class=\"terms\"><tr><td class=\"t\">Taʿrīf<\/td><td>Definiteness: bringing a part of the sentence as a definite noun, when the purpose is to make the addressee understand that the statement is tied to something specific.<\/td><td class=\"a\">التعريف<\/td><\/tr><tr><td class=\"t\">Tankīr<\/td><td>Indefiniteness: bringing it as an indefinite noun, when the purpose is not concerned with that.<\/td><td class=\"a\">التنكير<\/td><\/tr><tr><td class=\"t\">al-Maʿārif<\/td><td>The definite nouns: the pronoun, the proper name, the demonstrative, the relative noun, the noun with «al», the noun annexed to one of these, and the one called out to.<\/td><td class=\"a\">المعارف<\/td><\/tr><tr><td class=\"t\">al-Ḍamīr<\/td><td>The pronoun: used for first person, address or third person, together with brevity.<\/td><td class=\"a\">الضمير<\/td><\/tr><tr><td class=\"t\">al-ʿAlam<\/td><td>The proper name: used to bring its referent to the listener’s mind by its own particular name.<\/td><td class=\"a\">العلم<\/td><\/tr><tr><td class=\"t\">Ism al-ishārah<\/td><td>The demonstrative noun: used when it is the only way to bring its referent to mind, or for other purposes.<\/td><td class=\"a\">اسم الإشارة<\/td><\/tr><tr><td class=\"t\">al-Mawṣūl<\/td><td>The relative noun, made specific by its ṣilah.<\/td><td class=\"a\">الموصول<\/td><\/tr><tr><td class=\"t\">Ṣilah<\/td><td>The relative clause, a sentence whose content the relative noun is qualified by.<\/td><td class=\"a\">الصلة<\/td><\/tr><tr><td class=\"t\">Kināyah<\/td><td>Allusion: passing from the original meaning of a word to something it is suited to allude to.<\/td><td class=\"a\">الكناية<\/td><\/tr><tr><td class=\"t\">Istighrāb<\/td><td>Showing astonishment.<\/td><td class=\"a\">إظهار الاستغراب<\/td><\/tr><tr><td class=\"t\">Tahwīl<\/td><td>Making a thing seem tremendous.<\/td><td class=\"a\">التهويل<\/td><\/tr><tr><td class=\"t\">Tahakkum<\/td><td>Mockery.<\/td><td class=\"a\">التهكّم<\/td><\/tr><tr><td class=\"t\">Al jinsiyyah<\/td><td>«al» of the genus,, speaking of the genus itself.<\/td><td class=\"a\">أل جنسيّة<\/td><\/tr><tr><td class=\"t\">Al ʿahdiyyah<\/td><td>«al» of the known individual — known by prior mention, by presence, or by the listener’s knowledge.<\/td><td class=\"a\">أل عهديّة<\/td><\/tr><tr><td class=\"t\">Al istighrāqiyyah<\/td><td>«al» of comprehensiveness, covering all individuals of the genus.<\/td><td class=\"a\">أل استغراقيّة<\/td><\/tr><tr><td class=\"t\">al-ʿAhd al-dhihnī<\/td><td>Mental knownness (the usual name; not printed in the book): «al» pointing to the genus within some individual or other.<\/td><td class=\"a\">العهد الذهنيّ<\/td><\/tr><tr><td class=\"t\">Qaṣr<\/td><td>Restriction, conveyed when the noun with «al» occurs as a predicate.<\/td><td class=\"a\">القصر<\/td><\/tr><tr><td class=\"t\">al-Munādā<\/td><td>The one called out to.<\/td><td class=\"a\">المنادى<\/td><\/tr><tr><td class=\"t\">al-Nakirah<\/td><td>The indefinite noun.<\/td><td class=\"a\">النكرة<\/td><\/tr><\/table><\/div><div class=\"cnote\"><span class=\"cnh\">COMPANION&#8217;S NOTE · NOT IN THE BOOK<\/span><p>Two misprints or oddities in the printed matn are kept as printed: (a) on p. 86 the purpose «الاختصار لضيق المقام» is numbered «(٣)», although it follows items (١)–(٤) of the iḍāfah list; the likely intended number is «(٥)». (b) On p. 84 the matn has «خبرا» without the tanwīn sign; the usual spelling is «خبراً».<\/p><\/div><h3>QUESTIONS AND ANSWERS<span class=\"ar\">أسئلة وأجوبة<\/span><\/h3><div class=\"qabox\"><div class=\"qh\">QUESTIONS AND ANSWERS · ADDED BY THE COMPANION<\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>When does the situation call for a definite noun, and when for an indefinite one?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>Definite when the aim is to make the listener understand the statement is tied to something specific; indefinite when that is not the aim.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>Why is the pronoun used? Give the book's examples.<\/div><div class=\"a\"><span class=\"k\">A.<\/span>Because the situation is one of first person, address or third person, with brevity: ‎<span class=\"arin\">أنا رجوتك<\/span>‎، ‎<span class=\"arin\">أنت وعدتني<\/span>‎.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>Give the two cases where \"you\" is said to someone not present and specific.<\/div><div class=\"a\"><span class=\"k\">A.<\/span>When the one addressed is present in the heart, as in ‎<span class=\"arin\">إِيَّاكَ نَعْبُدُ<\/span>‎; and when the address is meant for everyone, as in \"The base man is he who, if you do good to him, does evil to you\".<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>How does the name in ‎<span class=\"arin\">تَبَّتْ يَدَا أَبِي لَهَبٍ<\/span>‎ serve as an allusion?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>\"Father of flame\" points to his end in the blazing Fire.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>How can ‎<span class=\"arin\">ذَلِكَ<\/span>‎ show exaltation in ‎<span class=\"arin\">ذَلِكَ الْكِتَابُ<\/span>‎?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>The word for far is used for something present to show that its rank is high, as if out of reach.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>What purpose does the relative noun serve in ‎<span class=\"arin\">إِنَّ الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ كَانَتْ لَهُمْ جَنَّاتُ الْفِرْدَوْسِ<\/span>‎?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>Giving the reason: their faith and deeds are why they have Paradise.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>Name the kinds of <i>al<\/i> the book mentions, with an example of each.<\/div><div class=\"a\"><span class=\"k\">A.<\/span><i>Jinsiyyah<\/i>: ‎<span class=\"arin\">الإنسان حيوان ناطق<\/span>‎; <i>ʿahdiyyah<\/i>: ‎<span class=\"arin\">فَعَصَى فِرْعَوْنُ الرَّسُولَ<\/span>‎; <i>istighrāqiyyah<\/i>: ‎<span class=\"arin\">إِنَّ الإنسَانَ لَفِي خُسْرٍ<\/span>‎; and the kind in some individual or other: ‎<span class=\"arin\">وَلَقَدْ أَمُرُّ عَلَى اللَئِيْمِ<\/span>‎.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>What are the three ways something can be known for <i>al ʿahdiyyah<\/i>?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>By having been mentioned before, by being present, or by the listener already knowing it.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>What does a noun with <i>al<\/i> convey when it is the predicate?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>Restriction, as in ‎<span class=\"arin\">وَهُوَ الْغَفُورُ الْوَدُودُ<\/span>‎.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>Why say \"The commanders of the army came\" instead of naming them?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>To avoid the problem of putting some before others, which could offend.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>Explain how ‎<span class=\"arin\">حَاجِبٌ<\/span>‎ shows both exaltation and belittling in the same line.<\/div><div class=\"a\"><span class=\"k\">A.<\/span>In the first half it means a great barrier from disgrace; in the second it means not even the slightest barrier against those seeking kindness.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>Why is the indefinite noun general in ‎<span class=\"arin\">مَا جَاءَنَا مِن بَشِيرٍ<\/span>‎?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>Because an indefinite noun in the context of negation covers all of its kind.<\/div><\/div><\/div>", "terms": [{"t": "Taʿrīf", "m": "Definiteness: bringing a part of the sentence as a definite noun, when the purpose is to make the addressee understand that the statement is tied to something specific.", "a": "التعريف"}, {"t": "Tankīr", "m": "Indefiniteness: bringing it as an indefinite noun, when the purpose is not concerned with that.", "a": "التنكير"}, {"t": "al-Maʿārif", "m": "The definite nouns: the pronoun, the proper name, the demonstrative, the relative noun, the noun with «al», the noun annexed to one of these, and the one called out to.", "a": "المعارف"}, {"t": "al-Ḍamīr", "m": "The pronoun: used for first person, address or third person, together with brevity.", "a": "الضمير"}, {"t": "al-ʿAlam", "m": "The proper name: used to bring its referent to the listener’s mind by its own particular name.", "a": "العلم"}, {"t": "Ism al-ishārah", "m": "The demonstrative noun: used when it is the only way to bring its referent to mind, or for other purposes.", "a": "اسم الإشارة"}, {"t": "al-Mawṣūl", "m": "The relative noun, made specific by its ṣilah.", "a": "الموصول"}, {"t": "Ṣilah", "m": "The relative clause, a sentence whose content the relative noun is qualified by.", "a": "الصلة"}, {"t": "Kināyah", "m": "Allusion: passing from the original meaning of a word to something it is suited to allude to.", "a": "الكناية"}, {"t": "Istighrāb", "m": "Showing astonishment.", "a": "إظهار الاستغراب"}, {"t": "Tahwīl", "m": "Making a thing seem tremendous.", "a": "التهويل"}, {"t": "Tahakkum", "m": "Mockery.", "a": "التهكّم"}, {"t": "Al jinsiyyah", "m": "«al» of the genus,, speaking of the genus itself.", "a": "أل جنسيّة"}, {"t": "Al ʿahdiyyah", "m": "«al» of the known individual — known by prior mention, by presence, or by the listener’s knowledge.", "a": "أل عهديّة"}, {"t": "Al istighrāqiyyah", "m": "«al» of comprehensiveness, covering all individuals of the genus.", "a": "أل استغراقيّة"}, {"t": "al-ʿAhd al-dhihnī", "m": "Mental knownness (the usual name; not printed in the book): «al» pointing to the genus within some individual or other.", "a": "العهد الذهنيّ"}, {"t": "Qaṣr", "m": "Restriction, conveyed when the noun with «al» occurs as a predicate.", "a": "القصر"}, {"t": "al-Munādā", "m": "The one called out to.", "a": "المنادى"}, {"t": "al-Nakirah", "m": "The indefinite noun.", "a": "النكرة"}], "part": null}, {"num": 7, "title": "Unrestricted and Restricted Statement", "ar": "الباب الخامس في الإطلاق والتقييد", "body": "<h3>CHAPTER FIVE: ON UNRESTRICTED AND RESTRICTED STATEMENT<span class=\"ar\">الباب الخامس في الإطلاق والتقييد<\/span><\/h3><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 90<\/span><\/div><div class=\"ar\">إذا اقتصر في الجملة على ذكر المسند والمسند إليه فالحكم مطلق، وإذا زِيد عليهما شيء مِمّا يتعلّق بهما، أو بأحدهما فالحكم مقيّد،<\/div><div class=\"tr\">If, in the sentence, one confines oneself to mentioning the predicate (musnad) and the subject (musnad ilayh), the judgement is unrestricted (muṭlaq); and if something that is connected with them both, or with one of them, is added to them, the judgement is restricted (muqayyad).<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>Every sentence has its two pillars: the <i>musnad ilayhi<\/i> and the <i>musnad<\/i> (Chapter III). If the sentence has <b>only<\/b> these two, the judgement is <b>unrestricted<\/b> (<i>muṭlaq<\/i>): ‎<span class=\"arin\">زيد قائم<\/span>‎, \"Zayd is standing\".<\/p><p>If you add anything connected to them, such as an object, a time, a condition or an adjective, the judgement becomes <b>restricted<\/b> (<i>muqayyad<\/i>): \"Zayd is standing <i>in the house<\/i>\", \"Zayd is standing <i>if you come<\/i>\". The addition narrows the judgement down.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 90<\/span><\/div><div class=\"ar\">والإطلاق يكون حيث لا يتعلّق الغرض بتقييد الحكم بوجه من الوجوه؛ ليذهب السامع فيه كلّ مذهب ممكن، والتقييد حيث يتعلّق الغرض بتقييده بوجه مخصوص لو لَم يراع تفوت الفائدة المطلوبة،<\/div><div class=\"tr\">Unrestricted statement is used where the purpose is not concerned with restricting the judgement in any way at all, so that the listener may take it in every possible direction; and restriction is used where the purpose is concerned with restricting it in a specific way which, if it were not observed, the intended benefit would be lost.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>When should you leave the judgement unrestricted, and when should you restrict it?<\/p><b>Leave it unrestricted<\/b> when you do not want to limit it in any way, so that the listener's mind can take it in every possible direction. \"Zayd gives\" leaves open what, to whom, when; the listener imagines all of it.<b>Restrict it<\/b> when a particular limit is essential, so that without it the listener would miss the point you intend.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 90<\/span><\/div><div class=\"ar\">ولتفصيل هذا الإجمال نقول: إنّ التقييد يكون بالمفاعيل ونحوها، والنواسخ، والشرط، والنفْي والتوابع وغير ذلك.<\/div><div class=\"tr\">To set out this summary in detail, we say: restriction is made by the objects (mafāʿīl) and the like, by the abrogators (nawāsikh), by the condition, by negation, by the appositives (tawābiʿ), and by other things.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>The book lists the things that restrict a judgement. Each one is taken in turn in the rest of the chapter: the objects and similar words, the <i>nawāsikh<\/i>, the condition, the negation, and the <i>tawābiʿ<\/i>.<\/p><\/div><div class=\"chartbox\"><div class=\"chh\">WAYS OF RESTRICTING A JUDGEMENT · DRAWN BY THE COMPANION<\/div><div class=\"tree\"><div class=\"node\">Taqyīd<span class=\"ar\">التقييد<\/span><\/div><div class=\"stem\"><\/div><div class=\"bar\" style=\"margin:0 10.00%\"><\/div><div class=\"row\"><div class=\"col\"><div class=\"node\">Objects etc.<span class=\"ar\">المفاعيل ونحوها<\/span><\/div><\/div><div class=\"col\"><div class=\"node\">Nawāsikh<span class=\"ar\">النواسخ<\/span><\/div><\/div><div class=\"col\"><div class=\"node\">Condition<span class=\"ar\">الشرط<\/span><\/div><\/div><div class=\"col\"><div class=\"node\">Negation<span class=\"ar\">النفي<\/span><\/div><\/div><div class=\"col\"><div class=\"node\">Tawābiʿ<span class=\"ar\">التوابع<\/span><\/div><\/div><\/div><\/div><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 91<\/span><\/div><div class=\"ar\">أمّا المفاعيل ونحوها؛ فالتقييد بها يكون لبيان نوع الفعل، أو ما وقع عليه، أو فيه، أو لأجله، أو بمقارنته، أو بيانِ المبهم من الهيئة والذات، أو بيانِ عدم شمول الحكم،<\/div><div class=\"tr\">As for the objects and the like: restriction by them is for explaining the kind of the action; or what it fell upon; or that in which it occurred; or that for the sake of which it occurred; or that in whose company it occurred; or for explaining what is vague, as to state (hayʾa) or essence (dhāt); or for explaining that the judgement does not cover everything.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>The objects (<i>mafāʿīl<\/i>) and words like them each add a particular piece of information to the action. In grammar terms:<\/p><p>the <i>mafʿūl muṭlaq<\/i> shows the <b>kind<\/b> of action (\"he struck a hard striking\"); the <i>mafʿūl bihi<\/i> shows <b>what it fell on<\/b>; the <i>mafʿūl fīhi<\/i> shows <b>when or where<\/b> it happened; the <i>mafʿūl lahu<\/i> shows <b>why<\/b>; the <i>mafʿūl maʿahu<\/i> shows <b>what accompanied it<\/b>; the <i>ḥāl<\/i> explains a vague <b>state<\/b>; the <i>tamyīz<\/i> explains a vague <b>thing<\/b>; and the <i>mustathnā<\/i> (exception) shows that the judgement <b>does not cover everyone<\/b>.<\/p><\/div><div class=\"chartbox\"><div class=\"chh\">WHAT EACH OBJECT ADDS · DRAWN BY THE COMPANION<\/div><table class=\"grid\"><thead><tr><th>Restriction<\/th><th>What it explains<\/th><\/tr><\/thead><tbody><tr><td>Mafʿūl muṭlaq ‎<span class=\"arin\">المفعول المطلق<\/span>‎<\/td><td>the kind of action<\/td><\/tr><tr><td>Mafʿūl bihi ‎<span class=\"arin\">المفعول به<\/span>‎<\/td><td>what the action fell on<\/td><\/tr><tr><td>Mafʿūl fīhi ‎<span class=\"arin\">المفعول فيه<\/span>‎<\/td><td>when or where it happened<\/td><\/tr><tr><td>Mafʿūl lahu ‎<span class=\"arin\">المفعول له<\/span>‎<\/td><td>why it happened<\/td><\/tr><tr><td>Mafʿūl maʿahu ‎<span class=\"arin\">المفعول معه<\/span>‎<\/td><td>what accompanied it<\/td><\/tr><tr><td>Ḥāl ‎<span class=\"arin\">الحال<\/span>‎<\/td><td>a vague state<\/td><\/tr><tr><td>Tamyīz ‎<span class=\"arin\">التمييز<\/span>‎<\/td><td>a vague thing<\/td><\/tr><tr><td>Istithnāʾ ‎<span class=\"arin\">الاستثناء<\/span>‎<\/td><td>that the judgement does not cover all<\/td><\/tr><\/tbody><\/table><div class=\"figcap\">The grammatical names are the companion's, to help match the book's list to what you learnt in naḥw.<\/div><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 91<\/span><\/div><div class=\"ar\">وتكون القيود محطّ الفائدة، والكلام بدونها كاذباً، أو غير مقصود بالذات، نحو: ﴿وَمَا خَلَقْنَا السَّمَاوَاتِ وَالأَرْضَ وَمَا بَيْنَهُمَا لاَعِبِيْنَ﴾ [الدخان: ٣٨].<\/div><div class=\"tr\">The restrictions are the focal point of the benefit, and the speech without them is false, or not what is intended in itself; e.g. ﴾And We did not create the heavens and the earth and what is between them in play﴿ [al-Dukhān 44:38].<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>An important point: often the restriction is <b>the whole point<\/b> of the sentence (<i>maḥaṭṭ al-fāʾidah<\/i>). Without it, the sentence would be false, or would not be what the speaker means.<\/p><p>Take the verse: \"We did not create the heavens and the earth and what is between them <i>in play<\/i>.\" Remove ‎<span class=\"arin\">لاَعِبِيْنَ<\/span>‎ and it would say \"We did not create the heavens and the earth\", which is false. The negation falls on the restriction: the creation happened, but not in play.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 92<\/span><\/div><div class=\"ar\">وأمّا النواسخ؛ فالتقييد بها يكون للأغراض الّتي تؤدّيها معاني ألفاظ النواسخ، كالاستمرار، أو الحكايةِ عن الزمن في «كان»، والتوقيتِ بزمن معيّن في «ظلّ»، و«بات»، و«أصبح»، و«أمسى»، و«أضحى»، أو بحالةٍ معيّنة في «دام»، والمقارَبةِ في «كاد» و«كَرَبَ» و«أوشك»، واليقينِ في «وجد» و«ألفى» و«درى» و«تعلّم»، وهَلُمَّ جرًّا،<\/div><div class=\"tr\">As for the abrogators: restriction by them is for the purposes conveyed by the meanings of the abrogating words, such as continuity, or narrating about time, in «kāna»; timing by a specific time in «ẓalla», «bāta», «aṣbaḥa», «amsā» and «aḍḥā», or by a specific state in «dāma»; approximation in «kāda», «karaba» and «awshaka»; certainty in «wajada», «alfā», «darā» and «taʿallam»; and so on.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>The <i>nawāsikh<\/i> are the words that enter on a <i>mubtadaʾ<\/i> and <i>khabar<\/i> and change their grammar. In <i>balāghah<\/i>, what matters is the <b>meaning<\/b> each adds:<\/p><p>‎<span class=\"arin\">كان<\/span>‎: continuity, or setting the statement in the past. ‎<span class=\"arin\">ظلّ<\/span>‎، ‎<span class=\"arin\">بات<\/span>‎، ‎<span class=\"arin\">أصبح<\/span>‎، ‎<span class=\"arin\">أمسى<\/span>‎، ‎<span class=\"arin\">أضحى<\/span>‎: tying it to a time of day (all day, all night, morning, evening, forenoon). ‎<span class=\"arin\">دام<\/span>‎: tying it to a state lasting. ‎<span class=\"arin\">كاد<\/span>‎، ‎<span class=\"arin\">كَرَبَ<\/span>‎، ‎<span class=\"arin\">أوشك<\/span>‎: nearness (it almost happened). ‎<span class=\"arin\">وجد<\/span>‎، ‎<span class=\"arin\">ألفى<\/span>‎، ‎<span class=\"arin\">درى<\/span>‎، ‎<span class=\"arin\">تعلّم<\/span>‎: certainty. \"And so on\" means the other <i>nawāsikh<\/i> work the same way.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 92–93<\/span><\/div><div class=\"ar\">فالجملة في هذا...... تنعقد من الاسم والخبر، أو من المفعولين فقط، فإذا قلت: «ظننتُ زيداً قائماً» فمعناه زيد قائم على وجه الظنّ.<\/div><div class=\"tr\">The sentence in this case is made up of the ism and the khabar, or of the two objects alone. So if you say «ẓanantu Zaydan qāʾiman» (“I thought Zayd standing”), its meaning is “Zayd is standing”, by way of thinking.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>With these words, the real sentence is still the <i>mubtadaʾ<\/i> and <i>khabar<\/i> (or, with verbs like ‎<span class=\"arin\">ظنّ<\/span>‎, the two objects). The <i>nāsikh<\/i> only colours it. ‎<span class=\"arin\">ظننتُ زيداً قائماً<\/span>‎ still means \"Zayd is standing\", but presented as what I <i>think<\/i>, not as certain fact.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 93<\/span><\/div><div class=\"ar\">وأمّا الشرط؛ فالتقييد به يكون للأغراض الّتي تؤدّيها معاني أدوات الشرط، كالزمان في «متى»، و«أيّان»، والمكانِ في «أين»، و«أنّى»، و«حيثما»، والحالِ في «كيفما»، واستيفاءُ ذلك وتحقيق الفرق بين الأدوات يُذكر في علم النحو،<\/div><div class=\"tr\">As for the condition: restriction by it is for the purposes conveyed by the meanings of the conditional particles, such as time in «matā» and «ayyāna», place in «ayna», «annā» and «ḥaythumā», and state in «kayfamā». A full account of this, and an exact statement of the differences between the particles, is given in the science of grammar (naḥw).<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>A <b>condition<\/b> restricts the judgement by making it depend on something: \"<i>When<\/i> you come, I will honour you\" means the honouring is tied to your coming. Each conditional word adds its own meaning: ‎<span class=\"arin\">متى<\/span>‎ and ‎<span class=\"arin\">أيّان<\/span>‎ tie it to a time, ‎<span class=\"arin\">أين<\/span>‎ and ‎<span class=\"arin\">أنّى<\/span>‎ and ‎<span class=\"arin\">حيثما<\/span>‎ to a place, ‎<span class=\"arin\">كيفما<\/span>‎ to a manner. The detailed differences belong to <i>naḥw<\/i>.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 93<\/span><\/div><div class=\"ar\">وإنّما يُفرّق هاهنا بين «إنْ» و«إذا» و«لو»؛ لاختصاصها بمزايا تعدّ من وجوه البلاغة،<\/div><div class=\"tr\">Here, only «in», «idhā» and «law» are distinguished, because they have particular merits that are counted among the aspects of eloquence (balāgha).<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><i>Balāghah<\/i> picks out three conditional words for special study, because choosing between them carries subtle meaning: ‎<span class=\"arin\">إنْ<\/span>‎، ‎<span class=\"arin\">إذا<\/span>‎ and ‎<span class=\"arin\">لو<\/span>‎.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 93–94<\/span><\/div><div class=\"ar\">فـ«إن» و«إذ» للشرط في الاستقبال، و«لو» للشرط في الْمُضِيِّ،<\/div><div class=\"tr\">So «in» and «idh[ā]» are for a condition in the future, and «law» is for a condition in the past.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>The first difference is <b>time<\/b>: ‎<span class=\"arin\">إنْ<\/span>‎ and ‎<span class=\"arin\">إذا<\/span>‎ are for a condition in the <b>future<\/b>; ‎<span class=\"arin\">لو<\/span>‎ is for a condition in the <b>past<\/b>.<\/p><\/div><div class=\"cnote\"><span class=\"cnh\">COMPANION&#8217;S NOTE · NOT IN THE BOOK<\/span><p>Misprint? The text here prints «إذ» (idh). The sentence before and the one after are about «إن» and «إذا», so the likely reading is «إذا» (idhā). The translation follows that reading.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 94<\/span><\/div><div class=\"ar\">والأصل في اللفظ أن يتبع المعنى، فيكون فعلاً مضارعاً مع «إن» و«إذا»، وماضياً مع «لو»، نحو: ﴿وَإِن يَسْتَغِيثُوا يُغَاثُوا بِمَاء كَالْمُهْلِ﴾ [الكهف: ٢٩]، «وإذا تردّ إلى قليل تقنع»، ﴿وَلَوْ شَاء لَهَدَاكُمْ أَجْمَعِينَ﴾ [النحل: ٩].<\/div><div class=\"tr\">The basic rule is that the wording follows the meaning; so [the condition] is a present-tense (muḍāriʿ) verb with «in» and «idhā», and a past-tense verb with «law». For example: ﴾And if they cry for help, they will be helped with water like molten metal﴿ [al-Kahf 18:29]; «And when you are brought back to a little, you are content»; ﴾And had He willed, He would have guided you all﴿ [al-Naḥl 16:9].<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>Since the words follow the meaning, the verb normally matches: with ‎<span class=\"arin\">إن<\/span>‎ and ‎<span class=\"arin\">إذا<\/span>‎ (future) the verb is <i>muḍāriʿ<\/i>; with ‎<span class=\"arin\">لو<\/span>‎ (past) it is <i>māḍī<\/i>. The book gives one example of each: ‎<span class=\"arin\">وَإِن يَسْتَغِيثُوا<\/span>‎، ‎<span class=\"arin\">وإذا تردّ<\/span>‎، ‎<span class=\"arin\">وَلَوْ شَاء<\/span>‎.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 94<\/span><\/div><div class=\"ar\">والفرق بين «إن» و«إذا» أنّ الأصل عدم الجزم بوقوع الشرط مع «إن»، والجزمُ بوقوعه مع «إذا»؛<\/div><div class=\"tr\">The difference between «in» and «idhā» is that the basic rule with «in» is that there is no certainty that the condition will occur, and with «idhā» there is certainty that it will occur.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>The second, more important difference is <b>certainty<\/b>. With ‎<span class=\"arin\">إن<\/span>‎ the speaker is <b>not sure<\/b> the condition will happen. With ‎<span class=\"arin\">إذا<\/span>‎ he <b>is sure<\/b> it will.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 94–95<\/span><\/div><div class=\"ar\">ولهذا غلب استعمال الماضي مع «إذا»، فكأنّ الشرط واقع بالفعل، بخلاف «إن»؛<\/div><div class=\"tr\">For this reason the past tense is mostly used with «idhā», as though the condition had actually happened; unlike «in».<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>This is why ‎<span class=\"arin\">إذا<\/span>‎ is often followed by a <b>past<\/b> verb, even about the future: something certain to happen is spoken of as if it had already happened. ‎<span class=\"arin\">إن<\/span>‎ does not do this, since its condition is in doubt.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 95<\/span><\/div><div class=\"ar\">فإذا قلت: «إن أبرء من مَرَضِيْ أتصدّق بألف دينار»، كنت شاكًّا في البرء، وإذا قلت: «إذا برئتُ من مَرَضِيْ تصدّقتُ»، كنتَ جازماً به أو كالجازم،<\/div><div class=\"tr\">So if you say, «If I recover from my illness, I shall give a thousand dinars in charity», you are in doubt about recovering; and if you say, «When I recover from my illness, I shall give in charity», you are certain of it, or like someone certain.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>Compare the two sentences. \"<i>If<\/i> I recover…\" (‎<span class=\"arin\">إن أبرء<\/span>‎) says you are unsure whether you will recover. \"<i>When<\/i> I recover…\" (‎<span class=\"arin\">إذا برئتُ<\/span>‎) says you are sure, or speak as though you were. Notice also the verbs: <i>muḍāriʿ<\/i> after ‎<span class=\"arin\">إن<\/span>‎, <i>māḍī<\/i> after ‎<span class=\"arin\">إذا<\/span>‎.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 95<\/span><\/div><div class=\"ar\">وعلى ذلك فالأحوال النادرة تذكر في حيّز «إن»، والكثيرةُ في حيّز «إذا»،<\/div><div class=\"tr\">On that basis, rare situations are mentioned within the scope of «in», and frequent ones within the scope of «idhā».<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>From this comes a rule of thumb: <b>rare<\/b> things are spoken of with ‎<span class=\"arin\">إن<\/span>‎; <b>frequent<\/b> things with ‎<span class=\"arin\">إذا<\/span>‎.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 95–96<\/span><\/div><div class=\"ar\">ومِن ذلك قوله تعالى: ﴿فَإِذَا جَاءتْهُمُ الْحَسَنَةُ قَالُوْا لَنَا هَـذِهِ وَإِن تُصِبْهُمْ سَيِّئَةٌ يَطَّيَّرُوْا بِمُوسَى وَمَن مَّعَهُ﴾ [الأعراف: ١٣١]؛ فلكون مجيء الحسنة محقّقاً؛ (إذ المراد بها مطلق الحسنة الشاملُ لأنواع كثيرة...... كما يفهم من التعريف بـ«أل الجنسيّة») ذُكر مع «إذا»، وعبّر عنه بالماضي،<\/div><div class=\"tr\">Among examples of this is the saying of Allah Most High: ﴾But when good came to them, they said, “This is ours”; and if an evil befell them, they ascribed it to the ill omen of Mūsā and those with him﴿ [al-Aʿrāf 7:131]. Because the coming of good is certain (since what is meant by it is good in general, which includes many kinds, as is understood from the definite article of the genus, «al al-jinsiyya»), it is mentioned with «idhā» and expressed with the past tense.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>This verse shows the rule beautifully. Pharaoh's people received good often and bad rarely.<\/p><b>Good<\/b>: ‎<span class=\"arin\">فَإِذَا جَاءتْهُمُ الْحَسَنَةُ<\/span>‎. The word is ‎<span class=\"arin\">إذا<\/span>‎ with a past verb, and ‎<span class=\"arin\">الْحَسَنَةُ<\/span>‎ has <i>al<\/i> of the genus, meaning good of every kind. So good things came to them certainly and often.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 96<\/span><\/div><div class=\"ar\">ولكون مجيء السيّئة نادراً (إذ المراد بها نوع مخصوص كما يفهم من التنكير، وهو الجدب) ذُكر مع «إن»، وعبّر عنه بالمضارع؛<\/div><div class=\"tr\">And because the coming of evil is rare (since what is meant by it is one specific kind, as is understood from its being indefinite, namely drought), it is mentioned with «in» and expressed with the present tense.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Bad<\/b>: ‎<span class=\"arin\">وَإِن تُصِبْهُمْ سَيِّئَةٌ<\/span>‎. The word is ‎<span class=\"arin\">إن<\/span>‎ with a <i>muḍāriʿ<\/i>, and ‎<span class=\"arin\">سَيِّئَةٌ<\/span>‎ is indefinite, meaning one particular kind of harm (the drought). So bad things came rarely.<\/div><div class=\"chartbox\"><div class=\"chh\">THE VERSE OF AL-AʿRĀF 7:131 · DRAWN BY THE COMPANION<\/div><table class=\"grid\"><thead><tr><th><\/th><th>Good<\/th><th>Bad<\/th><\/tr><\/thead><tbody><tr><td>Particle<\/td><td>‎<span class=\"arin\">إذا<\/span>‎: certain<\/td><td>‎<span class=\"arin\">إن<\/span>‎: doubtful<\/td><\/tr><tr><td>Verb<\/td><td>past: ‎<span class=\"arin\">جَاءتْهُمُ<\/span>‎<\/td><td>muḍāriʿ: ‎<span class=\"arin\">تُصِبْهُمْ<\/span>‎<\/td><\/tr><tr><td>Noun<\/td><td>with al of the genus: ‎<span class=\"arin\">الْحَسَنَةُ<\/span>‎, all kinds<\/td><td>indefinite: ‎<span class=\"arin\">سَيِّئَةٌ<\/span>‎, one kind<\/td><\/tr><tr><td>So it came…<\/td><td>often<\/td><td>rarely<\/td><\/tr><\/tbody><\/table><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 96<\/span><\/div><div class=\"ar\">ففي الآية من وصفهم بإنكار النعم وشدّة التحامل على موسى عليه السلام ما لا يخفى،<\/div><div class=\"tr\">So the verse plainly describes them as denying blessings and as being bitterly hostile towards Mūsā (peace be upon him).<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>And this shows their ingratitude: the good they received often, they claimed as their own (\"this is ours\"); the bad that touched them rarely, they blamed on Mūsā (peace be upon him) and those with him.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 96–97<\/span><\/div><div class=\"ar\">و«لو» للشرط في الْمُضِيِّ، ولذا يليها الفعل الماضي، نحو: ﴿وَلَوْ عَلِمَ اللّهُ فِيهِمْ خَيْراً لأسْمَعَهُمْ﴾ [الأنفال: ٢٣]،<\/div><div class=\"tr\">And «law» is for a condition in the past; for this reason the past-tense verb follows it, e.g. ﴾And had Allah known any good in them, He would have made them hear﴿ [al-Anfāl 8:23].<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>‎<span class=\"arin\">لو<\/span>‎ is for a condition in the <b>past<\/b>, so a past verb follows it. ‎<span class=\"arin\">وَلَوْ عَلِمَ اللّهُ فِيهِمْ خَيْراً لأسْمَعَهُمْ<\/span>‎: had there been good in them, He would have made them hear. The usual sense of ‎<span class=\"arin\">لو<\/span>‎ is that the condition did not happen, and so neither did the result.<\/p><\/div><div class=\"chartbox\"><div class=\"chh\">IN, IDHĀ AND LAW · DRAWN BY THE COMPANION<\/div><table class=\"grid\"><thead><tr><th><\/th><th>‎<span class=\"arin\">إن<\/span>‎<\/th><th>‎<span class=\"arin\">إذا<\/span>‎<\/th><th>‎<span class=\"arin\">لو<\/span>‎<\/th><\/tr><\/thead><tbody><tr><td>Time<\/td><td>future<\/td><td>future<\/td><td>past<\/td><\/tr><tr><td>The verb after it<\/td><td>muḍāriʿ<\/td><td>often māḍī<\/td><td>māḍī<\/td><\/tr><tr><td>Certainty<\/td><td>doubtful<\/td><td>certain<\/td><td>—<\/td><\/tr><tr><td>Used for<\/td><td>rare things<\/td><td>frequent things<\/td><td>the past<\/td><\/tr><\/tbody><\/table><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 97<\/span><\/div><div class=\"ar\">ومِمّا تقدّم يعلم أنّ المقصود بالذات من الجملة الشرطيّة هو الجواب، فإذا قلت: «إن اجتهد زيد أكرمته»، كنت مخبراً بأنّك ستكرمه، ولكنّ في حال حصول الاجتهاد لا في عموم الأحوال،<\/div><div class=\"tr\">From what has gone before, it is known that what is intended in itself in the conditional sentence is the answer (jawāb). So if you say, «If Zayd works hard, I will honour him», you are informing that you will honour him, but in the situation where hard work takes place, not in all situations.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>In a conditional sentence, the real statement is the <b>answer<\/b> (<i>jawāb<\/i>); the condition is a restriction on it. ‎<span class=\"arin\">إن اجتهد زيد أكرمته<\/span>‎ tells the listener \"I will honour Zayd\", restricted to one case: if he works hard.<\/p><\/div><div class=\"cnote\"><span class=\"cnh\">COMPANION&#8217;S NOTE · NOT IN THE BOOK<\/span><p>Misprint? The text prints «ولكنّ» (with a shadda) before «في حال». The likely reading is «ولكنْ», without the shadda.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 97<\/span><\/div><div class=\"ar\">ويتفرّع على هذا أنّها تعدّ خبريّة أو انشائيّة باعتبار جوابها.<\/div><div class=\"tr\">It follows from this that it [the conditional sentence] is counted as informative (khabariyya) or performative (inshāʾiyya) according to its answer.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>So whether a conditional sentence counts as a <i>khabar<\/i> or an <i>inshāʾ<\/i> depends on its answer. \"If he works hard, I will honour him\" is a <i>khabar<\/i>; \"If he works hard, honour him!\" is an <i>inshāʾ<\/i>.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 97<\/span><\/div><div class=\"ar\">وأمّا النفْي؛ فالتقييد به يكون بسلب النسبة على وجه مخصوص مِمّا تفيده أحرف النفْي، وهي ستّة: «لا» و«ما» و«إن» و«لن» و«لَمْ» و«لَمَّا»؛ فـ«لا» للنفْي مطلقاً، ......<\/div><div class=\"tr\">As for negation: restriction by it is by removing the attribution in a specific way, of the kinds that the particles of negation convey. They are six: «lā», «mā», «in», «lan», «lam» and «lammā». So «lā» is for negation without restriction, ……<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Negation<\/b> restricts the judgement by denying it in a particular way, and each negative particle has its own way. ‎<span class=\"arin\">لا<\/span>‎ denies without being tied to any particular time.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 98<\/span><\/div><div class=\"ar\">و«ما» و«إن» لنفْي الحال إن دخلا على المضارع، و«لن» لنفْي الاستقبال، و«لَمْ» و«لَمّا» لنفْي الْمُضِيِّ إلاّ أنّه بـ«لَمّا» ينسحب على زمن التكلّم، ويختصّ بالمتوقّع،<\/div><div class=\"tr\">… and «mā» and «in» are for negating the present, if they enter upon the imperfect (muḍāriʿ); «lan» is for negating the future; and «lam» and «lammā» are for negating the past, except that with «lammā» it [the negation] extends up to the time of speaking, and it is particular to what is expected.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>The others are tied to time: ‎<span class=\"arin\">ما<\/span>‎ and ‎<span class=\"arin\">إن<\/span>‎ with a <i>muḍāriʿ<\/i> deny the <b>present<\/b>; ‎<span class=\"arin\">لن<\/span>‎ denies the <b>future<\/b>; ‎<span class=\"arin\">لم<\/span>‎ and ‎<span class=\"arin\">لمّا<\/span>‎ deny the <b>past<\/b>.<\/p><p>But ‎<span class=\"arin\">لمّا<\/span>‎ has two special features: its negation <b>continues up to the moment of speaking<\/b> (\"not yet\"), and it is used for something <b>expected<\/b> to happen.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 98<\/span><\/div><div class=\"ar\">وعلى هذا فلا يقال: «لَمَّا يقم زيد ثُمّ قام»، ولا: «لَمَّا يجتمع النقيضان»، كما يقال: «لَم يقم ثُمّ قام»، و«لَم يجتمعا»؛ فـ«لَمّا» في النفْي تقابل «قد» في الإثبات، ......<\/div><div class=\"tr\">Accordingly, one does not say «lammā yaqum Zaydun thumma qāma» (Zayd has not yet stood, then he stood), nor «lammā yajtamiʿi al-naqīḍān» (the two contradictories have not yet come together), as one says «lam yaqum thumma qāma» (he did not stand, then he stood) and «lam yajtamiʿā» (they did not come together). So «lammā» in negation corresponds to «qad» in affirmation, ……<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>Because of these two features, some sentences are fine with ‎<span class=\"arin\">لم<\/span>‎ but wrong with ‎<span class=\"arin\">لمّا<\/span>‎:<\/p><p>‎<span class=\"arin\">لَم يقم ثُمّ قام<\/span>‎ (\"he did not stand, then he stood\") is fine. With ‎<span class=\"arin\">لمّا<\/span>‎ it is wrong, because ‎<span class=\"arin\">لمّا<\/span>‎ says he has <i>still<\/i> not stood, right up to now.<\/p><p>‎<span class=\"arin\">لَم يجتمعا<\/span>‎ (the two contradictories did not meet) is fine. With ‎<span class=\"arin\">لمّا<\/span>‎ it is wrong, because ‎<span class=\"arin\">لمّا<\/span>‎ suggests it is expected to happen, and two contradictories can never meet.<\/p><p>So ‎<span class=\"arin\">لمّا<\/span>‎ in negation is the opposite of ‎<span class=\"arin\">قد<\/span>‎ in affirmation: ‎<span class=\"arin\">قد قام<\/span>‎ means \"he has (just) stood\"; ‎<span class=\"arin\">لَمَّا يقم<\/span>‎ means \"he has not yet stood\".<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 99<\/span><\/div><div class=\"ar\">وحينئذٍ يكون منفيّها قريباً من الحال، فلا يصحّ «لَمّا يجئْ محمّد في العامّ الْماضي».<\/div><div class=\"tr\">So its negated [action] is then near to the present; hence «lammā yajiʾ Muḥammadun fī al-ʿām al-māḍī» (Muḥammad has not yet come, last year) is not correct.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>For the same reason, what ‎<span class=\"arin\">لمّا<\/span>‎ denies is close to the present. So you cannot say \"Muḥammad has not yet come <i>last year<\/i>\": \"last year\" cuts the time off in the past, while ‎<span class=\"arin\">لمّا<\/span>‎ stretches it up to now.<\/p><\/div><div class=\"chartbox\"><div class=\"chh\">THE PARTICLES OF NEGATION · DRAWN BY THE COMPANION<\/div><table class=\"grid\"><thead><tr><th>Particle<\/th><th>Denies<\/th><th>Note<\/th><\/tr><\/thead><tbody><tr><td>‎<span class=\"arin\">لا<\/span>‎<\/td><td>without time restriction<\/td><td><\/td><\/tr><tr><td>‎<span class=\"arin\">ما<\/span>‎، ‎<span class=\"arin\">إن<\/span>‎<\/td><td>the present<\/td><td>when on a muḍāriʿ<\/td><\/tr><tr><td>‎<span class=\"arin\">لن<\/span>‎<\/td><td>the future<\/td><td><\/td><\/tr><tr><td>‎<span class=\"arin\">لم<\/span>‎<\/td><td>the past<\/td><td><\/td><\/tr><tr><td>‎<span class=\"arin\">لمّا<\/span>‎<\/td><td>the past, up to now<\/td><td>only for something expected; opposite of ‎<span class=\"arin\">قد<\/span>‎<\/td><\/tr><\/tbody><\/table><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 99<\/span><\/div><div class=\"ar\">وأمّا التوابع؛ فالتقييد بها يكون للأغراض الّتي تقصد منها؛<\/div><div class=\"tr\">As for the appositives (tawābiʿ): restriction by them is for the purposes that are intended by them.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>Finally the <b>tawābiʿ<\/b>, the words that follow another word in its case: the adjective, the explanatory apposition, conjunction with a particle, and the substitute. Each restricts the judgement for its own purposes.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 99<\/span><\/div><div class=\"ar\">فالنعت يكون للتمييز، نحو: «حضر عليّ الكاتب»،<\/div><div class=\"tr\">So the adjective (naʿt) is for distinguishing, e.g. «Ḥaḍara ʿAliyyun al-kātibu» (ʿAlī the scribe came),<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>The <b>adjective<\/b> (<i>naʿt<\/i>) may <b>distinguish<\/b>: if there are several people named ʿAlī, ‎<span class=\"arin\">الكاتب<\/span>‎ tells you which one came.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 99<\/span><\/div><div class=\"ar\">والكشفِ، نحو: «الجسم الطويل العريض العميق يشغل حيّزاً من الفراغ»،<\/div><div class=\"tr\">and for unveiling (kashf), e.g. «al-jismu al-ṭawīlu al-ʿarīḍu al-ʿamīqu yashghalu ḥayyizan min al-farāgh» (body — the long, the broad, the deep — occupies a space of the void),<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>Or it may <b>unveil<\/b> (<i>kashf<\/i>): explain what the thing is. \"Long, broad, deep\" is not separating one body from others; it describes what any body is.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 99<\/span><\/div><div class=\"ar\">والتأكيدِ، نحو: ﴿تِلْكَ عَشَرَةٌ كَامِلَةٌ﴾ [البقرة: ١٩٦]، ......<\/div><div class=\"tr\">and for emphasis (taʾkīd), e.g. ﴾That is ten complete﴿ [al-Baqara 2:196], ……<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>Or it may <b>emphasise<\/b>: ‎<span class=\"arin\">كَامِلَةٌ<\/span>‎ in \"ten complete\" adds no new information (ten is ten), but it confirms the number.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 100<\/span><\/div><div class=\"ar\">والمدحِ، نحو: «حضر خالد الهمّام»، والذمِّ، نحو: ﴿وَامْرَأَتُهُ حَمَّالَةَ الْحَطَبِ﴾ [اللهب: ٤]، والترحّمِ، نحو: «ارحم إلى خالد المسكين».<\/div><div class=\"tr\">and for praise, e.g. «Ḥaḍara Khālidun al-hammāmu» (Khālid the high-minded came); and for blame, e.g. ﴾and his wife, the carrier of firewood﴿ [al-Lahab 111:4]; and for evoking pity, e.g. «irḥam ilā Khālidin al-miskīn» (have mercy on Khālid the poor one).<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>Or it may <b>praise<\/b> (‎<span class=\"arin\">الهمّام<\/span>‎, the high-minded), <b>blame<\/b> (‎<span class=\"arin\">حَمَّالَةَ الْحَطَبِ<\/span>‎, the carrier of firewood), or <b>evoke pity<\/b> (‎<span class=\"arin\">المسكين<\/span>‎, the poor one). In these cases the person is already known; the adjective adds a feeling, not information.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 100<\/span><\/div><div class=\"ar\">وعطف البيان يكون لِمجرّد التوضيح، نحو: «أقسم بالله أبو حفص عمر»، أو للتوضيح مع المدح، نحو: ﴿جَعَلَ اللَّهُ الْكَعْبَةَ الْبَيْتَ الْحَرَامَ قِياماً لِّلنَّاسِ﴾ [المائدة: ٩٧]،<\/div><div class=\"tr\">The explicative apposition (ʿaṭf al-bayān) is for mere clarification, e.g. «Aqsama bi-llāhi Abū Ḥafṣin ʿUmaru» (Abū Ḥafṣ, ʿUmar, swore by Allah); or for clarification together with praise, e.g. ﴾Allah has made the Kaʿba, the Sacred House, a means of support for mankind﴿ [al-Māʾida 5:97].<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>ʿAṭf al-bayān<\/b> explains the word before it. ‎<span class=\"arin\">أبو حفص عمر<\/span>‎: \"ʿUmar\" makes clear who Abū Ḥafṣ is. In ‎<span class=\"arin\">الْكَعْبَةَ الْبَيْتَ الْحَرَامَ<\/span>‎, \"the Sacred House\" explains the Kaʿbah and at the same time praises it.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 100<\/span><\/div><div class=\"ar\">ويكفي في التوضيح أن يوضّح الثاني الأوّلَ عند الاجتماع وإن لَم يكن أوضح منه عند الإنفراد،<\/div><div class=\"tr\">In clarifying, it is enough that the second clarifies the first when they come together, even if it is not clearer than it when taken alone,<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>For this to work, the second word does not have to be clearer than the first <b>on its own<\/b>. It is enough that, put together, the second makes the first clearer.<\/p><\/div><div class=\"cnote\"><span class=\"cnh\">COMPANION&#8217;S NOTE · NOT IN THE BOOK<\/span><p>Misprint? The text prints «الإنفراد» with a hamza under the alif. The likely reading is «الانفراد», with hamzat al-waṣl.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 101<\/span><\/div><div class=\"ar\">كـ«عليّ زين العابدين»، و«العسجد الذهب».<\/div><div class=\"tr\">as in «ʿAliyyun Zaynu al-ʿĀbidīn» (ʿAlī, Zayn al-ʿĀbidīn) and «al-ʿasjadu al-dhahabu» (al-ʿasjad, gold).<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>In ‎<span class=\"arin\">عليّ زين العابدين<\/span>‎, the title \"Zayn al-ʿĀbidīn\" picks out which ʿAlī is meant. In ‎<span
