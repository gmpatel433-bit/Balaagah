t is true; if he is not, it is false. So truth is about the match with reality, not about what the speaker believes.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 31<\/span><\/div><div class=\"ar\">ولكلّ جملة ركنان: محكوم عليه، ومحكوم بــه، ويسمّى الأوّل «مسنداً إليه»، كالفاعل، ونائبه، والمبتدأ الذي له خبر، ويسمّى الثاني «مسنداً» كالفعل، والمبتدأ المكتفى بمرفوعه.<\/div><div class=\"tr\">Every sentence has two pillars: that about which a judgement is made, and that which is judged of it. The first is called the “subject of predication” (<i>musnad ilayhi<\/i>), such as the agent, its deputy, and the subject that has a predicate. The second is called the “predicate” (<i>musnad<\/i>), such as the verb, and the subject that is content with what it puts in the nominative.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>Every sentence, whether statement or not, has two essential parts, which the book calls its <b>pillars<\/b> (<i>rukn<\/i>):<\/p><p>(1) The <b>musnad ilayhi<\/b>: what we are talking about, the thing a judgement is made on. In grammar this is the <i>fāʿil<\/i> (doer), the <i>nāʾib al-fāʿil<\/i> (subject of a passive verb), or the <i>mubtadaʾ<\/i> that has a <i>khabar<\/i>.<\/p><p>(2) The <b>musnad<\/b>: what we say about it. In grammar this is the verb, or the kind of <i>mubtadaʾ<\/i> that does not need a <i>khabar<\/i> because it is content with the noun it puts in the nominative (as in ‎<span class=\"arin\">أقائم الزيدان<\/span>‎).<\/p><p>These two terms will be used in almost every chapter of <i>ʿilm al-maʿānī<\/i>, so learn them well.<\/p><\/div><div class=\"chartbox\"><div class=\"chh\">THE TWO PILLARS OF A SENTENCE · DRAWN BY THE COMPANION<\/div><table class=\"grid\"><thead><tr><th><\/th><th>Musnad ilayhi ‎<span class=\"arin\">مسند إليه<\/span>‎<\/th><th>Musnad ‎<span class=\"arin\">مسند<\/span>‎<\/th><\/tr><\/thead><tbody><tr><td>What it is<\/td><td>What the judgement is made about<\/td><td>The judgement made about it<\/td><\/tr><tr><td>In grammar<\/td><td>fāʿil, nāʾib al-fāʿil, mubtadaʾ with a khabar<\/td><td>the verb; the mubtadaʾ content with its marfūʿ<\/td><\/tr><tr><td>In ‎<span class=\"arin\">سافر محمّد<\/span>‎<\/td><td>‎<span class=\"arin\">محمّد<\/span>‎<\/td><td>‎<span class=\"arin\">سافر<\/span>‎<\/td><\/tr><tr><td>In ‎<span class=\"arin\">عليّ مقيم<\/span>‎<\/td><td>‎<span class=\"arin\">عليّ<\/span>‎<\/td><td>‎<span class=\"arin\">مقيم<\/span>‎<\/td><\/tr><\/tbody><\/table><\/div><h3>DISCUSSION OF THE STATEMENT<span class=\"ar\">الكلام على الخبر<\/span><\/h3><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 32<\/span><\/div><div class=\"ar\">الخبر إمّا أن يكون جملة فعليّة أو اسميّة؛ فالأولى موضوعة لإفادة الحدوث في زمن مخصوص مع الاختصار، وقد تفيد الاستمرار التجدديّ بالقرائن إذا كان الفعل مضارعا، كقول طريف:<span class=\"bayt\"><span class=\"h1\">أَوَ كُلَّمَا وَرَدَتْ عُكَاظَ قَبِيْلَةٌ<\/span><span class=\"h2\">بَعَثُوْا إِلَيَّ عَرِيْفَهُمْ يَتَوَسَّمُ<\/span><\/span><\/div><div class=\"tr\">A statement is either a verbal sentence or a nominal one. The first is laid down to convey occurrence at a particular time, with brevity. With contextual indicators it may convey continuity by renewal, when the verb is imperfect (<i>muḍāriʿ<\/i>), as in the words of Ṭarīf:<br>“Is it so, that every time a tribe comes to ʿUkāẓ, they send their chief to me, scanning [my face]?”<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>Now the book looks closely at the statement. It can be a <b>verbal sentence<\/b> (beginning with a verb) or a <b>nominal sentence<\/b> (beginning with a noun), and each carries a different shade of meaning.<\/p><p>A verbal sentence tells us that something <b>happened<\/b> (<i>ḥudūth<\/i>) at a particular time: past, present or future, depending on the verb. It does this <b>briefly<\/b>, because the verb itself carries the time, with no extra word needed.<\/p><p>But when the verb is <i>muḍāriʿ<\/i> and the context supports it, the verbal sentence can mean something that keeps <b>happening again and again<\/b> (<i>istimrār tajaddudī<\/i>). In Ṭarīf's line, ‎<span class=\"arin\">بَعَثُوْا إِلَيَّ عَرِيْفَهُمْ يَتَوَسَّمُ<\/span>‎: every time a tribe comes to the fair of ʿUkāẓ, their chief keeps scanning his face, one look after another. The <i>muḍāriʿ<\/i> ‎<span class=\"arin\">يَتَوَسَّمُ<\/span>‎ together with ‎<span class=\"arin\">كُلَّمَا<\/span>‎ gives this sense of renewal.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 33<\/span><\/div><div class=\"ar\">والثانية موضوعة لمجرّد ثبوت المسند للمسند إليه، نحو: «الشمس مضيئة»، وقد تفيد الاستمرار بالقرائن إذا لم يكن في خبرها فعل، نحو: «العلم نافع».<\/div><div class=\"tr\">The second is laid down simply for the establishment of the predicate for the subject, as in “The sun is shining”. With contextual indicators it may convey continuity, when there is no verb in its predicate, as in “Knowledge is beneficial”.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>A <b>nominal sentence<\/b> simply tells us that the predicate is <b>established<\/b> for the subject (<i>thubūt<\/i>), with no idea of time or of something happening. ‎<span class=\"arin\">الشمس مضيئة<\/span>‎ (The sun is shining) just affirms brightness for the sun.<\/p><p>With the help of context, a nominal sentence whose predicate is not a verb can also mean <b>continuity<\/b> (<i>istimrār<\/i>): something permanently so. ‎<span class=\"arin\">العلم نافع<\/span>‎ (Knowledge is beneficial) means knowledge is always beneficial.<\/p><p>Compare the two kinds of continuity: the verbal sentence gives continuity by <b>renewal<\/b> (it happens again and again); the nominal sentence gives continuity that is <b>steady<\/b> (it is always so).<\/p><\/div><div class=\"chartbox\"><div class=\"chh\">VERBAL AND NOMINAL SENTENCES · DRAWN BY THE COMPANION<\/div><table class=\"grid\"><thead><tr><th><\/th><th>Verbal ‎<span class=\"arin\">جملة فعليّة<\/span>‎<\/th><th>Nominal ‎<span class=\"arin\">جملة اسمية<\/span>‎<\/th><\/tr><\/thead><tbody><tr><td>Basic meaning<\/td><td>Something happened at a particular time, briefly<\/td><td>The predicate is established for the subject<\/td><\/tr><tr><td>With context<\/td><td>Continuity by renewal, if the verb is muḍāriʿ<\/td><td>Steady continuity, if the predicate is not a verb<\/td><\/tr><tr><td>Book's example<\/td><td>‎<span class=\"arin\">يَتَوَسَّمُ<\/span>‎<\/td><td>‎<span class=\"arin\">العلم نافع<\/span>‎<\/td><\/tr><\/tbody><\/table><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 33<\/span><\/div><div class=\"ar\">والأصل في الخبر أن يلقى لإفادة المخاطبِ الحكمَ الذي تضمّنه الجملة، كما في قولنا: «حضر الأمــير»، أو لإفادة أنّ المتكلّم عالم به، نحو: «أنت حضرت أمس»، ويسمّى الحكم «فائدةَ الخبر»، وكونُ المتكلّم عالِماً به «لازمَ الفائدة».<\/div><div class=\"tr\">The basic rule for a statement is that it is delivered to inform the addressee of the judgement the sentence contains, as in our saying “The governor has arrived”; or to inform him that the speaker knows it, as in “You were present yesterday”. The judgement is called “the benefit of the statement” (<i>fāʾidat al-khabar<\/i>), and the speaker’s knowing it is called “the concomitant of the benefit” (<i>lāzim al-fāʾidah<\/i>).<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>Why do we make statements at all? The book gives the two basic purposes.<\/p><p>(1) To give the listener the information in the sentence. If someone does not know the governor has come, you tell him ‎<span class=\"arin\">حضر الأمــير<\/span>‎. This information is called the <b>benefit of the statement<\/b> (<i>fāʾidat al-khabar<\/i>).<\/p><p>(2) To let the listener know that <b>you know it<\/b>. If you say to someone ‎<span class=\"arin\">أنت حضرت أمس<\/span>‎ (You were present yesterday), you are not telling him anything new; he knows he was there. You are telling him that <i>you<\/i> know. This is called the <b>concomitant of the benefit<\/b> (<i>lāzim al-fāʾidah<\/i>), because whenever a speaker gives information, it follows that he knows it.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 34<\/span><\/div><div class=\"ar\">وقد يلقى الخبر لأغراض أخرى:<\/div><div class=\"tr\">A statement may be delivered for other purposes:<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>Besides those two basic purposes, a statement is often used for other aims, where the speaker is not trying to inform anyone. The book lists six. In each one, ask: does the speaker really want to tell the listener something new? If not, what is he really doing?<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 34<\/span><\/div><div class=\"ar\">(١) كالاسترحام في قول موسى عليه السلام: ﴿رَبِّ إِنِّي لِمَا أَنزَلْتَ إِلَيَّ مِنْ خَيْرٍ فَقِيرٌ﴾ [القصص: ٢٤].<\/div><div class=\"tr\">(1) Such as seeking mercy, in the words of Mūsā (peace be upon him): “My Lord, I am in need of whatever good You send down to me” [al-Qaṣaṣ 28:24].<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>Mūsā (peace be upon him) is speaking to Allah, who knows everything; so the statement \"I am in need\" is not meant to inform. Its real purpose is to <b>ask for mercy<\/b> (<i>istirḥām<\/i>): by stating his need, he is humbly asking Allah to fulfil it.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 34<\/span><\/div><div class=\"ar\">(٢) وإظهارِ الضعف في قول زكريّا عليه السلام: ﴿قَالَ رَبِّ إِنِّي وَهَنَ الْعَظْمُ مِنِّي﴾ [مريم : ٤].<\/div><div class=\"tr\">(2) And showing weakness, in the words of Zakariyyā (peace be upon him): “He said: My Lord, the bone has grown feeble in me” [Maryam 19:4].<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>Zakariyyā (peace be upon him) tells Allah that his bones have grown weak. Again, Allah already knows; the purpose is to <b>show his weakness<\/b> (<i>iẓhār al-ḍaʿf<\/i>) and humility before his Lord as he asks Him for a child.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 34–35<\/span><\/div><div class=\"ar\">(٣) وإظهارِ التحسّر في قول امرأة عمران: ﴿فَلَمَّا وَضَعَتْهَا قَالَتْ رَبِّ إِنِّي وَضَعْتُهَا أُنثَى وَاللّهُ أَعْلَمُ بِمَا وَضَعَتْ﴾ [آل عمران : ٣٦].<\/div><div class=\"tr\">(3) And showing regret, in the words of the wife of ʿImrān: “Then when she delivered her, she said: My Lord, I have delivered a female — and Allah knows best what she delivered” [Āl ʿImrān 3:36].<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>The wife of ʿImrān had hoped for a son to serve in the place of worship. When she says \"I have delivered a female\", she is not informing Allah, as the verse itself says, \"Allah knows best what she delivered\". The statement expresses her <b>regret<\/b> (<i>taḥassur<\/i>) that what she hoped for did not happen.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 35<\/span><\/div><div class=\"ar\">(٤) وإظهارِ الفرح بمقبِل والشماتة بمدبِر في قولك: ﴿جَاء الْحَقُّ وَزَهَقَ الْبَاطِلُ﴾ [بني إسرائيل: ٨١].<\/div><div class=\"tr\">(4) And showing joy at what is advancing and gloating over what is retreating, in your saying: “The truth has come and falsehood has perished” [Banī Isrāʾīl 17:81].<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>\"The truth has come and falsehood has perished\" is said not to inform anyone but to <b>express joy<\/b> at the truth that is arriving and <b>gloating<\/b> over the falsehood that is leaving. Both feelings are carried by one statement.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 35<\/span><\/div><div class=\"ar\">(٥) وإظهارِ السرور في قولك: «أخذتُ جائزة التقدّم» لِمَن يعلم ذلك.<\/div><div class=\"tr\">(5) And showing delight, in your saying “I have received the prize for coming first” to someone who knows that.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>If someone already knows that you won the prize for coming first, then telling him \"I have received the prize\" gives him no new information. The book adds the words \"to someone who knows that\" exactly to show this. Your real purpose is to <b>show your delight<\/b> (<i>surūr<\/i>).<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 35<\/span><\/div><div class=\"ar\">(٦) والتوبيخِ في قولك للعاثر: «الشمس طالعة».<\/div><div class=\"tr\">(6) And rebuke, in your saying to someone who has stumbled: “The sun is up.”<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>\"The sun is up\" said to someone who has just tripped over is not news: he can see the sun. The statement is a <b>rebuke<\/b> (<i>tawbīkh<\/i>): it is daylight, so how could you stumble? Be more careful.<\/p><\/div><div class=\"chartbox\"><div class=\"chh\">PURPOSES OF A STATEMENT · DRAWN BY THE COMPANION<\/div><table class=\"grid\"><thead><tr><th>Purpose<\/th><th>Book's example<\/th><\/tr><\/thead><tbody><tr><td>Fāʾidat al-khabar: to inform ‎<span class=\"arin\">فائدة الخبر<\/span>‎<\/td><td>‎<span class=\"arin\">حضر الأمــير<\/span>‎<\/td><\/tr><tr><td>Lāzim al-fāʾidah: to show the speaker knows ‎<span class=\"arin\">لازمَ الفائدة<\/span>‎<\/td><td>‎<span class=\"arin\">أنت حضرت أمس<\/span>‎<\/td><\/tr><tr><td>Seeking mercy ‎<span class=\"arin\">الاسترحام<\/span>‎<\/td><td>Mūsā's words, al-Qaṣaṣ 28:24<\/td><\/tr><tr><td>Showing weakness ‎<span class=\"arin\">إظهارِ الضعف<\/span>‎<\/td><td>Zakariyyā's words, Maryam 19:4<\/td><\/tr><tr><td>Showing regret ‎<span class=\"arin\">إظهارِ التحسّر<\/span>‎<\/td><td>the wife of ʿImrān, Āl ʿImrān 3:36<\/td><\/tr><tr><td>Joy and gloating ‎<span class=\"arin\">إظهار الفرح والشماتة<\/span>‎<\/td><td>Banī Isrāʾīl 17:81<\/td><\/tr><tr><td>Showing delight ‎<span class=\"arin\">إظهارِ السرور<\/span>‎<\/td><td>‎<span class=\"arin\">أخذتُ جائزة التقدّم<\/span>‎<\/td><\/tr><tr><td>Rebuke ‎<span class=\"arin\">التوبيخ<\/span>‎<\/td><td>‎<span class=\"arin\">الشمس طالعة<\/span>‎<\/td><\/tr><\/tbody><\/table><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 35–36<\/span><\/div><div class=\"ar\"><b>أضرب الخبر<\/b>: حيث كان قصد المخبر بخبره إفادةَ المخاطَب، ينبغي أن يقتصر من الكلام على قدر الحاجة؛ حذراً من اللغو، فإن كان المخاطب خالِيَ الذهن من الحكم ألقي إليه الخبر مجرّداً عن التأكيد، نحو: «أخوك قادم»،<\/div><div class=\"tr\"><b>The kinds of statement:<\/b> since the aim of the one making a statement is to inform the addressee, he ought to confine his speech to the measure of need, guarding against pointless excess. If the addressee’s mind is empty of the judgement, the statement is delivered to him free of emphasis, as in “Your brother is arriving”;<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>Now comes one of the best-known rules in <i>ʿilm al-maʿānī<\/i>: how much <b>emphasis<\/b> (<i>tawkīd<\/i>) a statement needs. The principle is to say only as much as is needed. Extra emphasis for a listener who does not need it is pointless excess (<i>laghw<\/i>).<\/p><p>The first case: the listener's mind is <b>empty<\/b> of the matter; he has no idea and no doubt. Then you tell him plainly, with no emphasis: ‎<span class=\"arin\">أخوك قادم<\/span>‎ (Your brother is arriving).<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 36<\/span><\/div><div class=\"ar\">وإن كان متردّداً فيــه، طالباً لمعرفته حسن توكيده، نحو: «إنّ أخاك قــادم»،<\/div><div class=\"tr\">if he is hesitant about it, seeking to know it, it is good to emphasise it, as in “Indeed your brother is arriving”;<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>The second case: the listener is <b>hesitant<\/b>. He has heard something and wants to be sure. Here it is good to add one emphasiser to remove his doubt: ‎<span class=\"arin\">إنّ أخاك قادم<\/span>‎. Note the book says it is <i>good<\/i> (<i>ḥasuna<\/i>), not required.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 36–37<\/span><\/div><div class=\"ar\">وإن كــان منكِراً وجب توكيده بمؤكّد أو مؤكّدين أو أكثرَ حسبَ درجــة الإنكار، ...... نحو: «إنّ أخاك قادم»، و«إنّه لقادم»، أو «واللهِ! إنّه لقادم».<\/div><div class=\"tr\">and if he denies it, it must be emphasised with one emphasiser, or two, or more, according to the degree of the denial, as in “Indeed your brother is arriving”, “Indeed he is surely arriving”, or “By Allah! Indeed he is surely arriving.”<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>The third case: the listener <b>denies<\/b> it. Now emphasis is <b>required<\/b> (<i>wajaba<\/i>), and the stronger his denial, the more emphasis you use. The book shows the steps: one emphasiser, ‎<span class=\"arin\">إنّ أخاك قادم<\/span>‎; two, ‎<span class=\"arin\">إنّه لقادم<\/span>‎ (<i>inna<\/i> and the <i>lām<\/i>); three, ‎<span class=\"arin\">واللهِ! إنّه لقادم<\/span>‎ (an oath as well).<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 37<\/span><\/div><div class=\"ar\">فالخبر بالنسبة لخلوّه من التوكيد، واشتماله عليه ثلاثة أضرب كما رأيت، ويسمّى الضرب الأوّل «ابتدائيًّا»، والثاني «طلبيًّا»، والثالث «إنكاريًّا».<\/div><div class=\"tr\">So a statement, in respect of being free of emphasis or containing it, is of three kinds, as you have seen. The first kind is called “initial” (<i>ibtidāʾī<\/i>), the second “requested” (<i>ṭalabī<\/i>), and the third “denial-answering” (<i>inkārī<\/i>).<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>So statements come in three kinds according to the listener. The names are worth learning by heart, together with the listener each one suits.<\/p><\/div><div class=\"chartbox\"><div class=\"chh\">THE THREE KINDS OF STATEMENT · DRAWN BY THE COMPANION<\/div><table class=\"grid\"><thead><tr><th>The listener<\/th><th>Emphasis<\/th><th>Name<\/th><th>Book's example<\/th><\/tr><\/thead><tbody><tr><td>Mind empty of the matter ‎<span class=\"arin\">خالِيَ الذهن<\/span>‎<\/td><td>None<\/td><td>Ibtidāʾī ‎<span class=\"arin\">ابتدائي<\/span>‎<\/td><td>‎<span class=\"arin\">أخوك قادم<\/span>‎<\/td><\/tr><tr><td>Hesitant, seeking to know ‎<span class=\"arin\">متردّد<\/span>‎<\/td><td>Good to add one<\/td><td>Ṭalabī ‎<span class=\"arin\">طلبي<\/span>‎<\/td><td>‎<span class=\"arin\">إنّ أخاك قادم<\/span>‎<\/td><\/tr><tr><td>Denying ‎<span class=\"arin\">منكِر<\/span>‎<\/td><td>Required, by degree of denial<\/td><td>Inkārī ‎<span class=\"arin\">إنكاري<\/span>‎<\/td><td>‎<span class=\"arin\">واللهِ! إنّه لقادم<\/span>‎<\/td><\/tr><\/tbody><\/table><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 37<\/span><\/div><div class=\"ar\">ويكون التوكيد بـ«إنّ»، و«أنّ»، و«لام الابتداء»، و«أحرف التنبيه»، و«القسم»، و«نوني التأكيد»، و«الحروف الزائدة»، و«التكرير»، و«قد»، و«أمّا» الشرطيّة.<\/div><div class=\"tr\">Emphasis is made with “inna”, “anna”, the “lām of commencement”, the “particles of alerting”, the “oath”, the “two nūns of emphasis”, the “extra particles”, “repetition”, “qad”, and conditional “ammā”.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>The book lists the tools of emphasis. A few examples to help you recognise them: <i>inna<\/i> and <i>anna<\/i>; the <i>lām al-ibtidāʾ<\/i> as in ‎<span class=\"arin\">لقادم<\/span>‎; particles of alerting such as ‎<span class=\"arin\">ألا<\/span>‎ and ‎<span class=\"arin\">أمّا<\/span>‎; an oath such as ‎<span class=\"arin\">والله<\/span>‎; the two <i>nūn<\/i>s of emphasis, heavy and light, on a verb; extra particles such as the <i>bāʾ<\/i> in a negative sentence; repeating the sentence; ‎<span class=\"arin\">قد<\/span>‎ with a verb; and conditional ‎<span class=\"arin\">أمّا<\/span>‎.<\/p><p>When you meet an emphasised statement in a text, count its emphasisers and ask what kind of listener the speaker had in mind.<\/p><\/div><h3>DISCUSSION OF NON-STATEMENT<span class=\"ar\">الكلام على الإنشاء<\/span><\/h3><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 38<\/span><\/div><div class=\"ar\">الإنشاء إمّا طلبيّ أو غير طلبيّ؛ فالطلبيّ مــا يــستدعي مطلوبا غير حاصل وقت الطلب، وغير الطلبيّ ما ليس كذلك.<\/div><div class=\"tr\">Non-statement is either requesting (<i>ṭalabī<\/i>) or non-requesting. The requesting kind is that which calls for something requested that has not been obtained at the time of the request; the non-requesting kind is that which is not so.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>The book now turns to the <i>inshāʾ<\/i>, and divides it into two kinds.<\/p><b>Requesting<\/b> (<i>ṭalabī<\/i>): the speaker asks for something that does <b>not yet exist<\/b> at the moment he asks. If you say \"Stand!\", the standing has not yet happened.<b>Non-requesting<\/b> (<i>ghayr ṭalabī<\/i>): an <i>inshāʾ<\/i> that does not ask for anything, such as an exclamation of wonder or an oath. The book deals with this kind briefly at the end of the chapter.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 38<\/span><\/div><div class=\"ar\">والأوّل يكون بخمسة أشياء: الأمر، والنهي، والاستفهام، والتمنّي، والنداء.<\/div><div class=\"tr\">The first is made with five things: the command, the prohibition, the question, wishing, and calling.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>The requesting <i>inshāʾ<\/i> has five types, and the rest of this chapter goes through them one by one: the command (<i>amr<\/i>), the prohibition (<i>nahy<\/i>), the question (<i>istifhām<\/i>), wishing (<i>tamannī<\/i>) and calling (<i>nidāʾ<\/i>).<\/p><\/div><div class=\"chartbox\"><div class=\"chh\">THE DIVISIONS OF INSHĀʾ · DRAWN BY THE COMPANION<\/div><div class=\"tree\"><div class=\"node\">Inshāʾ<span class=\"ar\">الإنشاء<\/span><\/div><div class=\"stem\"><\/div><div class=\"bar\" style=\"margin:0 25.00%\"><\/div><div class=\"row\"><div class=\"col\"><div class=\"node\">Ṭalabī<span class=\"ar\">طلبي<\/span><\/div><div class=\"stem\"><\/div><div class=\"bar\" style=\"margin:0 10.00%\"><\/div><div class=\"row\"><div class=\"col\"><div class=\"node\">Amr<span class=\"ar\">الأمر<\/span><\/div><\/div><div class=\"col\"><div class=\"node\">Nahy<span class=\"ar\">النهي<\/span><\/div><\/div><div class=\"col\"><div class=\"node\">Istifhām<span class=\"ar\">الاستفهام<\/span><\/div><\/div><div class=\"col\"><div class=\"node\">Tamannī<span class=\"ar\">التمنّي<\/span><\/div><\/div><div class=\"col\"><div class=\"node\">Nidāʾ<span class=\"ar\">النداء<\/span><\/div><\/div><\/div><\/div><div class=\"col\"><div class=\"node\">Ghayr ṭalabī<span class=\"ar\">غير طلبي<\/span><\/div><div class=\"sub\">e.g. wonder, oath<\/div><\/div><\/div><\/div><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 38–39<\/span><\/div><div class=\"ar\">أمّا الأمر فهو طلب الفعل على وجه الاستعلاء، وله أربع صيغ: فعل الأمر، نحو: ﴿خُذِ الْكِتَابَ بِقُوَّةٍ﴾ [مريم: ١٢]، والمضارع المقرون باللام، نحو: ﴿لِيُنفِقْ ذُو سَعَةٍ مِّن سَعَتِهِ﴾ [الطلاق: ٧]، واسم فعل الأمر، نحو: «حيّ على الفلاح»، والمصدر النائب عن فعل الأمر، نحو: «سعيا في الخير».<\/div><div class=\"tr\">As for the command, it is the request for an action from a position of superiority (<i>istiʿlāʾ<\/i>). It has four forms: the imperative verb, as in “Take hold of the Book with strength” [Maryam 19:12]; the imperfect verb joined to the lām, as in “Let the man of plenty spend from his plenty” [al-Ṭalāq 65:7]; the verbal noun of command, as in “Come to success” (<i>ḥayya ʿalā al-falāḥ<\/i>); and the verbal noun standing in for the imperative verb, as in “Strive in good!” (<i>saʿyan fī al-khayr<\/i>).<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>A <b>command<\/b> (<i>amr<\/i>) is asking for an action <b>from a position of superiority<\/b> (<i>istiʿlāʾ<\/i>): the speaker speaks as one above the listener, whether or not he really is. That condition is what will separate a true command from a supplication or a request between equals, which come next.<\/p><p>The four forms of command, with the book's examples:<\/p><p>(1) The imperative verb: ‎<span class=\"arin\">خُذِ<\/span>‎ in ‎<span class=\"arin\">﴿خُذِ الْكِتَابَ بِقُوَّةٍ﴾<\/span>‎.<\/p><p>(2) The <i>muḍāriʿ<\/i> with the <i>lām<\/i> of command: ‎<span class=\"arin\">لِيُنفِقْ<\/span>‎.<\/p><p>(3) A noun with the meaning of a command verb (<i>ism fiʿl al-amr<\/i>): ‎<span class=\"arin\">حيّ<\/span>‎ in ‎<span class=\"arin\">حيّ على الفلاح<\/span>‎, meaning <i>come<\/i>.<\/p><p>(4) A <i>maṣdar<\/i> standing in place of the command verb: ‎<span class=\"arin\">سعيا في الخير<\/span>‎, meaning <i>strive in good<\/i>.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 39<\/span><\/div><div class=\"ar\">وقد تخرج صيغ الأمر عن معناها الأصليّ إلى معانٍ أخر تفهم من سياق الكلام وقرائن الأحوال:<\/div><div class=\"tr\">The forms of command may leave their original meaning for other meanings, understood from the context of the speech and the indications of the situation:<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>This is a very important idea that will return again and again: a form can leave its <b>original meaning<\/b> and be used for another meaning. The listener knows this from the <b>context<\/b> (<i>siyāq<\/i>) and the <b>circumstances<\/b>. The book now lists twelve such meanings for the command form. For each, ask who is speaking to whom, and whether a real command makes sense.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 39<\/span><\/div><div class=\"ar\">(١) كالدعاء، نحو: ﴿أَوْزِعْنِي أَنْ أَشْكُرَ نِعْمَتَكَ﴾ [النمل: ١٩].<\/div><div class=\"tr\">(1) Such as supplication, as in “Inspire me to be grateful for Your favour” [al-Naml 27:19].<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Supplication<\/b> (<i>duʿāʾ<\/i>): when the form of command is addressed by someone lower to someone higher, it cannot be a command; it is a prayer. Here Sulaymān (peace be upon him) is addressing Allah: ‎<span class=\"arin\">أَوْزِعْنِي<\/span>‎ is a request to his Lord.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 39<\/span><\/div><div class=\"ar\">(٢) والالتماسِ، كقولك لِمَن يساويك: «أعطني الكتاب».<\/div><div class=\"tr\">(2) And entreaty, as in your saying to someone who is your equal: “Give me the book.”<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Entreaty<\/b> (<i>iltimās<\/i>): the form of command addressed to an <b>equal<\/b>. \"Give me the book\" said to a classmate is a polite request, not an order, because the speaker is not above him.<\/div><div class=\"chartbox\"><div class=\"chh\">THE SAME FORM, THREE MEANINGS · DRAWN BY THE COMPANION<\/div><table class=\"grid\"><thead><tr><th>Speaker → listener<\/th><th>Meaning of the form<\/th><\/tr><\/thead><tbody><tr><td>Higher → lower (or speaking as higher)<\/td><td>Command ‎<span class=\"arin\">الأمر<\/span>‎<\/td><\/tr><tr><td>Equal → equal<\/td><td>Entreaty ‎<span class=\"arin\">الالتماس<\/span>‎<\/td><\/tr><tr><td>Lower → higher<\/td><td>Supplication ‎<span class=\"arin\">الدعاء<\/span>‎<\/td><\/tr><\/tbody><\/table><div class=\"figcap\">This rule applies to the prohibition as well.<\/div><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 39–40<\/span><\/div><div class=\"ar\">(٣) والتمنّيْ، نحو:<span class=\"bayt\"><span class=\"h1\">أَلاَ أَيُّهَا اللَيْلُ الطَوِيْلُ أَلاَ انْجَلِيْ<\/span><span class=\"h2\">بِصُبْحٍ وَمَا الإِصْبَاحُ مِنْكَ بِأَمْثَلِ<\/span><\/span><\/div><div class=\"tr\">(3) And wishing, as in:<br>“O long night, will you not clear away into a morning? — and the morning is no better than you.”<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Wishing<\/b> (<i>tamannī<\/i>): the poet, sleepless with grief, orders the night ‎<span class=\"arin\">انْجَلِيْ<\/span>‎, <i>clear away<\/i>. But the night cannot hear or obey. The form of command is used to express a wish that is out of reach: he wishes the long night would end, and then he adds that even the morning will be no better for him.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 40<\/span><\/div><div class=\"ar\">(٤) والإرشادِ، نحو: ﴿إِذَا تَدَايَنتُم بِدَيْنٍ إِلَى أَجَلٍ مُّسَمًّى فَاكْتُبُوهُ وَلْيَكْتُب بَّيْنَكُمْ كَاتِبٌ بِالْعَدْلِ﴾ [البقرة: ٢٨٢].<\/div><div class=\"tr\">(4) And guidance, as in “When you contract a debt for a fixed term, write it down, and let a scribe write it between you with justice” [al-Baqarah 2:282].<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Guidance<\/b> (<i>irshād<\/i>): the verse about writing down debts is advice for the people's own good, to protect their rights. It guides them to what is best for them.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 40<\/span><\/div><div class=\"ar\">(٥) والتهديدِ، نحو: ﴿اعْمَلُوا مَا شِئْتُمْ﴾ [فصلت: ٤٠].<\/div><div class=\"tr\">(5) And threat, as in “Do what you will” [Fuṣṣilat 41:40].<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Threat<\/b> (<i>tahdīd<\/i>): \"Do what you will\" is not permission to do wrong. Said to those who reject the truth, it warns them that they will be answerable for whatever they do.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 40<\/span><\/div><div class=\"ar\">(٦) والتعجيزِ، نحو:<span class=\"bayt\"><span class=\"h1\">يَالَبَكْرُ أَنْشِرُوْا لِيْ كُلَيْباً<\/span><span class=\"h2\">يَالَبَكْرُ أَيْنَ أَيْنَ الْفِرَارُ<\/span><\/span><\/div><div class=\"tr\">(6) And showing inability, as in:<br>“O Bakr, bring Kulayb back to life for me! O Bakr, where, where is the escape?”<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Showing inability<\/b> (<i>taʿjīz<\/i>): the poet orders the tribe of Bakr to bring Kulayb back to life, knowing they cannot. The command shows them they are powerless, and so they have no escape from his revenge.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 41<\/span><\/div><div class=\"ar\">(٧) والإهانةِ، نحو: ﴿كُونُوا حِجَارَةً أَوْ حَدِيداً﴾ [بني إسرائيل: ٥٠].<\/div><div class=\"tr\">(7) And humiliation, as in “Be stones or iron” [Banī Isrāʾīl 17:50].<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Humiliation<\/b> (<i>ihānah<\/i>): those who denied the resurrection are told \"Be stones or iron\". They cannot become stones; the command belittles them. Even if they were as hard as stone or iron, they would still be brought back.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 41<\/span><\/div><div class=\"ar\">(٨) والإباحةِ، نحو: ﴿كُلُوا وَاشْرَبُواْ﴾ [البقرة: ٦٠].<\/div><div class=\"tr\">(8) And permission, as in “Eat and drink” [al-Baqarah 2:60].<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Permission<\/b> (<i>ibāḥah<\/i>): \"Eat and drink\" does not oblige anyone to eat; it means they are allowed to.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 41<\/span><\/div><div class=\"ar\">(٩) والامتنانِ، نحو: ﴿وَكُلُوا مِمَّا رَزَقَكُمُ اللّهُ﴾ [المائدة: ٨٨].<\/div><div class=\"tr\">(9) And reminding of a favour, as in “And eat of what Allah has provided you” [al-Māʾidah 5:88].<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Reminding of a favour<\/b> (<i>imtinān<\/i>): \"Eat of what Allah has provided you\" reminds the listener of Allah's blessing in giving them provision.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 41<\/span><\/div><div class=\"ar\">(١٠) والتخييرِ، نحو: «خذ هذا أو ذاك».<\/div><div class=\"tr\">(10) And giving a choice, as in “Take this or that.”<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Giving a choice<\/b> (<i>takhyīr<\/i>): \"Take this or that\" lets the listener choose one of the two, not both.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 41<\/span><\/div><div class=\"ar\">(١١) والتسويةِ، نحو: ﴿فَاصْبِرُوا أَوْ لاَ تَصْبِرُوا﴾ [الطور: ١٦].<\/div><div class=\"tr\">(11) And making two things equal, as in “Be patient or do not be patient” [al-Ṭūr 52:16].<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Making equal<\/b> (<i>taswiyah<\/i>): \"Be patient or do not be patient\" is said to the people of the Fire. It means both are the same for them: patience or impatience will not change their punishment.<p>Compare this with giving a choice: in <i>takhyīr<\/i> the listener may pick one of two; in <i>taswiyah<\/i> it makes no difference which he picks.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 41<\/span><\/div><div class=\"ar\">(١٢) والإكرامِ، نحو: ﴿وَادْخُلُوهَا بِسَلاَمٍ آمِنِينَ﴾ [الحجر: ٤٦].<\/div><div class=\"tr\">(12) And honouring, as in “Enter it in peace, secure” [al-Ḥijr 15:46].<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Honouring<\/b> (<i>ikrām<\/i>): \"Enter it in peace, secure\" is said to the people of Paradise. It is a welcome that honours them, not an order they must carry out.<\/div><div class=\"chartbox\"><div class=\"chh\">THE TWELVE OTHER MEANINGS OF THE COMMAND · DRAWN BY THE COMPANION<\/div><table class=\"grid\"><thead><tr><th>Meaning<\/th><th>Book's example<\/th><\/tr><\/thead><tbody><tr><td>Supplication ‎<span class=\"arin\">الدعاء<\/span>‎<\/td><td>‎<span class=\"arin\">أَوْزِعْنِي<\/span>‎<\/td><\/tr><tr><td>Entreaty ‎<span class=\"arin\">الالتماس<\/span>‎<\/td><td>‎<span class=\"arin\">أعطني الكتاب<\/span>‎<\/td><\/tr><tr><td>Wishing ‎<span class=\"arin\">التمنّي<\/span>‎<\/td><td>‎<span class=\"arin\">أَلاَ انْجَلِيْ<\/span>‎<\/td><\/tr><tr><td>Guidance ‎<span class=\"arin\">الإرشاد<\/span>‎<\/td><td>‎<span class=\"arin\">فَاكْتُبُوهُ<\/span>‎<\/td><\/tr><tr><td>Threat ‎<span class=\"arin\">التهديد<\/span>‎<\/td><td>‎<span class=\"arin\">اعْمَلُوا مَا شِئْتُمْ<\/span>‎<\/td><\/tr><tr><td>Showing inability ‎<span class=\"arin\">التعجيز<\/span>‎<\/td><td>‎<span class=\"arin\">أَنْشِرُوْا لِيْ كُلَيْباً<\/span>‎<\/td><\/tr><tr><td>Humiliation ‎<span class=\"arin\">الإهانة<\/span>‎<\/td><td>‎<span class=\"arin\">كُونُوا حِجَارَةً<\/span>‎<\/td><\/tr><tr><td>Permission ‎<span class=\"arin\">الإباحة<\/span>‎<\/td><td>‎<span class=\"arin\">كُلُوا وَاشْرَبُواْ<\/span>‎<\/td><\/tr><tr><td>Reminding of a favour ‎<span class=\"arin\">الامتنان<\/span>‎<\/td><td>‎<span class=\"arin\">وَكُلُوا مِمَّا رَزَقَكُمُ اللّهُ<\/span>‎<\/td><\/tr><tr><td>Giving a choice ‎<span class=\"arin\">التخيير<\/span>‎<\/td><td>‎<span class=\"arin\">خذ هذا أو ذاك<\/span>‎<\/td><\/tr><tr><td>Making equal ‎<span class=\"arin\">التسوية<\/span>‎<\/td><td>‎<span class=\"arin\">فَاصْبِرُوا أَوْ لاَ تَصْبِرُوا<\/span>‎<\/td><\/tr><tr><td>Honouring ‎<span class=\"arin\">الإكرام<\/span>‎<\/td><td>‎<span class=\"arin\">ادْخُلُوهَا بِسَلاَمٍ آمِنِينَ<\/span>‎<\/td><\/tr><\/tbody><\/table><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 42<\/span><\/div><div class=\"ar\">وأمّا النهْي فهو طلب الكفّ عن الفعل على وجه الاستعلاء، وله صيغة واحدة، وهي المضارع مع «لا» الناهية، كقوله تعالى: ﴿وَلاَ تُفْسِدُوْا فِي الأَرْضِ بَعْدَ إِصْلاَحِهَا﴾ [الأعراف: ٥٦].<\/div><div class=\"tr\">As for the prohibition, it is the request to refrain from an action from a position of superiority. It has one form: the imperfect verb with the prohibiting “lā”, as in His saying (Exalted is He): “And do not cause corruption in the land after it has been set right” [al-Aʿrāf 7:56].<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>The <b>prohibition<\/b> (<i>nahy<\/i>) is the mirror of the command: asking someone to <b>hold back<\/b> from an action, again from a position of superiority.<\/p><p>Unlike the command with its four forms, the prohibition has only <b>one form<\/b>: the <i>muḍāriʿ<\/i> with the prohibiting ‎<span class=\"arin\">لا<\/span>‎, as in ‎<span class=\"arin\">وَلاَ تُفْسِدُوْا<\/span>‎.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 42<\/span><\/div><div class=\"ar\">وقد تخرج صيغته عن معناها الأصليّ إلى معانٍ أخر تفهم من المقام والسياق:<\/div><div class=\"tr\">Its form may leave its original meaning for other meanings, understood from the setting and the context:<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>Just like the command, the form of prohibition can leave its original meaning. The book gives four such meanings, and you will notice they match meanings you have already seen for the command.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 42<\/span><\/div><div class=\"ar\">(١) كالدعاء، نحو: ﴿فَلاَ تُشْمِتْ بِيَ الأعْدَاء﴾ [الأعراف: ١٥٠].<\/div><div class=\"tr\">(1) Such as supplication, as in “So do not let the enemies rejoice over me” [al-Aʿrāf 7:150].<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Supplication<\/b>: Hārūn (peace be upon him) says to his brother Mūsā, ‎<span class=\"arin\">فَلاَ تُشْمِتْ بِيَ الأعْدَاء<\/span>‎, \"do not let the enemies rejoice over me\". He is pleading, not giving an order.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 42<\/span><\/div><div class=\"ar\">(٢) والالتماس، كقولك لِمَن يساويك: «لا تبرح من مكانك حتّى أرجع إليك».<\/div><div class=\"tr\">(2) And entreaty, as in your saying to someone who is your equal: “Do not leave your place until I come back to you.”<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Entreaty<\/b>: said to an equal, \"Do not leave your place until I come back\" is a request, not a prohibition.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 42–43<\/span><\/div><div class=\"ar\">(٣) والتمنّي، نحو: «لا تطلع» في قوله:<span class=\"bayt\"><span class=\"h1\">يَالَيْلُ طُلْ يَا نَوْمُ زُلْ<\/span><span class=\"h2\">يَا صُبْحُ قِفْ لاَ تَطْلُعْ<\/span><\/span><\/div><div class=\"tr\">(3) And wishing, as in “do not rise” in the poet’s words:<br>“O night, be long! O sleep, depart! O morning, halt — do not rise!”<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Wishing<\/b>: the poet tells the morning ‎<span class=\"arin\">لاَ تَطْلُعْ<\/span>‎, \"do not rise\". The morning cannot obey; he is wishing that the night would never end.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 43<\/span><\/div><div class=\"ar\">(٤) والتهديدِ، كقولك لخادمك: «لا تطع أمري».<\/div><div class=\"tr\">(4) And threat, as in your saying to your servant: “Do not obey my order.”<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Threat<\/b>: when a master tells his servant \"Do not obey my order\", he does not really want him to disobey. He is warning him of what will happen if he does.<\/div><div class=\"chartbox\"><div class=\"chh\">THE PROHIBITION AT A GLANCE · DRAWN BY THE COMPANION<\/div><table class=\"grid\"><thead><tr><th><\/th><th><\/th><\/tr><\/thead><tbody><tr><td>Definition<\/td><td>Asking to hold back from an action, from a position of superiority<\/td><\/tr><tr><td>Its one form<\/td><td>The muḍāriʿ with prohibiting ‎<span class=\"arin\">لا<\/span>‎<\/td><\/tr><tr><td>Other meanings<\/td><td>Supplication, entreaty, wishing, threat<\/td><\/tr><\/tbody><\/table><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 43<\/span><\/div><div class=\"ar\">وأمّا الاستفهام فهو طلب العلم بشيء، وأدواته: الهمزة، وهل، وما، ومن، ومتى، وأيّان، وكيف، وأين، وأنّى، وكم، وأيّ.<\/div><div class=\"tr\">As for the question, it is the request for knowledge of something. Its instruments are: the hamzah, hal, mā, man, matā, ayyāna, kayfa, ayna, annā, kam, and ayy.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>The <b>question<\/b> (<i>istifhām<\/i>) is asking to know something. The book lists eleven question words and now explains them one by one, beginning with the most flexible: the <i>hamzah<\/i>.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 43–44<\/span><\/div><div class=\"ar\">(١) فالهمزة لطلب التصوّر، أوالتصديق، و التصوّر هو إدراك المفرد، كقولك: «أعليّ مسافر أم خالد؟» تعتقد أنّ السفر حصل من أحدهما، ولكن تطلب تعيينه، ولذا يجاب بالتعيين، فيقال: «عليّ» مثلاً،<\/div><div class=\"tr\">(1) The hamzah is for requesting a concept (<i>taṣawwur<\/i>) or an assent (<i>taṣdīq<\/i>). A concept is the perception of a single term, as in your saying “Is it ʿAlī who is travelling, or Khālid?” — you believe that travel has come about from one of them, but you are asking for it to be specified. For this reason it is answered with a specification, and one says, for example, “ʿAlī”.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>To understand the <i>hamzah<\/i> you need two terms from logic.<\/p><b>Taṣawwur<\/b> (concept) is knowing a <b>single thing<\/b>. In ‎<span class=\"arin\">أعليّ مسافر أم خالد؟<\/span>‎ you already know that someone is travelling. What you do not know is <b>who<\/b>: ʿAlī or Khālid. So you are asking for one single thing to be named, and the answer is a name: \"ʿAlī\".<p>Notice: you cannot answer this question with \"yes\" or \"no\". That is the sign of a <i>taṣawwur<\/i> question.<\/p><\/div><div class=\"cnote\"><span class=\"cnh\">COMPANION&#8217;S NOTE · NOT IN THE BOOK<\/span><p>The book prints ‎<span class=\"arin\">أوالتصديق<\/span>‎ as one word and ‎<span class=\"arin\">و التصوّر<\/span>‎ with a space on p. 43; the usual spelling is ‎<span class=\"arin\">أو التصديق<\/span>‎ and ‎<span class=\"arin\">والتصوّر<\/span>‎.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 44<\/span><\/div><div class=\"ar\">والتصديق هو إدراك النسبة، نحو: «أسافر عليّ»؟ تستفهم عن حصول السفر وعدمه، ولذا يجاب بــ«نعم» أو «لا».<\/div><div class=\"tr\">An assent is the perception of the relation, as in “Did ʿAlī travel?” — you are asking whether the travel happened or not; for this reason it is answered with “yes” or “no”.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Taṣdīq<\/b> (assent) is knowing the <b>relation<\/b>: whether the link between subject and predicate is true. In ‎<span class=\"arin\">أسافر عليّ؟<\/span>‎ you are not asking who; you are asking <b>whether<\/b> the travelling happened at all. So the answer is \"yes\" or \"no\".<p>The <i>hamzah<\/i> can be used for both kinds of question; most other question words can be used for only one.<\/p><\/div><div class=\"chartbox\"><div class=\"chh\">TAṢAWWUR AND TAṢDĪQ · DRAWN BY THE COMPANION<\/div><table class=\"grid\"><thead><tr><th><\/th><th>Taṣawwur ‎<span class=\"arin\">التصوّر<\/span>‎<\/th><th>Taṣdīq ‎<span class=\"arin\">التصديق<\/span>‎<\/th><\/tr><\/thead><tbody><tr><td>What you seek<\/td><td>One single thing (which one?)<\/td><td>The relation (did it happen?)<\/td><\/tr><tr><td>Book's example<\/td><td>‎<span class=\"arin\">أعليّ مسافر أم خالد؟<\/span>‎<\/td><td>‎<span class=\"arin\">أسافر عليّ؟<\/span>‎<\/td><\/tr><tr><td>Answer<\/td><td>By naming it: \"ʿAlī\"<\/td><td>\"Yes\" or \"No\"<\/td><\/tr><\/tbody><\/table><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 44–45<\/span><\/div><div class=\"ar\">والمسئول عنه في التصوّر ما يلي الهمزة، ويكــون لــه معادل يذكر بعد «أم»، وتسمّى «متّصلة»؛ ...... فتقول في الاستفهام عن المسند إليه: «أأنــت فعلــت هــذا أم يوسف»، وعن المسند: «أراغب أنت عن الأمر أم راغب فيــه»، وعن المفعول: «أإيّاي تقصد أم خالداً»، وعن الحال: «أراكبــاً جئت أم ماشياً»، وعن الظرف: «أيوم الخميس قــدمت أم يــوم الجمعة»، وهكذا،<\/div><div class=\"tr\">What is asked about in a concept-question is what directly follows the hamzah, and it has a counterpart mentioned after “am”, which is then called “connected” (<i>muttaṣilah<\/i>). So you say, in asking about the subject: “Was it you who did this, or Yūsuf?”; about the predicate: “Are you averse to the matter, or desirous of it?”; about the object: “Is it me you are aiming at, or Khālid?”; about the circumstantial state: “Was it riding that you came, or walking?”; about the adverb of time: “Was it on Thursday that you arrived, or on Friday?” — and so on.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>In a <i>taṣawwur<\/i> question with the <i>hamzah<\/i>, the thing you are asking about is the word that comes <b>straight after the hamzah<\/b>. Its alternative comes after ‎<span class=\"arin\">أم<\/span>‎, which here is called <b>connected<\/b> (<i>muttaṣilah<\/i>) because the two parts belong to one question.<\/p><p>So the word order tells you exactly what is in doubt. In ‎<span class=\"arin\">أأنــت فعلــت هــذا أم يوسف<\/span>‎ the doubt is about the <i>doer<\/i> (you or Yūsuf), not about the action. In ‎<span class=\"arin\">أراكبــاً جئت أم ماشياً<\/span>‎ the coming is known; the doubt is about the <i>manner<\/i> (riding or walking). The book shows the same pattern for the subject, predicate, object, state and adverb of time.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 45<\/span><\/div><div class=\"ar\">وقد لا يذكر المعادل، نحو: «أأنت فعلت هذا»،<\/div><div class=\"tr\">And sometimes the counterpart is not mentioned, as in “Was it you who did this?”,<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>Sometimes the alternative after ‎<span class=\"arin\">أم<\/span>‎ is left out and only implied. ‎<span class=\"arin\">أأنت فعلت هذا<\/span>‎ still asks about the doer, because ‎<span class=\"arin\">أنت<\/span>‎ follows the hamzah; the alternative \"or someone else?\" is understood.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 46<\/span><\/div><div class=\"ar\">«أراغب أنت عن الأمر؟»، «أإيّاي تقصد؟»، «أراكباً جئت؟»، «أيوم الخميس قدمت؟».<\/div><div class=\"tr\">[Continuing from p. 45, where the elided counterpart was illustrated with «Did you do this?» (asking about the subject):] «Are you averse to the matter?» (asking about the predicate), «Is it me that you intend?» (asking about the object), «Did you come riding?» (asking about the circumstantial state), «Was it on Thursday that you arrived?» (asking about the adverb of time).<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>These examples continue from the previous page: the alternative after ‎<span class=\"arin\">أم<\/span>‎ is left out, but each question still asks about the word straight after the hamzah: the predicate (‎<span class=\"arin\">أراغب<\/span>‎), the object (‎<span class=\"arin\">أإيّاي<\/span>‎), the state (‎<span class=\"arin\">أراكباً<\/span>‎) and the time (‎<span class=\"arin\">أيوم الخميس<\/span>‎).<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 46<\/span><\/div><div class=\"ar\">والمسئول عنه في التصديق النسبة، ولا يكون لها معادل، فإن جاءت «أم» بعدها، قدّرت منقطعة، وتكون بمعنى «بل».<\/div><div class=\"tr\">What is asked about in taṣdīq is the relation (nisbah), and it has no counterpart (muʿādil). If «am» does come after it, it is taken to be munqaṭiʿah (disconnected), and it carries the meaning of «bal» (“rather”).<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>In a <i>taṣdīq<\/i> question the doubt is about the <b>relation<\/b> itself (did it happen or not?), so there is nothing to set beside it as an alternative. That is why it has no <i>muʿādil<\/i>.<\/p><p>If ‎<span class=\"arin\">أم<\/span>‎ does come after a <i>taṣdīq<\/i> question, it is not the connected ‎<span class=\"arin\">أم<\/span>‎ you saw before. It is <b>disconnected<\/b> (<i>munqaṭiʿah<\/i>) and means ‎<span class=\"arin\">بل<\/span>‎, \"rather\": the speaker leaves the first question and moves on to something new.<\/p><\/div><div class=\"chartbox\"><div class=\"chh\">TWO KINDS OF AM · DRAWN BY THE COMPANION<\/div><table class=\"grid\"><thead><tr><th><\/th><th>Muttaṣilah ‎<span class=\"arin\">متّصلة<\/span>‎<\/th><th>Munqaṭiʿah ‎<span class=\"arin\">منقطعة<\/span>‎<\/th><\/tr><\/thead><tbody><tr><td>Comes after<\/td><td>a hamzah of taṣawwur<\/td><td>a question of taṣdīq<\/td><\/tr><tr><td>What it does<\/td><td>gives the alternative (muʿādil)<\/td><td>means ‎<span class=\"arin\">بل<\/span>‎: moves to a new point<\/td><\/tr><tr><td>Example<\/td><td>‎<span class=\"arin\">أأنــت فعلــت هــذا أم يوسف<\/span>‎<\/td><td>—<\/td><\/tr><\/tbody><\/table><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 46–47<\/span><\/div><div class=\"ar\">(٢) و«هل» لطلب التصديق فقط، نحو: «هل جاء صديقك»؟، والجواب «نعم» أو «لا»، ولذا يمتنع معها ذكر المعادل؛ فلا يقال: «هل جاء صديقك أم عدوّك»؟، و«هل» تسمّى «بسيطةً» إن استفهم بها عن وجود شيء في نفسه، نحو: «هل العنقاء موجودة»؟، و«مركبةً» إن استفهم بها عن وجود شيء لشيء، نحو: «هل تبيض العنقاء وتفرخ»؟<\/div><div class=\"tr\">(2) «Hal» is for seeking taṣdīq only, e.g. «Has your friend come?»; the answer is «yes» or «no». For this reason mentioning a counterpart with it is not allowed, so one does not say «Has your friend come or your enemy?». «Hal» is called «basīṭah» (simple) if it is used to ask about the existence of a thing in itself, e.g. «Does the ʿanqāʾ exist?», and «murakkabah» (compound) if it is used to ask about the existence of something for something, e.g. «Does the ʿanqāʾ lay eggs and hatch them?».<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>‎<span class=\"arin\">هل<\/span>‎ is narrower than the hamzah: it asks <b>only<\/b> for <i>taṣdīq<\/i>. ‎<span class=\"arin\">هل جاء صديقك<\/span>‎ asks whether your friend came, and the answer is \"yes\" or \"no\". Because it never asks \"which one?\", you cannot add an alternative with ‎<span class=\"arin\">أم<\/span>‎; ‎<span class=\"arin\">هل جاء صديقك أم عدوّك<\/span>‎ is wrong.<\/p><p>The book then names two kinds of ‎<span class=\"arin\">هل<\/span>‎. <b>Simple<\/b> (<i>basīṭah<\/i>): asking whether a thing <b>exists at all<\/b>, as in ‎<span class=\"arin\">هل العنقاء موجودة<\/span>‎, \"Does the ʿanqāʾ (a legendary bird) exist?\" <b>Compound<\/b> (<i>murakkabah<\/i>): asking whether something exists <b>for<\/b> something else, that is, whether it has a certain quality, as in ‎<span class=\"arin\">هل تبيض العنقاء وتفرخ<\/span>‎, \"Does the ʿanqāʾ lay eggs and hatch them?\"<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 47–48<\/span><\/div><div class=\"ar\">(٣) و«ما» يطلب بها شرح الاسم، نحو: «ما العسجد أو اللجين»؟، أو حقيقة المسمّى، نحو: «ما الإنسان»؟، أو حال المذكور معها، كقولك لقادم عليك: «ما أنت»؟<\/div><div class=\"tr\">(3) With «mā» one seeks the explanation of a noun, e.g. «What is ʿasjad or lujayn?»; or the reality of the thing named, e.g. «What is man?»; or the state of what is mentioned with it, as when you say to someone who has come to you: «What are you?».<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>‎<span class=\"arin\">ما<\/span>‎ asks about the <b>meaning or nature<\/b> of something, in three ways:<\/p><p>(1) <b>Explaining a word<\/b>: ‎<span class=\"arin\">ما العسجد أو اللجين<\/span>‎. Here you do not know the words, and the answer explains them: <i>gold<\/i> and <i>silver<\/i>.<\/p><p>(2) <b>The reality of a thing<\/b>: ‎<span class=\"arin\">ما الإنسان<\/span>‎. You know the word; you want its definition: <i>a rational animal<\/i>.<\/p><p>(3) <b>The state of the person asked about<\/b>: saying ‎<span class=\"arin\">ما أنت<\/span>‎ to someone who arrives means \"What is your situation? What brings you?\"<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 48<\/span><\/div><div class=\"ar\">(٤) و«من» يطلب بها تعيين العقلاء، كقولك: «مَن فتح مصر»؟<\/div><div class=\"tr\">(4) With «man» one seeks to specify rational beings, as when you say: «Who conquered Egypt?».<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>‎<span class=\"arin\">من<\/span>‎ is used to identify <b>rational beings<\/b> (people, and the like). The answer to ‎<span class=\"arin\">مَن فتح مصر<\/span>‎ names a person.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 48<\/span><\/div><div class=\"ar\">(٥) و«متى» يطلب بها تعيين الزمان ماضياً كان أو مستقبلاً، نحو: «متى جئت؟»، و«متى تذهب؟».<\/div><div class=\"tr\">(5) With «matā» one seeks to specify time, whether past or future, e.g. «When did you come?» and «When will you go?».<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>‎<span class=\"arin\">متى<\/span>‎ asks about <b>time<\/b>, past or future: ‎<span class=\"arin\">متى جئت<\/span>‎ (past), ‎<span class=\"arin\">متى تذهب<\/span>‎ (future).<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 48<\/span><\/div><div class=\"ar\">(٦) و«أيّان» يطلب بها تعيين الزمان المستقبل خاصّة، وتكون في موضعِ التهويل، كقوله تعالى: ﴿يَسْأَلُ أَيَّانَ يَوْمُ الْقِيَامَةِ﴾ [القيامة: ٦].<\/div><div class=\"tr\">(6) With «ayyāna» one seeks to specify future time only, and it is used where something is to be made to seem awesome, as in His saying (Exalted is He): “He asks: When is the Day of Resurrection?” [al-Qiyāmah 75:6].<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>‎<span class=\"arin\">أيّان<\/span>‎ also asks about time, but <b>only the future<\/b>, and it is used for matters that are <b>awesome or grave<\/b> (<i>tahwīl<\/i>). The verse quotes the disbeliever asking about the Day of Resurrection, a day whose greatness the word itself suggests.<\/p><\/div><div class=\"chartbox\"><div class=\"chh\">METĀ AND AYYĀNA · DRAWN BY THE COMPANION<\/div><table class=\"grid\"><thead><tr><th><\/th><th>‎<span class=\"arin\">متى<\/span>‎<\/th><th>‎<span class=\"arin\">أيّان<\/span>‎<\/th><\/tr><\/thead><tbody><tr><td>Time asked about<\/td><td>Past or future<\/td><td>Future only<\/td><\/tr><tr><td>Used for<\/td><td>Any matter<\/td><td>Grave, awesome matters<\/td><\/tr><\/tbody><\/table><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 49<\/span><\/div><div class=\"ar\">(٧) و«كيف» يطلب بها تعيين الحال، نحو: «كيف أنت»؟<\/div><div class=\"tr\">(7) With «kayfa» one seeks to specify the state, e.g. «How are you?».<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>‎<span class=\"arin\">كيف<\/span>‎ asks about the <b>state or condition<\/b>: ‎<span class=\"arin\">كيف أنت<\/span>‎, \"How are you?\"<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 49<\/span><\/div><div class=\"ar\">(٨) و«أين» يطلب بها تعيين المكان، نحو: «أين تذهب»؟<\/div><div class=\"tr\">(8) With «ayna» one seeks to specify the place, e.g. «Where are you going?».<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>‎<span class=\"arin\">أين<\/span>‎ asks about <b>place<\/b>: ‎<span class=\"arin\">أين تذهب<\/span>‎, \"Where are you going?\"<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 49<\/span><\/div><div class=\"ar\">(٩) و«أنّى» تكون بمعنى «كيف»، نحو: ﴿أَنَّى يُحْيِـيْ هَـٰذِهِ اللهُ بَعْدَ مَوْتِهَا﴾ [البقرة: ٢٥٩]، وبمعنى «مِن أين»، نحو: ﴿يَا مَرْيَمُ أَنَّى لَكِ هَـٰذَا﴾ [آل عمران: ٣٧]، وبمعنى «متى»، نحو: «زر اَ نَّى شئت».<\/div><div class=\"tr\">(9) «Annā» can mean «how», e.g. “How will Allah give this life after its death?” [al-Baqarah 2:259]; and it can mean «from where», e.g. “O Maryam, from where do you have this?” [Āl ʿImrān 3:37]; and it can mean «when», e.g. «Visit whenever you wish».<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>‎<span class=\"arin\">أنّى<\/span>‎ has three meanings, and only the context tells you which:<\/p><p>(1) <b>How<\/b>, like ‎<span class=\"arin\">كيف<\/span>‎: ‎<span class=\"arin\">أَنَّى يُحْيِـيْ هَـٰذِهِ اللهُ بَعْدَ مَوْتِهَا<\/span>‎, \"How will Allah revive this?\"<\/p><p>(2) <b>From where<\/b>, like ‎<span class=\"arin\">مِن أين<\/span>‎: Zakariyyā asks Maryam where her provision came from.<\/p><p>(3) <b>When<\/b>, like ‎<span class=\"arin\">متى<\/span>‎: \"Visit whenever you wish.\"<\/p><\/div><div class=\"cnote\"><span class=\"cnh\">COMPANION&#8217;S NOTE · NOT IN THE BOOK<\/span><p>Apparent misprint: the matn prints the last example as «زر اَ نَّى شئت», with «أنّى» split into two pieces. The intended reading is clearly «زر أنّى شئت».<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 50<\/span><\/div><div class=\"ar\">(١٠) و«كم» يطلب بها تعيين عدد مبهم، نحو: ﴿كَمْ لَبِثْتُمْ﴾ [الكهف: ١٩].<\/div><div class=\"tr\">(10) With «kam» one seeks to specify an unclear number, e.g. “How long did you stay?” [al-Kahf 18:19].<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>‎<span class=\"arin\">كم<\/span>‎ asks for a <b>number<\/b> that is unknown: ‎<span class=\"arin\">كَمْ لَبِثْتُمْ<\/span>‎, \"How long did you stay?\", asked by the People of the Cave of one another.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 50–51<\/span><\/div><div class=\"ar\">(١١) و«أيّ» يطلب بها تمييز أحد المتشاركين في أمر يعمّهما، نحو: ﴿أَيُّ الْفَرِيقَيْنِ خَيْرٌ مَّقَاماً﴾ [مريم: ٧٣]، ويسئل بها عن الزمان، والمكان، والحال، والعدد، والعاقل، وغيره حسب ما تضاف إليه.<\/div><div class=\"tr\">(11) With «ayy» one seeks to single out one of two things that share in something common to both, e.g. “Which of the two parties is better in position?” [Maryam 19:73]. With it one asks about time, place, state, number, rational beings and other things, according to what it is annexed to.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>‎<span class=\"arin\">أيّ<\/span>‎ asks you to <b>pick out one<\/b> of things that share something in common. In ‎<span class=\"arin\">أَيُّ الْفَرِيقَيْنِ خَيْرٌ مَّقَاماً<\/span>‎, both groups share the quality being asked about; the question is which of the two is better.<\/p><p>‎<span class=\"arin\">أيّ<\/span>‎ is flexible because it takes its meaning from the word it is joined to: ‎<span class=\"arin\">أيّ يوم<\/span>‎ asks about time, ‎<span class=\"arin\">أيّ مكان<\/span>‎ about place, ‎<span class=\"arin\">أيّ رجل<\/span>‎ about a person, and so on.<\/p><\/div><div class=\"chartbox\"><div class=\"chh\">THE QUESTION WORDS · DRAWN BY THE COMPANION<\/div><table class=\"grid\"><thead><tr><th>Word<\/th><th>Asks about<\/th><th>Book's example<\/th><\/tr><\/thead><tbody><tr><td>‎<span class=\"arin\">الهمزة<\/span>‎<\/td><td>taṣawwur or taṣdīq<\/td><td>‎<span class=\"arin\">أعليّ مسافر أم خالد؟<\/span>‎ / ‎<span class=\"arin\">أسافر عليّ؟<\/span>‎<\/td><\/tr><tr><td>‎<span class=\"arin\">هل<\/span>‎<\/td><td>taṣdīq only<\/td><td>‎<span class=\"arin\">هل جاء صديقك<\/span>‎<\/td><\/tr><tr><td>‎<span class=\"arin\">ما<\/span>‎<\/td><td>explaining a word; the reality of a thing; a state<\/td><td>‎<span class=\"arin\">ما الإنسان<\/span>‎<\/td><\/tr><tr><td>‎<span class=\"arin\">من<\/span>‎<\/td><td>rational beings<\/td><td>‎<span class=\"arin\">مَن فتح مصر<\/span>‎<\/td><\/tr><tr><td>‎<span class=\"arin\">متى<\/span>‎<\/td><td>time, past or future<\/td><td>‎<span class=\"arin\">متى جئت<\/span>‎<\/td><\/tr><tr><td>‎<span class=\"arin\">أيّان<\/span>‎<\/td><td>future time, for grave matters<\/td><td>‎<span class=\"arin\">أَيَّانَ يَوْمُ الْقِيَامَةِ<\/span>‎<\/td><\/tr><tr><td>‎<span class=\"arin\">كيف<\/span>‎<\/td><td>state<\/td><td>‎<span class=\"arin\">كيف أنت<\/span>‎<\/td><\/tr><tr><td>‎<span class=\"arin\">أين<\/span>‎<\/td><td>place<\/td><td>‎<span class=\"arin\">أين تذهب<\/span>‎<\/td><\/tr><tr><td>‎<span class=\"arin\">أنّى<\/span>‎<\/td><td>how / from where / when<\/td><td>‎<span class=\"arin\">أَنَّى لَكِ هَـٰذَا<\/span>‎<\/td><\/tr><tr><td>‎<span class=\"arin\">كم<\/span>‎<\/td><td>an unknown number<\/td><td>‎<span class=\"arin\">كَمْ لَبِثْتُمْ<\/span>‎<\/td><\/tr><tr><td>‎<span class=\"arin\">أيّ<\/span>‎<\/td><td>one of things sharing a quality<\/td><td>‎<span class=\"arin\">أَيُّ الْفَرِيقَيْنِ<\/span>‎<\/td><\/tr><\/tbody><\/table><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 51<\/span><\/div><div class=\"ar\">وقد تخرج ألفاظ الاستفهام عن معناها الأصلي لمعانٍ أخر تفهم من سياق الكلام:<\/div><div class=\"tr\">The words of istifhām sometimes leave their original meaning for other meanings that are understood from the context of the speech:<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>As with the command and the prohibition, the question form is often used for something other than asking. These uses are very common in the Qurʾān and in poetry. For each example, ask yourself: does the speaker really want an answer?<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 51<\/span><\/div><div class=\"ar\">(١) كالتسويةِ، نحو: ﴿سَوَاءٌ عَلَيْهِمْ أَأَنذَرْتَهُمْ أَمْ لَمْ تُنذِرْهُمْ﴾ [البقرة: ٦].<\/div><div class=\"tr\">(1) Such as equalisation (taswiyah), e.g. “It is the same to them whether you warn them or do not warn them” [al-Baqarah 2:6].<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Equalisation<\/b> (<i>taswiyah<\/i>): after ‎<span class=\"arin\">سَوَاءٌ<\/span>‎ the hamzah and ‎<span class=\"arin\">أَمْ<\/span>‎ do not ask anything. The verse means: warning them and not warning them are the same, for they will not believe.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 51<\/span><\/div><div class=\"ar\">(٢) والنفْيِ، نحو: ﴿هَلْ جَزَاءُ الإِحْسَانِ إِلاَّ الإِحْسَانُ﴾ [الرحمن: ٦٠].<\/div><div class=\"tr\">(2) And negation, e.g. “Is the reward for good anything but good?” [al-Raḥmān 55:60].<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Negation<\/b> (<i>nafy<\/i>): ‎<span class=\"arin\">هَلْ جَزَاءُ الإِحْسَانِ إِلاَّ الإِحْسَانُ<\/span>‎ means \"The reward for good is nothing but good.\" A sign of this use is the ‎<span class=\"arin\">إِلاَّ<\/span>‎ that follows: the question works like ‎<span class=\"arin\">ما<\/span>‎ of negation.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 52<\/span><\/div><div class=\"ar\">(٣) والإنكارِ، نحو: ﴿أَغَيْرَ اللّهِ تَدْعُونَ﴾ [الأنعام: ٤٠]، ﴿أَلَيْسَ اللَّهُ بِكَافٍ عَبْدَهُ﴾ [الزمر: ٣٦].<\/div><div class=\"tr\">(3) And disapproving denial (inkār), e.g. “Is it other than Allah that you call upon?” [al-Anʿām 6:40], and “Is Allah not sufficient for His servant?” [al-Zumar 39:36].<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Disapproving denial<\/b> (<i>inkār<\/i>): the speaker rejects the thing asked about. ‎<span class=\"arin\">أَغَيْرَ اللّهِ تَدْعُونَ<\/span>‎ rebukes them for calling on anything besides Allah.<p>In the second example, ‎<span class=\"arin\">أَلَيْسَ اللَّهُ بِكَافٍ عَبْدَهُ<\/span>‎, the denial falls on a negative (‎<span class=\"arin\">لَيْسَ<\/span>‎), and denying a negative affirms: it means Allah <b>is<\/b> certainly sufficient for His servant.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 52<\/span><\/div><div class=\"ar\">(٤) والأمرِ، نحو: ﴿فَهَلْ أَنتُم مُّنتَهُونَ﴾ [المائدة: ٩١]، ونحو: ﴿أَأَسْلَمْتُمْ﴾ [آل عمران: ٢٠] بمعنى «انتهوا»، و«أسلموا».<\/div><div class=\"tr\">(4) And command, e.g. “So will you desist?” [al-Māʾidah 5:91], and “Have you submitted?” [Āl ʿImrān 3:20], meaning «Desist!» and «Submit!».<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Command<\/b>: ‎<span class=\"arin\">فَهَلْ أَنتُم مُّنتَهُونَ<\/span>‎ is not asking for information; it means \"Desist!\" ‎<span class=\"arin\">أَأَسْلَمْتُمْ<\/span>‎ means \"Submit!\" The question form makes the command more forceful, as if the answer could only be yes.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 52<\/span><\/div><div class=\"ar\">(٥) والنهْيِ، نحو: ﴿أَتَخْشَوْنَهُمْ فَاللّهُ أَحَقُّ أَن تَخْشَوْهُ﴾ [التوبة: ١٣].<\/div><div class=\"tr\">(5) And prohibition, e.g. “Do you fear them? Allah has more right that you should fear Him” [al-Tawbah 9:13].<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Prohibition<\/b>: ‎<span class=\"arin\">أَتَخْشَوْنَهُمْ<\/span>‎ means \"Do not fear them\", and the verse gives the reason straight away: Allah has more right to be feared.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 52<\/span><\/div><div class=\"ar\">(٦) والتشويقِ، نحو: ﴿هَلْ أَدُلُّكُمْ عَلَى تِجَارَةٍ تُنجِيكُم مِّنْ عَذَابٍ أَلِيمٍ﴾ [الصف: ١٠].<\/div><div class=\"tr\">(6) And arousing eagerness (tashwīq), e.g. “Shall I show you a trade that will save you from a painful punishment?” [al-Ṣaff 61:10].<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Arousing eagerness<\/b> (<i>tashwīq<\/i>): \"Shall I show you a trade that will save you?\" makes the listener eager to hear what follows. The answer is then given in the next verses.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 53<\/span><\/div><div class=\"ar\">(٧) والتعظيمِ، نحو: ﴿مَن ذَا الَّذِي يَشْفَعُ عِنْدَهُ إِلاَّ بِإِذْنِه﴾ [البقرة: ٢٥٥].<\/div><div class=\"tr\">(7) And magnification (taʿẓīm), e.g. “Who is it that can intercede with Him except by His leave?” [al-Baqarah 2:255].<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Magnification<\/b> (<i>taʿẓīm<\/i>): \"Who is it that can intercede with Him except by His leave?\" shows the greatness of Allah: no one dares to intercede without His permission.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 53<\/span><\/div><div class=\"ar\">(٨) والتحقيرِ، نحو: «أهذا الذي مدحته كثيراً؟».<\/div><div class=\"tr\">(8) And belittling (taḥqīr), e.g. «Is this the one you praised so much?».<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Belittling<\/b> (<i>taḥqīr<\/i>): \"Is this the one you praised so much?\" looks down on the person, who has turned out to be unworthy of the praise.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 53<\/span><\/div><div class=\"ar\">(٩) والتهكّمِ، نحو: «أعقلك يسوغ لك أن تفعل كذا؟».<\/div><div class=\"tr\">(9) And mockery (tahakkum), e.g. «Does your intellect allow you to do such-and-such?».<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Mockery<\/b> (<i>tahakkum<\/i>): \"Does your intellect allow you to do this?\" mocks the person's intelligence. The speaker does not expect an answer.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 53<\/span><\/div><div class=\"ar\">(١٠) والتعجّب، نحو: ﴿وَقَالُوا مَالِ هَذَا الرَّسُولِ يَأْكُلُ الطَّعَامَ وَيَمْشِي فِي الْأَسْوَاقِ﴾ [الفرقان: ٧].<\/div><div class=\"tr\">(10) And wonder (taʿajjub), e.g. “And they said: What is with this messenger, that he eats food and walks in the markets?” [al-Furqān 25:7].<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Wonder<\/b> (<i>taʿajjub<\/i>): the disbelievers' words ‎<span class=\"arin\">مَالِ هَذَا الرَّسُولِ يَأْكُلُ الطَّعَامَ<\/span>‎ express their amazement that a messenger should eat food and walk in the markets like other people.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 53<\/span><\/div><div class=\"ar\">(١١)والتنبيهِ على الضلال، نحو: ﴿فَأَيْنَ تَذْهَبُونَ﴾ [التكوير: ٢٦].<\/div><div class=\"tr\">(11) And drawing attention to misguidance, e.g. “So where are you going?” [al-Takwīr 81:26].<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Drawing attention to misguidance<\/b>: ‎<span class=\"arin\">فَأَيْنَ تَذْهَبُونَ<\/span>‎ does not ask for a place. It tells them they have lost their way by turning from the truth.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 54<\/span><\/div><div class=\"ar\">(١٢) والوعيدِ، نحو: «أتفعل كذا وقد أحسنت إليك».<\/div><div class=\"tr\">(12) And threat (waʿīd), e.g. «Do you do such-and-such when I have been good to you?».<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Threat<\/b> (<i>waʿīd<\/i>): \"Do you do this when I have been good to you?\" warns the listener of the consequences of his ingratitude.<\/div><div class=\"chartbox\"><div class=\"chh\">THE OTHER MEANINGS OF THE QUESTION · DRAWN BY THE COMPANION<\/div><table class=\"grid\"><thead><tr><th>Meaning<\/th><th>Book's example<\/th><\/tr><\/thead><tbody><tr><td>Equalisation ‎<span class=\"arin\">التسوية<\/span>‎<\/td><td>‎<span class=\"arin\">سَوَاءٌ عَلَيْهِمْ أَأَنذَرْتَهُمْ<\/span>‎<\/td><\/tr><tr><td>Negation ‎<span class=\"arin\">النفي<\/span>‎<\/td><td>‎<span class=\"arin\">هَلْ جَزَاءُ الإِحْسَانِ<\/span>‎<\/td><\/tr><tr><td>Disapproving denial ‎<span class=\"arin\">الإنكار<\/span>‎<\/td><td>‎<span class=\"arin\">أَغَيْرَ اللّهِ تَدْعُونَ<\/span>‎<\/td><\/tr><tr><td>Command ‎<span class=\"arin\">الأمر<\/span>‎<\/td><td>‎<span class=\"arin\">فَهَلْ أَنتُم مُّنتَهُونَ<\/span>‎<\/td><\/tr><tr><td>Prohibition ‎<span class=\"arin\">النهي<\/span>‎<\/td><td>‎<span class=\"arin\">أَتَخْشَوْنَهُمْ<\/span>‎<\/td><\/tr><tr><td>Arousing eagerness ‎<span class=\"arin\">التشويق<\/span>‎<\/td><td>‎<span class=\"arin\">هَلْ أَدُلُّكُمْ عَلَى تِجَارَةٍ<\/span>‎<\/td><\/tr><tr><td>Magnification ‎<span class=\"arin\">التعظيم<\/span>‎<\/td><td>‎<span class=\"arin\">مَن ذَا الَّذِي يَشْفَعُ عِنْدَهُ<\/span>‎<\/td><\/tr><tr><td>Belittling ‎<span class=\"arin\">التحقير<\/span>‎<\/td><td>‎<span class=\"arin\">أهذا الذي مدحته كثيراً؟<\/span>‎<\/td><\/tr><tr><td>Mockery ‎<span class=\"arin\">التهكّم<\/span>‎<\/td><td>‎<span class=\"arin\">أعقلك يسوغ لك<\/span>‎<\/td><\/tr><tr><td>Wonder ‎<span class=\"arin\">التعجّب<\/span>‎<\/td><td>‎<span class=\"arin\">مَالِ هَذَا الرَّسُولِ<\/span>‎<\/td><\/tr><tr><td>Drawing attention to misguidance<\/td><td>‎<span class=\"arin\">فَأَيْنَ تَذْهَبُونَ<\/span>‎<\/td><\/tr><tr><td>Threat ‎<span class=\"arin\">الوعيد<\/span>‎<\/td><td>‎<span class=\"arin\">أتفعل كذا وقد أحسنت إليك<\/span>‎<\/td><\/tr><\/tbody><\/table><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 54<\/span><\/div><div class=\"ar\">وأمّا التمنّي فهو طلب شيء محبوب لا يرجى حصوله لكونه مستحيلاً، أو بعيدَ الوقوع، كقوله:<span class=\"bayt\"><span class=\"h1\">أَلاَ لَيْتَ الشَبَابَ يَعُوْدُ يَوْماً<\/span><span class=\"h2\">فَأُخْبِرُه بِمَا فَعَلَ الْمَشِيْبُ<\/span><\/span>وقول المعسر: «ليت لي ألفَ دينار».<\/div><div class=\"tr\">As for wishing (tamannī), it is seeking something beloved whose attainment is not hoped for, because it is impossible or far from happening, as in the poet’s words: “Ah, if only youth would return one day, so that I could tell it what grey hair has done!”, and the words of the poor man: «If only I had a thousand dinars!».<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>The fourth kind of request is <b>wishing<\/b> (<i>tamannī<\/i>): asking for something you love but <b>do not expect<\/b> to get, either because it is <b>impossible<\/b> or because it is <b>very unlikely<\/b>.<\/p><p>The book gives one of each. The old man's wish that his youth would return is <b>impossible<\/b>. The poor man's wish for a thousand dinars is not impossible, but it is <b>far from happening<\/b>.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 54–55<\/span><\/div><div class=\"ar\">وإذا كان الأمر متوقّع الحصول؛ فإن ترقبه يسمّى «ترجّياً»، ويعبر عنه بـ«عسى» أو «لعلّ»، نحو: ﴿لَعَلَّ اللَّهَ يُحْدِثُ بَعْدَ ذَلِكَ أَمْراً﴾ [الطلاق: ١].<\/div><div class=\"tr\">If the matter is expected to happen, then awaiting it is called «tarajjī» (hoping), and it is expressed with «ʿasā» or «laʿalla», e.g. “Perhaps Allah will bring about some new matter after that” [al-Ṭalāq 65:1].<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>If the thing you want <b>is<\/b> expected to happen, waiting for it is not <i>tamannī<\/i> but <b>hoping<\/b> (<i>tarajjī<\/i>), and its words are ‎<span class=\"arin\">عسى<\/span>‎ and ‎<span class=\"arin\">لعلّ<\/span>‎, as in ‎<span class=\"arin\">لَعَلَّ اللَّهَ يُحْدِثُ بَعْدَ ذَلِكَ أَمْراً<\/span>‎.<\/p><\/div><div class=\"chartbox\"><div class=\"chh\">WISHING AND HOPING · DRAWN BY THE COMPANION<\/div><table class=\"grid\"><thead><tr><th><\/th><th>Tamannī ‎<span class=\"arin\">التمنّي<\/span>‎<\/th><th>Tarajjī ‎<span class=\"arin\">الترجّي<\/span>‎<\/th><\/tr><\/thead><tbody><tr><td>The thing wanted is…<\/td><td>impossible or far from happening<\/td><td>expected to happen<\/td><\/tr><tr><td>Its words<\/td><td>‎<span class=\"arin\">ليت<\/span>‎ (and ‎<span class=\"arin\">هل<\/span>‎، ‎<span class=\"arin\">لو<\/span>‎، ‎<span class=\"arin\">لعلّ<\/span>‎)<\/td><td>‎<span class=\"arin\">عسى<\/span>‎، ‎<span class=\"arin\">لعلّ<\/span>‎<\/td><\/tr><tr><td>Book's example<\/td><td>‎<span class=\"arin\">ليت لي ألفَ دينار<\/span>‎<\/td><td>‎<span class=\"arin\">لَعَلَّ اللَّهَ يُحْدِثُ<\/span>‎<\/td><\/tr><\/tbody><\/table><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 55–56<\/span><\/div><div class=\"ar\">وللتمنّي أربع أدوات: واحدة أصليّة، وهي «ليت» وثلاثة غير أصليّة، وهي «هل»، نحو: ﴿فَهَل لَّنَا مِن شُفَعَاء فَيَشْفَعُوا لَنَا﴾[الأعراف: ٥٣]. و«لو»، نحو: ﴿فَلَوْ أَنَّ لَنَا كَرَّةً فَنَكُونَ مِنَ الْمُؤْمِنِينَ﴾ [الشعراء: ١٠٢]. و«لعلّ»، نحو قوله:<span class=\"bayt\"><span class=\"h1\">أَسِرْبَ الْقَطَا هَلْ مَنْ يُعِيْرُ جَنَاحَهُ<\/span><span class=\"h2\">لَعَلِّيْ إِلَي مَنْ قَدْ هَوَيْتُ أَطِيْرُ<\/span><\/span><\/div><div class=\"tr\">Tamannī has four particles: one original, which is «layta», and three not original, which are «hal», e.g. “Are there then any intercessors for us, who might intercede for us?” [al-Aʿrāf 7:53]; «law», e.g. “If only we had another turn, so that we might be among the believers!” [al-Shuʿarāʾ 26:102]; and «laʿalla», as in the poet’s words: “O flock of sand-grouse, is there anyone who will lend me his wings? Perhaps I might fly to the one I have come to love.”<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>‎<span class=\"arin\">ليت<\/span>‎ is the word made for wishing. Three other words, whose original jobs are different, are also used for it:<\/p><p>‎<span class=\"arin\">هل<\/span>‎, normally a question word: the deniers say on the Day of Judgement ‎<span class=\"arin\">فَهَل لَّنَا مِن شُفَعَاء<\/span>‎, knowing there are none; it is a hopeless wish, not a real question.<\/p><p>‎<span class=\"arin\">لو<\/span>‎, normally a conditional word: \"If only we had another turn!\"<\/p><p>‎<span class=\"arin\">لعلّ<\/span>‎, normally for hoping: the poet asks the sand-grouse to lend him their wings so that he might fly to his beloved, something impossible, so ‎<span class=\"arin\">لعلّ<\/span>‎ here expresses a wish.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 56<\/span><\/div><div class=\"ar\">ولاستعمال هذه الأدوات في التمنّي ينصب المضارع الواقع في جوابها.<\/div><div class=\"tr\">Because these particles are used for tamannī, the present-tense verb that comes in their answer is put in the accusative.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>A grammatical sign of this: because these words carry the meaning of wishing, a <i>muḍāriʿ<\/i> that comes as their answer (after the <i>fāʾ<\/i>) is put in the accusative, as in ‎<span class=\"arin\">فَيَشْفَعُوا<\/span>‎ and ‎<span class=\"arin\">فَنَكُونَ<\/span>‎ in the verses above.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 56–57<\/span><\/div><div class=\"ar\">وأمّا النداء، فهو طلب الإقبال بحرف نائب مناب «أدعوا»، وأدواته ثمانية: يا، والهمزة، وأي، وآ، وآي، وأيا، وهيا، ووا.<\/div><div class=\"tr\">As for calling (nidāʾ), it is seeking someone’s attention (iqbāl, literally “turning towards”) with a particle that stands in place of «I call». Its particles are eight: yā, the hamzah, ay, ā, āy, ayā, hayā and wā.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>The fifth kind of request is <b>calling<\/b> (<i>nidāʾ<\/i>): asking someone to turn towards you, using a particle that stands in for the verb \"I call\". So ‎<span class=\"arin\">يا محمّد<\/span>‎ means \"I call Muḥammad\". The book lists eight particles.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 57<\/span><\/div><div class=\"ar\">فالهمزة و«أي» للقريب، وغيرهما للبعيد، وقد ينزّل البعيد منزلة القريب فينادى بالهمزة و«أي» إشارةً إلى أنّه لشدّة استحضاره في ذهن المتكلّم صار كالحاضر معه، كقول الشاعر:<span class=\"bayt\"><span class=\"h1\">أَسُكَّانَ نَعْمَانَ الأَرَاكِ تَيَقَّنُوْا<\/span><span class=\"h2\">بِأَنَّكُمْ في رَبْعِ قَلْبِيْ سُكَّانُ<\/span><\/span><\/div><div class=\"tr\">The hamzah and «ay» are for someone near, and the others are for someone far. Someone far may be treated as near and called with the hamzah or «ay», to show that because he is so vividly present in the speaker’s mind, he has become like someone present with him, as in the poet’s words: “O dwellers of Naʿmān al-Arāk, be certain that you are dwellers in the abode of my heart.”<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>The basic rule: the hamzah and ‎<span class=\"arin\">أي<\/span>‎ are for calling someone <b>near<\/b>; the other six are for someone <b>far<\/b>.<\/p><p>But a far person may be called with the particle of the near, to show that he is so present in the speaker's mind that it is as if he were right beside him. The poet calls the people of Naʿmān al-Arāk, who are far away, with the hamzah ‎<span class=\"arin\">أَسُكَّانَ<\/span>‎, because they live in his heart.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 57–58<\/span><\/div><div class=\"ar\">وقد ينزّل القريب منزلة البعيد، فينادى بأحد الحروف الموضوعة له إشارةً إلى أنّ المنادى عظيم الشأن، رفيع المرتبة، حتّى كأنّ بعد درجته في العظم عن درجة المتكلّم بعد في المسافة، كقولك: «أيا مولاي» وأنت معه، أو إشارةً إلى انحطاط درجته،
