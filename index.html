كقولك: «أيا هذا» لِمَن هو معك، أو إشارةً إلى أنّ السامع غافل لنحو نوم، أو ذهول، كأنّه غير حاضر في المجلس، كقولك للساهي: «أيا فلان».<\/div><div class=\"tr\">Someone near may be treated as far, and called with one of the particles coined for the far. This may show that the one called is of great importance and high rank, so that the distance of his rank in greatness from the speaker’s rank is like a distance in space, as when you say «O my master» (ayā mawlāya) while you are with him. Or it may show that his rank is low, as when you say «O you there» (ayā hādhā) to someone who is with you. Or it may show that the listener is unaware because of something like sleep or distraction, as if he were not present in the gathering, as when you say to someone absent-minded: «O so-and-so» (ayā fulān).<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>And the opposite: a near person may be called with a particle of the far, for one of three reasons:<\/p><p>(1) His <b>high rank<\/b>: ‎<span class=\"arin\">أيا مولاي<\/span>‎ to your master, though he is with you, as if his greatness put him at a distance.<\/p><p>(2) His <b>low rank<\/b>: ‎<span class=\"arin\">أيا هذا<\/span>‎ to someone beside you, as if he were too low to be near.<\/p><p>(3) His <b>inattention<\/b>: ‎<span class=\"arin\">أيا فلان<\/span>‎ to someone sleepy or distracted, as if he were not in the room.<\/p><\/div><div class=\"chartbox\"><div class=\"chh\">PARTICLES OF CALLING · DRAWN BY THE COMPANION<\/div><table class=\"grid\"><thead><tr><th><\/th><th>Normally for<\/th><th>Used for the other, when…<\/th><\/tr><\/thead><tbody><tr><td>Hamzah, ‎<span class=\"arin\">أي<\/span>‎<\/td><td>the near<\/td><td>the far one is vividly present in the heart<\/td><\/tr><tr><td>‎<span class=\"arin\">يا<\/span>‎، ‎<span class=\"arin\">آ<\/span>‎، ‎<span class=\"arin\">آي<\/span>‎، ‎<span class=\"arin\">أيا<\/span>‎، ‎<span class=\"arin\">هيا<\/span>‎، ‎<span class=\"arin\">وا<\/span>‎<\/td><td>the far<\/td><td>the near one is of high rank, low rank, or inattentive<\/td><\/tr><\/tbody><\/table><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 58<\/span><\/div><div class=\"ar\">وقد تخرج ألفاظ النداء عن معناها الأصليّ لمعانٍ أخر تفهم من القرائن:<\/div><div class=\"tr\">The words of calling sometimes leave their original meaning for other meanings that are understood from contextual indications (qarāʾin):<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>As with every other form of <i>inshāʾ<\/i>, the call can be used for meanings other than calling. The book gives five.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 58<\/span><\/div><div class=\"ar\">(١) كالإغراء، نحو قولك لِمَن أقبل يتظلّم: «يا مظلوم».<\/div><div class=\"tr\">(1) Such as urging (ighrāʾ), as when you say to someone who has come to you complaining of wrong: «O wronged one!».<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Urging<\/b> (<i>ighrāʾ<\/i>): \"O wronged one!\" said to someone complaining of injustice encourages him to speak up and pursue his complaint.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 59<\/span><\/div><div class=\"ar\">(٢) والزجرِ، نحو:<span class=\"bayt\"><span class=\"h1\">أَفوَادِيْ مَتَى الْمَتَابُ أَلَمَّا<\/span><span class=\"h2\">تَصْحُ وَالشَّيْبُ فَوْقَ رَأْسِيْ أَلَمَّا<\/span><\/span><\/div><div class=\"tr\">(2) And rebuke (zajr), e.g. “O my heart, when will you repent? Have you not yet come to your senses, when grey hair has come down upon my head?”<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Rebuke<\/b> (<i>zajr<\/i>): the poet calls his own heart and scolds it: grey hair has come, so when will you repent?<\/div><div class=\"cnote\"><span class=\"cnh\">COMPANION&#8217;S NOTE · NOT IN THE BOOK<\/span><p>The first word of the verse is printed «أَفوَادِيْ», without the hamzah on the wāw. The intended reading is «أَفُؤَادِيْ» (“O my heart”).<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 59<\/span><\/div><div class=\"ar\">(٣) والتحيّر والتضجّر، نحو: «أيا منازل سلمى أين سلماك»؟ ويكثر هذا في نداء الأطلال، والمطايا، ونحوها.<\/div><div class=\"tr\">(3) And bewilderment and distress (taḥayyur, taḍajjur), e.g. «O dwellings of Salmā, where is your Salmā?». This is common when calling ruins, riding camels and the like.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Bewilderment and distress<\/b>: calling the empty dwellings of Salmā, which cannot answer, expresses the poet's confusion and pain at her absence. The book notes this is common when poets call ruins and riding camels.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 59<\/span><\/div><div class=\"ar\">(٤) والتحسّر والتوجّع، كقوله:<span class=\"bayt\"><span class=\"h1\">أَيَا قَبْرَ مَعْنٍ كَيْفَ وَارَيْتَ جُوْدَهُ<\/span><span class=\"h2\">وَقَدْ كَانَ مِنْهُ الْبَرُّ وَالْبَحْرُ مُتْرَعاً<\/span><\/span><\/div><div class=\"tr\">(4) And grief and pain (taḥassur, tawajjuʿ), as in the poet’s words: “O grave of Maʿn, how did you hide his generosity, when land and sea had been filled by it?”<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Grief and pain<\/b>: the poet calls the grave of Maʿn, a man famous for generosity, and asks how it could hold a generosity that had filled land and sea. The call expresses sorrow at his death.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 59<\/span><\/div><div class=\"ar\">(٥) والتذكّر، نحو:<span class=\"bayt\"><span class=\"h1\">أَيَا مَنْزِلَيْ سَلْمَي سَلاَمٌ عَلَيْكُمَا<\/span><span class=\"h2\">هَلِ الْأَزْمُنُ اللاَتِيْ مَضَيْنَ رَوَاجِعُ<\/span><\/span><\/div><div class=\"tr\">(5) And remembering (tadhakkur), e.g. “O two dwellings of Salmā, peace be upon you both! Will the times that have passed ever return?”<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Remembering<\/b> (<i>tadhakkur<\/i>): calling the two dwellings of Salmā brings back memories of the times spent there, and the poet asks whether those days will ever return.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 60<\/span><\/div><div class=\"ar\">وغير الطلبيّ يكون بالتعجّب، والقسمِ، وصيغِ العقود، كـ«بعت»، و«اشتريت»، ويكون بغير ذلك.<\/div><div class=\"tr\">Non-requestive inshāʾ (ghayr al-ṭalabī) comes through exclamation (taʿajjub), oaths, and the formulas of contracts, such as «I have sold» and «I have bought», and it comes through other things besides.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>Finally the <b>non-requesting<\/b> <i>inshāʾ<\/i>: speech that does not ask for anything and is not a statement either. The book gives exclamations of wonder (‎<span class=\"arin\">ما أحسن…<\/span>‎), oaths, and the formulas of contracts such as ‎<span class=\"arin\">بعت<\/span>‎ and ‎<span class=\"arin\">اشتريت<\/span>‎. When a seller says ‎<span class=\"arin\">بعت<\/span>‎ to complete a sale, he is not reporting a past sale; the sale <b>happens<\/b> by his saying it.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 60<\/span><\/div><div class=\"ar\">وأنواع الإنشاء غير الطلبيّ ليست من مباحث علم المعاني فلذا ضربنا صفحاً عنها.<\/div><div class=\"tr\">The kinds of non-requestive inshāʾ are not among the topics of ʿilm al-maʿānī, so we have passed them over.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>The book does not go further into these, because their kinds are not among the topics of <i>ʿilm al-maʿānī<\/i>.<\/p><\/div><div class=\"chartbox\"><div class=\"chh\">THE WHOLE CHAPTER AT A GLANCE · DRAWN BY THE COMPANION<\/div><div class=\"tree\"><div class=\"node\">Kalām<span class=\"ar\">الكلام<\/span><\/div><div class=\"stem\"><\/div><div class=\"bar\" style=\"margin:0 25.00%\"><\/div><div class=\"row\"><div class=\"col\"><div class=\"node\">Khabar<span class=\"ar\">الخبر<\/span><\/div><div class=\"stem\"><\/div><div class=\"bar\" style=\"margin:0 16.67%\"><\/div><div class=\"row\"><div class=\"col\"><div class=\"node\">Ibtidāʾī<span class=\"ar\">ابتدائي<\/span><\/div><div class=\"sub\">no emphasis<\/div><\/div><div class=\"col\"><div class=\"node\">Ṭalabī<span class=\"ar\">طلبي<\/span><\/div><div class=\"sub\">one emphasis<\/div><\/div><div class=\"col\"><div class=\"node\">Inkārī<span class=\"ar\">إنكاري<\/span><\/div><div class=\"sub\">more emphasis<\/div><\/div><\/div><\/div><div class=\"col\"><div class=\"node\">Inshāʾ<span class=\"ar\">الإنشاء<\/span><\/div><div class=\"stem\"><\/div><div class=\"bar\" style=\"margin:0 25.00%\"><\/div><div class=\"row\"><div class=\"col\"><div class=\"node\">Ṭalabī<span class=\"ar\">طلبي<\/span><\/div><div class=\"sub\">amr, nahy, istifhām, tamannī, nidāʾ<\/div><\/div><div class=\"col\"><div class=\"node\">Ghayr ṭalabī<span class=\"ar\">غير طلبي<\/span><\/div><div class=\"sub\">wonder, oath, contracts<\/div><\/div><\/div><\/div><\/div><\/div><\/div><div class=\"box\"><div class=\"bh\">KEY TERMS AND THEIR MEANINGS · ADDED BY THE COMPANION<\/div><table class=\"terms\"><tr><td class=\"t\">Khabar<\/td><td>Speech of which it can rightly be said that its speaker is truthful or lying in it.<\/td><td class=\"a\">الخبر<\/td><\/tr><tr><td class=\"t\">Inshāʾ<\/td><td>Speech of which that cannot rightly be said of its speaker.<\/td><td class=\"a\">الإنشاء<\/td><\/tr><tr><td class=\"t\">Ṣidq / kidhb al-khabar<\/td><td>Truth of a statement is its matching reality; falsehood is its not matching reality.<\/td><td class=\"a\">صدق الخبر / كذبه<\/td><\/tr><tr><td class=\"t\">Musnad ilayh<\/td><td>The first pillar of every sentence, the thing judged about: the subject, its substitute, and the mubtadaʾ that has a khabar.<\/td><td class=\"a\">مسنداً إليه<\/td><\/tr><tr><td class=\"t\">Musnad<\/td><td>The second pillar, the thing judged with: such as the verb, and the mubtadaʾ that is satisfied with the noun it puts in the nominative.<\/td><td class=\"a\">مسنداً<\/td><\/tr><tr><td class=\"t\">Fāʾidat al-khabar<\/td><td>The judgement the sentence contains, when the statement is made to inform the listener of it.<\/td><td class=\"a\">فائدة الخبر<\/td><\/tr><tr><td class=\"t\">Lāzim al-fāʾidah<\/td><td>That the speaker knows the judgement, when the statement is made to show this.<\/td><td class=\"a\">لازم الفائدة<\/td><\/tr><tr><td class=\"t\">Ibtidāʾī<\/td><td>A statement free of emphasis, given to a listener whose mind is empty of the judgement.<\/td><td class=\"a\">ابتدائيًّا<\/td><\/tr><tr><td class=\"t\">Ṭalabī<\/td><td>A statement given one emphasis, to a listener who is unsure and seeks to know.<\/td><td class=\"a\">طلبيًّا<\/td><\/tr><tr><td class=\"t\">Inkārī<\/td><td>A statement emphasised with one emphasis or more, according to the degree of the listener’s denial.<\/td><td class=\"a\">إنكاريًّا<\/td><\/tr><tr><td class=\"t\">Ṭalabī (inshāʾ)<\/td><td>Inshāʾ that calls for something sought that is not yet obtained at the time of asking.<\/td><td class=\"a\">الطلبيّ<\/td><\/tr><tr><td class=\"t\">Ghayr ṭalabī<\/td><td>Inshāʾ that is not of that kind, such as exclamation, oaths and contract formulas.<\/td><td class=\"a\">غير الطلبيّ<\/td><\/tr><tr><td class=\"t\">Amr<\/td><td>Seeking an action from a position of superiority.<\/td><td class=\"a\">الأمر<\/td><\/tr><tr><td class=\"t\">Nahy<\/td><td>Seeking that an action be refrained from, from a position of superiority.<\/td><td class=\"a\">النهي<\/td><\/tr><tr><td class=\"t\">Istifhām<\/td><td>Seeking knowledge of something.<\/td><td class=\"a\">الاستفهام<\/td><\/tr><tr><td class=\"t\">Taṣawwur<\/td><td>Perceiving a single item.<\/td><td class=\"a\">التصوّر<\/td><\/tr><tr><td class=\"t\">Taṣdīq<\/td><td>Perceiving the relation (nisbah).<\/td><td class=\"a\">التصديق<\/td><\/tr><tr><td class=\"t\">Muʿādil<\/td><td>The counterpart mentioned after «am» in a question about taṣawwur.<\/td><td class=\"a\">معادل<\/td><\/tr><tr><td class=\"t\">Muttaṣilah / munqaṭiʿah<\/td><td>«Am» joined to the hamzah of taṣawwur with a counterpart, versus «am» meaning «bal».<\/td><td class=\"a\">متّصلة / منقطعة<\/td><\/tr><tr><td class=\"t\">Hal basīṭah<\/td><td>«Hal» asking about the existence of a thing in itself.<\/td><td class=\"a\">بسيطةً<\/td><\/tr><tr><td class=\"t\">Hal murakkabah<\/td><td>«Hal» asking about the existence of something for something.<\/td><td class=\"a\">مركبةً<\/td><\/tr><tr><td class=\"t\">Tamannī<\/td><td>Seeking something beloved whose attainment is not hoped for, being impossible or far from happening.<\/td><td class=\"a\">التمنّي<\/td><\/tr><tr><td class=\"t\">Tarajjī<\/td><td>Awaiting something whose attainment is expected; expressed with «ʿasā» or «laʿalla».<\/td><td class=\"a\">ترجّياً<\/td><\/tr><tr><td class=\"t\">Nidāʾ<\/td><td>Seeking someone’s turning towards one, with a particle standing in place of «adʿū».<\/td><td class=\"a\">النداء<\/td><\/tr><\/table><\/div><h3>QUESTIONS AND ANSWERS<span class=\"ar\">أسئلة وأجوبة<\/span><\/h3><div class=\"qabox\"><div class=\"qh\">QUESTIONS AND ANSWERS · ADDED BY THE COMPANION<\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>How do you tell a <i>khabar<\/i> from an <i>inshāʾ<\/i>?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>If it is valid to say to the speaker \"you are truthful\" or \"you are lying\", it is a <i>khabar<\/i>; if not, it is an <i>inshāʾ<\/i>. E.g. ‎<span class=\"arin\">سافر محمّد<\/span>‎ is a <i>khabar<\/i>, ‎<span class=\"arin\">سافر يامحمّد<\/span>‎ an <i>inshāʾ<\/i>.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>What makes a statement true or false?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>It is true if the relation it expresses matches reality, and false if it does not.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>Name the two pillars of a sentence and give examples of each from grammar.<\/div><div class=\"a\"><span class=\"k\">A.<\/span>The <i>musnad ilayhi<\/i> (e.g. the <i>fāʿil<\/i>, <i>nāʾib al-fāʿil<\/i>, the <i>mubtadaʾ<\/i> with a <i>khabar<\/i>) and the <i>musnad<\/i> (e.g. the verb, the <i>mubtadaʾ<\/i> content with its <i>marfūʿ<\/i>).<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>What does a verbal sentence convey, and a nominal sentence?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>A verbal sentence conveys something happening at a particular time, briefly; with a <i>muḍāriʿ<\/i> and context it can convey repeated renewal. A nominal sentence conveys that the predicate is established for the subject; with context it can convey steady continuity.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>Explain <i>fāʾidat al-khabar<\/i> and <i>lāzim al-fāʾidah<\/i> with examples.<\/div><div class=\"a\"><span class=\"k\">A.<\/span><i>Fāʾidat al-khabar<\/i> is giving the listener the information, as in ‎<span class=\"arin\">حضر الأمــير<\/span>‎. <i>Lāzim al-fāʾidah<\/i> is showing that the speaker knows it, as in ‎<span class=\"arin\">أنت حضرت أمس<\/span>‎.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>What is the purpose of the statement in ‎<span class=\"arin\">رَبِّ إِنِّي وَهَنَ الْعَظْمُ مِنِّي<\/span>‎?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>Showing weakness (<i>iẓhār al-ḍaʿf<\/i>); it is not meant to inform, since Allah knows all.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>Name the three kinds of statement according to the listener, with examples.<\/div><div class=\"a\"><span class=\"k\">A.<\/span><i>Ibtidāʾī<\/i> for an empty mind: ‎<span class=\"arin\">أخوك قادم<\/span>‎; <i>ṭalabī<\/i> for a hesitant listener: ‎<span class=\"arin\">إنّ أخاك قادم<\/span>‎; <i>inkārī<\/i> for a denier: ‎<span class=\"arin\">إنّه لقادم<\/span>‎ or ‎<span class=\"arin\">واللهِ! إنّه لقادم<\/span>‎.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>Define the command and give its four forms.<\/div><div class=\"a\"><span class=\"k\">A.<\/span>Asking for an action from a position of superiority. Its forms: the imperative, the <i>muḍāriʿ<\/i> with <i>lām<\/i>, the <i>ism fiʿl al-amr<\/i>, and the <i>maṣdar<\/i> in place of the imperative.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>What does the command form mean in ‎<span class=\"arin\">أَوْزِعْنِي أَنْ أَشْكُرَ نِعْمَتَكَ<\/span>‎, in ‎<span class=\"arin\">اعْمَلُوا مَا شِئْتُمْ<\/span>‎, and in ‎<span class=\"arin\">فَاصْبِرُوا أَوْ لاَ تَصْبِرُوا<\/span>‎?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>Supplication; threat; and making equal (<i>taswiyah<\/i>).<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>What is the difference between <i>taṣawwur<\/i> and <i>taṣdīq<\/i>? Which question words are used for each?<\/div><div class=\"a\"><span class=\"k\">A.<\/span><i>Taṣawwur<\/i> is seeking a single thing (answered by naming it); <i>taṣdīq<\/i> is seeking the relation (answered yes or no). The hamzah serves both; ‎<span class=\"arin\">هل<\/span>‎ is for <i>taṣdīq<\/i> only; the other question words are for <i>taṣawwur<\/i>.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>Why can one not say ‎<span class=\"arin\">هل جاء صديقك أم عدوّك<\/span>‎?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>Because ‎<span class=\"arin\">هل<\/span>‎ is only for <i>taṣdīq<\/i>, which has no counterpart; mentioning an alternative belongs to <i>taṣawwur<\/i>.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>Give the three meanings of ‎<span class=\"arin\">أنّى<\/span>‎ with examples.<\/div><div class=\"a\"><span class=\"k\">A.<\/span>\"How\": ‎<span class=\"arin\">أَنَّى يُحْيِـيْ هَـٰذِهِ اللهُ<\/span>‎; \"from where\": ‎<span class=\"arin\">أَنَّى لَكِ هَـٰذَا<\/span>‎; \"when\": \"visit whenever you wish\".<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>What do the questions in ‎<span class=\"arin\">هَلْ جَزَاءُ الإِحْسَانِ إِلاَّ الإِحْسَانُ<\/span>‎ and ‎<span class=\"arin\">فَأَيْنَ تَذْهَبُونَ<\/span>‎ really mean?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>The first is negation (the reward of good is only good); the second draws attention to misguidance.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>Distinguish <i>tamannī<\/i> from <i>tarajjī<\/i>.<\/div><div class=\"a\"><span class=\"k\">A.<\/span><i>Tamannī<\/i> seeks something loved that is impossible or unlikely (‎<span class=\"arin\">ليت<\/span>‎); <i>tarajjī<\/i> awaits something expected (‎<span class=\"arin\">عسى<\/span>‎، ‎<span class=\"arin\">لعلّ<\/span>‎).<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>Why might a speaker call someone beside him with ‎<span class=\"arin\">أيا<\/span>‎?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>To show his high rank, his low rank, or that he is inattentive, as if he were far away.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>Give three things the non-requesting <i>inshāʾ<\/i> comes through. Why does the book not discuss them?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>Exclamation, oaths and contract formulas such as ‎<span class=\"arin\">بعت<\/span>‎. They are not among the topics of <i>ʿilm al-maʿānī<\/i>.<\/div><\/div><\/div>", "terms": [{"t": "Khabar", "m": "Speech of which it can rightly be said that its speaker is truthful or lying in it.", "a": "الخبر"}, {"t": "Inshāʾ", "m": "Speech of which that cannot rightly be said of its speaker.", "a": "الإنشاء"}, {"t": "Ṣidq / kidhb al-khabar", "m": "Truth of a statement is its matching reality; falsehood is its not matching reality.", "a": "صدق الخبر / كذبه"}, {"t": "Musnad ilayh", "m": "The first pillar of every sentence, the thing judged about: the subject, its substitute, and the mubtadaʾ that has a khabar.", "a": "مسنداً إليه"}, {"t": "Musnad", "m": "The second pillar, the thing judged with: such as the verb, and the mubtadaʾ that is satisfied with the noun it puts in the nominative.", "a": "مسنداً"}, {"t": "Fāʾidat al-khabar", "m": "The judgement the sentence contains, when the statement is made to inform the listener of it.", "a": "فائدة الخبر"}, {"t": "Lāzim al-fāʾidah", "m": "That the speaker knows the judgement, when the statement is made to show this.", "a": "لازم الفائدة"}, {"t": "Ibtidāʾī", "m": "A statement free of emphasis, given to a listener whose mind is empty of the judgement.", "a": "ابتدائيًّا"}, {"t": "Ṭalabī", "m": "A statement given one emphasis, to a listener who is unsure and seeks to know.", "a": "طلبيًّا"}, {"t": "Inkārī", "m": "A statement emphasised with one emphasis or more, according to the degree of the listener’s denial.", "a": "إنكاريًّا"}, {"t": "Ṭalabī (inshāʾ)", "m": "Inshāʾ that calls for something sought that is not yet obtained at the time of asking.", "a": "الطلبيّ"}, {"t": "Ghayr ṭalabī", "m": "Inshāʾ that is not of that kind, such as exclamation, oaths and contract formulas.", "a": "غير الطلبيّ"}, {"t": "Amr", "m": "Seeking an action from a position of superiority.", "a": "الأمر"}, {"t": "Nahy", "m": "Seeking that an action be refrained from, from a position of superiority.", "a": "النهي"}, {"t": "Istifhām", "m": "Seeking knowledge of something.", "a": "الاستفهام"}, {"t": "Taṣawwur", "m": "Perceiving a single item.", "a": "التصوّر"}, {"t": "Taṣdīq", "m": "Perceiving the relation (nisbah).", "a": "التصديق"}, {"t": "Muʿādil", "m": "The counterpart mentioned after «am» in a question about taṣawwur.", "a": "معادل"}, {"t": "Muttaṣilah / munqaṭiʿah", "m": "«Am» joined to the hamzah of taṣawwur with a counterpart, versus «am» meaning «bal».", "a": "متّصلة / منقطعة"}, {"t": "Hal basīṭah", "m": "«Hal» asking about the existence of a thing in itself.", "a": "بسيطةً"}, {"t": "Hal murakkabah", "m": "«Hal» asking about the existence of something for something.", "a": "مركبةً"}, {"t": "Tamannī", "m": "Seeking something beloved whose attainment is not hoped for, being impossible or far from happening.", "a": "التمنّي"}, {"t": "Tarajjī", "m": "Awaiting something whose attainment is expected; expressed with «ʿasā» or «laʿalla».", "a": "ترجّياً"}, {"t": "Nidāʾ", "m": "Seeking someone’s turning towards one, with a particle standing in place of «adʿū».", "a": "النداء"}], "part": null}, {"num": 4, "title": "Mention and Omission", "ar": "الباب الثاني في الذكر والحذف", "body": "<h3>CHAPTER TWO: ON MENTION AND OMISSION<span class=\"ar\">الباب الثاني في الذكر والحذف<\/span><\/h3><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 61<\/span><\/div><div class=\"ar\">إذا أريد إفادة السامع حكماً، فأيّ لفظ يدلّ على معنى فيه فالأصل ذكره، وأيّ لفظ علم من الكلام لدلالة باقيه عليه فالأصل حذفه، وإذا تعارض هذان الأصلان فلا يعدل عن مقتضى أحدهما إلى مقتضى الآخر إلاّ لداع، فمن دواعي الذكر:<\/div><div class=\"tr\">When it is intended to convey a ruling to the listener, then any word that indicates a meaning in it [i.e. in the speech] — the basic rule is to mention it; and any word that is known from the speech because the rest of it points to it — the basic rule is to omit it. When these two basic rules conflict, one does not turn from what one of them requires to what the other requires except for a motive. Among the motives for mention are:<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>This chapter is about a simple choice every speaker makes: do I <b>say<\/b> this word, or <b>leave it out<\/b>? The book starts with two basic rules (<i>aṣl<\/i>).<\/p><b>Rule 1:<\/b> a word that carries part of the meaning should be <b>mentioned<\/b>. If it is left out, the listener loses that meaning.<b>Rule 2:<\/b> a word that the listener already knows from the rest of the speech should be <b>omitted<\/b>. Saying it is unnecessary.<p>Sometimes a word fits both rules at once: it carries meaning, <b>and<\/b> the listener could work it out. Then the two rules pull in opposite directions. The book says you may only go against either rule if there is a <b>motive<\/b> (<i>dāʿī<\/i>) for doing so. The rest of the chapter lists those motives: ten for mention and ten for omission.<\/p><\/div><div class=\"chartbox\"><div class=\"chh\">THE TWO BASIC RULES · DRAWN BY THE COMPANION<\/div><table class=\"grid\"><thead><tr><th><\/th><th>Mention ‎<span class=\"arin\">الذكر<\/span>‎<\/th><th>Omission ‎<span class=\"arin\">الحذف<\/span>‎<\/th><\/tr><\/thead><tbody><tr><td>The basic rule applies when…<\/td><td>the word carries part of the meaning<\/td><td>the word is known from the rest of the speech<\/td><\/tr><tr><td>Leaving the basic rule needs…<\/td><td>a motive for omission<\/td><td>a motive for mention<\/td><\/tr><\/tbody><\/table><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 61<\/span><\/div><div class=\"ar\">(١) زيادةُ التقرير والإيضاح، نحو: ﴿أُوْلَـئِكَ عَلَى هُدًى مِّن رَّبِّهِمْ وَأُوْلَـئِكَ هُمُ الْمُفْلِحُونَ﴾ [البقرة: ٥].<\/div><div class=\"tr\">(1) Increasing the establishing [of the meaning] and its clarification, as in: ﴿Those are upon guidance from their Lord, and those are the successful ones﴾ [al-Baqarah 2:5].<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Increasing the establishment and clarity of the meaning.<\/b> In the verse, ‎<span class=\"arin\">أُوْلَـئِكَ<\/span>‎ is repeated before ‎<span class=\"arin\">هُمُ الْمُفْلِحُونَ<\/span>‎. The listener would have understood without it, but mentioning it again fixes the meaning more firmly and makes it clearer: <i>these very people<\/i>, and no others, are the successful.<p>Notice the word <b>increasing<\/b>: the meaning would be clear even with omission; mention adds <b>more<\/b> clarity.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 62<\/span><\/div><div class=\"ar\">(٢) وقلّةُ الثقة بالقرينة؛ لضعفها أو ضعفِ فهم السامع، نحو: «زيد نعم الصديق»، تقول ذلك إذا سبق لك ذكر زيد، وطال عهد السامع به، أو ذكر معه كلام في شأن غيره.<\/div><div class=\"tr\">(2) Little trust in the contextual indicator, either because it is weak or because the listener’s understanding is weak, as in: “Zayd — what an excellent friend!” You say this when you have already mentioned Zayd, but a long time has passed since the listener heard of him, or other talk about someone else has been mentioned alongside it.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Little trust in the clue.<\/b> Omission relies on a clue (<i>qarīnah<\/i>) that tells the listener what is missing. If that clue is weak, or the listener is slow to pick it up, the speaker should mention the word to be safe.<p>In the example, Zayd was mentioned earlier, which would normally allow you to omit him. But if a long time has passed, or other people have been talked about since, the listener may not know whom you mean. So you say ‎<span class=\"arin\">زيد نعم الصديق<\/span>‎ in full.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 62<\/span><\/div><div class=\"ar\">(٣) والتعريضُ بغباوة السامع، نحو: «عمرو قال كذا» في جواب «ماذا قال عمرو؟»<\/div><div class=\"tr\">(3) Hinting at the listener’s dullness, as in: “ʿAmr said such-and-such,” in answer to “What did ʿAmr say?”<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Hinting at the listener's dullness.<\/b> When someone asks \"What did ʿAmr say?\", you could simply answer with what he said. By repeating ‎<span class=\"arin\">عمرو<\/span>‎, you hint that the listener is so slow that even the obvious must be spelt out for him.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 62–63<\/span><\/div><div class=\"ar\">(٤) والتسجيلُ على السامع حتّى لا يتأتّى له الإنكار، كما إذا قال الحاكم لشاهد: «هل أقرّ زيد هذا بأنّ عليه كذا»، فيقول الشاهد: «نعم زيد هذا أقرّ بأنّ عليه كذا».<\/div><div class=\"tr\">(4) Putting it on record against the listener so that denial is not possible for him, as when the judge says to a witness: “Did this Zayd acknowledge that he owes such-and-such?” and the witness says: “Yes, this Zayd acknowledged that he owes such-and-such.”<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Putting it on record.<\/b> In court, the witness repeats ‎<span class=\"arin\">زيد هذا<\/span>‎ in his answer, even though the judge's question already named him. This leaves no room for Zayd later to claim that the witness meant someone else.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 63<\/span><\/div><div class=\"ar\">(٥) والتعجّبُ إذا كان الحكم غريباً، نحو: «عليّ يقاوم الأسد»، تقول ذلك مع سبق ذكره.<\/div><div class=\"tr\">(5) Wonder, when the ruling is strange, as in: “ʿAlī stands up to the lion!” You say this even though he has already been mentioned.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Wonder.<\/b> When the news is surprising, mentioning the person again shows your amazement: \"<i>ʿAlī<\/i> stands up to the lion!\" Even though ʿAlī has been mentioned before, saying his name again expresses your wonder that <i>he<\/i> of all people should do it.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 63<\/span><\/div><div class=\"ar\">(٦) والتعظيمُ والإهانة، إذا كان اللفظ يفيد ذلك كأن يسألك سائل: «هل رجع القائد؟» فتقول: «رجع المنصور» أو المهزوم».<\/div><div class=\"tr\">(6) Exalting and disparaging, when the word conveys that; for example, someone asks you: “Has the commander returned?” and you say: “The victorious one has returned,” or “the defeated one.”<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Exalting or disparaging<\/b>, when the word itself carries praise or blame. Asked \"Has the commander returned?\", you answer with a title instead of a pronoun: ‎<span class=\"arin\">رجع المنصور<\/span>‎ (the victorious one) honours him; \"the defeated one\" puts him down. The title says something the pronoun could not.<\/div><div class=\"chartbox\"><div class=\"chh\">MOTIVES FOR MENTION · DRAWN BY THE COMPANION<\/div><table class=\"grid\"><thead><tr><th>Motive<\/th><th>Book's example<\/th><\/tr><\/thead><tbody><tr><td>Increasing establishment and clarity ‎<span class=\"arin\">زيادة التقرير والإيضاح<\/span>‎<\/td><td>‎<span class=\"arin\">وَأُوْلَـئِكَ هُمُ الْمُفْلِحُونَ<\/span>‎<\/td><\/tr><tr><td>Little trust in the clue ‎<span class=\"arin\">قلّةُ الثقة بالقرينة<\/span>‎<\/td><td>‎<span class=\"arin\">زيد نعم الصديق<\/span>‎<\/td><\/tr><tr><td>Hinting at the listener's dullness ‎<span class=\"arin\">التعريضُ بغباوة السامع<\/span>‎<\/td><td>‎<span class=\"arin\">عمرو قال كذا<\/span>‎<\/td><\/tr><tr><td>Putting on record ‎<span class=\"arin\">التسجيلُ على السامع<\/span>‎<\/td><td>‎<span class=\"arin\">نعم زيد هذا أقرّ<\/span>‎<\/td><\/tr><tr><td>Wonder ‎<span class=\"arin\">التعجّب<\/span>‎<\/td><td>‎<span class=\"arin\">عليّ يقاوم الأسد<\/span>‎<\/td><\/tr><tr><td>Exalting and disparaging ‎<span class=\"arin\">التعظيمُ والإهانة<\/span>‎<\/td><td>‎<span class=\"arin\">رجع المنصور<\/span>‎<\/td><\/tr><\/tbody><\/table><\/div><div class=\"cnote\"><span class=\"cnh\">COMPANION&#8217;S NOTE · NOT IN THE BOOK<\/span><p>Printing note: the book prints ‎<span class=\"arin\">«رجع المنصور» أو المهزوم»<\/span>‎ with a closing mark after ‎<span class=\"arin\">المهزوم<\/span>‎ but no opening mark before it; it is reproduced as printed. The likely intended form is ‎<span class=\"arin\">«رجع المنصور» أو «المهزوم»<\/span>‎.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 63<\/span><\/div><div class=\"ar\">ومن دواعي الحذف:<\/div><div class=\"tr\">Among the motives for omission are:<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>Now the motives for <b>omission<\/b>: reasons to leave out a word that carries meaning, because the listener can work it out.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 63<\/span><\/div><div class=\"ar\">(١) إخفاءُ الأمر عن غير المخاطَب، نحو: «أقبل» تريد عليًّا مثلاً.<\/div><div class=\"tr\">(1) Hiding the matter from anyone other than the person addressed, as in: “He has come,” meaning ʿAlī, for example.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Hiding the matter from others.<\/b> If you and your friend both know whom you are expecting, you can say just ‎<span class=\"arin\">أقبل<\/span>‎, \"He has come\". Your friend understands you mean ʿAlī; the others present do not.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 63–64<\/span><\/div><div class=\"ar\">(٢) وتأتِّي الإنكار عند الحاجة، نحو: «لئيم خسيس»، بعد ذكر شخص معيّن.<\/div><div class=\"tr\">(2) Making denial possible when it is needed, as in: “Base and vile!” after a particular person has been mentioned.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Keeping the chance to deny.<\/b> Saying ‎<span class=\"arin\">لئيم خسيس<\/span>‎, \"Base and vile!\", after a certain person has been mentioned, without naming him, lets you deny later that you meant him, if you need to.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 64<\/span><\/div><div class=\"ar\">(٣) والتنبيهُ على تعيين المحذوف ولو ادّعاءً، نحو: ﴿خَالِقُ كُلِّ شَيْءٍ﴾ [الأنعام: ١٠٢]، و«وهّاب الألوف».<\/div><div class=\"tr\">(3) Drawing attention to the fact that the omitted word is specified, even if only by claim, as in: ﴿Creator of all things﴾ [al-Anʿām 6:102], and “Giver of thousands.”<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Drawing attention to the fact that it is obvious who is meant.<\/b> ‎<span class=\"arin\">خَالِقُ كُلِّ شَيْءٍ<\/span>‎ leaves out \"He is\" because no one but Allah could be the Creator of all things; it truly can only be Him.<p>\"Giver of thousands\", said of a king, leaves him out by <b>claim<\/b> (<i>iddiʿāʾ<\/i>): the speaker treats the description as so clearly his that no name is needed, though in reality others could give thousands too.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 64<\/span><\/div><div class=\"ar\">(٤) واختبارُ تنبّه السامع، أو مقدارِ تنبّهه، نحو: «نوره مستفاد من نور الشمس»، و«واسطة عقد الكواكب».<\/div><div class=\"tr\">(4) Testing whether the listener is alert, or how alert he is, as in: “Its light is drawn from the light of the sun,” and “The middle pearl in the necklace of the stars.”<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Testing the listener.<\/b> \"Its light is drawn from the light of the sun\" and \"the middle pearl in the necklace of the stars\" both leave out the subject, the moon. The speaker wants to see whether the listener is alert enough to realise who is meant, or how quickly he does.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 64–65<\/span><\/div><div class=\"ar\">(٥) وضيقُ المقام إمّا لتوجّع، نحو:<span class=\"bayt\"><span class=\"h1\">قَالَ لِيْ كَيْفَ أَنْتَ قُلْتُ عَلِيلٌ<\/span><span class=\"h2\">سَهْرٌ دَائِمٌ وَحُزْنٌ طَوِيْلٌ<\/span><\/span>وإمّا لخوف فوات فرصة، نحو قول الصياد: «غزال».<\/div><div class=\"tr\">(5) The situation being too narrow [for long speech]: either because of pain, as in:<br>He said to me: “How are you?” I said: “Ill — / sleeplessness without end, and long grief.”<br>or for fear of missing an opportunity, as in the hunter’s saying: “A gazelle!”<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>The situation is too narrow for long speech<\/b>, for one of two reasons:<b>Pain<\/b>: the sick poet, asked how he is, answers just ‎<span class=\"arin\">عَلِيلٌ<\/span>‎, \"ill\", instead of \"I am ill\". He is too weary for full sentences.<b>Fear of losing the chance<\/b>: the hunter who sees a gazelle cries ‎<span class=\"arin\">غزال<\/span>‎! instead of \"This is a gazelle\". By the time he finished a full sentence, it would be gone.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 65<\/span><\/div><div class=\"ar\">(٦) والتعظيمُ والتحقيرُ لصونه عن لسانك، أو صون لسانك عنه، فالأوّل، نحو: «نجوم سماء».<br>والثاني، نحو: «قوم إذا أكلوا أخفوا حديثهم».<\/div><div class=\"tr\">(6) Exalting and belittling: [by omitting it] to keep it away from your tongue, or to keep your tongue away from it. The first is like: “Stars of the sky.” The second is like: “People who, when they eat, hide their talk.”<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Exalting or belittling<\/b>, by leaving the person unnamed:<p>In ‎<span class=\"arin\">نجوم سماء<\/span>‎ (\"[They are] stars of the sky\"), the people praised are not named, as if they were too exalted to be spoken of on the speaker's tongue.<\/p><p>In ‎<span class=\"arin\">قوم إذا أكلوا أخفوا حديثهم<\/span>‎ (\"[They are] people who, when they eat, hide their talk\", i.e. so no guest hears and comes), the people are not named because the speaker holds them in contempt and keeps his tongue from them.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 65<\/span><\/div><div class=\"ar\">(٧) والمحافظةُ على وزن أو سجع؛ فالأوّل، نحو:<span class=\"bayt\"><span class=\"h1\">نَحْنُ بِمَا عِنْدَنَا وَأَنْتَ بِمَا عِـ<\/span><span class=\"h2\">ـنْدَكَ رَاضٍ وَالرأْيُ مُخْتَلِفٌ<\/span><\/span>والثاني، نحو: ﴿مَا وَدَّعَكَ رَبُّكَ وَمَا قَلَى﴾ [الضحى: ٣].<\/div><div class=\"tr\">(7) Preserving a metre or a rhyme (sajʿ). The first is like:<br>We with what we have, and you with what you have, / are content — and opinion differs.<br>The second is like: ﴿Your Lord has not forsaken you, nor has He become displeased﴾ [al-Ḍuḥā 93:3].<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Keeping the metre or the rhyme.<\/b> In the line of poetry, the full meaning is \"we are content with what we have\", but ‎<span class=\"arin\">راضون<\/span>‎ is left out because the metre has no room for it; ‎<span class=\"arin\">رَاضٍ<\/span>‎ in the second half tells you what is missing.<p>In ‎<span class=\"arin\">مَا وَدَّعَكَ رَبُّكَ وَمَا قَلَى<\/span>‎, the meaning is \"nor is He displeased <i>with you<\/i>\"; the pronoun is omitted to keep the rhyme of the sūrah, whose verses end in <i>-ā<\/i>.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 65–66<\/span><\/div><div class=\"ar\">(٨) والتعميمُ باختصار، نحو: ﴿وَاللهُ يَدْعُو إِلَى دَارِ السَّلَامِ﴾ [يونس: ٢٥]، أي: جميعَ عباده؛ لأنّ حذف المعمول يؤذن بالعموم.<\/div><div class=\"tr\">(8) Generalising with brevity, as in: ﴿And Allah invites to the Home of Peace﴾ [Yūnus 10:25], that is, [He invites] all His servants; because omitting the governed word signals generality.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Making it general, briefly.<\/b> In ‎<span class=\"arin\">وَاللهُ يَدْعُو إِلَى دَارِ السَّلَامِ<\/span>‎ the verse does not say whom Allah invites. Because no particular object is named, it covers <b>everyone<\/b>: all His servants. Naming them all would take many words; omission gives generality in very few.<p>The book states the principle: <b>omitting the object signals generality<\/b>.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 66<\/span><\/div><div class=\"ar\">(٩) والأدبُ، نحو قول الشاعر:<span class=\"bayt\"><span class=\"h1\">قَدْ طَلَبْنَا فَلَمْ نَجِدْ لَكَ في السُّو<\/span><span class=\"h2\">دَدِ وَالْمَجْدِ وَالْمَكَارِمِ مِثْلاً<\/span><\/span><\/div><div class=\"tr\">(9) Courtesy, as in the poet’s saying:<br>We have sought, but we did not find for you, in lordship, / glory and noble traits, any equal.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Courtesy<\/b> (<i>adab<\/i>). The poet says \"we sought, but did not find an equal to you\", leaving out what was sought. To say openly \"we sought <i>an equal to you<\/i>\" would suggest someone could be his equal, which is not polite to the one praised.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 66<\/span><\/div><div class=\"ar\">(١٠) وتنزيل المتعدّي منزلة اللازم؛ لعدم تعلّق الغرض بالمعمول، نحو: ﴿هَلْ يَسْتَوِي الَّذِينَ يَعْلَمُونَ وَالَّذِينَ لاَ يَعْلَمُونَ﴾ [الزمر: ٩].<\/div><div class=\"tr\">(10) Treating a transitive verb as if it were intransitive, because the purpose is not connected with the governed word, as in: ﴿Are those who know equal to those who do not know?﴾ [al-Zumar 39:9].<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Treating a transitive verb as intransitive.<\/b> Sometimes the speaker does not care <i>what<\/i> the action falls on, only that the action is there. In ‎<span class=\"arin\">هَلْ يَسْتَوِي الَّذِينَ يَعْلَمُونَ وَالَّذِينَ لاَ يَعْلَمُونَ<\/span>‎, the point is not \"those who know <i>this or that<\/i>\" but those who have knowledge and those who do not. So the verb is used like an intransitive verb, with no object meant at all.<p>Compare this with motive (8): there an object <b>is<\/b> intended (everyone), but it is left unsaid; here <b>no<\/b> object is intended.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 66–67<\/span><\/div><div class=\"ar\">ويعدّ من الحذف إسنادُ الفعل إلى نائب الفاعل، فيقال: «حذف الفاعل للخوف منه، أو عليه، أو للعلم به، أو الجهل»، نحو: «سرق المتاع»، و﴿خُلِقَ الإِنسَانُ ضَعِيفاً﴾ [النساء: ٢٨].<\/div><div class=\"tr\">Attributing the verb to the deputy of the doer (nāʾib al-fāʿil) is also counted as omission. So it is said: “The doer was omitted out of fear of him, or fear for him, or because he is known, or because he is unknown,” as in: “The goods were stolen,” and ﴿Man was created weak﴾ [al-Nisāʾ 4:28].<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>The passive voice is also counted as a kind of omission, because the doer is left out. The book gives four reasons why the doer may be left unnamed:<\/p><b>Fear of him<\/b>: you dare not name the thief. <b>Fear for him<\/b>: you do not want to expose him. <b>He is known<\/b>: there is no need to name him, as in ‎<span class=\"arin\">خُلِقَ الإِنسَانُ ضَعِيفاً<\/span>‎, where everyone knows the Creator. <b>He is unknown<\/b>: you cannot name him, as in ‎<span class=\"arin\">سرق المتاع<\/span>‎ when you do not know who stole it.<\/div><div class=\"chartbox\"><div class=\"chh\">MOTIVES FOR OMISSION · DRAWN BY THE COMPANION<\/div><table class=\"grid\"><thead><tr><th>Motive<\/th><th>Book's example<\/th><\/tr><\/thead><tbody><tr><td>Hiding from others ‎<span class=\"arin\">إخفاءُ الأمر<\/span>‎<\/td><td>‎<span class=\"arin\">أقبل<\/span>‎<\/td><\/tr><tr><td>Keeping the chance to deny ‎<span class=\"arin\">تأتِّي الإنكار<\/span>‎<\/td><td>‎<span class=\"arin\">لئيم خسيس<\/span>‎<\/td><\/tr><tr><td>The omitted one is obvious ‎<span class=\"arin\">التنبيهُ على تعيين المحذوف<\/span>‎<\/td><td>‎<span class=\"arin\">خَالِقُ كُلِّ شَيْءٍ<\/span>‎<\/td><\/tr><tr><td>Testing the listener ‎<span class=\"arin\">اختبارُ تنبّه السامع<\/span>‎<\/td><td>‎<span class=\"arin\">واسطة عقد الكواكب<\/span>‎<\/td><\/tr><tr><td>No room: pain or haste ‎<span class=\"arin\">ضيق المقام<\/span>‎<\/td><td>‎<span class=\"arin\">عَلِيلٌ<\/span>‎، ‎<span class=\"arin\">غزال<\/span>‎<\/td><\/tr><tr><td>Exalting or belittling ‎<span class=\"arin\">التعظيمُ والتحقيرُ<\/span>‎<\/td><td>‎<span class=\"arin\">نجوم سماء<\/span>‎<\/td><\/tr><tr><td>Keeping metre or rhyme ‎<span class=\"arin\">المحافظةُ على وزن أو سجع<\/span>‎<\/td><td>‎<span class=\"arin\">وَمَا قَلَى<\/span>‎<\/td><\/tr><tr><td>Generality with brevity ‎<span class=\"arin\">التعميمُ باختصار<\/span>‎<\/td><td>‎<span class=\"arin\">يَدْعُو إِلَى دَارِ السَّلَامِ<\/span>‎<\/td><\/tr><tr><td>Courtesy ‎<span class=\"arin\">الأدب<\/span>‎<\/td><td>‎<span class=\"arin\">قَدْ طَلَبْنَا فَلَمْ نَجِدْ<\/span>‎<\/td><\/tr><tr><td>Transitive as intransitive ‎<span class=\"arin\">تنزيل المتعدّي منزلة اللازم<\/span>‎<\/td><td>‎<span class=\"arin\">الَّذِينَ يَعْلَمُونَ<\/span>‎<\/td><\/tr><tr><td>Passive: fear, known, unknown<\/td><td>‎<span class=\"arin\">سرق المتاع<\/span>‎<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box\"><div class=\"bh\">KEY TERMS AND THEIR MEANINGS · ADDED BY THE COMPANION<\/div><table class=\"terms\"><tr><td class=\"t\">Dhikr<\/td><td>Mention: stating a word in the speech<\/td><td class=\"a\">الذكر<\/td><\/tr><tr><td class=\"t\">Ḥadhf<\/td><td>Omission: leaving out a word that is known from the rest of the speech<\/td><td class=\"a\">الحذف<\/td><\/tr><tr><td class=\"t\">Dāʿī (pl. dawāʿī)<\/td><td>Motive: the reason for leaving a basic rule<\/td><td class=\"a\">دواعي<\/td><\/tr><tr><td class=\"t\">Qarīna<\/td><td>Contextual indicator pointing to the omitted word<\/td><td class=\"a\">القرينة<\/td><\/tr><tr><td class=\"t\">Taqrīr<\/td><td>Establishing the meaning firmly in the listener’s mind<\/td><td class=\"a\">التقرير<\/td><\/tr><tr><td class=\"t\">Īḍāḥ<\/td><td>Clarification; uncovering the meaning<\/td><td class=\"a\">الإيضاح<\/td><\/tr><tr><td class=\"t\">Taʿrīḍ<\/td><td>Hinting (here, at the listener’s dullness)<\/td><td class=\"a\">التعريض<\/td><\/tr><tr><td class=\"t\">Tasjīl<\/td><td>Putting on record against the listener so he cannot deny<\/td><td class=\"a\">التسجيل<\/td><\/tr><tr><td class=\"t\">Taʿmīm bi-ikhtiṣār<\/td><td>Generalising with brevity by omitting the object<\/td><td class=\"a\">التعميم باختصار<\/td><\/tr><tr><td class=\"t\">Tanzīl al-mutaʿaddī manzilat al-lāzim<\/td><td>Treating a transitive verb as intransitive<\/td><td class=\"a\">تنزيل المتعدّي منزلة اللازم<\/td><\/tr><tr><td class=\"t\">Nāʾib al-fāʿil<\/td><td>Deputy of the doer (subject of a passive verb)<\/td><td class=\"a\">نائب الفاعل<\/td><\/tr><\/table><\/div><h3>QUESTIONS AND ANSWERS<span class=\"ar\">أسئلة وأجوبة<\/span><\/h3><div class=\"qabox\"><div class=\"qh\">QUESTIONS AND ANSWERS · ADDED BY THE COMPANION<\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>State the two basic rules about mention and omission. When do they clash?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>A word that carries part of the meaning should be mentioned; a word known from the rest of the speech should be omitted. They clash when a word both carries meaning and is known from the rest; then one may leave either rule only for a motive.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>Why does the book say \"<i>increasing<\/i> establishment and clarity\" rather than just \"establishment and clarity\"?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>Because the meaning would already be established and clear with omission; mention adds more of it.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>A judge asks, \"Did this Zayd admit the debt?\" Why does the witness repeat \"this Zayd\" in his answer?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>To put it on record against Zayd, so he cannot later claim the witness meant someone else.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>Give two motives for mention that concern the listener.<\/div><div class=\"a\"><span class=\"k\">A.<\/span>Little trust in the clue because of the listener's weak understanding, and hinting at the listener's dullness.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>What is omitted in ‎<span class=\"arin\">نجوم سماء<\/span>‎ and in ‎<span class=\"arin\">قوم إذا أكلوا أخفوا حديثهم<\/span>‎, and why?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>In both, the subject (\"they are\") is omitted: in the first to exalt the people praised, in the second to belittle the people blamed.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>How is the omission in ‎<span class=\"arin\">خَالِقُ كُلِّ شَيْءٍ<\/span>‎ different from that in \"Giver of thousands\"?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>In the first, the omitted one (Allah) is truly the only one the description fits; in the second, the king is treated as the only one by claim.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>Why does the sick poet say only ‎<span class=\"arin\">عَلِيلٌ<\/span>‎?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>The situation is too narrow for long speech because of pain.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>What is omitted in ‎<span class=\"arin\">مَا وَدَّعَكَ رَبُّكَ وَمَا قَلَى<\/span>‎, and why?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>The object pronoun (\"with you\"); it is left out to keep the rhyme of the verses.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>How does omitting the object in ‎<span class=\"arin\">وَاللهُ يَدْعُو إِلَى دَارِ السَّلَامِ<\/span>‎ give generality?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>Since no particular object is named, the invitation covers all His servants; and omission does this in fewer words than listing them.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>What is the difference between omitting the object for generality and treating a transitive verb as intransitive?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>In the first an object is intended (everyone) but not said; in the second no object is intended at all: only the action itself matters.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>Give the four reasons for leaving out the doer of a passive verb.<\/div><div class=\"a\"><span class=\"k\">A.<\/span>Fear of him, fear for him, his being known, and his being unknown.<\/div><\/div><\/div>", "terms": [{"t": "Dhikr", "m": "Mention: stating a word in the speech", "a": "الذكر"}, {"t": "Ḥadhf", "m": "Omission: leaving out a word that is known from the rest of the speech", "a": "الحذف"}, {"t": "Dāʿī (pl. dawāʿī)", "m": "Motive: the reason for leaving a basic rule", "a": "دواعي"}, {"t": "Qarīna", "m": "Contextual indicator pointing to the omitted word", "a": "القرينة"}, {"t": "Taqrīr", "m": "Establishing the meaning firmly in the listener’s mind", "a": "التقرير"}, {"t": "Īḍāḥ", "m": "Clarification; uncovering the meaning", "a": "الإيضاح"}, {"t": "Taʿrīḍ", "m": "Hinting (here, at the listener’s dullness)", "a": "التعريض"}, {"t": "Tasjīl", "m": "Putting on record against the listener so he cannot deny", "a": "التسجيل"}, {"t": "Taʿmīm bi-ikhtiṣār", "m": "Generalising with brevity by omitting the object", "a": "التعميم باختصار"}, {"t": "Tanzīl al-mutaʿaddī manzilat al-lāzim", "m": "Treating a transitive verb as intransitive", "a": "تنزيل المتعدّي منزلة اللازم"}, {"t": "Nāʾib al-fāʿil", "m": "Deputy of the doer (subject of a passive verb)", "a": "نائب الفاعل"}], "part": null}, {"num": 5, "title": "Putting Before and After", "ar": "الباب الثالث في التقديم والتأخير", "body": "<h3>CHAPTER THREE: ON PUTTING BEFORE AND AFTER<span class=\"ar\">الباب الثالث في التقديم والتأخير<\/span><\/h3><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 68<\/span><\/div><div class=\"ar\">من المعلوم أنّه لا يمكن النطق بأجزاء الكلام دفعة واحدة، بل لا بدّ من تقديم بعض الأجزاء، وتأخير البعض، وليس شيء منها في نفسه أولى بالتقدّم من الآخر؛ لاشتراك جميع الألفاظ من حيث هي ألفاظ في درجة الاعتبار، فلا بدّ من تقديم هذا على ذاك من داع يوجبه، فمن الدواعي:<\/div><div class=\"tr\">It is well known that the parts of speech cannot be uttered all at once; rather, some parts must be put first and others put after. None of them is, in itself, more entitled to come first than another, because all words, insofar as they are words, share the same rank of consideration. So putting this one before that one must come from a motive that requires it. Among the motives are:<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>When you speak, words must come one after another; you cannot say them all at once. So in every sentence, something comes <b>first<\/b> and something comes <b>after<\/b>.<\/p><p>The book's point is that no word, simply as a word, has a natural right to come first. So whenever a speaker puts one part before another, there should be a <b>reason<\/b> (<i>dāʿī<\/i>). This chapter lists nine such reasons.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 68<\/span><\/div><div class=\"ar\">(١) التشويق إلى المتأخّر، إذا كان المتقدّم مشعراً بغرابة، نحو:<span class=\"bayt\"><span class=\"h1\">وَالَّذِي حَارَتِ الْبَرِيَّةُ فِيْهِ<\/span><span class=\"h2\">حَيَوَانٌ مُسْتَحْدَثٌ مِن جَمَادِ<\/span><\/span><\/div><div class=\"tr\">(1) Creating eagerness for what comes later, when what comes first suggests something strange, as in:<br>That over which mankind is bewildered / is a living being brought into being from lifeless matter.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Creating eagerness for what comes later.<\/b> If the first part of a sentence describes something strange, the listener becomes eager to hear the rest. The poet begins with \"That over which mankind is bewildered…\", and the listener waits to find out what it is. Only then comes the answer: a living being made from lifeless matter (the poet means the resurrection of the body, or man himself created from clay). Because the listener was waiting for it, the answer sticks in his mind.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 69<\/span><\/div><div class=\"ar\">(٢) وتعجيلُ المسرّة أوالمساءة، نحو: «العفو عنك صدر به الأمر»، أو «القصاص حكم به القاضي».<\/div><div class=\"tr\">(2) Bringing joy or distress quickly, as in: “Pardon for you — the order has been issued for it,” or “Retaliation — the judge has ruled it.”<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Bringing good or bad news quickly.<\/b> Putting the important word first lets the listener feel the news at once. ‎<span class=\"arin\">العفو عنك<\/span>‎ (pardon for you) puts the good news first, so the joy comes immediately; ‎<span class=\"arin\">القصاص<\/span>‎ (retaliation) puts the bad news first, so the distress comes immediately.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 69<\/span><\/div><div class=\"ar\">(٣) وكون المتقدّم محطّ الإنكار والتعجّب، نحو: «أ بعد طول التجربة تنخدع بهذه الزخارف؟».<\/div><div class=\"tr\">(3) The word put first being the point on which disapproval and wonder fall, as in: “After long experience, are you deceived by these adornments?”<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>The word put first is the very thing being questioned.<\/b> In \"After long experience, are you deceived by these adornments?\", the speaker is not surprised at being deceived in general; what he finds strange is being deceived <b>after long experience<\/b>. So that phrase comes straight after the hamzah, where the disapproval and wonder fall.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 69–70<\/span><\/div><div class=\"ar\">(٤) وسلوكُ سبيل الترقّي، أي: الإتيان بالعامّ أوّلاً ثم الخاصّ بعده؛ لأنّ العامّ إذا ذكر بعد الخاصّ لا يكون له فائدة، نحو: «هذا الكلام صحيح فصيح بليغ»؛ فإذا قلت: «فصيح بليغ»، لا تحتاج إلى ذكر صحيح، وإذا قلت: «بليغ»، لا تحتاج إلى ذكر صحيح، ولا فصيح.<\/div><div class=\"tr\">(4) Following the path of ascent, that is, bringing the general first and then the particular after it; because if the general is mentioned after the particular it has no benefit. For example: “This speech is correct, eloquent, rhetorically effective (balīgh).” If you say “eloquent, rhetorically effective,” you do not need to mention “correct”; and if you say “rhetorically effective,” you need not mention “correct” or “eloquent.”<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Rising step by step<\/b> (<i>taraqqī<\/i>): from the general to the more particular. Every <i>balīgh<\/i> sentence is <i>faṣīḥ<\/i>, and every <i>faṣīḥ<\/i> sentence is correct. So the order ‎<span class=\"arin\">صحيح فصيح بليغ<\/span>‎ climbs: each word adds something.<p>If you reversed it and said \"<i>balīgh<\/i>\" first, then \"<i>faṣīḥ<\/i>\" and \"correct\" would add nothing, since they are already included. That is why the general comes first.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 70<\/span><\/div><div class=\"ar\">(٥) ومراعات الترتيب الوجوديّ، نحو: ﴿لاَ تَأخُذُهُ سِنَةٌ وَلاَ نَوْمٌ﴾ [البقرة: ٢٥٥].<\/div><div class=\"tr\">(5) Observing the order of existence, as in: ﴿Neither drowsiness overtakes Him nor sleep﴾ [al-Baqarah 2:255].<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Following the order in which things happen.<\/b> Drowsiness (‎<span class=\"arin\">سِنَةٌ<\/span>‎) comes before sleep in reality: first a person grows drowsy, then he sleeps. So the verse mentions them in that order: neither drowsiness nor sleep overtakes Him.<\/div><div class=\"cnote\"><span class=\"cnh\">COMPANION&#8217;S NOTE · NOT IN THE BOOK<\/span><p>Printing note: the matn prints ‎<span class=\"arin\">ومراعات<\/span>‎ with an open ‎<span class=\"arin\">ت<\/span>‎; it is reproduced as printed. The likely reading is ‎<span class=\"arin\">ومراعاة<\/span>‎.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 70–71<\/span><\/div><div class=\"ar\">(٦) والنصّ على عموم السلب أو سلب العموم؛ فالأوّل يكون بتقديم أداة العموم على أداة النفْي، نحو: «كلّ ذلك لم يكن»، أي: لَم يقع هذا، ولا ذاك، والثاني يكون بتقديم أداة النفْي على أداة العموم، نحو: «لَم يكن كلّ ذلك»، أي: لَم يقع المجموع، فيحتمل ثبوت البعض، ويحتمل نفْي كلّ فرد.<\/div><div class=\"tr\">(6) Stating explicitly either the generality of the negation or the negation of generality. The first comes by putting the word of generality before the word of negation, as in: “All of that did not happen,” that is, neither this happened nor that. The second comes by putting the word of negation before the word of generality, as in: “Not all of that happened,” that is, the whole did not happen; so it allows that some of it took place, and it also allows that every single item is negated.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Making clear whether the negation is total or partial.<\/b> This is a subtle and important point. The position of ‎<span class=\"arin\">كلّ<\/span>‎ in relation to the negation changes the meaning completely.<p>If ‎<span class=\"arin\">كلّ<\/span>‎ comes <b>before<\/b> the negation, ‎<span class=\"arin\">كلّ ذلك لم يكن<\/span>‎, the negation covers <b>every<\/b> item: none of it happened. This is called <b>generality of negation<\/b> (<i>ʿumūm al-salb<\/i>).<\/p><p>If the negation comes <b>before<\/b> ‎<span class=\"arin\">كلّ<\/span>‎, ‎<span class=\"arin\">لَم يكن كلّ ذلك<\/span>‎, what is denied is <b>the whole<\/b>: not all of it happened. Perhaps some of it happened, perhaps none. This is called <b>negation of generality<\/b> (<i>salb al-ʿumūm<\/i>).<\/p><\/div><div class=\"chartbox\"><div class=\"chh\">ʿUMŪM AL-SALB AND SALB AL-ʿUMŪM · DRAWN BY THE COMPANION<\/div><table class=\"grid\"><thead><tr><th><\/th><th>ʿUmūm al-salb ‎<span class=\"arin\">عموم السلب<\/span>‎<\/th><th>Salb al-ʿumūm ‎<span class=\"arin\">سلب العموم<\/span>‎<\/th><\/tr><\/thead><tbody><tr><td>Word order<\/td><td>‎<span class=\"arin\">كلّ<\/span>‎ before the negation<\/td><td>the negation before ‎<span class=\"arin\">كلّ<\/span>‎<\/td><\/tr><tr><td>Book's example<\/td><td>‎<span class=\"arin\">كلّ ذلك لم يكن<\/span>‎<\/td><td>‎<span class=\"arin\">لَم يكن كلّ ذلك<\/span>‎<\/td><\/tr><tr><td>Meaning<\/td><td>Nothing at all happened<\/td><td>Not everything happened; some may have<\/td><\/tr><\/tbody><\/table><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 71<\/span><\/div><div class=\"ar\">(٧) وتقويةُ الحكم إذا كان الخبر فعلاً، نحو: «الهلال ظهر»؛ وذلك لتكرار الإسناد.<\/div><div class=\"tr\">(7) Strengthening the ruling, when the predicate is a verb, as in: “The new moon — it has appeared”; this is because the attribution is repeated.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Strengthening the statement.<\/b> Compare ‎<span class=\"arin\">ظهر الهلال<\/span>‎ with ‎<span class=\"arin\">الهلال ظهر<\/span>‎. In the second, the new moon is mentioned first, and then the verb ‎<span class=\"arin\">ظهر<\/span>‎ contains a pronoun that refers back to it. So <i>appearing<\/i> is attributed to the new moon <b>twice<\/b>: once to the noun and once to the pronoun. This repeated attribution makes the statement stronger.<p>The book says this happens when the predicate is a <b>verb<\/b>, because only then is there a pronoun to repeat the attribution.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 72<\/span><\/div><div class=\"ar\">(٨) والتخصيصُ، نحو: «ما أنا قلت»، و﴿إِيَّاكَ نَعْبُدُ﴾ [الفاتحة: ٥].<\/div><div class=\"tr\">(8) Specification (takhṣīṣ), as in: “It was not I who said it,” and ﴿You alone we worship﴾ [al-Fātiḥah 1:5].<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Specification<\/b> (<i>takhṣīṣ<\/i>): putting a word first to show that the ruling belongs to it <b>alone<\/b>.<p>‎<span class=\"arin\">ما أنا قلت<\/span>‎ means \"It was not <i>I<\/i> who said it\": someone said it, but not me. Compare ‎<span class=\"arin\">ما قلت<\/span>‎, which simply means \"I did not say it.\"<\/p><p>‎<span class=\"arin\">إِيَّاكَ نَعْبُدُ<\/span>‎: the object is put before the verb, so the meaning is \"<i>You alone<\/i> we worship\", and no one else. This is the subject of Chapter VIII, on restriction.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 72<\/span><\/div><div class=\"ar\">(٩) والمحافَظةُ على وزن أو سجع، فالأوّل، نحو:<span class=\"bayt\"><span class=\"h1\">إذا نَطَقَ السَّفِيْهُ فَلاَ تُجِبْهُ<\/span><span class=\"h2\">فَخَيْرٌ مِن إجَابَتِهِ السُّكُوْتُ<\/span><\/span>والثاني، نحو: ﴿خُذُوهُ فَغُلُّوهُ ثُمَّ الْجَحِيمَ صَلُّوهُ ثُمَّ فِي سِلْسِلَةٍ ذَرْعُهَا سَبْعُونَ ذِرَاعاً فَاسْلُكُوهُ﴾ [الحاقة: ٣٠-٣٢]،<\/div><div class=\"tr\">(9) Preserving a metre or a rhyme. The first is like:<br>When the fool speaks, do not answer him; / better than answering him is silence.<br>The second is like: ﴿Seize him and shackle him; then into Hellfire drive him; then into a chain whose length is seventy cubits insert him﴾ [al-Ḥāqqah 69:30–32].<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Keeping the metre or the rhyme.<\/b> In the line of poetry, the natural order would be ‎<span class=\"arin\">السكوت خير من إجابته<\/span>‎, but the predicate ‎<span class=\"arin\">فَخَيْرٌ<\/span>‎ is put first so the line fits its metre and ends on the rhyme ‎<span class=\"arin\">السُّكُوْتُ<\/span>‎.<p>In the verses from al-Ḥāqqah, ‎<span class=\"arin\">الْجَحِيمَ<\/span>‎ and ‎<span class=\"arin\">فِي سِلْسِلَةٍ<\/span>‎ are put before their verbs, so that each verse ends with the same sound as the others: ‎<span class=\"arin\">فَغُلُّوهُ<\/span>‎، ‎<span class=\"arin\">صَلُّوهُ<\/span>‎، ‎<span class=\"arin\">فَاسْلُكُوهُ<\/span>‎.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 72–73<\/span><\/div><div class=\"ar\">ولَم يذكر لكلّ من التقديم والتأخير دواع خاصّة؛ لأنّه إذا تقدّم أحد ركني الجملة تأخّر الآخر، فهما متلازمان.<\/div><div class=\"tr\">He did not mention separate motives for putting before and for putting after, because when one of the two pillars of the sentence comes first, the other comes after; so the two always go together.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>Why does the book not give separate reasons for putting something <b>after<\/b>? Because the two always go together: when one pillar of the sentence comes first, the other necessarily comes after. A reason for putting one first is at the same time the reason for putting the other later.<\/p><\/div><div class=\"chartbox\"><div class=\"chh\">REASONS FOR PUTTING FIRST · DRAWN BY THE COMPANION<\/div><table class=\"grid\"><thead><tr><th>Reason<\/th><th>Book's example<\/th><\/tr><\/thead><tbody><tr><td>Creating eagerness ‎<span class=\"arin\">التشويق<\/span>‎<\/td><td>‎<span class=\"arin\">وَالَّذِي حَارَتِ الْبَرِيَّةُ فِيْهِ<\/span>‎<\/td><\/tr><tr><td>Quick joy or distress ‎<span class=\"arin\">تعجيل المسرّة أو المساءة<\/span>‎<\/td><td>‎<span class=\"arin\">العفو عنك صدر به الأمر<\/span>‎<\/td><\/tr><tr><td>The point of disapproval and wonder<\/td><td>‎<span class=\"arin\">أ بعد طول التجربة تنخدع<\/span>‎<\/td><\/tr><tr><td>Rising step by step ‎<span class=\"arin\">الترقّي<\/span>‎<\/td><td>‎<span class=\"arin\">صحيح فصيح بليغ<\/span>‎<\/td><\/tr><tr><td>Order of existence ‎<span class=\"arin\">الترتيب الوجوديّ<\/span>‎<\/td><td>‎<span class=\"arin\">سِنَةٌ وَلاَ نَوْمٌ<\/span>‎<\/td><\/tr><tr><td>Total or partial negation<\/td><td>‎<span class=\"arin\">كلّ ذلك لم يكن<\/span>‎ / ‎<span class=\"arin\">لَم يكن كلّ ذلك<\/span>‎<\/td><\/tr><tr><td>Strengthening the ruling ‎<span class=\"arin\">تقويةُ الحكم<\/span>‎<\/td><td>‎<span class=\"arin\">الهلال ظهر<\/span>‎<\/td><\/tr><tr><td>Specification ‎<span class=\"arin\">التخصيص<\/span>‎<\/td><td>‎<span class=\"arin\">إِيَّاكَ نَعْبُدُ<\/span>‎<\/td><\/tr><tr><td>Metre or rhyme<\/td><td>‎<span class=\"arin\">ثُمَّ الْجَحِيمَ صَلُّوهُ<\/span>‎<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box\"><div class=\"bh\">KEY TERMS AND THEIR MEANINGS · ADDED BY THE COMPANION<\/div><table class=\"terms\"><tr><td class=\"t\">Taqdīm wa-taʾkhīr<\/td><td>Putting a part of the sentence before or after another<\/td><td class=\"a\">التقديم والتأخير<\/td><\/tr><tr><td class=\"t\">Tashwīq<\/td><td>Creating eagerness for what comes later<\/td><td class=\"a\">التشويق<\/td><\/tr><tr><td class=\"t\">Maḥaṭṭ al-inkār<\/td><td>The point on which disapproval falls<\/td><td class=\"a\">محطّ الإنكار<\/td><\/tr><tr><td class=\"t\">Sabīl al-taraqqī<\/td><td>The path of ascent: general first, then particular<\/td><td class=\"a\">سبيل الترقّي<\/td><\/tr><tr><td class=\"t\">Al-tartīb al-wujūdī<\/td><td>The order in which things exist<\/td><td class=\"a\">الترتيب الوجوديّ<\/td><\/tr><tr><td class=\"t\">ʿUmūm al-salb<\/td><td>Generality of the negation: no individual has the ruling<\/td><td class=\"a\">عموم السلب<\/td><\/tr><tr><td class=\"t\">Salb al-ʿumūm<\/td><td>Negation of generality: not all individuals have the ruling<\/td><td class=\"a\">سلب العموم<\/td><\/tr><tr><td class=\"t\">Taqwiyat al-ḥukm<\/td><td>Strengthening the ruling<\/td><td class=\"a\">تقوية الحكم<\/td><\/tr><tr><td class=\"t\">Takhṣīṣ<\/td><td>Specification; restricting the verb to what it is connected with<\/td><td class=\"a\">التخصيص<\/td><\/tr><tr><td class=\"t\">Sajʿ<\/td><td>Rhyme in prose<\/td><td class=\"a\">السجع<\/td><\/tr><\/table><\/div><h3>QUESTIONS AND ANSWERS<span class=\"ar\">أسئلة وأجوبة<\/span><\/h3><div class=\"qabox\"><div class=\"qh\">QUESTIONS AND ANSWERS · ADDED BY THE COMPANION<\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>Why must every case of putting something first have a reason?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>Because words cannot all be said at once, and no word in itself has more right to come first; so putting one first needs a motive.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>How does the line ‎<span class=\"arin\">وَالَّذِي حَارَتِ الْبَرِيَّةُ فِيْهِ<\/span>‎ create eagerness?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>It begins by describing something strange that has bewildered mankind, so the listener is eager to hear what it is.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>What is gained by saying ‎<span class=\"arin\">العفو عنك صدر به الأمر<\/span>‎ rather than starting with the verb?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>The good news (pardon) comes first, so the listener's joy comes immediately.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>Explain the order ‎<span class=\"arin\">صحيح فصيح بليغ<\/span>‎.<\/div><div class=\"a\"><span class=\"k\">A.<\/span>It rises from the general to the particular; if the particular (<i>balīgh<\/i>) came first, the more general words after it would add nothing.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>Why is ‎<span class=\"arin\">سِنَةٌ<\/span>‎ mentioned before ‎<span class=\"arin\">نَوْمٌ<\/span>‎?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>Because drowsiness comes before sleep in reality: the order of existence.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>What is the difference between ‎<span class=\"arin\">كلّ ذلك لم يكن<\/span>‎ and ‎<span class=\"arin\">لَم يكن كلّ ذلك<\/span>‎?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>The first is <i>ʿumūm al-salb<\/i>: none of it happened. The second is <i>salb al-ʿumūm<\/i>: not all of it happened, so some may have.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>How does ‎<span class=\"arin\">الهلال ظهر<\/span>‎ strengthen the ruling?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>The attribution of appearing is repeated: to the noun, and to the pronoun in the verb that refers to it.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>What does putting ‎<span class=\"arin\">إِيَّاكَ<\/span>‎ first convey?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>Specification: worship is for Allah alone.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>Why does the book give no separate motives for putting something later?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>Because when one pillar comes first the other necessarily comes after; the two go together.<\/div><\/div><\/div>", "terms": [{"t": "Taqdīm wa-taʾkhīr", "m": "Putting a part of the sentence before or after another", "a": "التقديم والتأخير"}, {"t": "Tashwīq", "m": "Creating eagerness for what comes later", "a": "التشويق"}, {"t": "Maḥaṭṭ al-inkār", "m": "The point on which disapproval falls", "a": "محطّ الإنكار"}, {"t": "Sabīl al-taraqqī", "m": "The path of ascent: general first, then particular", "a": "سبيل الترقّي"}, {"t": "Al-tartīb al-wujūdī", "m": "The order in which things exist", "a": "الترتيب الوجوديّ"}, {"t": "ʿUmūm al-salb", "m": "Generality of the negation: no individual has the ruling", "a": "عموم السلب"}, {"t": "Salb al-ʿumūm", "m": "Negation of generality: not all individuals have the ruling", "a": "سلب العموم"}, {"t": "Taqwiyat al-ḥukm", "m": "Strengthening the ruling", "a": "تقوية الحكم"}, {"t": "Takhṣīṣ", "m": "Specification; restricting the verb to what it is connected with", "a": "التخصيص"}, {"t": "Sajʿ", "m": "Rhyme in prose", "a": "السجع"}], "part": null}, {"num": 6, "title": "Definiteness and Indefiniteness", "ar": "الباب الرابع في التعريف والتنكير", "body": "<h3>CHAPTER FOUR: ON DEFINITENESS AND INDEFINITENESS<span class=\"ar\">الباب الرابع في التعريف والتنكير<\/span><\/h3><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 74<\/span><\/div><div class=\"ar\">إذا تعلّق الغرض بتفهيم المخاطَب ارتباطَ الكلام بمعيّن، فالمقام للتعريف، وإذا لَم يتعلّق الغرض بذلك، فالمقام للتنكير،<\/div><div class=\"tr\">If the purpose is concerned with making the addressee understand that the statement is tied to a specific (thing), then the occasion is one for definiteness; and if the purpose is not concerned with that, then the occasion is one for indefiniteness.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>Should a noun be <b>definite<\/b> (<i>maʿrifah<\/i>) or <b>indefinite<\/b> (<i>nakirah<\/i>)? The book gives the general rule first.<\/p><p>If you want the listener to understand that you are speaking about <b>one particular, known thing<\/b>, the situation calls for a definite noun. If that is not your aim, it calls for an indefinite noun.<\/p><p>After this summary, the book goes through each kind of definite noun and the purposes it serves, and ends with the indefinite noun.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 74<\/span><\/div><div class=\"ar\">وَلتفصيل هذا الإجمال نقول: من المعلوم أنّ المعارف: «الضمير» و«العلم» و«اسم الإشارة» و«الاسم الموصول» و«المحلّى بـ\"أل\"» و«المضاف» لواحد مِمّا ذكر و«المنادى».<\/div><div class=\"tr\">To set out this summary in detail, we say: it is well known that the definite nouns are «the pronoun», «the proper name», «the demonstrative noun», «the relative noun», «the noun made definite with \"al\"», «the noun annexed» to one of those mentioned, and «the one called out to (al-munādā)».<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>These seven kinds of definite noun are the ones you learnt in <i>naḥw<\/i>. In <i>balāghah<\/i> the question is not <i>what<\/i> they are but <b>why<\/b> a speaker chooses one rather than another. The chapter takes them in this order.<\/p><\/div><div class=\"chartbox\"><div class=\"chh\">THE DEFINITE NOUNS · DRAWN BY THE COMPANION<\/div><div class=\"tree\"><div class=\"node\">Maʿārif<span class=\"ar\">المعارف<\/span><\/div><div class=\"stem\"><\/div><div class=\"bar\" style=\"margin:0 7.14%\"><\/div><div class=\"row\"><div class=\"col\"><div class=\"node\">Pronoun<span class=\"ar\">الضمير<\/span><\/div><\/div><div class=\"col\"><div class=\"node\">Proper name<span class=\"ar\">العلم<\/span><\/div><\/div><div class=\"col\"><div class=\"node\">Demonstrative<span class=\"ar\">اسم الإشارة<\/span><\/div><\/div><div class=\"col\"><div class=\"node\">Relative<span class=\"ar\">الموصول<\/span><\/div><\/div><div class=\"col\"><div class=\"node\">With al<span class=\"ar\">المحلّى بأل<\/span><\/div><\/div><div class=\"col\"><div class=\"node\">Annexed<span class=\"ar\">المضاف<\/span><\/div><\/div><div class=\"col\"><div class=\"node\">Called<span class=\"ar\">المنادى<\/span><\/div><\/div><\/div><\/div><\/div><h3>THE PRONOUN (AL-ḌAMĪR)<\/h3><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 74–75<\/span><\/div><div class=\"ar\">أمّا الضمير؛ فيؤتى به لكون المقام للتكلّم، أو الخطاب، أو الغيبة مع الاختصار، نحو: «أنا رجوتك في هذا الأمر»، و«أنت وعدتني بإنجازه».<\/div><div class=\"tr\">As for the pronoun, it is used because the occasion is one of speaking in the first person, or of address, or of the absent (third person), together with brevity; for example: «I hoped (for something from) you in this matter», and «You promised me to accomplish it».<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>A <b>pronoun<\/b> is used when the situation is one of <b>speaking<\/b> (first person: ‎<span class=\"arin\">أنا<\/span>‎), <b>addressing<\/b> (second person: ‎<span class=\"arin\">أنت<\/span>‎) or <b>speaking of someone absent<\/b> (third person: ‎<span class=\"arin\">هو<\/span>‎), and you want to be <b>brief<\/b>. ‎<span class=\"arin\">أنا رجوتك<\/span>‎ is shorter than repeating your name, and the listener knows exactly who is meant.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 75–76<\/span><\/div><div class=\"ar\">والأصل في الخطاب أن يكون لِمُشاهَد معيّن، وقد يُخاطَب غيرُ الْمشاهَد إذا كان مستحضراً في القلب، نحو: ﴿إِيَّاكَ نَعْبُدُ﴾ [الفاتحة: ٥]، وغيرُ المعيّن إذا قصد تعميم الخطاب لكلٍّ من يمكن خطابه، نحو: «اللئيم مَن إذا أحسنت إليه أساء إليك».<\/div><div class=\"tr\">The default in address is that it be to a specific person who is witnessed (present). One who is not witnessed may be addressed if he is present in the heart, for example: ﴿You (alone) we worship﴾ [al-Fātiḥah: 5]; and one who is not specific (may be addressed) if it is intended to make the address general to everyone whom it is possible to address, for example: «The base man is he who, if you do good to him, does evil to you».<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>Normally, \"you\" is said to someone <b>present and specific<\/b>, someone you can see. But the book gives two exceptions.<\/p><p>(1) Someone <b>not seen<\/b> may be addressed as \"you\" if he is <b>present in the heart<\/b>. In ‎<span class=\"arin\">إِيَّاكَ نَعْبُدُ<\/span>‎ the worshipper addresses Allah directly, because he is so aware of Him that it is as if he were before Him.<\/p><p>(2) The address may be to <b>no one in particular<\/b>, when it is meant for <b>everyone<\/b> who could be addressed. \"The base man is he who, if <i>you<\/i> do good to him, does evil to <i>you<\/i>\": the <i>you<\/i> means anyone at all.<\/p><\/div><h3>THE PROPER NAME (AL-ʿALAM)<\/h3><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 76<\/span><\/div><div class=\"ar\">وأمّا العلم؛ فيؤتى به لإحضار معناه في ذهن السامع باسمه الخاصّ، نحو: ﴿وَإِذْ يَرْفَعُ إِبْرَاهِيمُ الْقَوَاعِدَ مِنَ الْبَيْتِ وَإِسْمَاعِيلُ﴾ [البقرة: ١٢٧].<\/div><div class=\"tr\">As for the proper name, it is used to bring its referent into the listener’s mind by its own particular name, for example: ﴿And when Ibrāhīm was raising the foundations of the House, and Ismāʿīl﴾ [al-Baqarah: 127].<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>A <b>proper name<\/b> brings the person to the listener's mind <b>by his own name<\/b>, the clearest way of identifying him. ‎<span class=\"arin\">إِبْرَاهِيمُ<\/span>‎ and ‎<span class=\"arin\">إِسْمَاعِيلُ<\/span>‎ are named in the verse so that there is no doubt who raised the foundations of the House.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 76–77<\/span><\/div><div class=\"ar\">وقد يقصد به مع ذلك أغراض أخرى:<br>(١) كالتعظيم في نحو: «ركب سيف الدولة».<br>(٢) والإهانةِ في نحو: «ذهب صخر».<br>(٣) والكنايةِ عن معنى يصلح اللفظ له في نحو: ﴿تَبَّتْ يَدَا أَبِي لَهَبٍ﴾ [اللهب: ١].<\/div><div class=\"tr\">Along with that, other purposes may be intended by it:<br>(1) such as exaltation, in «Sayf al-Dawlah (the Sword of the State) rode out»;<br>(2) and contempt, in «Ṣakhr (Rock) went»;<br>(3) and alluding (kināyah) to a meaning for which the word is suited, in ﴿Perish the two hands of Abū Lahab﴾ [al-Lahab: 1].<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>Sometimes a name is chosen because its meaning adds something:<\/p><b>Exaltation<\/b>: ‎<span class=\"arin\">سيف الدولة<\/span>‎ (\"the Sword of the State\") is a title of honour; using it raises the person.<b>Contempt<\/b>: ‎<span class=\"arin\">صخر<\/span>‎ (\"rock\"), when it is the name of someone despised, suggests hardness and dullness.<b>Allusion<\/b> (<i>kināyah<\/i>): ‎<span class=\"arin\">أَبِي لَهَبٍ<\/span>‎ means \"father of flame\". Calling him by this name points to where he is going: the blazing Fire.<
