n allusion understood only from the <b>context<\/b>. The word comes from ‎<span class=\"arin\">عُرض<\/span>‎, \"side\": the speaker aims his words sideways at someone.<\/p><p>Saying \"The best people are those who benefit others\" to someone who harms people does not mention him at all; but in that situation the hint is clear: <i>you<\/i> are not among the best.<\/p><\/div><div class=\"chartbox\"><div class=\"chh\">KINĀYAH BY ITS STEPS · DRAWN BY THE COMPANION<\/div><table class=\"grid\"><thead><tr><th>Name<\/th><th>Steps<\/th><th>Book's example<\/th><\/tr><\/thead><tbody><tr><td>Talwīḥ ‎<span class=\"arin\">تلويح<\/span>‎<\/td><td>many<\/td><td>‎<span class=\"arin\">هو كثير الرماد<\/span>‎<\/td><\/tr><tr><td>Ramz ‎<span class=\"arin\">رُمز<\/span>‎<\/td><td>few and hidden<\/td><td>‎<span class=\"arin\">هو سمين رِخْو<\/span>‎<\/td><\/tr><tr><td>Īmāʾ, ishārah ‎<span class=\"arin\">إيماءً وإشارةً<\/span>‎<\/td><td>few or none, clear<\/td><td>‎<span class=\"arin\">أَلْقَى رَحْلَهُ فِيْ آلِ طَلْحَةَ<\/span>‎<\/td><\/tr><tr><td>Taʿrīḍ ‎<span class=\"arin\">تعريض<\/span>‎<\/td><td>understood from the context<\/td><td>‎<span class=\"arin\">خير الناس من ينفعُهم<\/span>‎<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box\"><div class=\"bh\">KEY TERMS AND THEIR MEANINGS · ADDED BY THE COMPANION<\/div><table class=\"terms\"><tr><td class=\"t\">Kināyah<\/td><td>Metonymy: an expression by which what is attached to its meaning is intended, the meaning itself remaining permissible to intend<\/td><td class=\"a\">الكناية<\/td><\/tr><tr><td class=\"t\">Lāzim maʿnāh<\/td><td>What is necessarily attached to the meaning of the expression<\/td><td class=\"a\">لازم معناه<\/td><\/tr><tr><td class=\"t\">Al-maknī ʿanhu<\/td><td>The thing alluded to by the kināyah<\/td><td class=\"a\">المكنيّ عنه<\/td><\/tr><tr><td class=\"t\">Ṣifah<\/td><td>A quality: a meaning subsisting in something else (e.g. generosity, tallness)<\/td><td class=\"a\">صفة<\/td><\/tr><tr><td class=\"t\">Nisbah<\/td><td>Attribution of a quality to the thing described<\/td><td class=\"a\">نسبة<\/td><\/tr><tr><td class=\"t\">Wasāʾiṭ (sing. wāsiṭah)<\/td><td>Intermediaries in the move from the expression to the thing alluded to<\/td><td class=\"a\">الوسائط<\/td><\/tr><tr><td class=\"t\">Talwīḥ<\/td><td>Kināyah with many intermediaries (pointing from afar)<\/td><td class=\"a\">تلويح<\/td><\/tr><tr><td class=\"t\">Ramz<\/td><td>Kināyah with few, hidden intermediaries (a hint)<\/td><td class=\"a\">رمز<\/td><\/tr><tr><td class=\"t\">Īmāʾ wa-ishārah<\/td><td>Kināyah with few or no intermediaries, and clear<\/td><td class=\"a\">إيماء وإشارة<\/td><\/tr><tr><td class=\"t\">Taʿrīḍ<\/td><td>Kināyah understood through the context; inclining speech towards a side<\/td><td class=\"a\">تعريض<\/td><\/tr><tr><td class=\"t\">Nijād<\/td><td>Sword-belt; the sword’s shoulder-straps<\/td><td class=\"a\">النجاد<\/td><\/tr><\/table><\/div><h3>QUESTIONS AND ANSWERS<span class=\"ar\">أسئلة وأجوبة<\/span><\/h3><div class=\"qabox\"><div class=\"qh\">QUESTIONS AND ANSWERS · ADDED BY THE COMPANION<\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>Define <i>kināyah<\/i> and explain the book's example.<\/div><div class=\"a\"><span class=\"k\">A.<\/span>An expression by which something attached to its meaning is intended, while the meaning itself may also be intended. \"Long of sword-belt\" means tall, though he may really have a long belt.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>How does <i>kināyah<\/i> differ from <i>majāz<\/i>?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>In <i>majāz<\/i> the clue prevents the real meaning; in <i>kināyah<\/i> the real meaning may still be intended.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>What does each allusion in al-Khansāʾ's line point to?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>Long sword-belt: tallness; high tent-pole: being a chief; much ash: generosity.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>What kind of <i>kināyah<\/i> is ‎<span class=\"arin\">الْمجد بين ثوبَيه والكرم تحت رِدائه<\/span>‎?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>One pointing to an attribution: it links glory and nobility to him.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>What is ‎<span class=\"arin\">مَجَامِعَ الأَضْغَانِ<\/span>‎ an allusion to?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>The hearts: an allusion to something that is neither a quality nor an attribution.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>Set out the steps from ‎<span class=\"arin\">كثير الرماد<\/span>‎ to generosity. What is this kind called?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>Much ash → much burning → much cooking and baking → many eaters → many guests → generosity. It is <i>talwīḥ<\/i>.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>Distinguish <i>ramz<\/i> from <i>īmāʾ<\/i>.<\/div><div class=\"a\"><span class=\"k\">A.<\/span>Both have few steps; in <i>ramz<\/i> they are hidden, in <i>īmāʾ<\/i> they are clear.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>What is <i>taʿrīḍ<\/i>? Give the book's example.<\/div><div class=\"a\"><span class=\"k\">A.<\/span>An allusion understood from the context, inclining speech to one side: saying \"the best people are those who benefit them\" to someone who harms people.<\/div><\/div><\/div>", "terms": [{"t": "Kināyah", "m": "Metonymy: an expression by which what is attached to its meaning is intended, the meaning itself remaining permissible to intend", "a": "الكناية"}, {"t": "Lāzim maʿnāh", "m": "What is necessarily attached to the meaning of the expression", "a": "لازم معناه"}, {"t": "Al-maknī ʿanhu", "m": "The thing alluded to by the kināyah", "a": "المكنيّ عنه"}, {"t": "Ṣifah", "m": "A quality: a meaning subsisting in something else (e.g. generosity, tallness)", "a": "صفة"}, {"t": "Nisbah", "m": "Attribution of a quality to the thing described", "a": "نسبة"}, {"t": "Wasāʾiṭ (sing. wāsiṭah)", "m": "Intermediaries in the move from the expression to the thing alluded to", "a": "الوسائط"}, {"t": "Talwīḥ", "m": "Kināyah with many intermediaries (pointing from afar)", "a": "تلويح"}, {"t": "Ramz", "m": "Kināyah with few, hidden intermediaries (a hint)", "a": "رمز"}, {"t": "Īmāʾ wa-ishārah", "m": "Kināyah with few or no intermediaries, and clear", "a": "إيماء وإشارة"}, {"t": "Taʿrīḍ", "m": "Kināyah understood through the context; inclining speech towards a side", "a": "تعريض"}, {"t": "Nijād", "m": "Sword-belt; the sword’s shoulder-straps", "a": "النجاد"}], "part": null}, {"num": 15, "title": "Embellishments of Meaning", "ar": "محسّنات معنوية", "body": "<h3>THE SCIENCE OF EMBELLISHMENT<span class=\"ar\">علم البديع<\/span><\/h3><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 184<\/span><\/div><div class=\"ar\">البديع: علم يعرف به وجوه تحسين الكلام المطابقِ لمقتَضى الحال، وهذه الوجوه ما يرجع منها إلى تحسين المعنى يسمّى بـ«الْمُحسِّنات المعنويّة»، وما يرجع منها إلى تحسين اللفظ يسمّى بـ:«الْمُحسِّنات اللفظيّة».<\/div><div class=\"tr\"><i>Al-Badīʿ<\/i> is a science by which one knows the ways of beautifying speech that conforms to what the situation requires. Of these ways, those that go back to beautifying the meaning are called “the embellishments of meaning” (<i>al-muḥassināt al-maʿnawiyyah<\/i>), and those that go back to beautifying the wording are called “the embellishments of wording” (<i>al-muḥassināt al-lafẓiyyah<\/i>).<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>This begins Part Three: <b>ʿilm al-badīʿ<\/b>, the science of embellishment. Notice the words \"speech that conforms to what the situation requires\": <i>badīʿ<\/i> only beautifies speech that is already <i>balīgh<\/i>. Ornament on speech that does not fit its situation is worthless.<\/p><p>The embellishments are of two kinds: those that beautify the <b>meaning<\/b> (this chapter) and those that beautify the <b>wording<\/b> (the next chapter). A simple test: if you change the words but keep the meaning, does the beauty survive? If yes, it is an embellishment of meaning; if no, it is an embellishment of wording.<\/p><\/div><div class=\"chartbox\"><div class=\"chh\">THE PLAN OF ʿILM AL-BADĪʿ · DRAWN BY THE COMPANION<\/div><div class=\"tree\"><div class=\"node\">ʿIlm al-badīʿ<span class=\"ar\">علم البديع<\/span><\/div><div class=\"stem\"><\/div><div class=\"bar\" style=\"margin:0 25.00%\"><\/div><div class=\"row\"><div class=\"col\"><div class=\"node\">Embellishments of meaning<span class=\"ar\">المحسّنات المعنويّة<\/span><\/div><div class=\"sub\">Chapter XV<\/div><\/div><div class=\"col\"><div class=\"node\">Embellishments of wording<span class=\"ar\">المحسّنات اللفظيّة<\/span><\/div><div class=\"sub\">Chapter XVI<\/div><\/div><\/div><\/div><\/div><h3>EMBELLISHMENTS OF MEANING<span class=\"ar\">محسّنات معنوية<\/span><\/h3><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 185<\/span><\/div><div class=\"ar\">(١) التورية: أن يذكر لفظ له معنيان: قريب: يتبادر فهمه من الكلام، وبعيد: هو المراد بالإفادة لقرينة خفيّة، نحو: ﴿وَهُوَ الَّذِي يَتَوَفَّاكُم بِاللَّيْلِ وَيَعْلَمُ مَا جَرَحْتُم بِالنَّهَارِ﴾ [الأنعام: ٦٠]. أراد بقوله: «جرحتم» معناه البعيدَ، وهو ارتكاب الذنوب،<\/div><div class=\"tr\">(1) <i>Al-Tawriyah<\/i> (double entendre): that a word is mentioned which has two meanings: a near one, whose understanding springs to mind first from the speech, and a far one, which is what is meant to be conveyed, because of a hidden indicator. As in: ﴿And it is He who takes you in death by night and knows what you have committed [<i>jaraḥtum<\/i>] by day﴾ [al-Anʿām 6:60]. By His word <i>jaraḥtum<\/i> He meant its far meaning, which is committing sins.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Tawriyah<\/b> (double meaning): a word with two meanings, a <b>near<\/b> one that comes to mind first, and a <b>far<\/b> one that is actually meant, shown by a subtle clue.<p>In the verse, ‎<span class=\"arin\">جَرَحْتُم<\/span>‎ first suggests \"wounded\", its near meaning. But it is meant in its far sense: \"committed (sins)\". The clue is the context: Allah's knowledge of what people do by day.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 186<\/span><\/div><div class=\"ar\">وكقوله:<span class=\"bayt\"><span class=\"h1\">يَا سَيِّدُ أَحَازَ لُطْفاً<\/span><span class=\"h2\">لَهُ الْبَرَايَا عَبِيْدُ<\/span><\/span><span class=\"bayt\"><span class=\"h1\">أَنْتَ الْحُسَيْنُ وَلَكِنْ<\/span><span class=\"h2\">جَفَاكَ فِيْنَا يَزِيْدُ<\/span><\/span>معنى «يَزِيْدُ» القريبُ: أنّه عَلَم، ومعناه البعيد المقصود: أنّه فعل مضارع من «زاد».<\/div><div class=\"tr\">And as in his words:<br>“O master who has gained a gentleness to which all creatures are slaves —<br>you are al-Ḥusayn; but your harshness among us increases [<i>yazīd<\/i>].”<br>The near meaning of <i>yazīd<\/i> is that it is a proper name; its far, intended meaning is that it is a present-tense verb from <i>zāda<\/i> (to increase).<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>A playful example. Addressing a man named after al-Ḥusayn, the poet says \"you are al-Ḥusayn, but your harshness among us <i>yazīd<\/i>\". The near meaning is the name <b>Yazīd<\/b>, which suits mentioning al-Ḥusayn. The far, intended meaning is the verb ‎<span class=\"arin\">يَزِيْدُ<\/span>‎, \"increases\": your harshness keeps growing.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 186<\/span><\/div><div class=\"ar\">(٢) الإبهام: إيراد الكلام محتمَلاً لوجهين متضادّين، نحو:<span class=\"bayt\"><span class=\"h1\">بَارَكَ اللهُ لِلْحَسَنِ<\/span><span class=\"h2\">وَلِبَوْرَانَ فِيْ الْخَتَنِ<\/span><\/span><span class=\"bayt\"><span class=\"h1\">يَا إِمَامَ الْهُدَى ظَفَرْ<\/span><span class=\"h2\">تَ وَلَكِنْ بِبِنْتِ مَنْ<\/span><\/span>فإنّ قوله: «بِبِنْتِ» من يحتمل أن يكون مدحاً؛ لعظمة، وأن يكون ذمًّا؛ لدناءة.<\/div><div class=\"tr\">(2) <i>Al-Ibhām<\/i> (ambiguity): bringing speech that can bear two opposite senses, as in:<br>“May Allah bless al-Ḥasan and Būrān in the marriage-tie!<br>O imam of guidance, you have won — but with the daughter of whom!”<br>For his words “with the daughter of whom” can be praise, for [her father’s] greatness, and can be censure, for [his] baseness.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Ibhām<\/b> (ambiguity): words that can be taken in <b>two opposite ways<\/b>, both equally. Unlike <i>tawriyah<\/i>, neither meaning is clearly the intended one.<p>Congratulating al-Ḥasan on marrying Būrān, the poet ends \"you have won, but with the daughter of <i>whom<\/i>!\" That may be praise (what a great father she has!) or mockery (what a lowly father she has!). The poet keeps both possible.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 187<\/span><\/div><div class=\"ar\">(٣) التوجيه: إفادة معنىً بألفاظ موضوعة له ولكنّها أسماءُ لناس أو غيرهم، كقول بعضهم يصف نَهراً:<span class=\"bayt\"><span class=\"h1\">إِذَا فَاخَرَتْهُ الرِيْحُ وَلَّتْ عَلِيْلَةً<\/span><span class=\"h2\">بِأَذْيَالِ كُثْبَانِ الثَرَى تَتَعَسَّرُ<\/span><\/span><span class=\"bayt\"><span class=\"h1\">بِهِ الْفَضْلُ يَبْدُوْا وَالرَبِيْعُ وَكَمْ غَدَا<\/span><span class=\"h2\">بِهِ الرَوْضُ يحيَى وَهُوَ لاَ شَكَّ جَعْفَرُ<\/span><\/span>فالفضل والربيع ويحيى وجعفر أسماء ناس، وكقوله:<span class=\"bayt\"><span class=\"h1\">وَمَا حُسْنُ بَيْتٍ لَهُ زُخْرُفٌ<\/span><span class=\"h2\">تَرَاهُ إِذَا زُلْزِلَتْ لَمْ يَكُنْ<\/span><\/span>فإنّ «زخرفاً» و«إذا زلزلت» و«لَم يكن» أسماء سور من القرآن.<\/div><div class=\"tr\">(3) <i>Al-Tawjīh<\/i> (double naming): conveying a meaning with words coined for it which are, however, names of people or of other things; as in the words of one of them describing a river:<br>“When the wind vies with it in boasting, it turns away sickly, stumbling along the skirts of the sand-dunes.<br>Through it bounty [<i>al-faḍl<\/i>] appears, and spring [<i>al-rabīʿ<\/i>]; and how often through it the meadow has come to live [<i>yaḥyā<\/i>] — and it is, no doubt, a stream [<i>jaʿfar<\/i>]!”<br>Al-Faḍl, al-Rabīʿ, Yaḥyā and Jaʿfar are names of people. And as in his words:<br>“What is the beauty of a house that has ornament [<i>zukhruf<\/i>], when you see that, if it is shaken [<i>idhā zulzilat<\/i>], it is not [<i>lam yakun<\/i>]?”<br>For <i>Zukhruf<\/i>, <i>Idhā Zulzilat<\/i> and <i>Lam Yakun<\/i> are names of sūrahs of the Qurʾān.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Tawjīh<\/b>: using words in their normal meaning, which also happen to be <b>names<\/b> of people or other things, so a second layer appears.<p>The river poem uses ordinary words (bounty, spring, comes to life, stream) that are also the names of famous men: al-Faḍl, al-Rabīʿ, Yaḥyā and Jaʿfar. In the second line, \"ornament\", \"when it is shaken\" and \"it is not\" are also names of sūrahs: al-Zukhruf, al-Zalzalah and al-Bayyinah (which begins ‎<span class=\"arin\">لم يكن<\/span>‎).<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 187–188<\/span><\/div><div class=\"ar\">(٤) الطباق: هو الجمع بين معنيَين متقابِلَين، نحو قوله تعالى: ﴿وَتَحْسَبُهُمْ أَيْقَاظاً وَهُمْ رُقُودٌ﴾ [الكهف: ١٨]. ﴿وَلَكِنَّ أَكْثَرَ النَّاسِ لاَ يَعْلَمُونَ يَعْلَمُوْنَ ظَاهِراً مِنَ الْحَيَاةِ الدُّنْيَا﴾ [الروم: ٦،٧].<\/div><div class=\"tr\">(4) <i>Al-Ṭibāq<\/i> (antithesis): it is combining two opposed meanings, as in His words, Exalted is He: ﴿And you would think them awake, while they were asleep﴾ [al-Kahf 18:18]; ﴿but most of the people do not know. They know what is apparent of the worldly life﴾ [al-Rūm 30:6–7].<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Ṭibāq<\/b> (antithesis): putting <b>opposites<\/b> together. \"You would think them <b>awake<\/b>, while they were <b>asleep<\/b>\"; \"most people <b>do not know<\/b>; they <b>know<\/b> the outward of this life\". The contrast makes each meaning sharper.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 188<\/span><\/div><div class=\"ar\">(٥) من الطباق الْمُقابَلةُ: وهو أن يؤتى بِمعنيَين أو أكثرَ ثُمّ يؤتى بما يقابل ذلك على الترتيب، نحو قوله تعالى: ﴿فَلْيَضْحَكُوْا قَلِيلاً وَلْيَبْكُوْا كَثِيراً﴾ [التوبة: ٨٢].<\/div><div class=\"tr\">(5) Of <i>ṭibāq<\/i> is <i>al-muqābalah<\/i> (parallel antithesis): that two or more meanings are brought, and then what is opposite to them is brought, in order; as in His words, Exalted is He: ﴿So let them laugh a little and weep much﴾ [al-Tawbah 9:82].<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Muqābalah<\/b> is a fuller kind of <i>ṭibāq<\/i>: two or more meanings, then their opposites <b>in the same order<\/b>. \"Laugh <b>little<\/b>… weep <b>much<\/b>\": laugh ↔ weep, little ↔ much.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 189<\/span><\/div><div class=\"ar\">(٦) ومنه التدبيج وهو التقابل بين ألفاظ الألوان، كقوله:<span class=\"bayt\"><span class=\"h1\">تَرَدَّى ثِيَابَ الْمَوْتِ حُمْراً فَمَا أَتَى<\/span><span class=\"h2\">لَهَا اللَيْلُ إلاّ وَهِيَ مِنْ سُنْدُسٍ خُضْرٍ<\/span><\/span><\/div><div class=\"tr\">(6) Of it is <i>al-tadbīj<\/i> (colour-embroidery), which is opposition between words for colours, as in his words:<br>“He put on the garments of death, red; and night had not come to them before they were of green silk-brocade.”<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Tadbīj<\/b>: a contrast of <b>colours<\/b>. The martyr put on the garments of death, <b>red<\/b> with blood; by nightfall they had become garments of <b>green<\/b> silk, the clothing of Paradise. The colours carry the meaning: death in battle, then reward.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 189–190<\/span><\/div><div class=\"ar\">(٧) الإدماج أن يُضمن كلام سيق لِمعنى معنى آخرُ، نحو قول أبي الطيّب:<span class=\"bayt\"><span class=\"h1\">أُقَلِّبُ فِيْهِ أَجْفَانِيْ كَأَنِّيْ<\/span><span class=\"h2\">أَعُدُّ بِهَا عَلَى الدَهْرِ الذُنُوْبَا<\/span><\/span>فإنّه ضمّن وصف الليل بالطول الشكايةَ من الدهر.<\/div><div class=\"tr\">(7) <i>Al-Idmāj<\/i> (insertion): that speech driven for one meaning is made to include another meaning, as in the words of Abū al-Ṭayyib:<br>“I turn my eyelids over in it, as though with them I were counting up against Time its sins.”<br>For he made his describing the night as long include complaint against Time.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Idmāj<\/b>: speech meant for one meaning <b>slips in<\/b> another. Al-Mutanabbī describes a long, sleepless night, turning his eyelids over and over; but he adds \"as though counting Time's sins against it\", so that the description also becomes a <b>complaint against Time<\/b>.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 190<\/span><\/div><div class=\"ar\">(٨) ومن الإدماج ما يسمّى بـ«الاستتباع»: وهو المدح بشيء على وجه يستتبع المدحَ بشيء آخر، كقول الخوارزميّ:<span class=\"bayt\"><span class=\"h1\">سَمَحَ البَدَاهَةَ لَيْسَ يُمْسِكُ لَفْظَهُ<\/span><span class=\"h2\">فَكَأَنَّمَا أَلْفَاظُهُ مِنْ مَالِهِ<\/span><\/span><\/div><div class=\"tr\">(8) Of <i>idmāj<\/i> is what is called <i>al-istitbāʿ<\/i> (entailed praise): it is praising for one thing in a way that brings in its train praise for another thing, as in the words of al-Khwārizmī:<br>“Generous in his ready speech, he does not hold back his words — as though his words were of his wealth.”<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Istitbāʿ<\/b>, a kind of <i>idmāj<\/i>: praising someone for one quality in a way that <b>brings along<\/b> praise for another. The man is praised for ready, flowing speech; then \"as though his words were from his wealth\" adds praise for his <b>generosity<\/b>: he spends words as freely as he spends money.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 190–191<\/span><\/div><div class=\"ar\">(٩) مراعاة النظير: هي جمع أمر وما يناسبه لا بالتضاد: كقوله:<span class=\"bayt\"><span class=\"h1\">إِذَا صَدَقَ الْجَدُّ اِفْتَرَى الْعَمُّ لِلْفَتَى<\/span><span class=\"h2\">مَكَارِمُ لاَ تَخْفَى وَإِنْ كَذَبَ الخَالُ<\/span><\/span>فقد جَمَع بين الجدّ والعمّ والخال، والمراد بالأوّل: الحظّ وبالثاني: عامّة الناس بالثالث: الظنّ.<\/div><div class=\"tr\">(9) <i>Murāʿāt al-naẓīr<\/i> (observing the counterpart): it is combining a thing and what is related to it, not by way of contrariety; as in his words:<br>“When fortune [<i>al-jadd<\/i>] proves true, the common folk [<i>al-ʿamm<\/i>] invent for the young man noble deeds that cannot be hidden, even if opinion [<i>al-khāl<\/i>] proves false.”<br>He has combined <i>al-jadd<\/i> (grandfather), <i>al-ʿamm<\/i> (paternal uncle) and <i>al-khāl<\/i> (maternal uncle); what is meant by the first is fortune, by the second the generality of people, [and] by the third opinion.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Murāʿāt al-naẓīr<\/b> (matching): bringing together things that <b>belong together<\/b>, but not as opposites. The poet uses ‎<span class=\"arin\">الجد<\/span>‎، ‎<span class=\"arin\">العمّ<\/span>‎، ‎<span class=\"arin\">الخال<\/span>‎, words that suggest family (grandfather, uncle, uncle); but he means <b>fortune<\/b>, <b>the common people<\/b> and <b>opinion<\/b>. The family words sit together as a matching set, while the meaning is something else.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 191–192<\/span><\/div><div class=\"ar\">(١٠) الاستخدام: هو ذكر اللفظ بمعنىً وإعادة ضمير عليه بمعنىً آخر، أو إعادة ضميرَين تريد بثانيهما غيرَ ما أردته بأوّلِهما، فالأوّل: نحو قوله تعالى: ﴿فَمَن شَهِدَ مِنكُمُ الشَّهْرَ فَلْيَصُمْهُ﴾ [البقرة: ١٨٥]، أراد بالشهر الهلالَ، وبضميره الزمانَ المعلوم،<\/div><div class=\"tr\">(10) <i>Al-Istikhdām<\/i> (employment): it is mentioning a word in one meaning and bringing back a pronoun to it in another meaning; or bringing back two pronouns, by the second of which you mean something other than what you meant by the first. The first is as in His words, Exalted is He: ﴿So whoever of you witnesses the month, let him fast it﴾ [al-Baqarah 2:185]: by “the month” He meant the new moon, and by its pronoun the known period of time.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Istikhdām<\/b>: a word used in one meaning, and a pronoun referring to it in <b>another<\/b> meaning.<p>In ‎<span class=\"arin\">فَمَن شَهِدَ مِنكُمُ الشَّهْرَ فَلْيَصُمْهُ<\/span>‎, ‎<span class=\"arin\">الشَّهْرَ<\/span>‎ means the <b>new moon<\/b> (whoever sees it), while the pronoun in ‎<span class=\"arin\">فَلْيَصُمْهُ<\/span>‎ means the <b>month<\/b> as a period of time (let him fast it).<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 192<\/span><\/div><div class=\"ar\">والثاني: كقوله:<span class=\"bayt\"><span class=\"h1\">فَسقَى الْغَضَاءَ وَالسَاكِنِيْهِ وَإِنْ هُمْ<\/span><span class=\"h2\">شَبُّوْهُ بَيْنَ جَوَانِحِيْ وَضُلُوْعِيْ<\/span><\/span>الغضاء شجر بالبادية، وضمير «ساكنيه» يعود إليه بمعنى مكانه، وضمير «شبّوه» يعود إليه بمعنى ناره.<\/div><div class=\"tr\">And the second is as in his words:<br>“May [rain] water the <i>ghaḍā<\/i> and those who dwell in it, even though they have kindled it between my ribs and my sides.”<br>The <i>ghaḍā<\/i> is a tree of the desert. The pronoun in “those who dwell in it” refers to it in the sense of its place, and the pronoun in “they have kindled it” refers to it in the sense of its fire.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>The second form: <b>two pronouns<\/b> referring to one word in two different meanings. ‎<span class=\"arin\">الْغَضَاءَ<\/span>‎ is a desert tree. In \"those who dwell <i>in it<\/i>\" the pronoun means its <b>place<\/b> (the land where it grows); in \"they kindled <i>it<\/i>\" the pronoun means its <b>fire<\/b> (its wood burns long and hot), here the fire of love in his chest.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 193–194<\/span><\/div><div class=\"ar\">(١١) الاستطراد: هو أن يخرُج المتكلّم من الغرض الذي هو فيه إلى آخرَ لِمناسَبة، ثُمّ يرجع إلى تتميم الأوّل، كقول السمؤل:<span class=\"bayt\"><span class=\"h1\">وَإِنَّا أُنَاسٌ لاَ نَرَى الْقَتْلَ سُبَّةً<\/span><span class=\"h2\">إِذَا مَا رَأَتْهُ عَامِرٌ وَسَلُوْلٌ<\/span><\/span><span class=\"bayt\"><span class=\"h1\">يُقَرِّبُ حُبُّ الْمَوْتِ آجَالَنَا لَنَا<\/span><span class=\"h2\">وَتَكْرَهُهُ آجَالُهُمْ فَتَطُوْلُ<\/span><\/span><span class=\"bayt\"><span class=\"h1\">وَمَا مَاتَ مِنَّا سَيِّدٌ حَتْفَ أَنْفِهِ<\/span><span class=\"h2\">وَلاَ طُلَّ مِنَّا حَيْثُ كَانَ قَتِيْلُ<\/span><\/span>فسياق القصيدة للفخر، واستطرد منه إلي هجاء عامر وسلول، ثُمّ عاد إليه.<\/div><div class=\"tr\">(11) <i>Al-Istiṭrād<\/i> (digression): it is that the speaker goes out of the aim he is engaged in to another, because of some relation, and then returns to completing the first; as in the words of al-Samawʾal:<br>“We are a people who do not consider being killed a disgrace, when ʿĀmir and Salūl consider it so.<br>Love of death brings our appointed terms near to us, while their terms hate it, and so grow long.<br>No chief of ours has died a natural death, nor has [the blood of] one of ours gone unavenged wherever he was slain.”<br>The course of the ode is for boasting; he digressed from it to satirising ʿĀmir and Salūl, then returned to it.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Istiṭrād<\/b> (digression): leaving the main subject for another, because of some link, and then <b>coming back<\/b>. Al-Samawʾal is boasting of his tribe's courage; mentioning that they do not see being killed as shameful leads him to mock ʿĀmir and Salūl, who do; then he returns to boasting.<\/div><div class=\"cnote\"><span class=\"cnh\">COMPANION&#8217;S NOTE · NOT IN THE BOOK<\/span><p>The matn prints ‎<span class=\"arin\">إلي هجاء<\/span>‎ with a dotted <i>yāʾ<\/i>; the likely reading is ‎<span class=\"arin\">إلى<\/span>‎.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 194<\/span><\/div><div class=\"ar\">(١٢) الافتنان: هو الجمع بين فنَّين مختلفَين، كالغزل والحماسة، والمدح والهجاء، والتعزية والتهنية، كقول عبد الله بن همام السلوليّ حين دخل على يزيد؛ وقد مات أبوه معاوية وخلفه هو في الملك: «آجرَك الله على الرُزيّة، وباركَ لك في العطيّة، وأعانَك على الرَعيّة، فقد رُزئت عظيماً، وأُعطيتَ جسيماً، فاشكر الله على ما أُعطيتَ، واصبر على ما رزئتَ، فقد فقدتَ الخليفة، وأعطيت الخلافة، ففارقت خليلاً، ووُهبت جليلاً».<span class=\"bayt\"><span class=\"h1\">اِصْبِرْ يَزِيْدُ فَقَدْ فَارَقْتَ ذَا ثِقَةٍ<\/span><span class=\"h2\">وَاشْكُرْ حِبَاءَ الَّذِيْ بِالْمُلْكِ أَصْفَاكَ<\/span><\/span><span class=\"bayt\"><span class=\"h1\">لاَ رُزْءَ أَصْبَحَ فِي الأَقْوَامِ نَعْلَمُهُ<\/span><span class=\"h2\">كَمَا رُزِئْتَ وَلاَ عُقْبَى كَعُقْبَاكَ<\/span><\/span><\/div><div class=\"tr\">(12) <i>Al-Iftinān<\/i> (combining genres): it is combining two different genres, such as love poetry and valour, praise and satire, condolence and congratulation; as in the words of ʿAbd Allāh ibn Hammām al-Salūlī when he came in to Yazīd, his father Muʿāwiyah having died and he having succeeded him in the kingship: “May Allah reward you for the calamity, bless you in the gift, and help you with the subjects. You have been afflicted with something tremendous, and given something immense; so thank Allah for what you have been given, and be patient over what you have been afflicted with. You have lost the caliph, and been given the caliphate; you have parted from a close friend, and been granted something majestic.”<br>“Be patient, Yazīd, for you have parted from one who was trustworthy; and give thanks for the gift of the One who chose you for the kingship.<br>No calamity has befallen any people that we know of like the one with which you have been afflicted, and no outcome like your outcome.”<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Iftinān<\/b>: joining two <b>different kinds<\/b> of speech, such as condolence and congratulation. Yazīd had lost his father and gained the caliphate at the same moment. Ibn Hammām's words weave the two together, phrase by phrase: \"May Allah reward you for the calamity, and bless you in the gift… you have lost the caliph, and been given the caliphate.\"<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 195<\/span><\/div><div class=\"ar\">(١٣) الجمع: هو أن يجمع بين متعدِّد في حكم واحد، كقوله:<span class=\"bayt\"><span class=\"h1\">إِنَّ الشَبَابَ وَالفَرَاغَ وَالْجَدَّةَ<\/span><span class=\"h2\">مُفْسِدَةٌ لِلْمَرْءِ أَيَّ مُفْسِدَةٍ<\/span><\/span><\/div><div class=\"tr\">(13) <i>Al-Jamʿ<\/i> (gathering): it is that several things are gathered under one ruling, as in his words:<br>“Youth, idleness and wealth are a corrupter for a man — what a corrupter!”<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Jamʿ<\/b> (gathering): putting several things under <b>one ruling<\/b>. Youth, idleness and wealth are all judged together as \"a corrupter\".<\/div><div class=\"cnote\"><span class=\"cnh\">COMPANION&#8217;S NOTE · NOT IN THE BOOK<\/span><p>The matn prints ‎<span class=\"arin\">وَالْجَدَّةَ<\/span>‎; since the sense is wealth, the likely reading is ‎<span class=\"arin\">وَالْجَدَّةَ<\/span>‎.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 195<\/span><\/div><div class=\"ar\">(١٤) التفريق: هو أن يفرّق بين شيئَين من نوع واحد، كقوله:<span class=\"bayt\"><span class=\"h1\">مَا نَوَالُ الغَمَامِ وَقْتَ رَبِيْعٍ<\/span><span class=\"h2\">كَنَوَالِ الأَمِيْرِ يَوْمَ سَخَاءٍ<\/span><\/span><span class=\"bayt\"><span class=\"h1\">فَنَوَالُ الأَمِيْرِ بَدْرَةُ عَيْنٍ<\/span><span class=\"h2\">وَنَوَالُ الغَمَامِ قَطْرَةُ مَاءٍ<\/span><\/span><\/div><div class=\"tr\">(14) <i>Al-Tafrīq<\/i> (separating): it is that a separation is made between two things of one kind, as in his words:<br>“The bounty of the clouds in springtime is not like the bounty of the emir on a day of largesse;<br>for the emir’s bounty is a purse of coin, and the clouds’ bounty a drop of water.”<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Tafrīq<\/b> (separating): <b>separating<\/b> two things of the same kind. The cloud's gift and the emir's gift are both gifts, but the poet separates them: the emir gives a bag of gold, the cloud only a drop of water.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 195<\/span><\/div><div class=\"ar\">(١٥) التقسيم: هو إمّا استيفاء أقسام الشيء، نحو قوله:<span class=\"bayt\"><span class=\"h1\">وَأَعْلَمُ عِلْمَ اليَوْمِ وَالأَمْسِ قَبْلَهُ<\/span><span class=\"h2\">وَلَكِنِّيْ عَنْ عِلْمِ مَا فِيْ غَدٍ عَمَى<\/span><\/span><\/div><div class=\"tr\">(15) <i>Al-Taqsīm<\/i> (division): it is either exhausting the divisions of a thing, as in his words:<br>“I know the knowledge of today, and of yesterday before it; but to the knowledge of what is in tomorrow I am blind.”<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Taqsīm<\/b> (division) has three forms. The first is <b>covering every division<\/b> of something. Time has three parts, and the line covers all three: today and yesterday, which he knows, and tomorrow, which he does not.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 196<\/span><\/div><div class=\"ar\">وإمّا ذكر متعدِّد وإرجاع ما لكلٍّ إليه على التعيين، كقوله:<span class=\"bayt\"><span class=\"h1\">وَلاَ يُقِيْمُ عَلَى ضَيْمٍ يُرَادُ بِهِ<\/span><span class=\"h2\">إلاَّ الأَذَلاَّنِ عَيْرُ الْحَيِّ وَالوَتَدُ<\/span><\/span><span class=\"bayt\"><span class=\"h1\">هَذَا عَلَى الْخَسَفِ مَرْبُوْطٌ بِرُمَّتِه<\/span><span class=\"h2\">وَذَا يُشَجُّ فَلاَ يَرْثِيْ لَهُ أَحَدٌ<\/span><\/span><\/div><div class=\"tr\">[This continues the definition of (15) <i>al-taqsīm<\/i> (division) begun on p. 195: “Division is either the exhausting of the divisions of a thing …”] — or it is mentioning several things and then referring back to each one, specifically, what belongs to it, as in the poet’s words:<br>“No one stays put under a wrong intended against him, except the two most abject: the donkey of the encampment and the tent-peg.<br>This one is tied up in humiliation, halter and all; and that one has its head split, and no one feels pity for it.”<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>The second form of <i>taqsīm<\/i>: naming <b>several things<\/b>, then giving each one <b>what belongs to it<\/b>, clearly matched. The two most humble things that put up with wrong are the camp's donkey and the tent-peg. Then: <b>this one<\/b> (the donkey) is tied up in disgrace; <b>that one<\/b> (the peg) is hammered on the head and no one pities it.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 196–197<\/span><\/div><div class=\"ar\">وإمّا ذكر أحوال الشيء مضافاً إلى كلٍّ منها ما يليق به، كقوله:<span class=\"bayt\"><span class=\"h1\">سَأَطْلُبُ حَقِّيْ بِالقَنَاءِ وَمَشَايِخَ<\/span><span class=\"h2\">كَأَنَّهُمْ مِنْ طُوْلِ مَا الْتَثَمُوْا مُرْدُ<\/span><\/span><span class=\"bayt\"><span class=\"h1\">ثِقَالٌ إِذَا لاَقُوا خِفَافٌ إِذَا دُعُوْا<\/span><span class=\"h2\">كثيرٌ إذا شَدُّوا قليلٌ إذا عُدُّوا<\/span><\/span><\/div><div class=\"tr\">Or it is mentioning the states of a thing, with what suits each of them attached to it, as in his words:<br>“I shall seek my right with spears and with veterans who, from wearing the face-veil so long, look beardless —<br>heavy when they meet [the enemy], light when they are called; many when they charge, few when they are counted.”<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>The third form: naming the <b>states<\/b> of something and giving each state what suits it. The warriors in four situations: <b>meeting<\/b> the enemy, they are heavy (they stand firm); <b>called<\/b> to help, they are light (quick to answer); <b>charging<\/b>, they are many (each fights like many); <b>counted<\/b>, they are few.<\/p><\/div><div class=\"chartbox\"><div class=\"chh\">THE THREE FORMS OF TAQSĪM · DRAWN BY THE COMPANION<\/div><table class=\"grid\"><thead><tr><th>Form<\/th><th>Book's example<\/th><\/tr><\/thead><tbody><tr><td>Covering every division of a thing<\/td><td>today, yesterday, tomorrow<\/td><\/tr><tr><td>Several things, each given what belongs to it<\/td><td>‎<span class=\"arin\">عَيْرُ الْحَيِّ وَالوَتَدُ<\/span>‎<\/td><\/tr><tr><td>The states of a thing, each given what suits it<\/td><td>‎<span class=\"arin\">ثِقَالٌ إِذَا لاَقُوا خِفَافٌ إِذَا دُعُوْا<\/span>‎<\/td><\/tr><\/tbody><\/table><\/div><div class=\"cnote\"><span class=\"cnh\">COMPANION&#8217;S NOTE · NOT IN THE BOOK<\/span><p>Printing note: the matn prints ‎<span class=\"arin\">بِالقَنَاءِ<\/span>‎ with a final hamza; it is reproduced as printed. The likely reading is ‎<span class=\"arin\">بِالقَنَا<\/span>‎, “with spears”.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 197–198<\/span><\/div><div class=\"ar\">(١٦) الطي والنشر: هو ذكر متعدّد على التفصيل أو الإجمال ثُمّ ذكر ما لكلّ واحد من المتعدّد من غير تعيين؛ اعتماداً على فهم السامع، كقوله تعالى:﴿جَعَلَ لَكُمُ اللَّيْلَ وَالنَّهَارَ لِتَسْكُنُوا فِيهِ وَلِتَبْتَغُوا مِن فَضْلِهِ﴾[القصص: ٧٣]. فالسكون راجع إلى الليل، والابتغاء راجع إلى النهار،<\/div><div class=\"tr\">(16) Folding and unfolding (<i>al-ṭayy wa-l-nashr<\/i>) is mentioning several things, in detail or in summary, and then mentioning what belongs to each one of them without specifying [which goes with which], relying on the listener’s understanding, as in His words, Exalted is He: ﴿He made for you the night and the day, that you may rest in it and that you may seek of His bounty﴾ [al-Qaṣaṣ 28:73]. Resting goes back to the night, and seeking goes back to the day;<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Al-ṭayy wa-l-nashr<\/b> (folding and unfolding): several things are mentioned (folded together), then what belongs to each (unfolded), <b>without saying which goes with which<\/b>. The listener matches them himself.<p>\"He made for you the night and the day, that you may rest in it and seek of His bounty\": <b>rest<\/b> goes with the night, <b>seeking<\/b> with the day. The verse does not say so; the listener knows.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 198<\/span><\/div><div class=\"ar\">وكقول الشاعر:<span class=\"bayt\"><span class=\"h1\">ثَلاَثَةٌ تُشْرِقُ الدُنْيَا بِبَهْجَتِهَا<\/span><span class=\"h2\">شمْسُ الضُحَى وَأَبُوْ إِسْحَاقَ وَالقَمَرُ<\/span><\/span><\/div><div class=\"tr\">and like the poet’s words:<br>“Three make the world shine with their splendour: the morning sun, Abū Isḥāq, and the moon.”<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>Here the order is mixed: \"Three light up the world: the morning sun, Abū Isḥāq, and the moon.\" The poet places his patron between the sun and the moon, folding him in with them as a third light.<\/p><\/div><div class=\"chartbox\"><div class=\"chh\">TAQSĪM AND AL-ṬAYY WA-L-NASHR · DRAWN BY THE COMPANION<\/div><table class=\"grid\"><thead><tr><th><\/th><th>Taqsīm (2nd form)<\/th><th>Al-ṭayy wa-l-nashr<\/th><\/tr><\/thead><tbody><tr><td>Is each item matched to its partner?<\/td><td>Yes, clearly (this one… that one…)<\/td><td>No; left to the listener<\/td><\/tr><tr><td>Book's example<\/td><td>‎<span class=\"arin\">هَذَا عَلَى الْخَسَفِ ... وَذَا يُشَجُّ<\/span>‎<\/td><td>‎<span class=\"arin\">لِتَسْكُنُوا فِيهِ وَلِتَبْتَغُوا مِن فَضْلِهِ<\/span>‎<\/td><\/tr><\/tbody><\/table><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 198–199<\/span><\/div><div class=\"ar\">(١٧) إرسال المثل والكلام الجامع: هو أن يؤتى بكلام صالح؛ لأنّ يتمثّل به في مواطنَ كثيرةٍ، والفرق بينهما أنّ الأوّل يكون بعضَ بيت، كقوله: ليس التكحّل في العينين كالكحل<\/div><div class=\"tr\">(17) Sending forth a proverb, and the comprehensive saying (<i>irsāl al-mathal wa-l-kalām al-jāmiʿ<\/i>): it is to bring speech fit to be cited as a proverb in many situations. The difference between the two is that the first is part of a line of verse, as in his words: “Putting kohl on the eyes is not like having naturally dark eyes.”<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Irsāl al-mathal<\/b> (sending forth a proverb) and <b>al-kalām al-jāmiʿ<\/b> (the comprehensive saying): words so well put that people <b>quote them<\/b> in many situations. The difference is size: a <i>mathal<\/i> is <b>part<\/b> of a line.<p>\"Putting on kohl is not like having naturally dark eyes\" is half a line, quoted whenever something artificial is compared with the real thing.<\/p><\/div><div class=\"cnote\"><span class=\"cnh\">COMPANION&#8217;S NOTE · NOT IN THE BOOK<\/span><p>Printing note: the matn prints ‎<span class=\"arin\">لأنّ يتمثّل به<\/span>‎ with a shadda on the nūn; it is reproduced as printed. The sense requires ‎<span class=\"arin\">لأنّ يتمثّل به<\/span>‎ (“to be cited”).<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 199<\/span><\/div><div class=\"ar\">والثاني: يكون بيتاً كاملاً، كقوله:<span class=\"bayt\"><span class=\"h1\">إِذَا جَاءَ مُوْسَى وَأَلْقَى العَصَا<\/span><span class=\"h2\">فَقَدْ بَطَلَ السَحَرُ وَالسَاحِرُ<\/span><\/span><\/div><div class=\"tr\">And the second is a complete line, as in his words:<br>“When Mūsā has come and thrown down the staff, then sorcery and the sorcerer have come to nothing.”<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>The <i>kalām jāmiʿ<\/i> is a <b>whole line<\/b>. \"When Mūsā comes and throws down his staff, sorcery and sorcerer are finished\" is quoted whenever the truth arrives and falsehood collapses before it.<\/p><\/div><div class=\"cnote\"><span class=\"cnh\">COMPANION&#8217;S NOTE · NOT IN THE BOOK<\/span><p>Printing note: the matn prints ‎<span class=\"arin\">السَحَرُ<\/span>‎ (with fatḥa on the sīn and the ḥāʾ); it is reproduced as printed. The sense (“sorcery”, beside “the sorcerer”) requires ‎<span class=\"arin\">السَحَرُ<\/span>‎.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 199<\/span><\/div><div class=\"ar\">(١٨) المبالغة: هي ادّعاء بلوغِ وصفٍ في الشدّة أو الضعف حدًّا يبعد أو يستحيل. وتنقسم إلى ثلاثة أقسام:<\/div><div class=\"tr\">(18) Hyperbole (<i>al-mubālaghah<\/i>) is claiming that a quality has reached, in strength or weakness, a limit that is far-fetched or impossible. It is divided into three divisions:<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Mubālaghah<\/b> (hyperbole): claiming that a quality has reached a degree, strong or weak, that is <b>far-fetched or impossible<\/b>. It has three levels, according to how possible the claim is.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 200<\/span><\/div><div class=\"ar\">(i) تبليغ، إن كان ذلك ممكناً عقلاً وعادة، كقوله في وصف فرس:<span class=\"bayt\"><span class=\"h1\">إِذَا مَا سَابَقَتْهَا الرِيْحُ فَرَّتْ<\/span><span class=\"h2\">وَأَلْقَتْ فِيْ يَدِ الرِيْحِ التُرَابَا<\/span><\/span><\/div><div class=\"tr\">(i) <i>Tablīgh<\/i> (plain hyperbole), if that [claim] is possible both rationally and customarily, as in his words describing a horse:<br>“Whenever the wind races her, she flies off, and throws dust into the wind’s hand.”<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Tablīgh<\/b>: possible both in reason and in ordinary life. A horse that outruns the wind and throws dust in its face is an exaggeration, but nothing about it is impossible.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 200<\/span><\/div><div class=\"ar\">(ii) وإغراق، إن كان ممكناً عقلاً لا عادة، كقوله:<span class=\"bayt\"><span class=\"h1\">وَنُكْرِمُ جَارَنَا مَا دَامَ فِيْنَا<\/span><span class=\"h2\">وَنَتْبَعُهُ الكَرَامَةَ حَيْثُ مَا لاَ<\/span><\/span><\/div><div class=\"tr\">(ii) <i>Ighrāq<\/i> (excessive hyperbole), if it is possible rationally but not customarily, as in his words:<br>“We honour our neighbour as long as he stays among us, and we send honour after him wherever he goes.”<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Ighrāq<\/b>: possible in reason, but <b>not in ordinary life<\/b>. Honouring your neighbour while he stays with you is normal; \"sending honour after him wherever he goes\" is conceivable, but people do not actually do it.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 200<\/span><\/div><div class=\"ar\">(iii) وغلوّ، إن استحال عقلاً وعادة، كقوله:<span class=\"bayt\"><span class=\"h1\">تَكَادُ قِسِيُّهُ مِنْ غَيْرِ رَامٍ<\/span><span class=\"h2\">تُمَكِّنُ فِيْ قُلُوْبِهِمُ النِبَالاَ<\/span><\/span><\/div><div class=\"tr\">(iii) <i>Ghuluww<\/i> (extravagant hyperbole), if it is impossible both rationally and customarily, as in his words:<br>“His bows almost, without any archer, lodge the arrows firmly in their hearts.”<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Ghuluww<\/b>: <b>impossible<\/b> both in reason and in ordinary life. Bows that shoot arrows into the enemy's hearts with no archer cannot happen. The word ‎<span class=\"arin\">تَكَادُ<\/span>‎ (\"almost\") softens it, which makes this kind of <i>ghuluww<\/i> acceptable.<\/div><div class=\"chartbox\"><div class=\"chh\">THE THREE LEVELS OF MUBĀLAGHAH · DRAWN BY THE COMPANION<\/div><table class=\"grid\"><thead><tr><th>Level<\/th><th>Possible in reason?<\/th><th>Possible in practice?<\/th><th>Book's example<\/th><\/tr><\/thead><tbody><tr><td>Tablīgh ‎<span class=\"arin\">تبليغ<\/span>‎<\/td><td>Yes<\/td><td>Yes<\/td><td>the horse and the wind<\/td><\/tr><tr><td>Ighrāq ‎<span class=\"arin\">إغراق<\/span>‎<\/td><td>Yes<\/td><td>No<\/td><td>honour sent after the neighbour<\/td><\/tr><tr><td>Ghuluww ‎<span class=\"arin\">غلوّ<\/span>‎<\/td><td>No<\/td><td>No<\/td><td>bows shooting with no archer<\/td><\/tr><\/tbody><\/table><\/div><div class=\"cnote\"><span class=\"cnh\">COMPANION&#8217;S NOTE · NOT IN THE BOOK<\/span><p>Printing note: in the (ii) verse above the matn prints the rhyme-word as two words, ‎<span class=\"arin\">مَا لاَ<\/span>‎; it is reproduced as printed. The likely reading is one word, ‎<span class=\"arin\">مالا<\/span>‎, taken as the verb “he moved on (away from us)”, which is how it is translated above.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 201<\/span><\/div><div class=\"ar\">(١٩) المغايَرة: هو مدح الشيء بعد ذمّه أو عكسه، كقوله في مدح الدينار:<div style=\"text-align:center\">أَكْرِمْ بِهِ أَصْفَرَ رَاقَتْ صُفْرَتُهُ<\/div>بعد ذمّه في قوله:<div style=\"text-align:center\">تَبًّا لَهُ مِنْ خَادِعٍ مُمَاذِقٍ<\/div><\/div><div class=\"tr\">(19) Reversal (<i>al-mughāyarah<\/i>) is praising a thing after censuring it, or the reverse, as in his words in praise of the dīnār:<br>“How noble it is — a yellow one whose yellowness delights!”<br>after censuring it in his words:<br>“Ruin to it — a deceiver, a double-dealer!”<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Mughāyarah<\/b>: praising something after blaming it, or the reverse, showing skill by arguing both sides. The poet praised the gold dinar (\"how noble, this yellow one!\") after cursing it (\"ruin to it, a deceiver!\").<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 201<\/span><\/div><div class=\"ar\">(٢٠) تأكيد المدح بما يشبه الذمّ ضربان: أحدهما: أن يُستثنَى من صفةِ ذمٍّ منفيّةٍ صفةُ مدح على تقدير دخولِها فيها، كقوله:<span class=\"bayt\"><span class=\"h1\">وَلاَ عَيْبَ فِيْهِمْ غَيْرَ أَنَّ سُيُوْفَهُمْ<\/span><span class=\"h2\">بِهِنَّ فُلُوْلٌ مِنْ قِرَاعِ الْكَتَائِبِ<\/span><\/span><\/div><div class=\"tr\">(20) Confirming praise by what resembles censure (<i>taʾkīd al-madḥ bi-mā yushbih al-dhamm<\/i>) is of two kinds. The first of them: that a quality of praise be excepted from a negated quality of censure, on the supposition that it falls within it, as in his words:<br>“There is no fault in them, except that their swords have notches from clashing with the battalions.”<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Confirming praise with what looks like blame.<\/b> The first form: deny every fault, then say \"except…\" as if a fault is coming, and give a praise instead. \"No fault in them, except that their swords are notched from fighting.\" Notched swords are a sign of courage. If <i>that<\/i> is the only \"fault\", they have no faults at all, so the praise is confirmed.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 202<\/span><\/div><div class=\"ar\">وثانيهما: أن يُثبَت لشيء صفةُ مدح ويؤتى بعدها بأداة استثناء تليها صفةُ مدح أخرى، كقوله:<span class=\"bayt\"><span class=\"h1\">فَتًى كَمُلَتْ أَوْصَافُهُ غَيْرَ أَنَّهُ<\/span><span class=\"h2\">جَوَادٌ فَمَا يُبْقِيْ عَلَى الْمَالِ بَاقِيَا<\/span><\/span><\/div><div class=\"tr\">And the second of them: that a quality of praise be affirmed of a thing, and after it an exceptive particle be brought, followed by another quality of praise, as in his words:<br>“A young man whose qualities are perfect — except that he is generous, so he leaves nothing of his wealth remaining.”<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>The second form: give a praise, then \"except\", then <b>another praise<\/b>. \"His qualities are perfect, except that he is so generous he leaves no money.\" The listener expects a fault and gets more praise.<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 203<\/span><\/div><div class=\"ar\">(٢١) تأكيد الذمّ بما يشبه المدح ضربان أيضاً: الأوّل: أن يستثنَى من صفةِ مدحٍ منفيّةٍ صفةُ ذمٍّ على تقدير دخولِها فيها، نحو: «فلان لا خير فيه إلاَّ أنّه يتصدّق بما يسرق». والثاني: أن يثبت لشيء صفة ذمٍّ ويؤتى بعدها بأداة استثناء تليها صفةُ ذمٍّ أخرى، كقوله:<span class=\"bayt\"><span class=\"h1\">هُوَ الْكَلْبُ إلاَّ أنَّ فِيْهِ مَلاَلَةً<\/span><span class=\"h2\">وَسُوْءَ مُرَاعَاةٍ وَمَا ذَاكَ فِي الكَلْبِ<\/span><\/span><\/div><div class=\"tr\">(21) Confirming censure by what resembles praise (<i>taʾkīd al-dhamm bi-mā yushbih al-madḥ<\/i>) is also of two kinds. The first: that a quality of censure be excepted from a negated quality of praise, on the supposition that it falls within it, as in: “So-and-so has no good in him, except that he gives in charity what he steals.” The second: that a quality of censure be affirmed of a thing, and after it an exceptive particle be brought, followed by another quality of censure, as in his words:<br>“He is the dog — except that in him there is weariness [of his friends] and poor regard for them, and that is not in the dog.”<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Confirming blame with what looks like praise<\/b> is the mirror image. First form: deny every good, then \"except\" as if a good is coming, and give a fault: \"There is no good in him, except that he gives in charity what he steals.\" Second form: a blame, then \"except\", then more blame: \"He is a dog, except that he tires of his friends and treats them badly, which a dog does not do\". So he is worse than a dog.<\/div><div class=\"chartbox\"><div class=\"chh\">PRAISE AND BLAME IN DISGUISE · DRAWN BY THE COMPANION<\/div><table class=\"grid\"><thead><tr><th><\/th><th>First form<\/th><th>Second form<\/th><\/tr><\/thead><tbody><tr><td>Praise like blame<\/td><td>deny all faults, then \"except\" + a praise: ‎<span class=\"arin\">وَلاَ عَيْبَ فِيْهِمْ غَيْرَ أَنَّ سُيُوْفَهُمْ<\/span>‎<\/td><td>a praise, then \"except\" + another praise: ‎<span class=\"arin\">غَيْرَ أَنَّهُ جَوَادٌ<\/span>‎<\/td><\/tr><tr><td>Blame like praise<\/td><td>deny all good, then \"except\" + a blame: ‎<span class=\"arin\">لا خير فيه إلاَّ أنّه يتصدّق بما يسرق<\/span>‎<\/td><td>a blame, then \"except\" + another blame: ‎<span class=\"arin\">هُوَ الْكَلْبُ إلاَّ<\/span>‎<\/td><\/tr><\/tbody><\/table><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 203–205<\/span><\/div><div class=\"ar\">(٢٢) التجريد: هو أن ينتزع من أمر ذي صفة أمرٌ آخر مثله فيها مبالغةً؛ لكمالِها فيه، ويكون بـ«من»، نحو: «لي من فلان صديق حميم»، أو «في»، كما في قوله تعالى: ﴿لَهُمْ فِيهَا دَارُ الْخُلْدِ﴾ [فصلت: ٢٨]. أو «الباء»، نحو: «لئن سألت فلاناً، لتسئلنّ به البحر» .......أو بـ«مخاطَبة الإنسان نفسه»، كقوله:<span class=\"bayt\"><span class=\"h1\">لاَ خَيْلَ عِنْدَكَ تَهْدِيْهَا وَلاَ مَالَ<\/span><span class=\"h2\">فَلْيُسْعِدِ النُطْقُ إِنْ لَمْ تُسْعِدِ الْحَالُ<\/span><\/span><\/div><div class=\"tr\">(22) Abstraction (<i>al-tajrīd<\/i>) is to draw out, from a thing possessing a quality, another thing like it in that quality, by way of hyperbole, because of the quality’s perfection in it. It is done with “<i>min<\/i>” (from), as in: “I have, from so-and-so, a close friend”; or with “<i>fī<\/i>” (in), as in His words, Exalted is He: ﴿For them therein is the abode of eternity﴾ [Fuṣṣilat 41:28]; or with “the <i>bāʾ<\/i>”, as in: “If you ask so-and-so, you will be asking, in him, the sea” …… or by “a person addressing himself”, as in his words:<br>“You have no horses to give as a gift, and no wealth; so let speech help, if circumstance does not.”<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Tajrīd<\/b> (abstraction): a quality is so complete in someone that you speak as if <b>another person<\/b> with that quality could be drawn out of him. \"I have, <b>from<\/b> so-and-so, a close friend\": he is so truly a friend that a whole friend can be drawn out of him.<p>With ‎<span class=\"arin\">في<\/span>‎: in Hell \"for them <b>therein<\/b> is the abode of eternity\", as if another abode could be drawn out of Hell itself. With ‎<span class=\"arin\">الباء<\/span>‎: \"ask him, and you are asking <b>in him<\/b> the sea\" (his generosity is a sea). And by <b>talking to oneself<\/b>: the poet, who has no horses or wealth to give, addresses himself as another person: \"you have no horses… so let your speech help.\"<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 205<\/span><\/div><div class=\"ar\">أو بغير ذلك، كقوله:<span class=\"bayt\"><span class=\"h1\">فَلَئِنْ بَقِيْتُ لأَرْحَلَنَّ لِغَزْوَةٍ<\/span><span class=\"h2\">تَحْوِي الغَنَائِمَ أَوْ يَمُوتَ كَرِيْمٌ<\/span><\/span><\/div><div class=\"tr\">Or by something else, as in his words:<br>“If I remain [alive], I shall surely set out on a raid that gathers the spoils — or else a noble man dies.”<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Or in other ways.<\/b> The poet vows to go on a raid that gathers spoils, \"or else a noble man dies\". By \"a noble man\" he means himself, as if drawing out of himself another noble person who would die.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 206<\/span><\/div><div class=\"ar\">(٢٣) حسن التعليل: هو أن يُدّعَى لوصفٍ علةٌ غيرُ حقيقيّة فيها غرابةٌ، كقوله:<span class=\"bayt\"><span class=\"h1\">لَوْلَمْ تَكُنْ نِيَّةُ الْجَوْزَاءِ خِدْمَتَهُ<\/span><span class=\"h2\">لَمَا رَأَيْتَ عَلَيْهَا عَقْدَ مُنْتَطِقِ<\/span><\/span><\/div><div class=\"tr\">(23) Fine assigning of cause (<i>ḥusn al-taʿlīl<\/i>) is to claim for a quality a cause that is not real, in which there is something strange, as in his words:<br>“Had it not been Gemini’s intention to serve him, you would not see on her the knot of one girded with a belt.”<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Ḥusn al-taʿlīl<\/b> (a fine reason): giving a <b>made-up, clever reason<\/b> for something. The stars of Gemini form a shape like a belt. The poet claims the reason is that Gemini wanted to <b>serve<\/b> his patron, and so wrapped a belt around her waist as servants do. That is not the real reason, but it is a beautiful one.<\/div><div class=\"cnote\"><span class=\"cnh\">COMPANION&#8217;S NOTE · NOT IN THE BOOK<\/span><p>Printing note: the matn prints ‎<span class=\"arin\">لَوْلَمْ<\/span>‎ as one word; it is reproduced as printed (i.e. ‎<span class=\"arin\">لو لَم<\/span>‎).<\/p><\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 206–207<\/span><\/div><div class=\"ar\">(٢٤) ائتلاف اللفظ مع المعنى: هو أن تكون الألفاظ موافِقة للمعاني، فتُختار الألفاظ الجزَلة والعبارات الشديدة للفخر والْحَماسة، والكلماتُ الرقيقة والعبارات الليّنة للغزل ونحوه، كقوله:<span class=\"bayt\"><span class=\"h1\">إِذَا مَا غَضِبْنَا غَضْبَةَ مُضَرِيَّةٍ<\/span><span class=\"h2\">هَتَكْنَا حِجَابَ الشَمْسِ أَوْ قَطَرَتْ دَماً<\/span><\/span><span class=\"bayt\"><span class=\"h1\">إِذَا مَا أَعَرْنَا سَيِّداً مِنْ قَبِيْلَةٍ<\/span><span class=\"h2\">ذَرْوَى مِنْبَرٍ صَلَّى عَلَيْنَا وَسَلَّمَا<\/span><\/span>وقوله:<span class=\"bayt\"><span class=\"h1\">لَمْ يَطُلْ لَيْلِيْ وَلَكِنْ لَمْ أَنَمْ<\/span><span class=\"h2\">وَنَفَى عَنِّي الكَرَى طَيْفُ أَلَمٍ<\/span><\/span><\/div><div class=\"tr\">(24) Harmony of wording with meaning (<i>iʾtilāf al-lafẓ maʿa al-maʿnā<\/i>) is that the words agree with the meanings: so weighty words and forceful expressions are chosen for boasting and valour, and delicate words and gentle expressions for love-poetry and the like; as in his words:<br>“Whenever we grow angry with a Muḍarī anger, we tear down the veil of the sun, or it drips blood.<br>Whenever we lend a chief from a tribe the summit of a pulpit, he invokes blessings and peace upon us.”<br>And his words:<br>“My night was not long, but I did not sleep; and a visiting phantom drove slumber away from me.”<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Iʾtilāf al-lafẓ maʿa al-maʿnā<\/b>: the <b>sound of the words fits the meaning<\/b>. For boasting and war, strong, heavy words; for love poetry, soft and gentle ones.<p>The first lines, about tribal anger tearing the veil from the sun and making it drip blood, use forceful words. The last line, about a sleepless night and a visiting phantom of the beloved, uses light, soft words. Read them aloud and you will hear the difference.<\/p><\/div><div class=\"chartbox\"><div class=\"chh\">THE EMBELLISHMENTS OF MEANING · DRAWN BY THE COMPANION<\/div><table class=\"grid\"><thead><tr><th><\/th><th>Name<\/th><th>In short<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>Tawriyah ‎<span class=\"arin\">التورية<\/span>‎<\/td><td>a near meaning shown, a far one meant<\/td><\/tr><tr><td>2<\/td><td>Ibhām ‎<span class=\"arin\">الإبهام<\/span>‎<\/td><td>two opposite meanings, both possible<\/td><\/tr><tr><td>3<\/td><td>Tawjīh ‎<span class=\"arin\">التوجيه<\/span>‎<\/td><td>words that are also names<\/td><\/tr><tr><td>4–6<\/td><td>Ṭibāq, muqābalah, tadbīj<\/td><td>opposites; in order; in colours<\/td><\/tr><tr><td>7–8<\/td><td>Idmāj, istitbāʿ<\/td><td>a second meaning slipped in; praise bringing more praise<\/td><\/tr><tr><td>9<\/td><td>Murāʿāt al-naẓīr<\/td><td>matching things together<\/td><\/tr><tr><td>10<\/td><td>Istikhdām ‎<span class=\"arin\">الاستخدام<\/span>‎<\/td><td>a pronoun in a different meaning<\/td><\/tr><tr><td>11<\/td><td>Istiṭrād ‎<span class=\"arin\">الاستطراد<\/span>‎<\/td><td>digression and return<\/td><\/tr><tr><td>12<\/td><td>Iftinān ‎<span class=\"arin\">الافتنان<\/span>‎<\/td><td>two kinds of speech joined<\/td><\/tr><tr><td>13–15<\/td><td>Jamʿ, tafrīq, taqsīm<\/td><td>gathering, separating, dividing<\/td><\/tr><tr><td>16<\/td><td>Al-ṭayy wa-l-nashr<\/td><td>matched by the listener<\/td><\/tr><tr><td>17<\/td><td>Irsāl al-mathal, al-kalām al-jāmiʿ<\/td><td>quotable sayings<\/td><\/tr><tr><td>18<\/td><td>Mubālaghah ‎<span class=\"arin\">المبالغة<\/span>‎<\/td><td>tablīgh, ighrāq, ghuluww<\/td><\/tr><tr><td>19<\/td><td>Mughāyarah ‎<span class=\"arin\">المغايَرة<\/span>‎<\/td><td>praise after blame or the reverse<\/td><\/tr><tr><td>20–21<\/td><td>Praise like blame; blame like praise<\/td><td>with \"except\"<\/td><\/tr><tr><td>22<\/td><td>Tajrīd ‎<span class=\"arin\">التجريد<\/span>‎<\/td><td>drawing another out of someone<\/td><\/tr><tr><td>23<\/td><td>Ḥusn al-taʿlīl ‎<span class=\"arin\">حسن التعليل<\/span>‎<\/td><td>a clever, made-up reason<\/td><\/tr><tr><td>24<\/td><td>Iʾtilāf al-lafẓ maʿa al-maʿnā<\/td><td>sound fits sense<\/td><\/tr><\/tbody><\/table><\/div><div class=\"cnote\"><span class=\"cnh\">COMPANION&#8217;S NOTE · NOT IN THE BOOK<\/span><p>Printing notes on (24): the matn prints ‎<span class=\"arin\">الجزَلة<\/span>‎ (fatḥa on the zāy); the usual form is ‎<span class=\"arin\">الجزَلة<\/span>‎. It prints ‎<span class=\"arin\">ذَرْوَى مِنْبَرٍ<\/span>‎; the likely reading is ‎<span class=\"arin\">ذُرَى منبرٍ<\/span>‎ (“the summits of a pulpit”), and the translation above follows that sense. All are reproduced as printed.<\/p><\/div><div class=\"box\"><div class=\"bh\">KEY TERMS AND THEIR MEANINGS · ADDED BY THE COMPANION<\/div><table class=\"terms\"><tr><td class=\"t\">Muḥassināt maʿnawiyyah<\/td><td>Embellishments of meaning: ways of beautifying that go back to the meaning<\/td><td class=\"a\">المحسّنات المعنويّة<\/td><\/tr><tr><td class=\"t\">Tawriyah<\/td><td>Double entendre: a word with a near and a far meaning, the far one intended through a hidden indicator<\/td><td class=\"a\">التورية<\/td><\/tr><tr><td class=\"t\">Ibhām<\/td><td>Ambiguity: bringing speech that can bear two opposite senses<\/td><td class=\"a\">الإبهام<\/td><\/tr><tr><td class=\"t\">Tawjīh<\/td><td>Allusion: conveying a meaning by words that are also names of people or other things<\/td><td class=\"a\">التوجيه<\/td><\/tr><tr><td class=\"t\">Ṭibāq<\/td><td>Antithesis: combining two opposed meanings<\/td><td class=\"a\">الطباق<\/td><\/tr><tr><td class=\"t\">Muqābalah<\/td><td>Parallel antithesis: bringing two or more meanings, then their counterparts in order<\/td><td class=\"a\">المقابلة<\/td><\/tr><tr><td class=\"t\">Tadbīj<\/td><td>Antithesis between words for colours<\/td><td class=\"a\">التدبيج<\/td><\/tr><tr><td class=\"t\">Idmāj<\/td><td>Embedding: placing in speech meant for one meaning another meaning<\/td><td class=\"a\">الإدماج<\/td><\/tr><tr><td class=\"t\">Istitbāʿ<\/td><td>Praise of a thing in a way that brings along praise of something else<\/td><td class=\"a\">الاستتباع<\/td><\/tr><tr><td class=\"t\">Murāʿāt al-naẓīr<\/td><td>Congruence: bringing together a thing and what suits it, not by opposition<\/td><td class=\"a\">مراعاة النظير<\/td><\/tr><tr><td class=\"t\">Istikhdām<\/td><td>Using a word in one sense and its pronoun in another<\/td><td class=\"a\">الاستخدام<\/td><\/tr><tr><td class=\"t\">Istiṭrād<\/td><td>Digression to another purpose for a reason, then returning to the first<\/td><td class=\"a\">الاستطراد<\/td><\/tr><tr><td class=\"t\">Iftinān<\/td><td>Combining two different arts, e.g. condolence and congratulation<\/td><td class=\"a\">الافتنان<\/td><\/tr><tr><td class=\"t\">Jamʿ<\/td><td>Gathering several things under one ruling<\/td><td class=\"a\">الجمع<\/td><\/tr><tr><td class=\"t\">Tafrīq<\/td><td>Separating two things of one kind<\/td><td class=\"a\">التفريق<\/td><\/tr><tr><td class=\"t\">Taqsīm<\/td><td>Division: exhausting the divisions of a thing, or referring to each of several things what belongs to it, or attaching to each of a thing’s states what suits it<\/td><td class=\"a\">التقسيم<\/td><\/tr><tr><td class=\"t\">Al-ṭayy wa-l-nashr<\/td><td>Folding and unfolding: several things mentioned, then what belongs to each, without specifying, relying on the listener<\/td><td class=\"a\">الطي والنشر<\/td><\/tr><tr><td class=\"t\">Irsāl al-mathal<\/td><td>Sending forth a proverb: a citable saying forming part of a line<\/td><td class=\"a\">إرسال المثل<\/td><\/tr><tr><td class=\"t\">Al-kalām al-jāmiʿ<\/td><td>The comprehensive saying: a citable saying forming a complete line<\/td><td class=\"a\">الكلام الجامع<\/td><\/tr><tr><td class=\"t\">Mubālaghah<\/td><td>Hyperbole: claiming a quality has reached a far-fetched or impossible limit<\/td><td class=\"a\">المبالغة<\/td><\/tr><tr><td class=\"t\">Tablīgh<\/td><td>Hyperbole possible both rationally and customarily<\/td><td class=\"a\">تبليغ<\/td><\/tr><tr><td class=\"t\">Ighrāq<\/td><td>Hyperbole possible rationally but not customarily<\/td><td class=\"a\">إغراق<\/td><\/tr><tr><td class=\"t\">Ghuluww<\/td><td>Hyperbole impossible both rationally and customarily<\/td><td class=\"a\">غلوّ<\/td><\/tr><tr><td class=\"t\">Mughāyarah<\/td><td>Praising a thing after censuring it, or the reverse<\/td><td class=\"a\">المغايرة<\/td><\/tr><tr><td class=\"t\">Taʾkīd al-madḥ bi-mā yushbih al-dhamm<\/td><td>Confirming praise by what resembles censure<\/td><td class=\"a\">تأكيد المدح بما يشبه الذمّ<\/td><\/tr><tr><td class=\"t\">Taʾkīd al-dhamm bi-mā yushbih al-madḥ<\/td><td>Confirming censure by what resembles praise<\/td><td class=\"a\">تأكيد الذمّ بما يشبه المدح<\/td><\/tr><tr><td class=\"t\">Tajrīd<\/td><td>Abstraction: drawing out from a thing another like it in a quality, for hyperbole<\/td><td class=\"a\">التجريد<\/td><\/tr><tr><td class=\"t\">Ḥusn al-taʿlīl<\/td><td>Fine assigning of cause: claiming an unreal, strange cause for a quality<\/td><td class=\"a\">حسن التعليل<\/td><\/tr><tr><td class=\"t\">Iʾtilāf al-lafẓ maʿa al-maʿnā<\/td><td>Harmony of wording with meaning<\/td><td class=\"a\">ائتلاف اللفظ مع المعنى<\/td><\/tr><\/table><\/div><h3>QUESTIONS AND ANSWERS<span class=\"ar\">أسئلة وأجوبة<\/span><\/h3><div class=\"qabox\"><div class=\"qh\">QUESTIONS AND ANSWERS · ADDED BY THE COMPANION<\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>What is <i>ʿilm al-badīʿ<\/i>, and what are its two kinds of embellishment?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>The science by which one knows the ways of beautifying speech that already fits its situation. Embellishments of meaning and embellishments of wording.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>Define <i>tawriyah<\/i> and explain it in ‎<span class=\"arin\">وَيَعْلَمُ مَا جَرَحْتُم بِالنَّهَارِ<\/span>‎.<\/div><div class=\"a\"><span class=\"k\">A.<\/span>A word with a near and a far meaning, the far one intended through a subtle clue. ‎<span class=\"arin\">جَرَحْتُم<\/span>‎ suggests \"wounded\" but means \"committed sins\".<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>How does <i>ibhām<\/i> differ from <i>tawriyah<\/i>?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>In <i>ibhām<\/i> the words bear two opposite meanings equally; in <i>tawriyah<\/i> one meaning is near and the far one is the intended one.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>Distinguish <i>ṭibāq<\/i>, <i>muqābalah<\/i> and <i>tadbīj<\/i>.<\/div><div class=\"a\"><span class=\"k\">A.<\/span><i>Ṭibāq<\/i> joins two opposites; <i>muqābalah<\/i> brings two or more meanings then their opposites in order; <i>tadbīj<\/i> is a contrast of colours.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>What is <i>istikhdām<\/i>? Explain ‎<span class=\"arin\">فَمَن شَهِدَ مِنكُمُ الشَّهْرَ فَلْيَصُمْهُ<\/span>‎.<\/div><div class=\"a\"><span class=\"k\">A.<\/span>Using a word in one meaning and its pronoun in another. \"The month\" means the new moon; its pronoun means the period of time.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>What is <i>istiṭrād<\/i>? How does al-Samawʾal use it?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>Leaving the subject for another, for some link, then returning. He moves from boasting to mocking ʿĀmir and Salūl, then back.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>Give the three forms of <i>taqsīm<\/i>.<\/div><div class=\"a\"><span class=\"k\">A.<\/span>Covering all the divisions of a thing; naming several things then giving each what belongs to it; naming the states of a thing with what suits each.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>What is the difference between the second form of <i>taqsīm<\/i> and <i>al-ṭayy wa-l-nashr<\/i>?<\/div><div class=\"a\"><span class=\"k\">A.<\/span>In <i>taqsīm<\/i> each item is clearly matched to its partner; in <i>al-ṭayy wa-l-nashr<\/i> the matching is left to the listener.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>Name the three levels of <i>mubālaghah<\/i> with what distinguishes each.<\/div><div class=\"a\"><span class=\"k\">A.<\/span><i>Tablīgh<\/i>: possible in reason and practice; <i>ighrāq<\/i>: possible in reason, not in practice; <i>ghuluww<\/i>: impossible in both.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>Explain how ‎<span class=\"arin\">وَلاَ عَيْبَ فِيْهِمْ غَيْرَ أَنَّ سُيُوْفَهُمْ بِهِنَّ فُلُوْلٌ<\/span>‎ confirms praise.<\/div><div class=\"a\"><span class=\"k\">A.<\/span>All faults are denied, then \"except\" leads the listener to expect a fault, but what follows is praise (notched swords show courage). If that is their only \"fault\", they have none.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>What is <i>tajrīd<\/i>? Give two of the ways it is made.<\/div><div class=\"a\"><span class=\"k\">A.<\/span>Drawing another like a person out of him in a quality, for hyperbole; with ‎<span class=\"arin\">من<\/span>‎ (\"I have from so-and-so a close friend\"), or by a person addressing himself.<\/div><\/div><div class=\"qa\"><div class=\"q\"><span class=\"k\">Q.<\/span>What is <i>ḥusn al-taʿlīl<\/i>? Explain the book's example.<\/div><div class=\"a\"><span class=\"k\">A.<\/span>Giving a made-up, clever reason for something. The belt-like shape of Gemini is claimed to be because it wished to serve the patron.<\/div><\/div><\/div>", "terms": [{"t": "Muḥassināt maʿnawiyyah", "m": "Embellishments of meaning: ways of beautifying that go back to the meaning", "a": "المحسّنات المعنويّة"}, {"t": "Tawriyah", "m": "Double entendre: a word with a near and a far meaning, the far one intended through a hidden indicator", "a": "التورية"}, {"t": "Ibhām", "m": "Ambiguity: bringing speech that can bear two opposite senses", "a": "الإبهام"}, {"t": "Tawjīh", "m": "Allusion: conveying a meaning by words that are also names of people or other things", "a": "التوجيه"}, {"t": "Ṭibāq", "m": "Antithesis: combining two opposed meanings", "a": "الطباق"}, {"t": "Muqābalah", "m": "Parallel antithesis: bringing two or more meanings, then their counterparts in order", "a": "المقابلة"}, {"t": "Tadbīj", "m": "Antithesis between words for colours", "a": "التدبيج"}, {"t": "Idmāj", "m": "Embedding: placing in speech meant for one meaning another meaning", "a": "الإدماج"}, {"t": "Istitbāʿ", "m": "Praise of a thing in a way that brings along praise of something else", "a": "الاستتباع"}, {"t": "Murāʿāt al-naẓīr", "m": "Congruence: bringing together a thing and what suits it, not by opposition", "a": "مراعاة النظير"}, {"t": "Istikhdām", "m": "Using a word in one sense and its pronoun in another", "a": "الاستخدام"}, {"t": "Istiṭrād", "m": "Digression to another purpose for a reason, then returning to the first", "a": "الاستطراد"}, {"t": "Iftinān", "m": "Combining two different arts, e.g. condolence and congratulation", "a": "الافتنان"}, {"t": "Jamʿ", "m": "Gathering several things under one ruling", "a": "الجمع"}, {"t": "Tafrīq", "m": "Separating two things of one kind", "a": "التفريق"}, {"t": "Taqsīm", "m": "Division: exhausting the divisions of a thing, or referring to each of several things what belongs to it, or attaching to each of a thing’s states what suits it", "a": "التقسيم"}, {"t": "Al-ṭayy wa-l-nashr", "m": "Folding and unfolding: several things mentioned, then what belongs to each, without specifying, relying on the listener", "a": "الطي والنشر"}, {"t": "Irsāl al-mathal", "m": "Sending forth a proverb: a citable saying forming part of a line", "a": "إرسال المثل"}, {"t": "Al-kalām al-jāmiʿ", "m": "The comprehensive saying: a citable saying forming a complete line", "a": "الكلام الجامع"}, {"t": "Mubālaghah", "m": "Hyperbole: claiming a quality has reached a far-fetched or impossible limit", "a": "المبالغة"}, {"t": "Tablīgh", "m": "Hyperbole possible both rationally and customarily", "a": "تبليغ"}, {"t": "Ighrāq", "m": "Hyperbole possible rationally but not customarily", "a": "إغراق"}, {"t": "Ghuluww", "m": "Hyperbole impossible both rationally and customarily", "a": "غلوّ"}, {"t": "Mughāyarah", "m": "Praising a thing after censuring it, or the reverse", "a": "المغايرة"}, {"t": "Taʾkīd al-madḥ bi-mā yushbih al-dhamm", "m": "Confirming praise by what resembles censure", "a": "تأكيد المدح بما يشبه الذمّ"}, {"t": "Taʾkīd al-dhamm bi-mā yushbih al-madḥ", "m": "Confirming censure by what resembles praise", "a": "تأكيد الذمّ بما يشبه المدح"}, {"t": "Tajrīd", "m": "Abstraction: drawing out from a thing another like it in a quality, for hyperbole", "a": "التجريد"}, {"t": "Ḥusn al-taʿlīl", "m": "Fine assigning of cause: claiming an unreal, strange cause for a quality", "a": "حسن التعليل"}, {"t": "Iʾtilāf al-lafẓ maʿa al-maʿnā", "m": "Harmony of wording with meaning", "a": "ائتلاف اللفظ مع المعنى"}], "part": [3, "ʿIlm al-Badīʿ", "علم البديع"]}, {"num": 16, "title": "Embellishments of Wording", "ar": "محسّنات لفظيّة", "body": "<h3>EMBELLISHMENTS OF WORDING<span class=\"ar\">محسّنات لفظيّة<\/span><\/h3><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 208<\/span><\/div><div class=\"ar\">(١) تشابه الأطراف: هو جعل آخر جملة صدرَ تاليتها، أو آخر بيت صدرَ ما يليه، كقوله: ﴿فِيهَا مِصْبَاحٌ الْمِصْبَاحُ فِي زُجَاجَةٍ الزُّجَاجَةُ كَأَنَّهَا كَوْكَبٌ دُرِّيٌّ﴾ [النور: ٣٥]. وكقول الشاعر:<span class=\"bayt\"><span class=\"h1\">إِذَا نَزَلَ الْحَجَّاجُ أَرْضاً مَرِيْضَةً<\/span><span class=\"h2\">تَتْبَعُ أَقْصَى دَائِهَا فَشَفَاهَا<\/span><\/span><span class=\"bayt\"><span class=\"h1\">شَفَاهَا مِنَ الدَاءِ العُضَالِ الَّذِيْ بِهَا<\/span><span class=\"h2\">غُلاَمٌ إِذَا هَزَّ القَنَاةَ سَقَاهَا<\/span><\/span><\/div><div class=\"tr\">(1) <i>Tashābuh al-aṭrāf<\/i> (likeness of the ends): it is making the end of a sentence the beginning of the sentence that follows it, or the end of a line of verse the beginning of the one that comes after it, as in His words: ﴿In it is a lamp; the lamp is in a glass; the glass is as though it were a shining star﴾ [al-Nūr 24:35]; and as in the poet’s words:<br>When al-Ḥajjāj alights in a sick land, he traces the furthest reach of its disease and cures it —<br>cures it of the stubborn disease that is in it, a young man who, when he brandishes the spear, gives it to drink.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><p>Now the embellishments of <b>wording<\/b>: beauty that lives in the sounds and shapes of the words themselves. Change the words and the beauty is gone.<\/p><b>Tashābuh al-aṭrāf<\/b> (linked ends): the last word of one sentence (or line) becomes the first word of the next, like links in a chain. In the verse of Light: <b>lamp<\/b> → the <b>lamp<\/b> is in a <b>glass<\/b> → the <b>glass<\/b> is like a star. In the poem: the line ends \"and he <b>cured it<\/b>\", and the next line begins \"<b>cured it<\/b> of the stubborn disease\".<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 208–209<\/span><\/div><div class=\"ar\">(٢) الجناس: هو تشابه اللفظَين في النطق لا في المعنى، ويكون تامًّا وغير تامّ، فالتامّ ما اتّفقت حروفه في الهيئة والنوع والعدد والترتيب، وهو متماثل إن كان بين لفظين من نوع واحد، نحو:<span class=\"bayt\"><span class=\"h1\">لَمْ نَلْقَ غَيْرَكَ إِنْسَاناً يُلاَذُ بِهِ<\/span><span class=\"h2\">فَلاَ بَرِحْتَ لِعَيْنِ الدَهْرِ إِنْسَاناً<\/span><\/span><\/div><div class=\"tr\">(2) <i>Al-jinās<\/i> (paronomasia): it is the likeness of two words in pronunciation, not in meaning. It is either complete or incomplete. The complete is that whose letters agree in form, kind, number and order. It is <i>mutamāthil<\/i> (homogeneous) if it is between two words of one kind, as in:<br>We have found no human being (<i>insān<\/i>) but you to take refuge in — so may you never cease to be the pupil (<i>insān<\/i>) of the eye of time.<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Jinās<\/b> (wordplay): two words that <b>sound alike<\/b> but <b>mean different things<\/b>. It is <b>complete<\/b> (<i>tāmm<\/i>) when the letters match in four ways: their vowels, the letters themselves, how many there are, and their order. Complete <i>jinās<\/i> has four kinds.<b>Mutamāthil<\/b>: both words are of the same kind (here both nouns). ‎<span class=\"arin\">إِنْسَاناً<\/span>‎ first means a <b>human being<\/b>, then the <b>pupil<\/b> of the eye: may you always be the pupil in the eye of time, the thing it sees by.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 210<\/span><\/div><div class=\"ar\">ومستوفًى إن كان من نوعَين، نحو:<span class=\"bayt\"><span class=\"h1\">فَدَارِهِمْ مَا دُمْتَ فِيْ دَارِهِمْ<\/span><span class=\"h2\">وَأَرْضِهِمْ مَا دُمْتَ فِيْ أَرْضِهِمْ<\/span><\/span><\/div><div class=\"tr\">And it is <i>mustawfā<\/i> (fully realised) if it is from two kinds, as in:<br>So humour them (<i>dārihim<\/i>) as long as you are in their abode (<i>dārihim<\/i>), and please them (<i>arḍihim<\/i>) as long as you are in their land (<i>arḍihim<\/i>).<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Mustawfā<\/b>: the two words are of <b>different kinds<\/b>. ‎<span class=\"arin\">فَدَارِهِمْ<\/span>‎ is a verb (humour them) and ‎<span class=\"arin\">دَارِهِمْ<\/span>‎ a noun (their home); ‎<span class=\"arin\">وَأَرْضِهِمْ<\/span>‎ a verb (please them) and ‎<span class=\"arin\">أَرْضِهِمْ<\/span>‎ a noun (their land).<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 210<\/span><\/div><div class=\"ar\">ومتشابه إن كان بين لفظَين أحدهما: مركّب والآخر: مفرد، واتّفقا في الخطّ، نحو:<span class=\"bayt\"><span class=\"h1\">إِذَا مَلِكٌ لَمْ يَكُنْ ذَا هِبَةٍ<\/span><span class=\"h2\">فَدَعْهُ فَدَوْلَتُهُ ذَاهِبَةٌ<\/span><\/span><\/div><div class=\"tr\">And it is <i>mutashābih<\/i> (resembling) if it is between two words, one of which is compound and the other single, and they agree in writing, as in:<br>When a king is not one of giving (<i>dhā hibah<\/i>), leave him, for his rule is passing away (<i>dhāhibah<\/i>).<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Mutashābih<\/b>: one word is made of <b>two words joined<\/b>, the other is <b>one word<\/b>, and they are <b>written the same<\/b>. ‎<span class=\"arin\">ذَا هِبَةٍ<\/span>‎ (two words: \"one of giving\") and ‎<span class=\"arin\">ذَاهِبَةٌ<\/span>‎ (one word: \"passing away\").<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 211<\/span><\/div><div class=\"ar\">ومفروق إن لم يتّفقا، نحو:<span class=\"bayt\"><span class=\"h1\">كُلُّكُمْ قَدْ أَخَذَ الْـ<\/span><span class=\"h2\">ـجَامَ وَلاَ جَامَ لَنَا<\/span><\/span><span class=\"bayt\"><span class=\"h1\">مَا الَّذِيْ ضَرَّ مُدِيْرَ الْـ<\/span><span class=\"h2\">ـجَامِ لَوْ جَامَلَنَا<\/span><\/span><\/div><div class=\"tr\">And it is <i>mafrūq<\/i> (separated) if they do not agree [in writing], as in:<br>Every one of you has taken the cup (<i>al-jām<\/i>), and there is no cup for us (<i>lā jāma lanā<\/i>);<br>what harm would it have done the one who passes the cup round, had he treated us kindly (<i>jāmalanā<\/i>)?<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Mafrūq<\/b>: the same, but they are <b>not written the same<\/b>. ‎<span class=\"arin\">جَامَ لَنَا<\/span>‎ (two words: \"a cup for us\") and ‎<span class=\"arin\">جَامَلَنَا<\/span>‎ (one word: \"he treated us kindly\"). They sound alike but look different on the page.<\/div><div class=\"mt\"><div class=\"mth\">THE TEXT · المتن<span class=\"pg\">p. 211–212<\/span><\/div><div class=\"ar\">وغير التامّ ما اختلف في واحد من الأربعة المتقدّمة، وهو مُحرّف إن اختلف لفظاه في هيئة الحروف فقط، نحو قوله:<br>جُبَّةُ البُرْدِ جُنَّةُ البَرْدِ<\/div><div class=\"tr\">The incomplete is that which differs in one of the four preceding [matters]. It is <i>muḥarraf<\/i> (altered) if its two words differ in the form of the letters only, as in his words:<br>The cloak of wool (<i>al-burd<\/i>) is a shield against the cold (<i>al-bard<\/i>).<\/div><\/div><div class=\"ce\"><div class=\"ceh\">EXPLANATION · BY THE COMPANION<\/div><b>Incomplete jinās<\/b> (<i>ghayr tāmm<\/i>): the two words differ in <b>one<\/b> of the four points. The book names each kind.<b>Muḥarraf<\/b>: they differ <b>only in vowels<\/b>. ‎<span class=\"arin\">البُرْدِ<\/span>‎ (a woo
